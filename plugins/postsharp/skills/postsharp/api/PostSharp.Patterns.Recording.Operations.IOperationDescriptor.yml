  type: Interface
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording.Operations
  summary: >-
    Encapsulates information that allows implementations of the <xref href="PostSharp.Patterns.Recording.OperationFormatter" data-throw-if-not-resolved="false"></xref> class to provide

    a human-readable description of an <xref href="PostSharp.Patterns.Recording.Operation" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>If you implement your own <xref href="PostSharp.Patterns.Recording.OperationFormatter" data-throw-if-not-resolved="false"></xref>, you can also implement your own <xref href="PostSharp.Patterns.Recording.Operations.IOperationDescriptor" data-throw-if-not-resolved="false"></xref>
        and assign it to the <xref href="PostSharp.Patterns.Recording.RecordingScope.OperationDescriptor" data-throw-if-not-resolved="false"></xref> property of the <xref href="PostSharp.Patterns.Recording.RecordingScope" data-throw-if-not-resolved="false"></xref>
        returned by <xref href="PostSharp.Patterns.Recording.Recorder.OpenScope(PostSharp.Patterns.Recording.RecordingScopeOption)" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
