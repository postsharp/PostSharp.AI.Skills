  name: CachingServices.Invalidation
  nameWithType: CachingServices.Invalidation
  fullName: PostSharp.Patterns.Caching.CachingServices.Invalidation
  type: Class
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching
  summary: Invalidates the cache.
  remarks: >-
    <p>The <code>Invalidate</code> overloads that take a cached method and its arguments remove one method call result from the cache. They are
        the imperative alternative to the <xref href="PostSharp.Patterns.Caching.InvalidateCacheAttribute" data-throw-if-not-resolved="false"></xref> aspect.</p>
    <p>The overloads that take a dependency (a <xref href="System.String" data-throw-if-not-resolved="false"></xref>, an <xref href="PostSharp.Patterns.Caching.Dependencies.ICacheDependency" data-throw-if-not-resolved="false"></xref> or any other object that is not a delegate) remove
        all items that depend on it. They require a backend that supports dependencies.</p>
  example: []
