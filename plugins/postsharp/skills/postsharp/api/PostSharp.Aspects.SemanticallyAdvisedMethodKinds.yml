  commentId: T:PostSharp.Aspects.SemanticallyAdvisedMethodKinds
  id: SemanticallyAdvisedMethodKinds
  parent: PostSharp.Aspects
  children:
  - PostSharp.Aspects.SemanticallyAdvisedMethodKinds.All
  - PostSharp.Aspects.SemanticallyAdvisedMethodKinds.Async
