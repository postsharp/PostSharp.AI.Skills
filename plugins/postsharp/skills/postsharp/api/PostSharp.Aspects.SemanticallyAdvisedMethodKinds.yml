  name: Default
  nameWithType: SemanticallyAdvisedMethodKinds.Default
  fullName: PostSharp.Aspects.SemanticallyAdvisedMethodKinds.Default
  type: Field
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: The default behavior includes <xref href="PostSharp.Aspects.SemanticallyAdvisedMethodKinds.Async" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.SemanticallyAdvisedMethodKinds.ReturnsAwaitable" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.SemanticallyAdvisedMethodKinds.Iterator" data-throw-if-not-resolved="false"></xref>, and <xref href="PostSharp.Aspects.SemanticallyAdvisedMethodKinds.AsyncIterator" data-throw-if-not-resolved="false"></xref>, but not <xref href="PostSharp.Aspects.SemanticallyAdvisedMethodKinds.ReturnsEnumerable" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: Default = Async | ReturnsAwaitable | Iterator | AsyncIterator
    return:
      type: PostSharp.Aspects.SemanticallyAdvisedMethodKinds
    content.vb: Default = Async Or ReturnsAwaitable Or Iterator Or AsyncIterator
