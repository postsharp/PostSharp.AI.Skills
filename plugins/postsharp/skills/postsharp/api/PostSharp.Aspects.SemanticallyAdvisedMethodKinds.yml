  langs:
  - csharp
  - vb
  name: SemanticallyAdvisedMethodKinds
  nameWithType: SemanticallyAdvisedMethodKinds
  fullName: PostSharp.Aspects.SemanticallyAdvisedMethodKinds
  type: Enum
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Enumerates possible target methods for semantic advising.
  remarks: >-
    <p>When semantic advising is enabled, the advices work at the abstraction level of the original programming language.
        For example, advices are applied to the underlying async state machine instead of the public async method that starts the state machine.</p>
    <p>Use this enumeration with the <xref href="PostSharp.Aspects.OnMethodBoundaryAspect.SemanticallyAdvisedMethodKinds" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.OnExceptionAspect.SemanticallyAdvisedMethodKinds" data-throw-if-not-resolved="false"></xref>,
        and <xref href="PostSharp.Aspects.MethodInterceptionAspect.SemanticallyAdvisedMethodKinds" data-throw-if-not-resolved="false"></xref> properties. Combine values to select the kinds of methods that are advised semantically.</p>
  example: []
  syntax:
    content: >-
      [Flags]

      public enum SemanticallyAdvisedMethodKinds
    content.vb: >-
      <Flags>

      Public Enum SemanticallyAdvisedMethodKinds
  seealso:
  - linkType: HRef
    linkId: '@semantic-advising'
    altText: 'Conceptual: Semantic Advising of Iterator and Async Methods'
  attributes:
  - type: System.FlagsAttribute
    ctor: System.FlagsAttribute.#ctor
    arguments: []
