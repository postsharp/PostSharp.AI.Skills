  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics.Custom.Messages
  summary: Renders the current message into a given <xref href="PostSharp.Patterns.Diagnostics.Custom.ICustomLogRecordBuilder" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>The <xref href="PostSharp.Patterns.Diagnostics.Custom.Messages.IMessage" data-throw-if-not-resolved="false"></xref> implementation is responsible for invoking <xref href="PostSharp.Patterns.Diagnostics.Custom.ICustomLogRecordBuilder.BeginWriteItem(PostSharp.Patterns.Diagnostics.Custom.CustomLogRecordItem%2cPostSharp.Patterns.Diagnostics.Custom.CustomLogRecordTextOptions%40)" data-throw-if-not-resolved="false"></xref>
        and <xref href="PostSharp.Patterns.Diagnostics.Custom.ICustomLogRecordBuilder.EndWriteItem(PostSharp.Patterns.Diagnostics.Custom.CustomLogRecordItem)" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: void Write(ICustomLogRecordBuilder builder, CustomLogRecordItem kind)
    parameters:
    - id: builder
      type: PostSharp.Patterns.Diagnostics.Custom.ICustomLogRecordBuilder
      description: An <xref href="PostSharp.Patterns.Diagnostics.Custom.ICustomLogRecordBuilder" data-throw-if-not-resolved="false"></xref>.
    - id: kind
      type: PostSharp.Patterns.Diagnostics.Custom.CustomLogRecordItem
      description: The situation in which the message is rendered, to be passed to <xref href="PostSharp.Patterns.Diagnostics.Custom.ICustomLogRecordBuilder.BeginWriteItem(PostSharp.Patterns.Diagnostics.Custom.CustomLogRecordItem%2cPostSharp.Patterns.Diagnostics.Custom.CustomLogRecordTextOptions%40)" data-throw-if-not-resolved="false"></xref>.
