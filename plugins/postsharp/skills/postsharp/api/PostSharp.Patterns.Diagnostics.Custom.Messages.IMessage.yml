  name: IMessage
  nameWithType: IMessage
  fullName: PostSharp.Patterns.Diagnostics.Custom.Messages.IMessage
  type: Interface
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics.Custom.Messages
  summary: >-
    Represents a message that can be used with the <xref href="PostSharp.Patterns.Diagnostics.LogSource" data-throw-if-not-resolved="false"></xref> class. To create a message

    instance, you would typically use the <xref href="PostSharp.Patterns.Diagnostics.SemanticMessageBuilder" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Diagnostics.FormattedMessageBuilder" data-throw-if-not-resolved="false"></xref> class.
  remarks: >-
    <p>Implement this interface to define your own type of message when neither builder fits your needs. Prefer a value type:
        methods such as <xref href="PostSharp.Patterns.Diagnostics.Custom.LogLevelSource.Write%60%601(%60%600%40%2cPostSharp.Patterns.Diagnostics.WriteMessageOptions%40)" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Diagnostics.Custom.LogLevelSource.OpenActivity%60%601(%60%600%40%2cPostSharp.Patterns.Diagnostics.OpenActivityOptions%40)" data-throw-if-not-resolved="false"></xref>
        are generic on the message type, so a message that is a value type is not boxed.</p>
    <p>To reuse the formatting string syntax of <xref href="PostSharp.Patterns.Diagnostics.FormattedMessageBuilder" data-throw-if-not-resolved="false"></xref>, use the <xref href="PostSharp.Patterns.Diagnostics.Custom.FormattingStringParser" data-throw-if-not-resolved="false"></xref> type.</p>
  example: []
  syntax:
    content: public interface IMessage
    content.vb: Public Interface IMessage
