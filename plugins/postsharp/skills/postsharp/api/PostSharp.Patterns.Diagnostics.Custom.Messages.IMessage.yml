  fullName: PostSharp.Patterns.Diagnostics.Custom.Messages.IMessage.Write(PostSharp.Patterns.Diagnostics.Custom.ICustomLogRecordBuilder, PostSharp.Patterns.Diagnostics.Custom.CustomLogRecordItem)
  type: Method
