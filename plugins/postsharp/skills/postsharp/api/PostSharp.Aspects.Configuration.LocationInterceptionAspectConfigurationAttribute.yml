- uid: PostSharp.Aspects.Configuration.LocationInterceptionAspectConfigurationAttribute.CreateAspectConfiguration
  commentId: M:PostSharp.Aspects.Configuration.LocationInterceptionAspectConfigurationAttribute.CreateAspectConfiguration
  id: CreateAspectConfiguration
  parent: PostSharp.Aspects.Configuration.LocationInterceptionAspectConfigurationAttribute
  langs:
  - csharp
  - vb
  name: CreateAspectConfiguration()
  nameWithType: LocationInterceptionAspectConfigurationAttribute.CreateAspectConfiguration()
  fullName: PostSharp.Aspects.Configuration.LocationInterceptionAspectConfigurationAttribute.CreateAspectConfiguration()
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Configuration
  summary: >-
    Creates a concrete <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref> instance specifically for the current 

    <xref href="PostSharp.Aspects.Configuration.AspectConfigurationAttribute" data-throw-if-not-resolved="false"></xref> type.
  remarks: >-
    This method should not set up the returned <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref>. After the current method has

    returned, the <xref href="PostSharp.Aspects.Configuration.AspectConfigurationAttribute.SetAspectConfiguration(PostSharp.Aspects.Configuration.AspectConfiguration)" data-throw-if-not-resolved="false"></xref> method will be invoked, and this method is responsible

    for setting up the <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref> object.
  example: []
  syntax:
    content: protected override AspectConfiguration CreateAspectConfiguration()
    return:
      type: PostSharp.Aspects.Configuration.AspectConfiguration
      description: >-
        A new and empty instance of <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref>, whose concrete type corresponds to
                      the concrete type of the <xref href="PostSharp.Aspects.Configuration.AspectConfigurationAttribute" data-throw-if-not-resolved="false"></xref>.
    content.vb: Protected Overrides Function CreateAspectConfiguration() As AspectConfiguration
  overridden: PostSharp.Aspects.Configuration.AspectConfigurationAttribute.CreateAspectConfiguration
  overload: PostSharp.Aspects.Configuration.LocationInterceptionAspectConfigurationAttribute.CreateAspectConfiguration*
