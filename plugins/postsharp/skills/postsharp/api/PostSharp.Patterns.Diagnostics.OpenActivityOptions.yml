- uid: PostSharp.Patterns.Diagnostics.OpenActivityOptions.IsSyntheticRootId
  commentId: P:PostSharp.Patterns.Diagnostics.OpenActivityOptions.IsSyntheticRootId
  id: IsSyntheticRootId
  parent: PostSharp.Patterns.Diagnostics.OpenActivityOptions
  langs:
  - csharp
  - vb
  name: IsSyntheticRootId
  nameWithType: OpenActivityOptions.IsSyntheticRootId
  fullName: PostSharp.Patterns.Diagnostics.OpenActivityOptions.IsSyntheticRootId
  type: Property
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics
  summary: >-
    Gets or sets a value indicating whether the resulting activity is assigned a global id, irrespective of the id generation strategy.

    When this property is <code>true</code>, the resulting <xref href="PostSharp.Patterns.Diagnostics.Contexts.ILoggingContext.SyntheticId" data-throw-if-not-resolved="false"></xref> is rooted by the current activity. When this property is <code>false</code>,

    the <xref href="PostSharp.Patterns.Diagnostics.Contexts.ILoggingContext.SyntheticId" data-throw-if-not-resolved="false"></xref> may start with the id of the parent context.
  example: []
  syntax:
    content: public bool IsSyntheticRootId { readonly get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property IsSyntheticRootId As Boolean
  overload: PostSharp.Patterns.Diagnostics.OpenActivityOptions.IsSyntheticRootId*
