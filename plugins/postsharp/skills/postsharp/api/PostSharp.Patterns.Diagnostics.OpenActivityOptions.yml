  name: OpenActivityOptions(object, LogActivityKind)
  nameWithType: OpenActivityOptions.OpenActivityOptions(object, LogActivityKind)
  fullName: PostSharp.Patterns.Diagnostics.OpenActivityOptions.OpenActivityOptions(object, PostSharp.Patterns.Diagnostics.LogActivityKind)
  type: Constructor
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics
  summary: >-
    Initializes a new instance of the <xref href="PostSharp.Patterns.Diagnostics.OpenActivityOptions" data-throw-if-not-resolved="false"></xref> struct and specifies properties using an arbitrary object

    (possibly of an anonymous class).
  example: []
  syntax:
    content: public OpenActivityOptions(object data = null, LogActivityKind kind = LogActivityKind.Default)
    parameters:
    - id: data
      type: System.Object
      description: >-
        Optional. Specifies the properties of the <xref href="PostSharp.Patterns.Diagnostics.OpenActivityOptions" data-throw-if-not-resolved="false"></xref>. It is typically an instance of a well-known or anonymous CLR type.
                    The resulting <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventData" data-throw-if-not-resolved="false"></xref> has the default <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata" data-throw-if-not-resolved="false"></xref>. This means that all CLR properties are exposed
                    as logging properties, unless they are annotated with <xref href="PostSharp.Patterns.Diagnostics.Custom.LoggingPropertyOptionsAttribute" data-throw-if-not-resolved="false"></xref>.
    - id: kind
      type: PostSharp.Patterns.Diagnostics.LogActivityKind
      description: Optional. The kind of activity.
    content.vb: Public Sub New(data As Object = Nothing, kind As LogActivityKind = LogActivityKind.Default)
  overload: PostSharp.Patterns.Diagnostics.OpenActivityOptions.#ctor*
  nameWithType.vb: OpenActivityOptions.New(Object, LogActivityKind)
  fullName.vb: PostSharp.Patterns.Diagnostics.OpenActivityOptions.New(Object, PostSharp.Patterns.Diagnostics.LogActivityKind)
  name.vb: New(Object, LogActivityKind)
