- uid: PostSharp.Patterns.Diagnostics.OpenActivityOptions.SyntheticParentId
  commentId: P:PostSharp.Patterns.Diagnostics.OpenActivityOptions.SyntheticParentId
  id: SyntheticParentId
  parent: PostSharp.Patterns.Diagnostics.OpenActivityOptions
  langs:
  - csharp
  - vb
  name: SyntheticParentId
  nameWithType: OpenActivityOptions.SyntheticParentId
  fullName: PostSharp.Patterns.Diagnostics.OpenActivityOptions.SyntheticParentId
  type: Property
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics
  summary: >-
    Gets or sets the parent identifier of the synthetic identifier.

    When this property is set to a non-null value, the <xref href="PostSharp.Patterns.Diagnostics.Contexts.ILoggingContext.SyntheticId" data-throw-if-not-resolved="false"></xref> property shall use this

    property as the parent identifier, instead of recursively building the synthetic identifier based on the parent context.
  remarks: >-
    <p>Set this property when you open the activity that processes a request received from another process,
        passing the identifier of the calling activity that the caller sent with the request.</p>
  example: []
  syntax:
    content: public string SyntheticParentId { readonly get; set; }
    parameters: []
    return:
      type: System.String
    content.vb: Public Property SyntheticParentId As String
  overload: PostSharp.Patterns.Diagnostics.OpenActivityOptions.SyntheticParentId*
  seealso:
  - linkType: HRef
    linkId: '@distributed-logging'
    altText: 'Conceptual: Logging in a Distributed System'
