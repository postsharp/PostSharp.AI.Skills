  name: OpenActivityOptions
  nameWithType: OpenActivityOptions
  fullName: PostSharp.Patterns.Diagnostics.OpenActivityOptions
  type: Struct
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics
  summary: Represents the argument of the <xref href="PostSharp.Patterns.Diagnostics.Custom.LogLevelSource.OpenActivity%60%601(%60%600%40%2cPostSharp.Patterns.Diagnostics.OpenActivityOptions%40)" data-throw-if-not-resolved="false"></xref> method.
  remarks: >-
    <p>To open a transaction that the logging policies of the configuration file can match, create the options with the
        <xref href="PostSharp.Patterns.Diagnostics.LogActivityKind.Transaction" data-throw-if-not-resolved="false"></xref> kind and a <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventData" data-throw-if-not-resolved="false"></xref> whose <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata" data-throw-if-not-resolved="false"></xref> exposes the expression model
        of the transaction, then call <xref href="PostSharp.Patterns.Diagnostics.LogSource.ApplyTransactionRequirements(PostSharp.Patterns.Diagnostics.OpenActivityOptions%40)" data-throw-if-not-resolved="false"></xref> before opening the activity.
        To bypass the policies, set the <xref href="PostSharp.Patterns.Diagnostics.OpenActivityOptions.TransactionRequirement" data-throw-if-not-resolved="false"></xref> property directly.</p>
  example: []
  syntax:
    content: public struct OpenActivityOptions
    content.vb: Public Structure OpenActivityOptions
