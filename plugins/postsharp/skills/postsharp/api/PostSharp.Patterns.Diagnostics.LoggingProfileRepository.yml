  summary: >-
    Provides access to logging profiles (<xref href="PostSharp.Patterns.Diagnostics.LoggingProfile" data-throw-if-not-resolved="false"></xref>) at run time. This class is exposed by the

    <xref href="PostSharp.Patterns.Diagnostics.LoggingServices.Profiles" data-throw-if-not-resolved="false"></xref> property. Note that each assembly of the <xref href="System.AppDomain" data-throw-if-not-resolved="false"></xref>

    contains its own copy of each <xref href="PostSharp.Patterns.Diagnostics.LoggingProfile" data-throw-if-not-resolved="false"></xref> used in this assembly, and each copy

    may be different, even if they have the same name.
