  namespace: PostSharp.Constraints
  summary: Implementation of <xref href="PostSharp.Constraints.IReferentialConstraint" data-throw-if-not-resolved="false"></xref> based on <xref href="PostSharp.Extensibility.MulticastAttribute" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>A referential constraint validates how a declaration is used. It is validated when the assembly that contains
        the target declaration is processed and, if the target declaration is public, when each assembly that references
        it is processed by PostSharp. The <code>assembly</code> parameter of <xref href="PostSharp.Constraints.ReferentialConstraint.ValidateCode(System.Object%2cSystem.Reflection.Assembly)" data-throw-if-not-resolved="false"></xref> is the assembly being processed.</p>
    <p>Use <xref href="PostSharp.Reflection.ReflectionSearch" data-throw-if-not-resolved="false"></xref> to find the references to the target declaration, and
        <xref href="PostSharp.Extensibility.Message" data-throw-if-not-resolved="false"></xref> to emit warnings or errors. To validate the declaration itself, use <xref href="PostSharp.Constraints.ScalarConstraint" data-throw-if-not-resolved="false"></xref> instead.</p>
  example: []
