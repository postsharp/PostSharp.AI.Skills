  langs:
  - csharp
  - vb
  name: LogLevelSource
  nameWithType: LogLevelSource
  fullName: PostSharp.Patterns.Diagnostics.Custom.LogLevelSource
  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics.Custom
  summary: >-
    A facade for a <xref href="PostSharp.Patterns.Diagnostics.LogSource" data-throw-if-not-resolved="false"></xref> constrained to a specific <xref href="PostSharp.Patterns.Diagnostics.LogLevel" data-throw-if-not-resolved="false"></xref>.

    Instances of the <xref href="PostSharp.Patterns.Diagnostics.Custom.LogLevelSource" data-throw-if-not-resolved="false"></xref> class are exposed as properties of the <xref href="PostSharp.Patterns.Diagnostics.LogSource" data-throw-if-not-resolved="false"></xref>

    class, for example <xref href="PostSharp.Patterns.Diagnostics.LogSource.Debug" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Diagnostics.LogSource.Error" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>Use <xref href="PostSharp.Patterns.Diagnostics.Custom.LogLevelSource.Write%60%601(%60%600%40%2cPostSharp.Patterns.Diagnostics.WriteMessageOptions%40)" data-throw-if-not-resolved="false"></xref> to write a message, and <xref href="PostSharp.Patterns.Diagnostics.Custom.LogLevelSource.OpenActivity%60%601(%60%600%40%2cPostSharp.Patterns.Diagnostics.OpenActivityOptions%40)" data-throw-if-not-resolved="false"></xref> to open an activity
        that you close explicitly. The <xref href="PostSharp.Patterns.Diagnostics.Custom.LogLevelSource.LogActivity%60%601(%60%600%40%2cSystem.Action%2cPostSharp.Patterns.Diagnostics.OpenActivityOptions%40)" data-throw-if-not-resolved="false"></xref>
        and <xref href="PostSharp.Patterns.Diagnostics.Custom.LogLevelSource.LogActivityAsync%60%601(%60%600%40%2cSystem.Func%7bSystem.Threading.Tasks.Task%7d%2cPostSharp.Patterns.Diagnostics.OpenActivityOptions%40)" data-throw-if-not-resolved="false"></xref> methods and their overloads execute a delegate within an activity and close it for you, but the delegate
        is typically a closure that is allocated even when logging is disabled.</p>
    <p>When evaluating the arguments of a message is expensive, use the <xref href="PostSharp.Patterns.Diagnostics.Custom.LogLevelSource.EnabledOrNull" data-throw-if-not-resolved="false"></xref> property with the <code>?.</code> operator, so that
        the arguments are evaluated only when the <xref href="PostSharp.Patterns.Diagnostics.Custom.LogLevelSource.Level" data-throw-if-not-resolved="false"></xref> is enabled.</p>
    <p>When PostSharp processes a project that uses this class, it adds caller information to the calls and instruments <code>await</code> expressions.</p>
  example: []
  syntax:
    content: >-
      [RequirePostSharp("PostSharp.Patterns.Common.Weaver", "AddCallerInfoTask", AnyTypeReference = true)]

      [RequirePostSharp(typeof(AwaitInstrumentationAspectProvider), AnyTypeReference = true)]

      public sealed class LogLevelSource
    content.vb: >-
      <RequirePostSharp("PostSharp.Patterns.Common.Weaver", "AddCallerInfoTask", AnyTypeReference:=True)>

      <RequirePostSharp(GetType(AwaitInstrumentationAspectProvider), AnyTypeReference:=True)>

      Public NotInheritable Class LogLevelSource
