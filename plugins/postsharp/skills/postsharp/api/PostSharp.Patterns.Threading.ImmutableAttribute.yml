  type: Class
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Custom attribute that, when applied to a class, applies the <xref href="PostSharp.Patterns.Threading.Models.ImmutableThreadingModel" data-throw-if-not-resolved="false"></xref> to this class.

    The aspect introduces the <xref href="PostSharp.Patterns.Threading.IImmutable" data-throw-if-not-resolved="false"></xref> interface into the target class. Immutable objects cannot

    be modified after the constructor exits.
  remarks: >-
    <p>The object becomes read-only when the constructor of the most derived class has completed, so constructors of base classes and methods
        called by constructors can still set fields. Accessing the object from a different thread than the one that created it before the constructor
        has completed results in a <xref href="PostSharp.Patterns.Threading.ThreadMismatchException" data-throw-if-not-resolved="false"></xref>. Modifying the object after the constructor has completed results in an
        <xref href="PostSharp.Patterns.Threading.ObjectReadOnlyException" data-throw-if-not-resolved="false"></xref>.</p>
    <p>The aspect implicitly adds the <xref href="PostSharp.Patterns.Model.AggregatableAttribute" data-throw-if-not-resolved="false"></xref> aspect, so you can build immutable object trees. Children must be
        immutable or freezable; freezable children are frozen when the constructor of the parent completes. When the object must be modified after
        its constructor, use <xref href="PostSharp.Patterns.Threading.FreezableAttribute" data-throw-if-not-resolved="false"></xref> instead.</p>
  example: []
  syntax:
    content: >-
      [IntroduceInterface(typeof(IImmutable), OverrideAction = InterfaceOverrideAction.Ignore, LinesOfCodeAvoided = 0)]

      [Metric("UsedFeatures", "PostSharp.Patterns.Threading.Immutable")]

      [Serializer(typeof(ImmutableAttribute.Serializer))]

