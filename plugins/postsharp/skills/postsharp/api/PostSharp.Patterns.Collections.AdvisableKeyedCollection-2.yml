  name: AdvisableKeyedCollection<TKey, TItem>
  nameWithType: AdvisableKeyedCollection<TKey, TItem>
  fullName: PostSharp.Patterns.Collections.AdvisableKeyedCollection<TKey, TItem>
  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Collections
  summary: Provides the abstract base class for a keyed collection, similar to <xref href="System.Collections.ObjectModel.KeyedCollection%602" data-throw-if-not-resolved="false"></xref>, into which advices can be injected dynamically.
  remarks: >-
    <p>The API of this class is compatible with the <xref href="System.Collections.ObjectModel.KeyedCollection%602" data-throw-if-not-resolved="false"></xref> class.</p>

    <p>To learn how to extend this class, see the <xref href="PostSharp.Patterns.Collections.AdvisableCollection%601" data-throw-if-not-resolved="false"></xref> class documentation.</p>

    <p>Use this class instead of <xref href="System.Collections.ObjectModel.KeyedCollection%602" data-throw-if-not-resolved="false"></xref> in the child properties of classes that use patterns such as Aggregatable, Recordable
        or threading models, which inject their behavior into advisable collections at run time.</p>
  example: []
  syntax:
    content: 'public abstract class AdvisableKeyedCollection<TKey, TItem> : AdvisableCollection<TItem>, ISerializable, IDeserializationCallback, IList<TItem>, ICollection<TItem>, IList, IDynamicallyAdvisableCollection, ICollection, IDynamicallyAdvisable, IQueryInterface, INotifyPropertyChanged, IReadOnlyList<TItem>, IReadOnlyCollection<TItem>, IEnumerable<TItem>, IEnumerable, INotifyCollectionChanged'
    typeParameters:
    - id: TKey
      description: The type of keys in the collection.
    - id: TItem
      description: The type of values in the collection.
    content.vb: Public MustInherit Class AdvisableKeyedCollection(Of TKey, TItem) Inherits AdvisableCollection(Of TItem) Implements ISerializable, IDeserializationCallback, IList(Of TItem), ICollection(Of TItem), IList, IDynamicallyAdvisableCollection, ICollection, IDynamicallyAdvisable, IQueryInterface, INotifyPropertyChanged, IReadOnlyList(Of TItem), IReadOnlyCollection(Of TItem), IEnumerable(Of TItem), IEnumerable, INotifyCollectionChanged
