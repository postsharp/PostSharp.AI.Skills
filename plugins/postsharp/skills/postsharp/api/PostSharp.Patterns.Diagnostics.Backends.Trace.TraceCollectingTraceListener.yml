  namespace: PostSharp.Patterns.Diagnostics.Backends.Trace
  summary: A trace listener that sends all events to PostSharp as the log source "TraceCollectingTraceListener".
  remarks: >-
    <p>Use <xref href="PostSharp.Patterns.Diagnostics.Backends.Trace.TraceCollectingTraceListener.RedirectLoggingToPostSharp" data-throw-if-not-resolved="false"></xref> to install this listener after you have added your output listeners to

    <xref href="System.Diagnostics.Trace.Listeners" data-throw-if-not-resolved="false"></xref>. Pass the listeners that the method returns to the

    <xref href="PostSharp.Patterns.Diagnostics.Backends.Trace.TraceLoggingBackend.%23ctor(System.Collections.Generic.IEnumerable%7bSystem.Diagnostics.TraceListener%7d%2cSystem.String)" data-throw-if-not-resolved="false"></xref> constructor, so that manual and automatic log records

    reach the same listeners through the same backend and share the same indentation.</p>
  example: []
  syntax:
    content: 'public class TraceCollectingTraceListener : BaseCollectingTraceListener, IDisposable'
    content.vb: Public Class TraceCollectingTraceListener Inherits BaseCollectingTraceListener Implements IDisposable
