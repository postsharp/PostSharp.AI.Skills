  - vb
  name: RedirectLoggingToPostSharp()
  nameWithType: TraceCollectingTraceListener.RedirectLoggingToPostSharp()
  fullName: PostSharp.Patterns.Diagnostics.Backends.Trace.TraceCollectingTraceListener.RedirectLoggingToPostSharp()
  type: Method
  assemblies:
  - PostSharp.Patterns.Diagnostics.Backends.Tracing
  namespace: PostSharp.Patterns.Diagnostics.Backends.Trace
  summary: >-
    Redirects all <xref href="System.Diagnostics.Trace" data-throw-if-not-resolved="false"></xref> events to PostSharp and clears all other listeners from <xref href="System.Diagnostics.Trace.Listeners" data-throw-if-not-resolved="false"></xref>.

    The method returns the listeners that it cleared.
  example: []
  syntax:
    content: public static List<TraceListener> RedirectLoggingToPostSharp()
    return:
      type: System.Collections.Generic.List{System.Diagnostics.TraceListener}
      description: The listeners that were previously in the <xref href="System.Diagnostics.Trace.Listeners" data-throw-if-not-resolved="false"></xref> collection, excluding the new <xref href="PostSharp.Patterns.Diagnostics.Backends.Trace.TraceCollectingTraceListener" data-throw-if-not-resolved="false"></xref>.
    content.vb: Public Shared Function RedirectLoggingToPostSharp() As List(Of TraceListener)
  overload: PostSharp.Patterns.Diagnostics.Backends.Trace.TraceCollectingTraceListener.RedirectLoggingToPostSharp*
