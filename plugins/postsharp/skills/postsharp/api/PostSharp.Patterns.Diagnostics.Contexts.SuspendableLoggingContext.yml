  type: Method
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Contexts
  summary: >-
    Resumes the current context. Typically called when the state machine resumes execution, when the wait dependency

    is satisfied (in case of async methods) or when the <xref href="System.Collections.IEnumerator.MoveNext" data-throw-if-not-resolved="false"></xref> method is called (in case of iterators).
  example: []
  syntax:
    content: public virtual void Resume()
    content.vb: Public Overridable Sub [Resume]()
  overload: PostSharp.Patterns.Diagnostics.Contexts.SuspendableLoggingContext.Resume*
- uid: PostSharp.Patterns.Diagnostics.Contexts.SuspendableLoggingContext.Suspend
  commentId: M:PostSharp.Patterns.Diagnostics.Contexts.SuspendableLoggingContext.Suspend
  id: Suspend
  parent: PostSharp.Patterns.Diagnostics.Contexts.SuspendableLoggingContext
  langs:
  - csharp
  - vb
  name: Suspend()
  nameWithType: SuspendableLoggingContext.Suspend()
  fullName: PostSharp.Patterns.Diagnostics.Contexts.SuspendableLoggingContext.Suspend()
  type: Method
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Contexts
  summary: >-
    Suspends the current context. Typically called when starting to wait for a wait dependency (the operand of the <code>await</code> operator

    in case of async methods), or after the <xref href="System.Collections.IEnumerator.MoveNext" data-throw-if-not-resolved="false"></xref> method (in case of iterators).
  remarks: >-
    <p>In case of iterators, the <xref href="PostSharp.Patterns.Diagnostics.Contexts.SuspendableLoggingContext.Suspend" data-throw-if-not-resolved="false"></xref> method is invoked only when <xref href="System.Collections.IEnumerator.MoveNext" data-throw-if-not-resolved="false"></xref> returns
        <code>true</code>. Otherwise, the <xref href="PostSharp.Patterns.Diagnostics.Contexts.SuspendableLoggingContext.Dispose(System.Boolean)" data-throw-if-not-resolved="false"></xref> method is invoked.</p>
  example: []
  syntax:
    content: public virtual void Suspend()
    content.vb: Public Overridable Sub Suspend()
  overload: PostSharp.Patterns.Diagnostics.Contexts.SuspendableLoggingContext.Suspend*
