  name: LoggingPropertyOptionsAttribute
  nameWithType: LoggingPropertyOptionsAttribute
  fullName: PostSharp.Patterns.Diagnostics.Custom.LoggingPropertyOptionsAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics.Custom
  summary: >-
    Specifies the options (<xref href="PostSharp.Patterns.Diagnostics.Custom.LoggingPropertyOptions" data-throw-if-not-resolved="false"></xref>) of a logging property that is

    expressed as a public property of a CLR type.
  remarks: >-
    <p>Add this attribute to the properties of a type whose instances you pass as the logging properties of a message or an activity, for instance
        to make a property inherited by the child activities and messages, which you cannot do with an anonymous type. Properties without the attribute
        are not rendered, not inherited, and not carried across processes. The attribute is honored by the default <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata" data-throw-if-not-resolved="false"></xref>;
        a custom <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata" data-throw-if-not-resolved="false"></xref> determines the options of its properties itself.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Property)]

      public sealed class LoggingPropertyOptionsAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Property)>

      Public NotInheritable Class LoggingPropertyOptionsAttribute Inherits Attribute
