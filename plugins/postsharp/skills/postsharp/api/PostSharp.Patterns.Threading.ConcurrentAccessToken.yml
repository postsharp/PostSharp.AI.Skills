  summary: >-
    A token returned by the <xref href="PostSharp.Patterns.Threading.IConcurrencyController.AcquireAccess(PostSharp.Patterns.Model.ObjectAccessLevel%2cPostSharp.Patterns.Threading.ConcurrentAccessToken%40)" data-throw-if-not-resolved="false"></xref> method. This token is intended to be used in a <code>using</code> block.

    Consumers of this method must call <xref href="PostSharp.Patterns.Threading.ConcurrentAccessToken.Complete" data-throw-if-not-resolved="false"></xref> on success, and <xref href="PostSharp.Patterns.Threading.ConcurrentAccessToken.Dispose" data-throw-if-not-resolved="false"></xref> on exception.
