  nameWithType: ConcurrentAccessToken.Dispose()
  fullName: PostSharp.Patterns.Threading.ConcurrentAccessToken.Dispose()
  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Indicates that the operation requiring access on an object has completed. If the <xref href="PostSharp.Patterns.Threading.ConcurrentAccessToken.Complete" data-throw-if-not-resolved="false"></xref> method is

    not invoked before the <xref href="PostSharp.Patterns.Threading.ConcurrentAccessToken.Dispose" data-throw-if-not-resolved="false"></xref> method, the transaction is considered to have failed. Current threading

    models do not support transactions. Therefore, this semantic is currently unused, but it may be used in the future.
