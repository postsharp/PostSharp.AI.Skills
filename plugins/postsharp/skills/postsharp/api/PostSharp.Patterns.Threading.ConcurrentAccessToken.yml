  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Threading
  summary: Determines whether the current <xref href="PostSharp.Patterns.Threading.ConcurrentAccessToken" data-throw-if-not-resolved="false"></xref> is valid in the current context.
  example: []
  syntax:
    content: public bool CheckContext(bool canBeParentContext = false)
    parameters:
    - id: canBeParentContext
      type: System.Boolean
      description: >-
        <code>true</code> if the current <xref href="PostSharp.Patterns.Threading.ConcurrentAccessToken" data-throw-if-not-resolved="false"></xref> can be the token of a parent token,
            <code>false</code> if it must be the token of the current context.
    return:
      type: System.Boolean
      description: <code>true</code> if the current <xref href="PostSharp.Patterns.Threading.ConcurrentAccessToken" data-throw-if-not-resolved="false"></xref> is valid for the current context, otherwise <code>false</code>.
