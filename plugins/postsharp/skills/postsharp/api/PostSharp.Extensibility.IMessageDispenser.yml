  name: IMessageDispenser
  nameWithType: IMessageDispenser
  fullName: PostSharp.Extensibility.IMessageDispenser
  type: Interface
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: Provides a method that returns a text given its key.
  remarks: >-
    <p>A message dispenser supplies the message texts of a <xref href="PostSharp.Extensibility.MessageSource" data-throw-if-not-resolved="false"></xref>, so that all the texts of a component are
        stored in a single place. <xref href="PostSharp.Extensibility.MessageSource" data-throw-if-not-resolved="false"></xref> calls <xref href="PostSharp.Extensibility.IMessageDispenser.GetMessage(System.String)" data-throw-if-not-resolved="false"></xref> with the message identifier to get the formatting string
        of the message text, and with the message identifier followed by <code>?</code> to get the help link. Return <code>null</code> when the
        key is unknown.</p>
    <p>Derive from <xref href="PostSharp.Extensibility.MessageDispenser" data-throw-if-not-resolved="false"></xref> instead of implementing this interface from scratch when your message identifiers
        consist of a prefix followed by a number.</p>
