  type: Interface
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching.Resilience
  summary: >-
    Defines a <xref href="PostSharp.Patterns.Caching.Resilience.IRetryPolicy.TryAsync(PostSharp.Patterns.Caching.Resilience.OperationKind%2cSystem.Int32%2cSystem.Exception%2cSystem.Object%40%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> method that determines whether a Redis transaction or operation should be retried if it fails.

    The default implementation is <xref href="PostSharp.Patterns.Caching.Resilience.RetryPolicy" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>The Redis backend takes its retry policies from the <code>TransactionRetryPolicy</code>, <code>BackgroundTasksRetryPolicy</code> and
        <code>BackgroundRecoveryRetryPolicy</code> properties of its configuration. <xref href="PostSharp.Patterns.Caching.Resilience.RetryPolicy" data-throw-if-not-resolved="false"></xref> implements an exponential back-off with jitter.</p>
