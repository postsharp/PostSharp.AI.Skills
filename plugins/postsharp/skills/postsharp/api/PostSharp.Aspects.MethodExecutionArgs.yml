- uid: PostSharp.Aspects.MethodExecutionArgs.Exception
  commentId: P:PostSharp.Aspects.MethodExecutionArgs.Exception
  id: Exception
  parent: PostSharp.Aspects.MethodExecutionArgs
  langs:
  - csharp
  - vb
  name: Exception
  nameWithType: MethodExecutionArgs.Exception
  fullName: PostSharp.Aspects.MethodExecutionArgs.Exception
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Gets or sets the exception thrown by the target method.
  remarks: >-
    <p>This property is only available inside the <xref href="PostSharp.Aspects.IOnMethodBoundaryAspect.OnException(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.IOnExceptionAspect.OnException(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref> advices.</p>

    <p>You can replace the exception by setting this property and also setting <xref href="PostSharp.Aspects.MethodExecutionArgs.FlowBehavior" data-throw-if-not-resolved="false"></xref> to <xref href="PostSharp.Aspects.FlowBehavior.ThrowException" data-throw-if-not-resolved="false"></xref>. You can also throw a new exception from the advice if you need to replace the current exception.</p>
  example: []
  syntax:
    content: public Exception Exception { get; set; }
    parameters: []
    return:
      type: System.Exception
      description: An <xref href="PostSharp.Aspects.MethodExecutionArgs.Exception" data-throw-if-not-resolved="false"></xref>, or <code>null</code> if the method is exiting normally.
    content.vb: Public Property Exception As Exception
  overload: PostSharp.Aspects.MethodExecutionArgs.Exception*
- uid: PostSharp.Aspects.MethodExecutionArgs.FlowBehavior
  commentId: P:PostSharp.Aspects.MethodExecutionArgs.FlowBehavior
  id: FlowBehavior
  parent: PostSharp.Aspects.MethodExecutionArgs
  langs:
  - csharp
  - vb
  name: FlowBehavior
  nameWithType: MethodExecutionArgs.FlowBehavior
  fullName: PostSharp.Aspects.MethodExecutionArgs.FlowBehavior
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Gets or sets the control flow of the target method once the advice is exited.
  remarks: >-
    <div class="NOTE"><h5>note</h5><p>
      As a result of weaving optimizations, the value of this property may appear as <code>null</code> in a debugger.
      If you need to inspect the value at runtime, consider disabling aspect optimizations in the debug build configuration.
    </p></div>
               When this advice is applied to a state machine, only limited flow behavior options are available. See the documentation
            of <xref href="PostSharp.Aspects.FlowBehavior" data-throw-if-not-resolved="false"></xref> for details.
  example: []
  syntax:
    content: public FlowBehavior FlowBehavior { get; set; }
    parameters: []
    return:
      type: PostSharp.Aspects.FlowBehavior
    content.vb: Public Property FlowBehavior As FlowBehavior
  overload: PostSharp.Aspects.MethodExecutionArgs.FlowBehavior*
- uid: PostSharp.Aspects.MethodExecutionArgs.MethodExecutionTag
  commentId: P:PostSharp.Aspects.MethodExecutionArgs.MethodExecutionTag
  id: MethodExecutionTag
  parent: PostSharp.Aspects.MethodExecutionArgs
  langs:
  - csharp
  - vb
  name: MethodExecutionTag
  nameWithType: MethodExecutionArgs.MethodExecutionTag
  fullName: PostSharp.Aspects.MethodExecutionArgs.MethodExecutionTag
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Gets or sets user-defined state information whose lifetime is linked to the

    current method execution. Aspects derived from <xref href="PostSharp.Aspects.IOnMethodBoundaryAspect" data-throw-if-not-resolved="false"></xref>

    should use this property to save state information between

    different events (<xref href="PostSharp.Aspects.IOnMethodBoundaryAspect.OnEntry(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>,

    <xref href="PostSharp.Aspects.IOnMethodBoundaryAspect.OnExit(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.IOnMethodBoundaryAspect.OnException(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>).
  remarks: >-
    <div class="NOTE"><h5>note</h5><p>
      As a result of weaving optimizations, the value of this property may appear as <code>null</code> in a debugger.
      If you need to inspect the value at runtime, consider disabling aspect optimizations in the debug build configuration.
    </p></div>
  example: []
  syntax:
    content: public object MethodExecutionTag { get; set; }
    parameters: []
    return:
      type: System.Object
    content.vb: Public Property MethodExecutionTag As Object
  overload: PostSharp.Aspects.MethodExecutionArgs.MethodExecutionTag*
