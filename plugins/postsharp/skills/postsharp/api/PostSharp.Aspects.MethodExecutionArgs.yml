- uid: PostSharp.Aspects.MethodExecutionArgs.Method
  commentId: P:PostSharp.Aspects.MethodExecutionArgs.Method
  id: Method
  parent: PostSharp.Aspects.MethodExecutionArgs
  langs:
  - csharp
  - vb
  name: Method
  nameWithType: MethodExecutionArgs.Method
  fullName: PostSharp.Aspects.MethodExecutionArgs.Method
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Gets the method being executed.
  remarks: >-
    <p>If the executed method is generic or if its declaring type is generic,
                the current property contains the generic instance being executed.</p>
        <div class="NOTE"><h5>note</h5><p>
                Using this property causes the aspect weaver to generate code that has non-trivial runtime overhead. Avoid using
                this property whenever possible. One possible solution is to use compile-time initialization of
                aspect instances and to make use of reflection only at build time. See <xref href="PostSharp.Aspects.MethodLevelAspect.CompileTimeInitialize(System.Reflection.MethodBase%2cPostSharp.Aspects.AspectInfo)" data-throw-if-not-resolved="false"></xref>
                for details.
              </p></div>
        <div class="NOTE"><h5>note</h5><p>
      As a result of weaving optimizations, the value of this property may appear as <code>null</code> in a debugger.
      If you need to inspect the value at runtime, consider disabling aspect optimizations in the debug build configuration.
    </p></div>
  example: []
  syntax:
    content: public MethodBase Method { get; set; }
    parameters: []
    return:
      type: System.Reflection.MethodBase
    content.vb: Public Property Method As MethodBase
  overload: PostSharp.Aspects.MethodExecutionArgs.Method*
  seealso:
  - linkId: PostSharp.Aspects.MethodLevelAspect.CompileTimeInitialize(System.Reflection.MethodBase,PostSharp.Aspects.AspectInfo)
    commentId: M:PostSharp.Aspects.MethodLevelAspect.CompileTimeInitialize(System.Reflection.MethodBase,PostSharp.Aspects.AspectInfo)
