- uid: PostSharp.Aspects.MethodExecutionArgs.ReturnValue
  commentId: P:PostSharp.Aspects.MethodExecutionArgs.ReturnValue
  id: ReturnValue
  parent: PostSharp.Aspects.MethodExecutionArgs
  langs:
  - csharp
  - vb
  name: ReturnValue
  nameWithType: MethodExecutionArgs.ReturnValue
  fullName: PostSharp.Aspects.MethodExecutionArgs.ReturnValue
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Gets or sets the method return value.
  remarks: >-
    <p>
                You can modify the return value only when the join point is located
                after a method execution (<xref href="PostSharp.Aspects.OnMethodBoundaryAspect.OnSuccess(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>,
                <xref href="PostSharp.Aspects.OnMethodBoundaryAspect.OnException(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Aspects.OnMethodBoundaryAspect.OnExit(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>),
                or when you force the method to exit using the <xref href="PostSharp.Aspects.MethodExecutionArgs.FlowBehavior" data-throw-if-not-resolved="false"></xref> property.
              </p>
        <div class="NOTE"><h5>note</h5><p>
      As a result of weaving optimizations, the value of this property may appear as <code>null</code> in a debugger.
      If you need to inspect the value at runtime, consider disabling aspect optimizations in the debug build configuration.
    </p></div>
  example: []
  syntax:
    content: public object ReturnValue { get; set; }
    parameters: []
    return:
      type: System.Object
    content.vb: Public Property ReturnValue As Object
  overload: PostSharp.Aspects.MethodExecutionArgs.ReturnValue*
- uid: PostSharp.Aspects.MethodExecutionArgs.YieldValue
