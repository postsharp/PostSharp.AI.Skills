  nameWithType: AdviceDependencyAttribute
  fullName: PostSharp.Aspects.Dependencies.AdviceDependencyAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Dependencies
  summary: Specifies an aspect dependency matching an advice of the same aspect instance.
  remarks: >-
    Apply this custom attribute to an advice method of a composite aspect to order this advice with respect to another advice

    of the same aspect instance, designated by the name of its method. To order an aspect or advice with respect to other aspects,

    use the other custom attributes derived from <xref href="PostSharp.Aspects.Dependencies.AspectDependencyAttribute" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: 'public sealed class AdviceDependencyAttribute : AspectDependencyAttribute'
