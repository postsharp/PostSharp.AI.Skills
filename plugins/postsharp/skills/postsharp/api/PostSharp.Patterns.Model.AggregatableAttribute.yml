  summary: Custom attribute that, when applied to a class, enables instances of this class to be involved in a parent-child relationship.
  remarks: >-
    <p>This aspect implements the <xref href="PostSharp.Patterns.Model.IAggregatable" data-throw-if-not-resolved="false"></xref> interface, which exposes members such as <xref href="PostSharp.Patterns.Model.IAggregatable.VisitChildren(PostSharp.Patterns.Model.ChildVisitor%2cPostSharp.Patterns.Model.ChildVisitorOptions%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>
        and <xref href="PostSharp.Patterns.Model.IAggregatable.Parent" data-throw-if-not-resolved="false"></xref>.</p>
    <p>The <xref href="PostSharp.Patterns.Model.AggregatableAttribute" data-throw-if-not-resolved="false"></xref> aspect is implicitly used by several other aspects, including all threading models.</p>

    <p>When a class has the <xref href="PostSharp.Patterns.Model.AggregatableAttribute" data-throw-if-not-resolved="false"></xref> aspect, its reference-type fields and automatic properties must be annotated
        with one of the following attributes: <xref href="PostSharp.Patterns.Model.ChildAttribute" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Patterns.Model.ReferenceAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Model.ParentAttribute" data-throw-if-not-resolved="false"></xref>.
        A field that cannot carry a custom attribute, such as a field generated by a designer, can instead be classified by a <xref href="PostSharp.Patterns.Model.TypeAdapters.FieldRule" data-throw-if-not-resolved="false"></xref>
        registered with the <xref href="PostSharp.Patterns.Model.TypeAdapters.RegisterFieldRuleAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.</p>
    <p>For the items of a child collection to become children of the parent, assign an advisable collection, such as
        <xref href="PostSharp.Patterns.Collections.AdvisableCollection%601" data-throw-if-not-resolved="false"></xref>, or an immutable collection to the child field or property.
        Standard .NET collections cannot notify the parent when items are added or removed.</p>
    <p>
        Target classes can customize the <xref href="PostSharp.Patterns.Model.AggregatableAttribute" data-throw-if-not-resolved="false"></xref> aspect by implementing one or more of the members documented in
        the <xref href="PostSharp.Patterns.Model.AggregatableAttributeTargetClass" data-throw-if-not-resolved="false"></xref> class.
        </p>
  example: []
  syntax:
    content: >-
      [IntroduceInterface(typeof(IAttachable), OverrideAction = InterfaceOverrideAction.Ignore, AncestorOverrideAction = InterfaceOverrideAction.Ignore, LinesOfCodeAvoided = 0)]

      [MulticastAttributeUsage(MulticastTargets.Class, TargetTypeAttributes = MulticastAttributes.UserGenerated)]

      [AspectTypeDependency(AspectDependencyAction.Conflict, typeof(AggregatableAttribute))]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Tracing")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "Validation")]

      [Serializer(typeof(AggregatableAttribute.Serializer))]

      public sealed class AggregatableAttribute : InstanceLevelAspect, ITypeLevelAspect, ITypeLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, ICloneAwareAspect, IInstanceScopedAspect, IAttachable, IAggregatable, IAdviceProvider, IAspectProvider, IAspect, IService, IDeserializationCallback
    content.vb: >-
      <IntroduceInterface(GetType(IAttachable), OverrideAction:=InterfaceOverrideAction.Ignore, AncestorOverrideAction:=InterfaceOverrideAction.Ignore, LinesOfCodeAvoided:=0)>

      <MulticastAttributeUsage(MulticastTargets.Class, TargetTypeAttributes:=MulticastAttributes.UserGenerated)>

      <AspectTypeDependency(AspectDependencyAction.Conflict, GetType(AggregatableAttribute))>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Tracing")>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "Validation")>

      <Serializer(GetType(AggregatableAttribute.Serializer))>

      Public NotInheritable Class AggregatableAttribute Inherits InstanceLevelAspect Implements ITypeLevelAspect, ITypeLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, ICloneAwareAspect, IInstanceScopedAspect, IAttachable, IAggregatable, IAdviceProvider, IAspectProvider, IAspect, IService, IDeserializationCallback
