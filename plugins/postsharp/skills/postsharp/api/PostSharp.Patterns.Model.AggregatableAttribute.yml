- uid: PostSharp.Patterns.Model.AggregatableAttribute.DefaultItemRelationship
  commentId: P:PostSharp.Patterns.Model.AggregatableAttribute.DefaultItemRelationship
  id: DefaultItemRelationship
  parent: PostSharp.Patterns.Model.AggregatableAttribute
  langs:
  - csharp
  - vb
  name: DefaultItemRelationship
  nameWithType: AggregatableAttribute.DefaultItemRelationship
  fullName: PostSharp.Patterns.Model.AggregatableAttribute.DefaultItemRelationship
  type: Property
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: Gets or sets the default kind of relationship for collection items.
  remarks: >-
    <p>
        If the target class of the <xref href="PostSharp.Patterns.Model.AggregatableAttribute" data-throw-if-not-resolved="false"></xref> aspect is a collection class, the <xref href="PostSharp.Patterns.Model.AggregatableAttribute.DefaultItemRelationship" data-throw-if-not-resolved="false"></xref> property applies to
        items of this collection. Otherwise, the property applies to items of collection children. In this case, the value of this property can be overwritten
        by the <xref href="PostSharp.Patterns.Model.ChildAttribute.ItemsRelationship" data-throw-if-not-resolved="false"></xref> property of the <xref href="PostSharp.Patterns.Model.ChildAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.
        </p>
    <p>
        The default value of this property is <xref href="PostSharp.Patterns.Model.RelationshipKind.Default" data-throw-if-not-resolved="false"></xref>, which is interpreted as <xref href="PostSharp.Patterns.Model.RelationshipKind.Child" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: public RelationshipKind DefaultItemRelationship { get; set; }
    parameters: []
    return:
      type: PostSharp.Patterns.Model.RelationshipKind
    content.vb: Public Property DefaultItemRelationship As RelationshipKind
  overload: PostSharp.Patterns.Model.AggregatableAttribute.DefaultItemRelationship*
