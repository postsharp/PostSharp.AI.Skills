  namespace: PostSharp.Patterns.Model
  summary: Gets or sets the default kind of relationship of fields and automatic properties.
  remarks: >-
    <p>
        The default value of this property is <xref href="PostSharp.Patterns.Model.RelationshipKind.Default" data-throw-if-not-resolved="false"></xref>, which causes a build-time error to be emitted if members are not annotated
        with <xref href="PostSharp.Patterns.Model.ChildAttribute" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Patterns.Model.ReferenceAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Model.ParentAttribute" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
