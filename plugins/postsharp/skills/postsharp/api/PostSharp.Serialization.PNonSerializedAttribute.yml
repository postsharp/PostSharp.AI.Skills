  summary: >-
    Custom attribute that, when applied to a field of a class annotated with <xref href="PostSharp.Serialization.PSerializableAttribute" data-throw-if-not-resolved="false"></xref>,

    specifies that this field should not be serialized.
  remarks: <p>This attribute is the equivalent of <xref href="System.NonSerializedAttribute" data-throw-if-not-resolved="false"></xref> for the <xref href="PostSharp.Serialization.PortableFormatter" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
