  fullName: PostSharp.Patterns.Recording.EditableObjectAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording
  summary: Custom attribute that, when applied to a class, implements the <xref href="System.ComponentModel.IEditableObject" data-throw-if-not-resolved="false"></xref> interface in this class.
  remarks: >-
    <p>This aspect implicitly adds the <xref href="PostSharp.Patterns.Recording.RecordableAttribute" data-throw-if-not-resolved="false"></xref> aspect to the target class, unless the aspect is already applied to this class.</p>

    <p>The aspect is implemented by creating a restore point using the <xref href="PostSharp.Patterns.Recording.Recorder.AddRestorePoint(System.String)" data-throw-if-not-resolved="false"></xref> method
        in the <xref href="System.ComponentModel.IEditableObject.BeginEdit" data-throw-if-not-resolved="false"></xref> method, and by undoing changes using <xref href="PostSharp.Patterns.Recording.Recorder.UndoTo(PostSharp.Patterns.Recording.Operation)" data-throw-if-not-resolved="false"></xref> when the
        <xref href="System.ComponentModel.IEditableObject.CancelEdit" data-throw-if-not-resolved="false"></xref> method is invoked. The restore point is removed using
        <xref href="PostSharp.Patterns.Recording.RestorePoint.Remove" data-throw-if-not-resolved="false"></xref> after invoking <xref href="System.ComponentModel.IEditableObject.CancelEdit" data-throw-if-not-resolved="false"></xref> and <xref href="System.ComponentModel.IEditableObject.EndEdit" data-throw-if-not-resolved="false"></xref>.</p>
    <p>The implementation assumes that no other object being tracked by the same <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref>
        will be modified between calls to <xref href="System.ComponentModel.IEditableObject.BeginEdit" data-throw-if-not-resolved="false"></xref> and <xref href="System.ComponentModel.IEditableObject.CancelEdit" data-throw-if-not-resolved="false"></xref>.
        Otherwise, changes to these other objects will be canceled as well.</p>
  example: []
  syntax:
    content: >-
      [MulticastAttributeUsage(MulticastTargets.Class, TargetTypeAttributes = MulticastAttributes.UserGenerated)]

      [IntroduceInterface(typeof(IEditableObject), OverrideAction = InterfaceOverrideAction.Ignore, LinesOfCodeAvoided = 5)]

      [Metric("UsedFeatures", "PostSharp.Patterns.Recording.EditableObject")]

      [AspectTypeDependency(AspectDependencyAction.Require, AspectDependencyPosition.Before, typeof(RecordableAttribute))]

      [Obsolete("[Recordable] aspect and its components are deprecated and will be removed in a future version.", false)]

      [Serializer(typeof(EditableObjectAttribute.Serializer))]

      public sealed class EditableObjectAttribute : InstanceLevelAspect, ITypeLevelAspect, ITypeLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, ICloneAwareAspect, IInstanceScopedAspect, IEditableObject, IAspectProvider, IAspect, IService
    content.vb: >-
      <MulticastAttributeUsage(MulticastTargets.Class, TargetTypeAttributes:=MulticastAttributes.UserGenerated)>

      <IntroduceInterface(GetType(IEditableObject), OverrideAction:=InterfaceOverrideAction.Ignore, LinesOfCodeAvoided:=5)>

      <Metric("UsedFeatures", "PostSharp.Patterns.Recording.EditableObject")>

      <AspectTypeDependency(AspectDependencyAction.Require, AspectDependencyPosition.Before, GetType(RecordableAttribute))>

      <Obsolete("[Recordable] aspect and its components are deprecated and will be removed in a future version.", False)>

      <Serializer(GetType(EditableObjectAttribute.Serializer))>

      Public NotInheritable Class EditableObjectAttribute Inherits InstanceLevelAspect Implements ITypeLevelAspect, ITypeLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, ICloneAwareAspect, IInstanceScopedAspect, IEditableObject, IAspectProvider, IAspect, IService
