- uid: PostSharp.Patterns.Diagnostics.Backends.MetaLoggingBackend.CreateFromDefaultBackend(System.Boolean,System.Boolean)
  commentId: M:PostSharp.Patterns.Diagnostics.Backends.MetaLoggingBackend.CreateFromDefaultBackend(System.Boolean,System.Boolean)
  id: CreateFromDefaultBackend(System.Boolean,System.Boolean)
  parent: PostSharp.Patterns.Diagnostics.Backends.MetaLoggingBackend
  langs:
  - csharp
  - vb
  name: CreateFromDefaultBackend(bool, bool)
  nameWithType: MetaLoggingBackend.CreateFromDefaultBackend(bool, bool)
  fullName: PostSharp.Patterns.Diagnostics.Backends.MetaLoggingBackend.CreateFromDefaultBackend(bool, bool)
  type: Method
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Backends
  summary: >-
    Returns a <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend" data-throw-if-not-resolved="false"></xref>, for use with the <xref href="PostSharp.Patterns.Diagnostics.LoggingRoles.Meta" data-throw-if-not-resolved="false"></xref> role,

    that will try to write to <xref href="PostSharp.Patterns.Diagnostics.LoggingServices.DefaultBackend" data-throw-if-not-resolved="false"></xref> if it is enabled, and will

    optionally write warnings and errors to the console and the debugger.
  example: []
  syntax:
    content: public static LoggingBackend CreateFromDefaultBackend(bool toConsole = true, bool toDebugger = true)
    parameters:
    - id: toConsole
      type: System.Boolean
      description: <code>true</code> to write warnings and errors to the console, otherwise <code>false</code>.
    - id: toDebugger
      type: System.Boolean
      description: <code>true</code> to write warnings and errors to the debugger, otherwise <code>false</code>.
    return:
      type: PostSharp.Patterns.Diagnostics.LoggingBackend
      description: >-
        A <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend" data-throw-if-not-resolved="false"></xref>: either a <xref href="PostSharp.Patterns.Diagnostics.Backends.Multiplexer.MultiplexerBackend" data-throw-if-not-resolved="false"></xref> or
                    the <xref href="PostSharp.Patterns.Diagnostics.LoggingServices.DefaultBackend" data-throw-if-not-resolved="false"></xref> itself.
    content.vb: Public Shared Function CreateFromDefaultBackend(toConsole As Boolean = True, toDebugger As Boolean = True) As LoggingBackend
  overload: PostSharp.Patterns.Diagnostics.Backends.MetaLoggingBackend.CreateFromDefaultBackend*
  nameWithType.vb: MetaLoggingBackend.CreateFromDefaultBackend(Boolean, Boolean)
  fullName.vb: PostSharp.Patterns.Diagnostics.Backends.MetaLoggingBackend.CreateFromDefaultBackend(Boolean, Boolean)
  name.vb: CreateFromDefaultBackend(Boolean, Boolean)
