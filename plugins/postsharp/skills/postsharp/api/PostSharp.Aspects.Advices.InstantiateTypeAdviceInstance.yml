  langs:
  - csharp
  - vb
  name: InstantiateTypeAdviceInstance
  nameWithType: InstantiateTypeAdviceInstance
  fullName: PostSharp.Aspects.Advices.InstantiateTypeAdviceInstance
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Represents an advice that makes the ahead-of-time compiler (NativeAOT) generate the native code of a type, which the aspect creates by

    reflection at run time. The advice has no effect unless the project is compiled for NativeAOT.
  remarks: >-
    <p>
        In an application compiled ahead of time, a generic type instance has native code only when the code of the application instantiates
        it. A generic type instance over reference types can also be created by reflection, because it shares the native code of the other
        instances. A generic type instance over a value type cannot: <code>Activator.CreateInstance</code> throws a <xref href="System.NotSupportedException" data-throw-if-not-resolved="false"></xref>.
        An aspect that creates such a type at run time, for instance a formatter or an adapter for the type of a parameter, returns this advice
        from <xref href="PostSharp.Aspects.Advices.IAdviceProvider.ProvideAdvices(System.Object)" data-throw-if-not-resolved="false"></xref>, so that the weaver adds an instantiation of the type to the woven assembly.
        </p>
    <p>
        The weaver adds the instantiations to a method that is referenced by the module initializer but never called, so that the woven code
        does not execute them. The type can be internal to another assembly: the runtime never compiles the method, but an IL verifier such
        as ILVerify reports the access to the internal type.
        </p>
    <p>
        The advice has an effect only when the MSBuild property <code>PostSharpAotCompatibleWeaving</code> is <code>true</code>. Its default is <code>true</code>
        when the project sets <code>PublishAot</code>, <code>IsAotCompatible</code> or <code>EnableAotAnalyzer</code>. Otherwise, the woven assembly is the same
        as without the advice. A library whose aspects are used in an application compiled ahead of time must set <code>IsAotCompatible</code>.
        </p>
  example: []
  syntax:
    content: 'public sealed class InstantiateTypeAdviceInstance : AdviceInstance'
    content.vb: Public NotInheritable Class InstantiateTypeAdviceInstance Inherits AdviceInstance
