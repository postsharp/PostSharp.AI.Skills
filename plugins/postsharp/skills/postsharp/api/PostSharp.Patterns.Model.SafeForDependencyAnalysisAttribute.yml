  name: SafeForDependencyAnalysisAttribute
  nameWithType: SafeForDependencyAnalysisAttribute
  fullName: PostSharp.Patterns.Model.SafeForDependencyAnalysisAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Model
  summary: >-
    Custom attribute that, when applied on a property, prevents the dependency analysis algorithm used by the

    <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedAttribute" data-throw-if-not-resolved="false"></xref> aspect from emitting errors when it encounters constructs

    that it cannot analyze.
  remarks: >-
    <p>Getters of properties annotated with <xref href="PostSharp.Patterns.Model.SafeForDependencyAnalysisAttribute" data-throw-if-not-resolved="false"></xref> should typically
        specify dependencies manually using the <xref href="PostSharp.Patterns.Model.Depends" data-throw-if-not-resolved="false"></xref> class. Note that all dependencies that can be
        found using code analysis will be taken into account. The <xref href="PostSharp.Patterns.Model.SafeForDependencyAnalysisAttribute" data-throw-if-not-resolved="false"></xref> only
        disables errors, but not the code analysis itself.</p>
    <p>By applying this attribute, you take responsibility for declaring every dependency that the analysis cannot discover. A missing dependency
        results in a missing change notification, not in an error.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Property)]

      public sealed class SafeForDependencyAnalysisAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Property)>

