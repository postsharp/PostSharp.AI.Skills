  name: LocalLockManager
  nameWithType: LocalLockManager
  fullName: PostSharp.Patterns.Caching.Locking.LocalLockManager
  type: Class
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching.Locking
  summary: >-
    An implementation of <xref href="PostSharp.Patterns.Caching.Locking.ILockManager" data-throw-if-not-resolved="false"></xref> in which every instance of the <xref href="PostSharp.Patterns.Caching.Locking.LocalLockManager" data-throw-if-not-resolved="false"></xref>

    has its own set of named locks that are not shared in any way with other instances. The <xref href="PostSharp.Patterns.Caching.Locking.LocalLockManager" data-throw-if-not-resolved="false"></xref> can

    be used to synchronize the execution of methods in the current process and <xref href="System.AppDomain" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>Assign an instance to the <xref href="PostSharp.Patterns.Caching.CachingProfile.LockManager" data-throw-if-not-resolved="false"></xref> property of each profile that needs locking. Since each cached method
        uses a single profile, sharing an instance between profiles or not makes no difference. Lock names are compared without regard to case.</p>
