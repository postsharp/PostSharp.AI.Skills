- uid: PostSharp.Serialization.SerializerFactoryProvider.GetSurrogateType(System.Type)
  commentId: M:PostSharp.Serialization.SerializerFactoryProvider.GetSurrogateType(System.Type)
  id: GetSurrogateType(System.Type)
  parent: PostSharp.Serialization.SerializerFactoryProvider
  langs:
  - csharp
  - vb
  name: GetSurrogateType(Type)
  nameWithType: SerializerFactoryProvider.GetSurrogateType(Type)
  fullName: PostSharp.Serialization.SerializerFactoryProvider.GetSurrogateType(System.Type)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Serialization
  summary: Gets the surrogate type for a given object type.
  remarks: >-
    <p>This method is called only during serialization. The surrogate type is the type whose name will be serialized; therefore, it will also
                    be the type that will be deserialized.</p>
    <p>It is not the responsibility of this class to call the next provider (<xref href="PostSharp.Serialization.ISerializerFactoryProvider.NextProvider" data-throw-if-not-resolved="false"></xref>).</p>
  example: []
  syntax:
    content: public virtual Type GetSurrogateType(Type objectType)
    parameters:
    - id: objectType
      type: System.Type
      description: The type of the object being serialized.
    return:
      type: System.Type
      description: >-
        The surrogate type for <code class="paramref">objectType</code>, or <code>null</code> (or <code class="paramref">objectType</code>) if <code class="paramref">objectType</code>
                    does not require a surrogate type.
    content.vb: Public Overridable Function GetSurrogateType(objectType As Type) As Type
  overload: PostSharp.Serialization.SerializerFactoryProvider.GetSurrogateType*
  implements:
  - PostSharp.Serialization.ISerializerFactoryProvider.GetSurrogateType(System.Type)
- uid: PostSharp.Serialization.SerializerFactoryProvider.GetSerializerFactory(System.Type)
  commentId: M:PostSharp.Serialization.SerializerFactoryProvider.GetSerializerFactory(System.Type)
  id: GetSerializerFactory(System.Type)
  parent: PostSharp.Serialization.SerializerFactoryProvider
  langs:
  - csharp
  - vb
  name: GetSerializerFactory(Type)
  nameWithType: SerializerFactoryProvider.GetSerializerFactory(Type)
  fullName: PostSharp.Serialization.SerializerFactoryProvider.GetSerializerFactory(System.Type)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Serialization
  summary: Gets the instance of <xref href="PostSharp.Serialization.ISerializerFactory" data-throw-if-not-resolved="false"></xref>.
  remarks: <p>It is not the responsibility of this class to call the next provider (<xref href="PostSharp.Serialization.ISerializerFactoryProvider.NextProvider" data-throw-if-not-resolved="false"></xref>).</p>
  example: []
  syntax:
    content: public virtual ISerializerFactory GetSerializerFactory(Type objectType)
    parameters:
    - id: objectType
      type: System.Type
      description: >-
        The type of object being serialized or deserialized. If a surrogate type has been specified during serialization,
                    this parameter is set to the surrogate type during deserialization.
    return:
      type: PostSharp.Serialization.ISerializerFactory
      description: >-
        An instance of <xref href="PostSharp.Serialization.ISerializerFactory" data-throw-if-not-resolved="false"></xref> able to serialize or deserialize <code class="paramref">objectType</code>, or <code>null</code>
                    if there is no known serializer factory for this object.
    content.vb: Public Overridable Function GetSerializerFactory(objectType As Type) As ISerializerFactory
  overload: PostSharp.Serialization.SerializerFactoryProvider.GetSerializerFactory*
  implements:
  - PostSharp.Serialization.ISerializerFactoryProvider.GetSerializerFactory(System.Type)
