  summary: Specifies the severities of messages.
  remarks: >-
    <p>Messages of severity <xref href="PostSharp.Extensibility.SeverityType.Warning" data-throw-if-not-resolved="false"></xref> or lower can be suppressed with <xref href="PostSharp.Extensibility.SuppressWarningAttribute" data-throw-if-not-resolved="false"></xref>;
        messages of severity <xref href="PostSharp.Extensibility.SeverityType.Error" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Extensibility.SeverityType.Fatal" data-throw-if-not-resolved="false"></xref> cannot.</p>
