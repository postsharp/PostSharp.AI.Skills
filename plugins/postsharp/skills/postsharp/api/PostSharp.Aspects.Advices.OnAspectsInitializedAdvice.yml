  name: OnAspectsInitializedAdvice
  nameWithType: OnAspectsInitializedAdvice
  fullName: PostSharp.Aspects.Advices.OnAspectsInitializedAdvice
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Custom attribute that, when applied to a method of an aspect class, specifies that this method

    should be invoked after the instances of all the aspects applied on the same target have been initialized. The target method

    must have a <code>void</code> return value and have a single parameter of type <xref href="PostSharp.Aspects.Advices.AspectInitializationReason" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>Use this advice instead of <xref href="PostSharp.Aspects.Advices.InitializeAspectInstanceAdvice" data-throw-if-not-resolved="false"></xref> when the initialization logic of the aspect
        depends on other aspects of the same target being initialized.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method, AllowMultiple = false, Inherited = false)]

      public sealed class OnAspectsInitializedAdvice : Advice
    content.vb: >-
      <AttributeUsage(AttributeTargets.Method, AllowMultiple:=False, Inherited:=False)>

      Public NotInheritable Class OnAspectsInitializedAdvice Inherits Advice
