  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    Gets or sets how the custom attribute is inherited along the lines of inheritance

    of the target element.
  remarks: >-
    <p>Only one class of the inheritance hierarchy of the attribute can set this property; setting it again in a derived class is a build error.
        Aspect users can also set the inheritance mode of each usage with <xref href="PostSharp.Extensibility.MulticastAttribute.AttributeInheritance" data-throw-if-not-resolved="false"></xref>.</p>
