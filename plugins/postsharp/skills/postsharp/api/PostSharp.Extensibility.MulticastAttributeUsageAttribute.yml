- uid: PostSharp.Extensibility.MulticastAttributeUsageAttribute.AllowMultiple
  commentId: P:PostSharp.Extensibility.MulticastAttributeUsageAttribute.AllowMultiple
  id: AllowMultiple
  parent: PostSharp.Extensibility.MulticastAttributeUsageAttribute
  langs:
  - csharp
  - vb
  name: AllowMultiple
  nameWithType: MulticastAttributeUsageAttribute.AllowMultiple
  fullName: PostSharp.Extensibility.MulticastAttributeUsageAttribute.AllowMultiple
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: Gets or sets a value indicating whether multiple instances of the custom attribute are allowed on a single declaration.
  remarks: >-
    <p>Unless a class sets it to <code>false</code>, multiple instances are allowed. When multiple instances are not allowed, each instance
        replaces the instances of the same attribute type processed before it, for example the ones multicast from the declaring type
        or the assembly. Applying two instances directly to the same declaration is then a build error.</p>
  example: []
  syntax:
    content: public bool AllowMultiple { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property AllowMultiple As Boolean
  overload: PostSharp.Extensibility.MulticastAttributeUsageAttribute.AllowMultiple*
  seealso:
