  - vb
  name: PersistMetaData
  nameWithType: MulticastAttributeUsageAttribute.PersistMetaData
  fullName: PostSharp.Extensibility.MulticastAttributeUsageAttribute.PersistMetaData
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    Gets or sets a value indicating whether the custom attribute should be persisted in metadata, so that

    it is available for <code>System.Reflection</code>.
  remarks: >-
    <p>The default value is <code>false</code>. When this property is <code>true</code>, the compiled assembly contains an instance of the custom attribute
        on every element of code it was multicast to, as if you had added it manually, so that the instances can be reflected at run time.</p>
  example: []
  syntax:
    content: public bool PersistMetaData { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property PersistMetaData As Boolean
  overload: PostSharp.Extensibility.MulticastAttributeUsageAttribute.PersistMetaData*
  seealso:
  - linkType: HRef
    linkId: '@multicast-reflection'
    altText: 'Conceptual: Reflecting Aspect Instances at Runtime'
