  name: MulticastAttributeUsageAttribute
  nameWithType: MulticastAttributeUsageAttribute
  fullName: PostSharp.Extensibility.MulticastAttributeUsageAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: Custom attribute that determines the usage of a <xref href="PostSharp.Extensibility.MulticastAttribute" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>This attribute is the equivalent of <xref href="System.AttributeUsageAttribute" data-throw-if-not-resolved="false"></xref> for multicast attributes. The aspect developer uses it to
        define the valid targets of the attribute and the filters applied during multicasting. Aspect users can restrict these targets with the
        properties of <xref href="PostSharp.Extensibility.MulticastAttribute" data-throw-if-not-resolved="false"></xref> whose name starts with <code>Attribute</code>, but cannot enlarge them.</p>
    <p>Every multicast attribute class, or one of its base classes, must have this attribute; otherwise PostSharp reports a build error.
        The attribute is inherited. A derived class can override it, but only to restrict the set of valid targets: enabling
        <xref href="PostSharp.Extensibility.MulticastAttributeUsageAttribute.AllowMultiple" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Extensibility.MulticastAttributeUsageAttribute.AllowExternalAssemblies" data-throw-if-not-resolved="false"></xref>, or adding kinds to <xref href="PostSharp.Extensibility.MulticastAttributeUsageAttribute.ValidOn" data-throw-if-not-resolved="false"></xref>, when a base class
        disallows them is a build error.</p>
    <p>For validation rules that multicast filters cannot express, override <xref href="PostSharp.Aspects.Aspect.CompileTimeValidate(System.Object)" data-throw-if-not-resolved="false"></xref>
        or implement <xref href="PostSharp.Extensibility.IValidableAnnotation" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class, AllowMultiple = false, Inherited = true)]

      public sealed class MulticastAttributeUsageAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Class, AllowMultiple:=False, Inherited:=True)>

      Public NotInheritable Class MulticastAttributeUsageAttribute Inherits Attribute
