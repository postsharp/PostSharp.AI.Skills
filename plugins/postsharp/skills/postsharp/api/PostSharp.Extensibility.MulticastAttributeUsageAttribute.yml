- uid: PostSharp.Extensibility.MulticastAttributeUsageAttribute.AllowExtensionBlockMembers
  commentId: P:PostSharp.Extensibility.MulticastAttributeUsageAttribute.AllowExtensionBlockMembers
  id: AllowExtensionBlockMembers
  parent: PostSharp.Extensibility.MulticastAttributeUsageAttribute
  langs:
  - csharp
  - vb
  name: AllowExtensionBlockMembers
  nameWithType: MulticastAttributeUsageAttribute.AllowExtensionBlockMembers
  fullName: PostSharp.Extensibility.MulticastAttributeUsageAttribute.AllowExtensionBlockMembers
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: Gets or sets a value indicating whether C# 14 extension block members are allowed.
  remarks: >-
    <p>The default value is <code>false</code>: instances multicast from an outer declaration are not applied to the static methods that implement
        the members of C# 14 extension blocks. Set this property to <code>true</code> to make these members eligible for every usage of the attribute.
        Aspect users can override this value with <xref href="PostSharp.Extensibility.MulticastAttribute.AllowExtensionBlockMembers" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public bool AllowExtensionBlockMembers { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property AllowExtensionBlockMembers As Boolean
  overload: PostSharp.Extensibility.MulticastAttributeUsageAttribute.AllowExtensionBlockMembers*
  seealso:
  - linkType: HRef
    linkId: '@extension-blocks-multicast'
    altText: 'Conceptual: C# 14 extension blocks and multicasting'
