- uid: PostSharp.Aspects.Configuration.OnExceptionAspectConfiguration.SemanticallyAdvisedMethodKinds
  commentId: P:PostSharp.Aspects.Configuration.OnExceptionAspectConfiguration.SemanticallyAdvisedMethodKinds
  id: SemanticallyAdvisedMethodKinds
  parent: PostSharp.Aspects.Configuration.OnExceptionAspectConfiguration
  langs:
  - csharp
  - vb
  name: SemanticallyAdvisedMethodKinds
  nameWithType: OnExceptionAspectConfiguration.SemanticallyAdvisedMethodKinds
  fullName: PostSharp.Aspects.Configuration.OnExceptionAspectConfiguration.SemanticallyAdvisedMethodKinds
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Configuration
  summary: >-
    Gets or sets the kinds of target methods that are advised semantically. This affects the behavior of the aspect when it is applied to

    iterator or async methods, which are compiled into state machines.
  remarks: >-
    <p>
        Semantic advising results in an aspect that is consistent with the level of abstraction of the programming language. This is the default behavior.
        You can disable semantic advising using this property to be consistent with the level of abstraction
        of MSIL and for backward compatibility with the versions of PostSharp prior to 3.1.
        </p>
  example: []
  syntax:
    content: public SemanticallyAdvisedMethodKinds? SemanticallyAdvisedMethodKinds { get; set; }
    parameters: []
    return:
      type: System.Nullable{PostSharp.Aspects.SemanticallyAdvisedMethodKinds}
    content.vb: Public Property SemanticallyAdvisedMethodKinds As SemanticallyAdvisedMethodKinds?
  overload: PostSharp.Aspects.Configuration.OnExceptionAspectConfiguration.SemanticallyAdvisedMethodKinds*
