  namespace: PostSharp.Constraints
  summary: Implementation of <xref href="PostSharp.Constraints.IScalarConstraint" data-throw-if-not-resolved="false"></xref> based on <xref href="PostSharp.Extensibility.MulticastAttribute" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>A scalar constraint validates the target declaration itself, for instance a type, member or parameter.
        It is validated when the assembly that contains the target declaration is processed. To validate how other
        code uses the declaration, use <xref href="PostSharp.Constraints.ReferentialConstraint" data-throw-if-not-resolved="false"></xref> instead.</p>
    <p>Override <xref href="PostSharp.Constraints.ScalarConstraint.ValidateCode(System.Object)" data-throw-if-not-resolved="false"></xref>, cast the target to the reflection type that matches the multicast targets of the
        constraint, and emit warnings or errors with <xref href="PostSharp.Extensibility.Message" data-throw-if-not-resolved="false"></xref>. Combine the constraint with
        <xref href="PostSharp.Extensibility.MulticastAttributeUsageAttribute.Inheritance" data-throw-if-not-resolved="false"></xref> to validate all types derived from the target type.</p>
  example: []
  syntax:
    content: 'public class ScalarConstraint : Constraint, IScalarConstraint, IConstraint'
    content.vb: Public Class ScalarConstraint Inherits Constraint Implements IScalarConstraint, IConstraint
