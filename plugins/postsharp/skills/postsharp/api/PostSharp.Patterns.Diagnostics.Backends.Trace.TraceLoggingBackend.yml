  namespace: PostSharp.Patterns.Diagnostics.Backends.Trace
  summary: Logging backend that logs using <xref href="System.Diagnostics.Trace" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>To use this backend, assign a new instance to <xref href="PostSharp.Patterns.Diagnostics.LoggingServices.DefaultBackend" data-throw-if-not-resolved="false"></xref> when the application starts.</p>

    <p>To route the events that your code logs directly with <xref href="System.Diagnostics.Trace" data-throw-if-not-resolved="false"></xref> through PostSharp Logging, call

    <xref href="PostSharp.Patterns.Diagnostics.Backends.Trace.TraceCollectingTraceListener.RedirectLoggingToPostSharp" data-throw-if-not-resolved="false"></xref> and pass the listeners it returns to the

    <xref href="PostSharp.Patterns.Diagnostics.Backends.Trace.TraceLoggingBackend.%23ctor(System.Collections.Generic.IEnumerable%7bSystem.Diagnostics.TraceListener%7d%2cSystem.String)" data-throw-if-not-resolved="false"></xref> constructor. The parameterless constructor would write

    back to <xref href="System.Diagnostics.Trace" data-throw-if-not-resolved="false"></xref>, whose only listener is then the collecting one.</p>
  example: []
  syntax:
    content: 'public class TraceLoggingBackend : TextLoggingBackend, IDisposable'
    content.vb: Public Class TraceLoggingBackend Inherits TextLoggingBackend Implements IDisposable
