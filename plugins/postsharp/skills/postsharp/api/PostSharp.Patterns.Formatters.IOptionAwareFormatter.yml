- uid: PostSharp.Patterns.Formatters.IOptionAwareFormatter.WithOptions(PostSharp.Patterns.Formatters.FormattingOptions)
  commentId: M:PostSharp.Patterns.Formatters.IOptionAwareFormatter.WithOptions(PostSharp.Patterns.Formatters.FormattingOptions)
  id: WithOptions(PostSharp.Patterns.Formatters.FormattingOptions)
  parent: PostSharp.Patterns.Formatters.IOptionAwareFormatter
  langs:
  - csharp
  - vb
  name: WithOptions(FormattingOptions)
  nameWithType: IOptionAwareFormatter.WithOptions(FormattingOptions)
  fullName: PostSharp.Patterns.Formatters.IOptionAwareFormatter.WithOptions(PostSharp.Patterns.Formatters.FormattingOptions)
  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Formatters
  summary: Returns a copy of the current formatter, but for different options.
  remarks: >-
    It is essential for performance that the implementation respects a semi-singleton pattern, that is, keeps a single instance of the formatter

    for each distinct value of <xref href="PostSharp.Patterns.Formatters.FormattingOptions" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: IOptionAwareFormatter WithOptions(FormattingOptions options)
    parameters:
    - id: options
      type: PostSharp.Patterns.Formatters.FormattingOptions
      description: The new options.
    return:
      type: PostSharp.Patterns.Formatters.IOptionAwareFormatter
      description: A copy of the current formatter with the new <code class="paramref">options</code>.
    content.vb: Function WithOptions(options As FormattingOptions) As IOptionAwareFormatter
  overload: PostSharp.Patterns.Formatters.IOptionAwareFormatter.WithOptions*
