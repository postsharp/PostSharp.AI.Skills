  - vb
  name: IsAsync
  nameWithType: MethodInterceptionArgs.IsAsync
  fullName: PostSharp.Aspects.MethodInterceptionArgs.IsAsync
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Gets a value indicating whether the intercepted method is <code>async</code>, and therefore whether the <xref href="PostSharp.Aspects.MethodInterceptionArgs.AsyncBinding" data-throw-if-not-resolved="false"></xref> property

    and the <xref href="PostSharp.Aspects.MethodInterceptionArgs.ProceedAsync" data-throw-if-not-resolved="false"></xref> method are available.
  example: []
  syntax:
    content: public abstract bool IsAsync { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public MustOverride ReadOnly Property IsAsync As Boolean
  overload: PostSharp.Aspects.MethodInterceptionArgs.IsAsync*
