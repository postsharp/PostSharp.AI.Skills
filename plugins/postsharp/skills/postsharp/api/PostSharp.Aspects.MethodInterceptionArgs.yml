- uid: PostSharp.Aspects.MethodInterceptionArgs.Binding
  commentId: P:PostSharp.Aspects.MethodInterceptionArgs.Binding
  id: Binding
  parent: PostSharp.Aspects.MethodInterceptionArgs
  langs:
  - csharp
  - vb
  name: Binding
  nameWithType: MethodInterceptionArgs.Binding
  fullName: PostSharp.Aspects.MethodInterceptionArgs.Binding
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Gets an interface that allows invoking the next node in the chain of invocation of the intercepted method.
  remarks: >-
    <p>
      Bindings are thread-safe and context-free singleton instances exposing the next node in the chain of invocation.
    </p>
        <a href="@simple-aspects" target="_self">
      Conceptual: Developing Simple Aspects
    </a>
        <div class="NOTE"><h5>note</h5><p>
      As a result of weaving optimizations, the value of this property may appear as <code>null</code> in a debugger.
      If you need to inspect the value at runtime, consider disabling aspect optimizations in the debug build configuration.
    </p></div>
  example: []
  syntax:
    content: public abstract IMethodBinding Binding { get; }
    parameters: []
    return:
      type: PostSharp.Aspects.IMethodBinding
    content.vb: Public MustOverride ReadOnly Property Binding As IMethodBinding
  overload: PostSharp.Aspects.MethodInterceptionArgs.Binding*
- uid: PostSharp.Aspects.MethodInterceptionArgs.ReturnValue
  commentId: P:PostSharp.Aspects.MethodInterceptionArgs.ReturnValue
  id: ReturnValue
  parent: PostSharp.Aspects.MethodInterceptionArgs
  langs:
  - csharp
  - vb
  name: ReturnValue
  nameWithType: MethodInterceptionArgs.ReturnValue
  fullName: PostSharp.Aspects.MethodInterceptionArgs.ReturnValue
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Gets or sets the return value of the method.
  remarks: >-
    <p>This property is set by <xref href="PostSharp.Aspects.MethodInterceptionArgs.Proceed" data-throw-if-not-resolved="false"></xref>. To make the intercepted method return a different value,
                set this property after calling <xref href="PostSharp.Aspects.MethodInterceptionArgs.Proceed" data-throw-if-not-resolved="false"></xref>, or instead of calling it.</p>
        <div class="NOTE"><h5>note</h5><p>
      As a result of weaving optimizations, the value of this property may appear as <code>null</code> in a debugger.
      If you need to inspect the value at runtime, consider disabling aspect optimizations in the debug build configuration.
    </p></div>
  example: []
  syntax:
    content: public abstract object ReturnValue { get; set; }
    parameters: []
    return:
      type: System.Object
    content.vb: Public MustOverride Property ReturnValue As Object
  overload: PostSharp.Aspects.MethodInterceptionArgs.ReturnValue*
- uid: PostSharp.Aspects.MethodInterceptionArgs.Method
  commentId: P:PostSharp.Aspects.MethodInterceptionArgs.Method
  id: Method
  parent: PostSharp.Aspects.MethodInterceptionArgs
  langs:
  - csharp
  - vb
  name: Method
  nameWithType: MethodInterceptionArgs.Method
  fullName: PostSharp.Aspects.MethodInterceptionArgs.Method
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Gets the method being executed.
  remarks: >-
    <p>If the executed method is generic or if its declaring type is generic,
                the current property contains the generic instance being executed.</p>
        <div class="NOTE"><h5>note</h5><p>
                Using this property causes the aspect weaver to generate code that has non-trivial runtime overhead. Avoid using
                this property whenever possible. One possible solution is to use compile-time initialization of
                aspect instances and to make use of reflection only at build time. See <xref href="PostSharp.Aspects.MethodLevelAspect.CompileTimeInitialize(System.Reflection.MethodBase%2cPostSharp.Aspects.AspectInfo)" data-throw-if-not-resolved="false"></xref>
                for details.
              </p></div>
        <div class="NOTE"><h5>note</h5><p>
      As a result of weaving optimizations, the value of this property may appear as <code>null</code> in a debugger.
      If you need to inspect the value at runtime, consider disabling aspect optimizations in the debug build configuration.
    </p></div>
  example: []
  syntax:
    content: public MethodBase Method { get; set; }
    parameters: []
    return:
      type: System.Reflection.MethodBase
    content.vb: Public Property Method As MethodBase
  overload: PostSharp.Aspects.MethodInterceptionArgs.Method*
  seealso:
  - linkId: PostSharp.Aspects.MethodLevelAspect.CompileTimeInitialize(System.Reflection.MethodBase,PostSharp.Aspects.AspectInfo)
    commentId: M:PostSharp.Aspects.MethodLevelAspect.CompileTimeInitialize(System.Reflection.MethodBase,PostSharp.Aspects.AspectInfo)
- uid: PostSharp.Aspects.MethodInterceptionArgs.Arguments
  commentId: P:PostSharp.Aspects.MethodInterceptionArgs.Arguments
  id: Arguments
  parent: PostSharp.Aspects.MethodInterceptionArgs
  langs:
  - csharp
  - vb
  name: Arguments
  nameWithType: MethodInterceptionArgs.Arguments
  fullName: PostSharp.Aspects.MethodInterceptionArgs.Arguments
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Gets the list of arguments with which the method has been invoked.
  remarks: >-
    <p>Unlike <xref href="PostSharp.Aspects.MethodExecutionArgs.Arguments" data-throw-if-not-resolved="false"></xref>, the arguments can be modified before the method is invoked:
                <xref href="PostSharp.Aspects.MethodInterceptionArgs.Proceed" data-throw-if-not-resolved="false"></xref> passes the current values of this list to the intercepted method.</p>
        <div class="NOTE"><h5>note</h5><p>
      As a result of weaving optimizations, the value of this property may appear as <code>null</code> in a debugger.
      If you need to inspect the value at runtime, consider disabling aspect optimizations in the debug build configuration.
    </p></div>
  example: []
  syntax:
    content: public Arguments Arguments { get; protected set; }
    parameters: []
    return:
      type: PostSharp.Aspects.Arguments
    content.vb: Public Property Arguments As Arguments
  overload: PostSharp.Aspects.MethodInterceptionArgs.Arguments*
