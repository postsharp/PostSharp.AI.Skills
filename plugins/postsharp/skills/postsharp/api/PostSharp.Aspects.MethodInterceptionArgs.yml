- uid: PostSharp.Aspects.MethodInterceptionArgs.Proceed
  commentId: M:PostSharp.Aspects.MethodInterceptionArgs.Proceed
  id: Proceed
  parent: PostSharp.Aspects.MethodInterceptionArgs
  langs:
  - csharp
  - vb
  name: Proceed()
  nameWithType: MethodInterceptionArgs.Proceed()
  fullName: PostSharp.Aspects.MethodInterceptionArgs.Proceed()
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Proceeds with the invocation of the method that has been intercepted by calling the next node in the chain of invocation, 

    passing the current <xref href="PostSharp.Aspects.MethodInterceptionArgs.Arguments" data-throw-if-not-resolved="false"></xref> to that method and 

    storing its return value into the property <xref href="PostSharp.Aspects.MethodInterceptionArgs.ReturnValue" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public abstract void Proceed()
    content.vb: Public MustOverride Sub Proceed()
  overload: PostSharp.Aspects.MethodInterceptionArgs.Proceed*
- uid: PostSharp.Aspects.MethodInterceptionArgs.Invoke(PostSharp.Aspects.Arguments)
  commentId: M:PostSharp.Aspects.MethodInterceptionArgs.Invoke(PostSharp.Aspects.Arguments)
  id: Invoke(PostSharp.Aspects.Arguments)
  parent: PostSharp.Aspects.MethodInterceptionArgs
  langs:
  - csharp
  - vb
  name: Invoke(Arguments)
  nameWithType: MethodInterceptionArgs.Invoke(Arguments)
  fullName: PostSharp.Aspects.MethodInterceptionArgs.Invoke(PostSharp.Aspects.Arguments)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Invokes the method that has been intercepted by calling the next node in the chain of invocation with the given arguments,

    without affecting the property <xref href="PostSharp.Aspects.MethodInterceptionArgs.ReturnValue" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public abstract object Invoke(Arguments arguments)
    parameters:
    - id: arguments
      type: PostSharp.Aspects.Arguments
      description: Arguments passed to the intercepted method.
    return:
      type: System.Object
      description: Value returned by the intercepted method.
    content.vb: Public MustOverride Function Invoke(arguments As Arguments) As Object
  overload: PostSharp.Aspects.MethodInterceptionArgs.Invoke*
- uid: PostSharp.Aspects.MethodInterceptionArgs.ProceedAsync
  commentId: M:PostSharp.Aspects.MethodInterceptionArgs.ProceedAsync
  id: ProceedAsync
  parent: PostSharp.Aspects.MethodInterceptionArgs
  langs:
  - csharp
  - vb
  name: ProceedAsync()
  nameWithType: MethodInterceptionArgs.ProceedAsync()
  fullName: PostSharp.Aspects.MethodInterceptionArgs.ProceedAsync()
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Proceeds asynchronously with the invocation of the method that has been intercepted by calling the next node in the chain of invocation, 

    passing the current <xref href="PostSharp.Aspects.MethodInterceptionArgs.Arguments" data-throw-if-not-resolved="false"></xref> to that method and 

    storing its return value into the property <xref href="PostSharp.Aspects.MethodInterceptionArgs.ReturnValue" data-throw-if-not-resolved="false"></xref> upon the completion of the intercepted async method.
  example: []
  syntax:
    content: public abstract MethodInterceptionProceedAwaitable ProceedAsync()
    return:
      type: PostSharp.Aspects.MethodInterceptionProceedAwaitable
    content.vb: Public MustOverride Function ProceedAsync() As MethodInterceptionProceedAwaitable
  overload: PostSharp.Aspects.MethodInterceptionArgs.ProceedAsync*
- uid: PostSharp.Aspects.MethodInterceptionArgs.InvokeAsync(PostSharp.Aspects.Arguments)
