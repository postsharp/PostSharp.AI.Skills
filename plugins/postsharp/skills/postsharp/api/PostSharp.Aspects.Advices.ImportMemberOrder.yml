- uid: PostSharp.Aspects.Advices.ImportMemberOrder.BeforeIntroductions
  commentId: F:PostSharp.Aspects.Advices.ImportMemberOrder.BeforeIntroductions
  id: BeforeIntroductions
  parent: PostSharp.Aspects.Advices.ImportMemberOrder
  langs:
  - csharp
  - vb
  name: BeforeIntroductions
  nameWithType: ImportMemberOrder.BeforeIntroductions
  fullName: PostSharp.Aspects.Advices.ImportMemberOrder.BeforeIntroductions
  type: Field
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Before the aspect introduces its own members. This is similar to calling the overridden method using the

    <code>base</code> keyword in C#. The overridden method implementation is always selected, even if the method

    is virtual.
  example: []
  syntax:
    content: BeforeIntroductions = 1
    return:
      type: PostSharp.Aspects.Advices.ImportMemberOrder
- uid: PostSharp.Aspects.Advices.ImportMemberOrder.AfterIntroductions
  commentId: F:PostSharp.Aspects.Advices.ImportMemberOrder.AfterIntroductions
  id: AfterIntroductions
  parent: PostSharp.Aspects.Advices.ImportMemberOrder
  langs:
  - csharp
  - vb
  name: AfterIntroductions
  nameWithType: ImportMemberOrder.AfterIntroductions
  fullName: PostSharp.Aspects.Advices.ImportMemberOrder.AfterIntroductions
  type: Field
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    After the aspect introduces its own members. Note that importing a member introduced by the current

    aspect makes sense only if the member has been introduced as virtual. In this case,

    the imported member is dynamically resolved using the virtual table of the target object.
  example: []
  syntax:
    content: AfterIntroductions = 0
    return:
      type: PostSharp.Aspects.Advices.ImportMemberOrder
