- uid: PostSharp.Aspects.ILocationInterceptionArgs.ProceedGetValue
  commentId: M:PostSharp.Aspects.ILocationInterceptionArgs.ProceedGetValue
  id: ProceedGetValue
  parent: PostSharp.Aspects.ILocationInterceptionArgs
  langs:
  - csharp
  - vb
  name: ProceedGetValue()
  nameWithType: ILocationInterceptionArgs.ProceedGetValue()
  fullName: PostSharp.Aspects.ILocationInterceptionArgs.ProceedGetValue()
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Invokes the <b>Get Location Value</b> semantic on the next node in the chain of invocation and stores the location value in the <xref href="PostSharp.Aspects.Internals.LocationLevelAdviceArgs.Value" data-throw-if-not-resolved="false"></xref> property.
  remarks: >-
    <p>
                Note that this method overwrites the content of the <xref href="PostSharp.Aspects.Internals.LocationLevelAdviceArgs.Value" data-throw-if-not-resolved="false"></xref> property. Therefore, you should not call this method
                from an <xref href="PostSharp.Aspects.ILocationInterceptionAspect.OnSetValue(PostSharp.Aspects.LocationInterceptionArgs)" data-throw-if-not-resolved="false"></xref> advice unless you store the value beforehand. If you need to retrieve
                the current value of the location from an <xref href="PostSharp.Aspects.ILocationInterceptionAspect.OnSetValue(PostSharp.Aspects.LocationInterceptionArgs)" data-throw-if-not-resolved="false"></xref> advice, we recommend that you
                use the <xref href="PostSharp.Aspects.LocationInterceptionArgs.GetCurrentValue" data-throw-if-not-resolved="false"></xref> method.
              </p>
        <br />
        <div class="NOTE"><h5>note</h5><p>
      This method is designed to be invoked during the execution of the advice. If you need to retrieve or store the value of the location at a different time, it is
      recommended to use the
      <xref href="PostSharp.Aspects.ILocationInterceptionArgs.Binding" data-throw-if-not-resolved="false"></xref>. Indeed, a binding is stateless, while
      <xref href="PostSharp.Aspects.LocationInterceptionArgs" data-throw-if-not-resolved="false"></xref>
      instances may be shared
      among different aspects.
    </p></div>
  example: []
  syntax:
    content: void ProceedGetValue()
    content.vb: Sub ProceedGetValue()
  overload: PostSharp.Aspects.ILocationInterceptionArgs.ProceedGetValue*
- uid: PostSharp.Aspects.ILocationInterceptionArgs.ProceedSetValue
  commentId: M:PostSharp.Aspects.ILocationInterceptionArgs.ProceedSetValue
  id: ProceedSetValue
  parent: PostSharp.Aspects.ILocationInterceptionArgs
  langs:
  - csharp
  - vb
  name: ProceedSetValue()
  nameWithType: ILocationInterceptionArgs.ProceedSetValue()
  fullName: PostSharp.Aspects.ILocationInterceptionArgs.ProceedSetValue()
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Invokes the <b>Set Location Value</b> semantic on the next node in the chain of invocation and stores the value of the <xref href="PostSharp.Aspects.Internals.LocationLevelAdviceArgs.Value" data-throw-if-not-resolved="false"></xref> property into

    the location.
  remarks: >-
    <p>Note that this method requires the value to be stored in the <xref href="PostSharp.Aspects.Internals.LocationLevelAdviceArgs.Value" data-throw-if-not-resolved="false"></xref> property. If you need to retrieve
                the current value of the location from an <xref href="PostSharp.Aspects.ILocationInterceptionAspect.OnSetValue(PostSharp.Aspects.LocationInterceptionArgs)" data-throw-if-not-resolved="false"></xref> advice, we recommend that you
                use the <xref href="PostSharp.Aspects.LocationInterceptionArgs.GetCurrentValue" data-throw-if-not-resolved="false"></xref> method.
              </p>
        <br />
        <div class="NOTE"><h5>note</h5><p>
      This method is designed to be invoked during the execution of the advice. If you need to retrieve or store the value of the location at a different time, it is
      recommended to use the
      <xref href="PostSharp.Aspects.ILocationInterceptionArgs.Binding" data-throw-if-not-resolved="false"></xref>. Indeed, a binding is stateless, while
      <xref href="PostSharp.Aspects.LocationInterceptionArgs" data-throw-if-not-resolved="false"></xref>
      instances may be shared
      among different aspects.
    </p></div>
  example: []
  syntax:
    content: void ProceedSetValue()
    content.vb: Sub ProceedSetValue()
  overload: PostSharp.Aspects.ILocationInterceptionArgs.ProceedSetValue*
- uid: PostSharp.Aspects.ILocationInterceptionArgs.GetCurrentValue
  commentId: M:PostSharp.Aspects.ILocationInterceptionArgs.GetCurrentValue
  id: GetCurrentValue
