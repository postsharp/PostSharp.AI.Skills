- uid: PostSharp.Aspects.ILocationInterceptionArgs.Execute``1(PostSharp.Aspects.ILocationInterceptionArgsAction{``0},``0@)
  commentId: M:PostSharp.Aspects.ILocationInterceptionArgs.Execute``1(PostSharp.Aspects.ILocationInterceptionArgsAction{``0},``0@)
  id: Execute``1(PostSharp.Aspects.ILocationInterceptionArgsAction{``0},``0@)
  parent: PostSharp.Aspects.ILocationInterceptionArgs
  langs:
  - csharp
  - vb
  name: Execute<TPayload>(ILocationInterceptionArgsAction<TPayload>, ref TPayload)
  nameWithType: ILocationInterceptionArgs.Execute<TPayload>(ILocationInterceptionArgsAction<TPayload>, ref TPayload)
  fullName: PostSharp.Aspects.ILocationInterceptionArgs.Execute<TPayload>(PostSharp.Aspects.ILocationInterceptionArgsAction<TPayload>, ref TPayload)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Executes a delegate for the current <xref href="PostSharp.Aspects.LocationInterceptionArgs" data-throw-if-not-resolved="false"></xref>. This method allows

    executing strongly typed operations and avoids the boxing required by the weakly typed <xref href="PostSharp.Aspects.ILocationInterceptionArgs" data-throw-if-not-resolved="false"></xref> interface.
  remarks: >-
    <div class="NOTE"><h5>note</h5><p>
      <p>This method is ignored by the advice optimizer. As a result, the optimizer will not know that the <code class="paramref">action</code> implementation uses
        any feature of the <xref href="PostSharp.Aspects.LocationInterceptionArgs" data-throw-if-not-resolved="false"></xref> object, and the code supporting these features will not be generated. If these features are required
        by <code class="paramref">action</code>, they must be referenced inside the <xref href="PostSharp.Aspects.LocationInterceptionAspect.OnGetValue(PostSharp.Aspects.LocationInterceptionArgs)" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Aspects.LocationInterceptionAspect.OnSetValue(PostSharp.Aspects.LocationInterceptionArgs)" data-throw-if-not-resolved="false"></xref>
        method.
        </p>
    </p></div>
  example: []
  syntax:
    content: void Execute<TPayload>(ILocationInterceptionArgsAction<TPayload> action, ref TPayload payload)
    parameters:
    - id: action
      type: PostSharp.Aspects.ILocationInterceptionArgsAction{{TPayload}}
      description: >-
        Class (typically a singleton) that contains the generic method <xref href="PostSharp.Aspects.ILocationInterceptionArgsAction%601.Execute%60%601(PostSharp.Aspects.ILocationInterceptionArgs%7b%60%600%7d%2c%600%40)" data-throw-if-not-resolved="false"></xref>
                    that is executed with the right method generic argument.
    - id: payload
      type: '{TPayload}'
      description: >-
        The argument passed to the <xref href="PostSharp.Aspects.ILocationInterceptionArgsAction%601.Execute%60%601(PostSharp.Aspects.ILocationInterceptionArgs%7b%60%600%7d%2c%600%40)" data-throw-if-not-resolved="false"></xref> method of the <code class="paramref">action</code>
                    parameter.
    typeParameters:
    - id: TPayload
      description: Type of the payload.
    content.vb: Sub Execute(Of TPayload)(action As ILocationInterceptionArgsAction(Of TPayload), payload As TPayload)
  overload: PostSharp.Aspects.ILocationInterceptionArgs.Execute*
  nameWithType.vb: ILocationInterceptionArgs.Execute(Of TPayload)(ILocationInterceptionArgsAction(Of TPayload), TPayload)
  fullName.vb: PostSharp.Aspects.ILocationInterceptionArgs.Execute(Of TPayload)(PostSharp.Aspects.ILocationInterceptionArgsAction(Of TPayload), TPayload)
  name.vb: Execute(Of TPayload)(ILocationInterceptionArgsAction(Of TPayload), TPayload)
