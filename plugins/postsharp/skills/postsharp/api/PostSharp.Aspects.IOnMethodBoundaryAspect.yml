  namespace: PostSharp.Aspects
  summary: >-
    Method executed after the body of the methods to which this aspect is applied,

    but only when the method returns successfully, that is, when no exception is thrown

    out of the method.
  example: []
  syntax:
    content: >-
      [HasInheritedAttribute]

      void OnSuccess(MethodExecutionArgs args)
    parameters:
    - id: args
      type: PostSharp.Aspects.MethodExecutionArgs
      description: >-
        Event arguments specifying which method
                      is being executed and which are its arguments.
    content.vb: >-
      <HasInheritedAttribute>

      Sub OnSuccess(args As MethodExecutionArgs)
