- uid: PostSharp.Aspects.IOnMethodBoundaryAspect.OnEntry(PostSharp.Aspects.MethodExecutionArgs)
  commentId: M:PostSharp.Aspects.IOnMethodBoundaryAspect.OnEntry(PostSharp.Aspects.MethodExecutionArgs)
  id: OnEntry(PostSharp.Aspects.MethodExecutionArgs)
  parent: PostSharp.Aspects.IOnMethodBoundaryAspect
  langs:
  - csharp
  - vb
  name: OnEntry(MethodExecutionArgs)
  nameWithType: IOnMethodBoundaryAspect.OnEntry(MethodExecutionArgs)
  fullName: PostSharp.Aspects.IOnMethodBoundaryAspect.OnEntry(PostSharp.Aspects.MethodExecutionArgs)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Method executed before the body of the methods to which this aspect is applied.
  remarks: >-
    If the aspect is applied to a constructor, the current method is invoked

    after the <code>this</code> pointer has been initialized, that is, after

    the base constructor has been called.
  example: []
  syntax:
    content: >-
      [HasInheritedAttribute]

      void OnEntry(MethodExecutionArgs args)
    parameters:
    - id: args
      type: PostSharp.Aspects.MethodExecutionArgs
      description: >-
        Event arguments specifying which method
                      is being executed, what its arguments are, and how the execution should continue
                      after the execution of <xref href="PostSharp.Aspects.IOnMethodBoundaryAspect.OnEntry(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>.
    content.vb: >-
      <HasInheritedAttribute>

      Sub OnEntry(args As MethodExecutionArgs)
  overload: PostSharp.Aspects.IOnMethodBoundaryAspect.OnEntry*
  attributes:
  - type: PostSharp.Extensibility.HasInheritedAttributeAttribute
    ctor: PostSharp.Extensibility.HasInheritedAttributeAttribute.#ctor
    arguments: []
- uid: PostSharp.Aspects.IOnMethodBoundaryAspect.OnExit(PostSharp.Aspects.MethodExecutionArgs)
  commentId: M:PostSharp.Aspects.IOnMethodBoundaryAspect.OnExit(PostSharp.Aspects.MethodExecutionArgs)
  id: OnExit(PostSharp.Aspects.MethodExecutionArgs)
  parent: PostSharp.Aspects.IOnMethodBoundaryAspect
  langs:
  - csharp
  - vb
  name: OnExit(MethodExecutionArgs)
  nameWithType: IOnMethodBoundaryAspect.OnExit(MethodExecutionArgs)
  fullName: PostSharp.Aspects.IOnMethodBoundaryAspect.OnExit(PostSharp.Aspects.MethodExecutionArgs)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Method executed after the body of the methods to which this aspect is applied,

    even when the method exits with an exception. This method is invoked from

    the <code>finally</code> block.
  example: []
  syntax:
    content: >-
      [HasInheritedAttribute]

      void OnExit(MethodExecutionArgs args)
    parameters:
    - id: args
      type: PostSharp.Aspects.MethodExecutionArgs
      description: >-
        Event arguments specifying which method
                      is being executed and which are its arguments.
    content.vb: >-
      <HasInheritedAttribute>

      Sub OnExit(args As MethodExecutionArgs)
  overload: PostSharp.Aspects.IOnMethodBoundaryAspect.OnExit*
  attributes:
  - type: PostSharp.Extensibility.HasInheritedAttributeAttribute
    ctor: PostSharp.Extensibility.HasInheritedAttributeAttribute.#ctor
    arguments: []
