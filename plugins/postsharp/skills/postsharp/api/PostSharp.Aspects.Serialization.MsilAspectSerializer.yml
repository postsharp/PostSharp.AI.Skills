  langs:
  - csharp
  - vb
  name: MsilAspectSerializer
  nameWithType: MsilAspectSerializer
  fullName: PostSharp.Aspects.Serialization.MsilAspectSerializer
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Serialization
  summary: >-
    When used as a value of <xref href="PostSharp.Aspects.Configuration.AspectConfigurationAttribute" data-throw-if-not-resolved="false"></xref>.<xref href="PostSharp.Aspects.Configuration.AspectConfigurationAttribute.SerializerType" data-throw-if-not-resolved="false"></xref>

    property, specifies that the aspect should not be serialized but should instead be constructed at runtime using MSIL instructions.
  remarks: >-
    This class is not a serializer. When you use MSIL aspect construction, the aspect is instantiated at runtime

    just as a normal custom attribute, and any initialization made at build time is lost.

    Choose it when the state of the aspect depends only on the constructor arguments and properties of the custom attribute,

    that is, when the aspect does not initialize itself at build time. Building the aspect at run time can then be more

    efficient than deserializing it.
