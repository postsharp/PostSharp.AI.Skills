  name: GetValue(ref object, Arguments)
  nameWithType: ILocationBinding<T>.GetValue(ref object, Arguments)
  fullName: PostSharp.Aspects.ILocationBinding<T>.GetValue(ref object, PostSharp.Aspects.Arguments)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Invokes the <code>Get</code> semantic on the next node in the chain of invocation.
  remarks: >-
    <p>
      The
      <code class="paramref">instance</code>
      parameter is passed by reference so that instance methods of value types (
      <code>struct</code>
      in C#) are allowed to change the value of the instance.
    </p>
  example: []
  syntax:
    content: T GetValue(ref object instance, Arguments index)
    parameters:
    - id: instance
      type: System.Object
      description: Target instance from which the field or property should be retrieved (<code>null</code> if the field or property is static).
    - id: index
      type: PostSharp.Aspects.Arguments
      description: Index arguments, if the location is an indexer property.
    return:
      type: '{T}'
      description: The value stored at the location.
    content.vb: Function GetValue(instance As Object, index As Arguments) As T
  overload: PostSharp.Aspects.ILocationBinding`1.GetValue*
  nameWithType.vb: ILocationBinding(Of T).GetValue(Object, Arguments)
  fullName.vb: PostSharp.Aspects.ILocationBinding(Of T).GetValue(Object, PostSharp.Aspects.Arguments)
  name.vb: GetValue(Object, Arguments)
