  namespace: PostSharp.Aspects.Advices
  summary: >-
    Binds a parameter of an advice method to a variable shared by the advices of an advice group, for instance to pass a value from

    <xref href="PostSharp.Aspects.Advices.OnMethodEntryAdvice" data-throw-if-not-resolved="false"></xref> to <xref href="PostSharp.Aspects.Advices.OnMethodExitAdvice" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        Each variable is a slot identified by its name, which is <xref href="PostSharp.Aspects.Advices.StateAttribute.SlotName" data-throw-if-not-resolved="false"></xref>, or the name of the parameter when <xref href="PostSharp.Aspects.Advices.StateAttribute.SlotName" data-throw-if-not-resolved="false"></xref> is <code>null</code>.
        The advices of one group that bind the same slot share one variable, and all their parameters must have the same type. The variable
        lives for one invocation of the target method, as specified by <xref href="PostSharp.Aspects.Advices.StateScope.MethodInvocation" data-throw-if-not-resolved="false"></xref>, and its initial value is the
        default value of its type. In an async method or an iterator, the variable is a field of the state machine, so it keeps its value
        across <code>await</code> and <code>yield</code> statements.
        </p>
    <p>
        A <code>ref</code> or <code>out</code> parameter can change the value of the variable. A parameter without modifier, or an <code>in</code> parameter, receives the
        current value.
        </p>
  example: []
