  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics
  summary: Indicates that the value of this parameter should not be logged.
  remarks: >-
    <p>Apply this attribute to a parameter, or to a return value with <code>[return: NotLogged]</code>, of a method that is logged
        with <xref href="PostSharp.Patterns.Diagnostics.LogAttribute" data-throw-if-not-resolved="false"></xref>. The log records then contain <code>*******</code> instead of the value.</p>
    <p>The values of parameters of type <xref href="System.Security.SecureString" data-throw-if-not-resolved="false"></xref>, and of parameters whose name contains <code>password</code>
        or <code>pwd</code> (case-insensitive), are hidden even without this attribute.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Parameter|AttributeTargets.ReturnValue)]

      public sealed class NotLoggedAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.ParameterOrAttributeTargets.ReturnValue)>

      Public NotInheritable Class NotLoggedAttribute Inherits Attribute
