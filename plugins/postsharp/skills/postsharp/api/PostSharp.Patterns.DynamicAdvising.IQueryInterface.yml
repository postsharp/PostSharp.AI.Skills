- uid: PostSharp.Patterns.DynamicAdvising.IQueryInterface.QueryInterface``1
  commentId: M:PostSharp.Patterns.DynamicAdvising.IQueryInterface.QueryInterface``1
  id: QueryInterface``1
  parent: PostSharp.Patterns.DynamicAdvising.IQueryInterface
  langs:
  - csharp
  - vb
  name: QueryInterface<T>()
  nameWithType: IQueryInterface.QueryInterface<T>()
  fullName: PostSharp.Patterns.DynamicAdvising.IQueryInterface.QueryInterface<T>()
  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.DynamicAdvising
  summary: Gets the implementation of a specified interface for the current object.
  remarks: >-
    <p>This method shall return the current object if the type of the current object statically implements the interface. Otherwise,
        the method shall return another object that implements <code class="typeparamref">T</code> on behalf of the current object. In this case,
        the returned object shall implement the <xref href="PostSharp.Patterns.DynamicAdvising.IDynamicInterfaceImplementation" data-throw-if-not-resolved="false"></xref> interface, which allows navigating back to the current object.</p>
    <p>
        User code typically uses the <xref href="PostSharp.Patterns.DynamicAdvising.QueryInterfaceExtensions.QueryInterface%60%601(System.Object%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> extension method.
        </p>
  example: []
  syntax:
    content: 'T QueryInterface<T>() where T : class'
    typeParameters:
    - id: T
      description: The type of the required interface.
    return:
      type: '{T}'
      description: >-
        An object implementing the <code class="typeparamref">T</code> interface on behalf of the current object, or <code>null</code>
                    if the current object does not implement the <code class="typeparamref">T</code> interface.
    content.vb: Function QueryInterface(Of T As Class)() As T
  overload: PostSharp.Patterns.DynamicAdvising.IQueryInterface.QueryInterface*
  nameWithType.vb: IQueryInterface.QueryInterface(Of T)()
  fullName.vb: PostSharp.Patterns.DynamicAdvising.IQueryInterface.QueryInterface(Of T)()
  name.vb: QueryInterface(Of T)()
