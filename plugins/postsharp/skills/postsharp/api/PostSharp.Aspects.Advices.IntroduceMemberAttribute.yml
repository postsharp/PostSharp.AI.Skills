  name: IntroduceMemberAttribute
  nameWithType: IntroduceMemberAttribute
  fullName: PostSharp.Aspects.Advices.IntroduceMemberAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Custom attribute that, when applied on a method, event or property of an aspect class, specifies

    that this method, event or property should be introduced into the types to which the aspect is applied.
  remarks: >-
    <p>
          Methods, properties and events annotated with <xref href="PostSharp.Aspects.Advices.IntroduceMemberAttribute" data-throw-if-not-resolved="false"></xref> must be public.
        </p>
    <p>
         If the method, event or property is in a C# 8.0 nullable annotations context, its nullability information will
        be copied into the types as well.
        </p>
    <p>
          Members are introduced by delegation: the introduced member calls the member of the aspect, where the implementation stays.
          For this reason, fields cannot be introduced; introduce a property instead. Use <xref href="PostSharp.Aspects.Advices.IntroduceMemberAttribute.Visibility" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.Advices.IntroduceMemberAttribute.IsVirtual" data-throw-if-not-resolved="false"></xref>
          to control the introduced member, and <xref href="PostSharp.Aspects.Advices.IntroduceMemberAttribute.OverrideAction" data-throw-if-not-resolved="false"></xref> to choose what happens when the target type or a base type
          already defines the member.
        </p>
    <p>
          Introduced members are not visible to the C# compiler in the project being built, so code of that project cannot call them directly.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method|AttributeTargets.Property|AttributeTargets.Event, AllowMultiple = false)]

      public sealed class IntroduceMemberAttribute : Advice
    content.vb: >-
      <AttributeUsage(AttributeTargets.MethodOrAttributeTargets.PropertyOrAttributeTargets.Event, AllowMultiple:=False)>

      Public NotInheritable Class IntroduceMemberAttribute Inherits Advice
