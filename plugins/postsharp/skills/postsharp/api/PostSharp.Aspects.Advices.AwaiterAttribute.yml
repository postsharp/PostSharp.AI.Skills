  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Binds a parameter of an <xref href="PostSharp.Aspects.Advices.OnMethodEntryAdvice" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Aspects.Advices.OnMethodResumeAdvice" data-throw-if-not-resolved="false"></xref> method to an awaiter that the async method

    awaits before it continues.
  remarks: >-
    <p>
        The parameter must be <code>ref</code> or <code>out</code>, and its type must implement <xref href="System.Runtime.CompilerServices.INotifyCompletion" data-throw-if-not-resolved="false"></xref>
        or <xref href="System.Runtime.CompilerServices.ICriticalNotifyCompletion" data-throw-if-not-resolved="false"></xref>. The advice assigns an awaiter to the parameter and sets the
        parameter bound by <xref href="PostSharp.Aspects.Advices.FlowBehaviorAttribute" data-throw-if-not-resolved="false"></xref> to <xref href="PostSharp.Aspects.FlowBehavior.Yield" data-throw-if-not-resolved="false"></xref>. The async method then awaits the awaiter
        before it continues, for instance to switch to another thread.
        </p>
    <p>
        All the <xref href="PostSharp.Aspects.Advices.AwaiterAttribute" data-throw-if-not-resolved="false"></xref> parameters of the advices of one group must have the same type, because they share one variable.
        This attribute can be used only in <xref href="PostSharp.Aspects.Advices.OnMethodEntryAdvice" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.Advices.OnMethodResumeAdvice" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: 'public sealed class AwaiterAttribute : AdviceParameterAttribute'
    content.vb: Public NotInheritable Class AwaiterAttribute Inherits AdviceParameterAttribute
