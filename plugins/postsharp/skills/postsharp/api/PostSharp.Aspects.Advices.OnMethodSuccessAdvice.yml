  name: OnMethodSuccessAdvice
  nameWithType: OnMethodSuccessAdvice
  fullName: PostSharp.Aspects.Advices.OnMethodSuccessAdvice
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Custom attribute that, when applied on a method of an aspect class, specifies

    that this method is an advice that has the same semantics as <xref href="PostSharp.Aspects.OnMethodBoundaryAspect.OnSuccess(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
                The method to which this custom attribute is applied must be public and must return <code>void</code>. It can be static.
                Each parameter of the method receives a value of the target, selected by a custom attribute derived from
                <xref href="PostSharp.Aspects.Advices.AdviceParameterAttribute" data-throw-if-not-resolved="false"></xref>, such as <xref href="PostSharp.Aspects.Advices.ArgumentAttribute" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.ReturnValueAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Aspects.Advices.StateAttribute" data-throw-if-not-resolved="false"></xref>.
                Alternatively, the method can have the same signature as <xref href="PostSharp.Aspects.OnMethodBoundaryAspect.OnSuccess(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>,
                whose <xref href="PostSharp.Aspects.MethodExecutionArgs" data-throw-if-not-resolved="false"></xref> parameter is allocated on each call. The <xref href="PostSharp.Aspects.MethodExecutionArgs" data-throw-if-not-resolved="false"></xref> parameter can also be the first parameter,
                followed by bound parameters.
              </p>
        <br />
        <p>
      If an aspect defines many advices (among
      <xref href="PostSharp.Aspects.Advices.OnMethodEntryAdvice" data-throw-if-not-resolved="false"></xref>
      ,
      <xref href="PostSharp.Aspects.Advices.OnMethodExitAdvice" data-throw-if-not-resolved="false"></xref>
      ,
      <xref href="PostSharp.Aspects.Advices.OnMethodSuccessAdvice" data-throw-if-not-resolved="false"></xref>
      and
      <xref href="PostSharp.Aspects.Advices.OnMethodExceptionAdvice" data-throw-if-not-resolved="false"></xref>
      ) that are meant to be applied to the same methods with consistent ordering, these advices should be
      grouped together (see
      <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Group" data-throw-if-not-resolved="false"></xref>
      property).
    </p>
        <div class="NOTE"><h5>note</h5><p>
      A group of advices without a custom attribute derived from <xref href="PostSharp.Aspects.Advices.Pointcut" data-throw-if-not-resolved="false"></xref> applies to the method or constructor to which the aspect is applied; when the aspect is applied to another kind of declaration, a pointcut is required. An advice without <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Group" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Master" data-throw-if-not-resolved="false"></xref> and pointcut joins
      the group of its class that has no advice of its kind yet.
    </p></div>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method, AllowMultiple = true, Inherited = true)]

      public sealed class OnMethodSuccessAdvice : OnMethodBoundaryAdvice
    content.vb: >-
      <AttributeUsage(AttributeTargets.Method, AllowMultiple:=True, Inherited:=True)>

