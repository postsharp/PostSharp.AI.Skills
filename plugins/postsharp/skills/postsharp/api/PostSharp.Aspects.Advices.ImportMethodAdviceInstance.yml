  fullName: PostSharp.Aspects.Advices.ImportMethodAdviceInstance.ImportMethodAdviceInstance(System.Reflection.FieldInfo, string, bool, PostSharp.Aspects.Advices.ImportMemberOrder)
  type: Constructor
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Initializes a new instance of the <xref href="PostSharp.Aspects.Advices.ImportMethodAdviceInstance" data-throw-if-not-resolved="false"></xref> class.
  example: []
  syntax:
    content: public ImportMethodAdviceInstance(FieldInfo aspectField, string methodName, bool isRequired = false, ImportMemberOrder order = ImportMemberOrder.AfterIntroductions)
    parameters:
    - id: aspectField
      type: System.Reflection.FieldInfo
      description: The field of the aspect class to which a delegate of the imported method is assigned at runtime. The field type should be a delegate with the same signature as the method to import.
    - id: methodName
      type: System.String
      description: The name of the method to import.
    - id: isRequired
      type: System.Boolean
      description: <code>true</code> if the build should fail if there is no matching method in the target class, <code>false</code> to set <code class="paramref">aspectField</code> to <code>null</code> in this case.
    - id: order
      type: PostSharp.Aspects.Advices.ImportMemberOrder
      description: >-
        Determines whether the <code class="paramref">aspectField</code> should be bound to the member
                    as resolved before or after introduction of new members into the target class by the current advice.
    content.vb: Public Sub New(aspectField As FieldInfo, methodName As String, isRequired As Boolean = False, order As ImportMemberOrder = ImportMemberOrder.AfterIntroductions)
