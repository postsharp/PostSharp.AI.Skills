  type: Class
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording
  summary: >-
    Custom attribute that, when applied to a field or a property, specifies that it should not be affected by the <xref href="PostSharp.Patterns.Recording.RecordableAttribute" data-throw-if-not-resolved="false"></xref> aspect.

    Therefore, changes to this field or property will not be recorded into a <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref>, and will not be affected

    by undo/redo operations.
  example: []
  syntax:
    content: >-
      [Obsolete("[Recordable] aspect and its components are deprecated and will be removed in a future version.", false)]

      [AttributeUsage(AttributeTargets.Property|AttributeTargets.Field)]

      public sealed class NotRecordedAttribute : Attribute
    content.vb: >-
      <Obsolete("[Recordable] aspect and its components are deprecated and will be removed in a future version.", False)>

      <AttributeUsage(AttributeTargets.PropertyOrAttributeTargets.Field)>

      Public NotInheritable Class NotRecordedAttribute Inherits Attribute
