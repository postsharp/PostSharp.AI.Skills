- uid: PostSharp.Reflection.MethodBody.ILocalVariableExpression.GetPossibleAssignments
  commentId: M:PostSharp.Reflection.MethodBody.ILocalVariableExpression.GetPossibleAssignments
  id: GetPossibleAssignments
  parent: PostSharp.Reflection.MethodBody.ILocalVariableExpression
  langs:
  - csharp
  - vb
  name: GetPossibleAssignments()
  nameWithType: ILocalVariableExpression.GetPossibleAssignments()
  fullName: PostSharp.Reflection.MethodBody.ILocalVariableExpression.GetPossibleAssignments()
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Reflection.MethodBody
  summary: Returns an array of all possible assignments of the <xref href="PostSharp.Reflection.MethodBody.ILocalVariable" data-throw-if-not-resolved="false"></xref> at this specific point of the program execution.
  remarks: >-
    <p>
                The result list contains either assignment expressions (<xref href="PostSharp.Reflection.MethodBody.IBinaryExpression" data-throw-if-not-resolved="false"></xref>) or 
                <xref href="PostSharp.Reflection.MethodBody.IAddressOfExpression" data-throw-if-not-resolved="false"></xref> when the address of the variable is passed to a method through a reference argument.
            </p>
    <p>The result of this method is cached.</p>
  example: []
  syntax:
    content: IList<IExpression> GetPossibleAssignments()
    return:
      type: System.Collections.Generic.IList{PostSharp.Reflection.MethodBody.IExpression}
      description: The list of possible assignments.
    content.vb: Function GetPossibleAssignments() As IList(Of IExpression)
  overload: PostSharp.Reflection.MethodBody.ILocalVariableExpression.GetPossibleAssignments*
