  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Reflection.MethodBody
  summary: >-
    Gets the value of the <xref href="PostSharp.Reflection.MethodBody.ILocalVariable" data-throw-if-not-resolved="false"></xref> at this specific point of the program execution, if this value

    can be determined trivially.
  remarks: >-
    <p>
        If the value cannot be determined trivially, use the <xref href="PostSharp.Reflection.MethodBody.ILocalVariableExpression.GetPossibleAssignments" data-throw-if-not-resolved="false"></xref> method
        to perform a non-trivial data flow analysis.
        </p>
  example: []
  syntax:
    content: IExpression TrivialValue { get; }
    parameters: []
    return:
      type: PostSharp.Reflection.MethodBody.IExpression
    content.vb: ReadOnly Property TrivialValue As IExpression
  overload: PostSharp.Reflection.MethodBody.ILocalVariableExpression.TrivialValue*
