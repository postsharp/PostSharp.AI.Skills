  name: ILogger
  nameWithType: ILogger
  fullName: PostSharp.Patterns.Diagnostics.Custom.ILogger
  type: Interface
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics.Custom
  summary: >-
    Defines an abstraction of the logging facility, through which other components emit their log records. This

    interface abstracts other PostSharp components from the PostSharp.Patterns.Diagnostics component.
  remarks: >-
    <p>If you want to implement this interface, you should also implement the <xref href="PostSharp.Patterns.Diagnostics.Custom.ILoggerFactory" data-throw-if-not-resolved="false"></xref> interface
        and register it with the <xref href="PostSharp.Patterns.Utilities.ServiceLocator" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public interface ILogger
    content.vb: Public Interface ILogger
  derivedClasses:
  - PostSharp.Patterns.Diagnostics.Custom.LegacySourceLogger
  - PostSharp.Patterns.Diagnostics.LoggingAbstractSource
