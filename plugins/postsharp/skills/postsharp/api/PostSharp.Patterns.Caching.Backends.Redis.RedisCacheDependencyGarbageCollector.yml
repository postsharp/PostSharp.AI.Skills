  name: RedisCacheDependencyGarbageCollector
  nameWithType: RedisCacheDependencyGarbageCollector
  fullName: PostSharp.Patterns.Caching.Backends.Redis.RedisCacheDependencyGarbageCollector
  type: Class
  assemblies:
  - PostSharp.Patterns.Caching.Backends.Redis
  namespace: PostSharp.Patterns.Caching.Backends.Redis
  summary: >-
    Removes dependencies added by a <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackend" data-throw-if-not-resolved="false"></xref> when items are expired or evicted from the cache.

    At least one instance (ideally a single instance) of the <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCacheDependencyGarbageCollector" data-throw-if-not-resolved="false"></xref> must be running whenever a

    <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackend" data-throw-if-not-resolved="false"></xref> instance that supports dependencies is running, otherwise the cache will use storage to store dependencies

    that are no longer relevant, and these dependencies will not be removed. If no <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCacheDependencyGarbageCollector" data-throw-if-not-resolved="false"></xref> is running while

    at least one dependency-enabled <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackend" data-throw-if-not-resolved="false"></xref> instance is running, you must initiate a full garbage collection

    by calling the <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCacheDependencyGarbageCollector.PerformFullCollectionAsync(PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackend%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> method.
  remarks: >-
    <p>The collector must use the same <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.KeyPrefix" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.Database" data-throw-if-not-resolved="false"></xref>
        as the application, and its configuration must have <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.SupportsEvents" data-throw-if-not-resolved="false"></xref> set to <code>true</code>.
        It can run in a separate process or service.</p>
    <p>The collector performs two tasks. It subscribes to the <code>expired</code> and <code>evicted</code> keyevent notifications of Redis and removes
        the dependencies of the removed items. The Redis server must therefore publish these notifications (<code>notify-keyspace-events Exe</code>).
        The collector also periodically scans the database and removes unreachable data, according to <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCacheDependencyGarbageCollectorOptions" data-throw-if-not-resolved="false"></xref>.
        The real-time processing stops while the background task queue is overloaded (see <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.BackgroundTasksOverloadedThreshold" data-throw-if-not-resolved="false"></xref>).</p>
    <p>Several instances can run at the same time, but they process the same notifications, so a single instance is preferable.
        To start a cleanup manually, call <xref href="PostSharp.Patterns.Caching.Implementation.CachingBackend.CleanUpAsync(PostSharp.Patterns.Caching.Implementation.CacheCleanupOptions%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>.</p>
