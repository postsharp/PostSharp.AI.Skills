  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    The singleton instance of this class is assigned to the <xref href="PostSharp.Aspects.MethodExecutionArgs.ReturnValue" data-throw-if-not-resolved="false"></xref> property when

    an <xref href="PostSharp.Aspects.OnMethodBoundaryAspect" data-throw-if-not-resolved="false"></xref> aspect is applied semantically to a method and the target method returns a null task.
  remarks: >-
    When an <xref href="PostSharp.Aspects.OnMethodBoundaryAspect" data-throw-if-not-resolved="false"></xref> aspect is applied semantically to a method, then the <xref href="PostSharp.Aspects.MethodExecutionArgs.ReturnValue" data-throw-if-not-resolved="false"></xref> property

    represents the result of executing the task returned by the method. If the method returns a null task, then the result is undefined. The <xref href="PostSharp.Aspects.NullTaskSentinel.Instance" data-throw-if-not-resolved="false"></xref>

    is used to represent this case.
