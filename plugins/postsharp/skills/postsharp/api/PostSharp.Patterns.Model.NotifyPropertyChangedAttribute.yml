  name: NotifyPropertyChangedAttribute
  nameWithType: NotifyPropertyChangedAttribute
  fullName: PostSharp.Patterns.Model.NotifyPropertyChangedAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Model
  summary: Custom attribute that, when applied on a type, implements the <xref href="System.ComponentModel.INotifyPropertyChanged" data-throw-if-not-resolved="false"></xref> interface for this class and all children classes.
  remarks: >-
    <p>The aspect analyzes dependencies between property getters and fields. The aspect understands indirect dependencies. For instance, a property
        getter may depend on several other methods or property getters, which in turn can depend on other methods or fields. The algorithm is not able
        to analyze calls to virtual methods or delegates because of the prohibitive computational cost. It tries to analyze only methods in the current class.
        </p>
    <p>
            The aspect will emit a build-time error if it is not able to understand the code of the target class. In this case, you can exclude the property from
        automatic change notification by applying the <xref href="PostSharp.Patterns.Model.IgnoreAutoChangeNotificationAttribute" data-throw-if-not-resolved="false"></xref> custom attribute to the problematic property. Alternatively, you can apply
        <xref href="PostSharp.Patterns.Model.SafeForDependencyAnalysisAttribute" data-throw-if-not-resolved="false"></xref> to ignore the warnings of the dependency analysis engine. You will then need to specify dependencies explicitly using
        the <xref href="PostSharp.Patterns.Model.Depends" data-throw-if-not-resolved="false"></xref> class. You can also mark a helper method with the <xref href="PostSharp.Patterns.Model.PureAttribute" data-throw-if-not-resolved="false"></xref> to make it safe to use in a property getter.
        For instance, the <code>string.Format</code> method is pure.
        </p>
    <p>
        By default, the <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedAttribute" data-throw-if-not-resolved="false"></xref> aspect holds weak references to the client delegates. This behavior prevents memory leaks
        if client delegates are not properly removed before client objects are disposed. To cause the aspect to store strong references, set the <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedAttribute.WeakEventStrategy" data-throw-if-not-resolved="false"></xref> 
        property to <xref href="PostSharp.Patterns.Model.WeakEventStrategy.AlwaysStrong" data-throw-if-not-resolved="false"></xref> when applying the aspect. 
        </p>
    <p>
        Target classes can customize the <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedAttribute" data-throw-if-not-resolved="false"></xref> aspect by implementing the <code>OnPropertyChanged(string)</code> method manually. If
        this method is implemented, it must be <code>protected</code> or <code>public</code>.
        </p>
    <p>
        By default, the <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedAttribute" data-throw-if-not-resolved="false"></xref> aspect does not call property getters by itself in order to avoid unexpected side effects. However,
        this means that there are false positive notifications of property change. To allow the aspect to use arbitrary calls to property getters to suppress false positives, set 
        the <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedAttribute.PreventFalsePositives" data-throw-if-not-resolved="false"></xref> property to <code>true</code>.
        </p>
    <p>
        The aspect does not raise notifications immediately when a field changes. It buffers them per thread and raises them, on the thread that made the change,
        when the control flow exits the object, that is, when the outermost call to a method of the object returns. This ensures that clients observe the
        object in a consistent state, and avoids notifying the same property several times during a single call. To control the buffer, use the <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedServices" data-throw-if-not-resolved="false"></xref> class.
        </p>
  example: []
  syntax:
    content: >-
      [MulticastAttributeUsage(MulticastTargets.Class, Inheritance = MulticastInheritance.Strict, PersistMetaData = true, AllowMultiple = false, TargetTypeAttributes = MulticastAttributes.UserGenerated)]

      [ProvideAspectRole("DataBinding")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Tracing")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Threading")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Validation")]

      [AspectTypeDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, typeof(AggregatableAttribute))]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Caching")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "CacheInvalidation")]

      [Metric("UsedFeatures", "PostSharp.Patterns.Model.NotifyPropertyChanged")]

      [IntroduceInterface(typeof(INotifyPropertyChanged), OverrideAction = InterfaceOverrideAction.Ignore, AncestorOverrideAction = InterfaceOverrideAction.Ignore)]

      [IntroduceInterface(typeof(INotifyChildPropertyChanged), OverrideAction = InterfaceOverrideAction.Ignore, AncestorOverrideAction = InterfaceOverrideAction.Ignore, LinesOfCodeAvoided = 0)]

      [IntroduceInterface(typeof(IQueryInterface), OverrideAction = InterfaceOverrideAction.Ignore, AncestorOverrideAction = InterfaceOverrideAction.Ignore)]

      [Serializer(typeof(NotifyPropertyChangedAttribute.Serializer))]

      public sealed class NotifyPropertyChangedAttribute : InstanceLevelAspect, ITypeLevelAspect, ITypeLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, ICloneAwareAspect, IInstanceScopedAspect, ISerializationCallback, INotifyPropertyChanged, IAdviceProvider, IAspect, IQueryInterface, IDynamicInterfaceImplementation
    content.vb: >-
      <MulticastAttributeUsage(MulticastTargets.Class, Inheritance:=MulticastInheritance.Strict, PersistMetaData:=True, AllowMultiple:=False, TargetTypeAttributes:=MulticastAttributes.UserGenerated)>

      <ProvideAspectRole("DataBinding")>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Tracing")>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Threading")>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Validation")>

      <AspectTypeDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, GetType(AggregatableAttribute))>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Caching")>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "CacheInvalidation")>

      <Metric("UsedFeatures", "PostSharp.Patterns.Model.NotifyPropertyChanged")>

      <IntroduceInterface(GetType(INotifyPropertyChanged), OverrideAction:=InterfaceOverrideAction.Ignore, AncestorOverrideAction:=InterfaceOverrideAction.Ignore)>

      <IntroduceInterface(GetType(INotifyChildPropertyChanged), OverrideAction:=InterfaceOverrideAction.Ignore, AncestorOverrideAction:=InterfaceOverrideAction.Ignore, LinesOfCodeAvoided:=0)>

      <IntroduceInterface(GetType(IQueryInterface), OverrideAction:=InterfaceOverrideAction.Ignore, AncestorOverrideAction:=InterfaceOverrideAction.Ignore)>

      <Serializer(GetType(NotifyPropertyChangedAttribute.Serializer))>

