- uid: PostSharp.Patterns.Model.NotifyPropertyChangedAttribute.PreventFalsePositives
  commentId: P:PostSharp.Patterns.Model.NotifyPropertyChangedAttribute.PreventFalsePositives
  id: PreventFalsePositives
  parent: PostSharp.Patterns.Model.NotifyPropertyChangedAttribute
  langs:
  - csharp
  - vb
  name: PreventFalsePositives
  nameWithType: NotifyPropertyChangedAttribute.PreventFalsePositives
  fullName: PostSharp.Patterns.Model.NotifyPropertyChangedAttribute.PreventFalsePositives
  type: Property
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Model
  summary: >-
    Gets or sets a value indicating whether the aspect should make additional efforts to prevent the <xref href="System.ComponentModel.INotifyPropertyChanged.PropertyChanged" data-throw-if-not-resolved="false"></xref> event from being 

    raised when the value itself did not change. The default value of this property is <code>false</code>, which means that the aspect will raise the 

    <xref href="System.ComponentModel.INotifyPropertyChanged.PropertyChanged" data-throw-if-not-resolved="false"></xref> event whenever any dependency of the property has changed, whether or not the property value has 

    changed. Setting this property to <code>true</code> consumes more memory and processing power because the aspect will need to evaluate 

    the properties and store their values.
  example: []
  syntax:
    content: public bool PreventFalsePositives { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property PreventFalsePositives As Boolean
  overload: PostSharp.Patterns.Model.NotifyPropertyChangedAttribute.PreventFalsePositives*
  seealso:
  - linkType: HRef
    linkId: '@inotifypropertychanged-false-positives'
    altText: 'Conceptual: Suppressing False Positives of the NotifyPropertyChanged Aspect'
- uid: PostSharp.Patterns.Model.NotifyPropertyChangedAttribute.WeakEventStrategy
  commentId: P:PostSharp.Patterns.Model.NotifyPropertyChangedAttribute.WeakEventStrategy
  id: WeakEventStrategy
  parent: PostSharp.Patterns.Model.NotifyPropertyChangedAttribute
  langs:
  - csharp
  - vb
  name: WeakEventStrategy
  nameWithType: NotifyPropertyChangedAttribute.WeakEventStrategy
  fullName: PostSharp.Patterns.Model.NotifyPropertyChangedAttribute.WeakEventStrategy
  type: Property
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Model
  summary: Gets or sets how the <xref href="System.ComponentModel.INotifyPropertyChanged.PropertyChanged" data-throw-if-not-resolved="false"></xref> event keeps weak or strong references.
  remarks: >-
    <p>Setting this property to <xref href="PostSharp.Patterns.Model.WeakEventStrategy.Default" data-throw-if-not-resolved="false"></xref> is equivalent to 
        <xref href="PostSharp.Patterns.Model.WeakEventStrategy.AlwaysWeak" data-throw-if-not-resolved="false"></xref>.</p>
    <p>Setting this property to <xref href="PostSharp.Patterns.Model.WeakEventStrategy.AlwaysWeak" data-throw-if-not-resolved="false"></xref> forces the event to hold only weak references. A 
        <xref href="System.Runtime.CompilerServices.ConditionalWeakTable%602" data-throw-if-not-resolved="false"></xref> is used to bind the lifetime of the delegate to its target even if 
        the registering object does not keep a reference to the delegate. This does not prevent the target object from being collected along with the delegate, which 
        may happen implicitly when a lambda or local function with a closure is used as an event handler. In this case, no reference to the closure class 
        is retained.</p>
    <p>Setting this property to <xref href="PostSharp.Patterns.Model.WeakEventStrategy.AlwaysStrong" data-throw-if-not-resolved="false"></xref> forces the event to hold only strong references. This may 
        prevent components that do not support weak event behavior from having subscribed delegates collected. However, it may cause memory leaks if delegates are not 
        unregistered from the event.</p>
  example: []
  syntax:
    content: public WeakEventStrategy WeakEventStrategy { get; set; }
    parameters: []
    return:
      type: PostSharp.Patterns.Model.WeakEventStrategy
    content.vb: Public Property WeakEventStrategy As WeakEventStrategy
  overload: PostSharp.Patterns.Model.NotifyPropertyChangedAttribute.WeakEventStrategy*
