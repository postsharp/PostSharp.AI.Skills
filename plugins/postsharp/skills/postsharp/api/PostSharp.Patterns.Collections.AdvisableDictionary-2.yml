  summary: Sets the value with the specified key in the underlying dictionary.
  remarks: >-
    <p>There is redundancy in requiring both <code class="paramref">key</code> and <code class="paramref">oldValue</code>, but this redundancy is required for performance reasons.
          </p>
      <p>
        <div class="NOTE"><h5>note</h5><p>
      This method does not cause the advices to be executed. It should be invoked only from inside the scope of
      the <code>ExecuteWithAdvices</code> method.
    </p></div>
      </p>
  example: []
  syntax:
    content: protected virtual void SetItem(TKey key, TValue value, TValue oldValue)
    parameters:
    - id: key
      type: '{TKey}'
      description: The key of the element to add or replace.
    - id: value
      type: '{TValue}'
      description: The new value to assign to the key.
    - id: oldValue
      type: '{TValue}'
      description: The old value assigned to <code class="paramref">key</code>, or <code>null</code> if there is currently no value assigned to <code class="paramref">key</code>.
