  name: AdvisableDictionary<TKey, TValue>
  nameWithType: AdvisableDictionary<TKey, TValue>
  fullName: PostSharp.Patterns.Collections.AdvisableDictionary<TKey, TValue>
  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Collections
  summary: >-
    An implementation of a <xref href="System.Collections.Generic.Dictionary%602" data-throw-if-not-resolved="false"></xref> into which advices can be injected dynamically. The class also allows derived classes to add new behaviors by overriding methods,

    like the <xref href="System.Collections.ObjectModel.Collection%601" data-throw-if-not-resolved="false"></xref> class does.
  remarks: >-
    <p>To learn how to extend this class, see the <xref href="PostSharp.Patterns.Collections.AdvisableCollection%601" data-throw-if-not-resolved="false"></xref> class documentation.</p>

    <p>Use this class instead of <xref href="System.Collections.Generic.Dictionary%602" data-throw-if-not-resolved="false"></xref> in the child properties of classes that use patterns such as Aggregatable, Recordable
        or threading models, which inject their behavior into advisable collections at run time.</p>
  example: []
  syntax:
    content: 'public class AdvisableDictionary<TKey, TValue> : DynamicallyAdvisableObject, ISerializable, IDeserializationCallback, IDynamicallyAdvisableDictionary, IDynamicallyAdvisable, IQueryInterface, IDictionary, ICollection, IDictionary<TKey, TValue>, ICollection<KeyValuePair<TKey, TValue>>, IEnumerable<KeyValuePair<TKey, TValue>>, IEnumerable'
    typeParameters:
    - id: TKey
      description: The type of keys in the dictionary.
    - id: TValue
      description: The type of values in the dictionary.
    content.vb: Public Class AdvisableDictionary(Of TKey, TValue) Inherits DynamicallyAdvisableObject Implements ISerializable, IDeserializationCallback, IDynamicallyAdvisableDictionary, IDynamicallyAdvisable, IQueryInterface, IDictionary, ICollection, IDictionary(Of TKey, TValue), ICollection(Of KeyValuePair(Of TKey, TValue)), IEnumerable(Of KeyValuePair(Of TKey, TValue)), IEnumerable
