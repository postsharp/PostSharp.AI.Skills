  summary: Custom attribute that registers a <xref href="PostSharp.Patterns.Model.TypeAdapters.FieldRule" data-throw-if-not-resolved="false"></xref>. The custom attribute must be applied to the current project at the assembly level.
  remarks: >-
    <p>PostSharp reads this custom attribute from the assembly that contains the aggregatable class. Apply it to each project
        in which the rule must take effect.</p>
