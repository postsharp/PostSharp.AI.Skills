  fullName: PostSharp.Reflection.MethodBody.ILocalVariable
  type: Interface
  assemblies:
  - PostSharp
  namespace: PostSharp.Reflection.MethodBody
  summary: Expression that represents a local variable.
  remarks: >-
    <p>There are three kinds of local variables, but consumers of this interface should not rely on the kind.
        The kinds are local variables defined in user code, local variables introduced by the compiler, and pseudo-variables introduced
        by the AST decompiler to emulate the stack.</p>
  example: []
  syntax:
    content: 'public interface ILocalVariable : IMethodBodyElement'
