  name: Attributes
  nameWithType: MulticastPointcut.Attributes
  fullName: PostSharp.Aspects.Advices.MulticastPointcut.Attributes
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Gets or sets the visibilities, scopes, virtualities, and implementation

    of members to which this attribute applies.
  remarks: >-
    <p>
            The <xref href="PostSharp.Extensibility.MulticastAttributes" data-throw-if-not-resolved="false"></xref> enumeration is a multi-part flag: there is one
            part for visibility, one for scope, one for virtuality, and one for implementation.
            If you specify one part, it will override the values defined on the custom attribute definition.
          </p>
  example: []
  syntax:
    content: public MulticastAttributes Attributes { get; set; }
    parameters: []
    return:
      type: PostSharp.Extensibility.MulticastAttributes
    content.vb: Public Property Attributes As MulticastAttributes
