  fullName: PostSharp.Aspects.Advices.MulticastPointcut
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Custom attribute that, when applied on an advice method, specifies to which elements of

    code this advice applies, based on the kind, name and attributes of code elements.

    Works similarly to <xref href="PostSharp.Extensibility.MulticastAttribute" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
            Unlike <xref href="PostSharp.Extensibility.MulticastAttribute" data-throw-if-not-resolved="false"></xref>, this pointcut does not add aspects: it selects, within the target of the
            aspect, the elements to which the advice applies. For a type-level aspect, it selects among the members declared
            in the target type; for an aspect applied to a method, field, property or event, it can select only that element.
            When <xref href="PostSharp.Aspects.Advices.MulticastPointcut.Targets" data-throw-if-not-resolved="false"></xref> is not set, the pointcut selects all the kinds of elements that the advice supports.
          </p>
    <p>
            To select elements with logic that cannot be expressed declaratively, use <xref href="PostSharp.Aspects.Advices.MethodPointcut" data-throw-if-not-resolved="false"></xref>.
          </p>
  example: []
  syntax:
    content: 'public sealed class MulticastPointcut : Pointcut'
    content.vb: Public NotInheritable Class MulticastPointcut Inherits Pointcut
