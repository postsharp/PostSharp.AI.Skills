  summary: Instruments the <xref href="System.Net.Http.HttpClient" data-throw-if-not-resolved="false"></xref> class.
  remarks: >-
    <p>Call <xref href="PostSharp.Patterns.Diagnostics.Adapters.HttpClient.HttpClientLogging.Initialize(PostSharp.Patterns.Diagnostics.Correlation.ICorrelationProtocol%2cSystem.Predicate%7bSystem.Uri%7d)" data-throw-if-not-resolved="false"></xref> once when the application starts. The instrumentation then opens a logging activity for each

    outgoing HTTP request. For distributed logging, pass an <xref href="PostSharp.Patterns.Diagnostics.Correlation.ICorrelationProtocol" data-throw-if-not-resolved="false"></xref> such as <xref href="PostSharp.Patterns.Diagnostics.Correlation.LegacyHttpCorrelationProtocol" data-throw-if-not-resolved="false"></xref>:

    it adds correlation headers to outgoing requests. Use the same protocol in the instrumentation of the server.</p>
