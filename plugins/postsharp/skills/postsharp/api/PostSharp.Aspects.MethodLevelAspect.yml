  name: CompileTimeValidate(MethodBase)
  nameWithType: MethodLevelAspect.CompileTimeValidate(MethodBase)
  fullName: PostSharp.Aspects.MethodLevelAspect.CompileTimeValidate(System.Reflection.MethodBase)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Method invoked at build time to ensure that the aspect has been applied to the right target.
  remarks: >-
    The implementation of this method is expected to emit an error message (see 

    <xref href="PostSharp.Extensibility.MessageSource" data-throw-if-not-resolved="false"></xref>) or an exception in case of error. Returning <code>false</code> without emitting an

    error message or exception causes the aspect to be silently ignored.
  example: []
  syntax:
    content: public virtual bool CompileTimeValidate(MethodBase method)
    parameters:
    - id: method
      type: System.Reflection.MethodBase
      description: Method to which the aspect has been applied.
    return:
      type: System.Boolean
      description: >-
        <code>true</code> if the aspect was applied to an acceptable field, otherwise
              <code>false</code>.
    content.vb: Public Overridable Function CompileTimeValidate(method As MethodBase) As Boolean
  overload: PostSharp.Aspects.MethodLevelAspect.CompileTimeValidate*
