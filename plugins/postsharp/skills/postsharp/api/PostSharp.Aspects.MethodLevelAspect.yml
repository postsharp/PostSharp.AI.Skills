  fullName: PostSharp.Aspects.MethodLevelAspect
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Base class for all aspects applied on methods.
  remarks: >-
    <div class="NOTE"><h5>note</h5><p>
      This class does not provide any advice. You may derive your aspect class from a
      <a href="@simple-aspects" target="_self">
        class providing
        predefined advice
      </a>, or build a
      <a href="@member-level-aspects" target="_self">member-level aspect</a> or a
      <a href="@complex-aspects" target="_self">type-level or assembly-level aspect</a> with advice methods.
    </p></div>
        <a href="@simple-aspects#AspectClasses" target="_self">
      Conceptual: Developing Simple Aspects
    </a>
        <a href="@member-level-aspects" target="_self">
      Conceptual: Developing Member-Level Aspects
    </a>
        <a href="@complex-aspects" target="_self">
      Conceptual: Developing Type- and Assembly-Level Aspects
    </a>
        <p>
            An aspect derived from this class can declare the following advices. Without a pointcut, or with <xref href="PostSharp.Aspects.Advices.SelfPointcut" data-throw-if-not-resolved="false"></xref>, they
            apply to the method or constructor to which the aspect is applied:
            </p>
        <ul><li>the method boundary advices <xref href="PostSharp.Aspects.Advices.OnMethodEntryAdvice" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.OnMethodSuccessAdvice" data-throw-if-not-resolved="false"></xref>,
            <xref href="PostSharp.Aspects.Advices.OnMethodExceptionAdvice" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.OnMethodExitAdvice" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.OnMethodYieldAdvice" data-throw-if-not-resolved="false"></xref> and
            <xref href="PostSharp.Aspects.Advices.OnMethodResumeAdvice" data-throw-if-not-resolved="false"></xref>, on methods and constructors;</li><li>the method interception advices <xref href="PostSharp.Aspects.Advices.OnMethodInvokeAdvice" data-throw-if-not-resolved="false"></xref> and
            <xref href="PostSharp.Aspects.Advices.OnMethodInvokeAsyncAdvice" data-throw-if-not-resolved="false"></xref>, on methods only.</li></ul>
        <p>
            A <xref href="PostSharp.Aspects.Advices.LocationValidationAdvice" data-throw-if-not-resolved="false"></xref> validates the parameters or the return value of the method when a
            <xref href="PostSharp.Aspects.Advices.MethodPointcut" data-throw-if-not-resolved="false"></xref> selects them. <xref href="PostSharp.Aspects.Advices.IntroduceMemberAttribute" data-throw-if-not-resolved="false"></xref> introduces members into the declaring type
            of the target. <xref href="PostSharp.Aspects.Advices.IntroduceInterfaceAttribute" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.Advices.ImportMemberAttribute" data-throw-if-not-resolved="false"></xref> require an instance-scoped
            aspect (<xref href="PostSharp.Aspects.IInstanceScopedAspect" data-throw-if-not-resolved="false"></xref>).
            </p>
        <br />
        <p>
          <div class="NOTE"><h5>note</h5><p>
        All classes implementing
        <xref href="PostSharp.Aspects.IAspect" data-throw-if-not-resolved="false"></xref>
        should typically be marked as serializable
        using the 
        <xref href="System.SerializableAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.PSerializableAttribute" data-throw-if-not-resolved="false"></xref> custom attribute. Fields that
        are only used at runtime (and unknown at compile-time) should be carefully
        marked with the <xref href="System.NonSerializedAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.PNonSerializedAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.
        When another aspect serializer (such as <xref href="PostSharp.Aspects.Serialization.MsilAspectSerializer" data-throw-if-not-resolved="false"></xref>) is used,
        it is not necessary to mark the aspect class as serializable.
        For more information, see
        <a href="@aspect-serialization">Aspect Serialization</a>.
      </p></div>
        </p>
        <a href="@aspect-serialization">
      Conceptual: Understanding Aspect Serialization
    </a>
