  summary: The base class for method interception advices.
  remarks: >-
    <p>
        A method interception advice can be applied to an abstract method of the current assembly. PostSharp then gives the method an
        implementation that throws <xref href="System.NotSupportedException" data-throw-if-not-resolved="false"></xref>, unless another aspect implements the method. The advice runs when
        the method is called, and gets the exception only when it proceeds to this implementation; an advice that does not proceed returns
        normally. The overrides of the method in derived classes are not intercepted. The compiler reports warning LA0254 in this case.
        To exclude abstract methods from a multicast aspect, set the
        <xref href="PostSharp.Extensibility.MulticastAttribute.AttributeTargetMemberAttributes" data-throw-if-not-resolved="false"></xref> property of the aspect, or the
        <xref href="PostSharp.Extensibility.MulticastAttributeUsageAttribute.TargetMemberAttributes" data-throw-if-not-resolved="false"></xref> property of its
        <xref href="PostSharp.Extensibility.MulticastAttributeUsageAttribute" data-throw-if-not-resolved="false"></xref>, to
        <xref href="PostSharp.Extensibility.MulticastAttributes.NonAbstract" data-throw-if-not-resolved="false"></xref>. An aspect provider (<xref href="PostSharp.Aspects.IAspectProvider" data-throw-if-not-resolved="false"></xref>) or a pointcut
        that selects methods must exclude abstract methods itself, because multicast filters do not apply to the targets it selects.
        </p>
  example: []
  syntax:
    content: 'public abstract class OnMethodInvokeBaseAdvice : GroupingAdvice'
    content.vb: Public MustInherit Class OnMethodInvokeBaseAdvice Inherits GroupingAdvice
