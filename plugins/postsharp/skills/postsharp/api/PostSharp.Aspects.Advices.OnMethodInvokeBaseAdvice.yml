  name: SemanticallyAdvisedMethodKinds
  nameWithType: OnMethodInvokeBaseAdvice.SemanticallyAdvisedMethodKinds
  fullName: PostSharp.Aspects.Advices.OnMethodInvokeBaseAdvice.SemanticallyAdvisedMethodKinds
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Gets or sets which target methods are advised semantically. This affects the behavior of the advice when it is applied to

    iterator or async methods, which are compiled into state machines.
  remarks: >-
    <p>
        Semantic advising results in an aspect that is consistent with the level of abstraction of the programming language. This is the default behavior.
        You can disable semantic advising by using this property to be consistent with the level of abstraction
        of MSIL and for backward compatibility with the versions of PostSharp prior to 3.1.
        </p>
    <p>Set this property on the master advice of a group. Setting it on another advice of the group, which sets the
        <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Master" data-throw-if-not-resolved="false"></xref> property or joins the group implicitly, is a build-time error.</p>
  example: []
  syntax:
    content: public SemanticallyAdvisedMethodKinds SemanticallyAdvisedMethodKinds { get; set; }
    parameters: []
    return:
      type: PostSharp.Aspects.SemanticallyAdvisedMethodKinds
    content.vb: Public Property SemanticallyAdvisedMethodKinds As SemanticallyAdvisedMethodKinds
  overload: PostSharp.Aspects.Advices.OnMethodInvokeBaseAdvice.SemanticallyAdvisedMethodKinds*
- uid: PostSharp.Aspects.Advices.OnMethodInvokeBaseAdvice.UnsupportedTargetAction
  commentId: P:PostSharp.Aspects.Advices.OnMethodInvokeBaseAdvice.UnsupportedTargetAction
  id: UnsupportedTargetAction
  parent: PostSharp.Aspects.Advices.OnMethodInvokeBaseAdvice
  langs:
  - csharp
  - vb
  name: UnsupportedTargetAction
  nameWithType: OnMethodInvokeBaseAdvice.UnsupportedTargetAction
  fullName: PostSharp.Aspects.Advices.OnMethodInvokeBaseAdvice.UnsupportedTargetAction
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Gets or sets the action to take when the advice is applied to an async method with unsupported return value type.
  remarks: >-
    <p>
        Starting with C# 7, async methods can have return types other than <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref> or <xref href="System.Threading.Tasks.Task%601" data-throw-if-not-resolved="false"></xref>.
        Async method interception does not support this type of async methods. By default, a build error is raised whenever
        async method interception is applied to a method that returns an awaitable type other than <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref> or <xref href="System.Threading.Tasks.Task%601" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>
        Set this property to change how unsupported async methods are handled during compile time.
        </p>
    <p>Set this property on the master advice of a group. Setting it on another advice of the group, which sets the
        <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Master" data-throw-if-not-resolved="false"></xref> property or joins the group implicitly, is a build-time error.</p>
  example: []
  syntax:
    content: public UnsupportedTargetAction UnsupportedTargetAction { get; set; }
    parameters: []
    return:
      type: PostSharp.Aspects.UnsupportedTargetAction
    content.vb: Public Property UnsupportedTargetAction As UnsupportedTargetAction
  overload: PostSharp.Aspects.Advices.OnMethodInvokeBaseAdvice.UnsupportedTargetAction*
