  fullName: PostSharp.Patterns.Recording.RecordingScope
  type: Class
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording
  summary: Defines the scope of a logical operation, that is, a set of changes that should be undone or redone as a whole.
  remarks: >-
    <p>Scopes can be defined declaratively using the <xref href="PostSharp.Patterns.Recording.RecordingScopeAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.</p>

    <p>To open a scope imperatively, use the <xref href="PostSharp.Patterns.Recording.Recorder.OpenScope(PostSharp.Patterns.Recording.RecordingScopeOption)" data-throw-if-not-resolved="false"></xref> method.
        Use the <xref href="PostSharp.Patterns.Recording.RecordingScope.Complete" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Recording.RecordingScope.Dispose" data-throw-if-not-resolved="false"></xref> method to close the scope.</p>
    <p>By default, the <xref href="PostSharp.Patterns.Recording.RecordableAttribute" data-throw-if-not-resolved="false"></xref> aspect wraps each call to a public or internal method of a recordable object
        in an implicit scope, so that a call from outside the object model becomes a single logical operation.</p>
  example: []
  syntax:
    content: >-
      [Obsolete("[Recordable] aspect and its components are deprecated and will be removed in a future version.", false)]

      public sealed class RecordingScope : IDisposable
    content.vb: >-
      <Obsolete("[Recordable] aspect and its components are deprecated and will be removed in a future version.", False)>

      Public NotInheritable Class RecordingScope Implements IDisposable
