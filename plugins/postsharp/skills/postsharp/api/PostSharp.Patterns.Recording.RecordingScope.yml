- uid: PostSharp.Patterns.Recording.RecordingScope.Dispose
  commentId: M:PostSharp.Patterns.Recording.RecordingScope.Dispose
  id: Dispose
  parent: PostSharp.Patterns.Recording.RecordingScope
  langs:
  - csharp
  - vb
  name: Dispose()
  nameWithType: RecordingScope.Dispose()
  fullName: PostSharp.Patterns.Recording.RecordingScope.Dispose()
  type: Method
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording
  summary: Closes the current <xref href="PostSharp.Patterns.Recording.RecordingScope" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>If the current <xref href="PostSharp.Patterns.Recording.RecordingScope" data-throw-if-not-resolved="false"></xref> is atomic, invoking <xref href="PostSharp.Patterns.Recording.RecordingScope.Dispose" data-throw-if-not-resolved="false"></xref> without <xref href="PostSharp.Patterns.Recording.RecordingScope.Complete" data-throw-if-not-resolved="false"></xref>
        will undo all changes made in the current scope. In other words, <xref href="PostSharp.Patterns.Recording.RecordingScope.Dispose" data-throw-if-not-resolved="false"></xref> without <xref href="PostSharp.Patterns.Recording.RecordingScope.Complete" data-throw-if-not-resolved="false"></xref> has rollback semantics.
        </p>
  example: []
  syntax:
    content: public void Dispose()
    content.vb: Public Sub Dispose()
  overload: PostSharp.Patterns.Recording.RecordingScope.Dispose*
  implements:
  - System.IDisposable.Dispose
