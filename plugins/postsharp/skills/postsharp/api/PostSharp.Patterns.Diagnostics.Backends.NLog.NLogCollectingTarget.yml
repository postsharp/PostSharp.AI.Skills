  namespace: PostSharp.Patterns.Diagnostics.Backends.NLog
  summary: Writes log messages to PostSharp Logging.
  remarks: >-
    <p>Add this target to the NLog configuration that your code uses for manual logging, so that NLog events go through the same

    PostSharp backend as automatic logging and share its indentation. The log source of each event is named after the NLog logger.

    Create the <xref href="PostSharp.Patterns.Diagnostics.Backends.NLog.NLogLoggingBackend" data-throw-if-not-resolved="false"></xref> with a separate <xref href="NLog.LogFactory" data-throw-if-not-resolved="false"></xref> whose configuration contains the output targets.</p>
  example: []
