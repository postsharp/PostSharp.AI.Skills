  summary: Type of properties that are turned into XAML attached properties by the <xref href="PostSharp.Patterns.Xaml.AttachedPropertyAttribute" data-throw-if-not-resolved="false"></xref> aspect.
  remarks: >-
    <p>The getter of a property with the <xref href="PostSharp.Patterns.Xaml.AttachedPropertyAttribute" data-throw-if-not-resolved="false"></xref> aspect returns an instance of this class. Use <xref href="PostSharp.Patterns.Xaml.Attached%601.GetValue(System.Windows.DependencyObject)" data-throw-if-not-resolved="false"></xref>,
        <xref href="PostSharp.Patterns.Xaml.Attached%601.SetValue(System.Windows.DependencyObject%2c%600)" data-throw-if-not-resolved="false"></xref> or the indexer to read or write the attached property on a <xref href="System.Windows.DependencyObject" data-throw-if-not-resolved="false"></xref>, and <xref href="PostSharp.Patterns.Xaml.Attached%601.RuntimeProperty" data-throw-if-not-resolved="false"></xref>
        to get the registered <xref href="System.Windows.DependencyProperty" data-throw-if-not-resolved="false"></xref>, for example to override its metadata.</p>
