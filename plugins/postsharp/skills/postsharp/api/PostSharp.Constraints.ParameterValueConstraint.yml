- uid: PostSharp.Constraints.ParameterValueConstraint.ValidateTargetParameter(System.Reflection.ParameterInfo)
  commentId: M:PostSharp.Constraints.ParameterValueConstraint.ValidateTargetParameter(System.Reflection.ParameterInfo)
  id: ValidateTargetParameter(System.Reflection.ParameterInfo)
  parent: PostSharp.Constraints.ParameterValueConstraint
  langs:
  - csharp
  - vb
  name: ValidateTargetParameter(ParameterInfo)
  nameWithType: ParameterValueConstraint.ValidateTargetParameter(ParameterInfo)
  fullName: PostSharp.Constraints.ParameterValueConstraint.ValidateTargetParameter(System.Reflection.ParameterInfo)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Constraints
  summary: >-
    Validates the parameter to which the current constraint has been applied. A typical use of this method is to validate the parameter type.

    Overriding implementations should call the base implementation.
  example: []
  syntax:
    content: protected virtual bool ValidateTargetParameter(ParameterInfo parameter)
    parameters:
    - id: parameter
      type: System.Reflection.ParameterInfo
      description: The parameter to which the custom attribute has been applied.
    return:
      type: System.Boolean
      description: >-
        <code>true</code> if the current constraint can legally be applied to <code class="paramref">parameter</code>, <code>false</code> otherwise. No error message is emitted if
            the method returns <code>false</code>. The method should emit its own error message.
    content.vb: Protected Overridable Function ValidateTargetParameter(parameter As ParameterInfo) As Boolean
  overload: PostSharp.Constraints.ParameterValueConstraint.ValidateTargetParameter*
