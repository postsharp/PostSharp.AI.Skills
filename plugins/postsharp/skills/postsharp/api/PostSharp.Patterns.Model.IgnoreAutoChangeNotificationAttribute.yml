  name: IgnoreAutoChangeNotificationAttribute
  nameWithType: IgnoreAutoChangeNotificationAttribute
  fullName: PostSharp.Patterns.Model.IgnoreAutoChangeNotificationAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Model
  summary: >-
    Custom attribute that, when applied to a property, prevents the <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedAttribute" data-throw-if-not-resolved="false"></xref> aspect

    from raising change notifications for this property.
  remarks: >-
    <p>
        This means that if you change the value of that property, the <code>PropertyChanged</code> event will not be raised.
        </p>
    <p>
        For historical reasons, you can also apply this attribute to a method, but doing so results in a build-time warning.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method|AttributeTargets.Property)]

      public sealed class IgnoreAutoChangeNotificationAttribute : Attribute, IValidableAnnotation
    content.vb: >-
      <AttributeUsage(AttributeTargets.MethodOrAttributeTargets.Property)>

      Public NotInheritable Class IgnoreAutoChangeNotificationAttribute Inherits Attribute Implements IValidableAnnotation
