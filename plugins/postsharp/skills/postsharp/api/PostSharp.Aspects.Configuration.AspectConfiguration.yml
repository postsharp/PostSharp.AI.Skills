    linkId: '@aspect-dependencies'
    altText: 'Conceptual: Coping with Several Aspects on the Same Target'
- uid: PostSharp.Aspects.Configuration.AspectConfiguration.SerializerType
  commentId: P:PostSharp.Aspects.Configuration.AspectConfiguration.SerializerType
  id: SerializerType
  parent: PostSharp.Aspects.Configuration.AspectConfiguration
  langs:
  - csharp
  - vb
  name: SerializerType
  nameWithType: AspectConfiguration.SerializerType
  fullName: PostSharp.Aspects.Configuration.AspectConfiguration.SerializerType
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Configuration
  summary: >-
    Gets or sets the type of the serializer that will be used

    to serialize the current aspect.
  remarks: >-
    <p>The type assigned to this property must derive from the <xref href="PostSharp.Aspects.Serialization.AspectSerializer" data-throw-if-not-resolved="false"></xref> class
          and have a default constructor. Use <xref href="PostSharp.Aspects.Serialization.MsilAspectSerializer" data-throw-if-not-resolved="false"></xref> to specify that the aspect will not
          be serialized, but will be constructed using MSIL instructions.</p>
    <p>When this property is not set, the weaver chooses the serializer from the custom attributes of the aspect class:
            <xref href="PostSharp.Aspects.Serialization.PortableAspectSerializer" data-throw-if-not-resolved="false"></xref> for a class annotated with <xref href="PostSharp.Serialization.PSerializableAttribute" data-throw-if-not-resolved="false"></xref>,
            or a serializer based on the .NET binary formatter for a class annotated with <xref href="System.SerializableAttribute" data-throw-if-not-resolved="false"></xref>.
            The binary formatter is insecure, and the build fails unless its use is explicitly allowed.</p>
  example: []
  syntax:
    content: public TypeIdentity SerializerType { get; set; }
    parameters: []
    return:
      type: PostSharp.Aspects.TypeIdentity
    content.vb: Public Property SerializerType As TypeIdentity
  overload: PostSharp.Aspects.Configuration.AspectConfiguration.SerializerType*
  seealso:
  - linkType: HRef
    linkId: '@aspect-serialization'
    altText: 'Conceptual: Understanding Aspect Serialization'
