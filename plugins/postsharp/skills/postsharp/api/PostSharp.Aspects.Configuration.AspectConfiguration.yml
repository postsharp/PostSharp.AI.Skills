  name: AspectPriority
  nameWithType: AspectConfiguration.AspectPriority
  fullName: PostSharp.Aspects.Configuration.AspectConfiguration.AspectPriority
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Configuration
  summary: Gets or sets the aspect priority. Aspects with smaller priority are processed first. The default priority is zero.
  remarks: >-
    Whenever possible, use dependencies (the <xref href="PostSharp.Aspects.Configuration.AspectConfiguration.Dependencies" data-throw-if-not-resolved="false"></xref> collection) to specify the ordering of aspects.

    Unlike priorities, dependencies scale up in complexity, which can be important in larger projects.
  example: []
