  nameWithType: AspectConfiguration
  fullName: PostSharp.Aspects.Configuration.AspectConfiguration
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Configuration
  summary: Configuration of an <xref href="PostSharp.Aspects.IAspect" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>Every concrete aspect class has a corresponding configuration class derived from <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref>.</p>

    <p>The weaver gets the configuration of an aspect at build time, from two sources. Declaratively, from the configuration
            custom attribute (derived from <xref href="PostSharp.Aspects.Configuration.AspectConfigurationAttribute" data-throw-if-not-resolved="false"></xref>) applied to the aspect class or to one of its base classes.
            Imperatively, from <xref href="PostSharp.Aspects.IAspectBuildSemantics.GetAspectConfiguration(System.Object)" data-throw-if-not-resolved="false"></xref>, which <xref href="PostSharp.Aspects.Aspect" data-throw-if-not-resolved="false"></xref> implements by calling
            configuration methods that you can override. A property set by the custom attribute takes precedence over the value provided
            imperatively. When the custom attribute sets the same property on several classes of the hierarchy, the value from the most
            derived class wins.</p>
  example: []
