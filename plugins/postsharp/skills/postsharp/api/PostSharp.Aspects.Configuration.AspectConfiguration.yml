    content: public int? AspectPriority { get; set; }
    parameters: []
    return:
      type: System.Nullable{System.Int32}
    content.vb: Public Property AspectPriority As Integer?
  overload: PostSharp.Aspects.Configuration.AspectConfiguration.AspectPriority*
