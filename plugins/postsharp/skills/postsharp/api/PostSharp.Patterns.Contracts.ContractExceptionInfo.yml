  fullName: PostSharp.Patterns.Contracts.ContractExceptionInfo
  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Contracts
  summary: Holds the information from which the <xref href="PostSharp.Patterns.Contracts.ContractExceptionFactory" data-throw-if-not-resolved="false"></xref> should create the exception.
  remarks: >-
    <p>A custom contract creates an instance of this class and passes it to the <xref href="PostSharp.Patterns.Contracts.ContractExceptionFactory.CreateException(PostSharp.Patterns.Contracts.ContractExceptionInfo)" data-throw-if-not-resolved="false"></xref> method
        of <xref href="PostSharp.Patterns.Contracts.ContractServices.ExceptionFactory" data-throw-if-not-resolved="false"></xref>. The <xref href="PostSharp.Patterns.Contracts.ContractExceptionInfo.MessageId" data-throw-if-not-resolved="false"></xref> must be known by <xref href="PostSharp.Patterns.Contracts.ContractServices.LocalizedTextProvider" data-throw-if-not-resolved="false"></xref>,
        or the default factory throws an exception when it formats the message. The identifiers of the messages of built-in contracts are the
        constants of <xref href="PostSharp.Patterns.Contracts.ContractLocalizedTextProvider" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public class ContractExceptionInfo
    content.vb: Public Class ContractExceptionInfo
