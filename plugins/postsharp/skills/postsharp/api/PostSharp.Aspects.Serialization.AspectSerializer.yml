  nameWithType: AspectSerializer
  fullName: PostSharp.Aspects.Serialization.AspectSerializer
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Serialization
  summary: >-
    Base class for all aspect serializers, whose role is to serialize aspect instances at compile time and

    deserialize them at runtime.
  remarks: >-
    The weaver chooses the serializer of an aspect class from the <xref href="PostSharp.Aspects.Configuration.AspectConfiguration.SerializerType" data-throw-if-not-resolved="false"></xref>

    configuration property or, when it is not set, from the aspect class. Aspect classes that have a nested <code>Serializer</code> type, which is

    generated for classes annotated with <xref href="PostSharp.Serialization.PSerializableAttribute" data-throw-if-not-resolved="false"></xref>, use <xref href="PostSharp.Aspects.Serialization.PortableAspectSerializer" data-throw-if-not-resolved="false"></xref>.

    When a class annotated with <xref href="PostSharp.Serialization.PSerializableAttribute" data-throw-if-not-resolved="false"></xref> has no such type, the build fails with the error <code>LA0157</code>. To build the aspect at

    run time instead of serializing it, use <xref href="PostSharp.Aspects.Serialization.MsilAspectSerializer" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public abstract class AspectSerializer
    content.vb: Public MustInherit Class AspectSerializer
