  summary: Binds a parameter of an advice method to the reflection object of the target declaration.
  remarks: >-
    <p>The value depends on the kind of advice and on the type of the parameter:</p>

    <ul><li>In a method boundary advice and in <xref href="PostSharp.Aspects.Advices.OnMethodInvokeAdvice" data-throw-if-not-resolved="false"></xref>, the value is the <xref href="System.Reflection.MethodBase" data-throw-if-not-resolved="false"></xref> of the
        target method. The parameter can be of type <xref href="System.Reflection.MethodBase" data-throw-if-not-resolved="false"></xref> or of a base type, of type <xref href="System.Reflection.MethodInfo" data-throw-if-not-resolved="false"></xref> when no target is
        a constructor, or of type <xref href="System.Reflection.ConstructorInfo" data-throw-if-not-resolved="false"></xref> when every target is a constructor. For an async method or an iterator, the value
        is the method declared in source code, not the <code>MoveNext</code> method of the state machine. For a generic method or a method of a generic
        type, the value is the method of the generic instance that is executing.</li><li>In a location advice, the value is the <xref href="PostSharp.Reflection.LocationInfo" data-throw-if-not-resolved="false"></xref> of the target field or property when the parameter can
        receive it, and its <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref> otherwise. The weaver encapsulates an intercepted field into a property, so a field
        is a property at run time, and a parameter of type <xref href="System.Reflection.FieldInfo" data-throw-if-not-resolved="false"></xref> is not accepted.</li><li>In <xref href="PostSharp.Aspects.Advices.OnInstanceConstructedAdvice" data-throw-if-not-resolved="false"></xref>, the value is the <xref href="System.Type" data-throw-if-not-resolved="false"></xref> of the target type.</li></ul>
    <p>The parameter cannot be <code>ref</code>, <code>in</code> or <code>out</code>. A parameter of type <xref href="System.Reflection.MethodInfo" data-throw-if-not-resolved="false"></xref> on a constructor, or of type
        <xref href="System.Reflection.ConstructorInfo" data-throw-if-not-resolved="false"></xref> on a method, causes an error.</p>
    <p>The reflection object is not looked up on each call: it is stored in a static field, except for a generic method or a method of a
        generic type, which is looked up on each call as <xref href="PostSharp.Aspects.MethodExecutionArgs.Method" data-throw-if-not-resolved="false"></xref> is.</p>
