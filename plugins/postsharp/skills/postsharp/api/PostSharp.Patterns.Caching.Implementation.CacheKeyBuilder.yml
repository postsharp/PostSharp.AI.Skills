  name: CacheKeyBuilder
  nameWithType: CacheKeyBuilder
  fullName: PostSharp.Patterns.Caching.Implementation.CacheKeyBuilder
  type: Class
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching.Implementation
  summary: Builds cache item keys and dependency keys.
  remarks: >-
    <p>A method key is made of the declaring type, the method name and its generic arguments, the <code>this</code> instance (unless
        <xref href="PostSharp.Patterns.Caching.CacheAttribute.IgnoreThisParameter" data-throw-if-not-resolved="false"></xref> is set) and, for each argument, the parameter type and the formatted value. Parameters annotated
        with <xref href="PostSharp.Patterns.Caching.NotCacheKeyAttribute" data-throw-if-not-resolved="false"></xref> keep their type, but their value is replaced
        by the <code>*</code> placeholder. Objects are formatted by the formatters of <xref href="PostSharp.Patterns.Caching.CachingServices.Formatters" data-throw-if-not-resolved="false"></xref>,
        which fall back to <xref href="System.Object.ToString" data-throw-if-not-resolved="false"></xref>.</p>
    <p>The key builder in use is <xref href="PostSharp.Patterns.Caching.CachingServices.DefaultKeyBuilder" data-throw-if-not-resolved="false"></xref>. To change the maximal key length or to compress long keys by hashing
        them, assign a new instance created with the appropriate constructor; key compression is recommended with the Redis backend. To change how
        keys are built, derive a class and override <xref href="PostSharp.Patterns.Caching.Implementation.CacheKeyBuilder.BuildMethodKey(System.Reflection.MethodInfo%2cSystem.Collections.Generic.IList%7bSystem.Object%7d%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Patterns.Caching.Implementation.CacheKeyBuilder.BuildDependencyKey(System.Object)" data-throw-if-not-resolved="false"></xref>, or the <code>Append</code> methods they use.</p>
  example: []
  syntax:
    content: 'public class CacheKeyBuilder : IDisposable'
    content.vb: Public Class CacheKeyBuilder Implements IDisposable
  seealso:
  - linkType: HRef
    linkId: '@caching-keys'
    altText: 'Conceptual: Customizing Cache Keys'
