- uid: PostSharp.Patterns.Diagnostics.LogRecordKindExtensions.IsStandalone(PostSharp.Patterns.Diagnostics.LogRecordKind)
  commentId: M:PostSharp.Patterns.Diagnostics.LogRecordKindExtensions.IsStandalone(PostSharp.Patterns.Diagnostics.LogRecordKind)
  id: IsStandalone(PostSharp.Patterns.Diagnostics.LogRecordKind)
  isExtensionMethod: true
  parent: PostSharp.Patterns.Diagnostics.LogRecordKindExtensions
  langs:
  - csharp
  - vb
  name: IsStandalone(LogRecordKind)
  nameWithType: LogRecordKindExtensions.IsStandalone(LogRecordKind)
  fullName: PostSharp.Patterns.Diagnostics.LogRecordKindExtensions.IsStandalone(PostSharp.Patterns.Diagnostics.LogRecordKind)
  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics
  summary: >-
    Determines whether a given <xref href="PostSharp.Patterns.Diagnostics.LogRecordKind" data-throw-if-not-resolved="false"></xref> represents a standalone record, that is, a record that does

    not have a corresponding opening or closing. For instance, a <xref href="PostSharp.Patterns.Diagnostics.LogRecordKind.CustomRecord" data-throw-if-not-resolved="false"></xref>

    is a standalone record.
  remarks: >-
    <p>
      <xref href="PostSharp.Patterns.Diagnostics.LogRecordKind.MethodException" data-throw-if-not-resolved="false"></xref> may represent a closing or a standalone record, depending on
        the context. This method shall return <code>false</code> for <xref href="PostSharp.Patterns.Diagnostics.LogRecordKind.MethodException" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public static bool IsStandalone(this LogRecordKind kind)
    parameters:
    - id: kind
      type: PostSharp.Patterns.Diagnostics.LogRecordKind
      description: A <xref href="PostSharp.Patterns.Diagnostics.LogRecordKind" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Boolean
      description: <code>true</code> if <code class="paramref">kind</code> is a standalone record, otherwise <code>false</code>.
    content.vb: Public Shared Function IsStandalone(kind As LogRecordKind) As Boolean
  overload: PostSharp.Patterns.Diagnostics.LogRecordKindExtensions.IsStandalone*
