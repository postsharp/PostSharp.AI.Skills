  namespace: PostSharp.Patterns.Threading.Models
  summary: >-
    The <xref href="PostSharp.Patterns.Threading.Models.ThreadUnsafeThreadingModel" data-throw-if-not-resolved="false"></xref> class describes a threading model in which an object cannot be accessed concurrently by several threads.

    In case of concurrent access, a <xref href="PostSharp.Patterns.Threading.ConcurrentAccessException" data-throw-if-not-resolved="false"></xref> is thrown. The thread-unsafe threading model is not strictly

    a model, because it cannot be deterministically verified.

    To use the <xref href="PostSharp.Patterns.Threading.Models.ThreadAffineThreadingModel" data-throw-if-not-resolved="false"></xref>, apply the <xref href="PostSharp.Patterns.Threading.ThreadUnsafeAttribute" data-throw-if-not-resolved="false"></xref> custom attribute to a class.
