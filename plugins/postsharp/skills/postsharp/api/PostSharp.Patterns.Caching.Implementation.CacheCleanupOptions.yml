- uid: PostSharp.Patterns.Caching.Implementation.CacheCleanupOptions.RemediationDelay
  commentId: P:PostSharp.Patterns.Caching.Implementation.CacheCleanupOptions.RemediationDelay
  id: RemediationDelay
  parent: PostSharp.Patterns.Caching.Implementation.CacheCleanupOptions
  langs:
  - csharp
  - vb
  name: RemediationDelay
  nameWithType: CacheCleanupOptions.RemediationDelay
  fullName: PostSharp.Patterns.Caching.Implementation.CacheCleanupOptions.RemediationDelay
  type: Property
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching.Implementation
  summary: Gets or sets the delay between the moment an inconsistency is detected and the moment a remediation is attempted. The default value is 10 seconds.
  remarks: >-
    In distributed caching, there can be a slight delay before changes are replicated to all nodes.

    These inconsistencies are harmless. Therefore, when a problem is found, the consistency is tested a second time after a delay.
  example: []
  syntax:
    content: public TimeSpan RemediationDelay { get; set; }
    parameters: []
    return:
      type: System.TimeSpan
    content.vb: Public Property RemediationDelay As TimeSpan
  overload: PostSharp.Patterns.Caching.Implementation.CacheCleanupOptions.RemediationDelay*
