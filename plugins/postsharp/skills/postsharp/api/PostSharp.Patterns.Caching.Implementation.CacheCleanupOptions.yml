  name: CacheCleanupOptions
  nameWithType: CacheCleanupOptions
  fullName: PostSharp.Patterns.Caching.Implementation.CacheCleanupOptions
  type: Class
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching.Implementation
  summary: Options for the <xref href="PostSharp.Patterns.Caching.Implementation.CachingBackend.CleanUpAsync(PostSharp.Patterns.Caching.Implementation.CacheCleanupOptions%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> method.
  remarks: >-
    <p>Of the built-in backends, only the Redis backend with dependencies enabled implements the cleanup. These options apply both when you call
        <xref href="PostSharp.Patterns.Caching.Implementation.CachingBackend.CleanUpAsync(PostSharp.Patterns.Caching.Implementation.CacheCleanupOptions%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> and to the periodic cleanup of <code>RedisCacheDependencyGarbageCollector</code>, which takes them from
        its own options.</p>
    <p>The <xref href="PostSharp.Patterns.Caching.Implementation.CacheCleanupOptions.Default" data-throw-if-not-resolved="false"></xref> options process keys without delay and with a concurrency of 20, which favors cleanup speed and can overload
        a production server. On a production database, set a non-zero <xref href="PostSharp.Patterns.Caching.Implementation.CacheCleanupOptions.WaitDelay" data-throw-if-not-resolved="false"></xref> and a lower <xref href="PostSharp.Patterns.Caching.Implementation.CacheCleanupOptions.MaxConcurrency" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public sealed class CacheCleanupOptions
    content.vb: Public NotInheritable Class CacheCleanupOptions
