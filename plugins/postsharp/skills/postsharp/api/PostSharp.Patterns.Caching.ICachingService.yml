  langs:
  - csharp
  - vb
  name: ICachingService
  nameWithType: ICachingService
  fullName: PostSharp.Patterns.Caching.ICachingService
  type: Interface
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching
  summary: >-
    Represents a cache: the backend that stores the items, the key builder that computes their keys, the caching profiles, and the

    operations that the caching aspects call. The default implementation is <xref href="PostSharp.Patterns.Caching.CachingService" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>A class receives an <xref href="PostSharp.Patterns.Caching.ICachingService" data-throw-if-not-resolved="false"></xref> from a dependency injection container when its assembly, its declaring type or a base type has a
            <xref href="PostSharp.Patterns.Caching.CacheConfigurationAttribute" data-throw-if-not-resolved="false"></xref> whose <xref href="PostSharp.Patterns.Caching.CacheConfigurationAttribute.UseDependencyInjection" data-throw-if-not-resolved="false"></xref> property is <code>true</code>.
            Otherwise, the cached methods use <xref href="PostSharp.Patterns.Caching.CachingServices.DefaultService" data-throw-if-not-resolved="false"></xref>.</p>
    <p>The formatters (<xref href="PostSharp.Patterns.Caching.CachingServices.Formatters" data-throw-if-not-resolved="false"></xref>) and the caching context (<xref href="PostSharp.Patterns.Caching.CachingServices.CurrentContext" data-throw-if-not-resolved="false"></xref>) are shared
            by all the services of the process.</p>
  example: []
  syntax:
    content: public interface ICachingService
    content.vb: Public Interface ICachingService
  seealso:
  - linkType: HRef
    linkId: '@caching-dependency-injection'
    altText: 'Conceptual: Using Caching with Dependency Injection'
  derivedClasses:
  - PostSharp.Patterns.Caching.CachingService
- uid: PostSharp.Patterns.Caching.ICachingService.GetOrAdd(System.Reflection.MethodInfo,System.String,System.Type,PostSharp.Patterns.Caching.Implementation.CacheItemConfiguration,System.Func{System.Object},PostSharp.Patterns.Diagnostics.LogSource)
  commentId: M:PostSharp.Patterns.Caching.ICachingService.GetOrAdd(System.Reflection.MethodInfo,System.String,System.Type,PostSharp.Patterns.Caching.Implementation.CacheItemConfiguration,System.Func{System.Object},PostSharp.Patterns.Diagnostics.LogSource)
  id: GetOrAdd(System.Reflection.MethodInfo,System.String,System.Type,PostSharp.Patterns.Caching.Implementation.CacheItemConfiguration,System.Func{System.Object},PostSharp.Patterns.Diagnostics.LogSource)
  parent: PostSharp.Patterns.Caching.ICachingService
  langs:
  - csharp
  - vb
  name: GetOrAdd(MethodInfo, string, Type, CacheItemConfiguration, Func<object>, LogSource)
  nameWithType: ICachingService.GetOrAdd(MethodInfo, string, Type, CacheItemConfiguration, Func<object>, LogSource)
  fullName: PostSharp.Patterns.Caching.ICachingService.GetOrAdd(System.Reflection.MethodInfo, string, System.Type, PostSharp.Patterns.Caching.Implementation.CacheItemConfiguration, System.Func<object>, PostSharp.Patterns.Diagnostics.LogSource)
  type: Method
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching
  summary: >-
    Gets a value from the cache or, when the cache has no item for the key, evaluates the value, adds it to the cache and returns it.

    The <xref href="PostSharp.Patterns.Caching.CacheAttribute" data-throw-if-not-resolved="false"></xref> aspect calls this method.
  example: []
  syntax:
    content: object GetOrAdd(MethodInfo method, string key, Type valueType, CacheItemConfiguration configuration, Func<object> valueProvider, LogSource logger)
    parameters:
    - id: method
      type: System.Reflection.MethodInfo
      description: The cached method.
    - id: key
      type: System.String
      description: The cache key, computed by <xref href="PostSharp.Patterns.Caching.ICachingService.KeyBuilder" data-throw-if-not-resolved="false"></xref>.
    - id: valueType
      type: System.Type
      description: The type of the cached value.
    - id: configuration
      type: PostSharp.Patterns.Caching.Implementation.CacheItemConfiguration
      description: The configuration of the cached method, already merged with its profile.
    - id: valueProvider
      type: System.Func{System.Object}
      description: A delegate that evaluates the value.
    - id: logger
      type: PostSharp.Patterns.Diagnostics.LogSource
      description: The <xref href="PostSharp.Patterns.Diagnostics.LogSource" data-throw-if-not-resolved="false"></xref> of the declaring type of the cached method.
    return:
      type: System.Object
      description: The cached or evaluated value.
    content.vb: Function GetOrAdd(method As MethodInfo, key As String, valueType As Type, configuration As CacheItemConfiguration, valueProvider As Func(Of Object), logger As LogSource) As Object
  overload: PostSharp.Patterns.Caching.ICachingService.GetOrAdd*
  nameWithType.vb: ICachingService.GetOrAdd(MethodInfo, String, Type, CacheItemConfiguration, Func(Of Object), LogSource)
  fullName.vb: PostSharp.Patterns.Caching.ICachingService.GetOrAdd(System.Reflection.MethodInfo, String, System.Type, PostSharp.Patterns.Caching.Implementation.CacheItemConfiguration, System.Func(Of Object), PostSharp.Patterns.Diagnostics.LogSource)
  name.vb: GetOrAdd(MethodInfo, String, Type, CacheItemConfiguration, Func(Of Object), LogSource)
- uid: PostSharp.Patterns.Caching.ICachingService.GetOrAddAsync(System.Reflection.MethodInfo,System.String,System.Type,PostSharp.Patterns.Caching.Implementation.CacheItemConfiguration,System.Func{System.Threading.Tasks.Task{System.Object}},PostSharp.Patterns.Diagnostics.LogSource,System.Threading.CancellationToken)
  commentId: M:PostSharp.Patterns.Caching.ICachingService.GetOrAddAsync(System.Reflection.MethodInfo,System.String,System.Type,PostSharp.Patterns.Caching.Implementation.CacheItemConfiguration,System.Func{System.Threading.Tasks.Task{System.Object}},PostSharp.Patterns.Diagnostics.LogSource,System.Threading.CancellationToken)
  id: GetOrAddAsync(System.Reflection.MethodInfo,System.String,System.Type,PostSharp.Patterns.Caching.Implementation.CacheItemConfiguration,System.Func{System.Threading.Tasks.Task{System.Object}},PostSharp.Patterns.Diagnostics.LogSource,System.Threading.CancellationToken)
  parent: PostSharp.Patterns.Caching.ICachingService
  langs:
  - csharp
  - vb
  name: GetOrAddAsync(MethodInfo, string, Type, CacheItemConfiguration, Func<Task<object>>, LogSource, CancellationToken)
  nameWithType: ICachingService.GetOrAddAsync(MethodInfo, string, Type, CacheItemConfiguration, Func<Task<object>>, LogSource, CancellationToken)
  fullName: PostSharp.Patterns.Caching.ICachingService.GetOrAddAsync(System.Reflection.MethodInfo, string, System.Type, PostSharp.Patterns.Caching.Implementation.CacheItemConfiguration, System.Func<System.Threading.Tasks.Task<object>>, PostSharp.Patterns.Diagnostics.LogSource, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching
  summary: >-
    Asynchronously gets a value from the cache or, when the cache has no item for the key, evaluates the value, adds it to the cache and returns it.

    The <xref href="PostSharp.Patterns.Caching.CacheAttribute" data-throw-if-not-resolved="false"></xref> aspect calls this method for asynchronous methods.
  example: []
  syntax:
    content: Task<object> GetOrAddAsync(MethodInfo method, string key, Type valueType, CacheItemConfiguration configuration, Func<Task<object>> valueProvider, LogSource logger, CancellationToken cancellationToken)
    parameters:
    - id: method
      type: System.Reflection.MethodInfo
      description: The cached method.
    - id: key
      type: System.String
      description: The cache key, computed by <xref href="PostSharp.Patterns.Caching.ICachingService.KeyBuilder" data-throw-if-not-resolved="false"></xref>.
    - id: valueType
      type: System.Type
      description: The type of the cached value, i.e. the type of the result of the task.
    - id: configuration
      type: PostSharp.Patterns.Caching.Implementation.CacheItemConfiguration
      description: The configuration of the cached method, already merged with its profile.
    - id: valueProvider
      type: System.Func{System.Threading.Tasks.Task{System.Object}}
      description: A delegate that evaluates the value.
    - id: logger
      type: PostSharp.Patterns.Diagnostics.LogSource
      description: The <xref href="PostSharp.Patterns.Diagnostics.LogSource" data-throw-if-not-resolved="false"></xref> of the declaring type of the cached method.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A <xref href="System.Threading.CancellationToken" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Threading.Tasks.Task{System.Object}
      description: A <xref href="System.Threading.Tasks.Task%601" data-throw-if-not-resolved="false"></xref> that evaluates to the cached or evaluated value.
    content.vb: Function GetOrAddAsync(method As MethodInfo, key As String, valueType As Type, configuration As CacheItemConfiguration, valueProvider As Func(Of Task(Of Object)), logger As LogSource, cancellationToken As CancellationToken) As Task(Of Object)
  overload: PostSharp.Patterns.Caching.ICachingService.GetOrAddAsync*
  nameWithType.vb: ICachingService.GetOrAddAsync(MethodInfo, String, Type, CacheItemConfiguration, Func(Of Task(Of Object)), LogSource, CancellationToken)
  fullName.vb: PostSharp.Patterns.Caching.ICachingService.GetOrAddAsync(System.Reflection.MethodInfo, String, System.Type, PostSharp.Patterns.Caching.Implementation.CacheItemConfiguration, System.Func(Of System.Threading.Tasks.Task(Of Object)), PostSharp.Patterns.Diagnostics.LogSource, System.Threading.CancellationToken)
  name.vb: GetOrAddAsync(MethodInfo, String, Type, CacheItemConfiguration, Func(Of Task(Of Object)), LogSource, CancellationToken)
- uid: PostSharp.Patterns.Caching.ICachingService.Invalidate(System.Reflection.MethodInfo,System.Object,System.Object[])
  commentId: M:PostSharp.Patterns.Caching.ICachingService.Invalidate(System.Reflection.MethodInfo,System.Object,System.Object[])
