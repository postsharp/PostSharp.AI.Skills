  name: Invalidate(MethodInfo, object, params object[])
  nameWithType: ICachingService.Invalidate(MethodInfo, object, params object[])
  fullName: PostSharp.Patterns.Caching.ICachingService.Invalidate(System.Reflection.MethodInfo, object, params object[])
  type: Method
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching
  summary: >-
    Removes a method call result from the cache, using the <xref href="System.Reflection.MethodInfo" data-throw-if-not-resolved="false"></xref> that represents the method, the instance and the arguments

    of the method call. The <xref href="PostSharp.Patterns.Caching.InvalidateCacheAttribute" data-throw-if-not-resolved="false"></xref> aspect calls this method.
  example: []
  syntax:
    content: void Invalidate(MethodInfo method, object instance, params object[] args)
    parameters:
    - id: method
      type: System.Reflection.MethodInfo
      description: The <xref href="System.Reflection.MethodInfo" data-throw-if-not-resolved="false"></xref> of the method call.
    - id: instance
      type: System.Object
      description: The value of the <code>this</code> instance, or <code>null</code> for static methods.
    - id: args
      type: System.Object[]
      description: The method arguments.
    content.vb: Sub Invalidate(method As MethodInfo, instance As Object, ParamArray args As Object())
  overload: PostSharp.Patterns.Caching.ICachingService.Invalidate*
  nameWithType.vb: ICachingService.Invalidate(MethodInfo, Object, ParamArray Object())
  fullName.vb: PostSharp.Patterns.Caching.ICachingService.Invalidate(System.Reflection.MethodInfo, Object, ParamArray Object())
  name.vb: Invalidate(MethodInfo, Object, ParamArray Object())
