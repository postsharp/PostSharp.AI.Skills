  name: ICorrelationProtocol
  nameWithType: ICorrelationProtocol
  fullName: PostSharp.Patterns.Diagnostics.Correlation.ICorrelationProtocol
  type: Interface
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Correlation
  summary: >-
    Defines the semantics of the request correlation protocol in distributed logging. The protocol adds headers to outgoing requests and interprets headers

    in incoming requests.
  remarks: >-
    <p>The only available implementation is <xref href="PostSharp.Patterns.Diagnostics.Correlation.LegacyHttpCorrelationProtocol" data-throw-if-not-resolved="false"></xref>. You can also implement the interface, either from
        scratch or by calling an existing implementation in a chain of responsibility.</p>
    <p>Pass an implementation to the instrumentation of ASP.NET, ASP.NET Core or <code>HttpClient</code> to correlate the log records of the client
        and of the server of a request. Use the same protocol on both sides.</p>
    <p>The headers of an incoming request cannot be trusted before the request is authenticated. On a public service, filter the requests
        whose headers are processed, for instance by wrapping an existing implementation with your own security checks.</p>
  example: []
  syntax:
    content: public interface ICorrelationProtocol
    content.vb: Public Interface ICorrelationProtocol
  seealso:
  - linkType: HRef
    linkId: '@distributed-logging'
    altText: 'Conceptual: Logging in a Distributed System'
  - linkType: HRef
    linkId: '@logging-instrumentation'
    altText: 'Conceptual: Instrumentation of ASP.NET and HttpClient'
  derivedClasses:
