- uid: PostSharp.Aspects.Advices.ImportLocationAdviceInstance.#ctor(System.Reflection.FieldInfo,PostSharp.Reflection.LocationInfo)
  commentId: M:PostSharp.Aspects.Advices.ImportLocationAdviceInstance.#ctor(System.Reflection.FieldInfo,PostSharp.Reflection.LocationInfo)
  id: '#ctor(System.Reflection.FieldInfo,PostSharp.Reflection.LocationInfo)'
  parent: PostSharp.Aspects.Advices.ImportLocationAdviceInstance
  langs:
  - csharp
  - vb
  name: ImportLocationAdviceInstance(FieldInfo, LocationInfo)
  nameWithType: ImportLocationAdviceInstance.ImportLocationAdviceInstance(FieldInfo, LocationInfo)
  fullName: PostSharp.Aspects.Advices.ImportLocationAdviceInstance.ImportLocationAdviceInstance(System.Reflection.FieldInfo, PostSharp.Reflection.LocationInfo)
  type: Constructor
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Initializes a new instance of the <xref href="PostSharp.Aspects.Advices.ImportLocationAdviceInstance" data-throw-if-not-resolved="false"></xref> class and specifies which field or property should be imported by giving its reflection representation.
  example: []
  syntax:
    content: public ImportLocationAdviceInstance(FieldInfo aspectField, LocationInfo location)
    parameters:
    - id: aspectField
      type: System.Reflection.FieldInfo
      description: >-
        The field of the aspect class to which <code class="paramref">location</code> should be bound at runtime.
                        This field can be of type <xref href="PostSharp.Aspects.ILocationBinding" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.Property%601" data-throw-if-not-resolved="false"></xref>, or a type that both (a) derives from <code>ICollection&lt;ILocationBinding&gt;</code> and (b) has a parameterless constructor.
                        A field of the target class cannot be imported into a <xref href="PostSharp.Aspects.Advices.Property%601" data-throw-if-not-resolved="false"></xref> field.
    - id: location
      type: PostSharp.Reflection.LocationInfo
      description: The field or property to import.
    content.vb: Public Sub New(aspectField As FieldInfo, location As LocationInfo)
  overload: PostSharp.Aspects.Advices.ImportLocationAdviceInstance.#ctor*
  nameWithType.vb: ImportLocationAdviceInstance.New(FieldInfo, LocationInfo)
  fullName.vb: PostSharp.Aspects.Advices.ImportLocationAdviceInstance.New(System.Reflection.FieldInfo, PostSharp.Reflection.LocationInfo)
  name.vb: New(FieldInfo, LocationInfo)
- uid: PostSharp.Aspects.Advices.ImportLocationAdviceInstance.#ctor(System.Reflection.FieldInfo,System.String,System.Boolean,PostSharp.Aspects.Advices.ImportMemberOrder)
  commentId: M:PostSharp.Aspects.Advices.ImportLocationAdviceInstance.#ctor(System.Reflection.FieldInfo,System.String,System.Boolean,PostSharp.Aspects.Advices.ImportMemberOrder)
  id: '#ctor(System.Reflection.FieldInfo,System.String,System.Boolean,PostSharp.Aspects.Advices.ImportMemberOrder)'
  parent: PostSharp.Aspects.Advices.ImportLocationAdviceInstance
  langs:
  - csharp
  - vb
  name: ImportLocationAdviceInstance(FieldInfo, string, bool, ImportMemberOrder)
  nameWithType: ImportLocationAdviceInstance.ImportLocationAdviceInstance(FieldInfo, string, bool, ImportMemberOrder)
  fullName: PostSharp.Aspects.Advices.ImportLocationAdviceInstance.ImportLocationAdviceInstance(System.Reflection.FieldInfo, string, bool, PostSharp.Aspects.Advices.ImportMemberOrder)
  type: Constructor
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Initializes a new instance of the <xref href="PostSharp.Aspects.Advices.ImportLocationAdviceInstance" data-throw-if-not-resolved="false"></xref> class and specifies the name of the property to be imported.

    The type of this property is matched according to the type of the aspect field.
  example: []
  syntax:
    content: public ImportLocationAdviceInstance(FieldInfo aspectField, string propertyName, bool isRequired = false, ImportMemberOrder order = ImportMemberOrder.AfterIntroductions)
    parameters:
    - id: aspectField
      type: System.Reflection.FieldInfo
      description: >-
        The field of the aspect class to which the field or property should be bound at build time.
                        This field must be of type <xref href="PostSharp.Aspects.Advices.Property%601" data-throw-if-not-resolved="false"></xref>.
    - id: propertyName
      type: System.String
      description: The name of the property to import.
    - id: isRequired
      type: System.Boolean
      description: >-
        Determines whether a build-time error should be emitted if the member cannot be found.
                    If <code>false</code>, the binding field is <code>null</code> when the imported member is absent.
    - id: order
      type: PostSharp.Aspects.Advices.ImportMemberOrder
      description: >-
        Determines whether the <code class="paramref">aspectField</code> should be bound to the member
                    as resolved before or after introduction of new members into the target class by the current advice.
    content.vb: Public Sub New(aspectField As FieldInfo, propertyName As String, isRequired As Boolean = False, order As ImportMemberOrder = ImportMemberOrder.AfterIntroductions)
  overload: PostSharp.Aspects.Advices.ImportLocationAdviceInstance.#ctor*
