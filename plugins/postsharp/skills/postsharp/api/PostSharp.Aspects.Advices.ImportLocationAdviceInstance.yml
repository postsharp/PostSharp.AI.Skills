  name: ImportLocationAdviceInstance
  nameWithType: ImportLocationAdviceInstance
  fullName: PostSharp.Aspects.Advices.ImportLocationAdviceInstance
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Represents an advice that imports a field or property (represented by a <xref href="PostSharp.Reflection.LocationInfo" data-throw-if-not-resolved="false"></xref>) of the target class

    into a field of the aspect class. This class is the imperative equivalent of the <xref href="PostSharp.Aspects.Advices.ImportMemberAttribute" data-throw-if-not-resolved="false"></xref> declarative advice.
  remarks: >-
    <p>Return instances of this class from <xref href="PostSharp.Aspects.Advices.IAdviceProvider.ProvideAdvices(System.Object)" data-throw-if-not-resolved="false"></xref>. Unlike <xref href="PostSharp.Aspects.Advices.ImportMemberAttribute" data-throw-if-not-resolved="false"></xref>,
        this advice can import several fields or properties into a single aspect field: declare the field as a collection of
        <xref href="PostSharp.Aspects.ILocationBinding" data-throw-if-not-resolved="false"></xref>, as described in the <xref href="PostSharp.Aspects.Advices.ImportLocationAdviceInstance.%23ctor(System.Reflection.FieldInfo%2cPostSharp.Reflection.LocationInfo)" data-throw-if-not-resolved="false"></xref> constructor,
        and return one advice per field or property.</p>
  example: []
  syntax:
    content: 'public sealed class ImportLocationAdviceInstance : ImportMemberAdviceInstance'
    content.vb: Public NotInheritable Class ImportLocationAdviceInstance Inherits ImportMemberAdviceInstance
  seealso:
