  name: ThreadSafetyPolicy
  nameWithType: ThreadSafetyPolicy
  fullName: PostSharp.Patterns.Threading.ThreadSafetyPolicy
  type: Class
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: When applied to an assembly, this policy will check for possible concurrency issues.
  remarks: >-
    <p>
            This policy recognizes the following concurrency issues:
          </p>
    <ul><li>Type is not thread-safe.</li><li>Static field is not read-only.</li><li>Type of static field is not thread-safe.</li></ul>

    <p>
            A type is considered thread-safe if it has no instance fields, if it has a threading model (an aspect derived from <xref href="PostSharp.Patterns.Threading.ThreadAwareAttribute" data-throw-if-not-resolved="false"></xref>),
            if it is annotated with <xref href="PostSharp.Patterns.Threading.ExplicitlySynchronizedAttribute" data-throw-if-not-resolved="false"></xref>, or if the type analyzer of the threading library recognizes it as thread-safe.
            Value types, custom attribute classes and compiler-generated types are not checked. Static fields annotated with
            <xref href="PostSharp.Patterns.Threading.ExplicitlySynchronizedAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="System.ThreadStaticAttribute" data-throw-if-not-resolved="false"></xref> are not checked.
          </p>
    <p>
            A type declared in a referenced assembly has a threading model only if PostSharp processed that assembly. The policy does not see
            <xref href="PostSharp.Patterns.Threading.ExplicitlySynchronizedAttribute" data-throw-if-not-resolved="false"></xref> on a type of a referenced assembly, because this attribute is not kept in the compiled assembly.
            Annotate the static field with <xref href="PostSharp.Patterns.Threading.ExplicitlySynchronizedAttribute" data-throw-if-not-resolved="false"></xref> instead.
          </p>
    <p>
            The policy only emits warnings: it reminds you to assign a threading model to each class, but does not make the code thread-safe by itself.
            To apply the policy to all projects of a solution, add it as a multicast attribute to the <code>pssln</code> file.
          </p>
  example: []
  syntax:
    content: >-
      [MulticastAttributeUsage(MulticastTargets.Assembly)]

      [AttributeUsage(AttributeTargets.Assembly)]

      public sealed class ThreadSafetyPolicy : ScalarConstraint, IScalarConstraint, IConstraint
