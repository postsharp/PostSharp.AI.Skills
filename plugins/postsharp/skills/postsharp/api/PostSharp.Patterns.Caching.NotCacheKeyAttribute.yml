  fullName: PostSharp.Patterns.Caching.NotCacheKeyAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching
  summary: >-
    Custom attribute that, when applied to a parameter of a cached method (i.e. a method enhanced by the <xref href="PostSharp.Patterns.Caching.CacheAttribute" data-throw-if-not-resolved="false"></xref> aspect),

    excludes this parameter from the cache key.
  remarks: >-
    <p>Calls that differ only by the value of an excluded parameter share the same cache item. An <xref href="PostSharp.Patterns.Caching.InvalidateCacheAttribute" data-throw-if-not-resolved="false"></xref> does not
        need a matching parameter for an excluded parameter. To exclude the <code>this</code> instance from the cache key, set
        <xref href="PostSharp.Patterns.Caching.CacheAttribute.IgnoreThisParameter" data-throw-if-not-resolved="false"></xref> instead.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Parameter)]

      public sealed class NotCacheKeyAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Parameter)>

      Public NotInheritable Class NotCacheKeyAttribute Inherits Attribute
