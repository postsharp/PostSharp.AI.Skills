  summary: Adds a handler to the <code>PropertyChanging</code> event.
  remarks: <p>An implementation should never return <code>null</code>. Instead, it should return the result of <code>this.Next.AddHandler</code>.</p>
  example: []
  syntax:
    content: public abstract Delegate AddHandler(object instance, Action<string> handler)
    parameters:
    - id: instance
      type: System.Object
      description: The instance.
    - id: handler
      type: System.Action{System.String}
      description: The handler delegate that receives the property name as an argument.
    return:
      type: System.Delegate
      description: The <xref href="System.Delegate" data-throw-if-not-resolved="false"></xref> that was registered to the event, or <code>null</code> if <code class="paramref">instance</code> does not implement the represented interface.
