- uid: PostSharp.Aspects.AspectInstance.RepresentAsStandalone
  commentId: P:PostSharp.Aspects.AspectInstance.RepresentAsStandalone
  id: RepresentAsStandalone
  parent: PostSharp.Aspects.AspectInstance
  langs:
  - csharp
  - vb
  name: RepresentAsStandalone
  nameWithType: AspectInstance.RepresentAsStandalone
  fullName: PostSharp.Aspects.AspectInstance.RepresentAsStandalone
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Gets or sets a value indicating whether the <xref href="PostSharp.Aspects.AspectInstance" data-throw-if-not-resolved="false"></xref> should be represented as a standalone instance

    in PostSharp Tools for Visual Studio. If <code>false</code>, the current <xref href="PostSharp.Aspects.AspectInstance" data-throw-if-not-resolved="false"></xref>

    will not be represented as a standalone node, and its advices will be merged with the ones provided 

    by the parent aspect (implementing <xref href="PostSharp.Aspects.IAspectProvider" data-throw-if-not-resolved="false"></xref>). The default value is <code>false</code>.
  example: []
  syntax:
    content: public bool RepresentAsStandalone { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property RepresentAsStandalone As Boolean
  overload: PostSharp.Aspects.AspectInstance.RepresentAsStandalone*
