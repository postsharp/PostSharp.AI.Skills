  name: AspectInstance
  nameWithType: AspectInstance
  fullName: PostSharp.Aspects.AspectInstance
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Completely specifies an aspect instance, including its target code element. An <xref href="PostSharp.Aspects.AspectInstance" data-throw-if-not-resolved="false"></xref>

    contains either the aspect instance itself (<xref href="PostSharp.Aspects.Aspect" data-throw-if-not-resolved="false"></xref> property), or the information needed to construct the aspect 

    (<xref href="PostSharp.Aspects.AspectSpecification.AspectConstruction" data-throw-if-not-resolved="false"></xref>) and to configure the weaver (<xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref>).
  remarks: >-
    <p>Instances of this class are returned by <xref href="PostSharp.Aspects.IAspectProvider.ProvideAspects(System.Object)" data-throw-if-not-resolved="false"></xref> to add aspects
            to declarations programmatically, at build time.</p>
  example: []
  syntax:
    content: 'public sealed class AspectInstance : AspectSpecification'
    content.vb: Public NotInheritable Class AspectInstance Inherits AspectSpecification
  seealso:
