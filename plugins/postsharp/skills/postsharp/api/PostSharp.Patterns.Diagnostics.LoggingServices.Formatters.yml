  summary: Provides access to the formatters used by logging. All members of this class are static.
  remarks: >-
    <p>A formatter determines how values, for instance parameter values, are rendered in log records. To use a custom formatter for a type
        that you do not own, derive a class from <xref href="PostSharp.Patterns.Formatters.Formatter%601" data-throw-if-not-resolved="false"></xref> and register an instance with the
        <xref href="PostSharp.Patterns.Formatters.FormatterRepository%601.Register%60%601(PostSharp.Patterns.Formatters.IFormatter%7b%60%600%7d)" data-throw-if-not-resolved="false"></xref> method of this class. A type that you own can instead implement
        <xref href="PostSharp.Patterns.Formatters.IFormattable" data-throw-if-not-resolved="false"></xref>, which needs no registration.</p>
  example: []
  syntax:
    content: 'public class LoggingServices.Formatters : FormatterRepository<LoggingFormattingRole>'
    content.vb: Public Class LoggingServices.Formatters Inherits FormatterRepository(Of LoggingFormattingRole)
  seealso:
