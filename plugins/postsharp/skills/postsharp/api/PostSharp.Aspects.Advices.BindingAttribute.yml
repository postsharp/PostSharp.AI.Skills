  summary: Binds a parameter of an interception advice to the binding object, which invokes the next node in the chain of interceptions of the target.
  remarks: >-
    <p>
        In <xref href="PostSharp.Aspects.Advices.OnLocationGetValueAdvice" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.Advices.OnLocationSetValueAdvice" data-throw-if-not-resolved="false"></xref>, the parameter receives the <xref href="PostSharp.Aspects.ILocationBinding%601" data-throw-if-not-resolved="false"></xref>
        of the field or property; its type must be <xref href="PostSharp.Aspects.ILocationBinding%601" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.ILocationBinding" data-throw-if-not-resolved="false"></xref>, or a type parameter of the advice
        method. In <xref href="PostSharp.Aspects.Advices.OnMethodInvokeAdvice" data-throw-if-not-resolved="false"></xref>, the parameter receives the method binding of the target method.
        </p>
    <p>
        The binding object is a singleton, so binding it does not allocate memory. The parameter cannot be <code>ref</code>, <code>in</code> or <code>out</code>. This attribute can be
        used only in <xref href="PostSharp.Aspects.Advices.OnMethodInvokeAdvice" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.OnLocationGetValueAdvice" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.Advices.OnLocationSetValueAdvice" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: 'public sealed class BindingAttribute : AdviceParameterAttribute'
    content.vb: Public NotInheritable Class BindingAttribute Inherits AdviceParameterAttribute
