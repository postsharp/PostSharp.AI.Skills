  namespace: PostSharp.Patterns.Diagnostics.Backends.Log4Net
  summary: Logging backend for log4net.
  remarks: >-
    <p>To use this backend, configure log4net, then assign a new instance to <xref href="PostSharp.Patterns.Diagnostics.LoggingServices.DefaultBackend" data-throw-if-not-resolved="false"></xref> when the
        application starts. To also route the events that your code logs directly with log4net through PostSharp Logging, call
        <xref href="PostSharp.Patterns.Diagnostics.Backends.Log4Net.Log4NetCollectingRepositorySelector.RedirectLoggingToPostSharp" data-throw-if-not-resolved="false"></xref> and pass the relay repository it returns to the
        constructor of this class.</p>
  example: []
  syntax:
    content: 'public class Log4NetLoggingBackend : TextLoggingBackend, IDisposable'
    content.vb: Public Class Log4NetLoggingBackend Inherits TextLoggingBackend Implements IDisposable
