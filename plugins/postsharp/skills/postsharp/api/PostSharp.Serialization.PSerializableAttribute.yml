  fullName: PostSharp.Serialization.PSerializableAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Serialization
  summary: Custom attribute that, when applied to a type, causes PostSharp to generate a serializer for use by the <xref href="PostSharp.Serialization.PortableFormatter" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>Fields that should not be serialized must be annotated with <xref href="PostSharp.Serialization.PNonSerializedAttribute" data-throw-if-not-resolved="false"></xref>.</p>

    <p>This class inherits from <xref href="PostSharp.Extensibility.MulticastAttribute" data-throw-if-not-resolved="false"></xref>, so it is possible to use multicasting to
        add this aspect to several classes using a single line, or to add this aspect to derived classes through inheritance.</p>
    <p>Aspects are instantiated at build time, serialized into the assembly, and deserialized at run time, so aspect classes and the types
        of their serialized fields must be serializable. Annotating an aspect class with <xref href="PostSharp.Serialization.PSerializableAttribute" data-throw-if-not-resolved="false"></xref> selects
        the default serialization strategy, <xref href="PostSharp.Aspects.Serialization.PortableAspectSerializer" data-throw-if-not-resolved="false"></xref>. Annotating an aspect class with
        <xref href="System.SerializableAttribute" data-throw-if-not-resolved="false"></xref> instead selects binary serialization, which is considered insecure, and causes the build error <code>LA0206</code> unless the <code>PostSharpBinaryFormatterAllowed</code> MSBuild property is set to <code>true</code>.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Class|AttributeTargets.Struct)]

      [MulticastAttributeUsage(MulticastTargets.Class|MulticastTargets.Struct)]

      [RequirePostSharp(null, "PortableSerializer")]

      [LinesOfCodeAvoided(0)]

      public sealed class PSerializableAttribute : MulticastAttribute, IAspect
    content.vb: >-
      <AttributeUsage(AttributeTargets.AssemblyOrAttributeTargets.ClassOrAttributeTargets.Struct)>

      <MulticastAttributeUsage(MulticastTargets.ClassOrMulticastTargets.Struct)>

      <RequirePostSharp(Nothing, "PortableSerializer")>

      <LinesOfCodeAvoided(0)>

      Public NotInheritable Class PSerializableAttribute Inherits MulticastAttribute Implements IAspect
