- uid: PostSharp.Patterns.Diagnostics.LoggingServices.GetSource(System.String,System.Type)
  commentId: M:PostSharp.Patterns.Diagnostics.LoggingServices.GetSource(System.String,System.Type)
  id: GetSource(System.String,System.Type)
  parent: PostSharp.Patterns.Diagnostics.LoggingServices
  langs:
  - csharp
  - vb
  name: GetSource(string, Type)
  nameWithType: LoggingServices.GetSource(string, Type)
  fullName: PostSharp.Patterns.Diagnostics.LoggingServices.GetSource(string, System.Type)
  type: Method
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics
  summary: Returns a <xref href="PostSharp.Patterns.Diagnostics.LoggingTypeSource" data-throw-if-not-resolved="false"></xref> for the given role and type.
  remarks: >-
    <p>This method returns a <xref href="PostSharp.Patterns.Diagnostics.LoggingTypeSource" data-throw-if-not-resolved="false"></xref> for the <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend" data-throw-if-not-resolved="false"></xref> currently configured for the given <code class="paramref">role</code>.
        Instances of the <xref href="PostSharp.Patterns.Diagnostics.LoggingTypeSource" data-throw-if-not-resolved="false"></xref> class are not shared by different instances of the <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend" data-throw-if-not-resolved="false"></xref> class. However, several
        roles can share the same <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend" data-throw-if-not-resolved="false"></xref> instance. Therefore, you should configure a <xref href="PostSharp.Patterns.Diagnostics.LoggingTypeSource" data-throw-if-not-resolved="false"></xref> after, and not before,
        assigning a <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend" data-throw-if-not-resolved="false"></xref> to the <xref href="PostSharp.Patterns.Diagnostics.LoggingServices.DefaultBackend" data-throw-if-not-resolved="false"></xref> property or a <xref href="PostSharp.Patterns.Diagnostics.LoggingRoleConfiguration" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: >-
      [Obsolete("Use LoggingBackend.DefaultContextLocalConfiguration.Verbosity")]

      public static LoggingTypeSource GetSource(string role, Type type)
    parameters:
    - id: role
      type: System.String
      description: The role. This is typically one of the constants of the <xref href="PostSharp.Patterns.Diagnostics.LoggingRoles" data-throw-if-not-resolved="false"></xref> type, or a custom role.
    - id: type
      type: System.Type
      description: The type.
    return:
      type: PostSharp.Patterns.Diagnostics.LoggingTypeSource
      description: >-
        The <xref href="PostSharp.Patterns.Diagnostics.LoggingTypeSource" data-throw-if-not-resolved="false"></xref> for <code class="paramref">role</code> and <code class="paramref">type</code>. If no <xref href="PostSharp.Patterns.Diagnostics.LoggingTypeSource" data-throw-if-not-resolved="false"></xref>
                    exists for this role and type, this method shall create a new <xref href="PostSharp.Patterns.Diagnostics.LoggingTypeSource" data-throw-if-not-resolved="false"></xref>.
    content.vb: >-
      <Obsolete("Use LoggingBackend.DefaultContextLocalConfiguration.Verbosity")>

      Public Shared Function GetSource(role As String, type As Type) As LoggingTypeSource
  overload: PostSharp.Patterns.Diagnostics.LoggingServices.GetSource*
  attributes:
  - type: System.ObsoleteAttribute
    ctor: System.ObsoleteAttribute.#ctor(System.String)
    arguments:
    - type: System.String
      value: Use LoggingBackend.DefaultContextLocalConfiguration.Verbosity
  nameWithType.vb: LoggingServices.GetSource(String, Type)
  fullName.vb: PostSharp.Patterns.Diagnostics.LoggingServices.GetSource(String, System.Type)
  name.vb: GetSource(String, Type)
- uid: PostSharp.Patterns.Diagnostics.LoggingServices.GetSource(System.String,System.String)
  commentId: M:PostSharp.Patterns.Diagnostics.LoggingServices.GetSource(System.String,System.String)
  id: GetSource(System.String,System.String)
  parent: PostSharp.Patterns.Diagnostics.LoggingServices
  langs:
  - csharp
  - vb
  name: GetSource(string, string)
  nameWithType: LoggingServices.GetSource(string, string)
  fullName: PostSharp.Patterns.Diagnostics.LoggingServices.GetSource(string, string)
  type: Method
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics
  summary: Returns a <xref href="PostSharp.Patterns.Diagnostics.LoggingNamespaceSource" data-throw-if-not-resolved="false"></xref> for the given role and, optionally, namespace.
  remarks: >-
    <p>This method returns a <xref href="PostSharp.Patterns.Diagnostics.LoggingNamespaceSource" data-throw-if-not-resolved="false"></xref> for the <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend" data-throw-if-not-resolved="false"></xref> currently configured for the given <code class="paramref">role</code>.
        Instances of the <xref href="PostSharp.Patterns.Diagnostics.LoggingNamespaceSource" data-throw-if-not-resolved="false"></xref> class are not shared by different instances of the <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend" data-throw-if-not-resolved="false"></xref> class. However, several
        roles can share the same <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend" data-throw-if-not-resolved="false"></xref> instance. Therefore, you should configure a <xref href="PostSharp.Patterns.Diagnostics.LoggingNamespaceSource" data-throw-if-not-resolved="false"></xref> after, and not before,
        assigning a <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend" data-throw-if-not-resolved="false"></xref> to the <xref href="PostSharp.Patterns.Diagnostics.LoggingServices.DefaultBackend" data-throw-if-not-resolved="false"></xref> property or a <xref href="PostSharp.Patterns.Diagnostics.LoggingRoleConfiguration" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: >-
      [Obsolete("Use LoggingBackend.DefaultContextLocalConfiguration.Verbosity")]

      public static LoggingNamespaceSource GetSource(string role, string ns = null)
    parameters:
    - id: role
      type: System.String
      description: The role. This is typically one of the constants of the <xref href="PostSharp.Patterns.Diagnostics.LoggingRoles" data-throw-if-not-resolved="false"></xref> type, or a custom role.
    - id: ns
      type: System.String
      description: >-
        The namespace for which the <xref href="PostSharp.Patterns.Diagnostics.LoggingNamespaceSource" data-throw-if-not-resolved="false"></xref> is requested, or <code>null</code>
                    if the <xref href="PostSharp.Patterns.Diagnostics.LoggingNamespaceSource" data-throw-if-not-resolved="false"></xref> is requested for the root namespace.
    return:
      type: PostSharp.Patterns.Diagnostics.LoggingNamespaceSource
      description: >-
        The <xref href="PostSharp.Patterns.Diagnostics.LoggingNamespaceSource" data-throw-if-not-resolved="false"></xref> for <code class="paramref">role</code> and <code class="paramref">ns</code>. If no <xref href="PostSharp.Patterns.Diagnostics.LoggingNamespaceSource" data-throw-if-not-resolved="false"></xref>
                    exists for this role and namespace, this method shall create a new <xref href="PostSharp.Patterns.Diagnostics.LoggingNamespaceSource" data-throw-if-not-resolved="false"></xref>.
    content.vb: >-
      <Obsolete("Use LoggingBackend.DefaultContextLocalConfiguration.Verbosity")>

      Public Shared Function GetSource(role As String, ns As String = Nothing) As LoggingNamespaceSource
  overload: PostSharp.Patterns.Diagnostics.LoggingServices.GetSource*
  attributes:
  - type: System.ObsoleteAttribute
    ctor: System.ObsoleteAttribute.#ctor(System.String)
    arguments:
    - type: System.String
      value: Use LoggingBackend.DefaultContextLocalConfiguration.Verbosity
  nameWithType.vb: LoggingServices.GetSource(String, String)
  fullName.vb: PostSharp.Patterns.Diagnostics.LoggingServices.GetSource(String, String)
  name.vb: GetSource(String, String)
