- uid: PostSharp.Patterns.Diagnostics.LoggingServices.DefaultBackend
  commentId: P:PostSharp.Patterns.Diagnostics.LoggingServices.DefaultBackend
  id: DefaultBackend
  parent: PostSharp.Patterns.Diagnostics.LoggingServices
  langs:
  - csharp
  - vb
  name: DefaultBackend
  nameWithType: LoggingServices.DefaultBackend
  fullName: PostSharp.Patterns.Diagnostics.LoggingServices.DefaultBackend
  type: Property
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics
  summary: Gets or sets the default <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend" data-throw-if-not-resolved="false"></xref> used for logging in the current application.
  remarks: >-
    <p>
        The <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend" data-throw-if-not-resolved="false"></xref> can be set individually for each role by setting the <xref href="PostSharp.Patterns.Diagnostics.LoggingRoleConfiguration.Backend" data-throw-if-not-resolved="false"></xref>
        property of items of the <xref href="PostSharp.Patterns.Diagnostics.LoggingServices.Roles" data-throw-if-not-resolved="false"></xref> collection.
        </p>
    <p>Setting this property has the side effect of also setting the backend for
        the Meta role to a <xref href="PostSharp.Patterns.Diagnostics.Backends.Multiplexer.MultiplexerBackend" data-throw-if-not-resolved="false"></xref> whose first child is the new default backend
        and the second child is a new <xref href="PostSharp.Patterns.Diagnostics.Backends.MetaLoggingBackend" data-throw-if-not-resolved="false"></xref>. If you need to change this behavior,
        you must override <code>Roles[LoggingRoles.Meta].Backend</code> after setting this property.</p>
  example: []
  syntax:
    content: public static LoggingBackend DefaultBackend { get; set; }
    parameters: []
    return:
      type: PostSharp.Patterns.Diagnostics.LoggingBackend
    content.vb: Public Shared Property DefaultBackend As LoggingBackend
  overload: PostSharp.Patterns.Diagnostics.LoggingServices.DefaultBackend*
