- uid: PostSharp.Patterns.Diagnostics.LoggingServices.ExceptionHandler
  commentId: P:PostSharp.Patterns.Diagnostics.LoggingServices.ExceptionHandler
  id: ExceptionHandler
  parent: PostSharp.Patterns.Diagnostics.LoggingServices
  langs:
  - csharp
  - vb
  name: ExceptionHandler
  nameWithType: LoggingServices.ExceptionHandler
  fullName: PostSharp.Patterns.Diagnostics.LoggingServices.ExceptionHandler
  type: Property
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics
  summary: >-
    Gets or sets the object that handles exceptions thrown by the logging logic. This property is set by default to an instance

    of the <xref href="PostSharp.Patterns.Diagnostics.DefaultLoggingExceptionHandler" data-throw-if-not-resolved="false"></xref> class, or to an instance of the <xref href="PostSharp.Patterns.Diagnostics.ThrowingLoggingExceptionHandler" data-throw-if-not-resolved="false"></xref> class

    when a debugger is attached at the time the <xref href="PostSharp.Patterns.Diagnostics.LoggingServices" data-throw-if-not-resolved="false"></xref> class is initialized.
  remarks: >-
    <p>The default handler disables the <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend" data-throw-if-not-resolved="false"></xref> that caused an internal exception, unless the exception is an
        <xref href="PostSharp.Patterns.Diagnostics.Custom.InvalidFormattingStringException" data-throw-if-not-resolved="false"></xref>. Set <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.IsEnabled" data-throw-if-not-resolved="false"></xref>
        to <code>true</code> to enable it again.</p>
  example: []
  syntax:
    content: public static ILoggingExceptionHandler ExceptionHandler { get; set; }
    parameters: []
    return:
      type: PostSharp.Patterns.Diagnostics.ILoggingExceptionHandler
    content.vb: Public Shared Property ExceptionHandler As ILoggingExceptionHandler
  overload: PostSharp.Patterns.Diagnostics.LoggingServices.ExceptionHandler*
  seealso:
  - linkId: PostSharp.Patterns.Diagnostics.ILoggingExceptionHandler
    commentId: T:PostSharp.Patterns.Diagnostics.ILoggingExceptionHandler
  - linkType: HRef
    linkId: '@logging-exception-handling'
    altText: 'Conceptual: Handling Logging Exceptions'
