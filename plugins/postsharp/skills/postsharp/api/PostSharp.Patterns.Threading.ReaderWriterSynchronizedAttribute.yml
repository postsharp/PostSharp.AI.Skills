  name: ReaderWriterSynchronizedAttribute
  nameWithType: ReaderWriterSynchronizedAttribute
  fullName: PostSharp.Patterns.Threading.ReaderWriterSynchronizedAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Custom attribute that, when applied to a class, applies the <xref href="PostSharp.Patterns.Threading.Models.ReaderWriterSynchronizedThreadingModel" data-throw-if-not-resolved="false"></xref> model to this class

    and all derived classes.

    Members of this class must then be annotated with attributes specifying the required access level

    (<xref href="PostSharp.Patterns.Threading.ReaderAttribute" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Patterns.Threading.WriterAttribute" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Patterns.Threading.YielderAttribute" data-throw-if-not-resolved="false"></xref>

    or <xref href="PostSharp.Patterns.Threading.UpgradeableReaderAttribute" data-throw-if-not-resolved="false"></xref>), otherwise build-time and run-time errors are emitted.
  remarks: >-
    <p>Several threads can execute reader methods of the same object concurrently, but a writer method has exclusive access to the object.
        Annotate public and internal methods with an access-level attribute; a warning is emitted at build time for a method that has none.
        Public and internal property getters and setters do not need an attribute because they require read and write access respectively,
        and event accessors do not need one either.</p>
    <p>A build-time error is emitted when the class has public or internal fields, or when an <code>async</code> method is not annotated
        with the <xref href="PostSharp.Patterns.Threading.ReentrantAttribute" data-throw-if-not-resolved="false"></xref> custom attribute. When run-time verification is enabled, accessing a field without the required
        access level, for instance writing a field from a reader method, results in a <xref href="PostSharp.Patterns.Threading.ThreadAccessException" data-throw-if-not-resolved="false"></xref>.</p>
    <p>When the object becomes a child of an object that has the <xref href="PostSharp.Patterns.Threading.SynchronizedAttribute" data-throw-if-not-resolved="false"></xref> aspect, it shares the lock of its parent,
        and all its methods then require exclusive access.</p>
