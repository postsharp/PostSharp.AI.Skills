  fullName: PostSharp.Patterns.Model.WeakEventAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Model
  summary: >-
    Aspect that, when applied to an event, prevents the target event from holding a strong reference to event handlers.

    Therefore, the aspect prevents the event from preventing clients from being garbage collected.
  remarks: >-
    <p>Event clients do not need to keep a strong reference to the delegates passed to a weak event. The <xref href="PostSharp.Patterns.Model.WeakEventAttribute" data-throw-if-not-resolved="false"></xref> implementation
        will keep delegate instances alive as long as the event client (that is, the object that the <xref href="System.Delegate.Target" data-throw-if-not-resolved="false"></xref> property points to) is alive, but no longer.
        </p>
    <p>Clients do not need to unregister their handlers, or implement <xref href="System.IDisposable" data-throw-if-not-resolved="false"></xref> to do it, unless the handler must stop
        receiving events before the client is garbage collected.</p>
    <p>To make all events of an assembly or a namespace weak, apply this attribute at assembly level and use attribute multicasting.</p>
  example: []
  syntax:
    content: >-
      [LinesOfCodeAvoided(6)]

      [Serializer(typeof(WeakEventAttribute.Serializer))]

      public sealed class WeakEventAttribute : EventInterceptionAspect, IEventLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, IEventInterceptionAspect, IEventLevelAspect, IInstanceScopedAspect, IAspect
