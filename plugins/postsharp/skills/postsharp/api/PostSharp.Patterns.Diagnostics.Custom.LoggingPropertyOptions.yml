- uid: PostSharp.Patterns.Diagnostics.Custom.LoggingPropertyOptions.#ctor(System.Boolean,System.Boolean,System.Boolean,System.Boolean,PostSharp.Patterns.Formatters.IFormatter)
  commentId: M:PostSharp.Patterns.Diagnostics.Custom.LoggingPropertyOptions.#ctor(System.Boolean,System.Boolean,System.Boolean,System.Boolean,PostSharp.Patterns.Formatters.IFormatter)
  id: '#ctor(System.Boolean,System.Boolean,System.Boolean,System.Boolean,PostSharp.Patterns.Formatters.IFormatter)'
  parent: PostSharp.Patterns.Diagnostics.Custom.LoggingPropertyOptions
  langs:
  - csharp
  - vb
  name: LoggingPropertyOptions(bool, bool, bool, bool, IFormatter)
  nameWithType: LoggingPropertyOptions.LoggingPropertyOptions(bool, bool, bool, bool, IFormatter)
  fullName: PostSharp.Patterns.Diagnostics.Custom.LoggingPropertyOptions.LoggingPropertyOptions(bool, bool, bool, bool, PostSharp.Patterns.Formatters.IFormatter)
  type: Constructor
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics.Custom
  summary: Initializes a new instance of the <xref href="PostSharp.Patterns.Diagnostics.Custom.LoggingPropertyOptions" data-throw-if-not-resolved="false"></xref> struct.
  example: []
  syntax:
    content: public LoggingPropertyOptions(bool isRendered = false, bool isInherited = false, bool isBaggage = false, bool isIgnored = false, IFormatter formatter = null)
    parameters:
    - id: isRendered
      type: System.Boolean
      description: >-
        Determines whether the property will be included in the log message. The default value is <code>false</code>. In this case,
                    the property is only available as an additional property, if this is supported by the backend.
    - id: isInherited
      type: System.Boolean
      description: >-
        Determines whether the property is inherited from the parent activity to child activities and messages. The default value is <code>false</code>.
                    When this property is set to <code>false</code>, <xref href="PostSharp.Patterns.Diagnostics.Custom.LoggingPropertyOptions.IsBaggage" data-throw-if-not-resolved="false"></xref> is automatically set to <code>false</code>.
    - id: isBaggage
      type: System.Boolean
      description: >-
        Determines whether the property is cross-process. The default value is <code>false</code>. When this property is set to <code>true</code>, <xref href="PostSharp.Patterns.Diagnostics.Custom.LoggingPropertyOptions.IsInherited" data-throw-if-not-resolved="false"></xref> is automatically

        set to <code>true</code>.
    - id: isIgnored
      type: System.Boolean
      description: >-
        Determines whether this property must be ignored by the <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata.VisitProperties%60%601(System.Object%2cPostSharp.Patterns.Diagnostics.Custom.ILoggingPropertyVisitor%7b%60%600%7d%2c%60%600%40%2cPostSharp.Patterns.Diagnostics.Custom.LoggingPropertyVisitorOptions%40)" data-throw-if-not-resolved="false"></xref>
                    method.
    - id: formatter
      type: PostSharp.Patterns.Formatters.IFormatter
      description: The formatter to be used to render the property value.
    content.vb: Public Sub New(isRendered As Boolean = False, isInherited As Boolean = False, isBaggage As Boolean = False, isIgnored As Boolean = False, formatter As IFormatter = Nothing)
