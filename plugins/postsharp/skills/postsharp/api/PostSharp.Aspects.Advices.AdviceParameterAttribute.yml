  nameWithType: AdviceParameterAttribute
  fullName: PostSharp.Aspects.Advices.AdviceParameterAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Base class of the custom attributes that bind a parameter of an advice method to a value of the target of the advice,

    such as an argument, the instance, or a variable shared by the advices of a group.
  remarks: >-
    <p>
        An advice method can receive the values it needs as parameters, instead of a single <xref href="PostSharp.Aspects.AdviceArgs" data-throw-if-not-resolved="false"></xref> object
        that is allocated on each call. Each parameter must have exactly one advice parameter attribute. Only the first parameter can be
        passed without attribute, and it must then be of the <xref href="PostSharp.Aspects.AdviceArgs" data-throw-if-not-resolved="false"></xref> type of the advice, for instance
        <xref href="PostSharp.Aspects.MethodExecutionArgs" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>
        The following advices accept bound parameters: the method boundary advices (<xref href="PostSharp.Aspects.Advices.OnMethodEntryAdvice" data-throw-if-not-resolved="false"></xref>,
        <xref href="PostSharp.Aspects.Advices.OnMethodSuccessAdvice" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.OnMethodExceptionAdvice" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.OnMethodExitAdvice" data-throw-if-not-resolved="false"></xref>,
        <xref href="PostSharp.Aspects.Advices.OnMethodYieldAdvice" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.Advices.OnMethodResumeAdvice" data-throw-if-not-resolved="false"></xref>), <xref href="PostSharp.Aspects.Advices.OnMethodInvokeAdvice" data-throw-if-not-resolved="false"></xref>,
        <xref href="PostSharp.Aspects.Advices.OnLocationGetValueAdvice" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.OnLocationSetValueAdvice" data-throw-if-not-resolved="false"></xref>, and <xref href="PostSharp.Aspects.Advices.OnInstanceConstructedAdvice" data-throw-if-not-resolved="false"></xref>, where the target of
        the bindings is the constructor at the end of which the advice runs. The other advices, including <xref href="PostSharp.Aspects.Advices.OnMethodInvokeAsyncAdvice" data-throw-if-not-resolved="false"></xref> and the event interception advices,
        do not accept bound parameters.
        </p>
    <p>
        Each attribute documents the type that the parameter must have, whether the parameter can be <code>ref</code>, <code>in</code> or <code>out</code>, and the advices
        in which it can be used. The compiler checks these rules when it builds the aspect and when it applies the advice to each target,
        and it reports an error when a rule is not respected.
        </p>
    <p>
        The advice method can be generic. The compiler then infers the type arguments of the advice method for each target from the types of the
        bound values, for instance <code>OnEntry&lt;T&gt;( [Argument( 0 )] T value )</code>.
        </p>
    <p>
        Only the attributes derived from <xref href="PostSharp.Aspects.Advices.AdviceParameterAttribute" data-throw-if-not-resolved="false"></xref> by PostSharp are supported. An attribute derived by the user
        is reported as an error.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Parameter)]

      public abstract class AdviceParameterAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Parameter)>

      Public MustInherit Class AdviceParameterAttribute Inherits Attribute
