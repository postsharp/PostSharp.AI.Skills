  - vb
  name: OnEventAddHandlerAdvice
  nameWithType: OnEventAddHandlerAdvice
  fullName: PostSharp.Aspects.Advices.OnEventAddHandlerAdvice
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Custom attribute that, when applied on a method of an aspect class, specifies

    that this method is an advice that has the same semantics as <xref href="PostSharp.Aspects.IEventInterceptionAspect.OnAddHandler(PostSharp.Aspects.EventInterceptionArgs)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
                The method to which this custom attribute is applied must be public and must have the same signature as
                <xref href="PostSharp.Aspects.IEventInterceptionAspect.OnAddHandler(PostSharp.Aspects.EventInterceptionArgs)" data-throw-if-not-resolved="false"></xref>. However, it can be static.
              </p>
        <p>
               This advice does not intercept the initializer of a field-like event. If you want to intercept the adding of all handlers,
            do not use event initializers and instead add the initial handler in the constructor.
              </p>
        <br />
        <p>
      If an aspect defines many advices (among
      <xref href="PostSharp.Aspects.Advices.OnEventAddHandlerAdvice" data-throw-if-not-resolved="false"></xref>
      ,
      <xref href="PostSharp.Aspects.Advices.OnEventRemoveHandlerAdvice" data-throw-if-not-resolved="false"></xref>
      and
      <xref href="PostSharp.Aspects.Advices.OnEventInvokeHandlerAdvice" data-throw-if-not-resolved="false"></xref>
      ) that are meant to be applied to the same events with consistent ordering, these advices should be
      grouped together (see
      <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Master" data-throw-if-not-resolved="false"></xref>
      property).
    </p>
        <div class="NOTE"><h5>note</h5><p>
      A master advice without a custom attribute derived from <xref href="PostSharp.Aspects.Advices.Pointcut" data-throw-if-not-resolved="false"></xref> applies to the event to which the aspect is applied; when the aspect is applied to another kind of declaration, a pointcut is required. An advice without <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Master" data-throw-if-not-resolved="false"></xref> and without pointcut joins
      the group of the master advice declared in its class.
    </p></div>
        <xref href="PostSharp.Aspects.IEventInterceptionAspect" data-throw-if-not-resolved="false"></xref>
        <xref href="PostSharp.Aspects.Advices.OnEventAddHandlerAdvice" data-throw-if-not-resolved="false"></xref>
        <xref href="PostSharp.Aspects.Advices.OnEventInvokeHandlerAdvice" data-throw-if-not-resolved="false"></xref>
        <br />
        <div class="NOTE"><h5>note</h5><p>
      Because of the way the C# compiler implements
      <b>field-like events</b>
      (i.e. events where you
      don't implement the
      <code>Add</code>
      and
      <code>Remove</code>
      semantics manually), the
      <b>Invoke Event Handler</b>
      semantic (
      <xref href="PostSharp.Aspects.IEventInterceptionAspect.OnInvokeHandler(PostSharp.Aspects.EventInterceptionArgs)" data-throw-if-not-resolved="false"></xref>
      or equivalent) shall not be invoked for delegates that have been added from inside the class that declares this event.
    </p></div>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method, AllowMultiple = true, Inherited = true)]

      public sealed class OnEventAddHandlerAdvice : GroupingAdvice
    content.vb: >-
      <AttributeUsage(AttributeTargets.Method, AllowMultiple:=True, Inherited:=True)>

      Public NotInheritable Class OnEventAddHandlerAdvice Inherits GroupingAdvice
