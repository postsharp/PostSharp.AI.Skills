  name: ForEachProperty<T>(LoggingPropertyVisitor<T>, ref T, bool)
  nameWithType: ILoggingContext.ForEachProperty<T>(LoggingPropertyVisitor<T>, ref T, bool)
  fullName: PostSharp.Patterns.Diagnostics.Contexts.ILoggingContext.ForEachProperty<T>(PostSharp.Patterns.Diagnostics.Contexts.LoggingPropertyVisitor<T>, ref T, bool)
  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics.Contexts
  summary: >-
    Invokes a delegate for each property defined in the current logging context and optionally in its ancestor contexts, and passes a state object

    to the delegate.
  remarks: <p>This method will visit all properties regardless of their name. If several properties have the same name, they will be visited several times.</p>
  example: []
  syntax:
    content: >-
      [Obsolete("Use LoggingContext.VisitProperties.")]

      void ForEachProperty<T>(LoggingPropertyVisitor<T> visitor, ref T state, bool includeAncestors = true)
    parameters:
    - id: visitor
      type: PostSharp.Patterns.Diagnostics.Contexts.LoggingPropertyVisitor{{T}}
      description: The delegate to invoke. The <code>state</code> parameter of the delegate will be assigned to a dummy variable.
    - id: state
      type: '{T}'
      description: The state object that will be passed to the <code class="paramref">visitor</code> delegate.
    - id: includeAncestors
      type: System.Boolean
      description: <code>true</code> if ancestor contexts should be visited, <code>false</code> if only the current context should be visited.
    typeParameters:
    - id: T
      description: The type of the state passed to the <code class="paramref">visitor</code> delegate.
    content.vb: >-
      <Obsolete("Use LoggingContext.VisitProperties.")>

      Sub ForEachProperty(Of T)(visitor As LoggingPropertyVisitor(Of T), state As T, includeAncestors As Boolean = True)
