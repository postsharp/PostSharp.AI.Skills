  namespace: PostSharp.Patterns.Diagnostics.Correlation
  summary: An implementation of the legacy HTTP Correlation Protocol proposed by Microsoft.
  remarks: >-
    <p>The implementation is here: 
        https://github.com/dotnet/corefx/blob/master/src/System.Diagnostics.DiagnosticSource/src/HttpCorrelationProtocol.md
        </p>
    <p>This protocol uses the <code>Request-Id</code> header to pass the synthetic identifier of the client activity to the server, and the
        <code>Correlation-Context</code> header to pass baggage properties. It processes only the requests accepted by the predicate passed to the
        <xref href="PostSharp.Patterns.Diagnostics.Correlation.LegacyHttpCorrelationProtocol.%23ctor(System.Predicate%7bPostSharp.Patterns.Diagnostics.Correlation.CorrelationRequest%7d)" data-throw-if-not-resolved="false"></xref> constructor. Accept only trusted requests, because the headers
        of other requests can inject arbitrary values into the logs.</p>
  example: []
  syntax:
    content: 'public sealed class LegacyHttpCorrelationProtocol : ICorrelationProtocol'
    content.vb: Public NotInheritable Class LegacyHttpCorrelationProtocol Implements ICorrelationProtocol
