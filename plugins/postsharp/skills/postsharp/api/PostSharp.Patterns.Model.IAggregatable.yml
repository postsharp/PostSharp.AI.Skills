- uid: PostSharp.Patterns.Model.IAggregatable.VisitChildren(PostSharp.Patterns.Model.ChildVisitor,PostSharp.Patterns.Model.ChildVisitorOptions,System.Object)
  commentId: M:PostSharp.Patterns.Model.IAggregatable.VisitChildren(PostSharp.Patterns.Model.ChildVisitor,PostSharp.Patterns.Model.ChildVisitorOptions,System.Object)
  id: VisitChildren(PostSharp.Patterns.Model.ChildVisitor,PostSharp.Patterns.Model.ChildVisitorOptions,System.Object)
  parent: PostSharp.Patterns.Model.IAggregatable
  langs:
  - csharp
  - vb
  name: VisitChildren(ChildVisitor, ChildVisitorOptions, object)
  nameWithType: IAggregatable.VisitChildren(ChildVisitor, ChildVisitorOptions, object)
  fullName: PostSharp.Patterns.Model.IAggregatable.VisitChildren(PostSharp.Patterns.Model.ChildVisitor, PostSharp.Patterns.Model.ChildVisitorOptions, object)
  type: Method
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: Executes an action for all direct children of the current object.
  remarks: >-
    <div class="NOTE"><h5>note</h5><p>If a parent is bound to a child through several relationships (for instance several fields), the <code class="paramref">visitor</code> delegate
        will be invoked several times, once for each relationship. Store visited children into a <xref href="System.Collections.Generic.HashSet%601" data-throw-if-not-resolved="false"></xref> if you need to perform an action only once per child.</p></div>
  example: []
  syntax:
    content: bool VisitChildren(ChildVisitor visitor, ChildVisitorOptions options = ChildVisitorOptions.None, object state = null)
    parameters:
    - id: visitor
      type: PostSharp.Patterns.Model.ChildVisitor
      description: The action to be executed for each child.
    - id: options
      type: PostSharp.Patterns.Model.ChildVisitorOptions
      description: The options. The default behavior is to enumerate all children, but ignore parent surrogates.
    - id: state
      type: System.Object
      description: An opaque state object that is passed to <code class="paramref">visitor</code>.
    return:
      type: System.Boolean
      description: <code>false</code> if <code class="paramref">visitor</code> returned <code>false</code>, otherwise <code>true</code>.
    content.vb: Function VisitChildren(visitor As ChildVisitor, options As ChildVisitorOptions = ChildVisitorOptions.None, state As Object = Nothing) As Boolean
  overload: PostSharp.Patterns.Model.IAggregatable.VisitChildren*
  nameWithType.vb: IAggregatable.VisitChildren(ChildVisitor, ChildVisitorOptions, Object)
  fullName.vb: PostSharp.Patterns.Model.IAggregatable.VisitChildren(PostSharp.Patterns.Model.ChildVisitor, PostSharp.Patterns.Model.ChildVisitorOptions, Object)
