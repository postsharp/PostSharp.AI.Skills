- uid: PostSharp.Patterns.Model.IAggregatable.AncestorChanged
  commentId: E:PostSharp.Patterns.Model.IAggregatable.AncestorChanged
  id: AncestorChanged
  parent: PostSharp.Patterns.Model.IAggregatable
  langs:
  - csharp
  - vb
  name: AncestorChanged
  nameWithType: IAggregatable.AncestorChanged
  fullName: PostSharp.Patterns.Model.IAggregatable.AncestorChanged
  type: Event
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: Occurs when any ancestor changes. An ancestor is the parent of the current object or the parent of an ancestor of the current object.
  remarks: >-
    <p>The <code>sender</code> parameter of the event handler will be set to the current object. The <xref href="PostSharp.Patterns.Model.AncestorChangedEventArgs.Child" data-throw-if-not-resolved="false"></xref> property of the
        <xref href="PostSharp.Patterns.Model.AncestorChangedEventArgs" data-throw-if-not-resolved="false"></xref> object will be set to the object whose <xref href="PostSharp.Patterns.Model.IAggregatable.Parent" data-throw-if-not-resolved="false"></xref> actually changed. To retrieve the new ancestor,
        use <code>args.Child.QueryInterface&lt;IAggregatable&gt;().Parent</code>.</p>
  example: []
  syntax:
    content: event EventHandler<AncestorChangedEventArgs> AncestorChanged
    return:
      type: System.EventHandler{PostSharp.Patterns.Model.AncestorChangedEventArgs}
    content.vb: Event AncestorChanged As EventHandler(Of AncestorChangedEventArgs)
