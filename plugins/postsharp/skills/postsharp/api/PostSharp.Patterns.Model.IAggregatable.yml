  name: IAggregatable
  nameWithType: IAggregatable
  fullName: PostSharp.Patterns.Model.IAggregatable
  type: Interface
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: Defines members (principally <xref href="PostSharp.Patterns.Model.IAggregatable.Parent" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Model.IAggregatable.VisitChildren(PostSharp.Patterns.Model.ChildVisitor%2cPostSharp.Patterns.Model.ChildVisitorOptions%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>) that make it possible to consume parent-child relationships in an object tree.
  remarks: >-
    <p>If a class implements this interface, it must also implement <xref href="PostSharp.Patterns.Model.IAttachable" data-throw-if-not-resolved="false"></xref>. These two interfaces
                 have been separated for clarity, since <xref href="PostSharp.Patterns.Model.IAttachable" data-throw-if-not-resolved="false"></xref> should normally not be consumed from user code.</p>
    <p>The <xref href="PostSharp.Patterns.Model.AggregatableAttribute" data-throw-if-not-resolved="false"></xref> aspect introduces this interface after compilation, so the C# compiler does not know that the target class
                 implements it. To get the interface from source code, use <xref href="PostSharp.Post.Cast%60%602(%60%600)" data-throw-if-not-resolved="false"></xref> or
                 <xref href="PostSharp.Patterns.DynamicAdvising.DynamicAdvisingServices.QueryInterface%60%601(System.Object%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref>. Advisable collections, such as
                 <xref href="PostSharp.Patterns.Collections.AdvisableCollection%601" data-throw-if-not-resolved="false"></xref>, receive this interface at run time, so only
                 <xref href="PostSharp.Patterns.DynamicAdvising.DynamicAdvisingServices.QueryInterface%60%601(System.Object%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> can return it.</p>
  example: []
  syntax:
    content: public interface IAggregatable
    content.vb: Public Interface IAggregatable
