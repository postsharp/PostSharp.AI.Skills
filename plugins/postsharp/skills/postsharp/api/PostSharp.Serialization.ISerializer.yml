- uid: PostSharp.Serialization.ISerializer.IsTwoPhase
  commentId: P:PostSharp.Serialization.ISerializer.IsTwoPhase
  id: IsTwoPhase
  parent: PostSharp.Serialization.ISerializer
  langs:
  - csharp
  - vb
  name: IsTwoPhase
  nameWithType: ISerializer.IsTwoPhase
  fullName: PostSharp.Serialization.ISerializer.IsTwoPhase
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Serialization
  summary: >-
    Gets a value indicating whether <xref href="PostSharp.Serialization.ISerializer.DeserializeFields(System.Object%40%2cPostSharp.Serialization.IArgumentsReader)" data-throw-if-not-resolved="false"></xref> should be invoked during deserialization.

    The value is <code>false</code> if <xref href="PostSharp.Serialization.ISerializer.CreateInstance(System.Type%2cPostSharp.Serialization.IArgumentsReader)" data-throw-if-not-resolved="false"></xref> returns a fully created object, and <code>true</code> otherwise.
  example: []
  syntax:
    content: bool IsTwoPhase { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: ReadOnly Property IsTwoPhase As Boolean
  overload: PostSharp.Serialization.ISerializer.IsTwoPhase*
