  name: LoggingContextLocalConfiguration
  nameWithType: LoggingContextLocalConfiguration
  fullName: PostSharp.Patterns.Diagnostics.LoggingContextLocalConfiguration
  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics
  summary: Stores the context-sensitive configuration, that is, the configuration that is specific to the current execution context.
  remarks: >-
    <p>
        User code can switch from one <xref href="PostSharp.Patterns.Diagnostics.LoggingContextLocalConfiguration" data-throw-if-not-resolved="false"></xref> to another for the current context using the <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.WithContextLocalConfiguration(PostSharp.Patterns.Diagnostics.LoggingContextLocalConfiguration)" data-throw-if-not-resolved="false"></xref> method.
        The current instance is exposed by the <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.CurrentContextLocalConfiguration" data-throw-if-not-resolved="false"></xref> property. The default instance is exposed by the <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.DefaultContextLocalConfiguration" data-throw-if-not-resolved="false"></xref> property.
        </p>
    <p>Unlike <xref href="PostSharp.Patterns.Diagnostics.LoggingVerbosityConfiguration" data-throw-if-not-resolved="false"></xref>, this class is lightweight and can be allocated at high frequency. However, it is recommended that only a few instances of
        the <xref href="PostSharp.Patterns.Diagnostics.LoggingVerbosityConfiguration" data-throw-if-not-resolved="false"></xref> class are created.
        </p>
