items:
- uid: PostSharp.Aspects.IInstanceScopedAspect
  commentId: T:PostSharp.Aspects.IInstanceScopedAspect
  id: IInstanceScopedAspect
  parent: PostSharp.Aspects
  children:
  - PostSharp.Aspects.IInstanceScopedAspect.CreateInstance(PostSharp.Aspects.AdviceArgs)
  - PostSharp.Aspects.IInstanceScopedAspect.RuntimeInitializeInstance
  langs:
  - csharp
  - vb
  name: IInstanceScopedAspect
  nameWithType: IInstanceScopedAspect
  fullName: PostSharp.Aspects.IInstanceScopedAspect
  type: Interface
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Runtime semantics of aspects that have the same lifetime as instances of types

    to which they are applied (or instances of the declaring type of members to which they are applied).
  remarks: >-
    <p>Aspects that do not implement this interface are statically scoped: there is one aspect instance per target declaration,
            stored in a static field, even when the aspect is applied to an instance member. Implement this interface when the aspect needs
            state per instance of the target type, for instance to import dependencies from the target object.</p>
    <p>When an aspect is instance-scoped, a new instance of this aspect is created whenever an instance of the
            type to which it has been applied is created (concretely, before the call to the base constructor and to the constructor of this type).</p>
    <p>New aspect instances are obtained using the prototype design pattern. As any other aspect, an instance-scoped aspect
            has a static instance initialized at build time, then serialized, deserialized at runtime, and initialized by <code>RuntimeInitialize</code>.
            This static instance then serves as a prototype. When a new instance of the target type is created, the prototype is cloned
            by the method <xref href="PostSharp.Aspects.IInstanceScopedAspect.CreateInstance(PostSharp.Aspects.AdviceArgs)" data-throw-if-not-resolved="false"></xref> (typically implemented by a call to <xref href="System.Object.MemberwiseClone" data-throw-if-not-resolved="false"></xref>). Then some system
            initializations (for example, member import) are performed on the aspect instance, and finally the <xref href="PostSharp.Aspects.IInstanceScopedAspect.RuntimeInitializeInstance" data-throw-if-not-resolved="false"></xref>
            method is invoked.
          </p>
    <p>When an aspect implementing the <xref href="PostSharp.Aspects.IInstanceScopedAspect" data-throw-if-not-resolved="false"></xref> interface is applied on a static method, field, property, or event,
            the aspect will be statically scoped and the interface will be ignored.</p>
  example: []
  syntax:
    content: >-
      [HasInheritedAttribute]

      public interface IInstanceScopedAspect : IAspect
    content.vb: >-
      <HasInheritedAttribute>

      Public Interface IInstanceScopedAspect Inherits IAspect
