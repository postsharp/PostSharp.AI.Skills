- uid: PostSharp.Aspects.IInstanceScopedAspect.CreateInstance(PostSharp.Aspects.AdviceArgs)
  commentId: M:PostSharp.Aspects.IInstanceScopedAspect.CreateInstance(PostSharp.Aspects.AdviceArgs)
  id: CreateInstance(PostSharp.Aspects.AdviceArgs)
  parent: PostSharp.Aspects.IInstanceScopedAspect
  langs:
