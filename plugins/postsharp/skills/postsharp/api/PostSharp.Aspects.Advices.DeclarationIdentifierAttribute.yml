  namespace: PostSharp.Aspects.Advices
  summary: Binds a parameter of an advice method to the <xref href="PostSharp.Reflection.DeclarationIdentifier" data-throw-if-not-resolved="false"></xref> of the target declaration.
  remarks: >-
    The parameter must be of type <xref href="PostSharp.Reflection.DeclarationIdentifier" data-throw-if-not-resolved="false"></xref>, and it cannot be <code>ref</code>, <code>in</code> or <code>out</code>. The value is not boxed,

    so a parameter of type <xref href="System.Object" data-throw-if-not-resolved="false"></xref> is not accepted.
  example: []
  syntax:
    content: 'public sealed class DeclarationIdentifierAttribute : AdviceParameterAttribute'
    content.vb: Public NotInheritable Class DeclarationIdentifierAttribute Inherits AdviceParameterAttribute
