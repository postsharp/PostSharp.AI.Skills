  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics.Custom
  summary: Gets the <xref href="PostSharp.Patterns.Diagnostics.Custom.IContextLocalLogger" data-throw-if-not-resolved="false"></xref> plus a flag indicating whether the source is enabled for a given <xref href="PostSharp.Patterns.Diagnostics.LogLevel" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: (IContextLocalLogger logger, bool isEnabled) GetContextLocalLogger(LogLevel level)
    parameters:
    - id: level
      type: PostSharp.Patterns.Diagnostics.LogLevel
      description: The log level.
    return:
      type: System.ValueTuple{PostSharp.Patterns.Diagnostics.Custom.IContextLocalLogger,System.Boolean}
      description: >-
        The <xref href="PostSharp.Patterns.Diagnostics.Custom.IContextLocalLogger" data-throw-if-not-resolved="false"></xref> for the current execution context and a flag indicating whether logging
                    is enabled for the given <code class="paramref">level</code>.
    content.vb: Function GetContextLocalLogger(level As LogLevel) As (logger As IContextLocalLogger, isEnabled As Boolean)
  overload: PostSharp.Patterns.Diagnostics.Custom.ILogger3.GetContextLocalLogger*
