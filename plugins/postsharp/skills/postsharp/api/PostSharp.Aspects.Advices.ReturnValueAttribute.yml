  fullName: PostSharp.Aspects.Advices.ReturnValueAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Binds a parameter of an <xref href="PostSharp.Aspects.Advices.OnMethodInvokeAdvice" data-throw-if-not-resolved="false"></xref> method to the return value of the target method.
  remarks: >-
    <p>
        The parameter must be <code>out</code> or <code>ref</code>, and its type must be the return type of the target method or a
        type parameter of the advice method. The value that the advice assigns to the parameter is the value returned by the target method.
        An advice can have only one parameter bound by this attribute.
        </p>
    <p>
        An advice applied to a method that returns a value must have either a parameter bound by this attribute or a
        <xref href="PostSharp.Aspects.MethodInterceptionArgs" data-throw-if-not-resolved="false"></xref> parameter. This attribute can be used only in <xref href="PostSharp.Aspects.Advices.OnMethodInvokeAdvice" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: 'public sealed class ReturnValueAttribute : AdviceParameterAttribute'
    content.vb: Public NotInheritable Class ReturnValueAttribute Inherits AdviceParameterAttribute
