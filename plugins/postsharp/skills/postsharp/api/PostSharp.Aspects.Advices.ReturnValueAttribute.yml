- uid: PostSharp.Aspects.Advices.ReturnValueAttribute.IsRequired
  commentId: P:PostSharp.Aspects.Advices.ReturnValueAttribute.IsRequired
  id: IsRequired
  parent: PostSharp.Aspects.Advices.ReturnValueAttribute
  langs:
  - csharp
  - vb
  name: IsRequired
  nameWithType: ReturnValueAttribute.IsRequired
  fullName: PostSharp.Aspects.Advices.ReturnValueAttribute.IsRequired
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Gets or sets a value indicating whether the target method must have a return value. When this property is <code>true</code>, the compiler

    reports an error when the method of a method boundary advice returns <code>void</code>, returns a task without a result, returns by reference

    (<code>ref</code> or <code>ref readonly</code>), or is an iterator, and when the method of an <xref href="PostSharp.Aspects.Advices.OnMethodInvokeAdvice" data-throw-if-not-resolved="false"></xref> returns

    <code>void</code>. When it is <code>false</code>, the parameter receives the default value of its type in these methods, and a value that the advice

    writes to an <code>out</code> or <code>ref</code> parameter is ignored. The default value is <code>false</code>.
  remarks: >-
    When the advice is selected by <xref href="PostSharp.Aspects.Advices.MatchPointcut" data-throw-if-not-resolved="false"></xref>, a target method without a return value is skipped, and no error is reported

    for it.
  example: []
  syntax:
    content: public bool IsRequired { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property IsRequired As Boolean
  overload: PostSharp.Aspects.Advices.ReturnValueAttribute.IsRequired*
