  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Binds a parameter of a method interception or method boundary advice to the return value of the target method.
  remarks: >-
    <p>
        The type of the parameter must be the type of the return value, or a type parameter of the advice method. In an async method that a method
        boundary advice applies to as a state machine, and in a non-async method that returns a task, the return value is the result of the task.
        An advice can have only one parameter bound by this attribute.
        </p>
    <p>
        The meaning of the parameter depends on the advice:
        </p>
    <ul><li>In an <xref href="PostSharp.Aspects.Advices.OnMethodInvokeAdvice" data-throw-if-not-resolved="false"></xref>, the parameter must be <code>out</code> or <code>ref</code>, and the value that the advice
        assigns to it is the value returned by the target method. An advice applied to a method that returns a value must have either a parameter
        bound by this attribute or a <xref href="PostSharp.Aspects.MethodInterceptionArgs" data-throw-if-not-resolved="false"></xref> parameter. When the method returns <code>void</code>, the parameter receives the
        default value of its type, and the value that the advice assigns to it is ignored.</li><li>In an <xref href="PostSharp.Aspects.Advices.OnMethodSuccessAdvice" data-throw-if-not-resolved="false"></xref> or an <xref href="PostSharp.Aspects.Advices.OnMethodExitAdvice" data-throw-if-not-resolved="false"></xref>, the advice reads the value that the
        method returns, by value or <code>in</code>, or replaces it with <code>ref</code>. When the method throws, the exit advice reads the default
        value.</li><li>In an <xref href="PostSharp.Aspects.Advices.OnMethodEntryAdvice" data-throw-if-not-resolved="false"></xref> or an <xref href="PostSharp.Aspects.Advices.OnMethodExceptionAdvice" data-throw-if-not-resolved="false"></xref>, the parameter must be <code>out</code>
        or <code>ref</code>. It sets the value that the method returns when the advice sets the flow behavior to <xref href="PostSharp.Aspects.FlowBehavior.Return" data-throw-if-not-resolved="false"></xref>.
        </li></ul>
    <p>
        In a method boundary advice, an <code>out</code> or <code>ref</code> parameter takes precedence over <xref href="PostSharp.Aspects.MethodExecutionArgs.ReturnValue" data-throw-if-not-resolved="false"></xref>
        when the advice has both.
        </p>
