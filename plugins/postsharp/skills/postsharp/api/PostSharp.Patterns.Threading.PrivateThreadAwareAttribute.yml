  name: PrivateThreadAwareAttribute
  nameWithType: PrivateThreadAwareAttribute
  fullName: PostSharp.Patterns.Threading.PrivateThreadAwareAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Custom attribute that, when applied to a class, applies the <xref href="PostSharp.Patterns.Threading.Models.PrivateThreadingModel" data-throw-if-not-resolved="false"></xref> to this class.

    In this model, the threading model of an object is determined by the parent it is assigned to in a parent-child relationship.
  remarks: >-
    <p>Use this attribute on classes whose instances are the private state of a parent object, for instance the child objects of an actor.
        Declare the relationship with the <xref href="PostSharp.Patterns.Model.ChildAttribute" data-throw-if-not-resolved="false"></xref> custom attribute on the parent. The object uses the concurrency controller
        of its parent and does not synchronize accesses by itself.</p>
  example: []
  syntax:
    content: >-
      [Metric("UsedFeatures", "PostSharp.Patterns.Threading.PrivateThreadAware")]

      [Serializer(typeof(PrivateThreadAwareAttribute.Serializer))]

      public sealed class PrivateThreadAwareAttribute : ThreadAwareAttribute, ITypeLevelAspect, ITypeLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, ICloneAwareAspect, IInstanceScopedAspect, IAspectProvider, IService, IAdviceProvider, IAspect, IThreadAware, IQueryInterface
