  langs:
  - csharp
  - vb
  name: MessageLocation
  nameWithType: MessageLocation
  fullName: PostSharp.Extensibility.MessageLocation
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    Represents the location of a message. For the end user, it is a line in a source code file.

    For the aspect developer, the location can be an object that represents an element of code

    (for example, a <xref href="System.Type" data-throw-if-not-resolved="false"></xref> or <xref href="System.Reflection.MethodInfo" data-throw-if-not-resolved="false"></xref>). PostSharp resolves such implicit locations

    to a file and line number.
  remarks: >-
    <p>Always give a relevant location to the messages you emit. Besides pointing the user to the source code, the location
        determines whether a <xref href="PostSharp.Extensibility.SuppressWarningAttribute" data-throw-if-not-resolved="false"></xref> applies: PostSharp looks for this attribute on the element of code
        of the location and on its enclosing declarations.</p>
  example: []
  syntax:
    content: public class MessageLocation
    content.vb: Public Class MessageLocation
