    <p>If <code class="paramref">codeElement</code> is <code>null</code> or cannot be mapped to a location of code,
        this method silently returns <xref href="PostSharp.Extensibility.MessageLocation.Unknown" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public static MessageLocation Of(object codeElement)
    parameters:
    - id: codeElement
      type: System.Object
      description: >-
        The object that represents an
                    element of code (<xref href="System.Type" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.MethodInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.ConstructorInfo" data-throw-if-not-resolved="false"></xref>,
                    <xref href="System.Reflection.FieldInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.Assembly" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.ParameterInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.EventInfo" data-throw-if-not-resolved="false"></xref>,
                    <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Reflection.MethodBody.IExpression" data-throw-if-not-resolved="false"></xref> or, if you are using PostSharp SDK, any <code>Declaration</code>).
    return:
      type: PostSharp.Extensibility.MessageLocation
      description: A <xref href="PostSharp.Extensibility.MessageLocation" data-throw-if-not-resolved="false"></xref> representing <code class="paramref">codeElement</code>.
    content.vb: Public Shared Function [Of](codeElement As Object) As MessageLocation
