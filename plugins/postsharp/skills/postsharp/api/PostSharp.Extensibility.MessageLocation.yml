  summary: >-
    Builds a <xref href="PostSharp.Extensibility.MessageLocation" data-throw-if-not-resolved="false"></xref> from an object representing an

    element of code (<xref href="System.Type" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.MethodInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.ConstructorInfo" data-throw-if-not-resolved="false"></xref>,

