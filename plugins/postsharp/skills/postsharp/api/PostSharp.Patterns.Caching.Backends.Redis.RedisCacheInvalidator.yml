  type: Class
  assemblies:
  - PostSharp.Patterns.Caching.Backends.Redis
  namespace: PostSharp.Patterns.Caching.Backends.Redis
  summary: >-
    An implementation of <xref href="PostSharp.Patterns.Caching.Implementation.CacheInvalidator" data-throw-if-not-resolved="false"></xref> that uses Redis publish/subscribe channels to invalidate several

    instances of local caches.
  remarks: >-
    <p>Use this component when you have a Redis server but want to store cached values in a local in-memory cache, for example when the latency
        of the Redis server is too high for caching. Create it with <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCacheInvalidator.Create(PostSharp.Patterns.Caching.Implementation.CachingBackend%2cStackExchange.Redis.IConnectionMultiplexer%2cPostSharp.Patterns.Caching.Backends.Redis.RedisCacheInvalidatorOptions)" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCacheInvalidator.CreateAsync(PostSharp.Patterns.Caching.Implementation.CachingBackend%2cStackExchange.Redis.IConnectionMultiplexer%2cPostSharp.Patterns.Caching.Backends.Redis.RedisCacheInvalidatorOptions%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>, passing the local caching backend,
        and assign the result to <xref href="PostSharp.Patterns.Caching.CachingServices.DefaultBackend" data-throw-if-not-resolved="false"></xref>. All instances of the application must use the same
        <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCacheInvalidatorOptions.ChannelName" data-throw-if-not-resolved="false"></xref>.</p>
    <p>If you already store cached values in Redis with <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackend" data-throw-if-not-resolved="false"></xref>, you do not need this component.
        To add a local cache in front of Redis, use <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.IsLocallyCached" data-throw-if-not-resolved="false"></xref> instead.</p>
  example: []
  syntax:
    content: 'public class RedisCacheInvalidator : CacheInvalidator, IDisposable'
    content.vb: Public Class RedisCacheInvalidator Inherits CacheInvalidator Implements IDisposable
