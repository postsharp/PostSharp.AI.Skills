  name: LogActivity
  nameWithType: LogActivity
  fullName: PostSharp.Patterns.Diagnostics.LogActivity
  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics
  summary: >-
    Represents a logged custom activity, that is, something that has a beginning and an end with a specific outcome.

    This class is instantiated by the legacy API of the <xref href="PostSharp.Patterns.Diagnostics.Logger" data-throw-if-not-resolved="false"></xref> class. For the modern API, see <xref href="PostSharp.Patterns.Diagnostics.LogActivity%601" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: >-
      [RequirePostSharp("PostSharp.Patterns.Common.Weaver", "AddCallerInfoTask", AnyTypeReference = true)]

      public class LogActivity : Logger, IDisposable
    content.vb: >-
      <RequirePostSharp("PostSharp.Patterns.Common.Weaver", "AddCallerInfoTask", AnyTypeReference:=True)>

      Public Class LogActivity Inherits Logger Implements IDisposable
