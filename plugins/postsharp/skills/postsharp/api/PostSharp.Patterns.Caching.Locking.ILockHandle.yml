- uid: PostSharp.Patterns.Caching.Locking.ILockHandle
  commentId: T:PostSharp.Patterns.Caching.Locking.ILockHandle
  id: ILockHandle
  parent: PostSharp.Patterns.Caching.Locking
  children:
  - PostSharp.Patterns.Caching.Locking.ILockHandle.Acquire(System.TimeSpan,System.Threading.CancellationToken)
  - PostSharp.Patterns.Caching.Locking.ILockHandle.AcquireAsync(System.TimeSpan,System.Threading.CancellationToken)
  - PostSharp.Patterns.Caching.Locking.ILockHandle.Release
  - PostSharp.Patterns.Caching.Locking.ILockHandle.ReleaseAsync
  langs:
  - csharp
  - vb
  name: ILockHandle
  nameWithType: ILockHandle
  fullName: PostSharp.Patterns.Caching.Locking.ILockHandle
  type: Interface
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching.Locking
  summary: Allows acquiring and releasing a named lock returned by <xref href="PostSharp.Patterns.Caching.Locking.ILockManager.GetLock(System.String)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>The caching aspect can call <xref href="PostSharp.Patterns.Caching.Locking.ILockHandle.Acquire(System.TimeSpan%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Caching.Locking.ILockHandle.AcquireAsync(System.TimeSpan%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> twice on the same handle: first with a zero timeout and,
        if the lock is not free, with <xref href="PostSharp.Patterns.Caching.CachingProfile.AcquireLockTimeout" data-throw-if-not-resolved="false"></xref>. It then always calls <xref href="PostSharp.Patterns.Caching.Locking.ILockHandle.Release" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Caching.Locking.ILockHandle.ReleaseAsync" data-throw-if-not-resolved="false"></xref>
        and <xref href="System.IDisposable.Dispose" data-throw-if-not-resolved="false"></xref>, including when the lock could not be acquired. Implementations must therefore ignore a release
        of a lock that the handle does not hold.</p>
  example: []
  syntax:
    content: 'public interface ILockHandle : IDisposable'
    content.vb: Public Interface ILockHandle Inherits IDisposable
  seealso:
  - linkType: HRef
    linkId: '@cache-locking'
    altText: 'Conceptual: Preventing Concurrent Execution of Cached Methods'
  inheritedMembers:
  - System.IDisposable.Dispose
