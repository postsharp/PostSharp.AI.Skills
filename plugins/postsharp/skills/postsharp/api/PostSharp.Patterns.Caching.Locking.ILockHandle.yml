  namespace: PostSharp.Patterns.Caching.Locking
  summary: Synchronously acquires the lock bound to the current handle.
  example: []
  syntax:
    content: bool Acquire(TimeSpan timeout, CancellationToken cancellationToken)
    parameters:
    - id: timeout
      type: System.TimeSpan
      description: The timeout of the operation.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A <xref href="System.Threading.CancellationToken" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Boolean
      description: <code>true</code> if the lock was acquired, or <code>false</code> if the operation has timed out before the lock could be acquired.
    content.vb: Function Acquire(timeout As TimeSpan, cancellationToken As CancellationToken) As Boolean
