  name: StandardRoles
  nameWithType: StandardRoles
  fullName: PostSharp.Aspects.Dependencies.StandardRoles
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Dependencies
  summary: Defines the standard roles.
  remarks: >-
    <p>See <xref href="PostSharp.Aspects.Dependencies.AspectRoleDependencyAttribute" data-throw-if-not-resolved="false"></xref> for a discussion of aspect roles.</p>

    <p>Roles are used to categorize aspects according to their function. This class
            defines standard names for the most commonly used aspect roles. If you are an aspect vendor,
            you are encouraged to enroll your aspects (using <xref href="PostSharp.Aspects.Dependencies.ProvideAspectRoleAttribute" data-throw-if-not-resolved="false"></xref>) in
            one of these roles.
          </p>
    <p>
            If this list is not sufficient, we at <code>PostSharp</code> encourage you to
            contact us to define a new role string. In any case, if you define a new role string, we recommend that you
            define it clearly so that users of your aspect can express dependencies with their own aspects
            or with third-party aspects.</p>
  example: []
