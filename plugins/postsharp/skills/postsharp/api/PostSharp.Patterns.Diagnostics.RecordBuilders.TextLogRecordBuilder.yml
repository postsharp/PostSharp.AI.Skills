  name: TextLogRecordBuilder
  nameWithType: TextLogRecordBuilder
  fullName: PostSharp.Patterns.Diagnostics.RecordBuilders.TextLogRecordBuilder
  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.RecordBuilders
  summary: >-
    An implementation of <xref href="PostSharp.Patterns.Diagnostics.RecordBuilders.LogRecordBuilder" data-throw-if-not-resolved="false"></xref> that builds text-based log records.

    This class is the base class for most backends.
  remarks: >-
    <p>In a custom backend, derive a class from <xref href="PostSharp.Patterns.Diagnostics.RecordBuilders.TextLogRecordBuilder" data-throw-if-not-resolved="false"></xref> and return a new instance from
        <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.CreateRecordBuilder" data-throw-if-not-resolved="false"></xref>. This class already builds the text of the record. To keep the default formatting, implement only
        the <xref href="PostSharp.Patterns.Diagnostics.RecordBuilders.TextLogRecordBuilder.Write(PostSharp.Patterns.Formatters.UnsafeString)" data-throw-if-not-resolved="false"></xref> method, which emits the final text to the target logging framework. Override other virtual methods
        to change the formatting or to emit structured records.</p>
    <p>The backend creates one instance for each thread, so a derived class does not need to be thread-safe.</p>
  example: []
  syntax:
    content: 'public abstract class TextLogRecordBuilder : LogRecordBuilder, ICustomLogRecordBuilder, IDisposable'
    content.vb: Public MustInherit Class TextLogRecordBuilder Inherits LogRecordBuilder Implements ICustomLogRecordBuilder, IDisposable
  seealso:
  - linkType: HRef
    linkId: '@custom-logging-backend'
    altText: 'Conceptual: Building Your Own Logging Backend (Adapter)'
