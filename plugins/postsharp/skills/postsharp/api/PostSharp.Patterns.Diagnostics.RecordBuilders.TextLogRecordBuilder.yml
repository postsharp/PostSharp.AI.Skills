    support semantic logging may store the parameter value semantically instead of appending it to the <xref href="PostSharp.Patterns.Diagnostics.RecordBuilders.TextLogRecordBuilder.StringBuilder" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: protected virtual void AppendSemanticParameter(SemanticParameterKind kind, string name, string value, string prefix = null, int index = -1)
    parameters:
