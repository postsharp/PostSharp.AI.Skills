- uid: PostSharp.Aspects.Internals.Arguments`4.SetArgument(System.Int32,System.Object)
  commentId: M:PostSharp.Aspects.Internals.Arguments`4.SetArgument(System.Int32,System.Object)
  id: SetArgument(System.Int32,System.Object)
  parent: PostSharp.Aspects.Internals.Arguments`4
  langs:
  - csharp
  - vb
  name: SetArgument(int, object)
  nameWithType: Arguments<TArg0, TArg1, TArg2, TArg3>.SetArgument(int, object)
  fullName: PostSharp.Aspects.Internals.Arguments<TArg0, TArg1, TArg2, TArg3>.SetArgument(int, object)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Internals
  summary: >-
    Sets the value of the <code>ref</code> or <code>out</code> argument at a given index. Replacing an argument value is supported only in some advices

    and is silently ignored in unsupported scenarios. See Remarks for details.
  remarks: >-
    <p>
        Replacing a parameter value is supported in the following scenarios:
        </p>
    <ul><li>In <xref href="PostSharp.Aspects.OnMethodBoundaryAspect.OnSuccess(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.OnMethodBoundaryAspect.OnExit(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref> advices, to replace
                    the value of <code>ref</code> and <code>out</code> parameters.</li><li>In any interception advice (such as <xref href="PostSharp.Aspects.MethodInterceptionAspect.OnInvoke(PostSharp.Aspects.MethodInterceptionArgs)" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Aspects.LocationInterceptionAspect.OnSetValue(PostSharp.Aspects.LocationInterceptionArgs)" data-throw-if-not-resolved="false"></xref>),
            to set the value passed to the next node in the chain of responsibility, or the value of <code>ref</code> and <code>out</code> parameters.
            </li></ul>
    <p>
        Setting the value in a different situation is unsupported and has unspecified behavior.
        </p>
  example: []
  syntax:
    content: public override void SetArgument(int index, object value)
    parameters:
    - id: index
      type: System.Int32
      description: The index of the argument.
    - id: value
      type: System.Object
      description: The new value of the <code>ref</code> or <code>out</code> argument at position <code class="paramref">index</code>.
    content.vb: Public Overrides Sub SetArgument(index As Integer, value As Object)
  overridden: PostSharp.Aspects.Arguments.SetArgument(System.Int32,System.Object)
  overload: PostSharp.Aspects.Internals.Arguments`4.SetArgument*
  exceptions:
  - type: System.InvalidCastException
    commentId: T:System.InvalidCastException
    description: >-
      <code class="paramref">value</code> is not assignable to the parameter
            at position <code class="paramref">index</code>.
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: <code class="paramref">index</code> is less than zero or greater than or equal to <xref href="PostSharp.Aspects.Arguments.Count" data-throw-if-not-resolved="false"></xref>.
  nameWithType.vb: Arguments(Of TArg0, TArg1, TArg2, TArg3).SetArgument(Integer, Object)
  fullName.vb: PostSharp.Aspects.Internals.Arguments(Of TArg0, TArg1, TArg2, TArg3).SetArgument(Integer, Object)
  name.vb: SetArgument(Integer, Object)
