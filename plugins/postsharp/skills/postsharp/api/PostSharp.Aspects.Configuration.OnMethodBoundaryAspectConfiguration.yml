- uid: PostSharp.Aspects.Configuration.OnMethodBoundaryAspectConfiguration.SemanticallyAdvisedMethodKinds
  commentId: P:PostSharp.Aspects.Configuration.OnMethodBoundaryAspectConfiguration.SemanticallyAdvisedMethodKinds
  id: SemanticallyAdvisedMethodKinds
  parent: PostSharp.Aspects.Configuration.OnMethodBoundaryAspectConfiguration
  langs:
