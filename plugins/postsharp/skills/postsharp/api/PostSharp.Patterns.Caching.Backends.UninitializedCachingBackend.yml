      type: System.String
      description: The key of the cache item.
    - id: includeDependencies
      type: System.Boolean
      description: >-
        <code>true</code> if the <xref href="PostSharp.Patterns.Caching.Implementation.CacheValue.Dependencies" data-throw-if-not-resolved="false"></xref> properties of the
            resulting <xref href="PostSharp.Patterns.Caching.Implementation.CacheValue" data-throw-if-not-resolved="false"></xref> should be populated, otherwise <code>false</code>.
    return:
      type: PostSharp.Patterns.Caching.Implementation.CacheValue
      description: A <xref href="PostSharp.Patterns.Caching.Implementation.CacheValue" data-throw-if-not-resolved="false"></xref>, or <code>null</code> if there is no item in the cache with the given <code class="paramref">key</code>.
