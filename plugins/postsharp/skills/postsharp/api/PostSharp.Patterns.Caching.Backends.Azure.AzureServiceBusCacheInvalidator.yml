  type: Class
  assemblies:
  - PostSharp.Patterns.Caching.Backends.Azure
  namespace: PostSharp.Patterns.Caching.Backends.Azure
  summary: >-
    An implementation of <xref href="PostSharp.Patterns.Caching.Implementation.CacheInvalidator" data-throw-if-not-resolved="false"></xref> based on Microsoft Azure Service Bus, using the <code>Azure.Messaging.ServiceBus</code> API

    meant for .NET Standard.
  remarks: >-
    <p>Use this component to synchronize the local in-memory caches of several instances of an application.

    Create it with <xref href="PostSharp.Patterns.Caching.Backends.Azure.AzureServiceBusCacheInvalidator.Create(PostSharp.Patterns.Caching.Implementation.CachingBackend%2cPostSharp.Patterns.Caching.Backends.Azure.AzureServiceBusCacheInvalidatorOptions)" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Caching.Backends.Azure.AzureServiceBusCacheInvalidator.CreateAsync(PostSharp.Patterns.Caching.Implementation.CachingBackend%2cPostSharp.Patterns.Caching.Backends.Azure.AzureServiceBusCacheInvalidatorOptions)" data-throw-if-not-resolved="false"></xref>, passing the local caching backend, and assign the result to

    <xref href="PostSharp.Patterns.Caching.ICachingService.Backend?text=CachingServices.DefaultService.Backend" data-throw-if-not-resolved="false"></xref>. Invalidation is asynchronous, so different instances can return different data for a short time.</p>

    <p>Each instance of the invalidator needs its own topic subscription. When <xref href="PostSharp.Patterns.Caching.Backends.Azure.AzureServiceBusCacheInvalidatorOptions.SubscriptionName" data-throw-if-not-resolved="false"></xref>

    is <code>null</code>, the invalidator creates a subscription with a random name, which Azure Service Bus deletes after

    <xref href="PostSharp.Patterns.Caching.Backends.Azure.AzureServiceBusCacheInvalidatorOptions.AutoDeleteOnIdle" data-throw-if-not-resolved="false"></xref>. This requires the connection string to grant the <code>Manage</code> right.

    Otherwise, create one subscription per application instance and set its name in <xref href="PostSharp.Patterns.Caching.Backends.Azure.AzureServiceBusCacheInvalidatorOptions.SubscriptionName" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: 'public class AzureServiceBusCacheInvalidator : CacheInvalidator, IDisposable'
    content.vb: Public Class AzureServiceBusCacheInvalidator Inherits CacheInvalidator Implements IDisposable
