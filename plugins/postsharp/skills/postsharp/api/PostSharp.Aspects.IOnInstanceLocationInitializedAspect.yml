- uid: PostSharp.Aspects.IOnInstanceLocationInitializedAspect.OnInstanceLocationInitialized(PostSharp.Aspects.LocationInitializationArgs)
  commentId: M:PostSharp.Aspects.IOnInstanceLocationInitializedAspect.OnInstanceLocationInitialized(PostSharp.Aspects.LocationInitializationArgs)
