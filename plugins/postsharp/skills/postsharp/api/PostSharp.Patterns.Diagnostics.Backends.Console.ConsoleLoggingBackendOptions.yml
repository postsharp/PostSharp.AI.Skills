  type: Property
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Backends.Console
  summary: >-
    Gets or sets the color theme. A set of ready-made themes is exposed on the <xref href="PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleThemes" data-throw-if-not-resolved="false"></xref> class.

    The default value is <xref href="PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleThemes.Classic" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>To customize the colors, assign a <xref href="PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleTheme" data-throw-if-not-resolved="false"></xref>, for example a copy of <xref href="PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleThemes.Dark" data-throw-if-not-resolved="false"></xref>
        returned by <xref href="PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleTheme.Clone" data-throw-if-not-resolved="false"></xref>, or your own implementation of <xref href="PostSharp.Patterns.Diagnostics.Backends.Console.IConsoleTheme" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public IConsoleTheme Theme { get; set; }
    parameters: []
    return:
      type: PostSharp.Patterns.Diagnostics.Backends.Console.IConsoleTheme
    content.vb: Public Property Theme As IConsoleTheme
  overload: PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleLoggingBackendOptions.Theme*
