  summary: Base class for all operation formatters, which provide a human-readable description of operations (<xref href="PostSharp.Patterns.Recording.Operation" data-throw-if-not-resolved="false"></xref>).
  remarks: >-
    <p>Instances of the <xref href="PostSharp.Patterns.Recording.OperationFormatter" data-throw-if-not-resolved="false"></xref> class form a chain of responsibility. If one instance does not know how
        to format an <xref href="PostSharp.Patterns.Recording.Operation" data-throw-if-not-resolved="false"></xref>, it calls the next instance in the chain.</p>
    <p>To use a custom formatter, assign it to the <xref href="PostSharp.Patterns.Recording.RecordingServices.OperationFormatter" data-throw-if-not-resolved="false"></xref> property and pass the previous value
        of this property to its constructor.</p>
  example: []
