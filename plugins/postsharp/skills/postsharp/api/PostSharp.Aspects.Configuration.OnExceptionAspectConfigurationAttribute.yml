  langs:
  - csharp
  - vb
  name: SetAspectConfiguration(AspectConfiguration)
  nameWithType: OnExceptionAspectConfigurationAttribute.SetAspectConfiguration(AspectConfiguration)
  fullName: PostSharp.Aspects.Configuration.OnExceptionAspectConfigurationAttribute.SetAspectConfiguration(PostSharp.Aspects.Configuration.AspectConfiguration)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Configuration
  summary: Sets up an <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref> object according to the current custom attribute instance.
  remarks: >-
    <p>Classes overriding this method must always invoke the base implementation before performing their own
            changes to the <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: protected override void SetAspectConfiguration(AspectConfiguration aspectConfiguration)
    parameters:
    - id: aspectConfiguration
      type: PostSharp.Aspects.Configuration.AspectConfiguration
      description: >-
        The <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref> instance previously returned by the
                      <xref href="PostSharp.Aspects.Configuration.AspectConfigurationAttribute.CreateAspectConfiguration" data-throw-if-not-resolved="false"></xref> method.
    content.vb: Protected Overrides Sub SetAspectConfiguration(aspectConfiguration As AspectConfiguration)
  overridden: PostSharp.Aspects.Configuration.AspectConfigurationAttribute.SetAspectConfiguration(PostSharp.Aspects.Configuration.AspectConfiguration)
  overload: PostSharp.Aspects.Configuration.OnExceptionAspectConfigurationAttribute.SetAspectConfiguration*
