  name: OnExceptionAspectConfigurationAttribute
  nameWithType: OnExceptionAspectConfigurationAttribute
  fullName: PostSharp.Aspects.Configuration.OnExceptionAspectConfigurationAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Configuration
  summary: >-
    Custom attribute that, when applied to a class implementing <xref href="PostSharp.Aspects.IOnExceptionAspect" data-throw-if-not-resolved="false"></xref>,

    defines the configuration of that aspect.
  remarks: >-
    A property set by this custom attribute takes precedence over the value that the aspect provides imperatively, for example

    from <xref href="PostSharp.Aspects.OnExceptionAspect.GetExceptionType(System.Reflection.MethodBase)" data-throw-if-not-resolved="false"></xref>. When this custom attribute sets the same property on several classes

    of the aspect hierarchy, the value from the most derived class wins.
  example: []
  syntax:
    content: 'public sealed class OnExceptionAspectConfigurationAttribute : AspectConfigurationAttribute'
    content.vb: Public NotInheritable Class OnExceptionAspectConfigurationAttribute Inherits AspectConfigurationAttribute
