  summary: Custom attribute that, when applied on a method, causes PostSharp to implement tracing before and after the execution of this method.
  remarks: >-
    <p>By default, this custom attribute follows the settings of the default profile, which adds a <xref href="PostSharp.Patterns.Diagnostics.LogLevel.Debug" data-throw-if-not-resolved="false"></xref> message
            on entry and on success, and a <xref href="PostSharp.Patterns.Diagnostics.LogLevel.Warning" data-throw-if-not-resolved="false"></xref> message on exception. All messages include parameter values. You
            can change these default settings by editing the logging profile in <code>postsharp.config</code>, or by passing the name of a different
            logging profile to the <xref href="PostSharp.Patterns.Diagnostics.LogAttribute.%23ctor(System.String)" data-throw-if-not-resolved="false"></xref> constructor. See <xref href="PostSharp.Patterns.Diagnostics.LoggingProfile" data-throw-if-not-resolved="false"></xref>.</p>
    <p>To add logging to many methods, apply this attribute to the assembly and filter the targets with the multicasting properties,
            or add it to all projects of a directory with <code>postsharp.config</code>.</p>
    <p>The aspect only emits log records. To write them, set <xref href="PostSharp.Patterns.Diagnostics.LoggingServices.DefaultBackend" data-throw-if-not-resolved="false"></xref> to a <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend" data-throw-if-not-resolved="false"></xref>
            when the application starts. Until then, the records are sent to the <xref href="PostSharp.Patterns.Diagnostics.Backends.Null.NullLoggingBackend" data-throw-if-not-resolved="false"></xref>, which discards them.</p>
