  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    Custom attribute that, when applied to an assembly, means that a given message

    should be escalated to an error during the current <code>PostSharp</code> session.
  remarks: Errors and fatal errors cannot be disabled.
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly, AllowMultiple = true)]

      public sealed class EscalatePostSharpMessageAttribute : Attribute
