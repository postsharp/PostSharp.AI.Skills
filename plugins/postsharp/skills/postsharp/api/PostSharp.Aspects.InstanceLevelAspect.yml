- uid: PostSharp.Aspects.InstanceLevelAspect.OnCloned(PostSharp.Aspects.ICloneAwareAspect)
  commentId: M:PostSharp.Aspects.InstanceLevelAspect.OnCloned(PostSharp.Aspects.ICloneAwareAspect)
  id: OnCloned(PostSharp.Aspects.ICloneAwareAspect)
  parent: PostSharp.Aspects.InstanceLevelAspect
  langs:
  - csharp
  - vb
  name: OnCloned(ICloneAwareAspect)
  nameWithType: InstanceLevelAspect.OnCloned(ICloneAwareAspect)
  fullName: PostSharp.Aspects.InstanceLevelAspect.OnCloned(PostSharp.Aspects.ICloneAwareAspect)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Method called after an object enhanced by the current aspect has been

    cloned using <xref href="System.Object.MemberwiseClone" data-throw-if-not-resolved="false"></xref>. The <code>this</code>

    parameter refers to the new aspect instance in the cloned object.
  remarks: >-
    <p>Prior to calling the current method, the aspect framework
        initializes the <code class="paramref">source</code> object using <xref href="PostSharp.Aspects.IInstanceScopedAspect.CreateInstance(PostSharp.Aspects.AdviceArgs)" data-throw-if-not-resolved="false"></xref> 
        and <xref href="PostSharp.Aspects.IInstanceScopedAspect.RuntimeInitializeInstance" data-throw-if-not-resolved="false"></xref>. That is, the aspect instance
        in the cloned object is not cloned from the source aspect instance, but from the prototype
        aspect instance.
        </p>
  example: []
  syntax:
    content: public virtual void OnCloned(ICloneAwareAspect source)
    parameters:
    - id: source
      type: PostSharp.Aspects.ICloneAwareAspect
      description: >-
        Aspect instance corresponding to the current
                    aspect instance in the cloned target object.
    content.vb: Public Overridable Sub OnCloned(source As ICloneAwareAspect)
  overload: PostSharp.Aspects.InstanceLevelAspect.OnCloned*
  implements:
  - PostSharp.Aspects.ICloneAwareAspect.OnCloned(PostSharp.Aspects.ICloneAwareAspect)
- uid: PostSharp.Aspects.InstanceLevelAspect.CreateAspectConfiguration
  commentId: M:PostSharp.Aspects.InstanceLevelAspect.CreateAspectConfiguration
  id: CreateAspectConfiguration
  parent: PostSharp.Aspects.InstanceLevelAspect
  langs:
  - csharp
  - vb
  name: CreateAspectConfiguration()
  nameWithType: InstanceLevelAspect.CreateAspectConfiguration()
  fullName: PostSharp.Aspects.InstanceLevelAspect.CreateAspectConfiguration()
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Method invoked at build time to create a concrete <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref> instance specifically

    for the current <xref href="PostSharp.Aspects.Aspect" data-throw-if-not-resolved="false"></xref> type.
  remarks: >-
    This method should not set up the returned <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref>. After the current method has

    returned, the <xref href="PostSharp.Aspects.Aspect.SetAspectConfiguration(PostSharp.Aspects.Configuration.AspectConfiguration%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> method will be invoked, and that method is responsible

    for setting up the <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref> object.
  example: []
  syntax:
    content: protected override AspectConfiguration CreateAspectConfiguration()
    return:
      type: PostSharp.Aspects.Configuration.AspectConfiguration
      description: >-
        A new and empty instance of <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref>, whose concrete type corresponds to
                      the concrete type of the <xref href="PostSharp.Aspects.Aspect" data-throw-if-not-resolved="false"></xref>.
    content.vb: Protected Overrides Function CreateAspectConfiguration() As AspectConfiguration
  overridden: PostSharp.Aspects.Aspect.CreateAspectConfiguration
  overload: PostSharp.Aspects.InstanceLevelAspect.CreateAspectConfiguration*
  seealso:
  - linkType: HRef
    linkId: '@aspect-configuration'
    altText: 'Conceptual: Aspect Configuration'
