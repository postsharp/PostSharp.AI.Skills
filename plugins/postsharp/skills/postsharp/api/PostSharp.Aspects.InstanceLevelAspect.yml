  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Base class for aspects applied on types, but having the same lifetime as

    instances of the type to which they are applied.
  remarks: >-
    <p>This class is provided for convenience. You get the same functionality by deriving your
            aspect class directly from <xref href="PostSharp.Aspects.TypeLevelAspect" data-throw-if-not-resolved="false"></xref> and implementing the interface
            <xref href="PostSharp.Aspects.IInstanceScopedAspect" data-throw-if-not-resolved="false"></xref>.
            </p>
        <br />
        <p>See <xref href="PostSharp.Aspects.IInstanceScopedAspect" data-throw-if-not-resolved="false"></xref> for a discussion of instance-scoped aspects.</p>
        <p>This class does not provide any advice. It is typically the base class of composite aspects that introduce interfaces or members
            into the target class, or that add advices to its members. Each instance of the target class gets its own copy of the aspect,
            created by <xref href="PostSharp.Aspects.InstanceLevelAspect.CreateInstance(PostSharp.Aspects.AdviceArgs)" data-throw-if-not-resolved="false"></xref> as a shallow copy (<xref href="System.Object.MemberwiseClone" data-throw-if-not-resolved="false"></xref>) of the aspect instance,
            and <xref href="PostSharp.Aspects.InstanceLevelAspect.Instance" data-throw-if-not-resolved="false"></xref> gives the target object.</p>
        <br />
        <p>
          <div class="NOTE"><h5>note</h5><p>
        All classes implementing
        <xref href="PostSharp.Aspects.IAspect" data-throw-if-not-resolved="false"></xref>
        should typically be marked as serializable
        using the 
        <xref href="System.SerializableAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.PSerializableAttribute" data-throw-if-not-resolved="false"></xref> custom attribute. Fields that
        are only used at runtime (and unknown at compile-time) should be carefully
        marked with the <xref href="System.NonSerializedAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.PNonSerializedAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.
        When another aspect serializer (such as <xref href="PostSharp.Aspects.Serialization.MsilAspectSerializer" data-throw-if-not-resolved="false"></xref>) is used,
        it is not necessary to mark the aspect class as serializable.
        For more information, see
        <a href="@aspect-serialization">Aspect Serialization</a>.
      </p></div>
        </p>
        <a href="@aspect-serialization">
      Conceptual: Understanding Aspect Serialization
    </a>
  example: []
  syntax:
    content: >-
      [HasInheritedAttribute]

      [MulticastAttributeUsage(MulticastTargets.Class, AllowExternalAssemblies = false, TargetTypeAttributes = MulticastAttributes.Instance)]

      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Class|AttributeTargets.Interface, AllowMultiple = true)]

      [Serializer(null)]

      public abstract class InstanceLevelAspect : TypeLevelAspect, ITypeLevelAspect, ITypeLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, ICloneAwareAspect, IInstanceScopedAspect, IAspect
    content.vb: >-
