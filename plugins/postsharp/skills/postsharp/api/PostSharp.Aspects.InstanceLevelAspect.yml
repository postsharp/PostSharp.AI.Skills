  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Creates a new instance of the aspect based on the current instance, serving as a prototype.
  remarks: This method is typically implemented by invoking <xref href="System.Object.MemberwiseClone" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: >-
      [HasInheritedAttribute]

      public virtual object CreateInstance(AdviceArgs adviceArgs)
    parameters:
    - id: adviceArgs
      type: PostSharp.Aspects.AdviceArgs
      description: Aspect arguments.
    return:
      type: System.Object
      description: A new instance of the aspect, typically a clone of the current prototype instance.
    content.vb: >-
      <HasInheritedAttribute>

      Public Overridable Function CreateInstance(adviceArgs As AdviceArgs) As Object
