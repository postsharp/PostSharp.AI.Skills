  name: MemoryCacheBackend
  nameWithType: MemoryCacheBackend
  fullName: PostSharp.Patterns.Caching.Backends.MemoryCacheBackend
  type: Class
  assemblies:
  - PostSharp.Patterns.Caching.Backends.IMemoryCache
  namespace: PostSharp.Patterns.Caching.Backends
  summary: >-
    A <xref href="PostSharp.Patterns.Caching.Implementation.CachingBackend" data-throw-if-not-resolved="false"></xref> based on Microsoft.Extensions.Caching.Memory.IMemoryCache (<xref href="Microsoft.Extensions.Caching.Memory.IMemoryCache" data-throw-if-not-resolved="false"></xref>).

    This cache is recommended for ASP.NET Core use (as opposed to <code>System.Runtime.Caching.MemoryCache</code>).
  remarks: >-
    This backend converts PostSharp configuration properties into <xref href="Microsoft.Extensions.Caching.Memory.ICacheEntry" data-throw-if-not-resolved="false"></xref> instances as follows:


    <ul><li>The priority <code>Default</code> is converted to <xref href="Microsoft.Extensions.Caching.Memory.CacheItemPriority.Normal" data-throw-if-not-resolved="false"></xref>.</li><li>The property <xref href="Microsoft.Extensions.Caching.Memory.ICacheEntry.Size" data-throw-if-not-resolved="false"></xref> is normally not set. If you want it to be set, supply a function to calculate this value for each entry

    in the <xref href="PostSharp.Patterns.Caching.Backends.MemoryCacheBackend.%23ctor(Microsoft.Extensions.Caching.Memory.IMemoryCache%2cSystem.Func%7bPostSharp.Patterns.Caching.Implementation.CacheItem%2cSystem.Int64%7d)" data-throw-if-not-resolved="false"></xref> constructor. You only need to do this if you intend to limit the size

    of the cache.</li></ul>
  example: []
  syntax:
    content: 'public class MemoryCacheBackend : CachingBackend, IDisposable'
    content.vb: Public Class MemoryCacheBackend Inherits CachingBackend Implements IDisposable
  seealso:
