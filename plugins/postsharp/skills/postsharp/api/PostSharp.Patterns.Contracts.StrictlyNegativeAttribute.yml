  fullName: PostSharp.Patterns.Contracts.StrictlyNegativeAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Contracts
  summary: >-
    Custom attribute that, when added to a field, property or parameter, throws

    an <xref href="System.ArgumentOutOfRangeException" data-throw-if-not-resolved="false"></xref> if the target is assigned a value

    greater than or equal to zero.
  remarks: >-
    <p>Null values are accepted and do not throw an exception.
        </p>
    <p>The error message is identified by <xref href="PostSharp.Patterns.Contracts.ContractLocalizedTextProvider.LessThanErrorMessage" data-throw-if-not-resolved="false"></xref>.</p>
