  fullName: PostSharp.Patterns.Model.PureAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Model
  summary: >-
    Custom attribute that, when applied on a method, specifies that this method is a pure function, that is, the method always

    returns the same result given the same parameter values. In the context of <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedAttribute" data-throw-if-not-resolved="false"></xref>,

    it is also assumed that pure functions have only parameters of primitive types (<xref href="System.Int32" data-throw-if-not-resolved="false"></xref>, <xref href="System.String" data-throw-if-not-resolved="false"></xref>, and so on).

    The <xref href="System.Object" data-throw-if-not-resolved="false"></xref> parameter type is also accepted, but then it is assumed that instances passed are immutable,

    and changes to these objects will not be tracked.
  remarks: >-
    <p>The dependency analysis of the <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedAttribute" data-throw-if-not-resolved="false"></xref> aspect cannot analyze calls to most static methods and to methods
        of other classes, and reports an error when a property getter calls one. Mark such a helper method as pure to allow the call: the analysis
        then accepts the call without analyzing the body of the method.</p>
    <p>When you apply this attribute to a class, a struct or an assembly, it applies to all methods of that declaration.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Class|AttributeTargets.Struct|AttributeTargets.Method, AllowMultiple = true)]

      [MulticastAttributeUsage(MulticastTargets.Method, PersistMetaData = true, AllowMultiple = false)]

      public sealed class PureAttribute : MulticastAttribute, IValidableAnnotation
    content.vb: >-
      <AttributeUsage(AttributeTargets.AssemblyOrAttributeTargets.ClassOrAttributeTargets.StructOrAttributeTargets.Method, AllowMultiple:=True)>

      <MulticastAttributeUsage(MulticastTargets.Method, PersistMetaData:=True, AllowMultiple:=False)>

      Public NotInheritable Class PureAttribute Inherits MulticastAttribute Implements IValidableAnnotation
