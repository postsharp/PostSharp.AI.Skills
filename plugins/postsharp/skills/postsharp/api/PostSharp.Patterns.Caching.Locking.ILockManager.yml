  type: Interface
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching.Locking
  summary: Provides instances of named locks.
  remarks: >-
    <p>Two implementations are provided: <xref href="PostSharp.Patterns.Caching.Locking.NullLockManager" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Caching.Locking.LocalLockManager" data-throw-if-not-resolved="false"></xref>.
        To change the lock manager, set the <xref href="PostSharp.Patterns.Caching.CachingProfile.LockManager" data-throw-if-not-resolved="false"></xref> property.</p>
    <p>The caching aspect requests a lock named after the cache key when a cached method is not found in the cache, so that only one caller
        evaluates the method for a given set of arguments. To prevent concurrent evaluation across processes or machines, implement this interface
        and <xref href="PostSharp.Patterns.Caching.Locking.ILockHandle" data-throw-if-not-resolved="false"></xref> on top of a distributed lock.</p>
  example: []
