  nameWithType: IAsyncMethodInterceptionAspect
  fullName: PostSharp.Aspects.IAsyncMethodInterceptionAspect
  type: Interface
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Runtime semantics of an aspect that, when applied on a method, intercepts invocations of this method.

    Includes semantics for both async and non-async method interception.
  remarks: See <xref href="PostSharp.Aspects.MethodInterceptionAspect" data-throw-if-not-resolved="false"></xref> for details.
  example: []
  syntax:
    content: >-
      [HasInheritedAttribute]

      public interface IAsyncMethodInterceptionAspect : IMethodInterceptionAspect, IMethodLevelAspect, IAspect
    content.vb: >-
      <HasInheritedAttribute>

      Public Interface IAsyncMethodInterceptionAspect Inherits IMethodInterceptionAspect, IMethodLevelAspect, IAspect
  derivedClasses:
