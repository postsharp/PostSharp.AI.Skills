  name: LocationValidationAdvice
  nameWithType: LocationValidationAdvice
  fullName: PostSharp.Aspects.Advices.LocationValidationAdvice
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Custom attribute that, when applied on a method of an aspect class, specifies that this method

    has the same semantics as the <xref href="PostSharp.Aspects.ILocationValidationAspect%601.ValidateValue(%600%2cSystem.String%2cPostSharp.Reflection.LocationKind%2cPostSharp.Aspects.LocationValidationContext)" data-throw-if-not-resolved="false"></xref> method

    of the <xref href="PostSharp.Aspects.ILocationValidationAspect%601" data-throw-if-not-resolved="false"></xref> interface.
  remarks: >-
    <p>
            The method to which this custom attribute is applied must be public and must have the same signature as
            <xref href="PostSharp.Aspects.ILocationValidationAspect%601.ValidateValue(%600%2cSystem.String%2cPostSharp.Reflection.LocationKind%2cPostSharp.Aspects.LocationValidationContext)" data-throw-if-not-resolved="false"></xref>, where <code>T</code> can be any type. However, the method can be static.
          </p>
    <p>
            To validate locations of different types, group several validation methods, each with a different value type,
            by setting <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Master" data-throw-if-not-resolved="false"></xref>. For each field, property or parameter, PostSharp selects the method whose
            value type is the closest match for the type of the location. When several methods match equally well, <xref href="PostSharp.Aspects.Advices.LocationValidationAdvice.Priority" data-throw-if-not-resolved="false"></xref>
            decides; if it does not, or if no method matches, PostSharp emits a build error.
          </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method, AllowMultiple = true, Inherited = true)]

      public class LocationValidationAdvice : GroupingAdvice
    content.vb: >-
      <AttributeUsage(AttributeTargets.Method, AllowMultiple:=True, Inherited:=True)>

      Public Class LocationValidationAdvice Inherits GroupingAdvice
