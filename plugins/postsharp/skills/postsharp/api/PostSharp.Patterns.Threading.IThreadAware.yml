  - PostSharp.Patterns.Threading.IThreadAware.OnParentControllerChanged(PostSharp.Patterns.Threading.IConcurrencyController)
  langs:
  - csharp
  - vb
  name: IThreadAware
  nameWithType: IThreadAware
  fullName: PostSharp.Patterns.Threading.IThreadAware
  type: Interface
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Interface implemented by objects that are aware of concurrency. Access to thread-aware objects is controlled by a concurrency controller (<xref href="PostSharp.Patterns.Threading.IConcurrencyController" data-throw-if-not-resolved="false"></xref>).

    Any aspect implementing a threading model (<code>ThreadAwareObjectAttribute</code>) introduces this interface to the target class and ensures that accesses to this class go through

    the controller.
  remarks: >-
    <p>
        Thread-aware does not mean thread-safe. Check the <xref href="PostSharp.Patterns.Threading.IConcurrencyController.IsSharable" data-throw-if-not-resolved="false"></xref> property of <xref href="PostSharp.Patterns.Threading.IThreadAware.ConcurrencyController" data-throw-if-not-resolved="false"></xref> to determine
        whether the current object can be shared between different threads.
        </p>
    <p>
        A threading model can add this interface to an advisable collection, such as <xref href="PostSharp.Patterns.Collections.AdvisableCollection%601" data-throw-if-not-resolved="false"></xref>,
        at run time. A cast of such a collection to <xref href="PostSharp.Patterns.Threading.IThreadAware" data-throw-if-not-resolved="false"></xref> fails; use <xref href="PostSharp.Patterns.DynamicAdvising.DynamicAdvisingServices.QueryInterface%60%601(System.Object%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> instead.
        </p>
  example: []
  syntax:
    content: >-
      [InternalImplement(AttributeId = 627500528741416983)]

      public interface IThreadAware
    content.vb: >-
      <InternalImplement(AttributeId:=627500528741416983)>

      Public Interface IThreadAware
