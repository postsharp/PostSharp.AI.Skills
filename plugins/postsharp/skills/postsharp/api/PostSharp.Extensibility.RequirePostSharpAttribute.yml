  nameWithType: RequirePostSharpAttribute.AnyTypeReference
  fullName: PostSharp.Extensibility.RequirePostSharpAttribute.AnyTypeReference
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    Gets or sets a value indicating whether the current attribute applies to any project that has a

    reference to the target type. If <code>false</code>, the requirement will apply only

    to assemblies that use the target type as a custom attribute. If <code>true</code>,

    the requirement will apply to any assembly that references the target type. The default value is <code>false</code>.
  example: []
