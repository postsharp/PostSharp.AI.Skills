  summary: >-
    Custom attribute that, when applied to another custom attribute (a class derived 

    from <xref href="System.Attribute" data-throw-if-not-resolved="false"></xref>), means that assemblies with elements

    annotated with that custom attribute should be processed by <code>PostSharp</code>.
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Class|AttributeTargets.Struct|AttributeTargets.Interface, AllowMultiple = true)]

      public sealed class RequirePostSharpAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.AssemblyOrAttributeTargets.ClassOrAttributeTargets.StructOrAttributeTargets.Interface, AllowMultiple:=True)>

      Public NotInheritable Class RequirePostSharpAttribute Inherits Attribute
