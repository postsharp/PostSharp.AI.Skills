  namespace: PostSharp.Patterns.Diagnostics.Backends.Microsoft
  summary: Logging backend for <code>Microsoft.Extensions.Logging</code>.
  remarks: >-
    <p>To use this backend, create an instance with the <xref href="Microsoft.Extensions.Logging.ILoggerFactory" data-throw-if-not-resolved="false"></xref> of the application, for example the one of

    the ASP.NET Core host, and assign it to <xref href="PostSharp.Patterns.Diagnostics.LoggingServices.DefaultBackend" data-throw-if-not-resolved="false"></xref> before any logged code runs.

    Make sure the minimum level of the logging providers lets through the records you want to see.</p>

    <p>To also route the events that your code logs directly with <xref href="Microsoft.Extensions.Logging.ILogger" data-throw-if-not-resolved="false"></xref> through PostSharp Logging, create this

    backend with a separate <xref href="Microsoft.Extensions.Logging.ILoggerFactory" data-throw-if-not-resolved="false"></xref> built from the output providers, and register

    <xref href="PostSharp.Patterns.Diagnostics.Backends.Microsoft.MicrosoftLoggingCollectingLoggerProvider" data-throw-if-not-resolved="false"></xref> instead of those providers in the application.</p>
  example: []
  syntax:
    content: 'public class MicrosoftLoggingBackend : TextLoggingBackend, IDisposable'
    content.vb: Public Class MicrosoftLoggingBackend Inherits TextLoggingBackend Implements IDisposable
