  nameWithType: SerializationServices.GetSerializationException(MemberInfo)
  fullName: PostSharp.Serialization.SerializationServices.GetSerializationException(System.Reflection.MemberInfo)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Serialization
  summary: >-
    Checks whether a given <xref href="System.Reflection.MethodInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.ConstructorInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.FieldInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref>,

    <xref href="System.Reflection.EventInfo" data-throw-if-not-resolved="false"></xref> or <xref href="System.Type" data-throw-if-not-resolved="false"></xref> can be safely serialized.
  example: []
  syntax:
    content: public static PortableSerializationException GetSerializationException(MemberInfo memberInfo)
    parameters:
    - id: memberInfo
      type: System.Reflection.MemberInfo
      description: The declaration to be serialized.
    return:
      type: PostSharp.Serialization.PortableSerializationException
      description: >-
        <code>null</code> if <code class="paramref">memberInfo</code> can be safely serialized, otherwise an exception whose text describes
            the reason why the declaration is not serializable.
    content.vb: Public Shared Function GetSerializationException(memberInfo As MemberInfo) As PortableSerializationException
