  name: MatchPointcut
  nameWithType: MatchPointcut
  fullName: PostSharp.Aspects.Advices.MatchPointcut
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    <xref href="PostSharp.Aspects.Advices.Pointcut" data-throw-if-not-resolved="false"></xref> that selects the methods of the target type that have a given name, and applies the advice only to those
         whose signature matches the bound parameters of the advice.
  remarks: >-
    <p>
         The aspect must be applied to a type, for instance a <xref href="PostSharp.Aspects.TypeLevelAspect" data-throw-if-not-resolved="false"></xref>. The pointcut selects the methods declared by this type
         whose name is <xref href="PostSharp.Aspects.Advices.MatchPointcut.MethodName" data-throw-if-not-resolved="false"></xref>, including the static and non-public ones. When <xref href="PostSharp.Aspects.Advices.MatchPointcut.MatchParameterCount" data-throw-if-not-resolved="false"></xref> is <code>true</code>,
         it also requires a given number of parameters.
         </p>
    <p>
         The advice is then applied only to the selected methods whose signature matches its parameters bound by custom attributes derived from
         <xref href="PostSharp.Aspects.Advices.AdviceParameterAttribute" data-throw-if-not-resolved="false"></xref>. A method that does not match, for instance because an argument bound by <xref href="PostSharp.Aspects.Advices.ArgumentAttribute" data-throw-if-not-resolved="false"></xref>
         is missing or has an incompatible type, or because two bound values give conflicting type arguments to a generic advice, is skipped
         without error and left unchanged. Errors that do not come from the signature of the method, such as a violated generic constraint, are
         still reported. Several advices with the same pointcut can therefore handle the different overloads of a method.
         </p>
  example:
  - >-
    <p>The following advices of a <xref href="PostSharp.Aspects.TypeLevelAspect" data-throw-if-not-resolved="false"></xref> apply to the overloads <code>Add(string)</code> and <code>Add(string, string)</code>
         of the target type <code>Catalog</code>. An overload <code>Add(int)</code> matches none of them and is left unchanged.</p>
    <pre><code class="lang-csharp">[OnMethodEntryAdvice, MatchPointcut( nameof(Catalog.Add) )]

    public static void OnAddItem( [Argument( 0 )] string item ) { }


    [OnMethodEntryAdvice, MatchPointcut( nameof(Catalog.Add) )]

    public static void OnAddPair( [Argument( 0 )] string key, [Argument( 1 )] string value ) { }</code></pre>
  syntax:
    content: 'public sealed class MatchPointcut : Pointcut'
