- uid: PostSharp.Aspects.Advices.MatchPointcut.MatchParameterCount
  commentId: P:PostSharp.Aspects.Advices.MatchPointcut.MatchParameterCount
  id: MatchParameterCount
  parent: PostSharp.Aspects.Advices.MatchPointcut
  langs:
  - csharp
  - vb
  name: MatchParameterCount
  nameWithType: MatchPointcut.MatchParameterCount
  fullName: PostSharp.Aspects.Advices.MatchPointcut.MatchParameterCount
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Gets or sets a value indicating whether the pointcut selects only the methods whose number of parameters is the highest index of the

    parameters of the advice bound by <xref href="PostSharp.Aspects.Advices.ArgumentAttribute.%23ctor(System.Int32)" data-throw-if-not-resolved="false"></xref>, plus one. The default value is <code>true</code>.
  remarks: >-
    Only the parameters that select an argument by its index are counted. When the advice has no such parameter, all the methods with the

    name <xref href="PostSharp.Aspects.Advices.MatchPointcut.MethodName" data-throw-if-not-resolved="false"></xref> are selected.
