  summary: >-
    The <xref href="PostSharp.Patterns.Threading.Models.ReaderWriterSynchronizedThreadingModel" data-throw-if-not-resolved="false"></xref> class describes a threading model where several threads can have concurrent read-only access,

    but where writing to the object requires exclusive access.

    To use the <xref href="PostSharp.Patterns.Threading.Models.ReaderWriterSynchronizedThreadingModel" data-throw-if-not-resolved="false"></xref>, apply the <xref href="PostSharp.Patterns.Threading.ReaderWriterSynchronizedAttribute" data-throw-if-not-resolved="false"></xref> custom attribute to a class.
