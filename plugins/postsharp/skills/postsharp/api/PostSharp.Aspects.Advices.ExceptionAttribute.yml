  namespace: PostSharp.Aspects.Advices
  summary: Binds a parameter of an <xref href="PostSharp.Aspects.Advices.OnMethodExceptionAdvice" data-throw-if-not-resolved="false"></xref> method to the exception thrown by the target method.
  remarks: >-
    <p>The parameter must be of type <xref href="System.Exception" data-throw-if-not-resolved="false"></xref>, or of type <xref href="System.Object" data-throw-if-not-resolved="false"></xref> when it is passed by value.</p>

    <p>When the parameter is passed by reference (<code>ref</code> or <code>out</code>), the advice can replace the exception. When the advice then sets
        <xref href="PostSharp.Aspects.FlowBehavior.ThrowException" data-throw-if-not-resolved="false"></xref>, the target method throws the exception that the parameter holds, as it throws
        <xref href="PostSharp.Aspects.MethodExecutionArgs.Exception" data-throw-if-not-resolved="false"></xref> in an advice that receives <xref href="PostSharp.Aspects.MethodExecutionArgs" data-throw-if-not-resolved="false"></xref>. With
        <xref href="PostSharp.Aspects.FlowBehavior.Default" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Aspects.FlowBehavior.RethrowException" data-throw-if-not-resolved="false"></xref>, the original exception is rethrown, and the value of the
        parameter is ignored.</p>
    <p>For an async method or an iterator, the value is the exception thrown by the code of the method, as
        <xref href="PostSharp.Aspects.MethodExecutionArgs.Exception" data-throw-if-not-resolved="false"></xref> gives it.</p>
  example: []
