  name: LoggingOptions
  nameWithType: LoggingOptions
  fullName: PostSharp.Patterns.Diagnostics.LoggingOptions
  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics
  summary: >-
    Represents the build-time options for logging records.

    This class is exposed by <xref href="PostSharp.Patterns.Diagnostics.LoggingProfile.DefaultOptions" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Diagnostics.LoggingProfile.ExceptionOptions" data-throw-if-not-resolved="false"></xref>.

    The values of this class cannot be changed at run time because they influence the way PostSharp instruments the code.
  remarks: >-
    <p>Set these options in <code>postsharp.config</code>, with a <code>LoggingOptions</code> element under the <code>DefaultOptions</code> or <code>ExceptionOptions</code>
        element of a <code>LoggingProfile</code>. Rebuild the project after changing them. Options that only affect the formatting of the records, such as
        the delimiter or the indentation, are run-time options of the backend instead; see <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.Options" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: >-
      [Serializer(typeof(LoggingOptions.Serializer))]

      public class LoggingOptions
    content.vb: >-
      <Serializer(GetType(LoggingOptions.Serializer))>

      Public Class LoggingOptions
