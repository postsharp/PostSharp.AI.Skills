  fullName: PostSharp.Aspects.LinesOfCodeAvoidedAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Custom attribute that, when applied to an aspect class, specifies how many manual lines of code

    are avoided every time the aspect is used.
  remarks: >-
    <p>PostSharp uses this value to estimate the number of lines of handwritten code avoided by aspects. Without this attribute,
        PostSharp uses a default estimate based on the advices of the aspect. For composite aspects, you can give an estimate for each advice
        with the <xref href="PostSharp.Aspects.Advices.Advice.LinesOfCodeAvoided" data-throw-if-not-resolved="false"></xref> property of the advice custom attribute.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class, AllowMultiple = false)]

      public sealed class LinesOfCodeAvoidedAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Class, AllowMultiple:=False)>

      Public NotInheritable Class LinesOfCodeAvoidedAttribute Inherits Attribute
