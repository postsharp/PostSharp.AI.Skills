- uid: PostSharp.Patterns.Recording.RecordingScopeOption.Atomic
  commentId: F:PostSharp.Patterns.Recording.RecordingScopeOption.Atomic
  id: Atomic
  parent: PostSharp.Patterns.Recording.RecordingScopeOption
  langs:
  - csharp
  - vb
  name: Atomic
  nameWithType: RecordingScopeOption.Atomic
  fullName: PostSharp.Patterns.Recording.RecordingScopeOption.Atomic
  type: Field
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording
  summary: >-
    Causes changes in the <xref href="PostSharp.Patterns.Recording.RecordingScope" data-throw-if-not-resolved="false"></xref> to be rolled back if the scope execution is not successful. In the case of a declarative scope (<xref href="PostSharp.Patterns.Recording.RecordingScopeAttribute" data-throw-if-not-resolved="false"></xref>), 

    it means that changes made by the method will be rolled back if the method results in an exception. For imperative scopes (<xref href="PostSharp.Patterns.Recording.Recorder.OpenScope(PostSharp.Patterns.Recording.RecordingScopeOption)" data-throw-if-not-resolved="false"></xref>),

    the changes will be rolled back if the scope is disposed by the <xref href="PostSharp.Patterns.Recording.RecordingScope.Dispose" data-throw-if-not-resolved="false"></xref> method without previous call to the <xref href="PostSharp.Patterns.Recording.RecordingScope.Complete" data-throw-if-not-resolved="false"></xref> method.

    Unlike normal scopes, atomic scopes are nested. However, only the top scope can be seen in the <xref href="PostSharp.Patterns.Recording.Recorder.UndoOperations" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Recording.Recorder.RedoOperations" data-throw-if-not-resolved="false"></xref> collections.
  example: []
  syntax:
    content: Atomic = 2
    return:
      type: PostSharp.Patterns.Recording.RecordingScopeOption
