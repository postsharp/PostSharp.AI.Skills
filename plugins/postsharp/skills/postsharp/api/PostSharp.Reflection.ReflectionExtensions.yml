- uid: PostSharp.Reflection.ReflectionExtensions.GetAutomaticProperty(System.Reflection.FieldInfo)
  commentId: M:PostSharp.Reflection.ReflectionExtensions.GetAutomaticProperty(System.Reflection.FieldInfo)
  id: GetAutomaticProperty(System.Reflection.FieldInfo)
  isExtensionMethod: true
  parent: PostSharp.Reflection.ReflectionExtensions
  langs:
  - csharp
  - vb
  name: GetAutomaticProperty(FieldInfo)
  nameWithType: ReflectionExtensions.GetAutomaticProperty(FieldInfo)
  fullName: PostSharp.Reflection.ReflectionExtensions.GetAutomaticProperty(System.Reflection.FieldInfo)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Reflection
  summary: Gets the <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref> of which a given field is the backing field, in the current type or its base types.
  example: []
  syntax:
    content: >-
      [RequiresUnreferencedCode("Finds the property by name in the declaring type of the field, and trimming can remove the property.")]

      public static PropertyInfo GetAutomaticProperty(this FieldInfo field)
    parameters:
    - id: field
      type: System.Reflection.FieldInfo
      description: A field.
    return:
      type: System.Reflection.PropertyInfo
      description: >-
        The <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref> representing the property whose <code class="paramref">field</code> is the backing field, or <code>null</code>
                    if <code class="paramref">field</code> is not the backing field of an automatic property.
    content.vb: >-
      <RequiresUnreferencedCode("Finds the property by name in the declaring type of the field, and trimming can remove the property.")>

      Public Shared Function GetAutomaticProperty(field As FieldInfo) As PropertyInfo
  overload: PostSharp.Reflection.ReflectionExtensions.GetAutomaticProperty*
