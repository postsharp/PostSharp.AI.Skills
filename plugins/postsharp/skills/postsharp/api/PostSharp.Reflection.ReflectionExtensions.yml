  summary: Gets the <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref> of which a given field is the backing field. The <code class="paramref">inherit</code> parameter specifies whether base types should be considered.
  example: []
  syntax:
    content: >-
      [RequiresUnreferencedCode("Finds the property by name in the declaring type of the field, and trimming can remove the property.")]

      public static PropertyInfo GetAutomaticProperty(this FieldInfo field, bool inherit)
    parameters:
    - id: field
      type: System.Reflection.FieldInfo
      description: A field.
    - id: inherit
      type: System.Boolean
      description: <code>true</code> if the property should be looked for in the base types, otherwise <code>false</code>.
    return:
      type: System.Reflection.PropertyInfo
      description: >-
        The <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref> representing the property whose <code class="paramref">field</code> is the backing field, or <code>null</code>
                    if <code class="paramref">field</code> is not the backing field of an automatic property.
    content.vb: >-
      <RequiresUnreferencedCode("Finds the property by name in the declaring type of the field, and trimming can remove the property.")>

      Public Shared Function GetAutomaticProperty(field As FieldInfo, inherit As Boolean) As PropertyInfo
