- uid: PostSharp.Patterns.Formatters.UnsafeString.MakeImmutable
  commentId: M:PostSharp.Patterns.Formatters.UnsafeString.MakeImmutable
  id: MakeImmutable
  parent: PostSharp.Patterns.Formatters.UnsafeString
  langs:
  - csharp
  - vb
  name: MakeImmutable()
  nameWithType: UnsafeString.MakeImmutable()
  fullName: PostSharp.Patterns.Formatters.UnsafeString.MakeImmutable()
  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Formatters
  summary: >-
    If the current <xref href="PostSharp.Patterns.Formatters.UnsafeString" data-throw-if-not-resolved="false"></xref> is bound to its origin <xref href="PostSharp.Patterns.Formatters.UnsafeStringBuilder" data-throw-if-not-resolved="false"></xref>,

    this method evaluates the <xref href="PostSharp.Patterns.Formatters.UnsafeStringBuilder" data-throw-if-not-resolved="false"></xref> and breaks the binding, so that later changes in the

    <xref href="PostSharp.Patterns.Formatters.UnsafeStringBuilder" data-throw-if-not-resolved="false"></xref> do not cause changes in the current <xref href="PostSharp.Patterns.Formatters.UnsafeString" data-throw-if-not-resolved="false"></xref>.

    This method also prevents the <xref href="PostSharp.Patterns.Formatters.UnsafeString" data-throw-if-not-resolved="false"></xref> from being recycled.
  example: []
  syntax:
    content: public void MakeImmutable()
    content.vb: Public Sub MakeImmutable()
  overload: PostSharp.Patterns.Formatters.UnsafeString.MakeImmutable*
