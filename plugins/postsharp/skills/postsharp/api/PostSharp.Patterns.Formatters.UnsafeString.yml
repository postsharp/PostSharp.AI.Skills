  type: Property
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Formatters
  summary: >-
    Gets a value indicating whether the current <xref href="PostSharp.Patterns.Formatters.UnsafeString" data-throw-if-not-resolved="false"></xref> is immutable

    or, when the value of this property is <code>false</code>, if it is still bound to a mutable <xref href="PostSharp.Patterns.Formatters.UnsafeStringBuilder" data-throw-if-not-resolved="false"></xref>.

    Call the <xref href="PostSharp.Patterns.Formatters.UnsafeString.MakeImmutable" data-throw-if-not-resolved="false"></xref> method to make the <xref href="PostSharp.Patterns.Formatters.UnsafeString" data-throw-if-not-resolved="false"></xref> immutable.
