  name: UnsafeString
  nameWithType: UnsafeString
  fullName: PostSharp.Patterns.Formatters.UnsafeString
  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Formatters
  summary: >-
    A generalized representation of a string that can be backed by a system <xref href="System.String" data-throw-if-not-resolved="false"></xref>,

    a <code>char[]</code>, or an <xref href="PostSharp.Patterns.Formatters.UnsafeStringBuilder" data-throw-if-not-resolved="false"></xref>. Conversions between these types happen transparently

    and are cached.
  remarks: >-
    <p>Because an <xref href="PostSharp.Patterns.Formatters.UnsafeString" data-throw-if-not-resolved="false"></xref> can be backed by an <xref href="PostSharp.Patterns.Formatters.UnsafeStringBuilder" data-throw-if-not-resolved="false"></xref>, which is a mutable
        type, and is generally pooled and reused for different purposes,
        it is generally not safe to evaluate an <xref href="PostSharp.Patterns.Formatters.UnsafeString" data-throw-if-not-resolved="false"></xref> at a different moment than the one designated by
        the API that exposes the <xref href="PostSharp.Patterns.Formatters.UnsafeString" data-throw-if-not-resolved="false"></xref>. To make it safe to evaluate the <xref href="PostSharp.Patterns.Formatters.UnsafeString" data-throw-if-not-resolved="false"></xref> at any
        moment, call the <xref href="PostSharp.Patterns.Formatters.UnsafeString.MakeImmutable" data-throw-if-not-resolved="false"></xref> method, which unbinds the <xref href="PostSharp.Patterns.Formatters.UnsafeString" data-throw-if-not-resolved="false"></xref> from
        its parent <xref href="PostSharp.Patterns.Formatters.UnsafeStringBuilder" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public sealed class UnsafeString
    content.vb: Public NotInheritable Class UnsafeString
