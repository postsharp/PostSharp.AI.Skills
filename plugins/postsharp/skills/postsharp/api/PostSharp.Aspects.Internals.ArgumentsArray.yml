  summary: >-
    Implements <xref href="PostSharp.Aspects.Arguments" data-throw-if-not-resolved="false"></xref> for a

    list of arguments of any length and type.
  remarks: >-
    Unlike the generic implementations of

    <xref href="PostSharp.Aspects.Arguments" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Internals.ArgumentsArray" data-throw-if-not-resolved="false"></xref> boxes all arguments

    into an <xref href="System.Array" data-throw-if-not-resolved="false"></xref>. This results in lower performance and higher memory usage.
  example: []
  syntax:
    content: >-
      [Internal]

      public sealed class ArgumentsArray : Arguments, IList<object>, ICollection<object>, IEnumerable<object>, IEnumerable, ICloneable
