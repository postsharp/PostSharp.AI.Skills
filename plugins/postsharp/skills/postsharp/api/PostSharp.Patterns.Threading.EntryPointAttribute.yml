- uid: PostSharp.Patterns.Threading.EntryPointAttribute
  commentId: T:PostSharp.Patterns.Threading.EntryPointAttribute
  id: EntryPointAttribute
  parent: PostSharp.Patterns.Threading
  children:
  - PostSharp.Patterns.Threading.EntryPointAttribute.#ctor
  langs:
  - csharp
  - vb
  name: EntryPointAttribute
  nameWithType: EntryPointAttribute
  fullName: PostSharp.Patterns.Threading.EntryPointAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Custom attribute that, when applied to a private or protected instance method,

    causes all threading model aspects (derived from <xref href="PostSharp.Patterns.Threading.ThreadAwareAttribute" data-throw-if-not-resolved="false"></xref>) to treat the method as an entry point, like a public method.
  remarks: >-
    <p>By default, threading models acquire access to the object, or dispatch the call in the case of <xref href="PostSharp.Patterns.Threading.ActorAttribute" data-throw-if-not-resolved="false"></xref>, only when a thread
        enters the object through a public or internal method. A private method invoked as a callback, for instance an event handler or a delegate passed
        to another object, bypasses this mechanism, and accessing a field from it results in an exception when run-time verification is enabled. Add this custom attribute to such methods.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Class|AttributeTargets.Method)]

      [MulticastAttributeUsage(MulticastTargets.Method, TargetMemberAttributes = MulticastAttributes.Private|MulticastAttributes.Protected|MulticastAttributes.Instance, Inheritance = MulticastInheritance.Strict)]

      public sealed class EntryPointAttribute : MulticastAttribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.AssemblyOrAttributeTargets.ClassOrAttributeTargets.Method)>

      <MulticastAttributeUsage(MulticastTargets.Method, TargetMemberAttributes:=MulticastAttributes.PrivateOrMulticastAttributes.ProtectedOrMulticastAttributes.Instance, Inheritance:=MulticastInheritance.Strict)>

      Public NotInheritable Class EntryPointAttribute Inherits MulticastAttribute
