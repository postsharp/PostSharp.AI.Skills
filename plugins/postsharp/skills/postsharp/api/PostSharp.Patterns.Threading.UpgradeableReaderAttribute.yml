  langs:
  - csharp
  - vb
  name: UpgradeableReaderAttribute
  nameWithType: UpgradeableReaderAttribute
  fullName: PostSharp.Patterns.Threading.UpgradeableReaderAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Custom attribute that, when applied to a method, specifies that the method requires read and write access to the object,

    but other threads are allowed to acquire read (but not write) access to the object until a method with the <xref href="PostSharp.Patterns.Threading.WriterAttribute" data-throw-if-not-resolved="false"></xref>

    custom attribute is executed.
  remarks: >-
    <p>Use this attribute on long-running methods that perform many reads followed by a few writes. The method can then call a method
        annotated with <xref href="PostSharp.Patterns.Threading.WriterAttribute" data-throw-if-not-resolved="false"></xref> to perform the writes, and the object cannot be modified by other threads in the meantime.</p>
  example: []
  syntax:
    content: >-
      [MulticastAttributeUsage(MulticastTargets.Method, TargetMemberAttributes = MulticastAttributes.Instance, AllowMultiple = false)]

      public class UpgradeableReaderAttribute : AccessLevelAttribute, IValidableAnnotation
    content.vb: >-
      <MulticastAttributeUsage(MulticastTargets.Method, TargetMemberAttributes:=MulticastAttributes.Instance, AllowMultiple:=False)>

      Public Class UpgradeableReaderAttribute Inherits AccessLevelAttribute Implements IValidableAnnotation
