  name: MultiplexerBackend
  nameWithType: MultiplexerBackend
  fullName: PostSharp.Patterns.Diagnostics.Backends.Multiplexer.MultiplexerBackend
  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Backends.Multiplexer
  summary: A multiplexer is a logging backend that sends logging events to other logging backends.
  remarks: >-
    <p>You want to use a multiplexer if you want all of your logging to go to two or more different backends.</p>

    <p>
        Each backend, including the multiplexer itself, maintains its own stack of logging contexts.
        </p>
    <p>Configure verbosity and options on the child backends, not on the multiplexer. Setting the minimal level of a namespace or type
        on the verbosity of the multiplexer throws a <xref href="System.NotSupportedException" data-throw-if-not-resolved="false"></xref>.</p>
    <p>With the default exception handler, <xref href="PostSharp.Patterns.Diagnostics.DefaultLoggingExceptionHandler" data-throw-if-not-resolved="false"></xref>, an exception thrown by a child backend
        disables only that backend; the other children continue to receive events.</p>
  example: []
  syntax:
    content: 'public sealed class MultiplexerBackend : LoggingBackend, IDisposable'
    content.vb: Public NotInheritable Class MultiplexerBackend Inherits LoggingBackend Implements IDisposable
  seealso:
  - linkType: HRef
    linkId: '@log-multiplexer'
    altText: 'Conceptual: Multiplexing Log Output to Several Frameworks'
  - linkType: HRef
    linkId: '@logging-exception-handling'
    altText: 'Conceptual: Handling Logging Exceptions'
