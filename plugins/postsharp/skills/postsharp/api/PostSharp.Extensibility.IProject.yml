    - id: name
      type: System.String
      description: The local name of the project extension element.
    - id: ns
      type: System.String
      description: The XML namespace of the project extension element.
    return:
      type: System.Collections.Generic.IEnumerable{PostSharp.Extensibility.ProjectExtensionElement}
      description: The set of project elements named <code class="paramref">name</code> in all loaded projects.
