  name: IProject
  nameWithType: IProject
  fullName: PostSharp.Extensibility.IProject
  type: Interface
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: Provides information about the currently executing project.
  remarks: >-
    <p>Get the current project from <xref href="PostSharp.Extensibility.PostSharpEnvironment.CurrentProject" data-throw-if-not-resolved="false"></xref>, which is <code>null</code> when PostSharp is not running.
        Use <xref href="PostSharp.Extensibility.IProject.EvaluateExpression(System.String)" data-throw-if-not-resolved="false"></xref> to read configuration properties and <xref href="PostSharp.Extensibility.IProject.GetExtensionElements(System.String%2cSystem.String)" data-throw-if-not-resolved="false"></xref> to read custom configuration sections.</p>
  example: []
  syntax:
    content: >-
      [InternalImplement]

      public interface IProject : IServiceLocator, IService
    content.vb: >-
      <InternalImplement>

      Public Interface IProject Inherits IServiceLocator, IService
  seealso:
