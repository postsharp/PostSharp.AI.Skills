  summary: <xref href="PostSharp.Aspects.Advices.Pointcut" data-throw-if-not-resolved="false"></xref> that selects exactly the aspect target.
  remarks: >-
    A master advice without pointcut behaves as if it had a <xref href="PostSharp.Aspects.Advices.SelfPointcut" data-throw-if-not-resolved="false"></xref> when the advice accepts the kind of the aspect target,

    for instance a method boundary advice in a <xref href="PostSharp.Aspects.MethodLevelAspect" data-throw-if-not-resolved="false"></xref>. This attribute is then optional.
