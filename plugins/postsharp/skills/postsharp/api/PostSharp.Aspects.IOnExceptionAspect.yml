- uid: PostSharp.Aspects.IOnExceptionAspect
  commentId: T:PostSharp.Aspects.IOnExceptionAspect
  id: IOnExceptionAspect
  parent: PostSharp.Aspects
  children:
  - PostSharp.Aspects.IOnExceptionAspect.OnException(PostSharp.Aspects.MethodExecutionArgs)
  langs:
  - csharp
  - vb
  name: IOnExceptionAspect
  nameWithType: IOnExceptionAspect
  fullName: PostSharp.Aspects.IOnExceptionAspect
  type: Interface
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Runtime semantics of an aspect that, when applied on a method,

    defines an exception handler around the whole method body

    and lets the implementation of this interface handle the exception.
  remarks: >-
    <p>See <xref href="PostSharp.Aspects.OnExceptionAspect" data-throw-if-not-resolved="false"></xref> for details.</p>

    <p>A class that implements this interface directly, instead of deriving from <xref href="PostSharp.Aspects.OnExceptionAspect" data-throw-if-not-resolved="false"></xref>,
            cannot override <xref href="PostSharp.Aspects.OnExceptionAspect.GetExceptionType(System.Reflection.MethodBase)" data-throw-if-not-resolved="false"></xref>. To configure the aspect, for example to set the type
            of handled exceptions, implement <xref href="PostSharp.Aspects.IAspectBuildSemantics.GetAspectConfiguration(System.Object)" data-throw-if-not-resolved="false"></xref> and return an
            <xref href="PostSharp.Aspects.Configuration.OnExceptionAspectConfiguration" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: >-
      [HasInheritedAttribute]

      public interface IOnExceptionAspect : IMethodLevelAspect, IAspect
    content.vb: >-
      <HasInheritedAttribute>

      Public Interface IOnExceptionAspect Inherits IMethodLevelAspect, IAspect
