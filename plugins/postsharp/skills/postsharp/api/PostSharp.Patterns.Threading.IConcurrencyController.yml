  name: IConcurrencyController
  nameWithType: IConcurrencyController
  fullName: PostSharp.Patterns.Threading.IConcurrencyController
  type: Interface
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Threading
  summary: Controls access to an entity from possibly several threads.
  remarks: >-
    <p>An entity, for the sake of this documentation article, is a group of objects that share the same concurrency controller.</p>

    <p>Objects that are controlled by a concurrency controller implement the <xref href="PostSharp.Patterns.Threading.IThreadAware" data-throw-if-not-resolved="false"></xref> interface.</p>
  example: []
  syntax:
    content: >-
      [InternalImplement(AttributeId = 627500528741416982)]

      public interface IConcurrencyController
    content.vb: >-
      <InternalImplement(AttributeId:=627500528741416982)>

      Public Interface IConcurrencyController
  derivedClasses:
