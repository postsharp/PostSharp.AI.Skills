- uid: PostSharp.Patterns.Threading.IConcurrencyController.AcquireAccess(PostSharp.Patterns.Model.ObjectAccessLevel,PostSharp.Patterns.Threading.ConcurrentAccessToken@)
  commentId: M:PostSharp.Patterns.Threading.IConcurrencyController.AcquireAccess(PostSharp.Patterns.Model.ObjectAccessLevel,PostSharp.Patterns.Threading.ConcurrentAccessToken@)
  id: AcquireAccess(PostSharp.Patterns.Model.ObjectAccessLevel,PostSharp.Patterns.Threading.ConcurrentAccessToken@)
  parent: PostSharp.Patterns.Threading.IConcurrencyController
  langs:
  - csharp
  - vb
  name: AcquireAccess(ObjectAccessLevel, ref ConcurrentAccessToken)
  nameWithType: IConcurrencyController.AcquireAccess(ObjectAccessLevel, ref ConcurrentAccessToken)
  fullName: PostSharp.Patterns.Threading.IConcurrencyController.AcquireAccess(PostSharp.Patterns.Model.ObjectAccessLevel, ref PostSharp.Patterns.Threading.ConcurrentAccessToken)
  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Threading
  summary: Acquires access on the entity for the current thread and waits synchronously if access cannot be immediately acquired.
  remarks: >-
    <p>When you are using this method through the expression <code>threadAware.ConcurrentController.AcquireAccess</code>, there may be a race condition during the
        evaluation of the expression. Use the <xref href="PostSharp.Patterns.Threading.ThreadAwareExtensions.AcquireAccess(PostSharp.Patterns.Threading.IThreadAware%2cPostSharp.Patterns.Model.ObjectAccessLevel)" data-throw-if-not-resolved="false"></xref> extension method to acquire access to a thread-aware object in a thread-safe manner.</p>
  example: []
  syntax:
    content: void AcquireAccess(ObjectAccessLevel objectAccessLevel, ref ConcurrentAccessToken concurrencyAccessToken)
    parameters:
    - id: objectAccessLevel
      type: PostSharp.Patterns.Model.ObjectAccessLevel
      description: The required access level on the entity.
    - id: concurrencyAccessToken
      type: PostSharp.Patterns.Threading.ConcurrentAccessToken
      description: >-
        An opaque <xref href="PostSharp.Patterns.Threading.ConcurrentAccessToken" data-throw-if-not-resolved="false"></xref>, typically used in a <code>using</code> block. Consumers must invoke the <xref href="PostSharp.Patterns.Threading.ConcurrentAccessToken.Complete" data-throw-if-not-resolved="false"></xref>
                    method upon success before exiting the <code>using</code> block.
    content.vb: Sub AcquireAccess(objectAccessLevel As ObjectAccessLevel, concurrencyAccessToken As ConcurrentAccessToken)
  overload: PostSharp.Patterns.Threading.IConcurrencyController.AcquireAccess*
  nameWithType.vb: IConcurrencyController.AcquireAccess(ObjectAccessLevel, ConcurrentAccessToken)
  fullName.vb: PostSharp.Patterns.Threading.IConcurrencyController.AcquireAccess(PostSharp.Patterns.Model.ObjectAccessLevel, PostSharp.Patterns.Threading.ConcurrentAccessToken)
  name.vb: AcquireAccess(ObjectAccessLevel, ConcurrentAccessToken)
- uid: PostSharp.Patterns.Threading.IConcurrencyController.AcquireAccessAsync(PostSharp.Patterns.Model.ObjectAccessLevel)
  commentId: M:PostSharp.Patterns.Threading.IConcurrencyController.AcquireAccessAsync(PostSharp.Patterns.Model.ObjectAccessLevel)
  id: AcquireAccessAsync(PostSharp.Patterns.Model.ObjectAccessLevel)
  parent: PostSharp.Patterns.Threading.IConcurrencyController
  langs:
  - csharp
  - vb
  name: AcquireAccessAsync(ObjectAccessLevel)
  nameWithType: IConcurrencyController.AcquireAccessAsync(ObjectAccessLevel)
  fullName: PostSharp.Patterns.Threading.IConcurrencyController.AcquireAccessAsync(PostSharp.Patterns.Model.ObjectAccessLevel)
  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Threading
  summary: Asynchronously acquires access on the entity for the current thread and returns an async awaiter.
  remarks: >-
    <p>When you are using this method through the expression <code>threadAware.ConcurrentController.AcquireAccess</code>, there may be a race condition during the
        evaluation of the expression. Use the <xref href="PostSharp.Patterns.Threading.ThreadAwareExtensions.AcquireAccessAsync(PostSharp.Patterns.Threading.IThreadAware%2cPostSharp.Patterns.Model.ObjectAccessLevel)" data-throw-if-not-resolved="false"></xref> extension method to acquire access to a thread-aware object in a thread-safe manner.</p>
  example: []
  syntax:
    content: ConcurrentAccessAwaiter AcquireAccessAsync(ObjectAccessLevel objectAccessLevel)
    parameters:
    - id: objectAccessLevel
      type: PostSharp.Patterns.Model.ObjectAccessLevel
      description: The required access level on the entity.
    return:
      type: PostSharp.Patterns.Threading.ConcurrentAccessAwaiter
      description: >-
        A <xref href="PostSharp.Patterns.Threading.ConcurrentAccessAwaiter" data-throw-if-not-resolved="false"></xref> that is compatible with the <code>await</code> keyword and evaluates to an opaque <xref href="PostSharp.Patterns.Threading.ConcurrentAccessToken" data-throw-if-not-resolved="false"></xref>, typically used in a <code>using</code> block.
                    Consumers must invoke the <xref href="PostSharp.Patterns.Threading.ConcurrentAccessToken.Complete" data-throw-if-not-resolved="false"></xref>
                    method upon success before exiting the <code>using</code> block.
    content.vb: Function AcquireAccessAsync(objectAccessLevel As ObjectAccessLevel) As ConcurrentAccessAwaiter
  overload: PostSharp.Patterns.Threading.IConcurrencyController.AcquireAccessAsync*
