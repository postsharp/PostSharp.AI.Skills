  summary: Gets a value indicating whether the entity is currently read-only.
  remarks: >-
    <p>For an object of a freezable class, this property is <code>true</code> once the object has been frozen. Get the controller of an object
        from its <xref href="PostSharp.Patterns.Threading.IThreadAware.ConcurrencyController" data-throw-if-not-resolved="false"></xref> property.</p>
