  name: AcquireAccessAsync(IThreadAware, ObjectAccessLevel)
  nameWithType: ThreadAwareExtensions.AcquireAccessAsync(IThreadAware, ObjectAccessLevel)
  fullName: PostSharp.Patterns.Threading.ThreadAwareExtensions.AcquireAccessAsync(PostSharp.Patterns.Threading.IThreadAware, PostSharp.Patterns.Model.ObjectAccessLevel)
  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Threading
  summary: Asynchronously acquires access for a given object.
  remarks: >-
    <p>This method is guaranteed to acquire the controller of the <code class="paramref">instance</code> object. Invoking the <xref href="PostSharp.Patterns.Threading.IConcurrencyController.AcquireAccessAsync(PostSharp.Patterns.Model.ObjectAccessLevel)" data-throw-if-not-resolved="false"></xref>
        method directly does not offer this guarantee, as the controller can be changed between the moment the <xref href="PostSharp.Patterns.Threading.IThreadAware.ConcurrencyController" data-throw-if-not-resolved="false"></xref> property
        is retrieved and the moment the <xref href="PostSharp.Patterns.Threading.IConcurrencyController.AcquireAccessAsync(PostSharp.Patterns.Model.ObjectAccessLevel)" data-throw-if-not-resolved="false"></xref> is invoked.</p>
  example: []
  syntax:
    content: public static ConcurrentAccessAwaiter AcquireAccessAsync(this IThreadAware instance, ObjectAccessLevel objectAccessLevel)
    parameters:
    - id: instance
      type: PostSharp.Patterns.Threading.IThreadAware
      description: The instance for which access is required.
    - id: objectAccessLevel
      type: PostSharp.Patterns.Model.ObjectAccessLevel
      description: The level of access required.
    return:
      type: PostSharp.Patterns.Threading.ConcurrentAccessAwaiter
      description: A <xref href="PostSharp.Patterns.Threading.ConcurrentAccessAwaiter" data-throw-if-not-resolved="false"></xref> object that can be used to await access.
    content.vb: Public Shared Function AcquireAccessAsync(instance As IThreadAware, objectAccessLevel As ObjectAccessLevel) As ConcurrentAccessAwaiter
  overload: PostSharp.Patterns.Threading.ThreadAwareExtensions.AcquireAccessAsync*
