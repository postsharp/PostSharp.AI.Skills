  fullName: PostSharp.Patterns.Threading.ThreadAwareExtensions.AcquireAccess(PostSharp.Patterns.Threading.IThreadAware, PostSharp.Patterns.Model.ObjectAccessLevel, ref PostSharp.Patterns.Threading.ConcurrentAccessToken)
  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Threading
  summary: Acquires access for a given object and returns the <xref href="PostSharp.Patterns.Threading.ConcurrentAccessToken" data-throw-if-not-resolved="false"></xref> as a reference parameter.
  remarks: >-
    <p>This method is guaranteed to acquire the controller of the <code class="paramref">instance</code> object. Invoking the <xref href="PostSharp.Patterns.Threading.IConcurrencyController.AcquireAccess(PostSharp.Patterns.Model.ObjectAccessLevel%2cPostSharp.Patterns.Threading.ConcurrentAccessToken%40)" data-throw-if-not-resolved="false"></xref>
        method directly does not offer this guarantee, as the controller can be changed between the moment the <xref href="PostSharp.Patterns.Threading.IThreadAware.ConcurrencyController" data-throw-if-not-resolved="false"></xref> property
        is retrieved and the moment the <xref href="PostSharp.Patterns.Threading.IConcurrencyController.AcquireAccess(PostSharp.Patterns.Model.ObjectAccessLevel%2cPostSharp.Patterns.Threading.ConcurrentAccessToken%40)" data-throw-if-not-resolved="false"></xref> is invoked.</p>
  example: []
  syntax:
    content: public static void AcquireAccess(this IThreadAware instance, ObjectAccessLevel objectAccessLevel, ref ConcurrentAccessToken concurrentAccessToken)
    parameters:
    - id: instance
      type: PostSharp.Patterns.Threading.IThreadAware
      description: The instance for which access is required.
    - id: objectAccessLevel
      type: PostSharp.Patterns.Model.ObjectAccessLevel
      description: The level of access required.
    - id: concurrentAccessToken
      type: PostSharp.Patterns.Threading.ConcurrentAccessToken
      description: On return, a <xref href="PostSharp.Patterns.Threading.ConcurrentAccessToken" data-throw-if-not-resolved="false"></xref> that should be disposed when access is no longer required.
    content.vb: Public Shared Sub AcquireAccess(instance As IThreadAware, objectAccessLevel As ObjectAccessLevel, concurrentAccessToken As ConcurrentAccessToken)
  overload: PostSharp.Patterns.Threading.ThreadAwareExtensions.AcquireAccess*
  nameWithType.vb: ThreadAwareExtensions.AcquireAccess(IThreadAware, ObjectAccessLevel, ConcurrentAccessToken)
