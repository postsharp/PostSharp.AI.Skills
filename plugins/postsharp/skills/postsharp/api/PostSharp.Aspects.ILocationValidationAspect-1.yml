- uid: PostSharp.Aspects.ILocationValidationAspect`1
  commentId: T:PostSharp.Aspects.ILocationValidationAspect`1
  id: ILocationValidationAspect`1
  parent: PostSharp.Aspects
  children:
  - PostSharp.Aspects.ILocationValidationAspect`1.ValidateValue(`0,System.String,PostSharp.Reflection.LocationKind,PostSharp.Aspects.LocationValidationContext)
  langs:
  - csharp
  - vb
  name: ILocationValidationAspect<T>
  nameWithType: ILocationValidationAspect<T>
  fullName: PostSharp.Aspects.ILocationValidationAspect<T>
  type: Interface
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Runtime semantics of an aspect that, when applied on a location (field, property, or parameter), 

    validates the value assigned to this location using the <xref href="PostSharp.Aspects.ILocationValidationAspect%601.ValidateValue(%600%2cSystem.String%2cPostSharp.Reflection.LocationKind%2cPostSharp.Aspects.LocationValidationContext)" data-throw-if-not-resolved="false"></xref> method, and throws

    the exception returned by this method, if any.
  remarks: >-
    <p>An aspect will typically implement several generic instances of the current interface,
           with different values of <code class="typeparamref">T</code>. The aspect can be applied only to locations
           for which there is an exact type match. PostSharp does not implement any type conversion, even
           when this conversion is implicitly supported by the compiler, for instance <code>int</code> to <code>long</code>.
           Therefore, if your aspect must be able to validate all integers, you may need to implement
           the interface instances for <code class="typeparamref">T</code> ranging over <code>long</code>, <code>int</code>, <code>short</code>,
            <code>sbyte</code> and possibly their unsigned variants. However, values of a derived type can be
            validated if <code class="typeparamref">T</code> is the base type.
        </p>
  example: []
  syntax:
    content: >-
      [HasInheritedAttribute]

      public interface ILocationValidationAspect<T> : ILocationValidationAspect, IAspect
    typeParameters:
    - id: T
      description: Type of values validated by the current aspect.
    content.vb: >-
      <HasInheritedAttribute>

      Public Interface ILocationValidationAspect(Of T) Inherits ILocationValidationAspect, IAspect
