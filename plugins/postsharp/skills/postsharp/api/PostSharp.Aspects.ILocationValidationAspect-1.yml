  name: ValidateValue(T, string, LocationKind, LocationValidationContext)
  nameWithType: ILocationValidationAspect<T>.ValidateValue(T, string, LocationKind, LocationValidationContext)
  fullName: PostSharp.Aspects.ILocationValidationAspect<T>.ValidateValue(T, string, PostSharp.Reflection.LocationKind, PostSharp.Aspects.LocationValidationContext)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Validates the value being assigned to the location to which the current aspect has been applied.
  example: []
  syntax:
    content: >-
      [HasInheritedAttribute]

      Exception ValidateValue(T value, string locationName, LocationKind locationKind, LocationValidationContext context)
    parameters:
    - id: value
      type: '{T}'
      description: Value being applied to the location.
    - id: locationName
      type: System.String
      description: Name of the location.
    - id: locationKind
      type: PostSharp.Reflection.LocationKind
      description: >-
        Location kind (<xref href="PostSharp.Reflection.LocationKind.Field" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Reflection.LocationKind.Property" data-throw-if-not-resolved="false"></xref>, or
                    <xref href="PostSharp.Reflection.LocationKind.Parameter" data-throw-if-not-resolved="false"></xref>).
    - id: context
      type: PostSharp.Aspects.LocationValidationContext
      description: Indicates the context in which the value is being validated, such as a precondition or a postcondition for <code>ref</code> method parameters.
    return:
      type: System.Exception
      description: The <xref href="System.Exception" data-throw-if-not-resolved="false"></xref> to be thrown, or <code>null</code> if no exception needs to be thrown.
    content.vb: >-
      <HasInheritedAttribute>

      Function ValidateValue(value As T, locationName As String, locationKind As LocationKind, context As LocationValidationContext) As Exception
