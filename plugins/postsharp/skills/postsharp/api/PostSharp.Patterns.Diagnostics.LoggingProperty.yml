  type: Property
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics
  summary: >-
    Gets or sets a value indicating whether the property is inherited from the parent activity by child activities and messages. The default value is <code>true</code>.

    When this property is set to <code>false</code>, <xref href="PostSharp.Patterns.Diagnostics.LoggingProperty.IsBaggage" data-throw-if-not-resolved="false"></xref> is automatically set to <code>false</code>.
  example: []
