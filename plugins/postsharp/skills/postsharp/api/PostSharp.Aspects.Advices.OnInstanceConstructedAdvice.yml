  fullName: PostSharp.Aspects.Advices.OnInstanceConstructedAdvice
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Custom attribute that, when applied to a method of an aspect, specifies that this method should be executed

    after the last instance constructor of the target class of the aspect has completed execution. That is, this method is invoked when the target object

    is fully constructed. This custom attribute can be applied only on methods that have return type <code>void</code>.
  remarks: >-
    <p>
        The target object is fully constructed when all its constructors complete execution, including constructors of subclasses. For example, if you apply
        this advice to type <code>A</code>, and class <code>B</code> extends class <code>A</code>, then if you create a new instance of <code>B</code>, the method will be invoked only
        after B's constructor ends.
        </p>
    <p>
        The parameters of the method must be bound by a custom attribute derived from <xref href="PostSharp.Aspects.Advices.AdviceParameterAttribute" data-throw-if-not-resolved="false"></xref>. Their target is the
        target type of the aspect: for instance, <xref href="PostSharp.Aspects.Advices.ThisAttribute" data-throw-if-not-resolved="false"></xref> binds the object and <xref href="PostSharp.Aspects.Advices.DeclarationNameAttribute" data-throw-if-not-resolved="false"></xref> the name
        of the type. <xref href="PostSharp.Aspects.Advices.ArgumentAttribute" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.ReturnValueAttribute" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.LocationValueAttribute" data-throw-if-not-resolved="false"></xref> and
        <xref href="PostSharp.Aspects.Advices.FlowBehaviorAttribute" data-throw-if-not-resolved="false"></xref> cannot be used.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method, AllowMultiple = false, Inherited = false)]

      public sealed class OnInstanceConstructedAdvice : Advice
    content.vb: >-
      <AttributeUsage(AttributeTargets.Method, AllowMultiple:=False, Inherited:=False)>

      Public NotInheritable Class OnInstanceConstructedAdvice Inherits Advice
