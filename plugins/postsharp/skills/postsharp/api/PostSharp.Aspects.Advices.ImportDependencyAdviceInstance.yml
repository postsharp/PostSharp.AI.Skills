- uid: PostSharp.Aspects.Advices.ImportDependencyAdviceInstance.IsRequired
  commentId: P:PostSharp.Aspects.Advices.ImportDependencyAdviceInstance.IsRequired
  id: IsRequired
  parent: PostSharp.Aspects.Advices.ImportDependencyAdviceInstance
  langs:
  - csharp
  - vb
  name: IsRequired
  nameWithType: ImportDependencyAdviceInstance.IsRequired
  fullName: PostSharp.Aspects.Advices.ImportDependencyAdviceInstance.IsRequired
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Gets or sets a value indicating whether the dependency is required. The default value is <code>true</code>. A required dependency is a

    mandatory constructor parameter, checked for <code>null</code>; an optional dependency is an optional parameter whose default value is

    <code>null</code>.
  example: []
  syntax:
    content: public bool IsRequired { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property IsRequired As Boolean
  overload: PostSharp.Aspects.Advices.ImportDependencyAdviceInstance.IsRequired*
- uid: PostSharp.Aspects.Advices.ImportDependencyAdviceInstance.Name
  commentId: P:PostSharp.Aspects.Advices.ImportDependencyAdviceInstance.Name
  id: Name
  parent: PostSharp.Aspects.Advices.ImportDependencyAdviceInstance
  langs:
  - csharp
  - vb
  name: Name
  nameWithType: ImportDependencyAdviceInstance.Name
  fullName: PostSharp.Aspects.Advices.ImportDependencyAdviceInstance.Name
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Gets or sets the name by which the advices of the aspect import the dependency with <xref href="PostSharp.Aspects.Advices.ImportMemberAttribute" data-throw-if-not-resolved="false"></xref>, and the name of the

    property that exposes it, or <code>null</code>. Without a name, the advices import the dependency by its type, and the property is named after

    the dependency type, without the <code>I</code> of an interface. When another member has the name, a number is appended to the name of the

    property.
  example: []
  syntax:
    content: public string Name { get; set; }
    parameters: []
    return:
      type: System.String
    content.vb: Public Property Name As String
  overload: PostSharp.Aspects.Advices.ImportDependencyAdviceInstance.Name*
- uid: PostSharp.Aspects.Advices.ImportDependencyAdviceInstance.Visibility
  commentId: P:PostSharp.Aspects.Advices.ImportDependencyAdviceInstance.Visibility
  id: Visibility
  parent: PostSharp.Aspects.Advices.ImportDependencyAdviceInstance
  langs:
  - csharp
  - vb
  name: Visibility
  nameWithType: ImportDependencyAdviceInstance.Visibility
  fullName: PostSharp.Aspects.Advices.ImportDependencyAdviceInstance.Visibility
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Gets or sets the visibility of the member that exposes the dependency, or <code>null</code> for the default value:

    <xref href="PostSharp.Reflection.Visibility.Family" data-throw-if-not-resolved="false"></xref>, or <xref href="PostSharp.Reflection.Visibility.Private" data-throw-if-not-resolved="false"></xref> when the target class is

    sealed. A dependency that is not private is exposed by a getter-only property of this visibility, so that derived classes, also in

    other assemblies, can read it, and so that the dependency can later become lazy without changing that member.
  example: []
  syntax:
    content: public Visibility? Visibility { get; set; }
    parameters: []
    return:
      type: System.Nullable{PostSharp.Reflection.Visibility}
    content.vb: Public Property Visibility As Visibility?
  overload: PostSharp.Aspects.Advices.ImportDependencyAdviceInstance.Visibility*
- uid: PostSharp.Aspects.Advices.ImportDependencyAdviceInstance.IsLazy
  commentId: P:PostSharp.Aspects.Advices.ImportDependencyAdviceInstance.IsLazy
  id: IsLazy
  parent: PostSharp.Aspects.Advices.ImportDependencyAdviceInstance
  langs:
  - csharp
  - vb
  name: IsLazy
  nameWithType: ImportDependencyAdviceInstance.IsLazy
  fullName: PostSharp.Aspects.Advices.ImportDependencyAdviceInstance.IsLazy
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Gets or sets a value indicating whether the dependency is resolved when it is first used rather than when the object is created. A lazy

    dependency is received as a <xref href="System.Lazy%601" data-throw-if-not-resolved="false"></xref> of the dependency type, stored in a field of that type, and exposed by a getter-only

    property of the dependency type that returns <xref href="System.Lazy%601.Value" data-throw-if-not-resolved="false"></xref>. The container must be able to create the

    <xref href="System.Lazy%601" data-throw-if-not-resolved="false"></xref>. The default value is <code>false</code>.
  example: []
  syntax:
    content: public bool IsLazy { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property IsLazy As Boolean
  overload: PostSharp.Aspects.Advices.ImportDependencyAdviceInstance.IsLazy*
