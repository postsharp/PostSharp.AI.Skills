  name: ImportDependencyAdviceInstance
  nameWithType: ImportDependencyAdviceInstance
  fullName: PostSharp.Aspects.Advices.ImportDependencyAdviceInstance
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Represents a request for a dependency (or service) that the target class receives from its constructors, typically from a dependency

    injection container such as Microsoft.Extensions.DependencyInjection.
  remarks: >-
    <p>An aspect returns an <xref href="PostSharp.Aspects.Advices.ImportDependencyAdviceInstance" data-throw-if-not-resolved="false"></xref> from <xref href="PostSharp.Aspects.Advices.IAdviceProvider.ProvideAdvices(System.Object)" data-throw-if-not-resolved="false"></xref>, so that the request
            can depend on the configuration of the target. The target class is the class to which the aspect is applied, or the declaring class of
            the member to which it is applied. For each target class, the request does the following:</p>
    <ol><li>If the class declares or inherits a field of the dependency type that it can access, the request resolves to this
              field, and nothing else changes. Otherwise, if the class declares or inherits a readable instance property of the dependency type that
              it can access, the request resolves to this property in the same way; several such properties cause the error LA0286. The field or the
              property is trusted: the request does not check that the class initializes it.</li><li>Otherwise, a private read-only field of the dependency type is introduced, as an <xref href="PostSharp.Aspects.Advices.IntroduceFieldAdviceInstance" data-throw-if-not-resolved="false"></xref>
              without a name and with <xref href="PostSharp.Aspects.Advices.IntroduceFieldCompatibleAction.Ignore" data-throw-if-not-resolved="false"></xref> does. When the field is not private, as specified by
              <xref href="PostSharp.Aspects.Advices.ImportDependencyAdviceInstance.Visibility" data-throw-if-not-resolved="false"></xref>, or when the dependency is lazy, the field stays private and a getter-only property of the dependency type exposes
              it. A class whose base class exposes the same dependency by such a property uses that property.</li><li>A parameter of the dependency type is appended to the instance constructors of the class, and to those of the classes
              that derive from it, whose <code>base(...)</code> calls pass it, also when they are in another assembly that PostSharp processes. A
              constructor that already has a parameter of exactly the dependency type uses it.</li><li>Each original constructor is kept as a forwarder that passes <code>null</code> for the dependency. A <code>public</code>
              forwarder becomes <code>protected internal</code>, or <code>internal</code> in a sealed class, so that a dependency injection container sees only the constructors that receive the
              dependency, while the code of the assembly and the derived classes in other assemblies can still call it.</li><li>The constructors assign the field just after the base constructor call, as C# assigns a field from a constructor
              parameter, and before the aspects are initialized and the body of the constructor runs. When the argument is <code>null</code>, the
              dependency is resolved from <xref href="PostSharp.Extensibility.RunTimeServiceLocator" data-throw-if-not-resolved="false"></xref>:
              <xref href="PostSharp.Extensibility.RunTimeServiceLocator.GetRequiredService%60%601" data-throw-if-not-resolved="false"></xref> for a required dependency, which throws
              <xref href="System.InvalidOperationException" data-throw-if-not-resolved="false"></xref> when no service is registered, and
              <xref href="PostSharp.Extensibility.RunTimeServiceLocator.GetService%60%601" data-throw-if-not-resolved="false"></xref> for an optional one.</li></ol>
    <p>The advices of the aspect instance that made the request receive the dependency through a parameter annotated with
            <xref href="PostSharp.Aspects.Advices.ImportMemberAttribute" data-throw-if-not-resolved="false"></xref>: by the <xref href="PostSharp.Aspects.Advices.ImportDependencyAdviceInstance.Name" data-throw-if-not-resolved="false"></xref> of the request, whatever the names of the field and of the property, or
            without a name, by the dependency type. The parameter receives the property when there is one, and the field otherwise. On a static
            target, it receives <code>null</code>.</p>
    <p>An object of the class can still be created with <code>new</code> in the project, through a forwarder: its dependencies are then
            resolved from <xref href="PostSharp.Extensibility.RunTimeServiceLocator" data-throw-if-not-resolved="false"></xref>, where the application registers a factory for each
            service. The request also works with <xref href="PostSharp.Aspects.Advices.OnInstanceConstructedAdvice" data-throw-if-not-resolved="false"></xref>: the dependencies are assigned before the advice
            runs.</p>
    <p>Applying such an aspect to a public class changes its public constructors. This is a binary breaking change for the consumers of
            the class. Several requests for the same dependency type in a class give one field and one parameter, which is required when one of
            the requests is.</p>
  example: []
  syntax:
    content: 'public sealed class ImportDependencyAdviceInstance : AdviceInstance'
    content.vb: Public NotInheritable Class ImportDependencyAdviceInstance Inherits AdviceInstance
