- uid: PostSharp.Post.Cast``2(``0)
  commentId: M:PostSharp.Post.Cast``2(``0)
  id: Cast``2(``0)
  parent: PostSharp.Post
  langs:
  - csharp
  - vb
  name: Cast<TSource, TTarget>(TSource)
  nameWithType: Post.Cast<TSource, TTarget>(TSource)
  fullName: PostSharp.Post.Cast<TSource, TTarget>(TSource)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp
  summary: >-
    At post-compile time, casts an instance of a type to another type.

    A post-compile time error is reported if the source type cannot be

    assigned to the target type.
  remarks: >-
    The purpose of this method is to make source code compilable even when

    an interface is implemented at post-compile time.

    PostSharp ensures that <code class="typeparamref">TTarget</code> is assignable from

    <code class="typeparamref">TSource</code>. If it is, the call to this method is

    suppressed. If the types are not assignable, a build error is issued.

    Use it, for example, to access an interface introduced by an aspect from the source code of the target class.
  example: []
  syntax:
    content: 'public static TTarget Cast<TSource, TTarget>(TSource o) where TSource : class where TTarget : class'
    parameters:
    - id: o
      type: '{TSource}'
      description: The instance to cast.
    typeParameters:
    - id: TSource
      description: The source type.
    - id: TTarget
      description: The target type.
    return:
      type: '{TTarget}'
      description: The object <code class="paramref">o</code> cast as <code class="typeparamref">TTarget</code>.
    content.vb: Public Shared Function Cast(Of TSource As Class, TTarget As Class)(o As TSource) As TTarget
  overload: PostSharp.Post.Cast*
  seealso:
  - linkType: HRef
    linkId: '@code-injections'
    altText: 'Conceptual: Introducing Interfaces, Methods, Properties and Events into Existing Classes'
  nameWithType.vb: Post.Cast(Of TSource, TTarget)(TSource)
  fullName.vb: PostSharp.Post.Cast(Of TSource, TTarget)(TSource)
  name.vb: Cast(Of TSource, TTarget)(TSource)
