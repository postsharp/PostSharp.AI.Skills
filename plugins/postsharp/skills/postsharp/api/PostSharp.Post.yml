  name: GetValue<T>(T)
  nameWithType: Post.GetValue<T>(T)
  fullName: PostSharp.Post.GetValue<T>(T)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp
  summary: >-
    When used to retrieve the value of a field, forces the compiler to retrieve a copy

    of the field value instead of an address of this field. This allows calling

    instance methods of value-type fields without loading the field address.
  example: []
  syntax:
    content: 'public static T GetValue<T>(T value) where T : struct'
    parameters:
    - id: value
      type: '{T}'
      description: The value.
    typeParameters:
    - id: T
      description: The type of the value to retrieve. This type parameter can generally be omitted.
    return:
      type: '{T}'
      description: <code class="paramref">value</code>, unchanged.
    content.vb: Public Shared Function GetValue(Of T As Structure)(value As T) As T
  overload: PostSharp.Post.GetValue*
  nameWithType.vb: Post.GetValue(Of T)(T)
  fullName.vb: PostSharp.Post.GetValue(Of T)(T)
  name.vb: GetValue(Of T)(T)
