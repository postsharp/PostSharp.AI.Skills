  summary: >-
    Defines the semantics of a facility that executes actions synchronously or asynchronously,

    possibly on a different thread.
  remarks: <p>Use the <xref href="PostSharp.Patterns.Threading.DispatcherFactory" data-throw-if-not-resolved="false"></xref> class to get implementations of this interface. You can also create a custom implementation.</p>
