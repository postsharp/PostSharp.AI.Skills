- uid: PostSharp.Patterns.Threading.IDispatcher.CheckAccess
  commentId: M:PostSharp.Patterns.Threading.IDispatcher.CheckAccess
  id: CheckAccess
  parent: PostSharp.Patterns.Threading.IDispatcher
  langs:
  - csharp
  - vb
  name: CheckAccess()
  nameWithType: IDispatcher.CheckAccess()
  fullName: PostSharp.Patterns.Threading.IDispatcher.CheckAccess()
  type: Method
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: Determines whether the current thread has access to the current dispatcher.
  example: []
  syntax:
    content: bool CheckAccess()
    return:
      type: System.Boolean
      description: >-
        <code>true</code> if the current thread can directly call methods of objects protected
            by the current dispatcher, or <code>false</code> if the <xref href="PostSharp.Patterns.Threading.IDispatcher.Invoke(System.Threading.SendOrPostCallback%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Threading.IDispatcher.BeginInvoke(System.Threading.SendOrPostCallback%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> methods
            must be used.
    content.vb: Function CheckAccess() As Boolean
  overload: PostSharp.Patterns.Threading.IDispatcher.CheckAccess*
