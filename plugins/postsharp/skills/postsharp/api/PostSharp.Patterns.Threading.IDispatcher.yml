- uid: PostSharp.Patterns.Threading.IDispatcher.IsInvokeSupported
  commentId: P:PostSharp.Patterns.Threading.IDispatcher.IsInvokeSupported
  id: IsInvokeSupported
  parent: PostSharp.Patterns.Threading.IDispatcher
  langs:
  - csharp
  - vb
  name: IsInvokeSupported
  nameWithType: IDispatcher.IsInvokeSupported
  fullName: PostSharp.Patterns.Threading.IDispatcher.IsInvokeSupported
  type: Property
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: Gets a value indicating whether the <xref href="PostSharp.Patterns.Threading.IDispatcher.Invoke(System.Threading.SendOrPostCallback%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> method is supported.
  remarks: >-
    If <code>false</code>,
               the dispatcher only supports asynchronous invocation (<xref href="PostSharp.Patterns.Threading.IDispatcher.BeginInvoke(System.Threading.SendOrPostCallback%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>).
  example: []
  syntax:
    content: bool IsInvokeSupported { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: ReadOnly Property IsInvokeSupported As Boolean
  overload: PostSharp.Patterns.Threading.IDispatcher.IsInvokeSupported*
