  nameWithType: CopyCustomAttributesAttribute
  fullName: PostSharp.Aspects.Advices.CopyCustomAttributesAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Custom attribute that, when applied on an aspect class, requires custom

    attributes present on the aspect class to be copied to the target of this class.

    When applied on an introduced member (see <xref href="PostSharp.Aspects.Advices.IntroduceMemberAttribute" data-throw-if-not-resolved="false"></xref>),

    this custom attribute requires custom attributes present on the aspect member

    to be copied to the introduced member.
  remarks: >-
    <p>A typical use is to keep, on a property introduced by an aspect, a custom attribute that another framework
            requires, such as a dependency injection attribute.</p>
    <p>A custom attribute whose type is internal cannot be copied to a declaration of another assembly:
            PostSharp emits a build error. Make the attribute type public, or exclude it from <xref href="PostSharp.Aspects.Advices.CopyCustomAttributesAttribute.Types" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class|AttributeTargets.Method|AttributeTargets.Property|AttributeTargets.Event)]

      public sealed class CopyCustomAttributesAttribute : Advice
    content.vb: >-
      <AttributeUsage(AttributeTargets.ClassOrAttributeTargets.MethodOrAttributeTargets.PropertyOrAttributeTargets.Event)>

      Public NotInheritable Class CopyCustomAttributesAttribute Inherits Advice
