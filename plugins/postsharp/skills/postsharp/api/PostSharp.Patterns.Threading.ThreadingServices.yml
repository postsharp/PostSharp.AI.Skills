- uid: PostSharp.Patterns.Threading.ThreadingServices.WithConcurrencyController(PostSharp.Patterns.Threading.IConcurrencyController)
  commentId: M:PostSharp.Patterns.Threading.ThreadingServices.WithConcurrencyController(PostSharp.Patterns.Threading.IConcurrencyController)
  id: WithConcurrencyController(PostSharp.Patterns.Threading.IConcurrencyController)
  parent: PostSharp.Patterns.Threading.ThreadingServices
  langs:
  - csharp
  - vb
  name: WithConcurrencyController(IConcurrencyController)
  nameWithType: ThreadingServices.WithConcurrencyController(IConcurrencyController)
  fullName: PostSharp.Patterns.Threading.ThreadingServices.WithConcurrencyController(PostSharp.Patterns.Threading.IConcurrencyController)
  type: Method
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Sets the ambient concurrency controller for the current thread. Until the returned <xref href="PostSharp.Patterns.Threading.AmbientConcurrencyControllerContext" data-throw-if-not-resolved="false"></xref> value is disposed,

    thread-aware objects created in the current thread will be assigned to the given concurrency controller.
  remarks: >-
    This method can be used to optimize performance when creating a large tree of thread-aware objects that need to share the same concurrency controller.

    When a tree is built from the leaves to the root without this method, a concurrency controller is created for each sub-tree root, and the controllers

    of a whole sub-tree are replaced each time the sub-tree is assigned to a parent, which can make the instantiation cost quadratic.
  example: []
  syntax:
    content: public static AmbientConcurrencyControllerContext WithConcurrencyController(IConcurrencyController concurrencyController)
    parameters:
    - id: concurrencyController
      type: PostSharp.Patterns.Threading.IConcurrencyController
      description: The ambient concurrency controller. Use the <xref href="PostSharp.Patterns.Threading.ConcurrencyControllerFactory" data-throw-if-not-resolved="false"></xref> class to create new concurrency controllers.
    return:
      type: PostSharp.Patterns.Threading.AmbientConcurrencyControllerContext
      description: An <xref href="System.IDisposable" data-throw-if-not-resolved="false"></xref> value representing the ambient concurrency controller context.
    content.vb: Public Shared Function WithConcurrencyController(concurrencyController As IConcurrencyController) As AmbientConcurrencyControllerContext
  overload: PostSharp.Patterns.Threading.ThreadingServices.WithConcurrencyController*
  seealso:
  - linkType: HRef
    linkId: '@threading-performance'
    altText: 'Conceptual: Run-Time Performance of Threading Model'
