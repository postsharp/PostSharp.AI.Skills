  summary: >-
    Appends a parameter of <xref href="System.String" data-throw-if-not-resolved="false"></xref> type to the current <xref href="PostSharp.Patterns.Diagnostics.RecordBuilders.TextLogRecordBuilder.StringBuilder" data-throw-if-not-resolved="false"></xref>. Backends that

    support semantic logging may store the parameter value semantically instead of appending it to the <xref href="PostSharp.Patterns.Diagnostics.RecordBuilders.TextLogRecordBuilder.StringBuilder" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: protected override void AppendSemanticParameter(SemanticParameterKind kind, string name, string value, string prefix = null, int index = -1)
    parameters:
    - id: kind
      type: PostSharp.Patterns.Diagnostics.RecordBuilders.SemanticParameterKind
      description: The kind of semantic parameter.
    - id: name
      type: System.String
      description: >-
        The parameter name. The <code class="paramref">name</code> parameter itself is not guaranteed to be unique in a given record.
                    However, in combination with <code class="paramref">prefix</code> and <code class="paramref">index</code>, it is guaranteed to be unique.
    - id: value
      type: System.String
      description: The parameter value.
    - id: prefix
      type: System.String
      description: The prefix to prepend to <code class="paramref">name</code>, or <code>null</code> if there is no prefix.
    - id: index
      type: System.Int32
      description: >-
        The index of the parameter value if there are several values for the same parameter name, or <code>-1</code>
                    if there is a single parameter value for this parameter name.
