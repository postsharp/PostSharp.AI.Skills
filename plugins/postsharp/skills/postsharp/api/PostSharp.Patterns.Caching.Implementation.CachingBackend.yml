  name: CachingBackend
  nameWithType: CachingBackend
  fullName: PostSharp.Patterns.Caching.Implementation.CachingBackend
  type: Class
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching.Implementation
  summary: An abstraction of the physical implementation of the cache, which the <xref href="PostSharp.Patterns.Caching.CacheAttribute" data-throw-if-not-resolved="false"></xref> writes to and reads from.
  remarks: >-
    <p>The backend used by cached methods is the one assigned to <xref href="PostSharp.Patterns.Caching.ICachingService.Backend?text=CachingServices.DefaultService.Backend" data-throw-if-not-resolved="false"></xref>. This assembly provides
        <xref href="PostSharp.Patterns.Caching.Backends.MemoryCachingBackend" data-throw-if-not-resolved="false"></xref>; other backends, such as Redis, are distributed in separate packages.</p>
    <p>To implement a backend, override the protected methods whose name ends with <code>Core</code>; the public methods validate the arguments and call them.
        Override <xref href="PostSharp.Patterns.Caching.Implementation.CachingBackend.CreateFeatures" data-throw-if-not-resolved="false"></xref> to declare the features the backend supports, for example dependencies. To add a behavior to an existing
        backend rather than implement a storage, derive from <xref href="PostSharp.Patterns.Caching.Implementation.CachingBackendEnhancer" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: 'public abstract class CachingBackend : IDisposable'
    content.vb: Public MustInherit Class CachingBackend Implements IDisposable
  seealso:
  - linkType: HRef
    linkId: '@caching-backends'
    altText: 'Conceptual: Caching Back-Ends'
  inheritance:
  - System.Object
  derivedClasses:
  - PostSharp.Patterns.Caching.Backends.MemoryCacheBackend
  - PostSharp.Patterns.Caching.Backends.MemoryCachingBackend
  - PostSharp.Patterns.Caching.Backends.NullCachingBackend
