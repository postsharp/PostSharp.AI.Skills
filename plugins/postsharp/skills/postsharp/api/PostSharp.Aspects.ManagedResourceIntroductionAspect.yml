  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Aspect that, when applied to an assembly, adds a managed resource to this assembly.
  remarks: >-
    <p>This aspect is not a custom attribute. Create instances of it at build time from an aspect that implements
            <xref href="PostSharp.Aspects.IAspectProvider" data-throw-if-not-resolved="false"></xref>, typically an <xref href="PostSharp.Aspects.AssemblyLevelAspect" data-throw-if-not-resolved="false"></xref>, and return them in an
            <xref href="PostSharp.Aspects.AspectInstance" data-throw-if-not-resolved="false"></xref> that targets the assembly. Because the content is computed at build time, it can be
            generated or transformed before it is embedded. At run time, read the resource with
            <xref href="System.Reflection.Assembly.GetManifestResourceStream(System.String)" data-throw-if-not-resolved="false"></xref>, passing <xref href="PostSharp.Aspects.ManagedResourceIntroductionAspect.Name" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: 'public sealed class ManagedResourceIntroductionAspect : IManagedResourceIntroductionAspect, IAspect, IAspectBuildSemantics, IValidableAnnotation'
    content.vb: Public NotInheritable Class ManagedResourceIntroductionAspect Implements IManagedResourceIntroductionAspect, IAspect, IAspectBuildSemantics, IValidableAnnotation
