- uid: PostSharp.Reflection.ReflectionHelper.IsExtensionBlockMetadata(System.Reflection.MemberInfo)
  commentId: M:PostSharp.Reflection.ReflectionHelper.IsExtensionBlockMetadata(System.Reflection.MemberInfo)
  id: IsExtensionBlockMetadata(System.Reflection.MemberInfo)
  isExtensionMethod: true
  parent: PostSharp.Reflection.ReflectionHelper
  langs:
  - csharp
  - vb
  name: IsExtensionBlockMetadata(MemberInfo)
  nameWithType: ReflectionHelper.IsExtensionBlockMetadata(MemberInfo)
  fullName: PostSharp.Reflection.ReflectionHelper.IsExtensionBlockMetadata(System.Reflection.MemberInfo)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Reflection
  summary: Determines whether a <xref href="System.Reflection.MemberInfo" data-throw-if-not-resolved="false"></xref> represents an extension block metadata member (type, method, or property).
  remarks: >-
    <p>Extension block metadata should not be targeted by aspects.</p>

    <p>The C# compiler implements the members of a C# 14 extension block as static methods of the enclosing class,
        and describes the block with nested metadata types. Use this method, for instance in an
        <xref href="PostSharp.Aspects.IAspectProvider" data-throw-if-not-resolved="false"></xref>, to skip these metadata types and their members. The static implementation
        methods are not extension block metadata and can be targeted by aspects.</p>
  example: []
  syntax:
    content: public static bool IsExtensionBlockMetadata(this MemberInfo member)
    parameters:
    - id: member
      type: System.Reflection.MemberInfo
      description: A <xref href="System.Reflection.MemberInfo" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Boolean
      description: <code>true</code> if <code class="paramref">member</code> is extension block metadata, <code>false</code> otherwise.
    content.vb: Public Shared Function IsExtensionBlockMetadata(member As MemberInfo) As Boolean
  overload: PostSharp.Reflection.ReflectionHelper.IsExtensionBlockMetadata*
  seealso:
  - linkId: PostSharp.Extensibility.MulticastAttribute.AllowExtensionBlockMembers
    commentId: P:PostSharp.Extensibility.MulticastAttribute.AllowExtensionBlockMembers
  - linkType: HRef
    linkId: '@extension-blocks-multicast'
    altText: 'Conceptual: C# 14 extension blocks and multicasting'
