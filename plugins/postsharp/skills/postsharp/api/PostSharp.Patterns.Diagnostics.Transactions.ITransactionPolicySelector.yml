  remarks: This method must ignore any sampling policy since they have already been evaluated by <xref href="PostSharp.Patterns.Diagnostics.Transactions.ITransactionPolicySelector.GetTransactionRequirement(PostSharp.Patterns.Diagnostics.Transactions.TransactionProperties%40%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: ITransactionPolicy GetPolicy(in TransactionProperties properties, bool throwing = false)
    parameters:
    - id: properties
      type: PostSharp.Patterns.Diagnostics.Transactions.TransactionProperties
      description: The properties, especially of the activity that is creating a transaction.
    - id: throwing
      type: System.Boolean
      description: >-
        <code>true</code> if errors should be reported as exceptions, <code>false</code> if they should be handled without exception.
            The default is <code>false</code>. The <code>true</code> value is used for debugging and diagnostics.
    return:
      type: PostSharp.Patterns.Diagnostics.Transactions.ITransactionPolicy
      description: Policy to apply to the activity.
    content.vb: Function GetPolicy(properties As TransactionProperties, throwing As Boolean = False) As ITransactionPolicy
