  nameWithType: ITransactionPolicySelector.GetTransactionRequirement(in TransactionProperties, bool)
  fullName: PostSharp.Patterns.Diagnostics.Transactions.ITransactionPolicySelector.GetTransactionRequirement(in PostSharp.Patterns.Diagnostics.Transactions.TransactionProperties, bool)
  type: Method
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Transactions
  summary: Determines whether an activity should result in opening a transaction.
  remarks: This method must apply sampling policies, if any.
  example: []
  syntax:
    content: TransactionRequirement GetTransactionRequirement(in TransactionProperties properties, bool throwing = false)
    parameters:
    - id: properties
      type: PostSharp.Patterns.Diagnostics.Transactions.TransactionProperties
      description: The properties, especially of the activity that is creating a transaction.
    - id: throwing
      type: System.Boolean
      description: >-
        <code>true</code> if errors should be reported as exceptions, <code>false</code> if they should be handled without exception.
            The default is <code>false</code>. The <code>true</code> value is used for debugging and diagnostics.
    return:
      type: PostSharp.Patterns.Diagnostics.Transactions.TransactionRequirement
      description: Policy to apply to the activity.
    content.vb: Function GetTransactionRequirement(properties As TransactionProperties, throwing As Boolean = False) As TransactionRequirement
