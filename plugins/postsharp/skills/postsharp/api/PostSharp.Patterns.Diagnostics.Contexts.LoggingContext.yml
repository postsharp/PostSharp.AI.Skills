- uid: PostSharp.Patterns.Diagnostics.Contexts.LoggingContext.GetExecutionContextData(PostSharp.Patterns.Diagnostics.Contexts.LoggingExecutionContextData,System.Boolean)
  commentId: M:PostSharp.Patterns.Diagnostics.Contexts.LoggingContext.GetExecutionContextData(PostSharp.Patterns.Diagnostics.Contexts.LoggingExecutionContextData,System.Boolean)
  id: GetExecutionContextData(PostSharp.Patterns.Diagnostics.Contexts.LoggingExecutionContextData,System.Boolean)
  parent: PostSharp.Patterns.Diagnostics.Contexts.LoggingContext
  langs:
  - csharp
  - vb
  name: GetExecutionContextData(LoggingExecutionContextData, bool)
  nameWithType: LoggingContext.GetExecutionContextData(LoggingExecutionContextData, bool)
  fullName: PostSharp.Patterns.Diagnostics.Contexts.LoggingContext.GetExecutionContextData(PostSharp.Patterns.Diagnostics.Contexts.LoggingExecutionContextData, bool)
  type: Method
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Contexts
  summary: >-
    Returns a new layer for the async stack that has this <xref href="PostSharp.Patterns.Diagnostics.Contexts.LoggingContext" data-throw-if-not-resolved="false"></xref> as the associated activity and <code class="paramref">current</code> as the

    <xref href="PostSharp.Patterns.Diagnostics.Contexts.LoggingExecutionContextData.Parent" data-throw-if-not-resolved="false"></xref>, if a new layer is required.
  remarks: >-
    The flow is:


    <ul><li>LoggingContext.UpdateExecutionContextData calls LoggingContext.GetExecutionContextData, which is virtual.</li><li>GetExecutionContextData returns null if no new layer needs to be created, or returns the new layer, fully edited, otherwise.</li><li>The implementation in the LoggingContext class creates a copy using "LoggingExecutionContextData.Clone" which may create a subclass.</li><li>Implementors must call the base class so that the synthetic ID, the logging properties, and other such data are filled in.</li></ul>
  example: []
  syntax:
    content: protected virtual LoggingExecutionContextData GetExecutionContextData(LoggingExecutionContextData current, bool requireNew)
    parameters:
    - id: current
      type: PostSharp.Patterns.Diagnostics.Contexts.LoggingExecutionContextData
      description: The layer in the async stack that is currently on top. It will become the parent of the new layer.
    - id: requireNew
      type: System.Boolean
      description: >-
        If <code>true</code>, this method must return a new instance. This is a parameter passed by the overriding method to the base call
                    if the overriding method wants the layer to be created even if there are no properties or synthetic ID.
    return:
      type: PostSharp.Patterns.Diagnostics.Contexts.LoggingExecutionContextData
      description: The <xref href="PostSharp.Patterns.Diagnostics.Contexts.LoggingExecutionContextData" data-throw-if-not-resolved="false"></xref> to be put on top of the async stack, or <code>null</code> if no new layer is needed.
    content.vb: Protected Overridable Function GetExecutionContextData(current As LoggingExecutionContextData, requireNew As Boolean) As LoggingExecutionContextData
  overload: PostSharp.Patterns.Diagnostics.Contexts.LoggingContext.GetExecutionContextData*
  nameWithType.vb: LoggingContext.GetExecutionContextData(LoggingExecutionContextData, Boolean)
  fullName.vb: PostSharp.Patterns.Diagnostics.Contexts.LoggingContext.GetExecutionContextData(PostSharp.Patterns.Diagnostics.Contexts.LoggingExecutionContextData, Boolean)
  name.vb: GetExecutionContextData(LoggingExecutionContextData, Boolean)
