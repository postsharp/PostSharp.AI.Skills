- uid: PostSharp.Patterns.Diagnostics.Contexts.LoggingContext.VisitProperties(System.Action{System.String,System.Object},System.Boolean)
  commentId: M:PostSharp.Patterns.Diagnostics.Contexts.LoggingContext.VisitProperties(System.Action{System.String,System.Object},System.Boolean)
  id: VisitProperties(System.Action{System.String,System.Object},System.Boolean)
  parent: PostSharp.Patterns.Diagnostics.Contexts.LoggingContext
  langs:
  - csharp
  - vb
  name: VisitProperties(Action<string, object>, bool)
  nameWithType: LoggingContext.VisitProperties(Action<string, object>, bool)
  fullName: PostSharp.Patterns.Diagnostics.Contexts.LoggingContext.VisitProperties(System.Action<string, object>, bool)
  type: Method
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Contexts
  summary: >-
    Invokes a delegate for each property on the current context, and, optionally, for inherited properties in ancestor contexts.

    This offers a simple way to visit properties, but it has a performance overhead compared to <xref href="PostSharp.Patterns.Diagnostics.Contexts.LoggingContext.VisitProperties%60%601(PostSharp.Patterns.Diagnostics.Custom.ILoggingPropertyVisitor%7b%60%600%7d%2c%60%600%40%2cPostSharp.Patterns.Diagnostics.Custom.LoggingPropertyVisitorOptions%40)" data-throw-if-not-resolved="false"></xref>

    because it is weakly typed and causes the allocation of a closure class to build the action. It also does not expose the <xref href="PostSharp.Patterns.Diagnostics.Custom.LoggingPropertyOptions" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public void VisitProperties(Action<string, object> action, bool includeAncestors = true)
    parameters:
    - id: action
      type: System.Action{System.String,System.Object}
      description: The delegate to call for each property. The first value is the property name, the second its value.
      attributes:
      - type: PostSharp.Patterns.Contracts.RequiredAttribute
        ctor: PostSharp.Patterns.Contracts.RequiredAttribute.#ctor
        arguments: []
    - id: includeAncestors
      type: System.Boolean
      description: Whether inherited properties of ancestor contexts should be visited too.
    content.vb: Public Sub VisitProperties(action As Action(Of String, Object), includeAncestors As Boolean = True)
  overload: PostSharp.Patterns.Diagnostics.Contexts.LoggingContext.VisitProperties*
  nameWithType.vb: LoggingContext.VisitProperties(Action(Of String, Object), Boolean)
  fullName.vb: PostSharp.Patterns.Diagnostics.Contexts.LoggingContext.VisitProperties(System.Action(Of String, Object), Boolean)
  name.vb: VisitProperties(Action(Of String, Object), Boolean)
