        ctor: PostSharp.Patterns.Contracts.RequiredAttribute.#ctor
        arguments: []
    - id: includeAncestors
      type: System.Boolean
      description: <code>true</code> if ancestor contexts should be visited, <code>false</code> if only the current context should be visited.
    content.vb: >-
      <Obsolete("Use VisitProperties.")>

