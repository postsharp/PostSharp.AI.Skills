  name: LoggingContext
  nameWithType: LoggingContext
  fullName: PostSharp.Patterns.Diagnostics.Contexts.LoggingContext
  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Contexts
  summary: Represents an execution context, typically a method or a user activity.
  remarks: >-
    <p>A context stores the data shared by the records of the same execution, typically its entry and exit records.
        Each kind of context is a derived class created by a factory method of <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend" data-throw-if-not-resolved="false"></xref>, for example
        <xref href="PostSharp.Patterns.Diagnostics.Contexts.SyncMethodLoggingContext" data-throw-if-not-resolved="false"></xref> by <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.CreateSyncMethodContext(PostSharp.Patterns.Diagnostics.Contexts.ThreadLoggingContext)" data-throw-if-not-resolved="false"></xref>. Most backends use these classes as they are;
        a backend derives from them only when it needs to store more data.</p>
  example: []
  syntax:
    content: 'public abstract class LoggingContext : ILoggingContext, IDisposable'
    content.vb: Public MustInherit Class LoggingContext Implements ILoggingContext, IDisposable
  seealso:
  - linkType: HRef
    linkId: '@custom-logging-backend'
    altText: 'Conceptual: Building Your Own Logging Backend (Adapter)'
  inheritance:
  - System.Object
  derivedClasses:
  - PostSharp.Patterns.Diagnostics.Contexts.EphemeralLoggingContext
  - PostSharp.Patterns.Diagnostics.Contexts.SuspendableLoggingContext
  - PostSharp.Patterns.Diagnostics.Contexts.SyncLoggingContext
  - PostSharp.Patterns.Diagnostics.Contexts.ThreadLoggingContext
