  name: CacheConfigurationAttribute
  nameWithType: CacheConfigurationAttribute
  fullName: PostSharp.Patterns.Caching.CacheConfigurationAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching
  summary: >-
    Custom attribute that, when applied to a type, configures the <xref href="PostSharp.Patterns.Caching.CacheAttribute" data-throw-if-not-resolved="false"></xref> aspects applied to the methods of this type

    or its derived types. When applied to an assembly, the <xref href="PostSharp.Patterns.Caching.CacheConfigurationAttribute" data-throw-if-not-resolved="false"></xref> custom attribute configures all methods

    of the current assembly.
  remarks: >-
    <p>Any <xref href="PostSharp.Patterns.Caching.CacheConfigurationAttribute" data-throw-if-not-resolved="false"></xref> on the base class always has priority over a <xref href="PostSharp.Patterns.Caching.CacheConfigurationAttribute" data-throw-if-not-resolved="false"></xref>
        on the assembly, even if the base class is in a different assembly.</p>
    <p>Configuration is resolved at build time, property by property. For each property, the first value found in the following order wins:
        the <xref href="PostSharp.Patterns.Caching.CacheAttribute" data-throw-if-not-resolved="false"></xref> itself, the <xref href="PostSharp.Patterns.Caching.CacheConfigurationAttribute" data-throw-if-not-resolved="false"></xref> on the declaring type, then on each base type
        from the nearest to the farthest, then on the assembly that declares the cached method, and finally the <xref href="PostSharp.Patterns.Caching.CachingProfile" data-throw-if-not-resolved="false"></xref> at run time.
        Assembly-level <xref href="PostSharp.Patterns.Caching.CacheConfigurationAttribute" data-throw-if-not-resolved="false"></xref> instances of other assemblies are ignored.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Class)]

      public sealed class CacheConfigurationAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.AssemblyOrAttributeTargets.Class)>

      Public NotInheritable Class CacheConfigurationAttribute Inherits Attribute
