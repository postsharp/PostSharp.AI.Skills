- uid: PostSharp.Aspects.ILocationInterceptionArgs`1.Value
  commentId: P:PostSharp.Aspects.ILocationInterceptionArgs`1.Value
  id: Value
  parent: PostSharp.Aspects.ILocationInterceptionArgs`1
  langs:
  - csharp
  - vb
  name: Value
  nameWithType: ILocationInterceptionArgs<T>.Value
  fullName: PostSharp.Aspects.ILocationInterceptionArgs<T>.Value
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Gets or sets the location value.
  remarks: >-
    <p>
            Inside an <xref href="PostSharp.Aspects.ILocationInterceptionAspect.OnGetValue(PostSharp.Aspects.LocationInterceptionArgs)" data-throw-if-not-resolved="false"></xref> advice, this property is available after
            the next advice in the chain has been invoked using <xref href="PostSharp.Aspects.ILocationInterceptionArgs.ProceedGetValue" data-throw-if-not-resolved="false"></xref>. However, 
            inside an <xref href="PostSharp.Aspects.ILocationInterceptionAspect.OnSetValue(PostSharp.Aspects.LocationInterceptionArgs)" data-throw-if-not-resolved="false"></xref> advice, the value is available immediately,
            and is used as input by <xref href="PostSharp.Aspects.ILocationInterceptionArgs.ProceedSetValue" data-throw-if-not-resolved="false"></xref>. 
          </p>
    <p>
            See <xref href="PostSharp.Aspects.ILocationInterceptionArgs%601.GetCurrentValue" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.ILocationInterceptionArgs%601.SetNewValue(%600)" data-throw-if-not-resolved="false"></xref>
            to get or set the value of the location without affecting the value of this property.
          </p>
  example: []
  syntax:
    content: T Value { get; set; }
    parameters: []
    return:
      type: '{T}'
    content.vb: Property Value As T
  overload: PostSharp.Aspects.ILocationInterceptionArgs`1.Value*
  nameWithType.vb: ILocationInterceptionArgs(Of T).Value
  fullName.vb: PostSharp.Aspects.ILocationInterceptionArgs(Of T).Value
