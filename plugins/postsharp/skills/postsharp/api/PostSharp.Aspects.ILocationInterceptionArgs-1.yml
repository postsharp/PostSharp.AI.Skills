- uid: PostSharp.Aspects.ILocationInterceptionArgs`1.GetCurrentValue
  commentId: M:PostSharp.Aspects.ILocationInterceptionArgs`1.GetCurrentValue
  id: GetCurrentValue
  parent: PostSharp.Aspects.ILocationInterceptionArgs`1
  langs:
  - csharp
  - vb
  name: GetCurrentValue()
  nameWithType: ILocationInterceptionArgs<T>.GetCurrentValue()
  fullName: PostSharp.Aspects.ILocationInterceptionArgs<T>.GetCurrentValue()
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Retrieves the current value of the location without overwriting the <xref href="PostSharp.Aspects.Internals.LocationLevelAdviceArgs.Value" data-throw-if-not-resolved="false"></xref> property.
  remarks: >-
    <div class="NOTE"><h5>note</h5><p>
      This method is designed to be invoked during the execution of the advice. If you need to retrieve or store the value of the location at a different time, it is
      recommended to use the
      <xref href="PostSharp.Aspects.ILocationInterceptionArgs%601.Binding" data-throw-if-not-resolved="false"></xref>. Indeed, a binding is stateless, while
      <xref href="PostSharp.Aspects.LocationInterceptionArgs" data-throw-if-not-resolved="false"></xref>
      instances may be shared
      among different aspects.
    </p></div>
  example: []
  syntax:
    content: T GetCurrentValue()
    return:
      type: '{T}'
      description: The current value of the location, as returned by the next node in the chain of invocation (see <xref href="PostSharp.Aspects.LocationInterceptionArgs.Binding" data-throw-if-not-resolved="false"></xref>).
    content.vb: Function GetCurrentValue() As T
  overload: PostSharp.Aspects.ILocationInterceptionArgs`1.GetCurrentValue*
  nameWithType.vb: ILocationInterceptionArgs(Of T).GetCurrentValue()
  fullName.vb: PostSharp.Aspects.ILocationInterceptionArgs(Of T).GetCurrentValue()
- uid: PostSharp.Aspects.ILocationInterceptionArgs`1.SetNewValue(`0)
