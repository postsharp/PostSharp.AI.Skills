  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Gets an interface that allows invoking the next node in the chain of invocation of the intercepted method.
  remarks: >-
    <p>
      Bindings are thread-safe and context-free singleton instances exposing the next node in the chain of invocation.
    </p>
        <a href="@simple-aspects" target="_self">
      Conceptual: Developing Simple Aspects
    </a>
