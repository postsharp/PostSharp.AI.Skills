  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Sets the value of the location without overwriting the <xref href="PostSharp.Aspects.Internals.LocationLevelAdviceArgs.Value" data-throw-if-not-resolved="false"></xref> property.
  remarks: >-
    <br />
        <div class="NOTE"><h5>note</h5><p>
      This method is designed to be invoked during the execution of the advice. If you need to retrieve or store the value of the location at a different time, it is
      recommended to use the
      <xref href="PostSharp.Aspects.ILocationInterceptionArgs%601.Binding" data-throw-if-not-resolved="false"></xref>. Indeed, a binding is stateless, while
      <xref href="PostSharp.Aspects.LocationInterceptionArgs" data-throw-if-not-resolved="false"></xref>
      instances may be shared
      among different aspects.
    </p></div>
  example: []
  syntax:
    content: void SetNewValue(T value)
    parameters:
    - id: value
      type: '{T}'
      description: The value to be passed to the next node in the chain of invocation (see <xref href="PostSharp.Aspects.LocationInterceptionArgs.Binding" data-throw-if-not-resolved="false"></xref>).
    content.vb: Sub SetNewValue(value As T)
  overload: PostSharp.Aspects.ILocationInterceptionArgs`1.SetNewValue*
  nameWithType.vb: ILocationInterceptionArgs(Of T).SetNewValue(T)
  fullName.vb: PostSharp.Aspects.ILocationInterceptionArgs(Of T).SetNewValue(T)
