  name: LoadAssemblyFromFile(string)
  nameWithType: IPostSharpEnvironment.LoadAssemblyFromFile(string)
  fullName: PostSharp.Extensibility.IPostSharpEnvironment.LoadAssemblyFromFile(string)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: Loads an <xref href="System.Reflection.Assembly" data-throw-if-not-resolved="false"></xref> given its file name.
  remarks: >-
    <p>
            Use this method instead of <xref href="System.Reflection.Assembly.LoadFile(System.String)" data-throw-if-not-resolved="false"></xref>.
          </p>
    <div class="NOTE"><h5>note</h5><p>
            You cannot load two assemblies with different paths and the same identity (strong name) into PostSharp.
          </p></div>
  example: []
  syntax:
    content: Assembly LoadAssemblyFromFile(string fileName)
    parameters:
    - id: fileName
      type: System.String
      description: The full path of the assembly.
    return:
      type: System.Reflection.Assembly
      description: The <xref href="System.Reflection.Assembly" data-throw-if-not-resolved="false"></xref>.
    content.vb: Function LoadAssemblyFromFile(fileName As String) As Assembly
