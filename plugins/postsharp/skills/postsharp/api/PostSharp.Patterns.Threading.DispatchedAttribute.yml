- uid: PostSharp.Patterns.Threading.DispatchedAttribute.FireAndForget
  commentId: P:PostSharp.Patterns.Threading.DispatchedAttribute.FireAndForget
  id: FireAndForget
  parent: PostSharp.Patterns.Threading.DispatchedAttribute
  langs:
  - csharp
  - vb
  name: FireAndForget
  nameWithType: DispatchedAttribute.FireAndForget
  fullName: PostSharp.Patterns.Threading.DispatchedAttribute.FireAndForget
  type: Property
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Gets or sets a value indicating whether the caller continues immediately after enqueuing the call to the target method,

    without waiting for the method to complete. This property applies when the aspect is applied to a void non-async method.

    The default value is <code>false</code>.
  remarks: >-
    <p>Methods that have a non-<code>void</code> return type or <code>ref</code> or <code>out</code> parameters
        cannot be dispatched asynchronously.</p>
  example: []
  syntax:
    content: >-
      [Obsolete("Set ExecutionMode to NonBlocking instead.")]

      public bool FireAndForget { get; set; }
    parameters: []
    return:
      type: System.Boolean
      description: >-
        <code>true</code> if the target method must be invoked asynchronously, or <code>false</code>
            if the target method must be invoked synchronously, that is, if the caller must wait for the
            dispatched method to complete.
    content.vb: >-
      <Obsolete("Set ExecutionMode to NonBlocking instead.")>

      Public Property FireAndForget As Boolean
  overload: PostSharp.Patterns.Threading.DispatchedAttribute.FireAndForget*
  attributes:
  - type: System.ObsoleteAttribute
    ctor: System.ObsoleteAttribute.#ctor(System.String)
    arguments:
    - type: System.String
      value: Set ExecutionMode to NonBlocking instead.
