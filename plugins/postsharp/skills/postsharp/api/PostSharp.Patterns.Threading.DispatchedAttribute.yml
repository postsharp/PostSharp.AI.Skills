  name: DispatchedAttribute
  nameWithType: DispatchedAttribute
  fullName: PostSharp.Patterns.Threading.DispatchedAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: Custom attribute that, when applied to a method, specifies that the method should be executed in the UI thread.
  remarks: >-
    <p>Execution of the method can be synchronous or asynchronous according to the value of the <xref href="PostSharp.Patterns.Threading.DispatchedAttribute.FireAndForget" data-throw-if-not-resolved="false"></xref>
        property.</p>
    <p>This aspect can be applied to instance methods of UI controls (WinForms or WPF), or to any class implementing the <xref href="PostSharp.Patterns.Threading.IDispatcherObject" data-throw-if-not-resolved="false"></xref> manually.</p>

    <p>When the class does not implement <xref href="PostSharp.Patterns.Threading.IDispatcherObject" data-throw-if-not-resolved="false"></xref>, the dispatcher is taken from the synchronization context of the thread
        that creates the object, typically the UI thread. Creating the object in a thread that has no synchronization context results in an <xref href="System.InvalidOperationException" data-throw-if-not-resolved="false"></xref>.
        The aspect cannot be applied to static methods.</p>
    <p>When an <code>async</code> method is called from another thread, the method is started in the dispatcher thread, and the returned task
        completes when the method completes.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class|AttributeTargets.Method|AttributeTargets.Interface)]

      [ProvideAspectRole("Threading")]

      [MulticastAttributeUsage(MulticastTargets.Method, TargetExternalMemberAttributes = MulticastAttributes.Internal, AllowMultiple = false)]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "Tracing")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "Caching")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "CacheInvalidation")]

      [Metric("UsedFeatures", "PostSharp.Patterns.Threading.DispatchedMethod")]

      [LinesOfCodeAvoided(0)]

      [Serializer(typeof(DispatchedAttribute.Serializer))]

      public sealed class DispatchedAttribute : MethodLevelAspect, IMethodLevelAspect, IMethodLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, IAspectProvider, IAspect, IService
    content.vb: >-
      <AttributeUsage(AttributeTargets.ClassOrAttributeTargets.MethodOrAttributeTargets.Interface)>

      <ProvideAspectRole("Threading")>

      <MulticastAttributeUsage(MulticastTargets.Method, TargetExternalMemberAttributes:=MulticastAttributes.Internal, AllowMultiple:=False)>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "Tracing")>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "Caching")>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "CacheInvalidation")>

      <Metric("UsedFeatures", "PostSharp.Patterns.Threading.DispatchedMethod")>

      <LinesOfCodeAvoided(0)>

      <Serializer(GetType(DispatchedAttribute.Serializer))>

      Public NotInheritable Class DispatchedAttribute Inherits MethodLevelAspect Implements IMethodLevelAspect, IMethodLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, IAspectProvider, IAspect, IService
