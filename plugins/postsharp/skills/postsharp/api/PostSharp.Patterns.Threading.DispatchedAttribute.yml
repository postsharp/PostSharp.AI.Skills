    content: public DispatchedAttribute(bool fireAndForget)
    parameters:
    - id: fireAndForget
      type: System.Boolean
      description: >-
        <code>true</code> if the target method must be invoked in non-blocking mode
            (equivalent to <xref href="PostSharp.Patterns.Threading.DispatchedExecutionMode.NonBlocking" data-throw-if-not-resolved="false"></xref>),
