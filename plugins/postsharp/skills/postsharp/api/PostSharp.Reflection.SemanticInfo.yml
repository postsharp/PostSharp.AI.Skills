- uid: PostSharp.Reflection.SemanticInfo.IsSelectable
  commentId: P:PostSharp.Reflection.SemanticInfo.IsSelectable
  id: IsSelectable
  parent: PostSharp.Reflection.SemanticInfo
  langs:
  - csharp
  - vb
  name: IsSelectable
  nameWithType: SemanticInfo.IsSelectable
  fullName: PostSharp.Reflection.SemanticInfo.IsSelectable
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Reflection
  summary: Gets a value indicating whether the declaration can be safely selected in a pointcut using the standard <code>System.Reflection</code> API.
  remarks: >-
    This property is <code>false</code> for declarations such as anonymous methods or local functions because their MSIL implementation

    can move from one type to another because of a mere change of the method body in C#. It is also <code>false</code> for

    implementation details such as anonymous method cache fields, or closure types, which should never be advised.
  example: []
  syntax:
    content: public bool IsSelectable { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public ReadOnly Property IsSelectable As Boolean
  overload: PostSharp.Reflection.SemanticInfo.IsSelectable*
