  namespace: PostSharp.Patterns.Diagnostics.Backends.NLog
  summary: Logging backend for NLog.
  remarks: >-
    <p>To use this backend, assign a new instance to <xref href="PostSharp.Patterns.Diagnostics.LoggingServices.DefaultBackend" data-throw-if-not-resolved="false"></xref> when the application starts.

    Pass a <xref href="PostSharp.Patterns.Diagnostics.Backends.NLog.NLogLoggingBackend.LogFactory" data-throw-if-not-resolved="false"></xref> to the constructor to choose the NLog configuration that receives the records; otherwise, the

    backend uses the global <xref href="NLog.LogManager" data-throw-if-not-resolved="false"></xref>.</p>

    <p>When <xref href="PostSharp.Patterns.Diagnostics.Backends.NLog.NLogCollectingTarget" data-throw-if-not-resolved="false"></xref> routes the events that your code logs directly with NLog through PostSharp Logging,

    create this backend with a separate <xref href="PostSharp.Patterns.Diagnostics.Backends.NLog.NLogLoggingBackend.LogFactory" data-throw-if-not-resolved="false"></xref> whose configuration contains the output targets, not the global

    configuration that contains the collecting target.</p>
  example: []
  syntax:
    content: 'public class NLogLoggingBackend : TextLoggingBackend, IDisposable'
    content.vb: Public Class NLogLoggingBackend Inherits TextLoggingBackend Implements IDisposable
  seealso:
