  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    For internal use only. Custom attribute used internally by <code>PostSharp</code> to mark

    elements that have inherited custom attributes. This custom attribute should not

    be used in custom code. Otherwise, <code>PostSharp</code> may not work properly.
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Class|AttributeTargets.Method|AttributeTargets.Interface|AttributeTargets.Parameter|AttributeTargets.ReturnValue, AllowMultiple = false, Inherited = true)]

      public sealed class HasInheritedAttributeAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.AssemblyOrAttributeTargets.ClassOrAttributeTargets.MethodOrAttributeTargets.InterfaceOrAttributeTargets.ParameterOrAttributeTargets.ReturnValue, AllowMultiple:=False, Inherited:=True)>

      Public NotInheritable Class HasInheritedAttributeAttribute Inherits Attribute
