  fullName: PostSharp.Patterns.Recording.RecordableAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording
  summary: >-
    Custom attribute that, when applied to a class, instruments fields and methods of this class so

    that it can be involved in undo/redo operations.
  remarks: >-
    <p>The aspect records each change to a field of the target object as an <xref href="PostSharp.Patterns.Recording.Operation" data-throw-if-not-resolved="false"></xref> in the <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref> to which the
        object is attached. By default, when the constructor completes, the aspect attaches the object to the recorder returned by
        <xref href="PostSharp.Patterns.Recording.RecordingServices.RecorderProvider" data-throw-if-not-resolved="false"></xref>, which is <xref href="PostSharp.Patterns.Recording.RecordingServices.DefaultRecorder" data-throw-if-not-resolved="false"></xref> unless you replace the provider.
        To attach objects manually with <xref href="PostSharp.Patterns.Recording.Recorder.Attach(System.Object)" data-throw-if-not-resolved="false"></xref>, set the <xref href="PostSharp.Patterns.Recording.RecordableAttribute.AutoRecord" data-throw-if-not-resolved="false"></xref> property to <code>false</code>.</p>
    <p>The aspect wraps each public or internal instance method, except property getters and event accessors, in an implicit
        <xref href="PostSharp.Patterns.Recording.RecordingScope" data-throw-if-not-resolved="false"></xref>, so that a call from outside the object model becomes a single logical operation. Use <xref href="PostSharp.Patterns.Recording.RecordingScopeAttribute" data-throw-if-not-resolved="false"></xref>
        to name or skip these scopes, and <xref href="PostSharp.Patterns.Recording.NotRecordedAttribute" data-throw-if-not-resolved="false"></xref> to exclude a field or property from recording.</p>
    <p>The aspect relies on the <xref href="PostSharp.Patterns.Model.AggregatableAttribute" data-throw-if-not-resolved="false"></xref> aspect, which it adds to the target class if needed.</p>
  example: []
  syntax:
    content: >-
      [IntroduceInterface(typeof(IRecordable), OverrideAction = InterfaceOverrideAction.Ignore, AncestorOverrideAction = InterfaceOverrideAction.Ignore)]

      [IntroduceInterface(typeof(IQueryInterface), OverrideAction = InterfaceOverrideAction.Ignore, AncestorOverrideAction = InterfaceOverrideAction.Ignore)]

      [MulticastAttributeUsage(MulticastTargets.Class, Inheritance = MulticastInheritance.Strict, AllowMultiple = false, TargetTypeAttributes = MulticastAttributes.UserGenerated)]

      [Metric("UsedFeatures", "PostSharp.Patterns.Recording.Recordable")]

      [ProvideAspectRole("ChangeTracking")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Tracing")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Threading")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Validation")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Caching")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "CacheInvalidation")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "ThreadingModel")]

      [AspectTypeDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, typeof(AggregatableAttribute))]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "DataBinding")]

      [AspectRoleDependency(AspectDependencyAction.Commute, "EditableObjectImplementation")]

      [AspectTypeDependency(AspectDependencyAction.Conflict, typeof(RecordableAttribute))]

      [Obsolete("[Recordable] aspect and its components are deprecated and will be removed in a future version.", false)]

      [Serializer(typeof(RecordableAttribute.Serializer))]

      public sealed class RecordableAttribute : InstanceLevelAspect, ITypeLevelAspect, ITypeLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, ICloneAwareAspect, IInstanceScopedAspect, IRecordable, IAspectProvider, IAspect, IService, IQueryInterface, IDynamicInterfaceImplementation
    content.vb: >-
      <IntroduceInterface(GetType(IRecordable), OverrideAction:=InterfaceOverrideAction.Ignore, AncestorOverrideAction:=InterfaceOverrideAction.Ignore)>

