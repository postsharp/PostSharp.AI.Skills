- uid: PostSharp.Patterns.Recording.RecordableAttribute.AutoRecord
  commentId: P:PostSharp.Patterns.Recording.RecordableAttribute.AutoRecord
  id: AutoRecord
  parent: PostSharp.Patterns.Recording.RecordableAttribute
  langs:
  - csharp
  - vb
  name: AutoRecord
  nameWithType: RecordableAttribute.AutoRecord
  fullName: PostSharp.Patterns.Recording.RecordableAttribute.AutoRecord
  type: Property
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording
  summary: Gets or sets a value indicating whether changes in this object must be recorded as soon as the object constructor has completed.
  remarks: >-
    <p>If this property is set to <code>true</code>, a <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref> will be automatically assigned to
        the target instance using the <xref href="PostSharp.Patterns.Recording.RecordingServices.RecorderProvider" data-throw-if-not-resolved="false"></xref>. Set this property to <code>false</code>
