  nameWithType: InternalImplementAttribute
  fullName: PostSharp.Constraints.InternalImplementAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Constraints
  summary: >-
    <xref href="PostSharp.Constraints.ReferentialConstraint" data-throw-if-not-resolved="false"></xref> that, when applied to an interface, prevents it from being implemented
        in a different assembly. This constraint should be used when the author of an interface
        does not expect users to implement the interface and wants to reserve the possibility
        to add new methods to the interface.
  remarks: >-
    <p>Implementing the interface in another assembly emits the warning <code>AR0101</code>, unless the assembly of the interface
        grants that assembly access with <xref href="System.Runtime.CompilerServices.InternalsVisibleToAttribute" data-throw-if-not-resolved="false"></xref>.
        Set <xref href="PostSharp.Constraints.InternalImplementAttribute.Severity" data-throw-if-not-resolved="false"></xref> to <xref href="PostSharp.Extensibility.SeverityType.Error" data-throw-if-not-resolved="false"></xref> to make it an error.
        <xref href="PostSharp.Extensibility.SuppressWarningAttribute" data-throw-if-not-resolved="false"></xref> can suppress the warning on the implementing type, but cannot suppress an error.</p>
    <p>The implementing project must be processed by PostSharp for the constraint to be validated.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Module|AttributeTargets.Class|AttributeTargets.Struct|AttributeTargets.Enum|AttributeTargets.Constructor|AttributeTargets.Method|AttributeTargets.Property|AttributeTargets.Field|AttributeTargets.Event|AttributeTargets.Interface|AttributeTargets.Delegate, AllowMultiple = true)]

      [MulticastAttributeUsage(MulticastTargets.Interface, TargetTypeAttributes = MulticastAttributes.Public)]

      public sealed class InternalImplementAttribute : ReferentialConstraint, IReferentialConstraint, IConstraint
    content.vb: >-
      <AttributeUsage(AttributeTargets.AssemblyOrAttributeTargets.ModuleOrAttributeTargets.ClassOrAttributeTargets.StructOrAttributeTargets.EnumOrAttributeTargets.ConstructorOrAttributeTargets.MethodOrAttributeTargets.PropertyOrAttributeTargets.FieldOrAttributeTargets.EventOrAttributeTargets.InterfaceOrAttributeTargets.Delegate, AllowMultiple:=True)>

