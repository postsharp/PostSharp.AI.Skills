  nameWithType: CustomAttributeIntroductionAspect
  fullName: PostSharp.Aspects.CustomAttributeIntroductionAspect
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Aspect that, when applied to a target, adds a custom attribute to this target.
  remarks: >-
    <p>
            There are two ways to specify a custom attribute: using an
            <xref href="PostSharp.Reflection.ObjectConstruction" data-throw-if-not-resolved="false"></xref> (to construct a new custom attribute), 
            or using a <xref href="System.Reflection.CustomAttributeData" data-throw-if-not-resolved="false"></xref> (to copy a custom attribute reflected 
            using one of the overloads of the method <xref href="System.Reflection.CustomAttributeData.GetCustomAttributes(System.Reflection.Assembly)" data-throw-if-not-resolved="false"></xref>).
          </p>
    <div class="NOTE"><h5>note</h5><p>
            This aspect is not a custom attribute. You have to create another aspect
            implementing <xref href="PostSharp.Aspects.IAspectProvider" data-throw-if-not-resolved="false"></xref> and have the method <xref href="PostSharp.Aspects.IAspectProvider.ProvideAspects(System.Object)" data-throw-if-not-resolved="false"></xref>
            return instances of this aspect.
          </p></div>
  example: []
  syntax:
    content: >-
      [LinesOfCodeAvoided(1)]

      public sealed class CustomAttributeIntroductionAspect : ICustomAttributeIntroductionAspect, IAspect, IAspectBuildSemantics, IValidableAnnotation
    content.vb: >-
