  summary: Base implementation of the <xref href="PostSharp.Patterns.Formatters.IFormatter%601" data-throw-if-not-resolved="false"></xref> interface.
  remarks: >-
    <p>Derive a class from <xref href="PostSharp.Patterns.Formatters.Formatter%601" data-throw-if-not-resolved="false"></xref> to customize how values of a type that you do not own are represented in logs or cache keys.
        For a type that you own, implementing <xref href="PostSharp.Patterns.Formatters.IFormattable" data-throw-if-not-resolved="false"></xref> is simpler. Unlike an <xref href="PostSharp.Patterns.Formatters.IFormattable" data-throw-if-not-resolved="false"></xref> implementation, a formatter
        is used only after it has been registered, for instance with <xref href="PostSharp.Patterns.Formatters.FormatterRepository%601.Register%60%601(PostSharp.Patterns.Formatters.IFormatter%7b%60%600%7d)" data-throw-if-not-resolved="false"></xref>.
        Logging and caching have separate formatter repositories, so a formatter must be registered with each component that should use it.</p>
  example: []
  syntax:
    content: 'public abstract class Formatter<T> : IFormatter<T>, IOptionAwareFormatter, IFormatter'
    typeParameters:
    - id: T
      description: The type of values that can be formatted.
    content.vb: Public MustInherit Class Formatter(Of T) Implements IFormatter(Of T), IOptionAwareFormatter, IFormatter
