  name: ValueAdapterFactory
  nameWithType: ValueAdapterFactory
  fullName: PostSharp.Patterns.Caching.ValueAdapters.ValueAdapterFactory
  type: Class
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching.ValueAdapters
  summary: >-
    Registers and provides value adapters (<xref href="PostSharp.Patterns.Caching.ValueAdapters.IValueAdapter" data-throw-if-not-resolved="false"></xref>), which make it possible, for example, to cache objects such as <xref href="System.IO.Stream" data-throw-if-not-resolved="false"></xref> or <xref href="System.Collections.IEnumerable" data-throw-if-not-resolved="false"></xref>,

    which could not be cached otherwise.
  remarks: >-
    <p>Each backend has its own instance, exposed by the <xref href="PostSharp.Patterns.Caching.Implementation.CachingBackend.ValueAdapters" data-throw-if-not-resolved="false"></xref> property. Adapters for
        <xref href="System.IO.Stream" data-throw-if-not-resolved="false"></xref>, <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref> and <xref href="System.Collections.Generic.IEnumerator%601" data-throw-if-not-resolved="false"></xref> are registered by default. To adapt a generic type,
        register the generic type definitions of the value type and of the adapter type, which must have the same number of generic parameters.</p>
  example: []
