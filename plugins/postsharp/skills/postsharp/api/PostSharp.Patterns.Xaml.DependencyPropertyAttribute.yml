  summary: Custom attribute that, when applied to an automatic property, turns this property into a XAML dependency property of the same name.
  remarks: >-
    <p>Suppose the target property is named <code>Foo</code>. If a method named <code>ValidateFoo</code> exists in the class, it will be used to validate the values assigned to this property.
        If a method named <code>OnFooChanged</code> exists in the class, it will be invoked whenever the property is set.
        If a property named <code>FooProperty</code> exists in the class, it will be assigned to the corresponding <xref href="System.Windows.DependencyProperty" data-throw-if-not-resolved="false"></xref> instance.
        Naming conventions can be overridden by the <xref href="PostSharp.Patterns.Xaml.DependencyPropertyBaseAttribute.ValidateValueMethod" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Patterns.Xaml.DependencyPropertyBaseAttribute.PropertyChangedMethod" data-throw-if-not-resolved="false"></xref>
        and <xref href="PostSharp.Patterns.Xaml.DependencyPropertyBaseAttribute.RegistrationProperty" data-throw-if-not-resolved="false"></xref> aspect properties.</p>
    <p>The target property must be a non-static property with a non-private getter, declared in a class that derives from <xref href="System.Windows.DependencyObject" data-throw-if-not-resolved="false"></xref>.
        To get the <xref href="System.Windows.DependencyProperty" data-throw-if-not-resolved="false"></xref> without a <code>FooProperty</code> property, use <xref href="PostSharp.Patterns.Xaml.DependencyPropertyServices.GetDependencyProperty(System.Type%2cSystem.String)" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: >-
      [MulticastAttributeUsage(PersistMetaData = true)]

      [ComVisible(false)]

      [Serializer(typeof(DependencyPropertyAttribute.Serializer))]

      public sealed class DependencyPropertyAttribute : DependencyPropertyBaseAttribute, ILocationLevelAspect, ILocationLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, IAspectProvider, IAspect, IService
    content.vb: >-
      <MulticastAttributeUsage(PersistMetaData:=True)>

      <ComVisible(False)>

      <Serializer(GetType(DependencyPropertyAttribute.Serializer))>

      Public NotInheritable Class DependencyPropertyAttribute Inherits DependencyPropertyBaseAttribute Implements ILocationLevelAspect, ILocationLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, IAspectProvider, IAspect, IService
