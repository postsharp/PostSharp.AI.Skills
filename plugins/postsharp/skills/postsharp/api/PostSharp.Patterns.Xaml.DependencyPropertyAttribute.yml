- uid: PostSharp.Patterns.Xaml.DependencyPropertyAttribute.DefaultValue
  commentId: P:PostSharp.Patterns.Xaml.DependencyPropertyAttribute.DefaultValue
  id: DefaultValue
  parent: PostSharp.Patterns.Xaml.DependencyPropertyAttribute
  langs:
  - csharp
  - vb
  name: DefaultValue
  nameWithType: DependencyPropertyAttribute.DefaultValue
  fullName: PostSharp.Patterns.Xaml.DependencyPropertyAttribute.DefaultValue
  type: Property
  assemblies:
  - PostSharp.Patterns.Xaml
  namespace: PostSharp.Patterns.Xaml
  summary: >-
    Gets or sets the initial value of the dependency property and the <xref href="System.Windows.PropertyMetadata.DefaultValue" data-throw-if-not-resolved="false"></xref> property of the dependency property metadata.

    If you set this property, do not use a property initializer.
  remarks: >-
    <p>
        There are two ways to set the initial value of a dependency property when you use <xref href="PostSharp.Patterns.Xaml.DependencyPropertyAttribute" data-throw-if-not-resolved="false"></xref>: You can use this property
        (but in that case you are limited to constants) or you can use the property initializer or set the initial value in the constructor (but in that case,
        the <xref href="System.Windows.PropertyMetadata.DefaultValue" data-throw-if-not-resolved="false"></xref> property will not be set).
        </p>
    <p>
        If you set both this property and the property initializer to nonzero, nonnull values, an exception is thrown. However, you can set the metadata default
        value using this property and you can change the actual initial value in the constructor (not the initializer).
        </p>
  example: []
  syntax:
    content: public object DefaultValue { get; set; }
    parameters: []
    return:
      type: System.Object
    content.vb: Public Property DefaultValue As Object
  overload: PostSharp.Patterns.Xaml.DependencyPropertyAttribute.DefaultValue*
