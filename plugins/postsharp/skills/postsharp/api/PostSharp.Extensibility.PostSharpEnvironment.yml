  name: IsPostSharpRunning
  nameWithType: PostSharpEnvironment.IsPostSharpRunning
  fullName: PostSharp.Extensibility.PostSharpEnvironment.IsPostSharpRunning
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: Gets a value indicating whether the <code>PostSharp</code> Platform is currently loaded.
  remarks: >-
    <p>Aspect code such as a static constructor can run both at build time, when PostSharp instantiates the aspect, and at run time.
        Test this property to skip initialization that must happen only at run time, for example getting dependencies from a service locator.</p>
  example: []
  syntax:
    content: public static bool IsPostSharpRunning { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Shared ReadOnly Property IsPostSharpRunning As Boolean
