  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Contracts
  summary: >-
    Custom attribute that, when added to a field, property or parameter, throws

    an <xref href="System.ArgumentException" data-throw-if-not-resolved="false"></xref> if the target is assigned a value that

    is not a valid email address. Null strings are accepted and do not

    throw an exception.
  remarks: <p>The error message is identified by <xref href="PostSharp.Patterns.Contracts.ContractLocalizedTextProvider.EmailAddressErrorMessage" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: >-
      [AspectConfiguration(SerializerType = typeof(MsilAspectSerializer))]

      public sealed class EmailAddressAttribute : RegularExpressionAttribute, ILocationLevelAspect, IAspect
    content.vb: >-
      <AspectConfiguration(SerializerType:=GetType(MsilAspectSerializer))>

      Public NotInheritable Class EmailAddressAttribute Inherits RegularExpressionAttribute Implements ILocationLevelAspect, IAspect
