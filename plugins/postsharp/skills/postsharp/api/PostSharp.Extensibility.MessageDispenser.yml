  name: MessageDispenser
  nameWithType: MessageDispenser
  fullName: PostSharp.Extensibility.MessageDispenser
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    Provides a base implementation of <xref href="PostSharp.Extensibility.IMessageDispenser" data-throw-if-not-resolved="false"></xref>

    in which the message key is expected to have the format <code>PRE0000</code>, where

    <code>PRE</code> is a prefix and <code>0000</code> is an integer. Keys for help URLs

    have the format <code>PRE0000?</code>.
  remarks: >-
    <p>Implement <xref href="PostSharp.Extensibility.MessageDispenser.GetMessage(System.Int32)" data-throw-if-not-resolved="false"></xref>, typically with a <code>switch</code> statement on the message number, and optionally
        <xref href="PostSharp.Extensibility.MessageDispenser.GetHelpUrl(System.Int32)" data-throw-if-not-resolved="false"></xref>. <xref href="PostSharp.Extensibility.MessageDispenser.GetMessage(System.String)" data-throw-if-not-resolved="false"></xref> returns <code>null</code> when the key does not start with <xref href="PostSharp.Extensibility.MessageDispenser.Prefix" data-throw-if-not-resolved="false"></xref>
        or when the rest of the key is not an integer. For example, with the prefix <code>CUS</code>, the key <code>CUS001</code> resolves to the
        message number 1.</p>
    <p>Pass an instance to the <xref href="PostSharp.Extensibility.MessageSource" data-throw-if-not-resolved="false"></xref> constructor to emit the messages.</p>
  example: []
  syntax:
    content: 'public abstract class MessageDispenser : IMessageDispenser'
    content.vb: Public MustInherit Class MessageDispenser Implements IMessageDispenser
