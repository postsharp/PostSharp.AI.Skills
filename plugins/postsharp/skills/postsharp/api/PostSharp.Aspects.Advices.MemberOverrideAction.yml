- uid: PostSharp.Aspects.Advices.MemberOverrideAction.OverrideOrFail
  commentId: F:PostSharp.Aspects.Advices.MemberOverrideAction.OverrideOrFail
  id: OverrideOrFail
  parent: PostSharp.Aspects.Advices.MemberOverrideAction
  langs:
  - csharp
  - vb
  name: OverrideOrFail
  nameWithType: MemberOverrideAction.OverrideOrFail
  fullName: PostSharp.Aspects.Advices.MemberOverrideAction.OverrideOrFail
  type: Field
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Tries to override the member, and fails if it is impossible (that is, if the existing member is defined

    in a base type and is sealed or non-virtual).
  example: []
  syntax:
    content: OverrideOrFail = 2
    return:
      type: PostSharp.Aspects.Advices.MemberOverrideAction
- uid: PostSharp.Aspects.Advices.MemberOverrideAction.OverrideOrIgnore
