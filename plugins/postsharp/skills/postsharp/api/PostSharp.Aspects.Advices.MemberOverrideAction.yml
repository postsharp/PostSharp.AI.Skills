  parent: PostSharp.Aspects.Advices.MemberOverrideAction
  langs:
  - csharp
  - vb
  name: OverrideOrIgnore
  nameWithType: MemberOverrideAction.OverrideOrIgnore
  fullName: PostSharp.Aspects.Advices.MemberOverrideAction.OverrideOrIgnore
  type: Field
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Tries to override the member, and silently ignores the introduction if it is impossible (that is, if the existing member is defined

    in a base type and is sealed or non-virtual).
  example: []
  syntax:
    content: OverrideOrIgnore = 3
    return:
      type: PostSharp.Aspects.Advices.MemberOverrideAction
