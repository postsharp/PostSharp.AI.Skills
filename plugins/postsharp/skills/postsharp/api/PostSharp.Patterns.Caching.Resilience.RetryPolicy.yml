- uid: PostSharp.Patterns.Caching.Resilience.RetryPolicy.TryAsync(PostSharp.Patterns.Caching.Resilience.OperationKind,System.Int32,System.Exception,System.Object@,System.Threading.CancellationToken)
  commentId: M:PostSharp.Patterns.Caching.Resilience.RetryPolicy.TryAsync(PostSharp.Patterns.Caching.Resilience.OperationKind,System.Int32,System.Exception,System.Object@,System.Threading.CancellationToken)
  id: TryAsync(PostSharp.Patterns.Caching.Resilience.OperationKind,System.Int32,System.Exception,System.Object@,System.Threading.CancellationToken)
  parent: PostSharp.Patterns.Caching.Resilience.RetryPolicy
  langs:
  - csharp
  - vb
  name: TryAsync(OperationKind, int, Exception, ref object, CancellationToken)
  nameWithType: RetryPolicy.TryAsync(OperationKind, int, Exception, ref object, CancellationToken)
  fullName: PostSharp.Patterns.Caching.Resilience.RetryPolicy.TryAsync(PostSharp.Patterns.Caching.Resilience.OperationKind, int, System.Exception, ref object, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching.Resilience
  summary: Determines whether a Redis transaction should be tried, and throws a <xref href="PostSharp.Patterns.Caching.CachingException" data-throw-if-not-resolved="false"></xref> if it cannot.
  example: []
  syntax:
    content: public virtual ValueTask<bool> TryAsync(OperationKind kind, int attempt, Exception exception, ref object state, CancellationToken cancellation)
    parameters:
    - id: kind
      type: PostSharp.Patterns.Caching.Resilience.OperationKind
      description: The transaction kind.
    - id: attempt
      type: System.Int32
      description: The index of the attempt. <code>0</code> indicates the first attempt, i.e. not a retry.
    - id: exception
      type: System.Exception
      description: The <xref href="System.Exception" data-throw-if-not-resolved="false"></xref> of the previous attempt, if any.
    - id: state
      type: System.Object
      description: >-
        A reference to an optional state of the operation, optionally set by the <xref href="PostSharp.Patterns.Caching.Resilience.IRetryPolicy" data-throw-if-not-resolved="false"></xref> implementation and
                    opaque to the caller.
    - id: cancellation
      type: System.Threading.CancellationToken
      description: A <xref href="System.Threading.CancellationToken" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Threading.Tasks.ValueTask{System.Boolean}
      description: Always <code>true</code>. Must throw an exception if it cannot retry.
    content.vb: Public Overridable Function TryAsync(kind As OperationKind, attempt As Integer, exception As Exception, state As Object, cancellation As CancellationToken) As ValueTask(Of Boolean)
  overload: PostSharp.Patterns.Caching.Resilience.RetryPolicy.TryAsync*
