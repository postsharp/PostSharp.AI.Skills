  name: LocationContractAttribute
  nameWithType: LocationContractAttribute
  fullName: PostSharp.Patterns.Contracts.LocationContractAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Contracts
  summary: Base class for other custom attributes in this namespace.
  remarks: >-
    <p>The basic error message is identified by <xref href="PostSharp.Patterns.Contracts.ContractLocalizedTextProvider.LocationContractErrorMessage" data-throw-if-not-resolved="false"></xref> and
        obtained from the provider set in <xref href="PostSharp.Patterns.Contracts.ContractServices.LocalizedTextProvider" data-throw-if-not-resolved="false"></xref>.</p>
    <p>In all formatting strings, the following parameters are replaced:</p>

    <ul><li>
          <code>{0}</code> is replaced by the location name.
            </li><li>
          <code>{1}</code> is replaced by the location kind.
            </li><li>
          <code>{2}</code> is replaced by a string containing both location kind and name.
            </li><li>
          <code>{3}</code> is replaced by the value which caused the error when being assigned to the location.
            </li><li>
                Further parameters are described in the remarks sections of contracts which override the <xref href="PostSharp.Patterns.Contracts.LocationContractAttribute.GetErrorMessageArguments" data-throw-if-not-resolved="false"></xref> method.
            </li></ul>
    <p>Note that an array of error message arguments is cached for each location.</p>

    <p>Contracts are inherited: a contract added to a parameter or return value of an abstract, virtual or interface method also applies to the
        overriding or implementing methods.</p>
    <p>To create a custom contract, derive a class from <xref href="PostSharp.Patterns.Contracts.LocationContractAttribute" data-throw-if-not-resolved="false"></xref> and implement <xref href="PostSharp.Aspects.ILocationValidationAspect%601" data-throw-if-not-resolved="false"></xref>
        for each type of value that the contract supports. The <xref href="PostSharp.Aspects.ILocationValidationAspect%601.ValidateValue(%600%2cSystem.String%2cPostSharp.Reflection.LocationKind%2cPostSharp.Aspects.LocationValidationContext)" data-throw-if-not-resolved="false"></xref> method returns an exception when the value is invalid,
        or <code>null</code> otherwise. To let users customize the exception, create it with the <xref href="PostSharp.Patterns.Contracts.ContractExceptionFactory.CreateException(PostSharp.Patterns.Contracts.ContractExceptionInfo)" data-throw-if-not-resolved="false"></xref> method
        of <xref href="PostSharp.Patterns.Contracts.ContractServices.ExceptionFactory" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: >-
      [AspectConfiguration(SerializerType = typeof(MsilAspectSerializer))]

      [MulticastAttributeUsage(MulticastTargets.Field|MulticastTargets.Property|MulticastTargets.Parameter|MulticastTargets.ReturnValue, TargetMemberAttributes = MulticastAttributes.NonAbstract|MulticastAttributes.NonLiteral, Inheritance = MulticastInheritance.Multicast, AllowMultiple = false, PersistMetaData = true)]

      [AttributeUsage(AttributeTargets.Property|AttributeTargets.Field|AttributeTargets.Parameter|AttributeTargets.ReturnValue)]

      [ProvideAspectRole("Validation")]

      public abstract class LocationContractAttribute : MulticastAttribute, ILocationLevelAspect, IAspect
    content.vb: >-
      <AspectConfiguration(SerializerType:=GetType(MsilAspectSerializer))>

      <MulticastAttributeUsage(MulticastTargets.FieldOrMulticastTargets.PropertyOrMulticastTargets.ParameterOrMulticastTargets.ReturnValue, TargetMemberAttributes:=MulticastAttributes.NonAbstractOrMulticastAttributes.NonLiteral, Inheritance:=MulticastInheritance.Multicast, AllowMultiple:=False, PersistMetaData:=True)>

      <AttributeUsage(AttributeTargets.PropertyOrAttributeTargets.FieldOrAttributeTargets.ParameterOrAttributeTargets.ReturnValue)>

      <ProvideAspectRole("Validation")>

      Public MustInherit Class LocationContractAttribute Inherits MulticastAttribute Implements ILocationLevelAspect, IAspect
