  fullName: PostSharp.Aspects.EventInterceptionArgs.ProceedAddHandler()
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Proceeds with adding the <xref href="System.Delegate" data-throw-if-not-resolved="false"></xref> to the event to which the current aspect is applied.

    This method invokes the next handler in the chain.

    It is typically invoked from the implementation of <xref href="PostSharp.Aspects.IEventInterceptionAspect.OnAddHandler(PostSharp.Aspects.EventInterceptionArgs)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public abstract void ProceedAddHandler()
    content.vb: Public MustOverride Sub ProceedAddHandler()
  overload: PostSharp.Aspects.EventInterceptionArgs.ProceedAddHandler*
