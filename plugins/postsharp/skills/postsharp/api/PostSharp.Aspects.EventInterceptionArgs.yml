- uid: PostSharp.Aspects.EventInterceptionArgs.ReturnValue
  commentId: P:PostSharp.Aspects.EventInterceptionArgs.ReturnValue
  id: ReturnValue
  parent: PostSharp.Aspects.EventInterceptionArgs
  langs:
  - csharp
  - vb
  name: ReturnValue
  nameWithType: EventInterceptionArgs.ReturnValue
  fullName: PostSharp.Aspects.EventInterceptionArgs.ReturnValue
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Gets the return value of the delegate.
  remarks: >-
    <p>This property is meaningful only during a delegate invocation (not during an addition or removal).</p>

    <p>This property is typically set by the <xref href="PostSharp.Aspects.EventInterceptionArgs.ProceedInvokeHandler" data-throw-if-not-resolved="false"></xref> method. It is also legal for
            an implementation of <xref href="PostSharp.Aspects.IEventInterceptionAspect.OnInvokeHandler(PostSharp.Aspects.EventInterceptionArgs)" data-throw-if-not-resolved="false"></xref> to change the value of this property.</p>
  example: []
  syntax:
    content: public object ReturnValue { get; set; }
    parameters: []
    return:
      type: System.Object
    content.vb: Public Property ReturnValue As Object
  overload: PostSharp.Aspects.EventInterceptionArgs.ReturnValue*
- uid: PostSharp.Aspects.EventInterceptionArgs.Event
  commentId: P:PostSharp.Aspects.EventInterceptionArgs.Event
  id: Event
