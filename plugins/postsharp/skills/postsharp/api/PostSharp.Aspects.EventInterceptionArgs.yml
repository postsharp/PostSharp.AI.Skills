- uid: PostSharp.Aspects.EventInterceptionArgs.ProceedInvokeHandler
  commentId: M:PostSharp.Aspects.EventInterceptionArgs.ProceedInvokeHandler
  id: ProceedInvokeHandler
  parent: PostSharp.Aspects.EventInterceptionArgs
  langs:
  - csharp
  - vb
  name: ProceedInvokeHandler()
  nameWithType: EventInterceptionArgs.ProceedInvokeHandler()
  fullName: PostSharp.Aspects.EventInterceptionArgs.ProceedInvokeHandler()
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Proceeds with invoking the <xref href="System.Delegate" data-throw-if-not-resolved="false"></xref> with the arguments specified in the <xref href="PostSharp.Aspects.EventInterceptionArgs.Arguments" data-throw-if-not-resolved="false"></xref> property.

    The delegate may change the <xref href="PostSharp.Aspects.EventInterceptionArgs.Arguments" data-throw-if-not-resolved="false"></xref> and set the <xref href="PostSharp.Aspects.EventInterceptionArgs.ReturnValue" data-throw-if-not-resolved="false"></xref>.

    This method invokes the next handler in the chain.

    It is typically invoked from the implementation of <xref href="PostSharp.Aspects.IEventInterceptionAspect.OnInvokeHandler(PostSharp.Aspects.EventInterceptionArgs)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public abstract void ProceedInvokeHandler()
    content.vb: Public MustOverride Sub ProceedInvokeHandler()
  overload: PostSharp.Aspects.EventInterceptionArgs.ProceedInvokeHandler*
