  nameWithType: EventInterceptionArgs
  fullName: PostSharp.Aspects.EventInterceptionArgs
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Arguments of handlers of aspects of the type <xref href="PostSharp.Aspects.EventInterceptionAspect" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>The same type is passed to the three advices of the aspect. <xref href="PostSharp.Aspects.EventInterceptionArgs.Handler" data-throw-if-not-resolved="false"></xref> is the delegate being added, removed,
                or invoked; <xref href="PostSharp.Aspects.EventInterceptionArgs.Arguments" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.EventInterceptionArgs.ReturnValue" data-throw-if-not-resolved="false"></xref> are meaningful only when a handler is invoked.
                From <xref href="PostSharp.Aspects.IEventInterceptionAspect.OnInvokeHandler(PostSharp.Aspects.EventInterceptionArgs)" data-throw-if-not-resolved="false"></xref>, you can call <xref href="PostSharp.Aspects.EventInterceptionArgs.RemoveHandler(System.Delegate)" data-throw-if-not-resolved="false"></xref> to unsubscribe
                the current handler, for instance after it has thrown an exception.</p>
        <div class="NOTE"><h5>note</h5><p>
      As a result of weaving optimizations, instances of classes derived from
      <xref href="PostSharp.Aspects.AdviceArgs" data-throw-if-not-resolved="false"></xref>
      may be shared among different aspects. Therefore,
      aspect code should not attempt to access this object once control has been passed to the next node in the chain of invocation. Consider working
      with
      aspect bindings
      if you need such deferred execution.
    </p></div>
        <div class="NOTE"><h5>note</h5><p>
      Aspect weaving optimizations may also cause an advice parameter of this type to appear as <code>null</code> when inspecting it in a debugger.
      If you need to inspect the instance at runtime, consider disabling aspect optimizations in the debug build configuration.
    </p></div>
        <a href="@simple-aspects" target="_self">
      Conceptual: Developing Simple Aspects
    </a>
