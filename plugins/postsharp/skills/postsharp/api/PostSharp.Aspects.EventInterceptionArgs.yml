  langs:
  - csharp
  - vb
  name: Event
  nameWithType: EventInterceptionArgs.Event
  fullName: PostSharp.Aspects.EventInterceptionArgs.Event
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Gets the event to which the current aspect has been applied.
  remarks: >-
    <div class="NOTE"><h5>note</h5><p>
            Using this property causes the aspect weaver to generate code that has non-trivial runtime overhead. Avoid using
            this property whenever possible. One possible solution is to use compile-time initialization of
            aspect instances and to make use of reflection only at build time.
          </p></div>
  example: []
  syntax:
    content: public EventInfo Event { get; set; }
    parameters: []
    return:
      type: System.Reflection.EventInfo
    content.vb: Public Property [Event] As EventInfo
  overload: PostSharp.Aspects.EventInterceptionArgs.Event*
