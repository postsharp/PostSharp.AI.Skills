  name: DeclarationIdentifier
  nameWithType: DeclarationIdentifier
  fullName: PostSharp.Reflection.DeclarationIdentifier
  type: Struct
  assemblies:
  - PostSharp
  namespace: PostSharp.Reflection
  summary: Encapsulates a unique identifier of a declaration. The identifier does not contain the kind of declaration. Different declarations of different kinds can have the same identifier.
  remarks: >-
    <p>
        The <xref href="PostSharp.Reflection.DeclarationIdentifier" data-throw-if-not-resolved="false"></xref> concept provides an efficient mechanism to correlate
        data that depend on the target declaration of the advice. Typically, such data can be computed at build time
        and serialized into the aspect, then consumed at run time. Without the <xref href="PostSharp.Reflection.DeclarationIdentifier" data-throw-if-not-resolved="false"></xref> concept,
        the data would be stored in a dictionary, for instance <code>Dictionary&lt;MethodInfo,MethodData&gt;</code> where <code>MethodData</code>
        is a custom class. However, relying on a dictionary has some performance costs. Thanks to the
        <xref href="PostSharp.Reflection.DeclarationIdentifier" data-throw-if-not-resolved="false"></xref> concept, data can be stored in an array, because the <xref href="PostSharp.Reflection.DeclarationIdentifier.MemberIndex" data-throw-if-not-resolved="false"></xref> 
        is guaranteed to be unique in a given type for a given kind of member (for instance, <xref href="PostSharp.Reflection.DeclarationIdentifier.MemberIndex" data-throw-if-not-resolved="false"></xref> is unique for all methods in the same type).
        Array lookups are much faster than dictionary lookups and do not rely on reflection, which gives a significant performance benefit.
        </p>
    <div class="NOTE"><h5>note</h5><p>
      <p>
        Although the CIL specification allows for up to 2^24 types in the same assembly and 2^24 methods (or other members) in the same type, the <xref href="PostSharp.Reflection.DeclarationIdentifier" data-throw-if-not-resolved="false"></xref>
        implementation assumes that there will be no more than 2^16 types in the same assembly and 2^16 members of the same kind in the same type. 
        The <xref href="PostSharp.Reflection.DeclarationIdentifier.AssemblyId" data-throw-if-not-resolved="false"></xref> property is coded on 32 bits. The <xref href="PostSharp.Reflection.DeclarationIdentifier.AssemblyId" data-throw-if-not-resolved="false"></xref> is computed
        by running the MD5 algorithm on the full assembly name. The probability of hash collision is approximately 10^-6 for an application of 100 assemblies and 10^-5
        for an application of 1,000 assemblies. Collisions can be avoided by adding the <xref href="PostSharp.Extensibility.AssemblyIdAttribute" data-throw-if-not-resolved="false"></xref> custom attribute to one of the assemblies causing
        a hash collision. Note that hash collisions are not automatically detected by PostSharp. However, you can build a hash collision detection program by looking at
        the <xref href="PostSharp.Extensibility.AssemblyIdAttribute" data-throw-if-not-resolved="false"></xref> custom attribute on all assemblies of your application after PostSharp has been executed.
        </p>
    </p></div>
  example: []
  syntax:
    content: 'public struct DeclarationIdentifier : IEquatable<DeclarationIdentifier>'
    content.vb: Public Structure DeclarationIdentifier Implements IEquatable(Of DeclarationIdentifier)
