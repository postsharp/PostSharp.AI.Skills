  name: MemberIndex
  nameWithType: DeclarationIdentifier.MemberIndex
  fullName: PostSharp.Reflection.DeclarationIdentifier.MemberIndex
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Reflection
  summary: Gets a number that uniquely identifies the member inside its declaring type, for the given member kind.
  remarks: >-
    <p>The value of this property is guaranteed to be smaller than the total number of methods in the declaring type.</p>

    <p>The value is guaranteed to be unique only in the declaring type, not in the set of base types. Numbering of members restarts at 0 for every derived type.</p>
  example: []
  syntax:
    content: public int MemberIndex { get; }
    parameters: []
    return:
      type: System.Int32
    content.vb: Public ReadOnly Property MemberIndex As Integer
  overload: PostSharp.Reflection.DeclarationIdentifier.MemberIndex*
