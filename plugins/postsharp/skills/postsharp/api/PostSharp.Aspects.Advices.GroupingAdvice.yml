  name: Master
  nameWithType: GroupingAdvice.Master
  fullName: PostSharp.Aspects.Advices.GroupingAdvice.Master
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Gets or sets the name of an advice method whose group the current advice joins. This property is obsolete: set <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Group" data-throw-if-not-resolved="false"></xref> on

    all the advices of the group instead.
  remarks: >-
    This property selects the group of the named advice, which can be declared in the same class or in a base class. It changes nothing

    else: the named advice keeps its group.
  example: []
  syntax:
    content: >-
      [Obsolete("Set the Group property on all the advices of the group instead.")]

      public string Master { get; set; }
    parameters: []
    return:
      type: System.String
    content.vb: >-
      <Obsolete("Set the Group property on all the advices of the group instead.")>

      Public Property Master As String
  overload: PostSharp.Aspects.Advices.GroupingAdvice.Master*
  attributes:
  - type: System.ObsoleteAttribute
    ctor: System.ObsoleteAttribute.#ctor(System.String)
    arguments:
    - type: System.String
      value: Set the Group property on all the advices of the group instead.
