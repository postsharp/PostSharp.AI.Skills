- uid: PostSharp.Aspects.Advices.GroupingAdvice.Master
  commentId: P:PostSharp.Aspects.Advices.GroupingAdvice.Master
  id: Master
  parent: PostSharp.Aspects.Advices.GroupingAdvice
  langs:
  - csharp
  - vb
  name: Master
  nameWithType: GroupingAdvice.Master
  fullName: PostSharp.Aspects.Advices.GroupingAdvice.Master
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Gets or sets the name of the master advice method of the group of the current advice.
  remarks: >-
    <p>
        Only the master advice can define the pointcut (<xref href="PostSharp.Aspects.Advices.Pointcut" data-throw-if-not-resolved="false"></xref>) of the group; a pointcut on another advice is ignored, and the
        compiler reports a warning.
        </p>
    <p>
        When this property is not set and the advice has a pointcut, the advice is the master of its own group. When it is not set and the
        advice has no pointcut, the group is inferred: the advice joins the only master advice of the same family declared in its class, or else in the
        nearest base class that declares one. When no class declares one, the advices of the class without <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Master" data-throw-if-not-resolved="false"></xref> and without pointcut
        form one group, whose master is the advice that sets a property that only a master can set, such as <xref href="PostSharp.Aspects.Advices.Advice.Description" data-throw-if-not-resolved="false"></xref>, or
        else the first advice. When several master advices could be selected, the compiler reports an error, and this property must be set.
        An advice that sets this property cannot set <code>SemanticallyAdvisedMethodKinds</code> or <code>UnsupportedTargetAction</code>, which only the
        master advice can set.
        </p>
