  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Base class for the advices that can be grouped with other advices of the same family, so that they are woven as one transformation.
  remarks: >-
    <p>Advices of the same family, for example <xref href="PostSharp.Aspects.Advices.OnMethodEntryAdvice" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.Advices.OnMethodExitAdvice" data-throw-if-not-resolved="false"></xref>,
            can be grouped so that they are woven as a single transformation, consistent with the code generated by the
            corresponding simple aspect, such as <xref href="PostSharp.Aspects.OnMethodBoundaryAspect" data-throw-if-not-resolved="false"></xref>. The advices of a group share their arguments,
            such as <xref href="PostSharp.Aspects.MethodExecutionArgs" data-throw-if-not-resolved="false"></xref>.</p>
    <p>The groups are formed in each class of the aspect separately. An advice without <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Group" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Master" data-throw-if-not-resolved="false"></xref>
            and pointcut joins the group of its class that has no advice of its kind yet. When there is no such group, the advice starts a
            group that applies to the target of the aspect. When there are several, the compiler reports an error, and <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Group" data-throw-if-not-resolved="false"></xref>
            must be set. An advice with a pointcut and without <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Group" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Master" data-throw-if-not-resolved="false"></xref> starts a group of its own.</p>
    <p>The pointcut of a group, and the properties that apply to the whole group, such as <xref href="PostSharp.Aspects.Advices.Advice.Description" data-throw-if-not-resolved="false"></xref>, can be
            set on any advice of the group, but on one advice only.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method, AllowMultiple = false, Inherited = false)]

      public abstract class GroupingAdvice : Advice
    content.vb: >-
      <AttributeUsage(AttributeTargets.Method, AllowMultiple:=False, Inherited:=False)>

