  nameWithType: GroupingAdvice
  fullName: PostSharp.Aspects.Advices.GroupingAdvice
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Base class for all advices that are possibly composed of

    multiple advices that can be grouped together using the <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Master" data-throw-if-not-resolved="false"></xref>

    property.
  remarks: >-
    <p>Advices of the same family, for example <xref href="PostSharp.Aspects.Advices.OnMethodEntryAdvice" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.Advices.OnMethodExitAdvice" data-throw-if-not-resolved="false"></xref>,
            can be grouped so that they are woven as a single transformation, consistent with the code generated by the
            corresponding simple aspect, such as <xref href="PostSharp.Aspects.OnMethodBoundaryAspect" data-throw-if-not-resolved="false"></xref>. Without grouping, the order of the advices
            determines how they are nested.</p>
    <p>A group has one master advice, which is the only advice of the group that can have a pointcut. The group is inferred when it is
            unambiguous: an advice without pointcut and without <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Master" data-throw-if-not-resolved="false"></xref> joins the only master advice of its family declared in its
            class. When the class declares several master advices of the same family, set <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Master" data-throw-if-not-resolved="false"></xref> on the other advices of the group
            to the name of the master advice method, and do not specify any pointcut on them.</p>
