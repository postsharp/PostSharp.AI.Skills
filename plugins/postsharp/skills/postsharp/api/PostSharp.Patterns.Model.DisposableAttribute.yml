  name: DisposableAttribute
  nameWithType: DisposableAttribute
  fullName: PostSharp.Patterns.Model.DisposableAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Model
  summary: >-
    Custom attribute that, when applied to a class, implements the <xref href="System.IDisposable" data-throw-if-not-resolved="false"></xref> interface in such a way that

    the <xref href="System.IDisposable.Dispose" data-throw-if-not-resolved="false"></xref> method executes the <xref href="System.IDisposable.Dispose" data-throw-if-not-resolved="false"></xref> method for all

    child objects that also implement the <xref href="System.IDisposable" data-throw-if-not-resolved="false"></xref> interface.
  remarks: >-
    <p>The aspect relies on the <xref href="PostSharp.Patterns.Model.AggregatableAttribute" data-throw-if-not-resolved="false"></xref> aspect to find children, so you must annotate the fields and properties
        that hold child objects with <xref href="PostSharp.Patterns.Model.ChildAttribute" data-throw-if-not-resolved="false"></xref>. Children that do not implement <xref href="System.IDisposable" data-throw-if-not-resolved="false"></xref> are ignored.</p>
    <p>To add your own disposal logic, define a <code>protected virtual void Dispose(bool disposing)</code> method in the target class. The aspect
        calls it after it has disposed of the children.</p>
    <p>The aspect does not introduce a finalizer. If you need one, implement it manually and call <code>Dispose</code> from it.</p>
  example: []
  syntax:
    content: >-
      [IntroduceInterface(typeof(IDisposable), OverrideAction = InterfaceOverrideAction.Ignore)]

      [MulticastAttributeUsage(Inheritance = MulticastInheritance.Strict)]

      [Serializer(typeof(DisposableAttribute.Serializer))]

      public sealed class DisposableAttribute : AggregatableClientAttribute, ITypeLevelAspect, ITypeLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, ICloneAwareAspect, IInstanceScopedAspect, IAspectProvider, IService, IAdviceProvider, IAspect, IDisposable
    content.vb: >-
      <IntroduceInterface(GetType(IDisposable), OverrideAction:=InterfaceOverrideAction.Ignore)>

      <MulticastAttributeUsage(Inheritance:=MulticastInheritance.Strict)>

      <Serializer(GetType(DisposableAttribute.Serializer))>

      Public NotInheritable Class DisposableAttribute Inherits AggregatableClientAttribute Implements ITypeLevelAspect, ITypeLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, ICloneAwareAspect, IInstanceScopedAspect, IAspectProvider, IService, IAdviceProvider, IAspect, IDisposable
