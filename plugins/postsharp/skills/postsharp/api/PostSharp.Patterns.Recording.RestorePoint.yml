  name: RestorePoint
  nameWithType: RestorePoint
  fullName: PostSharp.Patterns.Recording.RestorePoint
  type: Class
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording
  summary: >-
    Represents a point to which operations can be undone or redone. A <xref href="PostSharp.Patterns.Recording.RestorePoint" data-throw-if-not-resolved="false"></xref> is a pseudo-<xref href="PostSharp.Patterns.Recording.Operation" data-throw-if-not-resolved="false"></xref>

    that does not represent any change.
  remarks: >-
    <p>Create a restore point with the <xref href="PostSharp.Patterns.Recording.Recorder.AddRestorePoint(System.String)" data-throw-if-not-resolved="false"></xref> method, then pass it to <xref href="PostSharp.Patterns.Recording.Recorder.UndoTo(PostSharp.Patterns.Recording.Operation)" data-throw-if-not-resolved="false"></xref> or
        <xref href="PostSharp.Patterns.Recording.Recorder.RedoTo(PostSharp.Patterns.Recording.Operation)" data-throw-if-not-resolved="false"></xref>. Unlike other operations, a restore point can be removed from the history with the <xref href="PostSharp.Patterns.Recording.RestorePoint.Remove" data-throw-if-not-resolved="false"></xref> method.</p>
  example: []
  syntax:
    content: >-
      [Obsolete("[Recordable] aspect and its components are deprecated and will be removed in a future version.", false)]

      public sealed class RestorePoint : Operation, IOperationDescriptor
    content.vb: >-
      <Obsolete("[Recordable] aspect and its components are deprecated and will be removed in a future version.", False)>

      Public NotInheritable Class RestorePoint Inherits Operation Implements IOperationDescriptor
