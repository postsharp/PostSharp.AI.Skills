  summary: >-
    <p>
        The <xref href="PostSharp.Patterns.Threading.Models.ActorThreadingModel" data-throw-if-not-resolved="false"></xref> class describes a threading model in which methods are processed
        asynchronously by a single thread, which suppresses concurrency inside each instance of the actor.
        To use the <xref href="PostSharp.Patterns.Threading.Models.ActorThreadingModel" data-throw-if-not-resolved="false"></xref>, apply the <xref href="PostSharp.Patterns.Threading.ActorAttribute" data-throw-if-not-resolved="false"></xref> to a class.
        </p>
