  name: RecordingScopeAttribute
  nameWithType: RecordingScopeAttribute
  fullName: PostSharp.Patterns.Recording.RecordingScopeAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording
  summary: >-
    Custom attribute that, when applied to a method, defines the characteristics of the <xref href="PostSharp.Patterns.Recording.RecordingScope" data-throw-if-not-resolved="false"></xref> that corresponds

    to the target method.
  remarks: >-
    <p>Use the <xref href="PostSharp.Patterns.Recording.RecordingScopeAttribute.Name" data-throw-if-not-resolved="false"></xref> property to give the logical operation a user-friendly name. Use <xref href="PostSharp.Patterns.Recording.RecordingScopeOption.Skip" data-throw-if-not-resolved="false"></xref> to prevent
        the method from opening a scope, for instance when the method opens a scope itself with
        <xref href="PostSharp.Patterns.Recording.Recorder.OpenScope(System.String%2cPostSharp.Patterns.Recording.RecordingScopeOption)" data-throw-if-not-resolved="false"></xref>. Use <xref href="PostSharp.Patterns.Recording.RecordingScopeOption.Atomic" data-throw-if-not-resolved="false"></xref> to roll back the changes made by the method
        when it throws an exception.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method|AttributeTargets.Property, AllowMultiple = false)]

      [MulticastAttributeUsage(MulticastTargets.Method, Inheritance = MulticastInheritance.Strict, PersistMetaData = true)]

      [Obsolete("[Recordable] aspect and its components are deprecated and will be removed in a future version.", false)]

      public sealed class RecordingScopeAttribute : MulticastAttribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.MethodOrAttributeTargets.Property, AllowMultiple:=False)>

      <MulticastAttributeUsage(MulticastTargets.Method, Inheritance:=MulticastInheritance.Strict, PersistMetaData:=True)>

      <Obsolete("[Recordable] aspect and its components are deprecated and will be removed in a future version.", False)>

      Public NotInheritable Class RecordingScopeAttribute Inherits MulticastAttribute
