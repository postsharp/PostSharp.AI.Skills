  namespace: PostSharp.Patterns.Diagnostics.Transactions.Model
  summary: >-
    Gets a value indicating whether the parent request was logged as a result of sampling.

    This means that a policy that had a sampling clause logged the parent request. It corresponds

    to the <code>sampled</code> flag of the W3C Trace Context specification

    (https://www.w3.org/TR/trace-context/#sampled-flag).
