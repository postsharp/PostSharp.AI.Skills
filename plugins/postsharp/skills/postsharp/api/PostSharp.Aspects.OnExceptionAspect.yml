- uid: PostSharp.Aspects.OnExceptionAspect.SemanticallyAdvisedMethodKinds
  commentId: P:PostSharp.Aspects.OnExceptionAspect.SemanticallyAdvisedMethodKinds
  id: SemanticallyAdvisedMethodKinds
  parent: PostSharp.Aspects.OnExceptionAspect
  langs:
  - csharp
  - vb
  name: SemanticallyAdvisedMethodKinds
  nameWithType: OnExceptionAspect.SemanticallyAdvisedMethodKinds
  fullName: PostSharp.Aspects.OnExceptionAspect.SemanticallyAdvisedMethodKinds
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Gets or sets which target methods are advised semantically. This affects the behavior of the aspect when it is applied to

    iterator or async methods, which are compiled into state machines.
  remarks: >-
    <p>
        Semantic advising results in an aspect that is consistent with the level of abstraction of the programming language. This is the default behavior.
        You can disable semantic advising using this property to be consistent with the level of abstraction
        of MSIL and for backward compatibility with the versions of PostSharp prior to 3.1.
        </p>
    <p>
        The value is read at build time, so set it in the constructor of the aspect.
        </p>
  example: []
  syntax:
    content: protected SemanticallyAdvisedMethodKinds SemanticallyAdvisedMethodKinds { get; set; }
    parameters: []
    return:
