  name: OnExceptionAspect
  nameWithType: OnExceptionAspect
  fullName: PostSharp.Aspects.OnExceptionAspect
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Aspect that, when applied to a method, defines an exception

    handler around the whole method and calls a custom method in this exception

    handler.
  remarks: >-
    <p>
            The <xref href="PostSharp.Aspects.OnExceptionAspect" data-throw-if-not-resolved="false"></xref> aspect adds an exception handler to the method to which it is applied.
            It allows you to easily encapsulate exception handling policies as a custom attribute.</p>
        <p>The most important method is <xref href="PostSharp.Aspects.OnExceptionAspect.OnException(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>. It is the exception handler in itself.</p>
        <p>The current exception is available from the <xref href="PostSharp.Aspects.MethodExecutionArgs.Exception" data-throw-if-not-resolved="false"></xref> property of the <xref href="PostSharp.Aspects.MethodExecutionArgs" data-throw-if-not-resolved="false"></xref>
            object. To replace the current exception by another one, set this property to the new exception and set the
            <xref href="PostSharp.Aspects.MethodExecutionArgs.FlowBehavior" data-throw-if-not-resolved="false"></xref> property to <xref href="PostSharp.Aspects.FlowBehavior.ThrowException" data-throw-if-not-resolved="false"></xref>, or throw a new exception
            from the handler. If you need to ignore the exception, set the <xref href="PostSharp.Aspects.MethodExecutionArgs.FlowBehavior" data-throw-if-not-resolved="false"></xref> property to
            <xref href="PostSharp.Aspects.FlowBehavior.Continue" data-throw-if-not-resolved="false"></xref>.</p>
        <p>By default, the aspect handles exceptions of any type. To handle only one type of exception, override <xref href="PostSharp.Aspects.OnExceptionAspect.GetExceptionType(System.Reflection.MethodBase)" data-throw-if-not-resolved="false"></xref>.</p>
        <p>If you also need to execute logic before the method or when it succeeds, use <xref href="PostSharp.Aspects.OnMethodBoundaryAspect" data-throw-if-not-resolved="false"></xref>, whose
            <xref href="PostSharp.Aspects.OnMethodBoundaryAspect.OnException(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref> advice handles exceptions in the same way.</p>
        <p>
      An object of type
      <xref href="PostSharp.Aspects.MethodExecutionArgs" data-throw-if-not-resolved="false"></xref>
      is passed to every advice of this aspect. This object allows you to:
    </p>
        <ul><li>
            <b>Get or set arguments.</b>
        Input and output arguments are available on the property
        <xref href="PostSharp.Aspects.MethodExecutionArgs.Arguments" data-throw-if-not-resolved="false"></xref>. You can change output (<code>out</code>)
        and by-reference (<code>ref</code>)
        arguments, but not input arguments. If you need to modify arguments passed by value, consider using a
        <xref href="PostSharp.Aspects.MethodInterceptionAspect" data-throw-if-not-resolved="false"></xref>
        (see property <xref href="PostSharp.Aspects.MethodInterceptionArgs.Arguments" data-throw-if-not-resolved="false"></xref>).
      </li><li>
            <b>
          Get the current exception.
        </b>
        The current exception is available in the property <xref href="PostSharp.Aspects.MethodExecutionArgs.Exception" data-throw-if-not-resolved="false"></xref> (only from the <xref href="PostSharp.Aspects.OnExceptionAspect.OnException(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref> advice). 
        You can also replace the exception (see <xref href="PostSharp.Aspects.MethodExecutionArgs.Exception" data-throw-if-not-resolved="false"></xref> for details).
      </li><li>
            <b>
          Get or set the return value.
        </b> The return value is available in the <xref href="PostSharp.Aspects.MethodExecutionArgs.ReturnValue" data-throw-if-not-resolved="false"></xref> property. You can also modify it.
      </li><li>
            <b>
          Change the method control flow.
        </b>
        You can change the value of the
        <xref href="PostSharp.Aspects.MethodExecutionArgs.FlowBehavior" data-throw-if-not-resolved="false"></xref>
        property to specify
        whether the target method should continue to execute after the execution of the current advice. 
        This may be useful to implement a caching aspect or an exception handler.
      </li><li>
            <b>
          Share state between advices.
        </b>
        You can use the
        <xref href="PostSharp.Aspects.MethodExecutionArgs.MethodExecutionTag" data-throw-if-not-resolved="false"></xref>
        property to store state between the execution of
        different advices related to the same execution of a method. For instance, you can store a cache key in
        <xref href="PostSharp.Aspects.OnMethodBoundaryAspect.OnEntry(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>
        and retrieve it in
        <xref href="PostSharp.Aspects.OnMethodBoundaryAspect.OnSuccess(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>. Using
        <xref href="PostSharp.Aspects.MethodExecutionArgs.MethodExecutionTag" data-throw-if-not-resolved="false"></xref>
        is the only way to share state that is both thread-safe and reentrant.
      </li></ul>
        <br />
        <p>
          <div class="NOTE"><h5>note</h5><p>
        All classes implementing
        <xref href="PostSharp.Aspects.IAspect" data-throw-if-not-resolved="false"></xref>
        should typically be marked as serializable
        using the 
        <xref href="System.SerializableAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.PSerializableAttribute" data-throw-if-not-resolved="false"></xref> custom attribute. Fields that
        are only used at runtime (and unknown at compile-time) should be carefully
        marked with the <xref href="System.NonSerializedAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.PNonSerializedAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.
        When another aspect serializer (such as <xref href="PostSharp.Aspects.Serialization.MsilAspectSerializer" data-throw-if-not-resolved="false"></xref>) is used,
        it is not necessary to mark the aspect class as serializable.
        For more information, see
        <a href="@aspect-serialization">Aspect Serialization</a>.
      </p></div>
        </p>
        <a href="@aspect-serialization">
      Conceptual: Understanding Aspect Serialization
    </a>
  example: []
