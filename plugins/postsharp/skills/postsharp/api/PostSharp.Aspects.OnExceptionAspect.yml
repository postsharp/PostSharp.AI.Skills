- uid: PostSharp.Aspects.OnExceptionAspect.GetExceptionType(System.Reflection.MethodBase)
  commentId: M:PostSharp.Aspects.OnExceptionAspect.GetExceptionType(System.Reflection.MethodBase)
  id: GetExceptionType(System.Reflection.MethodBase)
  parent: PostSharp.Aspects.OnExceptionAspect
  langs:
  - csharp
  - vb
  name: GetExceptionType(MethodBase)
  nameWithType: OnExceptionAspect.GetExceptionType(MethodBase)
  fullName: PostSharp.Aspects.OnExceptionAspect.GetExceptionType(System.Reflection.MethodBase)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Gets the type of exception handled by this aspect.
  remarks: >-
    <p>This method is invoked at build time for each target method. The default implementation returns <code>null</code>,
            which means that the aspect handles exceptions of any type. To handle several types of exceptions, return their common
            base type and test the type of <xref href="PostSharp.Aspects.MethodExecutionArgs.Exception" data-throw-if-not-resolved="false"></xref> in <xref href="PostSharp.Aspects.OnExceptionAspect.OnException(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public virtual Type GetExceptionType(MethodBase targetMethod)
    parameters:
    - id: targetMethod
      type: System.Reflection.MethodBase
      description: Method to which the current aspect is applied.
    return:
      type: System.Type
      description: >-
        The type (derived from <xref href="System.Exception" data-throw-if-not-resolved="false"></xref>) of exceptions handled
                      by this aspect.
    content.vb: Public Overridable Function GetExceptionType(targetMethod As MethodBase) As Type
  overload: PostSharp.Aspects.OnExceptionAspect.GetExceptionType*
