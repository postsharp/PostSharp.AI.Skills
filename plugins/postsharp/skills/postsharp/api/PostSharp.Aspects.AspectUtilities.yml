- uid: PostSharp.Aspects.AspectUtilities.InitializeCurrentAspects
  commentId: M:PostSharp.Aspects.AspectUtilities.InitializeCurrentAspects
  id: InitializeCurrentAspects
  parent: PostSharp.Aspects.AspectUtilities
  langs:
  - csharp
  - vb
  name: InitializeCurrentAspects()
  nameWithType: AspectUtilities.InitializeCurrentAspects()
  fullName: PostSharp.Aspects.AspectUtilities.InitializeCurrentAspects()
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Initializes all the aspects of the calling instance. This method must be

    invoked from an instance method (not a static method) of a type that has been enhanced

    by an aspect.
  remarks: >-
    <p>
            Calls to this method are transformed, at build time, to calls to
            <code>this.InitializeAspects</code>, a method that is typically generated by <code>PostSharp</code>. 
            This is why the current method has no implementation.
          </p>
    <p>
            The constructors of enhanced classes always initialize aspects. The only scenario
            where this method needs to be invoked manually is when instances are not created
            using a constructor, for example when they are created with the method <xref href="System.Runtime.Serialization.FormatterServices.GetUninitializedObject(System.Type)" data-throw-if-not-resolved="false"></xref>.
          </p>
    <p>
            The call is resolved at build time against the class that declares the calling method. If neither this class nor its base classes
            have an aspect that requires initialization, the call is removed and has no effect, even if aspects are applied to derived classes. In this
            case, define an <code>InitializeAspects</code> method in the class instead. Calling this method from a static method
            is a build error.
          </p>
  example: []
  syntax:
    content: public static void InitializeCurrentAspects()
    content.vb: Public Shared Sub InitializeCurrentAspects()
  overload: PostSharp.Aspects.AspectUtilities.InitializeCurrentAspects*
  seealso:
  - linkType: HRef
    linkId: '@instance-initialization'
    altText: 'Conceptual: Coping with Custom Object Serializers'
