  fullName: PostSharp.Aspects.Advices.ArgumentAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Binds a parameter of an advice method to an argument of the target method, selected by its index, by its name, or by its type.
  remarks: >-
    <p>
        The constructor selects the argument:
        </p>
    <ul><li>
          <xref href="PostSharp.Aspects.Advices.ArgumentAttribute.%23ctor(System.Int32)" data-throw-if-not-resolved="false"></xref> selects the argument at a given index.</li><li>
          <xref href="PostSharp.Aspects.Advices.ArgumentAttribute.%23ctor(System.String)" data-throw-if-not-resolved="false"></xref> selects the argument of a given name.</li><li>
          <xref href="PostSharp.Aspects.Advices.ArgumentAttribute.%23ctor" data-throw-if-not-resolved="false"></xref> selects the argument whose type can be assigned to the type of the advice parameter
        without conversion, except boxing. When several arguments match, <xref href="PostSharp.Aspects.Advices.ArgumentAttribute.AmbiguityResolution" data-throw-if-not-resolved="false"></xref> selects one of them or reports an error.</li></ul>
    <p>
        A parameter without modifier receives the value of the argument. Its type must be the type of the argument, a type to which the
        argument can be assigned without conversion, except boxing (for instance <xref href="System.Object" data-throw-if-not-resolved="false"></xref>), or a type parameter of the advice method.
        An argument of a value type is boxed when the parameter is of a reference type.
        </p>
    <p>
        A <code>ref</code>, <code>out</code> or <code>in</code> parameter receives the address of the argument, and its type must be the type of the argument.
        Boxing is not supported for such a parameter: when the argument is of a value type and the parameter of a reference type, the compiler
        reports an error. The changes made through a <code>ref</code> or <code>out</code> parameter are seen by the target method and by the next advices.
        A <code>ref</code> or <code>out</code> parameter cannot be bound to an <code>in</code> argument; use an <code>in</code> parameter.
        </p>
    <p>
        This attribute can be used in the method boundary advices and in <xref href="PostSharp.Aspects.Advices.OnMethodInvokeAdvice" data-throw-if-not-resolved="false"></xref>. It cannot be used in the location
        interception advices, nor in <xref href="PostSharp.Aspects.Advices.OnInstanceConstructedAdvice" data-throw-if-not-resolved="false"></xref>, which runs once the object is constructed, whichever constructor ran.
        When no argument matches, the compiler reports an error, unless the pointcut skips the targets whose
        signature does not match, as <xref href="PostSharp.Aspects.Advices.MatchPointcut" data-throw-if-not-resolved="false"></xref> does.
        </p>
