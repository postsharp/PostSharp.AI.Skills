  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Binds a parameter of an advice method to the name of the target declaration.
  remarks: >-
    The parameter must be of type <xref href="System.String" data-throw-if-not-resolved="false"></xref>, and it cannot be <code>ref</code>, <code>in</code> or <code>out</code>. The value is a constant, so binding it does

    not allocate memory. For an async method or an iterator, the name is the name of the declared method, not the name of the method of

    the state machine.
  example: []
  syntax:
    content: 'public sealed class DeclarationNameAttribute : AdviceParameterAttribute'
    content.vb: Public NotInheritable Class DeclarationNameAttribute Inherits AdviceParameterAttribute
