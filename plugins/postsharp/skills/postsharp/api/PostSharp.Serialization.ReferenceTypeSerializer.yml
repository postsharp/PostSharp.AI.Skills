  fullName: PostSharp.Serialization.ReferenceTypeSerializer.Convert(object, System.Type)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Serialization
  summary: Converts a value into a given target type.
  remarks: >-
    <p>This method allows for additional flexibility if the serialization-time type is
                    not equal to the deserialization-time type. The current method is invoked
        at deserialization time to perform the conversion.</p>
  example: []
  syntax:
    content: public virtual object Convert(object value, Type targetType)
    parameters:
    - id: value
      type: System.Object
      description: The value to be converted.
    - id: targetType
      type: System.Type
      description: The target type.
    return:
      type: System.Object
      description: The <code class="paramref">value</code> converted to <code class="paramref">targetType</code>.
    content.vb: Public Overridable Function Convert(value As Object, targetType As Type) As Object
