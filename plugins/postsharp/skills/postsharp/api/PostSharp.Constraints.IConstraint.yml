  name: ValidateConstraint(object)
  nameWithType: IConstraint.ValidateConstraint(object)
  fullName: PostSharp.Constraints.IConstraint.ValidateConstraint(object)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Constraints
  summary: >-
    Validates that the constraint has been applied to a valid element of code. When this

    method returns <code>false</code>, the constraint is silently ignored.
  example: []
  syntax:
    content: bool ValidateConstraint(object target)
    parameters:
    - id: target
      type: System.Object
      description: The element of code to which the constraint is applied.
    return:
      type: System.Boolean
      description: <code>true</code> if the constraint has been applied to a valid element of code, otherwise <code>false</code>.
    content.vb: Function ValidateConstraint(target As Object) As Boolean
