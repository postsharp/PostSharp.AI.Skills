  summary: >-
    A constraint is a piece of validation logic executed at build time. Constraints

    are applied to elements of code (<xref href="System.Reflection.Assembly" data-throw-if-not-resolved="false"></xref>, <xref href="System.Type" data-throw-if-not-resolved="false"></xref>,

    <xref href="System.Reflection.MethodInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.ConstructorInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref>,

    <xref href="System.Reflection.EventInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.FieldInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.ParameterInfo" data-throw-if-not-resolved="false"></xref>),

    typically (but not necessarily) using custom attributes or <xref href="PostSharp.Extensibility.MulticastAttribute" data-throw-if-not-resolved="false"></xref>.
  remarks: ''
  example: []
  syntax:
    content: >-
      [RequirePostSharp(null, "ArchitectureConstraint")]

      public interface IConstraint
    content.vb: >-
      <RequirePostSharp(Nothing, "ArchitectureConstraint")>

      Public Interface IConstraint
