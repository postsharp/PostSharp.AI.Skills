  name: LocationInterceptionAspect
  nameWithType: LocationInterceptionAspect
  fullName: PostSharp.Aspects.LocationInterceptionAspect
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Aspect that, when applied on a location (field or property), intercepts invocations of

    the <code>Get</code> (<xref href="PostSharp.Aspects.LocationInterceptionAspect.OnGetValue(PostSharp.Aspects.LocationInterceptionArgs)" data-throw-if-not-resolved="false"></xref>) and <code>Set</code> (<xref href="PostSharp.Aspects.LocationInterceptionAspect.OnSetValue(PostSharp.Aspects.LocationInterceptionArgs)" data-throw-if-not-resolved="false"></xref>) semantics.
  remarks: >-
    <p>
            This aspect can be applied to fields and properties, which are called <i>locations</i>
            because both have the semantics of a slot where a value can be stored and retrieved.
            </p>
        <h5>Applying the Aspect on Properties</h5>
        <p>Applying an aspect of type <xref href="PostSharp.Aspects.LocationInterceptionAspect" data-throw-if-not-resolved="false"></xref> to a property results in the accessors of this property being replaced by a call to the method <xref href="PostSharp.Aspects.LocationInterceptionAspect.OnGetValue(PostSharp.Aspects.LocationInterceptionArgs)" data-throw-if-not-resolved="false"></xref> 
            or <xref href="PostSharp.Aspects.LocationInterceptionAspect.OnSetValue(PostSharp.Aspects.LocationInterceptionArgs)" data-throw-if-not-resolved="false"></xref> of the current class. The original body of the accessor is moved into a new method, 
            which can be called by the aspect by invoking one of the methods 
            <xref href="PostSharp.Aspects.LocationInterceptionArgs.ProceedGetValue" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.LocationInterceptionArgs.ProceedSetValue" data-throw-if-not-resolved="false"></xref>,
            <xref href="PostSharp.Aspects.LocationInterceptionArgs.GetCurrentValue" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Aspects.LocationInterceptionArgs.SetNewValue(System.Object)" data-throw-if-not-resolved="false"></xref>,
            or by using the <xref href="PostSharp.Aspects.LocationInterceptionArgs.Binding" data-throw-if-not-resolved="false"></xref> object.</p>
        <h5>Applying the Aspect on Fields</h5>
        <p>Applying this aspect on a field transforms the field into a property of the same name,
            scope and visibility as the original field. The original field is removed. Aspect code can get or set the
            value of the field by calling the methods <xref href="PostSharp.Aspects.LocationInterceptionArgs.ProceedGetValue" data-throw-if-not-resolved="false"></xref>, 
            <xref href="PostSharp.Aspects.LocationInterceptionArgs.ProceedSetValue" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.LocationInterceptionArgs.GetCurrentValue" data-throw-if-not-resolved="false"></xref>
            or <xref href="PostSharp.Aspects.LocationInterceptionArgs.SetNewValue(System.Object)" data-throw-if-not-resolved="false"></xref>, or by using the <xref href="PostSharp.Aspects.LocationInterceptionArgs.Binding" data-throw-if-not-resolved="false"></xref> object.</p>
        <p>
          <div class="NOTE"><h5>note</h5><p>
            Remember to use
            <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref> instead of <xref href="System.Reflection.FieldInfo" data-throw-if-not-resolved="false"></xref> at runtime to reflect the original field.
            For this reason, you cannot store a <xref href="System.Reflection.FieldInfo" data-throw-if-not-resolved="false"></xref> in the aspect. 
            Store a <xref href="PostSharp.Reflection.LocationInfo" data-throw-if-not-resolved="false"></xref>
            instead. Even if a <xref href="PostSharp.Reflection.LocationInfo" data-throw-if-not-resolved="false"></xref> represents a field at build time, it represents
            the corresponding <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref> at runtime.</p></div>
        </p>
        <p>
          <div class="NOTE"><h5>note</h5><p>
            When you apply an aspect derived from <xref href="PostSharp.Aspects.LocationInterceptionAspect" data-throw-if-not-resolved="false"></xref> to a value-type field, 
            you should not pass the value of this field by reference, that is, as an argument to <code>out</code> and <code>ref</code> parameters in C#.
            This is because PostSharp is unable to detect read and write accesses through references.
            </p></div>
        </p>
        <h5>Initialization of Instance Fields and Properties</h5>
        <p>The inline initialization of instance fields and auto-implemented properties does not invoke <xref href="PostSharp.Aspects.LocationInterceptionAspect.OnSetValue(PostSharp.Aspects.LocationInterceptionArgs)" data-throw-if-not-resolved="false"></xref>.
            To react to the initial value of such a location, override <xref href="PostSharp.Aspects.LocationInterceptionAspect.OnInstanceLocationInitialized(PostSharp.Aspects.LocationInitializationArgs)" data-throw-if-not-resolved="false"></xref>.</p>
        <p>
          <div class="NOTE"><h5>note</h5><p>
        All classes implementing
        <xref href="PostSharp.Aspects.IAspect" data-throw-if-not-resolved="false"></xref>
        should typically be marked as serializable
        using the 
        <xref href="System.SerializableAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.PSerializableAttribute" data-throw-if-not-resolved="false"></xref> custom attribute. Fields that
        are only used at runtime (and unknown at compile-time) should be carefully
        marked with the <xref href="System.NonSerializedAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.PNonSerializedAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.
        When another aspect serializer (such as <xref href="PostSharp.Aspects.Serialization.MsilAspectSerializer" data-throw-if-not-resolved="false"></xref>) is used,
        it is not necessary to mark the aspect class as serializable.
        For more information, see
        <a href="@aspect-serialization">Aspect Serialization</a>.
      </p></div>
        </p>
        <a href="@aspect-serialization">
      Conceptual: Understanding Aspect Serialization
    </a>
  example: []
