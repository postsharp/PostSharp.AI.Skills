  namespace: PostSharp.Aspects.Dependencies
  summary: Specifies an aspect dependency that matches aspects or advices that are part of a given role.
  remarks: >-
    <p>
            A role describes what the aspect does. A list of standard roles is available in the
            <xref href="PostSharp.Aspects.Dependencies.StandardRoles" data-throw-if-not-resolved="false"></xref> class. Aspect vendors are encouraged to enroll their aspects in one of these
            roles whenever it makes sense, and to document the other roles that they use.
          </p>
    <p>An aspect or advice can be enrolled in a role by using the <xref href="PostSharp.Aspects.Dependencies.ProvideAspectRoleAttribute" data-throw-if-not-resolved="false"></xref>
            custom attribute.
          </p>
