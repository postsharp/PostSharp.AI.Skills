  namespace: PostSharp.Aspects
  summary: >-
    Represents the awaitable result of the asynchronous method invocation.

    Await this value to get the <code>System.Object</code> instance containing the return value of the async method.

    The result of the await is <code>null</code> for async methods that do not return any value.
