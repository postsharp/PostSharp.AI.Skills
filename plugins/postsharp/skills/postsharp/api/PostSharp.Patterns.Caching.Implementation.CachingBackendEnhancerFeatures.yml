  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching.Implementation
  summary: >-
    Gets a value indicating whether methods that modify the cache content run to completion before control returns to the calling method.

    If <code>false</code>, methods may run in the background, and the calling thread may not have a consistent view of the cache.
