    content: 'public sealed class MicrosoftLoggingCollectingLoggerProvider : ILoggerProvider, IDisposable'
    content.vb: Public NotInheritable Class MicrosoftLoggingCollectingLoggerProvider Implements ILoggerProvider, IDisposable
