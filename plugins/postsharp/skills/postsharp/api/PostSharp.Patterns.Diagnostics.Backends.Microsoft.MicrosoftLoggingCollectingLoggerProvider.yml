  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics.Backends.Microsoft
  namespace: PostSharp.Patterns.Diagnostics.Backends.Microsoft
  summary: An <xref href="Microsoft.Extensions.Logging.ILoggerProvider" data-throw-if-not-resolved="false"></xref> that creates loggers that send logging to PostSharp backends as manual log events.
  remarks: >-
    <p>Register this provider with the <xref href="PostSharp.Patterns.Diagnostics.Backends.Microsoft.MicrosoftLoggingBuilderExtensions.AddPostSharp(Microsoft.Extensions.Logging.ILoggingBuilder)" data-throw-if-not-resolved="false"></xref> extension method, after you have

    removed the output providers from the logging builder. Pass those output providers to a <xref href="PostSharp.Patterns.Diagnostics.Backends.Microsoft.MicrosoftLoggingBackend" data-throw-if-not-resolved="false"></xref> through

    a separate <xref href="Microsoft.Extensions.Logging.ILoggerFactory" data-throw-if-not-resolved="false"></xref>, and set that backend as <xref href="PostSharp.Patterns.Diagnostics.LoggingServices.DefaultBackend" data-throw-if-not-resolved="false"></xref>. Manual and automatic

    log records then go through the same backend and share the same indentation.</p>
  example: []
