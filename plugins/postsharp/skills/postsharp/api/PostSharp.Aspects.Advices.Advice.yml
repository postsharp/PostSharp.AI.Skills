- uid: PostSharp.Aspects.Advices.Advice.Description
  commentId: P:PostSharp.Aspects.Advices.Advice.Description
  id: Description
  parent: PostSharp.Aspects.Advices.Advice
  langs:
  - csharp
  - vb
  name: Description
  nameWithType: Advice.Description
  fullName: PostSharp.Aspects.Advices.Advice.Description
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Gets or sets a human-readable description of the current advice.
  remarks: >-
    <p>Set this property only on the master advice of the advice group (see <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Master" data-throw-if-not-resolved="false"></xref>).</p>

    <p>PostSharp Tools for Visual Studio show this description in CodeLens and in the IntelliSense tooltip
        of the declarations to which the advice applies. For an aspect that does not use advice custom attributes,
        use <xref href="PostSharp.Aspects.AspectDescriptionAttribute" data-throw-if-not-resolved="false"></xref> instead.</p>
  example: []
  syntax:
    content: public string Description { get; set; }
    parameters: []
    return:
      type: System.String
    content.vb: Public Property Description As String
  overload: PostSharp.Aspects.Advices.Advice.Description*
  seealso:
  - linkType: HRef
    linkId: '@customizing-aspect-description'
    altText: 'Conceptual: Customizing Aspect Description in CodeLens And Tooltips'
- uid: PostSharp.Aspects.Advices.Advice.LinesOfCodeAvoided
  commentId: P:PostSharp.Aspects.Advices.Advice.LinesOfCodeAvoided
  id: LinesOfCodeAvoided
  parent: PostSharp.Aspects.Advices.Advice
  langs:
  - csharp
  - vb
  name: LinesOfCodeAvoided
  nameWithType: Advice.LinesOfCodeAvoided
  fullName: PostSharp.Aspects.Advices.Advice.LinesOfCodeAvoided
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Gets or sets the reduction in the number of lines of code achieved by applying the advice instance to one code element.
  remarks: >-
    <p>PostSharp uses this value to estimate the number of lines of handwritten code avoided by aspects. When the property is not set,
        PostSharp uses a default estimate that depends on the kind of advice. To give an estimate for a whole aspect instead of
        a single advice, use <xref href="PostSharp.Aspects.LinesOfCodeAvoidedAttribute" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public int LinesOfCodeAvoided { get; set; }
    parameters: []
    return:
      type: System.Int32
    content.vb: Public Property LinesOfCodeAvoided As Integer
  overload: PostSharp.Aspects.Advices.Advice.LinesOfCodeAvoided*
  seealso:
  - linkId: PostSharp.Aspects.LinesOfCodeAvoidedAttribute
    commentId: T:PostSharp.Aspects.LinesOfCodeAvoidedAttribute
  - linkType: HRef
    linkId: '@estimating-code-saving'
    altText: 'Conceptual: Estimating Code Savings'
