  namespace: PostSharp.Aspects.Advices
  summary: Base class for all custom attributes representing an advice.
  remarks: >-
    <p>Advices are behaviors added to aspects by means of custom
            attributes. Other ways to add behaviors are to implement interface methods.
          </p>
    <p>
            Advice custom attributes are typically used on aspect classes,
            or on members of aspect classes.
          </p>
