  name: ThreadAffineAttribute
  nameWithType: ThreadAffineAttribute
  fullName: PostSharp.Patterns.Threading.ThreadAffineAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Custom attribute that, when applied to a type, ensures that instances of this type can only be accessed by the thread

    that created the instance. When a different thread accesses instances of this type, a <xref href="PostSharp.Patterns.Threading.ThreadMismatchException" data-throw-if-not-resolved="false"></xref> is thrown.
  remarks: >-
    <p>Unlike the lock-based threading models, this model allows public and internal fields. Thread affinity is verified at run time only,
        and only when run-time verification is enabled (see <xref href="PostSharp.Patterns.Threading.ThreadAwareAttribute.RuntimeVerificationEnabled" data-throw-if-not-resolved="false"></xref>, which is disabled by default in release builds).</p>
  example: []
  syntax:
    content: >-
      [Metric("UsedFeatures", "PostSharp.Patterns.Threading.ThreadAffine")]

      [Serializer(typeof(ThreadAffineAttribute.Serializer))]

      public sealed class ThreadAffineAttribute : ThreadAwareAttribute, ITypeLevelAspect, ITypeLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, ICloneAwareAspect, IInstanceScopedAspect, IAspectProvider, IService, IAdviceProvider, IAspect, IThreadAware, IQueryInterface
