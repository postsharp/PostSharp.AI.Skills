  summary: Exception thrown when the calling thread does not have access to the object.
  remarks: >-
    <p>This exception is raised when the calling thread accesses the object without going through a public method.</p>

    <p>For the <xref href="PostSharp.Patterns.Threading.Models.ReaderWriterSynchronizedThreadingModel" data-throw-if-not-resolved="false"></xref>, the exception may mean that a public method was not annotated
        with an access custom attribute (<xref href="PostSharp.Patterns.Threading.ReaderAttribute" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Patterns.Threading.WriterAttribute" data-throw-if-not-resolved="false"></xref> and others).</p>
    <p>The exception is thrown by the <xref href="PostSharp.Patterns.Threading.SynchronizedAttribute" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Patterns.Threading.ReaderWriterSynchronizedAttribute" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Threading.ThreadUnsafeAttribute" data-throw-if-not-resolved="false"></xref>
        threading models when run-time verification is enabled. A typical cause is a private method invoked as a callback, for instance an event handler;
        add the <xref href="PostSharp.Patterns.Threading.EntryPointAttribute" data-throw-if-not-resolved="false"></xref> custom attribute to such methods.</p>
