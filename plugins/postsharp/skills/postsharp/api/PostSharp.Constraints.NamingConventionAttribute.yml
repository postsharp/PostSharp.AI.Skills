  namespace: PostSharp.Constraints
  summary: >-
    Custom attribute that, when applied to a target class or an interface, validates that classes and interfaces derived from this target class or interface

    respect a given naming convention, that is, that their names match a given pattern.
  example: []
  syntax:
    content: >-
      [MulticastAttributeUsage(MulticastTargets.Class|MulticastTargets.Interface, Inheritance = MulticastInheritance.Strict)]

      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Class|AttributeTargets.Interface)]

      public sealed class NamingConventionAttribute : ScalarConstraint, IScalarConstraint, IConstraint
    content.vb: >-
      <MulticastAttributeUsage(MulticastTargets.ClassOrMulticastTargets.Interface, Inheritance:=MulticastInheritance.Strict)>

      <AttributeUsage(AttributeTargets.AssemblyOrAttributeTargets.ClassOrAttributeTargets.Interface)>

      Public NotInheritable Class NamingConventionAttribute Inherits ScalarConstraint Implements IScalarConstraint, IConstraint
