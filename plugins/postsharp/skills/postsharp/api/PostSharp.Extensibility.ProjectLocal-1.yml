  name: ProjectLocal(string, Func<T>)
  nameWithType: ProjectLocal<T>.ProjectLocal(string, Func<T>)
  fullName: PostSharp.Extensibility.ProjectLocal<T>.ProjectLocal(string, System.Func<T>)
  type: Constructor
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: Initializes a new instance of the <xref href="PostSharp.Extensibility.ProjectLocal%601" data-throw-if-not-resolved="false"></xref> class, whose storage is identified by a name.
  remarks: >-
    <p>
        Use this constructor in an assembly that PostSharp may load more than once in a process, such as a library of aspects
        that each compilation loads into its own load context. Every copy of the assembly then shares one place in the
        storage of a project, instead of adding one more for each copy. A project sees one copy of the assembly only, so
        the copies never share a value.
        </p>
    <p>
        Two <xref href="PostSharp.Extensibility.ProjectLocal%601" data-throw-if-not-resolved="false"></xref> created with the same name share their value in a project, whatever their
        <code class="typeparamref">T</code>, which corrupts both.
        </p>
  example: []
  syntax:
    content: public ProjectLocal(string slotName, Func<T> initialValueFactory = null)
    parameters:
    - id: slotName
      type: System.String
      description: >-
        A name that identifies this value in every copy of the assembly that declares it. The caller
                    is responsible for its uniqueness in the process: include the full name of the declaring type and the name of the
                    field, for instance <code>MyCompany.MyAspects.MyAspect.processedMethods</code>.
    - id: initialValueFactory
      type: System.Func{{T}}
      description: >-
        A function that creates the initial value of each project, or <code>null</code> to
                    start each project with the default value of <code class="typeparamref">T</code>.
    content.vb: Public Sub New(slotName As String, initialValueFactory As Func(Of T) = Nothing)
  overload: PostSharp.Extensibility.ProjectLocal`1.#ctor*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: <code class="paramref">slotName</code> is <code>null</code> or empty.
