  name: ProjectLocal<T>
  nameWithType: ProjectLocal<T>
  fullName: PostSharp.Extensibility.ProjectLocal<T>
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    Stores a value that belongs to the project that PostSharp is currently processing. Use it instead of a static field

    to hold build-time state, for instance in an aspect or in a build-time service.
  remarks: >-
    <p>
         Store the <xref href="PostSharp.Extensibility.ProjectLocal%601" data-throw-if-not-resolved="false"></xref> itself in a static field. Each project then has its own value, even when
         PostSharp processes several projects in the same process at the same time. A static field would share its value
         between these projects.
         </p>
    <p>
         Each project starts with the value that the initial value factory returns, or with the default value of
         <code class="typeparamref">T</code>. The factory runs at most once per project, even when several threads of the project read
         the value for the first time at the same time.
         </p>
    <p>
         A value exists only while PostSharp processes a project. At run time, and at build time outside of the processing
         of a project, <xref href="PostSharp.Extensibility.ProjectLocal%601.Value" data-throw-if-not-resolved="false"></xref> throws an <xref href="System.InvalidOperationException" data-throw-if-not-resolved="false"></xref>. Use <xref href="PostSharp.Extensibility.ProjectLocal%601.TryGetValue(%600%40)" data-throw-if-not-resolved="false"></xref>
         in code that also runs at run time.
         </p>
    <p>
         The value of the current project flows to the tasks and threads that the processing of the project starts.
         </p>
  example:
  - >-
    <pre><code class="lang-csharp">private static readonly ProjectLocal&lt;HashSet&lt;MethodInfo&gt;&gt; processedMethods =
        new ProjectLocal&lt;HashSet&lt;MethodInfo&gt;&gt;( () =&gt; new HashSet&lt;MethodInfo&gt;() );

    // At build time:

    processedMethods.Value.Add( method );</code></pre>
