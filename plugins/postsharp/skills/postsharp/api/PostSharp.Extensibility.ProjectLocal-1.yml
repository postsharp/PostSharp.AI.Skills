- uid: PostSharp.Extensibility.ProjectLocal`1.#ctor(System.String,System.Func{`0})
  commentId: M:PostSharp.Extensibility.ProjectLocal`1.#ctor(System.String,System.Func{`0})
  id: '#ctor(System.String,System.Func{`0})'
  parent: PostSharp.Extensibility.ProjectLocal`1
  langs:
  - csharp
