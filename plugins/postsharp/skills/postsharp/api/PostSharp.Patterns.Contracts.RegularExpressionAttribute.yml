  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Contracts
  summary: >-
    Custom attribute that, when added to a field, property or parameter, throws

    an <xref href="System.ArgumentException" data-throw-if-not-resolved="false"></xref> if the target is assigned a value that

    does not match a given regular expression. Null strings are accepted and do not

    throw an exception.
  remarks: >-
    <p>The error message is identified by <xref href="PostSharp.Patterns.Contracts.ContractLocalizedTextProvider.RegularExpressionErrorMessage" data-throw-if-not-resolved="false"></xref>.</p>

    <p>The error message can use the additional argument <code>{4}</code> to refer to the regular expression used.</p>
