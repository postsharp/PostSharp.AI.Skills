  nameWithType: ModuleInitializerAttribute
  fullName: PostSharp.Aspects.ModuleInitializerAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Custom attribute that, when added to a static method, causes the method to be executed immediately

    after the assembly is loaded by the CLR. The target method must be static, public or internal, parameterless, void, and non-generic.
  remarks: >-
    <p>PostSharp emits an error at build time when the target method does not meet the requirements above. A project can contain several module initializers; they are executed
        in the order given by <xref href="PostSharp.Aspects.ModuleInitializerAttribute.Order" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method)]

      [RequirePostSharp(null, "ModuleInitializer")]

      public sealed class ModuleInitializerAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Method)>

      <RequirePostSharp(Nothing, "ModuleInitializer")>

      Public NotInheritable Class ModuleInitializerAttribute Inherits Attribute
