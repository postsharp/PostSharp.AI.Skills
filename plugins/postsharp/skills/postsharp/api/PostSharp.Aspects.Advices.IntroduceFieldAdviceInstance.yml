  name: IntroduceFieldAdviceInstance
  nameWithType: IntroduceFieldAdviceInstance
  fullName: PostSharp.Aspects.Advices.IntroduceFieldAdviceInstance
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Represents a request for a field to exist in or to be introduced into the target type of the aspect. The field is introduced into the

    target type, or the introduction is skipped when the target type already has a compatible field, as specified by

    <xref href="PostSharp.Aspects.Advices.IntroduceFieldAdviceInstance.WhenCompatibleFieldExists" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.Advices.IntroduceFieldAdviceInstance.WhenIncompatibleMemberExists" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>An aspect returns an <xref href="PostSharp.Aspects.Advices.IntroduceFieldAdviceInstance" data-throw-if-not-resolved="false"></xref> from <xref href="PostSharp.Aspects.Advices.IAdviceProvider.ProvideAdvices(System.Object)" data-throw-if-not-resolved="false"></xref>, so that the type, the
            name and the number of the fields can depend on the target. The target type is the type to which the aspect is applied, or the declaring
            type of the member to which it is applied. Any aspect can request fields, including a statically scoped aspect, which then keeps
            per-object state in the target object.</p>
    <p>The advices of the aspect instance that made the request receive the field through an advice parameter annotated with
            <xref href="PostSharp.Aspects.Advices.ImportMemberAttribute" data-throw-if-not-resolved="false"></xref>. With a <xref href="PostSharp.Aspects.Advices.IntroduceFieldAdviceInstance.Name" data-throw-if-not-resolved="false"></xref>, the parameter imports the field by this name, whatever the real name of
            the field, and the requested name wins over a member of the target type that has the same name. Without a name, the parameter imports
            the field by its type, and the fields requested by the aspect instance win over the other members of the target type. The requested
            name is visible only to the aspect instance that made the request.</p>
    <p>The request does not initialize the field: a new field has the default value of its type when the object is created.</p>

    <p>When several aspects request a field that can resolve to the same field, they must be ordered by aspect dependencies, because the
            result depends on the order: the request declares the effect <xref href="PostSharp.Aspects.Dependencies.StandardEffects.MemberIntroduction" data-throw-if-not-resolved="false"></xref>, and the
            effect returned by <xref href="PostSharp.Aspects.Dependencies.StandardEffects.GetMemberIntroductionEffect(System.String)" data-throw-if-not-resolved="false"></xref> for its name, or for its type when it has no
            name. Equivalent requests that use an existing field, such as the requests of one aspect applied to several members, share the field
            whatever their order and need no dependency.</p>
  example: []
  syntax:
    content: 'public sealed class IntroduceFieldAdviceInstance : AdviceInstance'
    content.vb: Public NotInheritable Class IntroduceFieldAdviceInstance Inherits AdviceInstance
