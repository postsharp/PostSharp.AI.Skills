- uid: PostSharp.Aspects.Advices.IntroduceFieldAdviceInstance.Name
  commentId: P:PostSharp.Aspects.Advices.IntroduceFieldAdviceInstance.Name
  id: Name
  parent: PostSharp.Aspects.Advices.IntroduceFieldAdviceInstance
  langs:
  - csharp
  - vb
  name: Name
  nameWithType: IntroduceFieldAdviceInstance.Name
  fullName: PostSharp.Aspects.Advices.IntroduceFieldAdviceInstance.Name
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Gets or sets the requested name of the field, or <code>null</code>.
  remarks: >-
    <p>The requested name serves two purposes. It finds an existing field of this name, as specified by
            <xref href="PostSharp.Aspects.Advices.IntroduceFieldAdviceInstance.WhenCompatibleFieldExists" data-throw-if-not-resolved="false"></xref>. It is also the name of the field that the request introduces, or, when another member already
            has this name, the stem of that name: <xref href="PostSharp.Aspects.Advices.IntroduceFieldCompatibleAction.IntroduceAnother" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.Advices.IntroduceFieldIncompatibleAction.IntroduceAnother" data-throw-if-not-resolved="false"></xref>
            then append a number that makes the name unique in the type, such as <code>handlers2</code>.</p>
    <p>Without a requested name, an existing field is recognized by its type, and a new field gets a generated name that cannot conflict
            with source code.</p>
    <p>The advices of the aspect import the field by the requested name, whatever its real name. A name with a suffix depends on the
            order of the aspects, so a field that other code must find by name does not use <xref href="PostSharp.Aspects.Advices.IntroduceFieldCompatibleAction.IntroduceAnother" data-throw-if-not-resolved="false"></xref> or
            <xref href="PostSharp.Aspects.Advices.IntroduceFieldIncompatibleAction.IntroduceAnother" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public string Name { get; set; }
    parameters: []
    return:
      type: System.String
    content.vb: Public Property Name As String
  overload: PostSharp.Aspects.Advices.IntroduceFieldAdviceInstance.Name*
