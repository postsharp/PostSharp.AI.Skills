  name: SynchronizedAttribute
  nameWithType: SynchronizedAttribute
  fullName: PostSharp.Patterns.Threading.SynchronizedAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Custom attribute that, when applied to a class, applies the <xref href="PostSharp.Patterns.Threading.Models.SynchronizedThreadingModel" data-throw-if-not-resolved="false"></xref> to this class.

    In a synchronized object, only a single thread can access the object at a time. If a second thread needs to access the object

    while it is in use by a first thread, the second thread has to wait until the first thread completes its access.
  remarks: >-
    <p>The model is similar to enclosing each public and internal method in a <code>lock</code> statement, with the following differences: the lock is
        not taken on the object itself, it cannot be forgotten, and it extends to the child objects of the object.</p>
    <p>A build-time error is emitted when the class has public or internal fields, or when an <code>async</code> method is not annotated
        with the <xref href="PostSharp.Patterns.Threading.ReentrantAttribute" data-throw-if-not-resolved="false"></xref> custom attribute. When run-time verification is enabled, accessing a field from a thread that
        does not hold the lock results in a <xref href="PostSharp.Patterns.Threading.ThreadAccessException" data-throw-if-not-resolved="false"></xref>. This typically happens in a private callback method, such as
        an event handler; add the <xref href="PostSharp.Patterns.Threading.EntryPointAttribute" data-throw-if-not-resolved="false"></xref> custom attribute to such methods.</p>
  example: []
  syntax:
    content: >-
      [Metric("UsedFeatures", "PostSharp.Patterns.Threading.Synchronized")]

      [Serializer(typeof(SynchronizedAttribute.Serializer))]

