  name: Depends
  nameWithType: Depends
  fullName: PostSharp.Patterns.Model.Depends
  type: Class
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Model
  summary: >-
    Provides a way to specify dependencies of a method on properties or chains of properties. This class

    should be used from getters of properties marked with the <xref href="PostSharp.Patterns.Model.SafeForDependencyAnalysisAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.
  remarks: >-
    <p>Members of this class are considered metadata-only. They are used only at build time, when
        their arguments are decompiled. They have no run-time effect. For performance reasons, it is preferable to
        skip their execution at run time. You can do this by using the <xref href="PostSharp.Patterns.Model.Depends.Guard" data-throw-if-not-resolved="false"></xref> field in the following construct:
        </p>
    <pre><code class="lang-csharp">if ( Depends.Guard )

    {
      Depends.On(this.foo.Bar);
    }</code></pre>

    <p>Use this class for dependencies that the analysis cannot discover, such as dependencies hidden behind a virtual method or a delegate call.
        Pass each dependency as an expression such as <code>this.field.Property</code>.</p>
  example: []
  syntax:
    content: public static class Depends
    content.vb: Public Module Depends
