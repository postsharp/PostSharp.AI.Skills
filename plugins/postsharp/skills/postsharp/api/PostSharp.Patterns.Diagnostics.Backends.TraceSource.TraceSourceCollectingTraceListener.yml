  namespace: PostSharp.Patterns.Diagnostics.Backends.TraceSource
  summary: >-
    A <xref href="System.Diagnostics.TraceListener" data-throw-if-not-resolved="false"></xref> that redirects all trace events to PostSharp. It uses the name of the event source that created the event

    as the name of the log source to be sent to PostSharp.
  remarks: >-
    <p>Add this listener, for example in <code>app.config</code>, to the trace source that your code uses for manual logging. Then set

    <xref href="PostSharp.Patterns.Diagnostics.Backends.TraceSource.TraceSourceLoggingBackendOptions.GetTraceSourceName" data-throw-if-not-resolved="false"></xref> so that the <xref href="PostSharp.Patterns.Diagnostics.Backends.TraceSource.TraceSourceLoggingBackend" data-throw-if-not-resolved="false"></xref> writes to a different

    trace source, configured with the output listeners. Manual and automatic log records then go through the same backend.</p>
  example: []
  syntax:
    content: 'public class TraceSourceCollectingTraceListener : BaseCollectingTraceListener, IDisposable'
    content.vb: Public Class TraceSourceCollectingTraceListener Inherits BaseCollectingTraceListener Implements IDisposable
