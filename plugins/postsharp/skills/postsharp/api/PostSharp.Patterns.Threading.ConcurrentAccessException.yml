  summary: >-
    Exception thrown when two threads simultaneously attempt to execute methods of an object whose class is annotated with the

    <xref href="PostSharp.Patterns.Threading.ThreadUnsafeAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.
  remarks: <p>This exception is thrown only when run-time verification is enabled (see <xref href="PostSharp.Patterns.Threading.ThreadAwareAttribute.RuntimeVerificationEnabled" data-throw-if-not-resolved="false"></xref>).</p>
