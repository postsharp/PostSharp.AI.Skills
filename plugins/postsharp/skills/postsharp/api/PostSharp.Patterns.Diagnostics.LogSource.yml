  name: LogSource
  nameWithType: LogSource
  fullName: PostSharp.Patterns.Diagnostics.LogSource
  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics
  summary: >-
    Allows writing log messages and tracing the execution of activities. This class is optimized for use with C# 7.2 or later.

    For previous compiler versions, consider using the legacy <xref href="PostSharp.Patterns.Diagnostics.LogSource.Logger" data-throw-if-not-resolved="false"></xref> class.
  remarks: >-
    <p>
        Instances of this class are immutable. 
        </p>
    <p>
        You should typically have one instance of this class per type.
        Use <xref href="PostSharp.Patterns.Diagnostics.LogSource.Get" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Diagnostics.LoggerFactoryExtensions.GetLogSource(PostSharp.Patterns.Diagnostics.Custom.ILoggerFactory2%2cSystem.Type)" data-throw-if-not-resolved="false"></xref> to get an instance of this class for the current type.
        </p>
    <p>
        The <xref href="PostSharp.Patterns.Diagnostics.LogSource.Default" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Diagnostics.LogSource.Failure" data-throw-if-not-resolved="false"></xref> properties resolve to <xref href="PostSharp.Patterns.Diagnostics.LogLevel.Debug" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Diagnostics.LogLevel.Error" data-throw-if-not-resolved="false"></xref>.
        To change these levels for several types from a central place, configure a prototype instance with <xref href="PostSharp.Patterns.Diagnostics.LogSource.WithLevels(PostSharp.Patterns.Diagnostics.LogLevel%2cPostSharp.Patterns.Diagnostics.LogLevel)" data-throw-if-not-resolved="false"></xref>,
        then derive the instance of each type from it with <xref href="PostSharp.Patterns.Diagnostics.LogSource.ForCurrentType" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Diagnostics.LogSource.ForType(System.Type)" data-throw-if-not-resolved="false"></xref>.
        The failure level is also the level of the closing message of an activity that fails.
        </p>
    <p>
        Projects that use this class should be processed by PostSharp. Otherwise, the caller information is determined at run time by walking the call stack, which is slower.
        </p>
  example: []
  syntax:
    content: >-
      [RequirePostSharp("PostSharp.Patterns.Common.Weaver", "AddCallerInfoTask", AnyTypeReference = true)]

      public sealed class LogSource
    content.vb: >-
      <RequirePostSharp("PostSharp.Patterns.Common.Weaver", "AddCallerInfoTask", AnyTypeReference:=True)>

      Public NotInheritable Class LogSource
