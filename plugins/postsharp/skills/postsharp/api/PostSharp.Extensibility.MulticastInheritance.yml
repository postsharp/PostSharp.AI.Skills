- uid: PostSharp.Extensibility.MulticastInheritance.Strict
  commentId: F:PostSharp.Extensibility.MulticastInheritance.Strict
  id: Strict
  parent: PostSharp.Extensibility.MulticastInheritance
  langs:
  - csharp
  - vb
  name: Strict
  nameWithType: MulticastInheritance.Strict
  fullName: PostSharp.Extensibility.MulticastInheritance.Strict
  type: Field
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    The instance is inherited by children of the original element,

    but multicasting is not applied to members of children.
  remarks: See https://doc.postsharp.net/multicast-inheritance.
  example: []
  syntax:
    content: Strict = 1
    return:
      type: PostSharp.Extensibility.MulticastInheritance
