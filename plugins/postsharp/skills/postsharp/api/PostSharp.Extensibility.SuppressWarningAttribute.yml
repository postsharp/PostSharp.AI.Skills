  fullName: PostSharp.Extensibility.SuppressWarningAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: Instructs PostSharp to ignore warnings and information messages. Errors cannot be ignored.
  remarks: >-
    <p>Apply this attribute to the element of code that causes the warning, or to any enclosing declaration, such as the declaring type
        or the assembly, to suppress the warning for all the elements it contains. It works with any PostSharp warning, including warnings emitted
        by aspects and constraints with <xref href="PostSharp.Extensibility.Message" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Extensibility.MessageSource" data-throw-if-not-resolved="false"></xref>. PostSharp looks for the attribute starting from the
        <xref href="PostSharp.Extensibility.MessageLocation" data-throw-if-not-resolved="false"></xref> of the message, so it cannot suppress a message emitted without a location.
        The message identifier is compared without regard to case.</p>
    <p>To ignore a warning in the whole project, or to escalate warnings into errors, use the project settings instead.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.All, AllowMultiple = true, Inherited = false)]

      public class SuppressWarningAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.All, AllowMultiple:=True, Inherited:=False)>

      Public Class SuppressWarningAttribute Inherits Attribute
