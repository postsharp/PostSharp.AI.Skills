- uid: PostSharp.Patterns.Recording.IRecordable.HasRecorder(System.Boolean)
  commentId: M:PostSharp.Patterns.Recording.IRecordable.HasRecorder(System.Boolean)
  id: HasRecorder(System.Boolean)
  parent: PostSharp.Patterns.Recording.IRecordable
  langs:
  - csharp
  - vb
  name: HasRecorder(bool)
  nameWithType: IRecordable.HasRecorder(bool)
  fullName: PostSharp.Patterns.Recording.IRecordable.HasRecorder(bool)
  type: Method
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording
  summary: >-
    Determines whether the current object is attached to a <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref>. If it is not,

    optionally attaches the object to the default <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: >-
      [RecordingScope(RecordingScopeOption.Skip, AttributeId = -5178615502787633143, AttributePriority = 536870912)]

      bool HasRecorder(bool autoAttach)
    parameters:
    - id: autoAttach
      type: System.Boolean
      description: >-
        <code>true</code> if the current object should be automatically attached to the default <xref href="PostSharp.Patterns.Recording.IRecordable.Recorder" data-throw-if-not-resolved="false"></xref>
            if it is not yet attached, otherwise <code>false</code>.
    return:
      type: System.Boolean
      description: <code>true</code> if the object is already attached to a <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref> or if <code class="paramref">autoAttach</code> is <code>true</code>, otherwise <code>false</code>.
    content.vb: >-
      <RecordingScope(RecordingScopeOption.Skip, AttributeId:=-5178615502787633143, AttributePriority:=536870912)>

      Function HasRecorder(autoAttach As Boolean) As Boolean
  overload: PostSharp.Patterns.Recording.IRecordable.HasRecorder*
