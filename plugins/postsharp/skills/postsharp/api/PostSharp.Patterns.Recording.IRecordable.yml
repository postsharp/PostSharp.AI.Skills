- uid: PostSharp.Patterns.Recording.IRecordable.Recorder
  commentId: P:PostSharp.Patterns.Recording.IRecordable.Recorder
  id: Recorder
  parent: PostSharp.Patterns.Recording.IRecordable
  langs:
  - csharp
  - vb
  name: Recorder
  nameWithType: IRecordable.Recorder
  fullName: PostSharp.Patterns.Recording.IRecordable.Recorder
  type: Property
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording
  summary: Gets the recorder attached to the current object.
  remarks: >-
    <p>Getting this property automatically attaches the object to the default <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref> if it is not yet attached. 
        Use the <xref href="PostSharp.Patterns.Recording.IRecordable.HasRecorder(System.Boolean)" data-throw-if-not-resolved="false"></xref> method with the <code>false</code> argument to determine whether the object is already attached to a recorder. </p>
    <div class="NOTE"><h5>note</h5><p>Named code should not invoke the setting of this property. </p></div>

    <p>When this property is set, it is not the responsibility of the class implementing this interface to also set the property to all children. This
        responsibility belongs to the <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref> class.</p>
  example: []
  syntax:
    content: Recorder Recorder { get; set; }
    parameters: []
    return:
      type: PostSharp.Patterns.Recording.Recorder
    content.vb: Property Recorder As Recorder
  overload: PostSharp.Patterns.Recording.IRecordable.Recorder*
