  name: ThreadUnsafeAttribute
  nameWithType: ThreadUnsafeAttribute
  fullName: PostSharp.Patterns.Threading.ThreadUnsafeAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Custom attribute that, when applied to a type, ensures that only one thread executes in methods of this type.

    When more than one thread accesses methods of this type, a <xref href="PostSharp.Patterns.Threading.ConcurrentAccessException" data-throw-if-not-resolved="false"></xref> is thrown.
  remarks: >-
    <p>Use this model for objects that must never be accessed concurrently, to detect violations deterministically instead of corrupting the object.
        Public and internal methods acquire exclusive access to the object, like in the <xref href="PostSharp.Patterns.Threading.SynchronizedAttribute" data-throw-if-not-resolved="false"></xref> model, but a thread that cannot
        acquire access immediately throws a <xref href="PostSharp.Patterns.Threading.ConcurrentAccessException" data-throw-if-not-resolved="false"></xref> instead of waiting. Accessing a field from a thread that has not acquired
        access results in a <xref href="PostSharp.Patterns.Threading.ThreadAccessException" data-throw-if-not-resolved="false"></xref>.</p>
    <p>These checks are run-time verifications: they are performed only when <xref href="PostSharp.Patterns.Threading.ThreadAwareAttribute.RuntimeVerificationEnabled" data-throw-if-not-resolved="false"></xref> is <code>true</code>,
        which is the default in debug builds only. A build-time error is emitted when the class has public or internal fields.</p>
  example: []
  syntax:
    content: >-
      [Metric("UsedFeatures", "PostSharp.Patterns.Threading.ThreadUnsafe")]

      [Serializer(typeof(ThreadUnsafeAttribute.Serializer))]

