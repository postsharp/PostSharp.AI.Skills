      <AspectConfigurationAttributeType(GetType(EventInterceptionAspectConfigurationAttribute))>

      <Serializer(Nothing)>

      Public MustInherit Class EventInterceptionAspect Inherits EventLevelAspect Implements IEventLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, IEventInterceptionAspect, IEventLevelAspect, IAspect
