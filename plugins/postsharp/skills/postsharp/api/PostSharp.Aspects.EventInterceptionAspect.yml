  langs:
  - csharp
  - vb
  name: EventInterceptionAspect
  nameWithType: EventInterceptionAspect
  fullName: PostSharp.Aspects.EventInterceptionAspect
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Aspect that, when applied on an event, intercepts invocations of its semantics <code>Add</code> (<xref href="PostSharp.Aspects.EventInterceptionAspect.OnAddHandler(PostSharp.Aspects.EventInterceptionArgs)" data-throw-if-not-resolved="false"></xref>), 

    <code>Remove</code> (<xref href="PostSharp.Aspects.EventInterceptionAspect.OnRemoveHandler(PostSharp.Aspects.EventInterceptionArgs)" data-throw-if-not-resolved="false"></xref>) and <code>Invoke</code> (<xref href="PostSharp.Aspects.EventInterceptionAspect.OnInvokeHandler(PostSharp.Aspects.EventInterceptionArgs)" data-throw-if-not-resolved="false"></xref>).
  remarks: >-
    <p>
            Applying an aspect of type <xref href="PostSharp.Aspects.EventInterceptionAspect" data-throw-if-not-resolved="false"></xref> to an event results in the <code>add</code> and <code>remove</code>
            methods of the event to be replaced by a call to <xref href="PostSharp.Aspects.EventInterceptionAspect.OnAddHandler(PostSharp.Aspects.EventInterceptionArgs)" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.EventInterceptionAspect.OnRemoveHandler(PostSharp.Aspects.EventInterceptionArgs)" data-throw-if-not-resolved="false"></xref>, respectively.
            The original accessor body is moved into new methods, which the aspect code can call by invoking <xref href="PostSharp.Aspects.EventInterceptionArgs.ProceedAddHandler" data-throw-if-not-resolved="false"></xref>
            or <xref href="PostSharp.Aspects.EventInterceptionArgs.ProceedRemoveHandler" data-throw-if-not-resolved="false"></xref>.
            </p>
        <p>
            The method <xref href="PostSharp.Aspects.EventInterceptionAspect.OnInvokeHandler(PostSharp.Aspects.EventInterceptionArgs)" data-throw-if-not-resolved="false"></xref>, if defined, is called instead when the event is raised, once for every handler that has been added
            to the list. When you define the <xref href="PostSharp.Aspects.EventInterceptionAspect.OnInvokeHandler(PostSharp.Aspects.EventInterceptionArgs)" data-throw-if-not-resolved="false"></xref> method, PostSharp will use a broker object to control access to the event.
            This broker object will be the unique subscriber of the event, and it maintains its own list of subscribers.
            </p>
        <p>
          <div class="NOTE"><h5>note</h5><p>
                    The aspect works only when the caller code accesses the event through its <code>add</code>/<code>remove</code> semantics. It does not work when the caller
                    code bypasses the event semantics and directly accesses its implementation (typically the underlying field of the event). The C# compiler
                    is known to bypass the semantics when the event is accessed directly from the class that declares it. In this case, it directly accesses the private field
                    whenever it can. For the same reason, <xref href="PostSharp.Aspects.EventInterceptionAspect.OnAddHandler(PostSharp.Aspects.EventInterceptionArgs)" data-throw-if-not-resolved="false"></xref> is not invoked for the initializer of a field-like event;
                    add the initial handler in the constructor instead.
                </p></div>
        </p>
        <p>
          <div class="NOTE"><h5>note</h5><p>
        All classes implementing
        <xref href="PostSharp.Aspects.IAspect" data-throw-if-not-resolved="false"></xref>
        should typically be marked as serializable
        using the 
        <xref href="System.SerializableAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.PSerializableAttribute" data-throw-if-not-resolved="false"></xref> custom attribute. Fields that
        are only used at runtime (and unknown at compile-time) should be carefully
        marked with the <xref href="System.NonSerializedAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.PNonSerializedAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.
        When another aspect serializer (such as <xref href="PostSharp.Aspects.Serialization.MsilAspectSerializer" data-throw-if-not-resolved="false"></xref>) is used,
        it is not necessary to mark the aspect class as serializable.
        For more information, see
        <a href="@aspect-serialization">Aspect Serialization</a>.
      </p></div>
        </p>
        <a href="@aspect-serialization">
      Conceptual: Understanding Aspect Serialization
    </a>
  example: []
  syntax:
    content: >-
      [HasInheritedAttribute]

      [MulticastAttributeUsage(MulticastTargets.Event, AllowMultiple = true, PersistMetaData = false, TargetMemberAttributes = MulticastAttributes.NonAbstract)]

      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Class|AttributeTargets.Struct|AttributeTargets.Event|AttributeTargets.Interface, AllowMultiple = true)]

      [AspectConfigurationAttributeType(typeof(EventInterceptionAspectConfigurationAttribute))]

      [Serializer(null)]

      public abstract class EventInterceptionAspect : EventLevelAspect, IEventLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, IEventInterceptionAspect, IEventLevelAspect, IAspect
    content.vb: >-
      <HasInheritedAttribute>

      <MulticastAttributeUsage(MulticastTargets.Event, AllowMultiple:=True, PersistMetaData:=False, TargetMemberAttributes:=MulticastAttributes.NonAbstract)>

