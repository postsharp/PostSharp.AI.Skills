- uid: PostSharp.Aspects.EventInterceptionAspect.OnInvokeHandler(PostSharp.Aspects.EventInterceptionArgs)
  commentId: M:PostSharp.Aspects.EventInterceptionAspect.OnInvokeHandler(PostSharp.Aspects.EventInterceptionArgs)
  id: OnInvokeHandler(PostSharp.Aspects.EventInterceptionArgs)
  parent: PostSharp.Aspects.EventInterceptionAspect
  langs:
  - csharp
  - vb
  name: OnInvokeHandler(EventInterceptionArgs)
  nameWithType: EventInterceptionAspect.OnInvokeHandler(EventInterceptionArgs)
  fullName: PostSharp.Aspects.EventInterceptionAspect.OnInvokeHandler(PostSharp.Aspects.EventInterceptionArgs)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Method invoked when the event to which the current aspect is applied is fired, for each delegate

    of this event, and instead of invoking this delegate.
  remarks: >-
    <div class="NOTE"><h5>note</h5><p>
      Because of the way the C# compiler implements
      <b>field-like events</b>
      (i.e. events where you
      don't implement the
      <code>Add</code>
      and
      <code>Remove</code>
      semantics manually), the
      <b>Invoke Event Handler</b>
      semantic (
      <xref href="PostSharp.Aspects.IEventInterceptionAspect.OnInvokeHandler(PostSharp.Aspects.EventInterceptionArgs)" data-throw-if-not-resolved="false"></xref>
      or equivalent) shall not be invoked for delegates that have been added from inside the class that declares this event.
    </p></div>
        <br />
        <div class="NOTE"><h5>note</h5><p>
      The
      <b>Invoke Event Handler</b>
      semantic is different from normal event firing.
      Indeed, when you fire an event, all handlers that were added to this event are fired. However, the current method
      invokes only a single handler: the one passed to the
      <code>handler</code>
      parameter.
    </p></div>
  example: []
  syntax:
    content: >-
      [HasInheritedAttribute]

      public virtual void OnInvokeHandler(EventInterceptionArgs args)
    parameters:
    - id: args
      type: PostSharp.Aspects.EventInterceptionArgs
      description: Handler arguments.
    content.vb: >-
      <HasInheritedAttribute>

      Public Overridable Sub OnInvokeHandler(args As EventInterceptionArgs)
  overload: PostSharp.Aspects.EventInterceptionAspect.OnInvokeHandler*
