- uid: PostSharp.Aspects.EventInterceptionAspect.OnAddHandler(PostSharp.Aspects.EventInterceptionArgs)
  commentId: M:PostSharp.Aspects.EventInterceptionAspect.OnAddHandler(PostSharp.Aspects.EventInterceptionArgs)
  id: OnAddHandler(PostSharp.Aspects.EventInterceptionArgs)
  parent: PostSharp.Aspects.EventInterceptionAspect
  langs:
  - csharp
  - vb
  name: OnAddHandler(EventInterceptionArgs)
  nameWithType: EventInterceptionAspect.OnAddHandler(EventInterceptionArgs)
  fullName: PostSharp.Aspects.EventInterceptionAspect.OnAddHandler(PostSharp.Aspects.EventInterceptionArgs)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Method invoked instead of the <code>Add</code> semantic of the event to which the current aspect is applied,

    i.e. when a new delegate is added to this event.
  remarks: >-
    <p>
               This advice does not intercept the initializer of a field-like event. If you want to intercept the adding of all handlers,
            do not use event initializers. Add the initial handler in the constructor instead.
              </p>
        <br />
        <div class="NOTE"><h5>note</h5><p>
      Because of the way the C# compiler implements
      <b>field-like events</b>
      (i.e. events where you
      don't implement the
      <code>Add</code>
      and
      <code>Remove</code>
      semantics manually), the
      <b>Invoke Event Handler</b>
      semantic (
      <xref href="PostSharp.Aspects.IEventInterceptionAspect.OnInvokeHandler(PostSharp.Aspects.EventInterceptionArgs)" data-throw-if-not-resolved="false"></xref>
      or equivalent) shall not be invoked for delegates that have been added from inside the class that declares this event.
    </p></div>
  example: []
  syntax:
    content: >-
      [HasInheritedAttribute]

      public virtual void OnAddHandler(EventInterceptionArgs args)
    parameters:
    - id: args
      type: PostSharp.Aspects.EventInterceptionArgs
      description: Handler arguments.
    content.vb: >-
      <HasInheritedAttribute>

      Public Overridable Sub OnAddHandler(args As EventInterceptionArgs)
  overload: PostSharp.Aspects.EventInterceptionAspect.OnAddHandler*
