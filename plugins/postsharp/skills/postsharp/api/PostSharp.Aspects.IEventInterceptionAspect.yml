  name: IEventInterceptionAspect
  nameWithType: IEventInterceptionAspect
  fullName: PostSharp.Aspects.IEventInterceptionAspect
  type: Interface
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Runtime semantics of an aspect that, when applied on an event, intercepts invocations of its <code>Add</code> (<xref href="PostSharp.Aspects.IEventInterceptionAspect.OnAddHandler(PostSharp.Aspects.EventInterceptionArgs)" data-throw-if-not-resolved="false"></xref>), 

    <code>Remove</code> (<xref href="PostSharp.Aspects.IEventInterceptionAspect.OnRemoveHandler(PostSharp.Aspects.EventInterceptionArgs)" data-throw-if-not-resolved="false"></xref>) and <code>Invoke</code> (<xref href="PostSharp.Aspects.IEventInterceptionAspect.OnInvokeHandler(PostSharp.Aspects.EventInterceptionArgs)" data-throw-if-not-resolved="false"></xref>) semantics.
  remarks: >-
    <p>
            For details, see <xref href="PostSharp.Aspects.EventInterceptionAspect" data-throw-if-not-resolved="false"></xref>.
          </p>
  example: []
  syntax:
    content: >-
      [HasInheritedAttribute]

      public interface IEventInterceptionAspect : IEventLevelAspect, IAspect
    content.vb: >-
      <HasInheritedAttribute>

      Public Interface IEventInterceptionAspect Inherits IEventLevelAspect, IAspect
  derivedClasses:
