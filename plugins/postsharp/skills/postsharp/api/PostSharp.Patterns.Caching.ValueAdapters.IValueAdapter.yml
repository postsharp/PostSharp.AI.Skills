  name: IValueAdapter
  nameWithType: IValueAdapter
  fullName: PostSharp.Patterns.Caching.ValueAdapters.IValueAdapter
  type: Interface
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching.ValueAdapters
  summary: Wraps uncacheable classes or interfaces into cacheable objects. For example, an <xref href="System.Collections.IEnumerable" data-throw-if-not-resolved="false"></xref> can be wrapped into an array.
  remarks: >-
    <p>The value returned by the cached method is called the exposed value. The value that is stored in the cache is called the stored value.
        The adapter is selected by the return type of the cached method (for an <code>async</code> method, the result type of the task). Adapters for
        <xref href="System.IO.Stream" data-throw-if-not-resolved="false"></xref>, <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref> and <xref href="System.Collections.Generic.IEnumerator%601" data-throw-if-not-resolved="false"></xref>
        are registered by default. A <code>null</code> return value is stored without calling the adapter.</p>
    <p>To add an adapter, implement <xref href="PostSharp.Patterns.Caching.ValueAdapters.IValueAdapter%601" data-throw-if-not-resolved="false"></xref>, typically by deriving from <xref href="PostSharp.Patterns.Caching.ValueAdapters.ValueAdapter%601" data-throw-if-not-resolved="false"></xref>, and register it with the
        <xref href="PostSharp.Patterns.Caching.ValueAdapters.ValueAdapterFactory" data-throw-if-not-resolved="false"></xref> of the backend, available from the <xref href="PostSharp.Patterns.Caching.Implementation.CachingBackend.ValueAdapters" data-throw-if-not-resolved="false"></xref> property.</p>
  example: []
  syntax:
    content: public interface IValueAdapter
    content.vb: Public Interface IValueAdapter
