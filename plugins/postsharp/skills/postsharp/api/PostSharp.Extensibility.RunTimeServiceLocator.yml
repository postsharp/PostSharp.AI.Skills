  summary: >-
    Gets an <xref href="System.IServiceProvider" data-throw-if-not-resolved="false"></xref> that resolves the services registered in <xref href="PostSharp.Extensibility.RunTimeServiceLocator" data-throw-if-not-resolved="false"></xref>. Its

