  fullName: PostSharp.Extensibility.RunTimeServiceLocator
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: A process-wide registry of run-time services, which the code generated by PostSharp uses when a dependency was not supplied.
  remarks: >-
    <p>When a class receives a dependency from its constructors, because an aspect requested it with
            <xref href="PostSharp.Aspects.Advices.ImportDependencyAdviceInstance" data-throw-if-not-resolved="false"></xref>, and the constructor receives <code>null</code> for that dependency,
            the generated code resolves the dependency with <xref href="PostSharp.Extensibility.RunTimeServiceLocator.GetRequiredService%60%601" data-throw-if-not-resolved="false"></xref>, or with <xref href="PostSharp.Extensibility.RunTimeServiceLocator.GetService%60%601" data-throw-if-not-resolved="false"></xref> when the
            dependency is optional. This is the case when the object is created with <code>new</code> instead of by a dependency injection container.</p>
    <p>A service is registered as a factory, which runs each time the service is resolved. A factory can therefore return a singleton,
            a new object, or an object that depends on the context, for instance on an <xref href="System.Threading.AsyncLocal%601" data-throw-if-not-resolved="false"></xref> that the application sets.</p>
    <p>This class is not a dependency injection container: it has no scopes and does not dispose the services. Register the services
            at startup, before the objects that need them are created.</p>
  example: []
  syntax:
    content: public static class RunTimeServiceLocator
    content.vb: Public Module RunTimeServiceLocator
