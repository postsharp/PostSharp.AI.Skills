  langs:
  - csharp
  - vb
  name: IsEligibleChild(object, ChildInfo)
  nameWithType: AggregatableClientAttribute.IsEligibleChild(object, ChildInfo)
  fullName: PostSharp.Patterns.Model.AggregatableClientAttribute.IsEligibleChild(object, PostSharp.Patterns.Model.ChildInfo)
  type: Method
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: Determines whether an object is eligible to be a child of the target instance of the current aspect.
  example: []
  syntax:
    content: protected abstract bool IsEligibleChild(object child, ChildInfo childInfo)
    parameters:
    - id: child
      type: System.Object
      description: The object to test.
    - id: childInfo
      type: PostSharp.Patterns.Model.ChildInfo
      description: The <xref href="PostSharp.Patterns.Model.ChildInfo" data-throw-if-not-resolved="false"></xref> that describes the location of the child.
    return:
      type: System.Boolean
      description: >-
        <code>true</code> if <code class="paramref">child</code> is eligible to be a child without injecting any advice, otherwise <code>false</code>. When this method returns <code>false</code>,
            the aspect will invoke the <xref href="PostSharp.Patterns.Model.AggregatableClientAttribute.Advise(System.Object)" data-throw-if-not-resolved="false"></xref> method.
    content.vb: Protected MustOverride Function IsEligibleChild(child As Object, childInfo As ChildInfo) As Boolean
  overload: PostSharp.Patterns.Model.AggregatableClientAttribute.IsEligibleChild*
  nameWithType.vb: AggregatableClientAttribute.IsEligibleChild(Object, ChildInfo)
  fullName.vb: PostSharp.Patterns.Model.AggregatableClientAttribute.IsEligibleChild(Object, PostSharp.Patterns.Model.ChildInfo)
  name.vb: IsEligibleChild(Object, ChildInfo)
