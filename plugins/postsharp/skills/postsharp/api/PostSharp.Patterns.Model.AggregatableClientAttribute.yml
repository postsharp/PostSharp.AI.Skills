- uid: PostSharp.Patterns.Model.AggregatableClientAttribute.OnAdviseChildFailed(System.Object)
  commentId: M:PostSharp.Patterns.Model.AggregatableClientAttribute.OnAdviseChildFailed(System.Object)
  id: OnAdviseChildFailed(System.Object)
  parent: PostSharp.Patterns.Model.AggregatableClientAttribute
  langs:
  - csharp
  - vb
  name: OnAdviseChildFailed(object)
  nameWithType: AggregatableClientAttribute.OnAdviseChildFailed(object)
  fullName: PostSharp.Patterns.Model.AggregatableClientAttribute.OnAdviseChildFailed(object)
  type: Method
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: >-
    This method is invoked when a child is assigned to a parent and the advices of the parent cannot be added to the child.

    Implementations can choose to throw an exception (thread-aware attributes do this) or ignore the situation (<code>DisposableAttribute</code> does this).
  example: []
  syntax:
    content: protected virtual void OnAdviseChildFailed(object child)
    parameters:
    - id: child
      type: System.Object
      description: An object that is ineligible to be a child. It is guaranteed to be non-null.
    content.vb: Protected Overridable Sub OnAdviseChildFailed(child As Object)
  overload: PostSharp.Patterns.Model.AggregatableClientAttribute.OnAdviseChildFailed*
  nameWithType.vb: AggregatableClientAttribute.OnAdviseChildFailed(Object)
  fullName.vb: PostSharp.Patterns.Model.AggregatableClientAttribute.OnAdviseChildFailed(Object)
