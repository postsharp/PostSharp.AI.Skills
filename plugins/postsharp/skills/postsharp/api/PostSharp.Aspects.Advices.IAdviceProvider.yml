  nameWithType: IAdviceProvider
  fullName: PostSharp.Aspects.Advices.IAdviceProvider
  type: Interface
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Interface that allows an aspect to provide advices dynamically, instead of declaratively by using custom attributes.
  remarks: >-
    <p>PostSharp calls <xref href="PostSharp.Aspects.Advices.IAdviceProvider.ProvideAdvices(System.Object)" data-throw-if-not-resolved="false"></xref> at build time for each target of the aspect. Implement this interface when the advices
        depend on the target and cannot be expressed with custom attributes, for example to import several fields or properties of the
        target class into a single aspect field with <xref href="PostSharp.Aspects.Advices.ImportLocationAdviceInstance" data-throw-if-not-resolved="false"></xref>. The other advices that can be provided
        are <xref href="PostSharp.Aspects.Advices.ImportMethodAdviceInstance" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.IntroduceMethodAdviceInstance" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.Advices.IntroduceInterfaceAdviceInstance" data-throw-if-not-resolved="false"></xref>.</p>
    <p>The target element is a <code>System.Reflection</code> object. For C# 14 extension blocks, it represents the code generated by the compiler,
        so avoid selecting extension block metadata types and their members; use <xref href="PostSharp.Reflection.ReflectionHelper.IsExtensionBlockMetadata(System.Reflection.MemberInfo)" data-throw-if-not-resolved="false"></xref>
        to recognize them.</p>
  example: []
  syntax:
    content: 'public interface IAdviceProvider : IAspect'
    content.vb: Public Interface IAdviceProvider Inherits IAspect
