- uid: PostSharp.Aspects.Aspect.CreateAspectConfiguration
  commentId: M:PostSharp.Aspects.Aspect.CreateAspectConfiguration
  id: CreateAspectConfiguration
  parent: PostSharp.Aspects.Aspect
  langs:
  - csharp
  - vb
  name: CreateAspectConfiguration()
  nameWithType: Aspect.CreateAspectConfiguration()
  fullName: PostSharp.Aspects.Aspect.CreateAspectConfiguration()
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Method invoked at build time to create a concrete <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref> instance specifically

    for the current <xref href="PostSharp.Aspects.Aspect" data-throw-if-not-resolved="false"></xref> type.
  remarks: >-
    This method should not set up the returned <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref>. After the current method has

    returned, the <xref href="PostSharp.Aspects.Aspect.SetAspectConfiguration(PostSharp.Aspects.Configuration.AspectConfiguration%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> method will be invoked, and that method is responsible

    for setting up the <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref> object.
  example: []
  syntax:
    content: protected virtual AspectConfiguration CreateAspectConfiguration()
    return:
      type: PostSharp.Aspects.Configuration.AspectConfiguration
      description: >-
        A new and empty instance of <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref>, whose concrete type corresponds to
                      the concrete type of the <xref href="PostSharp.Aspects.Aspect" data-throw-if-not-resolved="false"></xref>.
    content.vb: Protected Overridable Function CreateAspectConfiguration() As AspectConfiguration
  overload: PostSharp.Aspects.Aspect.CreateAspectConfiguration*
  seealso:
  - linkType: HRef
    linkId: '@aspect-configuration'
    altText: 'Conceptual: Aspect Configuration'
- uid: PostSharp.Aspects.Aspect.SetAspectConfiguration(PostSharp.Aspects.Configuration.AspectConfiguration,System.Object)
  commentId: M:PostSharp.Aspects.Aspect.SetAspectConfiguration(PostSharp.Aspects.Configuration.AspectConfiguration,System.Object)
  id: SetAspectConfiguration(PostSharp.Aspects.Configuration.AspectConfiguration,System.Object)
  parent: PostSharp.Aspects.Aspect
  langs:
  - csharp
  - vb
  name: SetAspectConfiguration(AspectConfiguration, object)
  nameWithType: Aspect.SetAspectConfiguration(AspectConfiguration, object)
  fullName: PostSharp.Aspects.Aspect.SetAspectConfiguration(PostSharp.Aspects.Configuration.AspectConfiguration, object)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Method invoked at build time to set up an <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref> object according to the current 

    <xref href="PostSharp.Aspects.Aspect" data-throw-if-not-resolved="false"></xref> instance and a specified target element of the current aspect.
  remarks: >-
    <p>Classes overriding this method must always invoke the base implementation before performing their own
            changes to the 
            <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: protected virtual void SetAspectConfiguration(AspectConfiguration aspectConfiguration, object targetElement)
    parameters:
    - id: aspectConfiguration
      type: PostSharp.Aspects.Configuration.AspectConfiguration
      description: >-
        The <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref> instance previously returned by the
                      <xref href="PostSharp.Aspects.Aspect.CreateAspectConfiguration" data-throw-if-not-resolved="false"></xref> method.
    - id: targetElement
      type: System.Object
      description: >-
        Code element (<xref href="System.Reflection.Assembly" data-throw-if-not-resolved="false"></xref>, <xref href="System.Type" data-throw-if-not-resolved="false"></xref>, 
                      <xref href="System.Reflection.FieldInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.MethodBase" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.EventInfo" data-throw-if-not-resolved="false"></xref>, 
                      <xref href="System.Reflection.ParameterInfo" data-throw-if-not-resolved="false"></xref>, or <xref href="PostSharp.Reflection.LocationInfo" data-throw-if-not-resolved="false"></xref>) to which the current <xref href="PostSharp.Aspects.Aspect" data-throw-if-not-resolved="false"></xref>
                      has been applied.
    content.vb: Protected Overridable Sub SetAspectConfiguration(aspectConfiguration As AspectConfiguration, targetElement As Object)
  overload: PostSharp.Aspects.Aspect.SetAspectConfiguration*
  seealso:
  - linkType: HRef
    linkId: '@aspect-configuration'
    altText: 'Conceptual: Aspect Configuration'
  nameWithType.vb: Aspect.SetAspectConfiguration(AspectConfiguration, Object)
  fullName.vb: PostSharp.Aspects.Aspect.SetAspectConfiguration(PostSharp.Aspects.Configuration.AspectConfiguration, Object)
  name.vb: SetAspectConfiguration(AspectConfiguration, Object)
- uid: PostSharp.Aspects.Aspect.GetAspectConfiguration(System.Object)
  commentId: M:PostSharp.Aspects.Aspect.GetAspectConfiguration(System.Object)
  id: GetAspectConfiguration(System.Object)
  parent: PostSharp.Aspects.Aspect
  langs:
  - csharp
  - vb
  name: GetAspectConfiguration(object)
  nameWithType: Aspect.GetAspectConfiguration(object)
  fullName: PostSharp.Aspects.Aspect.GetAspectConfiguration(object)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Method invoked at build time to get the imperative configuration of the current <xref href="PostSharp.Aspects.Aspect" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>This method can be customized by overriding <xref href="PostSharp.Aspects.Aspect.CreateAspectConfiguration" data-throw-if-not-resolved="false"></xref> and/or
            <xref href="PostSharp.Aspects.Aspect.SetAspectConfiguration(PostSharp.Aspects.Configuration.AspectConfiguration%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public AspectConfiguration GetAspectConfiguration(object targetElement)
    parameters:
    - id: targetElement
      type: System.Object
      description: >-
        Code element (<xref href="System.Reflection.Assembly" data-throw-if-not-resolved="false"></xref>, <xref href="System.Type" data-throw-if-not-resolved="false"></xref>, 
                      <xref href="System.Reflection.FieldInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.MethodBase" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.EventInfo" data-throw-if-not-resolved="false"></xref>, 
                      <xref href="System.Reflection.ParameterInfo" data-throw-if-not-resolved="false"></xref>, or <xref href="PostSharp.Reflection.LocationInfo" data-throw-if-not-resolved="false"></xref>) to which the current <xref href="PostSharp.Aspects.Aspect" data-throw-if-not-resolved="false"></xref>
                      has been applied.
    return:
      type: PostSharp.Aspects.Configuration.AspectConfiguration
      description: >-
        An <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref> representing the imperative configuration
                      of the current <xref href="PostSharp.Aspects.Aspect" data-throw-if-not-resolved="false"></xref>.
    content.vb: Public Function GetAspectConfiguration(targetElement As Object) As AspectConfiguration
  overload: PostSharp.Aspects.Aspect.GetAspectConfiguration*
  seealso:
  - linkType: HRef
    linkId: '@aspect-configuration'
    altText: 'Conceptual: Aspect Configuration'
  implements:
  - PostSharp.Aspects.IAspectBuildSemantics.GetAspectConfiguration(System.Object)
  nameWithType.vb: Aspect.GetAspectConfiguration(Object)
  fullName.vb: PostSharp.Aspects.Aspect.GetAspectConfiguration(Object)
  name.vb: GetAspectConfiguration(Object)
- uid: PostSharp.Aspects.Aspect.CompileTimeValidate(System.Object)
  commentId: M:PostSharp.Aspects.Aspect.CompileTimeValidate(System.Object)
  id: CompileTimeValidate(System.Object)
  parent: PostSharp.Aspects.Aspect
  langs:
  - csharp
  - vb
  name: CompileTimeValidate(object)
  nameWithType: Aspect.CompileTimeValidate(object)
  fullName: PostSharp.Aspects.Aspect.CompileTimeValidate(object)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Method invoked at build time to ensure that the aspect has been applied to the right target.
  remarks: >-
    The implementation of this method is expected to emit an error message (see 

    <xref href="PostSharp.Extensibility.MessageSource" data-throw-if-not-resolved="false"></xref>) or to throw an exception in case of error. Returning <code>false</code> without emitting an

    error message or exception causes the aspect to be silently ignored.
  example: []
  syntax:
    content: public virtual bool CompileTimeValidate(object target)
    parameters:
    - id: target
      type: System.Object
      description: >-
        Code element (<xref href="System.Reflection.Assembly" data-throw-if-not-resolved="false"></xref>, <xref href="System.Type" data-throw-if-not-resolved="false"></xref>, 
                      <xref href="System.Reflection.FieldInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.MethodBase" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.EventInfo" data-throw-if-not-resolved="false"></xref>, 
                      <xref href="System.Reflection.ParameterInfo" data-throw-if-not-resolved="false"></xref>, or <xref href="PostSharp.Reflection.LocationInfo" data-throw-if-not-resolved="false"></xref>) to which the aspect has been applied.
    return:
      type: System.Boolean
      description: >-
        <code>true</code> if the aspect was applied to an acceptable target, otherwise
              <code>false</code>.
    content.vb: Public Overridable Function CompileTimeValidate(target As Object) As Boolean
  overload: PostSharp.Aspects.Aspect.CompileTimeValidate*
  seealso:
  - linkType: HRef
    linkId: '@aspect-validation'
    altText: 'Conceptual: Validating Aspect Usage'
  nameWithType.vb: Aspect.CompileTimeValidate(Object)
  fullName.vb: PostSharp.Aspects.Aspect.CompileTimeValidate(Object)
  name.vb: CompileTimeValidate(Object)
