  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Base class for all aspects that are declared using multicast custom attributes (<xref href="PostSharp.Extensibility.MulticastAttribute" data-throw-if-not-resolved="false"></xref>).
  remarks: >-
    <p>This class is not specific to any kind of declaration (for example a method, a field, or a type).
             Consider deriving your aspect from <xref href="PostSharp.Aspects.TypeLevelAspect" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.MethodLevelAspect" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.LocationLevelAspect" data-throw-if-not-resolved="false"></xref>,
            or <xref href="PostSharp.Aspects.EventLevelAspect" data-throw-if-not-resolved="false"></xref> if it should be applied to a specific kind of declaration.
            </p>
        <br />
        <div class="NOTE"><h5>note</h5><p>
      This class does not provide any advice. You may derive your aspect class from a
      <a href="@simple-aspects" target="_self">
        class providing
        predefined advice
      </a>, or build a
      <a href="@complex-aspects" target="_self">composite aspect</a>.
    </p></div>
        <a href="@simple-aspects#AspectClasses" target="_self">
      Conceptual: Developing Simple Aspects
    </a>
        <a href="@complex-aspects" target="_self">
      Conceptual: Developing Composite Aspects
    </a>
        <br />
        <p>
          <div class="NOTE"><h5>note</h5><p>
        All classes implementing
        <xref href="PostSharp.Aspects.IAspect" data-throw-if-not-resolved="false"></xref>
        should typically be marked as serializable
        using the 
        <xref href="System.SerializableAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.PSerializableAttribute" data-throw-if-not-resolved="false"></xref> custom attribute. Fields that
        are only used at runtime (and unknown at compile-time) should be carefully
        marked with the <xref href="System.NonSerializedAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.PNonSerializedAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.
        When another aspect serializer (such as <xref href="PostSharp.Aspects.Serialization.MsilAspectSerializer" data-throw-if-not-resolved="false"></xref>) is used,
        it is not necessary to mark the aspect class as serializable.
        For more information, see
        <a href="@aspect-serialization">Aspect Serialization</a>.
      </p></div>
        </p>
        <a href="@aspect-serialization">
      Conceptual: Understanding Aspect Serialization
    </a>
  example: []
  syntax:
    content: >-
      [AspectConfigurationAttributeType(typeof(AspectConfigurationAttribute))]

      [Serializer(null)]

      public abstract class Aspect : MulticastAttribute, IAspect, IAspectBuildSemantics, IValidableAnnotation
    content.vb: >-
      <AspectConfigurationAttributeType(GetType(AspectConfigurationAttribute))>

      <Serializer(Nothing)>

      Public MustInherit Class Aspect Inherits MulticastAttribute Implements IAspect, IAspectBuildSemantics, IValidableAnnotation
