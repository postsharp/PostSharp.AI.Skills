- uid: PostSharp.Aspects.Aspect.UnsupportedTargetAction
  commentId: P:PostSharp.Aspects.Aspect.UnsupportedTargetAction
  id: UnsupportedTargetAction
  parent: PostSharp.Aspects.Aspect
  langs:
  - csharp
  - vb
  name: UnsupportedTargetAction
  nameWithType: Aspect.UnsupportedTargetAction
  fullName: PostSharp.Aspects.Aspect.UnsupportedTargetAction
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Gets or sets the action to take when the aspect is applied to an unsupported target element. This property affects only simple aspects, not composite aspects.
  remarks: This property affects only the built-in advices of the simple aspect classes, not advices of composite aspects. See <a href="@custom-aspects">the conceptual documentation</a> for details. For composite aspects, use the <code>UnsupportedTargetAction</code> property of the advice custom attribute, for example <xref href="PostSharp.Aspects.Advices.OnMethodBoundaryAdvice.UnsupportedTargetAction" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public UnsupportedTargetAction UnsupportedTargetAction { get; set; }
    parameters: []
    return:
      type: PostSharp.Aspects.UnsupportedTargetAction
    content.vb: Public Property UnsupportedTargetAction As UnsupportedTargetAction
  overload: PostSharp.Aspects.Aspect.UnsupportedTargetAction*
