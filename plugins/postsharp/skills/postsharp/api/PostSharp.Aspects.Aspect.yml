- uid: PostSharp.Aspects.Aspect.AspectPriority
  commentId: P:PostSharp.Aspects.Aspect.AspectPriority
  id: AspectPriority
  parent: PostSharp.Aspects.Aspect
  langs:
  - csharp
  - vb
  name: AspectPriority
  nameWithType: Aspect.AspectPriority
  fullName: PostSharp.Aspects.Aspect.AspectPriority
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Gets or sets the weaving priority of the aspect.
  remarks: >-
    <p>Advices with a lower priority are executed earlier for
            'entry' semantics (entering or invoking a method, setting a field
            value). This order is inverted for advices with 'exit' semantics
            (leaving a method, getting a field value).
          </p>
    <p>This property must not be confused with 
            <xref href="PostSharp.Extensibility.MulticastAttribute.AttributePriority" data-throw-if-not-resolved="false"></xref>, which only
            influences the multicasting process.</p>
  example: []
  syntax:
    content: public int AspectPriority { get; set; }
    parameters: []
    return:
      type: System.Int32
      description: >-
        The aspect priority, or <code>0</code> if the aspect priority is
                      not specified.
    content.vb: Public Property AspectPriority As Integer
  overload: PostSharp.Aspects.Aspect.AspectPriority*
  seealso:
  - linkType: HRef
    linkId: '@aspect-dependencies'
    altText: 'Conceptual: Coping with Several Aspects on the Same Target'
