  name: IAspectRepositoryService
  nameWithType: IAspectRepositoryService
  fullName: PostSharp.Aspects.IAspectRepositoryService
  type: Interface
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Service that allows determining which aspects have been applied to a given declaration, whether declaratively through custom attributes or <xref href="PostSharp.Extensibility.MulticastAttribute" data-throw-if-not-resolved="false"></xref>,

    or programmatically using <xref href="PostSharp.Aspects.IAspectProvider" data-throw-if-not-resolved="false"></xref>.
  remarks: <p>To get an instance of this service, use the <xref href="PostSharp.Extensibility.IProject.GetService%60%601(System.Boolean)" data-throw-if-not-resolved="false"></xref> method from <code>PostSharpEnvironment.CurrentProject.GetService</code>.</p>
  example: []
  syntax:
    content: 'public interface IAspectRepositoryService : IService'
    content.vb: Public Interface IAspectRepositoryService Inherits IService
