  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Gets the list of aspect instances on a given declaration.
  example: []
  syntax:
    content: IAspectInstance[] GetAspectInstances(object declaration)
    parameters:
    - id: declaration
      type: System.Object
      description: The declaration (in the current assembly) for which the list of aspect instances is required.
    return:
      type: PostSharp.Aspects.IAspectInstance[]
      description: The list of aspect instances applied on <code class="paramref">declaration</code>.
    content.vb: Function GetAspectInstances(declaration As Object) As IAspectInstance()
