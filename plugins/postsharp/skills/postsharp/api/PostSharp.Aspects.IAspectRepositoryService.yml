- uid: PostSharp.Aspects.IAspectRepositoryService.HasAspect(System.Object,System.Type)
  commentId: M:PostSharp.Aspects.IAspectRepositoryService.HasAspect(System.Object,System.Type)
  id: HasAspect(System.Object,System.Type)
  parent: PostSharp.Aspects.IAspectRepositoryService
  langs:
  - csharp
  - vb
  name: HasAspect(object, Type)
  nameWithType: IAspectRepositoryService.HasAspect(object, Type)
  fullName: PostSharp.Aspects.IAspectRepositoryService.HasAspect(object, System.Type)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Determines whether an aspect of a given type has been applied to a given declaration.
  example: []
  syntax:
    content: bool HasAspect(object declaration, Type aspectType)
    parameters:
    - id: declaration
      type: System.Object
      description: The declaration on which the presence of the aspect must be checked.
    - id: aspectType
      type: System.Type
      description: The type of aspect.
    return:
      type: System.Boolean
      description: <code>true</code> if an aspect of type <code class="paramref">aspectType</code> has been applied to <code class="paramref">declaration</code>, otherwise <code>false</code>.
    content.vb: Function HasAspect(declaration As Object, aspectType As Type) As Boolean
  overload: PostSharp.Aspects.IAspectRepositoryService.HasAspect*
  nameWithType.vb: IAspectRepositoryService.HasAspect(Object, Type)
  fullName.vb: PostSharp.Aspects.IAspectRepositoryService.HasAspect(Object, System.Type)
  name.vb: HasAspect(Object, Type)
