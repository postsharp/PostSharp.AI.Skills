  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording.Operations
  summary: Represents an <xref href="PostSharp.Patterns.Recording.Operation" data-throw-if-not-resolved="false"></xref> composed of other sub-operations.
  remarks: >-
    <p>The <xref href="PostSharp.Patterns.Recording.Operations.CompositeOperation.OperationDescriptor" data-throw-if-not-resolved="false"></xref> is typically not identical to the <xref href="PostSharp.Patterns.Recording.Operations.CompositeOperation" data-throw-if-not-resolved="false"></xref> itself.</p>

    <p>The logical operations that the <xref href="PostSharp.Patterns.Recording.Recorder.UndoOperations" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Recording.Recorder.RedoOperations" data-throw-if-not-resolved="false"></xref> collections expose
        to users are typically composite operations that group the primitive changes made within a <xref href="PostSharp.Patterns.Recording.RecordingScope" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: >-
      [Obsolete("[Recordable] aspect and its components are deprecated and will be removed in a future version.", false)]

      public sealed class CompositeOperation : Operation, IOperationDescriptor
    content.vb: >-
      <Obsolete("[Recordable] aspect and its components are deprecated and will be removed in a future version.", False)>

      Public NotInheritable Class CompositeOperation Inherits Operation Implements IOperationDescriptor
