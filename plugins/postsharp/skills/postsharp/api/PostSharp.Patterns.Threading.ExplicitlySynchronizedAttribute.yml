- uid: PostSharp.Patterns.Threading.ExplicitlySynchronizedAttribute.AppliesToMethodOnly
  commentId: P:PostSharp.Patterns.Threading.ExplicitlySynchronizedAttribute.AppliesToMethodOnly
  id: AppliesToMethodOnly
  parent: PostSharp.Patterns.Threading.ExplicitlySynchronizedAttribute
  langs:
  - csharp
  - vb
  name: AppliesToMethodOnly
  nameWithType: ExplicitlySynchronizedAttribute.AppliesToMethodOnly
  fullName: PostSharp.Patterns.Threading.ExplicitlySynchronizedAttribute.AppliesToMethodOnly
  type: Property
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Gets a value that determines the synchronization strategy.

    When <xref href="PostSharp.Patterns.Threading.ExplicitlySynchronizedAttribute.AppliesToMethodOnly" data-throw-if-not-resolved="false"></xref> is <code>true</code>, no synchronization code is added to the target method.

    When it is <code>false</code>, synchronization code is added to allow the method to access other fields or methods of the target object.

    The default value is <code>false</code>.

    This property is ignored when the custom attribute is applied to a property.
  example: []
