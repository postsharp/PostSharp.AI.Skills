- uid: PostSharp.Aspects.Advices.IntroduceFieldIncompatibleAction
  commentId: T:PostSharp.Aspects.Advices.IntroduceFieldIncompatibleAction
  id: IntroduceFieldIncompatibleAction
  parent: PostSharp.Aspects.Advices
  children:
