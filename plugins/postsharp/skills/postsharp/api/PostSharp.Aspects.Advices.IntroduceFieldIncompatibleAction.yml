  - PostSharp.Aspects.Advices.IntroduceFieldIncompatibleAction.IntroduceAnother
  langs:
  - csharp
  - vb
  name: IntroduceFieldIncompatibleAction
  nameWithType: IntroduceFieldIncompatibleAction
  fullName: PostSharp.Aspects.Advices.IntroduceFieldIncompatibleAction
  type: Enum
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Specifies what an <xref href="PostSharp.Aspects.Advices.IntroduceFieldAdviceInstance" data-throw-if-not-resolved="false"></xref> does when a member of the target type has the requested name but is not a

    compatible field, for instance a property, a method, or a field of another type or static kind.
  remarks: >-
    <p>This applies only to a request that has a <xref href="PostSharp.Aspects.Advices.IntroduceFieldAdviceInstance.Name" data-throw-if-not-resolved="false"></xref>: a request without a name finds fields by
        their type, and its new field gets a generated name that cannot conflict with another member.</p>
  example: []
  syntax:
    content: public enum IntroduceFieldIncompatibleAction
    content.vb: Public Enum IntroduceFieldIncompatibleAction
  seealso:
  - linkId: PostSharp.Aspects.Advices.IntroduceFieldAdviceInstance.WhenIncompatibleMemberExists
    commentId: P:PostSharp.Aspects.Advices.IntroduceFieldAdviceInstance.WhenIncompatibleMemberExists
  - linkType: HRef
    linkId: '@advice-provider'
    altText: 'Conceptual: Providing Advices Dynamically'
