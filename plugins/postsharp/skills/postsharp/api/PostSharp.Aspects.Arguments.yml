  name: Arguments
  nameWithType: Arguments
  fullName: PostSharp.Aspects.Arguments
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Encapsulation of method arguments.
  remarks: >-
    <div class="NOTE"><h5>note</h5><p>
            As a result of optimizations, an <xref href="PostSharp.Aspects.Arguments" data-throw-if-not-resolved="false"></xref> object may be shared between different 
            advices. If an advice implementation needs to access an <xref href="PostSharp.Aspects.Arguments" data-throw-if-not-resolved="false"></xref> object after it has given up
            control, it should take a reference to a clone instead of the initial object itself.
          </p></div>
    <div class="NOTE"><h5>note</h5><p>
            Implementations of this type should be considered an implementation detail and should not be accessed
            by user code.
          </p></div>
  example: []
