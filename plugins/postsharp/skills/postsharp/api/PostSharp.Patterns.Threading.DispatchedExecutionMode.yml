- uid: PostSharp.Patterns.Threading.DispatchedExecutionMode.NonBlocking
  commentId: F:PostSharp.Patterns.Threading.DispatchedExecutionMode.NonBlocking
  id: NonBlocking
  parent: PostSharp.Patterns.Threading.DispatchedExecutionMode
  langs:
  - csharp
  - vb
  name: NonBlocking
  nameWithType: DispatchedExecutionMode.NonBlocking
  fullName: PostSharp.Patterns.Threading.DispatchedExecutionMode.NonBlocking
  type: Field
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    The caller never waits for the called method. The method is enqueued

    for later execution even on the same context. Methods that have a non-<code>void</code> return type or 

    <code>ref</code> or <code>out</code> parameters cannot be dispatched in non-blocking mode.
  example: []
  syntax:
    content: NonBlocking = 1
    return:
      type: PostSharp.Patterns.Threading.DispatchedExecutionMode
- uid: PostSharp.Patterns.Threading.DispatchedExecutionMode.NonBlockingContextSwitch
  commentId: F:PostSharp.Patterns.Threading.DispatchedExecutionMode.NonBlockingContextSwitch
  id: NonBlockingContextSwitch
  parent: PostSharp.Patterns.Threading.DispatchedExecutionMode
  langs:
  - csharp
  - vb
  name: NonBlockingContextSwitch
  nameWithType: DispatchedExecutionMode.NonBlockingContextSwitch
  fullName: PostSharp.Patterns.Threading.DispatchedExecutionMode.NonBlockingContextSwitch
  type: Field
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    If the caller context equals the target context (for example, if the caller is the UI thread and the object is affine

    to the UI thread), the method is invoked immediately in the current context in a blocking way. Otherwise,

    if a context switch is necessary, the method call is enqueued for later execution and the caller continues without waiting.

    Methods that have a non-<code>void</code> return type or <code>ref</code> or <code>out</code> parameters cannot be dispatched in non-blocking mode.
  example: []
  syntax:
    content: NonBlockingContextSwitch = 2
    return:
      type: PostSharp.Patterns.Threading.DispatchedExecutionMode
