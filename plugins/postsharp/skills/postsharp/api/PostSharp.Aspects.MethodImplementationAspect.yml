      <AttributeUsage(AttributeTargets.AssemblyOrAttributeTargets.ClassOrAttributeTargets.StructOrAttributeTargets.MethodOrAttributeTargets.PropertyOrAttributeTargets.EventOrAttributeTargets.Interface, AllowMultiple:=True)>

      <Serializer(Nothing)>

      Public MustInherit Class MethodImplementationAspect Inherits MethodLevelAspect Implements IMethodLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, IMethodInterceptionAspect, IMethodLevelAspect, IAspect
