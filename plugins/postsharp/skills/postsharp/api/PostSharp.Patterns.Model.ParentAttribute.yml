  fullName: PostSharp.Patterns.Model.ParentAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: >-
    Custom attribute that, when applied to a field or automatic property, specifies that this field or property

    should be automatically set to the parent of the instance of the declaring type, whenever this instance

    is attached as a child to another object.
  remarks: >-
    <p>It is recommended to add this custom attribute only to private fields or automatic properties
        with a private setter.</p>
    <p>User code should not set the field or property. When the parent of the instance is a parent surrogate, such as a child collection,
        the field or property is set to the owner of the parent surrogate and not to the parent surrogate itself.</p>
    <p>The declaring class must have the <xref href="PostSharp.Patterns.Model.AggregatableAttribute" data-throw-if-not-resolved="false"></xref> aspect, applied directly or through another aspect such as a threading model.
        Otherwise, PostSharp emits a warning.</p>
  example: []
