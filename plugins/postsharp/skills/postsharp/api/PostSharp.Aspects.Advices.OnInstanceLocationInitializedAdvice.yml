  name: OnInstanceLocationInitializedAdvice
  nameWithType: OnInstanceLocationInitializedAdvice
  fullName: PostSharp.Aspects.Advices.OnInstanceLocationInitializedAdvice
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Custom attribute that, when applied on a method of an aspect class, specifies

    that this method is an advice that has the same semantics as <xref href="PostSharp.Aspects.IOnInstanceLocationInitializedAspect.OnInstanceLocationInitialized(PostSharp.Aspects.LocationInitializationArgs)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
            The method to which this custom attribute is applied must be public and must have the same signature as
            <xref href="PostSharp.Aspects.IOnInstanceLocationInitializedAspect.OnInstanceLocationInitialized(PostSharp.Aspects.LocationInitializationArgs)" data-throw-if-not-resolved="false"></xref>. However, it can be static.
          </p>
    <p>
            A master advice without a custom attribute derived from <xref href="PostSharp.Aspects.Advices.Pointcut" data-throw-if-not-resolved="false"></xref> applies to the field or property to which the aspect is applied; when the aspect is applied to another kind of declaration, a pointcut is required. An advice without <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Master" data-throw-if-not-resolved="false"></xref> and without pointcut joins
            the group of the master advice declared in its class.
          </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method, AllowMultiple = true, Inherited = true)]

      public sealed class OnInstanceLocationInitializedAdvice : GroupingAdvice
    content.vb: >-
      <AttributeUsage(AttributeTargets.Method, AllowMultiple:=True, Inherited:=True)>

      Public NotInheritable Class OnInstanceLocationInitializedAdvice Inherits GroupingAdvice
