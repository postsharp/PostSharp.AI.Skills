  summary: >-
    Defines methods that are called when an exception occurs in the <xref href="PostSharp.Patterns.Diagnostics.Logger" data-throw-if-not-resolved="false"></xref> class. This interface

    can be implemented by any class that implements the <xref href="PostSharp.Patterns.Diagnostics.Custom.ILogger" data-throw-if-not-resolved="false"></xref> interface.

    When an <xref href="PostSharp.Patterns.Diagnostics.Custom.ILogger" data-throw-if-not-resolved="false"></xref> does not implement this interface, logging exceptions are silently ignored.
