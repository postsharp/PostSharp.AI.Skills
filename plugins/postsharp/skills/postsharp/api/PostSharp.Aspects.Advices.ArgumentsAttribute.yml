  namespace: PostSharp.Aspects.Advices
  summary: Binds a parameter of an advice method to an <xref href="PostSharp.Aspects.Arguments" data-throw-if-not-resolved="false"></xref> object that holds all the arguments of the target method.
  remarks: >-
    <p>
        The parameter must be of type <xref href="PostSharp.Aspects.Arguments" data-throw-if-not-resolved="false"></xref> or <xref href="System.Object" data-throw-if-not-resolved="false"></xref>, and it cannot be <code>ref</code>, <code>in</code> or <code>out</code>. A new <xref href="PostSharp.Aspects.Arguments" data-throw-if-not-resolved="false"></xref> object is allocated
        on each call of the advice. To read some arguments without this allocation, use <xref href="PostSharp.Aspects.Advices.ArgumentAttribute" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>
        This attribute can be used in the method boundary advices and in <xref href="PostSharp.Aspects.Advices.OnMethodInvokeAdvice" data-throw-if-not-resolved="false"></xref>, where the object is typically
        passed to the binding received through <xref href="PostSharp.Aspects.Advices.BindingAttribute" data-throw-if-not-resolved="false"></xref> to invoke the target method.
        </p>
  example: []
