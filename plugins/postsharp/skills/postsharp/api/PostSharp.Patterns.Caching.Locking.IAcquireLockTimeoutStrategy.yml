  name: OnTimeout(string)
  nameWithType: IAcquireLockTimeoutStrategy.OnTimeout(string)
  fullName: PostSharp.Patterns.Caching.Locking.IAcquireLockTimeoutStrategy.OnTimeout(string)
  type: Method
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching.Locking
  summary: >-
    Method invoked when the caching aspect cannot acquire a lock because of a timeout. If this method returns without an exception,

    the caching aspect will invoke the cached method without acquiring the lock.
  example: []
  syntax:
    content: void OnTimeout(string key)
    parameters:
    - id: key
      type: System.String
      description: The cache key, which is the name of the lock.
