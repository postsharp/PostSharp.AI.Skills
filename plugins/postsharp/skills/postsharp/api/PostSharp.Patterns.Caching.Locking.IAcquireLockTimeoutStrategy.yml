  type: Interface
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching.Locking
  summary: Represents the behavior when the caching aspect cannot acquire a lock because of a timeout.
  remarks: >-
    <p>Assign an implementation to the <xref href="PostSharp.Patterns.Caching.CachingProfile.AcquireLockTimeoutStrategy" data-throw-if-not-resolved="false"></xref> property. The timeout is set by
        <xref href="PostSharp.Patterns.Caching.CachingProfile.AcquireLockTimeout" data-throw-if-not-resolved="false"></xref>, which is infinite by default. The default strategy throws a <xref href="System.TimeoutException" data-throw-if-not-resolved="false"></xref>.</p>
