  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.DynamicAdvising
  summary: Provides methods to help with the use of dynamic advices.
  remarks: >-
    <p>Some patterns, such as Aggregatable, Recordable or the threading models, add advices to advisable collections such as
        <xref href="PostSharp.Patterns.Collections.AdvisableCollection%601" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Collections.AdvisableDictionary%602" data-throw-if-not-resolved="false"></xref>
        at run time. The interfaces that these advices implement are not implemented by the type of the collection, so a cast to them fails.
        Use <xref href="PostSharp.Patterns.DynamicAdvising.DynamicAdvisingServices.QueryInterface%60%601(System.Object%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> instead of a cast to get them.</p>
  example: []
