- uid: PostSharp.Patterns.DynamicAdvising.DynamicAdvisingServices.QueryInterface``1(System.Object,System.Boolean)
  commentId: M:PostSharp.Patterns.DynamicAdvising.DynamicAdvisingServices.QueryInterface``1(System.Object,System.Boolean)
  id: QueryInterface``1(System.Object,System.Boolean)
  parent: PostSharp.Patterns.DynamicAdvising.DynamicAdvisingServices
  langs:
  - csharp
  - vb
  name: QueryInterface<T>(object, bool)
  nameWithType: DynamicAdvisingServices.QueryInterface<T>(object, bool)
  fullName: PostSharp.Patterns.DynamicAdvising.DynamicAdvisingServices.QueryInterface<T>(object, bool)
  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.DynamicAdvising
  summary: Gets the implementation of a specified interface for the specified object.
  remarks: >-
    <p>This method shall return <code class="paramref">obj</code> if the type of <code class="paramref">obj</code> statically implements the interface. Otherwise,
        the method shall return another object that implements <code class="typeparamref">T</code> on behalf of <code class="paramref">obj</code>. In this case,
        the returned object shall implement the <xref href="PostSharp.Patterns.DynamicAdvising.IDynamicInterfaceImplementation" data-throw-if-not-resolved="false"></xref> interface, which allows navigating back to <code class="paramref">obj</code>.</p>
  example: []
  syntax:
    content: 'public static T QueryInterface<T>(object obj, bool throwing = true) where T : class'
    parameters:
    - id: obj
      type: System.Object
      description: The object for which the interface should be queried.
    - id: throwing
      type: System.Boolean
      description: >-
        <code>true</code> if the method should throw a <xref href="System.InvalidCastException" data-throw-if-not-resolved="false"></xref> if <code class="paramref">obj</code> does not implement the
            <code class="typeparamref">T</code> interface, <code>false</code> if <code>null</code> should be returned instead. The default value is <code>true</code>.
    typeParameters:
    - id: T
      description: The type of the required interface.
    return:
      type: '{T}'
      description: >-
        An object implementing the <code class="typeparamref">T</code> interface on behalf of <code class="paramref">obj</code>, or <code>null</code>
                    if <code class="paramref">obj</code> does not implement <code class="typeparamref">T</code> and <code class="paramref">throwing</code> is <code>false</code>.
    content.vb: Public Shared Function QueryInterface(Of T As Class)(obj As Object, throwing As Boolean = True) As T
  overload: PostSharp.Patterns.DynamicAdvising.DynamicAdvisingServices.QueryInterface*
  nameWithType.vb: DynamicAdvisingServices.QueryInterface(Of T)(Object, Boolean)
  fullName.vb: PostSharp.Patterns.DynamicAdvising.DynamicAdvisingServices.QueryInterface(Of T)(Object, Boolean)
  name.vb: QueryInterface(Of T)(Object, Boolean)
