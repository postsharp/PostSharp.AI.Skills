  fullName: PostSharp.Constraints.InternalAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Constraints
  summary: >-
    <xref href="PostSharp.Constraints.ReferentialConstraint" data-throw-if-not-resolved="false"></xref>, when applied to a declaration, prevents it from being used from a different assembly. 
        This constraint can be used when a declaration must be made public for technical reasons, but its author does
        not want it to be used in external code.
  remarks: >-
    <p>The constraint applies only to public declarations: applying it to a declaration that is not public emits the error <code>AR0104</code>.
        A use from another assembly that is not granted access by <xref href="System.Runtime.CompilerServices.InternalsVisibleToAttribute" data-throw-if-not-resolved="false"></xref> emits the warning <code>AR0105</code>. Set <xref href="PostSharp.Constraints.InternalAttribute.Severity" data-throw-if-not-resolved="false"></xref> to <xref href="PostSharp.Extensibility.SeverityType.Error" data-throw-if-not-resolved="false"></xref> to make it an error.
        <xref href="PostSharp.Extensibility.SuppressWarningAttribute" data-throw-if-not-resolved="false"></xref> can suppress the warning where the declaration is used, but cannot suppress an error.</p>
    <p>The referencing project must be processed by PostSharp for the constraint to be validated.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Module|AttributeTargets.Class|AttributeTargets.Struct|AttributeTargets.Enum|AttributeTargets.Constructor|AttributeTargets.Method|AttributeTargets.Property|AttributeTargets.Field|AttributeTargets.Event|AttributeTargets.Interface|AttributeTargets.Delegate, AllowMultiple = true)]

      [MulticastAttributeUsage(MulticastTargets.AnyType|MulticastTargets.Field|MulticastTargets.Method|MulticastTargets.InstanceConstructor, TargetMemberAttributes = MulticastAttributes.Public, TargetTypeAttributes = MulticastAttributes.Public|MulticastAttributes.UserGenerated)]

      public sealed class InternalAttribute : ReferentialConstraint, IReferentialConstraint, IConstraint
    content.vb: >-
      <AttributeUsage(AttributeTargets.AssemblyOrAttributeTargets.ModuleOrAttributeTargets.ClassOrAttributeTargets.StructOrAttributeTargets.EnumOrAttributeTargets.ConstructorOrAttributeTargets.MethodOrAttributeTargets.PropertyOrAttributeTargets.FieldOrAttributeTargets.EventOrAttributeTargets.InterfaceOrAttributeTargets.Delegate, AllowMultiple:=True)>

      <MulticastAttributeUsage(MulticastTargets.AnyTypeOrMulticastTargets.FieldOrMulticastTargets.MethodOrMulticastTargets.InstanceConstructor, TargetMemberAttributes:=MulticastAttributes.Public, TargetTypeAttributes:=MulticastAttributes.PublicOrMulticastAttributes.UserGenerated)>

      Public NotInheritable Class InternalAttribute Inherits ReferentialConstraint Implements IReferentialConstraint, IConstraint
