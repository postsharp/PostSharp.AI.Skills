- uid: PostSharp.Aspects.Advices.ImportMemberAttribute.Order
  commentId: P:PostSharp.Aspects.Advices.ImportMemberAttribute.Order
  id: Order
  parent: PostSharp.Aspects.Advices.ImportMemberAttribute
  langs:
  - csharp
  - vb
  name: Order
  nameWithType: ImportMemberAttribute.Order
  fullName: PostSharp.Aspects.Advices.ImportMemberAttribute.Order
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Gets or sets the moment when the member should be imported: either before (<xref href="PostSharp.Aspects.Advices.ImportMemberOrder.BeforeIntroductions" data-throw-if-not-resolved="false"></xref>)

    or after (<xref href="PostSharp.Aspects.Advices.ImportMemberOrder.AfterIntroductions" data-throw-if-not-resolved="false"></xref>) members have been introduced by the current aspect.

    The default is <xref href="PostSharp.Aspects.Advices.ImportMemberOrder.AfterIntroductions" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    Sometimes, it makes sense for an aspect to import a member after the same aspect has introduced the member.

    This allows the aspect to invoke a member that could be overridden by later aspects.
  example: []
  syntax:
    content: public ImportMemberOrder Order { get; set; }
    parameters: []
    return:
      type: PostSharp.Aspects.Advices.ImportMemberOrder
    content.vb: Public Property Order As ImportMemberOrder
  overload: PostSharp.Aspects.Advices.ImportMemberAttribute.Order*
