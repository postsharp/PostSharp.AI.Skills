  name: Message
  nameWithType: Message
  fullName: PostSharp.Extensibility.Message
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: Encapsulates a message, such as an error, a warning or an information message.
  remarks: >-
    <p>Build-time code, such as an implementation of <xref href="PostSharp.Extensibility.IValidableAnnotation.CompileTimeValidate(System.Object)" data-throw-if-not-resolved="false"></xref>, emits messages with the
        static <code>Write</code> methods of this class. They appear in the build output and in Visual Studio. Each message has a severity, an identifier,
        a text, and preferably a location: users can suppress a warning on a specific element of code with <xref href="PostSharp.Extensibility.SuppressWarningAttribute" data-throw-if-not-resolved="false"></xref>
        only when the message has a location. Pass the message arguments to the <code>Write</code> methods instead of formatting the text yourself,
        so that PostSharp can render arguments such as reflection objects in a readable way.</p>
    <p>To keep the texts of many messages in a single place, emit them through a <xref href="PostSharp.Extensibility.MessageSource" data-throw-if-not-resolved="false"></xref> instead.</p>
  example: []
  syntax:
    content: public sealed class Message
    content.vb: Public NotInheritable Class Message
