  fullName: PostSharp.Patterns.Threading.ActorAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Custom attribute that, when applied to a class, applies the <xref href="PostSharp.Patterns.Threading.Models.ActorThreadingModel" data-throw-if-not-resolved="false"></xref> to this class.

    In this model, calls to methods are processed asynchronously by a single thread, which suppresses concurrency inside each instance of the target class.
  remarks: >-
    <p>
        Calls to public methods of actors are packaged into messages and appended to a message queue. This message queue is processed
        by a single thread. Therefore, there is never more than one thread accessing the object, which makes
        the object thread-safe.
        </p>
    <p>Public methods cannot have <code>out</code> or <code>ref</code> parameters. All method invocations are appended to the message queue. If the method has a return value and is
        not <code>async</code>, the calling thread waits synchronously for the actor to execute the method. Add the
        <xref href="PostSharp.Patterns.Threading.ExplicitlySynchronizedAttribute" data-throw-if-not-resolved="false"></xref> custom attribute to a method to prevent its execution from being dispatched to the actor queue. Note that using <xref href="PostSharp.Patterns.Threading.ExplicitlySynchronizedAttribute" data-throw-if-not-resolved="false"></xref>
        breaks the thread-safety guarantees of the <xref href="PostSharp.Patterns.Threading.Models.ActorThreadingModel" data-throw-if-not-resolved="false"></xref>.
         </p>
    <p>
        Several actors can share the same message queue by sharing the same instance of the <xref href="PostSharp.Patterns.Threading.IActorDispatcher" data-throw-if-not-resolved="false"></xref> interface,
        which the target class can provide by implementing the <xref href="PostSharp.Patterns.Threading.IDispatcherObject" data-throw-if-not-resolved="false"></xref> interface.
        </p>
    <p>
        The message queue is processed in the <xref href="System.Threading.ThreadPool" data-throw-if-not-resolved="false"></xref>, not in a thread dedicated to each instance, so an application
        can have a large number of actors.
        </p>
    <p>
        The aspect emits a build-time error when the class has public or internal instance fields, or when an <code>async</code> method
        is not annotated with the <xref href="PostSharp.Patterns.Threading.ReentrantAttribute" data-throw-if-not-resolved="false"></xref> custom attribute. When run-time verification is enabled (see <xref href="PostSharp.Patterns.Threading.ThreadAwareAttribute.RuntimeVerificationEnabled" data-throw-if-not-resolved="false"></xref>), an access to a field from a context
        that does not have access to the actor results in a <xref href="PostSharp.Patterns.Threading.ThreadMismatchException" data-throw-if-not-resolved="false"></xref>. This typically happens in a private
        callback method, such as an event handler; add the <xref href="PostSharp.Patterns.Threading.EntryPointAttribute" data-throw-if-not-resolved="false"></xref> custom attribute to such methods.
        </p>
    <p>
        To give an actor a state composed of several objects, declare the child objects with the <xref href="PostSharp.Patterns.Model.ChildAttribute" data-throw-if-not-resolved="false"></xref> custom attribute
        and annotate their classes with the <xref href="PostSharp.Patterns.Threading.PrivateThreadAwareAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.
        </p>
  example: []
  syntax:
    content: >-
      [ProvideAspectRole("ThreadingModel")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "Tracing")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "Caching")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "CacheInvalidation")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Validation")]

      [Metric("UsedFeatures", "PostSharp.Patterns.Threading.Actor")]

      [IntroduceInterface(typeof(IActor), AncestorOverrideAction = InterfaceOverrideAction.Ignore, OverrideAction = InterfaceOverrideAction.Ignore)]

      [Serializer(typeof(ActorAttribute.Serializer))]

      public sealed class ActorAttribute : ThreadAwareAttribute, ITypeLevelAspect, ITypeLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, ICloneAwareAspect, IInstanceScopedAspect, IAspectProvider, IService, IAdviceProvider, IAspect, IQueryInterface, IActor, IDispatcherObject, IThreadAware
