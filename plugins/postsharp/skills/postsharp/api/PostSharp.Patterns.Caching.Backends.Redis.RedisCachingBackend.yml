  name: RedisCachingBackend
  nameWithType: RedisCachingBackend
  fullName: PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackend
  type: Class
  assemblies:
  - PostSharp.Patterns.Caching.Backends.Redis
  namespace: PostSharp.Patterns.Caching.Backends.Redis
  summary: A <xref href="PostSharp.Patterns.Caching.Implementation.CachingBackend" data-throw-if-not-resolved="false"></xref> for Redis, based on the <code>StackExchange.Redis</code> client.
  remarks: >-
    <p>Create instances with the <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackend.Create(StackExchange.Redis.IConnectionMultiplexer%2cPostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration)" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackend.CreateAsync(StackExchange.Redis.IConnectionMultiplexer%2cPostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> method, which take a <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration" data-throw-if-not-resolved="false"></xref>.
        Depending on the configuration, these methods return a backend that supports dependencies
        (see <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.SupportsDependencies" data-throw-if-not-resolved="false"></xref>), or an enhancer that adds a local in-memory cache in front of Redis
        (see <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.IsLocallyCached" data-throw-if-not-resolved="false"></xref>).</p>
    <p>Dependencies are disabled by default because they store dependency graphs in Redis and require a <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCacheDependencyGarbageCollector" data-throw-if-not-resolved="false"></xref>
        to run continuously.</p>
    <p>Redis keys start with <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.KeyPrefix" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackend.SchemaVersion" data-throw-if-not-resolved="false"></xref>, so applications
        with different prefixes, or different versions of this component, can share a Redis database without conflicts.
        <xref href="PostSharp.Patterns.Caching.Implementation.CachingBackend.ClearAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> removes only the keys of the current prefix and schema version.</p>
    <p>This component writes warnings and errors through PostSharp Logging. Configure a logging backend to monitor them.</p>
  example: []
  syntax:
    content: 'public class RedisCachingBackend : CachingBackend, IDisposable'
    content.vb: Public Class RedisCachingBackend Inherits CachingBackend Implements IDisposable
