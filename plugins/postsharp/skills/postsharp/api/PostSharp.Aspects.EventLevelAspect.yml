  syntax:
    content: public virtual bool CompileTimeValidate(EventInfo targetEvent)
    parameters:
    - id: targetEvent
      type: System.Reflection.EventInfo
      description: Event to which the aspect has been applied.
    return:
      type: System.Boolean
      description: >-
        <code>true</code> if the aspect was applied to an acceptable event, otherwise
              <code>false</code>.
