  fullName: PostSharp.Aspects.UnsupportedTargetAction.Fallback
  type: Field
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Fall back to a supported advising strategy if any is available, for example from semantic advising (taking into account async semantics) to non-semantic advising.

    If no fallback is available, emit a build-time error.
  example: []
  syntax:
    content: Fallback = 2
    return:
      type: PostSharp.Aspects.UnsupportedTargetAction
