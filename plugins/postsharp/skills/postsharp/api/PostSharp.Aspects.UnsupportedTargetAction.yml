  fullName: PostSharp.Aspects.UnsupportedTargetAction.Ignore
  type: Field
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Do not apply the advice when the target declaration is not supported, but do not emit a build error.
  example: []
