  name: OnMethodInvokeAdvice
  nameWithType: OnMethodInvokeAdvice
  fullName: PostSharp.Aspects.Advices.OnMethodInvokeAdvice
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Custom attribute that, when applied on a method of an aspect class, specifies

    that this method is an advice that has the same semantics as <xref href="PostSharp.Aspects.IMethodInterceptionAspect.OnInvoke(PostSharp.Aspects.MethodInterceptionArgs)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
            The method to which this custom attribute is applied must be public and must return <code>void</code>. It can be static.
            Each parameter of the method receives a value of the target, selected by a custom attribute derived from
            <xref href="PostSharp.Aspects.Advices.AdviceParameterAttribute" data-throw-if-not-resolved="false"></xref>, such as <xref href="PostSharp.Aspects.Advices.BindingAttribute" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.ArgumentsAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Aspects.Advices.ReturnValueAttribute" data-throw-if-not-resolved="false"></xref>.
            Alternatively, the method can have the same signature as <xref href="PostSharp.Aspects.IMethodInterceptionAspect.OnInvoke(PostSharp.Aspects.MethodInterceptionArgs)" data-throw-if-not-resolved="false"></xref>,
            whose <xref href="PostSharp.Aspects.MethodInterceptionArgs" data-throw-if-not-resolved="false"></xref> parameter is allocated on each call. The <xref href="PostSharp.Aspects.MethodInterceptionArgs" data-throw-if-not-resolved="false"></xref> parameter can also be the first parameter,
            followed by bound parameters.
          </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method, AllowMultiple = true, Inherited = true)]

      public sealed class OnMethodInvokeAdvice : OnMethodInvokeBaseAdvice
    content.vb: >-
      <AttributeUsage(AttributeTargets.Method, AllowMultiple:=True, Inherited:=True)>

      Public NotInheritable Class OnMethodInvokeAdvice Inherits OnMethodInvokeBaseAdvice
