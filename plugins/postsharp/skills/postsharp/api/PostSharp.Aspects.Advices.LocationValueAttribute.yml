  namespace: PostSharp.Aspects.Advices
  summary: Binds a parameter of a location interception advice to the value of the field or property.
  remarks: >-
    <p>
        In <xref href="PostSharp.Aspects.Advices.OnLocationGetValueAdvice" data-throw-if-not-resolved="false"></xref>, the parameter must be <code>out</code> or <code>ref</code>, and the value that the advice
        assigns to it is the value returned by the getter. A get advice must have either a parameter bound by this attribute or a
        <xref href="PostSharp.Aspects.LocationInterceptionArgs" data-throw-if-not-resolved="false"></xref> parameter.
        </p>
    <p>
        In <xref href="PostSharp.Aspects.Advices.OnLocationSetValueAdvice" data-throw-if-not-resolved="false"></xref>, the parameter receives the value assigned to the field or property.
        </p>
    <p>
        The type of the parameter must be the type of the field or property, or a type parameter of the advice method.
        </p>
  example: []
  syntax:
    content: 'public sealed class LocationValueAttribute : AdviceParameterAttribute'
    content.vb: Public NotInheritable Class LocationValueAttribute Inherits AdviceParameterAttribute
