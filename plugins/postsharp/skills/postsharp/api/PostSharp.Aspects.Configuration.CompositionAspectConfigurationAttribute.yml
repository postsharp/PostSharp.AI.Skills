- uid: PostSharp.Aspects.Configuration.CompositionAspectConfigurationAttribute.NonSerializedImplementation
  commentId: P:PostSharp.Aspects.Configuration.CompositionAspectConfigurationAttribute.NonSerializedImplementation
  id: NonSerializedImplementation
  parent: PostSharp.Aspects.Configuration.CompositionAspectConfigurationAttribute
  langs:
  - csharp
  - vb
  name: NonSerializedImplementation
  nameWithType: CompositionAspectConfigurationAttribute.NonSerializedImplementation
  fullName: PostSharp.Aspects.Configuration.CompositionAspectConfigurationAttribute.NonSerializedImplementation
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Configuration
  summary: >-
    Gets or sets a value indicating whether the field containing the interface implementation (and storing the object returned by

    <xref href="PostSharp.Aspects.ICompositionAspect.CreateImplementationObject(PostSharp.Aspects.AdviceArgs)" data-throw-if-not-resolved="false"></xref>) should be excluded from serialization by <xref href="System.Runtime.Serialization.Formatters.Binary.BinaryFormatter" data-throw-if-not-resolved="false"></xref>.

    The same effect is typically obtained by applying the <xref href="System.NonSerializedAttribute" data-throw-if-not-resolved="false"></xref> custom attribute to the field.
  example: []
  syntax:
    content: public bool NonSerializedImplementation { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property NonSerializedImplementation As Boolean
  overload: PostSharp.Aspects.Configuration.CompositionAspectConfigurationAttribute.NonSerializedImplementation*
