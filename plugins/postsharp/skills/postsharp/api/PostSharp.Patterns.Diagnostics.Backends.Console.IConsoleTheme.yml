  name: IConsoleTheme
  nameWithType: IConsoleTheme
  fullName: PostSharp.Patterns.Diagnostics.Backends.Console.IConsoleTheme
  type: Interface
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Backends.Console
  summary: >-
    Exposes the semantics of a console color theme. A simple implementation is provided by the <xref href="PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleTheme" data-throw-if-not-resolved="false"></xref> class,

    and ready-made themes are exposed on the <xref href="PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleThemes" data-throw-if-not-resolved="false"></xref> class.
  remarks: >-
    <p>Implement this interface directly only when <xref href="PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleTheme" data-throw-if-not-resolved="false"></xref>, which allows two styles per <xref href="PostSharp.Patterns.Diagnostics.LogLevel" data-throw-if-not-resolved="false"></xref>, is too
        restrictive. Assign the theme to <xref href="PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleLoggingBackendOptions.Theme" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public interface IConsoleTheme
    content.vb: Public Interface IConsoleTheme
