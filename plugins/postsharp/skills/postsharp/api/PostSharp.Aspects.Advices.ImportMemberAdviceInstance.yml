  name: IsRequired
  nameWithType: ImportMemberAdviceInstance.IsRequired
  fullName: PostSharp.Aspects.Advices.ImportMemberAdviceInstance.IsRequired
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Gets a value indicating whether a build-time error should be emitted if the member cannot be found.

    If <code>false</code>, the binding field is <code>null</code> when the imported member is absent.
  remarks: <p>This property is always <code>true</code> when the <xref href="PostSharp.Aspects.Advices.ImportMemberAdviceInstance.Member" data-throw-if-not-resolved="false"></xref> property is set.</p>
  example: []
  syntax:
    content: public bool IsRequired { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public ReadOnly Property IsRequired As Boolean
  overload: PostSharp.Aspects.Advices.ImportMemberAdviceInstance.IsRequired*
