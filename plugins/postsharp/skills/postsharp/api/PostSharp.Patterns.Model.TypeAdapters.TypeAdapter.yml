  fullName: PostSharp.Patterns.Model.TypeAdapters.TypeAdapter.AttachChild(object, PostSharp.Patterns.Model.RelationshipInfo, PostSharp.Patterns.Model.IAttacher, object)
  type: Method
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model.TypeAdapters
  summary: Attaches an item to a parent. This method is typically invoked by implementations of <xref href="PostSharp.Patterns.Model.TypeAdapters.TypeAdapter.AttachToParent(System.Object%2cPostSharp.Patterns.Model.RelationshipInfo%2cPostSharp.Patterns.Model.IAttacher%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> to attach items or children to the parent.
  example: []
  syntax:
    content: protected bool AttachChild(object item, RelationshipInfo relationshipInfo, IAttacher attacher, object attacherState)
    parameters:
    - id: item
      type: System.Object
      description: The object to attach.
    - id: relationshipInfo
      type: PostSharp.Patterns.Model.RelationshipInfo
      description: The relationship of <code class="paramref">item</code> with respect to the object represented by <code class="paramref">attacher</code> and <code class="paramref">attacherState</code>.
    - id: attacher
      type: PostSharp.Patterns.Model.IAttacher
      description: An interface that represents the parent's ability to attach children.
    - id: attacherState
      type: System.Object
      description: An opaque state object to be passed to <code class="paramref">attacher</code>.
    return:
      type: System.Boolean
      description: <code>true</code> if the current object was not previously attached to any parent, <code>false</code> if it was already attached to the same parent.
    content.vb: Protected Function AttachChild(item As Object, relationshipInfo As RelationshipInfo, attacher As IAttacher, attacherState As Object) As Boolean
  overload: PostSharp.Patterns.Model.TypeAdapters.TypeAdapter.AttachChild*
  nameWithType.vb: TypeAdapter.AttachChild(Object, RelationshipInfo, IAttacher, Object)
