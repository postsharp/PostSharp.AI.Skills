- uid: PostSharp.Patterns.Model.TypeAdapters.TypeAdapter.AttachToParent(System.Object,PostSharp.Patterns.Model.RelationshipInfo,PostSharp.Patterns.Model.IAttacher,System.Object)
  commentId: M:PostSharp.Patterns.Model.TypeAdapters.TypeAdapter.AttachToParent(System.Object,PostSharp.Patterns.Model.RelationshipInfo,PostSharp.Patterns.Model.IAttacher,System.Object)
  id: AttachToParent(System.Object,PostSharp.Patterns.Model.RelationshipInfo,PostSharp.Patterns.Model.IAttacher,System.Object)
  parent: PostSharp.Patterns.Model.TypeAdapters.TypeAdapter
  langs:
  - csharp
  - vb
  name: AttachToParent(object, RelationshipInfo, IAttacher, object)
  nameWithType: TypeAdapter.AttachToParent(object, RelationshipInfo, IAttacher, object)
  fullName: PostSharp.Patterns.Model.TypeAdapters.TypeAdapter.AttachToParent(object, PostSharp.Patterns.Model.RelationshipInfo, PostSharp.Patterns.Model.IAttacher, object)
  type: Method
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model.TypeAdapters
  summary: Attaches an object to a parent object.
  remarks: >-
    <p>This method is equivalent to <xref href="PostSharp.Patterns.Model.IAttachable.AttachToParent(PostSharp.Patterns.Model.RelationshipInfo%2cPostSharp.Patterns.Model.IAttacher%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>.</p>

    <p>Implementations of this method can use the <xref href="PostSharp.Patterns.Model.TypeAdapters.TypeAdapter.AttachChild(System.Object%2cPostSharp.Patterns.Model.RelationshipInfo%2cPostSharp.Patterns.Model.IAttacher%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> method to attach items to the parent.</p>
  example: []
  syntax:
    content: public virtual bool AttachToParent(object obj, RelationshipInfo relationshipInfo, IAttacher attacher, object attacherState)
    parameters:
    - id: obj
      type: System.Object
      description: An instance of the adapted type.
    - id: relationshipInfo
      type: PostSharp.Patterns.Model.RelationshipInfo
      description: >-
        Information about the relationship of the parent node relative to the current node.
                    The <xref href="PostSharp.Patterns.Model.RelationshipInfo.Relationship" data-throw-if-not-resolved="false"></xref> property must be set to <xref href="PostSharp.Patterns.Model.RelationshipKind.Child" data-throw-if-not-resolved="false"></xref> or
                    <xref href="PostSharp.Patterns.Model.RelationshipKind.ParentSurrogate" data-throw-if-not-resolved="false"></xref>.
    - id: attacher
      type: PostSharp.Patterns.Model.IAttacher
      description: A service that allows the current node to attach itself to the parent.
    - id: attacherState
      type: System.Object
      description: An opaque state object to be passed as the first argument to all methods of the <xref href="PostSharp.Patterns.Model.IAttacher" data-throw-if-not-resolved="false"></xref> interface.
    return:
      type: System.Boolean
      description: <code>true</code> if the current object was not previously attached to any parent, <code>false</code> if it was already attached to the same parent.
    content.vb: Public Overridable Function AttachToParent(obj As Object, relationshipInfo As RelationshipInfo, attacher As IAttacher, attacherState As Object) As Boolean
  overload: PostSharp.Patterns.Model.TypeAdapters.TypeAdapter.AttachToParent*
  nameWithType.vb: TypeAdapter.AttachToParent(Object, RelationshipInfo, IAttacher, Object)
  fullName.vb: PostSharp.Patterns.Model.TypeAdapters.TypeAdapter.AttachToParent(Object, PostSharp.Patterns.Model.RelationshipInfo, PostSharp.Patterns.Model.IAttacher, Object)
  name.vb: AttachToParent(Object, RelationshipInfo, IAttacher, Object)
- uid: PostSharp.Patterns.Model.TypeAdapters.TypeAdapter.DetachFromParent(System.Object,System.Object,PostSharp.Patterns.Model.RelationshipInfo)
  commentId: M:PostSharp.Patterns.Model.TypeAdapters.TypeAdapter.DetachFromParent(System.Object,System.Object,PostSharp.Patterns.Model.RelationshipInfo)
  id: DetachFromParent(System.Object,System.Object,PostSharp.Patterns.Model.RelationshipInfo)
  parent: PostSharp.Patterns.Model.TypeAdapters.TypeAdapter
  langs:
  - csharp
  - vb
  name: DetachFromParent(object, object, RelationshipInfo)
  nameWithType: TypeAdapter.DetachFromParent(object, object, RelationshipInfo)
  fullName: PostSharp.Patterns.Model.TypeAdapters.TypeAdapter.DetachFromParent(object, object, PostSharp.Patterns.Model.RelationshipInfo)
  type: Method
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model.TypeAdapters
  summary: Detaches an object from its parent object.
  remarks: >-
    <p>This method is equivalent to <xref href="PostSharp.Patterns.Model.IAttachable.DetachFromParent" data-throw-if-not-resolved="false"></xref>.</p>

    <p>Implementations of this method can use the <xref href="PostSharp.Patterns.Model.TypeAdapters.TypeAdapter.DetachChild(System.Object%2cSystem.Object%2cPostSharp.Patterns.Model.RelationshipInfo)" data-throw-if-not-resolved="false"></xref> method to detach items from the parent.</p>
  example: []
  syntax:
    content: public virtual bool DetachFromParent(object obj, object parent, RelationshipInfo relationshipInfo)
    parameters:
    - id: obj
      type: System.Object
      description: An instance of the adapted type.
    - id: parent
      type: System.Object
      description: The object from which <code class="paramref">obj</code> is detached.
    - id: relationshipInfo
      type: PostSharp.Patterns.Model.RelationshipInfo
      description: The relationship of <code class="paramref">obj</code> with respect to <code class="paramref">parent</code>.
    return:
      type: System.Boolean
      description: >-
        <code>true</code> if the current object has been fully detached, that is, is no longer attached to its parent by any other relationship, or <code>false</code>
            if the current object is still attached to the parent by some relationship.
    content.vb: Public Overridable Function DetachFromParent(obj As Object, parent As Object, relationshipInfo As RelationshipInfo) As Boolean
  overload: PostSharp.Patterns.Model.TypeAdapters.TypeAdapter.DetachFromParent*
  nameWithType.vb: TypeAdapter.DetachFromParent(Object, Object, RelationshipInfo)
  fullName.vb: PostSharp.Patterns.Model.TypeAdapters.TypeAdapter.DetachFromParent(Object, Object, PostSharp.Patterns.Model.RelationshipInfo)
  name.vb: DetachFromParent(Object, Object, RelationshipInfo)
