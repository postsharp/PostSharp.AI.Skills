  langs:
  - csharp
  - vb
  name: LogEventMetadata
  nameWithType: LogEventMetadata
  fullName: PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata
  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics.Custom
  summary: >-
    Defines how the raw CLR object stored in a <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventData" data-throw-if-not-resolved="false"></xref> is translated into a set of visitable properties and an expression

    that is accessible from the transaction policy expressions.
  remarks: >-
    <p>The default implementation maps each public instance property of the CLR object to a logging property. Unless the object is of an anonymous type,
        it also takes the options of each property from the <xref href="PostSharp.Patterns.Diagnostics.Custom.LoggingPropertyOptionsAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.</p>
    <p>Derive a class from <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata" data-throw-if-not-resolved="false"></xref> to control the mapping, for instance to expose selected properties of an existing object
        without allocating a new one. To expose the object to transaction policy expressions, for instance to define custom transactions, derive from
        <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata%601" data-throw-if-not-resolved="false"></xref> instead, specify a <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata.Name" data-throw-if-not-resolved="false"></xref>, and reuse a single instance.</p>
  example: []
  syntax:
    content: public class LogEventMetadata
    content.vb: Public Class LogEventMetadata
