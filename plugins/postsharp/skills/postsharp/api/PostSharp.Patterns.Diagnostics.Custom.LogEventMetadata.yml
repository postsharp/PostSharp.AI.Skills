      type: System.String
      description: >-
        Optional. The name of the current <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata" data-throw-if-not-resolved="false"></xref>. This property may be undefined. It must be defined 
                    when the <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventData" data-throw-if-not-resolved="false"></xref> must be available for evaluation from transaction policy expressions. In this case,
