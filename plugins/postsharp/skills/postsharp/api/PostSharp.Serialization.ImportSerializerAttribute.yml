  nameWithType: ImportSerializerAttribute.ImportSerializerAttribute(Type, Type)
  fullName: PostSharp.Serialization.ImportSerializerAttribute.ImportSerializerAttribute(System.Type, System.Type)
  type: Constructor
  assemblies:
  - PostSharp
  namespace: PostSharp.Serialization
  summary: Initializes a new instance of the <xref href="PostSharp.Serialization.ImportSerializerAttribute" data-throw-if-not-resolved="false"></xref> class.
  example: []
  syntax:
    content: public ImportSerializerAttribute(Type objectType, Type serializerType)
    parameters:
    - id: objectType
      type: System.Type
      description: The type of the object to be made serializable.
    - id: serializerType
      type: System.Type
      description: >-
        The serializer type. This type must implement <xref href="PostSharp.Serialization.ISerializer" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.ISerializerFactory" data-throw-if-not-resolved="false"></xref>,
                    and must have a public default constructor. If <code class="paramref">serializerType</code> is a generic type, it must have the same number
                    of generic type parameters as <code class="paramref">objectType</code>, and have a compatible set of constraints.
    content.vb: Public Sub New(objectType As Type, serializerType As Type)
