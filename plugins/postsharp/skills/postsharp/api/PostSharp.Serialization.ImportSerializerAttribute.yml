  nameWithType: ImportSerializerAttribute
  fullName: PostSharp.Serialization.ImportSerializerAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Serialization
  summary: >-
    Custom attribute that, when applied to a serializable type, specifies that the serializer of this type has

    a dependency on another serializer. The custom attribute can be applied at assembly level; it then

    applies to all serializable types in this assembly.
  remarks: >-
    <p>This custom attribute is useful to add serializers to types of third-party assemblies.
        For types whose source code you can modify, it is preferable to use <xref href="PostSharp.Serialization.PSerializableAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.SerializerAttribute" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Class|AttributeTargets.Struct, AllowMultiple = true)]

      public sealed class ImportSerializerAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.AssemblyOrAttributeTargets.ClassOrAttributeTargets.Struct, AllowMultiple:=True)>

      Public NotInheritable Class ImportSerializerAttribute Inherits Attribute
