- uid: PostSharp.Patterns.Model.RelationshipKind.ChildOrParentSurrogate
  commentId: F:PostSharp.Patterns.Model.RelationshipKind.ChildOrParentSurrogate
  id: ChildOrParentSurrogate
  parent: PostSharp.Patterns.Model.RelationshipKind
  langs:
  - csharp
  - vb
  name: ChildOrParentSurrogate
  nameWithType: RelationshipKind.ChildOrParentSurrogate
  fullName: PostSharp.Patterns.Model.RelationshipKind.ChildOrParentSurrogate
  type: Field
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: >-
    Either <xref href="PostSharp.Patterns.Model.RelationshipKind.Child" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Model.RelationshipKind.ParentSurrogate" data-throw-if-not-resolved="false"></xref>, depending on the type of the specific object assigned to the field or property.

    This is the default relationship kind for <xref href="PostSharp.Patterns.Model.ChildAttribute" data-throw-if-not-resolved="false"></xref> when the <xref href="PostSharp.Patterns.Model.ChildAttribute.IsParentSurrogate" data-throw-if-not-resolved="false"></xref> property is not set.

    It causes the field to be a <xref href="PostSharp.Patterns.Model.RelationshipKind.ParentSurrogate" data-throw-if-not-resolved="false"></xref> if the object is an <xref href="PostSharp.Patterns.Collections.AdvisableCollection%601" data-throw-if-not-resolved="false"></xref> or an <xref href="PostSharp.Patterns.Collections.AdvisableDictionary%602" data-throw-if-not-resolved="false"></xref>,

    otherwise a <xref href="PostSharp.Patterns.Model.RelationshipKind.Child" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: ChildOrParentSurrogate = Child | ParentSurrogate
    return:
      type: PostSharp.Patterns.Model.RelationshipKind
    content.vb: ChildOrParentSurrogate = Child Or ParentSurrogate
