- uid: PostSharp.Patterns.Diagnostics.ILogActivity.Resume
  commentId: M:PostSharp.Patterns.Diagnostics.ILogActivity.Resume
  id: Resume
  parent: PostSharp.Patterns.Diagnostics.ILogActivity
  langs:
  - csharp
  - vb
  name: Resume()
  nameWithType: ILogActivity.Resume()
  fullName: PostSharp.Patterns.Diagnostics.ILogActivity.Resume()
  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics
  summary: >-
    Resumes the current async activity after it has been suspended by a call to <xref href="PostSharp.Patterns.Diagnostics.LogActivity%601.Suspend" data-throw-if-not-resolved="false"></xref>. There is typically no need

    to invoke this method in user code because all async methods that use the <xref href="PostSharp.Patterns.Diagnostics.Logger" data-throw-if-not-resolved="false"></xref> class are automatically instrumented.
  example: []
  syntax:
    content: void Resume()
    content.vb: Sub [Resume]()
  overload: PostSharp.Patterns.Diagnostics.ILogActivity.Resume*
- uid: PostSharp.Patterns.Diagnostics.ILogActivity.Suspend
  commentId: M:PostSharp.Patterns.Diagnostics.ILogActivity.Suspend
  id: Suspend
  parent: PostSharp.Patterns.Diagnostics.ILogActivity
  langs:
  - csharp
  - vb
  name: Suspend()
  nameWithType: ILogActivity.Suspend()
  fullName: PostSharp.Patterns.Diagnostics.ILogActivity.Suspend()
  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics
  summary: >-
    Suspends the current async activity.

    The activity must then be resumed by a call to the <xref href="PostSharp.Patterns.Diagnostics.LogActivity%601.Resume" data-throw-if-not-resolved="false"></xref> method.

    There is typically no need to invoke this method in user code because all async methods that use the <xref href="PostSharp.Patterns.Diagnostics.Logger" data-throw-if-not-resolved="false"></xref> class are automatically instrumented.
  example: []
  syntax:
    content: void Suspend()
    content.vb: Sub Suspend()
  overload: PostSharp.Patterns.Diagnostics.ILogActivity.Suspend*
