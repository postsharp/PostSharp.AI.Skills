- uid: PostSharp.Patterns.Xaml.CommandAttribute.ExecuteMethod
  commentId: P:PostSharp.Patterns.Xaml.CommandAttribute.ExecuteMethod
  id: ExecuteMethod
  parent: PostSharp.Patterns.Xaml.CommandAttribute
  langs:
  - csharp
  - vb
  name: ExecuteMethod
  nameWithType: CommandAttribute.ExecuteMethod
  fullName: PostSharp.Patterns.Xaml.CommandAttribute.ExecuteMethod
  type: Property
  assemblies:
  - PostSharp.Patterns.Xaml
  namespace: PostSharp.Patterns.Xaml
  summary: >-
    Gets or sets the name of the method that implements the command logic. This method corresponds to the

    <xref href="System.Windows.Input.ICommand.Execute(System.Object)" data-throw-if-not-resolved="false"></xref> method. It is called every time the command is invoked.
  remarks: >-
    <p>
        The <code>Execute</code> method must be declared in the same class as the command property and can have zero parameters or one parameter of any type, which becomes the command parameter.
        </p>
    <p>
        If this property is not set, then the aspect will look for a method named <code>Foo</code> or <code>ExecuteFoo</code>, where <code>Foo</code> is the name of the command without the <code>Command</code> suffix.
        </p>
  example: []
  syntax:
    content: public string ExecuteMethod { get; set; }
    parameters: []
    return:
      type: System.String
    content.vb: Public Property ExecuteMethod As String
  overload: PostSharp.Patterns.Xaml.CommandAttribute.ExecuteMethod*
- uid: PostSharp.Patterns.Xaml.CommandAttribute.CanExecuteMethod
  commentId: P:PostSharp.Patterns.Xaml.CommandAttribute.CanExecuteMethod
  id: CanExecuteMethod
  parent: PostSharp.Patterns.Xaml.CommandAttribute
  langs:
  - csharp
  - vb
  name: CanExecuteMethod
  nameWithType: CommandAttribute.CanExecuteMethod
