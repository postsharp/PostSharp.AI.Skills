      <ComVisible(False)>

      <LinesOfCodeAvoided(5)>

      <Serializer(GetType(CommandAttribute.Serializer))>

      Public Class CommandAttribute Inherits LocationLevelAspect Implements ILocationLevelAspect, ILocationLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, IAspectProvider, IAspect, IService
