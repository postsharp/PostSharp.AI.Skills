  name: CommandAttribute
  nameWithType: CommandAttribute
  fullName: PostSharp.Patterns.Xaml.CommandAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Xaml
  namespace: PostSharp.Patterns.Xaml
  summary: >-
    Custom attribute that, when applied to a property of type <xref href="System.Windows.Input.ICommand" data-throw-if-not-resolved="false"></xref> named, for example, <code>Foo</code>, automatically creates a

    new command class based on a method named <code>Foo</code> or <code>ExecuteFoo</code> and an optional property or method named

    <code>CanFoo</code> or <code>CanExecuteFoo</code>.
  remarks: >-
    <p>
        Default naming conventions can be overridden by setting the <xref href="PostSharp.Patterns.Xaml.CommandAttribute.ExecuteMethod" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Patterns.Xaml.CommandAttribute.CanExecuteMethod" data-throw-if-not-resolved="false"></xref>
        or <xref href="PostSharp.Patterns.Xaml.CommandAttribute.CanExecuteProperty" data-throw-if-not-resolved="false"></xref> aspect properties.
        </p>
    <p>
        A <code>CanExecute</code> property cannot depend on the command parameter. When the availability of the command depends on the parameter,
        implement a <code>CanExecute</code> method with one parameter instead.
        </p>
    <p>
        When used in a class that has <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedAttribute" data-throw-if-not-resolved="false"></xref> applied, the <xref href="System.Windows.Input.ICommand.CanExecuteChanged" data-throw-if-not-resolved="false"></xref> event is fired whenever a change of the property
        specified by <xref href="PostSharp.Patterns.Xaml.CommandAttribute.CanExecuteProperty" data-throw-if-not-resolved="false"></xref> is detected. The <xref href="System.Threading.SynchronizationContext" data-throw-if-not-resolved="false"></xref> of the thread on which the instance of the target class
        was created is used to fire the event. For example, if the instance is created on a thread where <xref href="System.Windows.Threading.Dispatcher" data-throw-if-not-resolved="false"></xref> is running, the event will
        be fired from this thread. If <xref href="System.Threading.SynchronizationContext.Current" data-throw-if-not-resolved="false"></xref> was <code>null</code>, the event is fired on the thread on which the notification of property change was received.
        </p>
  example: []
  syntax:
    content: >-
      [MulticastAttributeUsage(MulticastTargets.Property)]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Threading")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "Validation")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "DataBinding")]

      [ComVisible(false)]

      [LinesOfCodeAvoided(5)]

      [Serializer(typeof(CommandAttribute.Serializer))]

      public class CommandAttribute : LocationLevelAspect, ILocationLevelAspect, ILocationLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, IAspectProvider, IAspect, IService
