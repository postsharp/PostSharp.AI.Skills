  type: Property
  assemblies:
  - PostSharp.Patterns.Xaml
  namespace: PostSharp.Patterns.Xaml
  summary: >-
    Gets or sets the name of the method that is called to determine whether the command can be executed.

    This method corresponds to the <xref href="System.Windows.Input.ICommand.CanExecute(System.Object)" data-throw-if-not-resolved="false"></xref> method.
  remarks: >-
    <p>
        The <code>CanExecute</code> method must be declared in the same class as the command property, return a <code>bool</code> value and can have zero or one parameter.
        </p>
    <p>
        If this property is not set, then the aspect will look for a method named <code>CanFoo</code> or <code>CanExecuteFoo</code>, where <code>Foo</code> is the name of the command without the <code>Command</code> suffix.
        </p>
  example: []
  syntax:
    content: public string CanExecuteMethod { get; set; }
    parameters: []
    return:
      type: System.String
    content.vb: Public Property CanExecuteMethod As String
  overload: PostSharp.Patterns.Xaml.CommandAttribute.CanExecuteMethod*
