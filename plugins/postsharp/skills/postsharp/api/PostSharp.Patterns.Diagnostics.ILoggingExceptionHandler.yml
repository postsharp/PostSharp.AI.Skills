  fullName: PostSharp.Patterns.Diagnostics.ILoggingExceptionHandler
  type: Interface
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics
  summary: Defines the methods that are called when an exception occurs in the logging component.
  remarks: >-
    <p>The logging component catches the exceptions thrown by the logging code, so that a logging failure does not make the application fail,
        and passes them to the handler assigned to <xref href="PostSharp.Patterns.Diagnostics.LoggingServices.ExceptionHandler" data-throw-if-not-resolved="false"></xref>. To change this behavior, implement this interface
        and assign an instance to that property.</p>
    <p>The default handler, <xref href="PostSharp.Patterns.Diagnostics.DefaultLoggingExceptionHandler" data-throw-if-not-resolved="false"></xref>, writes a message to the <xref href="PostSharp.Patterns.Diagnostics.LoggingRoles.Meta" data-throw-if-not-resolved="false"></xref> role. In case of
        an internal exception other than <xref href="PostSharp.Patterns.Diagnostics.Custom.InvalidFormattingStringException" data-throw-if-not-resolved="false"></xref>, it also disables the <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend" data-throw-if-not-resolved="false"></xref> that caused it, until <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.IsEnabled" data-throw-if-not-resolved="false"></xref> is set to
        <code>true</code> again. When a debugger is attached at initialization, the default handler is <xref href="PostSharp.Patterns.Diagnostics.ThrowingLoggingExceptionHandler" data-throw-if-not-resolved="false"></xref> instead.</p>
  example: []
  syntax:
    content: public interface ILoggingExceptionHandler
    content.vb: Public Interface ILoggingExceptionHandler
