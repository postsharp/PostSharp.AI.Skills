  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Configuration
  summary: >-
    Gets or sets a value indicating whether the field containing the interface implementation (and storing the object returned by

    <xref href="PostSharp.Aspects.ICompositionAspect.CreateImplementationObject(PostSharp.Aspects.AdviceArgs)" data-throw-if-not-resolved="false"></xref>) should be excluded from serialization by <xref href="System.Runtime.Serialization.Formatters.Binary.BinaryFormatter" data-throw-if-not-resolved="false"></xref>.

    The same effect is typically obtained by applying the <xref href="System.NonSerializedAttribute" data-throw-if-not-resolved="false"></xref> custom attribute to the field.
  example: []
  syntax:
    content: public bool? NonSerializedImplementation { get; set; }
