  summary: Base class for contract exception factories. Implements the chain of responsibility between concrete exception factories.
  remarks: >-
    <p>To change the exceptions that contracts throw, derive a class from <xref href="PostSharp.Patterns.Contracts.ContractExceptionFactory" data-throw-if-not-resolved="false"></xref> and override the <xref href="PostSharp.Patterns.Contracts.ContractExceptionFactory.CreateException(PostSharp.Patterns.Contracts.ContractExceptionInfo)" data-throw-if-not-resolved="false"></xref> method.
        Return an exception for the cases that your factory handles, and call the base implementation for the others, which invokes the next factory in the chain.
        At application startup, assign an instance of your factory to <xref href="PostSharp.Patterns.Contracts.ContractServices.ExceptionFactory" data-throw-if-not-resolved="false"></xref>, and pass the previous value of this property to the constructor.</p>
    <p>The default factory creates <xref href="System.ArgumentException" data-throw-if-not-resolved="false"></xref>, <xref href="System.ArgumentNullException" data-throw-if-not-resolved="false"></xref>, <xref href="System.ArgumentOutOfRangeException" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Contracts.PostconditionFailedException" data-throw-if-not-resolved="false"></xref>,
        with a message obtained from <xref href="PostSharp.Patterns.Contracts.ContractServices.LocalizedTextProvider" data-throw-if-not-resolved="false"></xref>. When no factory of the chain handles the requested exception type,
        the base implementation throws an <xref href="System.InvalidOperationException" data-throw-if-not-resolved="false"></xref>.</p>
    <p>Custom contracts can create their exceptions through <xref href="PostSharp.Patterns.Contracts.ContractServices.ExceptionFactory" data-throw-if-not-resolved="false"></xref>, so that the same customizations apply to them.</p>
