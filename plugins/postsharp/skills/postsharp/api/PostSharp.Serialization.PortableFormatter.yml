  name: PortableFormatter
  nameWithType: PortableFormatter
  fullName: PostSharp.Serialization.PortableFormatter
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Serialization
  summary: >-
    A serializer designed to serialize the internal structure of types with support for cyclic object graphs.

    The <xref href="PostSharp.Serialization.PortableFormatter" data-throw-if-not-resolved="false"></xref> is very similar in function and design to the <xref href="System.Runtime.Serialization.Formatters.Binary.BinaryFormatter" data-throw-if-not-resolved="false"></xref>,

    but is supported on most platforms and does not require full trust. Both formatters have similar usage:

    <xref href="System.SerializableAttribute" data-throw-if-not-resolved="false"></xref> is replaced by <xref href="PostSharp.Serialization.PSerializableAttribute" data-throw-if-not-resolved="false"></xref> and

    <xref href="System.NonSerializedAttribute" data-throw-if-not-resolved="false"></xref> by <xref href="PostSharp.Serialization.PNonSerializedAttribute" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>The <xref href="PostSharp.Serialization.PortableFormatter" data-throw-if-not-resolved="false"></xref> backs <xref href="PostSharp.Aspects.Serialization.PortableAspectSerializer" data-throw-if-not-resolved="false"></xref>, the default serialization strategy
        for aspects annotated with <xref href="PostSharp.Serialization.PSerializableAttribute" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public sealed class PortableFormatter
    content.vb: Public NotInheritable Class PortableFormatter
