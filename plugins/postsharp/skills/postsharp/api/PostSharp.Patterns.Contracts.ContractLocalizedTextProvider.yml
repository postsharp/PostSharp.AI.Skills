  langs:
  - csharp
  - vb
  name: ContractLocalizedTextProvider
  nameWithType: ContractLocalizedTextProvider
  fullName: PostSharp.Patterns.Contracts.ContractLocalizedTextProvider
  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Contracts
  summary: Base class for providers of contract error messages.
  remarks: >-
    <p>
           An implementation typically overrides the <xref href="PostSharp.Patterns.Contracts.ContractLocalizedTextProvider.GetMessage(System.String)" data-throw-if-not-resolved="false"></xref> method. This method returns a formatting
        string where the first four parameters have a well-known meaning:
          </p>
    <table><thead><tr><th class="term">Parameter</th><th class="description">Description</th></tr></thead><tbody><tr><td class="term">{0}</td><td class="description">The name of the declaration being validated. It is empty for a return value.</td></tr><tr><td class="term">{1}</td><td class="description">The kind of the declaration being validated.</td></tr><tr><td class="term">{2}</td><td class="description">The name and kind of the declaration being validated.</td></tr><tr><td class="term">{3}</td><td class="description">The invalid value.</td></tr></tbody></table>

    <p>To change or translate error messages, derive a class from <xref href="PostSharp.Patterns.Contracts.ContractLocalizedTextProvider" data-throw-if-not-resolved="false"></xref>, override <xref href="PostSharp.Patterns.Contracts.ContractLocalizedTextProvider.GetMessage(System.String)" data-throw-if-not-resolved="false"></xref> to return
        your own text for the message identifiers that you handle, and call the base implementation for the others. At application startup, assign an instance of your
        provider to <xref href="PostSharp.Patterns.Contracts.ContractServices.LocalizedTextProvider" data-throw-if-not-resolved="false"></xref>, and pass the previous value of this property to the constructor. The identifiers of the messages of
        built-in contracts are the constants of this class. A custom contract can use its own identifier if a provider of the chain defines it; when no provider
        defines an identifier, <xref href="PostSharp.Patterns.Contracts.ContractLocalizedTextProvider.GetMessage(System.String)" data-throw-if-not-resolved="false"></xref> throws an <xref href="System.ArgumentOutOfRangeException" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: 'public class ContractLocalizedTextProvider : LocalizedTextProvider'
    content.vb: Public Class ContractLocalizedTextProvider Inherits LocalizedTextProvider
