  namespace: PostSharp.Aspects.Advices
  summary: >-
    Custom attribute that, when applied on an advice method, specifies the name of

    the method that is invoked at build time to return the set of elements of code

    to which the advice applies.
  remarks: >-
    <p>
            This method should have the signature
            <code>IEnumerable&lt;AdviceTargetType&gt; SelectCodeElements(AspectTargetType target)</code>,
            where <code>AspectTargetType</code> is either <code>object</code> or a reflection type
            corresponding to the kind of targets of the aspect (for instance <code>System.Type</code>
            for a type-level aspect), and <code>AdviceTargetType</code> is either <code>object</code> or
            a reflection type of the kind of targets of the advice (for instance <code>System.Reflection.MethodInfo</code> for a method-level advice).
          </p>
    <p>
            The method can select only elements of code that belong to the target of the aspect, for instance members of the
            target type for a type-level aspect; selecting a member of another type causes a build error. When the selection
            can be expressed by the kind, name and attributes of the elements, use <xref href="PostSharp.Aspects.Advices.MulticastPointcut" data-throw-if-not-resolved="false"></xref> instead.
          </p>
