  nameWithType: IWeavingSymbolsService
  fullName: PostSharp.Extensibility.IWeavingSymbolsService
  type: Interface
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    Service that allows build-time code to push annotations (both programmatic and user-visible)

    to PostSharp Tools for Visual Studio.
  remarks: >-
    <p>Use this service from an aspect, at build time, to add a text to the CodeLens and IntelliSense tooltip of a declaration, to report
        the lines of code saved, or to make the Visual Studio tools consider that a declaration has a custom attribute.
        Get an instance by calling <xref href="PostSharp.Extensibility.IProject.GetService%60%601(System.Boolean)" data-throw-if-not-resolved="false"></xref> on <xref href="PostSharp.Extensibility.PostSharpEnvironment.CurrentProject" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: >-
      [InternalImplement]

      public interface IWeavingSymbolsService : IService
    content.vb: >-
      <InternalImplement>

      Public Interface IWeavingSymbolsService Inherits IService
