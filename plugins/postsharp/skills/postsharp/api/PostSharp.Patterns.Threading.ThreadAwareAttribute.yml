  name: ThreadAwareAttribute
  nameWithType: ThreadAwareAttribute
  fullName: PostSharp.Patterns.Threading.ThreadAwareAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: Base class for all aspects implementing threading models.
  remarks: >-
    <p>Threading models rely on the Aggregatable pattern: the aspect implicitly adds the <xref href="PostSharp.Patterns.Model.AggregatableAttribute" data-throw-if-not-resolved="false"></xref> aspect to the target class,
        and the threading model extends to the child objects declared with the <xref href="PostSharp.Patterns.Model.ChildAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.</p>
  example: []
  syntax:
    content: >-
      [ProvideAspectRole("ThreadingModel")]

      [ProvideAspectRole("Threading")]

      [AspectRoleDependency(AspectDependencyAction.Conflict, "ThreadingModel")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Tracing")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Validation")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "Caching")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "CacheInvalidation")]

      [MulticastAttributeUsage(Inheritance = MulticastInheritance.Strict, AllowMultiple = false, PersistMetaData = true)]

      [IntroduceInterface(typeof(IThreadAware), OverrideAction = InterfaceOverrideAction.Ignore)]

      [IntroduceInterface(typeof(IThreadAwareImplementationProvider), OverrideAction = InterfaceOverrideAction.Ignore)]

      [IntroduceInterface(typeof(IQueryInterface), OverrideAction = InterfaceOverrideAction.Ignore, AncestorOverrideAction = InterfaceOverrideAction.Ignore)]

      [Serializer(typeof(ThreadAwareAttribute.Serializer))]

      public abstract class ThreadAwareAttribute : AggregatableClientAttribute, ITypeLevelAspect, ITypeLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, ICloneAwareAspect, IInstanceScopedAspect, IAspectProvider, IService, IAdviceProvider, IAspect, IThreadAware, IQueryInterface
    content.vb: >-
      <ProvideAspectRole("ThreadingModel")>

      <ProvideAspectRole("Threading")>

      <AspectRoleDependency(AspectDependencyAction.Conflict, "ThreadingModel")>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Tracing")>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Validation")>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "Caching")>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "CacheInvalidation")>

      <MulticastAttributeUsage(Inheritance:=MulticastInheritance.Strict, AllowMultiple:=False, PersistMetaData:=True)>

      <IntroduceInterface(GetType(IThreadAware), OverrideAction:=InterfaceOverrideAction.Ignore)>

      <IntroduceInterface(GetType(IThreadAwareImplementationProvider), OverrideAction:=InterfaceOverrideAction.Ignore)>

      <IntroduceInterface(GetType(IQueryInterface), OverrideAction:=InterfaceOverrideAction.Ignore, AncestorOverrideAction:=InterfaceOverrideAction.Ignore)>

      <Serializer(GetType(ThreadAwareAttribute.Serializer))>

      Public MustInherit Class ThreadAwareAttribute Inherits AggregatableClientAttribute Implements ITypeLevelAspect, ITypeLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, ICloneAwareAspect, IInstanceScopedAspect, IAspectProvider, IService, IAdviceProvider, IAspect, IThreadAware, IQueryInterface
