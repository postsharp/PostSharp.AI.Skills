- uid: PostSharp.Patterns.Threading.ThreadAwareAttribute.OnAdviseChildFailed(System.Object)
  commentId: M:PostSharp.Patterns.Threading.ThreadAwareAttribute.OnAdviseChildFailed(System.Object)
  id: OnAdviseChildFailed(System.Object)
  parent: PostSharp.Patterns.Threading.ThreadAwareAttribute
  langs:
  - csharp
  - vb
  name: OnAdviseChildFailed(object)
  nameWithType: ThreadAwareAttribute.OnAdviseChildFailed(object)
  fullName: PostSharp.Patterns.Threading.ThreadAwareAttribute.OnAdviseChildFailed(object)
  type: Method
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    This method is invoked when a child is assigned to a parent and the advices of the parent cannot be added to the child.

    Implementations can choose to throw an exception (thread-aware attributes do this) or ignore the situation (<code>DisposableAttribute</code> does this).
  example: []
  syntax:
    content: protected override void OnAdviseChildFailed(object child)
    parameters:
    - id: child
      type: System.Object
      description: An object that is ineligible to be a child. It is guaranteed to be non-null.
    content.vb: Protected Overrides Sub OnAdviseChildFailed(child As Object)
  overridden: PostSharp.Patterns.Model.AggregatableClientAttribute.OnAdviseChildFailed(System.Object)
