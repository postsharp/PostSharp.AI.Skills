  namespace: PostSharp.Patterns.Threading
  summary: >-
    Gets or sets a value indicating whether the code should be verified against the model at run time.

    The default value is <code>true</code> for the debug build configuration and <code>false</code> for the release build configuration.
  remarks: >-
    <p>This default value is <code>false</code> if the <code>Optimize</code> compiler setting is enabled,
        and <code>true</code> if this setting is disabled. The default value can also be modified by setting the <code>PostSharpRuntimeVerificationEnabled</code>
        MSBuild property, which can be edited from the PostSharp tab of project properties in Visual Studio.</p>
    <p>Setting this property on the custom attribute of a class overrides the project-level setting for that class.</p>
