  - PostSharp
  namespace: PostSharp.Aspects
  summary: Arguments of the advices of the aspect type <xref href="PostSharp.Aspects.LocationInterceptionAspect" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <div class="NOTE"><h5>note</h5><p>
      As a result of weaving optimizations, instances of classes derived from
      <xref href="PostSharp.Aspects.AdviceArgs" data-throw-if-not-resolved="false"></xref>
      may be shared among different aspects. Therefore,
      aspect code should not attempt to access this object once control has been passed to the next node in the chain of invocation. Consider working
      with
      aspect bindings
      if you need such deferred execution.
    </p></div>
        <div class="NOTE"><h5>note</h5><p>
      Aspect weaving optimizations may also cause an advice parameter of this type to appear as <code>null</code> when inspecting it in a debugger.
      If you need to inspect the instance at runtime, consider disabling aspect optimizations in the debug build configuration.
    </p></div>
        <a href="@simple-aspects" target="_self">
      Conceptual: Developing Simple Aspects
    </a>
