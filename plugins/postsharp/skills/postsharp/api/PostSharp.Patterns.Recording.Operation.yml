  type: Class
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording
  summary: >-
    Base class for all operations. An operation is any change of state that can be appended to a <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref>

    and therefore be involved in an undo/redo operation.
  remarks: >-
    <p>To record a custom change, derive a class from <xref href="PostSharp.Patterns.Recording.Operation" data-throw-if-not-resolved="false"></xref>, implement the <xref href="PostSharp.Patterns.Recording.Operation.Undo(PostSharp.Patterns.Recording.ReplayContext)" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Recording.Operation.Redo(PostSharp.Patterns.Recording.ReplayContext)" data-throw-if-not-resolved="false"></xref> methods,
        and append instances to the history with the <xref href="PostSharp.Patterns.Recording.Recorder.AddOperation(PostSharp.Patterns.Recording.Operation)" data-throw-if-not-resolved="false"></xref> method.</p>
  example: []
  syntax:
    content: >-
      [Obsolete("[Recordable] aspect and its components are deprecated and will be removed in a future version.", false)]

      public abstract class Operation : IOperationDescriptor
    content.vb: >-
      <Obsolete("[Recordable] aspect and its components are deprecated and will be removed in a future version.", False)>

      Public MustInherit Class Operation Implements IOperationDescriptor
  seealso:
