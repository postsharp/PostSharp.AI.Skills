- uid: PostSharp.Patterns.Recording.Operation.OperationDescriptor
  commentId: P:PostSharp.Patterns.Recording.Operation.OperationDescriptor
  id: OperationDescriptor
  parent: PostSharp.Patterns.Recording.Operation
  langs:
  - csharp
  - vb
  name: OperationDescriptor
  nameWithType: Operation.OperationDescriptor
  fullName: PostSharp.Patterns.Recording.Operation.OperationDescriptor
  type: Property
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording
  summary: >-
    Gets the <xref href="PostSharp.Patterns.Recording.Operations.IOperationDescriptor" data-throw-if-not-resolved="false"></xref>, which is used by the <xref href="PostSharp.Patterns.Recording.OperationFormatter" data-throw-if-not-resolved="false"></xref> to produce a human-readable description

    of the current operation.
  remarks: >-
    <p>By default, the <xref href="PostSharp.Patterns.Recording.Operation.OperationDescriptor" data-throw-if-not-resolved="false"></xref> property returns the current <xref href="PostSharp.Patterns.Recording.Operation" data-throw-if-not-resolved="false"></xref>.</p>

    <p>When the <xref href="PostSharp.Patterns.Recording.Operation" data-throw-if-not-resolved="false"></xref> represents a user-defined scope, the property evaluates to an instance of the <xref href="PostSharp.Patterns.Recording.Operations.NamedOperationDescriptor" data-throw-if-not-resolved="false"></xref> class.
        When it represents a method scope, it evaluates to an instance of the <xref href="PostSharp.Patterns.Recording.Operations.MethodExecutionOperationDescriptor" data-throw-if-not-resolved="false"></xref> class. </p>
  example: []
  syntax:
    content: public virtual IOperationDescriptor OperationDescriptor { get; }
    parameters: []
    return:
      type: PostSharp.Patterns.Recording.Operations.IOperationDescriptor
    content.vb: Public Overridable ReadOnly Property OperationDescriptor As IOperationDescriptor
  overload: PostSharp.Patterns.Recording.Operation.OperationDescriptor*
