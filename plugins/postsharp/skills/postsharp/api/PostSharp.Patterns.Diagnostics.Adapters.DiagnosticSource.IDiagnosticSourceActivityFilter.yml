- uid: PostSharp.Patterns.Diagnostics.Adapters.DiagnosticSource.IDiagnosticSourceActivityFilter.TryGetCorrelationKey(System.Object,System.Object@)
  commentId: M:PostSharp.Patterns.Diagnostics.Adapters.DiagnosticSource.IDiagnosticSourceActivityFilter.TryGetCorrelationKey(System.Object,System.Object@)
  id: TryGetCorrelationKey(System.Object,System.Object@)
  parent: PostSharp.Patterns.Diagnostics.Adapters.DiagnosticSource.IDiagnosticSourceActivityFilter
  langs:
  - csharp
  - vb
  name: TryGetCorrelationKey(object, out object)
  nameWithType: IDiagnosticSourceActivityFilter.TryGetCorrelationKey(object, out object)
  fullName: PostSharp.Patterns.Diagnostics.Adapters.DiagnosticSource.IDiagnosticSourceActivityFilter.TryGetCorrelationKey(object, out object)
  type: Method
  assemblies:
  - PostSharp.Patterns.Diagnostics.Adapters.DiagnosticSource
  namespace: PostSharp.Patterns.Diagnostics.Adapters.DiagnosticSource
  summary: >-
    This method is called by <xref href="PostSharp.Patterns.Diagnostics.Adapters.DiagnosticSource.DiagnosticSourceCollectingListener" data-throw-if-not-resolved="false"></xref> when a message suffixed <code>.Start</code> or <code>.Stop</code> is captured. The implementation

    must return the correlation object, that is, a property of the message that is identical for both the start and the stop messages. This correlation key

    makes it possible to pair the messages as a single activity. When the implementation returns <code>null</code>, no activity is created.
  example: []
  syntax:
    content: bool TryGetCorrelationKey(object message, out object correlationKey)
    parameters:
    - id: message
      type: System.Object
      description: The message value.
    - id: correlationKey
      type: System.Object
      description: The output parameter that receives the correlation key.
    return:
      type: System.Boolean
      description: <code>true</code> if the activity must be captured, <code>false</code> if it must be ignored.
    content.vb: Function TryGetCorrelationKey(message As Object, correlationKey As Object) As Boolean
  overload: PostSharp.Patterns.Diagnostics.Adapters.DiagnosticSource.IDiagnosticSourceActivityFilter.TryGetCorrelationKey*
  nameWithType.vb: IDiagnosticSourceActivityFilter.TryGetCorrelationKey(Object, Object)
  fullName.vb: PostSharp.Patterns.Diagnostics.Adapters.DiagnosticSource.IDiagnosticSourceActivityFilter.TryGetCorrelationKey(Object, Object)
  name.vb: TryGetCorrelationKey(Object, Object)
