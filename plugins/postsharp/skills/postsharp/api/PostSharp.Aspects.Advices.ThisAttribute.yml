  fullName: PostSharp.Aspects.Advices.ThisAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Binds a parameter of an advice method to the instance of the target, that is, the <code>this</code> object of the target method, field or property.
  remarks: >-
    <p>
        When the instance is of a reference type, the parameter cannot be <code>ref</code>, <code>in</code> or <code>out</code>, and its type must be the type of the
        instance, a base type of it, an interface it implements, or a type parameter of the advice method.
        </p>
    <p>
        When the instance is a struct, the parameter can be:
        </p>
    <ul><li>of a reference type, such as <xref href="System.Object" data-throw-if-not-resolved="false"></xref> or an interface: it receives a boxed copy of the instance;</li><li>of the type of the struct or of a type parameter of the advice method: it receives a copy of the instance;</li><li>
          <code>ref</code> or <code>in</code>, with the type of the struct: it receives the address of the instance, so the changes made
        through a <code>ref</code> parameter are seen by the target. In an async method or an iterator, the instance is the copy held by the state machine.</li></ul>
    <p>
        When the target is static, the parameter receives <code>null</code>, or the default value of its type, unless <xref href="PostSharp.Aspects.Advices.ThisAttribute.IsRequired" data-throw-if-not-resolved="false"></xref> is <code>true</code>.
        In <xref href="PostSharp.Aspects.Advices.OnInstanceConstructedAdvice" data-throw-if-not-resolved="false"></xref>, the parameter receives the instance that has just been constructed.
        </p>
  example: []
  syntax:
    content: 'public sealed class ThisAttribute : AdviceParameterAttribute'
    content.vb: Public NotInheritable Class ThisAttribute Inherits AdviceParameterAttribute
