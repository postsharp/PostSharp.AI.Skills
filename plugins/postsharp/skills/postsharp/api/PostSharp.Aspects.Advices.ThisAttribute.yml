  name: IsRequired
  nameWithType: ThisAttribute.IsRequired
  fullName: PostSharp.Aspects.Advices.ThisAttribute.IsRequired
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Gets or sets a value indicating whether the target must have an instance. When this property is <code>true</code>, the compiler reports an

    error when the advice is applied to a static target. When it is <code>false</code>, the parameter receives <code>null</code>, or the default value

    of its type. The default value is <code>false</code>.
  example: []
  syntax:
    content: public bool IsRequired { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property IsRequired As Boolean
