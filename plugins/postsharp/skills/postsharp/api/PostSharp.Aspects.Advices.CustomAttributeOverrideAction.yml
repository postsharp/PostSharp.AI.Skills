- uid: PostSharp.Aspects.Advices.CustomAttributeOverrideAction.MergeAddProperty
  commentId: F:PostSharp.Aspects.Advices.CustomAttributeOverrideAction.MergeAddProperty
  id: MergeAddProperty
  parent: PostSharp.Aspects.Advices.CustomAttributeOverrideAction
  langs:
  - csharp
  - vb
  name: MergeAddProperty
  nameWithType: CustomAttributeOverrideAction.MergeAddProperty
  fullName: PostSharp.Aspects.Advices.CustomAttributeOverrideAction.MergeAddProperty
  type: Field
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Merges the existing custom attribute with the template custom attribute

    by adding properties and fields. If the existing custom attribute defines

    the same properties and fields as the template custom attribute,

    they are not overridden.
  remarks: >-
    Constructor arguments of the template custom attribute are 

    ignored during merging.
  example: []
  syntax:
    content: MergeAddProperty = 3
    return:
      type: PostSharp.Aspects.Advices.CustomAttributeOverrideAction
- uid: PostSharp.Aspects.Advices.CustomAttributeOverrideAction.MergeReplaceProperty
  commentId: F:PostSharp.Aspects.Advices.CustomAttributeOverrideAction.MergeReplaceProperty
  id: MergeReplaceProperty
  parent: PostSharp.Aspects.Advices.CustomAttributeOverrideAction
  langs:
  - csharp
  - vb
  name: MergeReplaceProperty
  nameWithType: CustomAttributeOverrideAction.MergeReplaceProperty
  fullName: PostSharp.Aspects.Advices.CustomAttributeOverrideAction.MergeReplaceProperty
  type: Field
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Merges the existing custom attribute with the template custom attribute

    by adding and replacing properties and fields. If the existing custom

    attribute defines the same properties and fields as the template custom

    attribute, they are replaced by the values defined in the template

    custom attribute.
  remarks: >-
    Constructor arguments of the template custom attribute are 

    ignored during merging.
  example: []
  syntax:
    content: MergeReplaceProperty = 4
    return:
      type: PostSharp.Aspects.Advices.CustomAttributeOverrideAction
