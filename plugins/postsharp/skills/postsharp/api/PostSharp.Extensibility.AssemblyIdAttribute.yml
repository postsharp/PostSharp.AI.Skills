  nameWithType: AssemblyIdAttribute
  fullName: PostSharp.Extensibility.AssemblyIdAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    Assigns a unique identifier to an assembly. This assembly identifier is used

    to generate unique attribute identifiers.
  remarks: >-
    By default, the assembly identifier is computed from the module name.

    It is the first 4 bytes of the MD5 hash of the module name.
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly, AllowMultiple = false, Inherited = false)]

      public sealed class AssemblyIdAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Assembly, AllowMultiple:=False, Inherited:=False)>

      Public NotInheritable Class AssemblyIdAttribute Inherits Attribute
