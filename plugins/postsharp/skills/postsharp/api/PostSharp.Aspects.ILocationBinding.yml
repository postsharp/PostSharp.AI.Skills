  summary: Invokes the <code>Set</code> semantic on the next node in the chain of invocation.
  remarks: >-
    <p>
      The
      <code class="paramref">instance</code>
      parameter is passed by reference so that instance methods of value types (
      <code>struct</code>
      in C#) are allowed to change the value of the instance.
    </p>
  example: []
  syntax:
    content: void SetValue(ref object instance, Arguments index, object value)
    parameters:
    - id: instance
      type: System.Object
      description: Target instance from which the field or property should be retrieved (<code>null</code> if the field or property is static).
    - id: index
      type: PostSharp.Aspects.Arguments
      description: Index arguments, if the location is an indexer property.
    - id: value
      type: System.Object
      description: New value to be stored at the location.
    content.vb: Sub SetValue(instance As Object, index As Arguments, value As Object)
