- uid: PostSharp.Aspects.ILocationBinding.GetValue(System.Object@,PostSharp.Aspects.Arguments)
  commentId: M:PostSharp.Aspects.ILocationBinding.GetValue(System.Object@,PostSharp.Aspects.Arguments)
  id: GetValue(System.Object@,PostSharp.Aspects.Arguments)
  parent: PostSharp.Aspects.ILocationBinding
  langs:
  - csharp
  - vb
  name: GetValue(ref object, Arguments)
  nameWithType: ILocationBinding.GetValue(ref object, Arguments)
  fullName: PostSharp.Aspects.ILocationBinding.GetValue(ref object, PostSharp.Aspects.Arguments)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Invokes the <code>Get</code> semantic on the next node in the chain of invocation.
  remarks: >-
    <p>
      The
      <code class="paramref">instance</code>
      parameter is passed by reference so that instance methods of value types (
      <code>struct</code>
      in C#) are allowed to change the value of the instance.
    </p>
  example: []
  syntax:
    content: object GetValue(ref object instance, Arguments index)
    parameters:
    - id: instance
      type: System.Object
      description: Target instance from which the field or property should be retrieved (<code>null</code> if the field or property is static).
    - id: index
      type: PostSharp.Aspects.Arguments
      description: Index arguments, if the location is an indexer property.
    return:
      type: System.Object
      description: The value stored at the location.
    content.vb: Function GetValue(instance As Object, index As Arguments) As Object
  overload: PostSharp.Aspects.ILocationBinding.GetValue*
  nameWithType.vb: ILocationBinding.GetValue(Object, Arguments)
  fullName.vb: PostSharp.Aspects.ILocationBinding.GetValue(Object, PostSharp.Aspects.Arguments)
  name.vb: GetValue(Object, Arguments)
