  nameWithType: EnumDataTypeAttribute
  fullName: PostSharp.Patterns.Contracts.EnumDataTypeAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Contracts
  summary: >-
    Custom attribute that, when added to a field, property or parameter, throws

    an <xref href="System.ArgumentException" data-throw-if-not-resolved="false"></xref> if the target is assigned a value that

    is not a valid member of an enumeration.
  remarks: >-
    <p>Strings are matched against enumeration member names. Integers
        are matched against enumeration member values. Null values are accepted and do not
        throw an exception.
        </p>
    <p>The error message is identified by <xref href="PostSharp.Patterns.Contracts.ContractLocalizedTextProvider.EnumDataTypeErrorMessage" data-throw-if-not-resolved="false"></xref>.</p>

    <p>The error message can use the additional argument <code>{4}</code> to refer to <xref href="PostSharp.Patterns.Contracts.EnumDataTypeAttribute.EnumType" data-throw-if-not-resolved="false"></xref> name.</p>
  example: []
  syntax:
    content: 'public sealed class EnumDataTypeAttribute : LocationContractAttribute, ILocationLevelAspect, IAspect'
    content.vb: Public NotInheritable Class EnumDataTypeAttribute Inherits LocationContractAttribute Implements ILocationLevelAspect, IAspect
