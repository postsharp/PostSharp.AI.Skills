  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Contracts
  summary: >-
    Custom attribute that, when added to a field, property or parameter, throws

    an <xref href="System.ArgumentOutOfRangeException" data-throw-if-not-resolved="false"></xref> if the target is assigned a value that

    is not strictly within the given range.
  remarks: >-
    <p>Null values are accepted and do not throw an exception.
        </p>
    <p>
            Floating-point values are tested to be strictly within the given bounds
            with a tolerance value. The tolerance value is equal to the distance
            of the value closest to the bounds according to the precision
            of the respective floating-point numerical data type.
        </p>
    <p>The error message is identified by <xref href="PostSharp.Patterns.Contracts.ContractLocalizedTextProvider.StrictRangeErrorMessage" data-throw-if-not-resolved="false"></xref>.</p>

    <p>The error message can use the additional arguments <code>{4}</code> and <code>{5}</code> to refer to the bounds.</p>
  example: []
  syntax:
    content: 'public class StrictRangeAttribute : RangeAttribute, ILocationLevelAspect, IValidableAnnotation, IAspect'
