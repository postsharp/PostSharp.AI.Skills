  summary: >-
    Provides a service similar to <xref href="System.String.Format(System.String%2cSystem.Object%5b%5d)" data-throw-if-not-resolved="false"></xref>, but uses

    the same formatter as the one that PostSharp uses for error messages. This formatter

    formats objects like <xref href="System.Type" data-throw-if-not-resolved="false"></xref> or <xref href="System.Reflection.MethodInfo" data-throw-if-not-resolved="false"></xref> better.
