  namespace: PostSharp.Patterns.Caching.Backends.Redis
  summary: >-
    Gets or sets the time that the Redis invalidator waits for a Redis connection.

    When you create a new Redis invalidator, a <xref href="System.TimeoutException" data-throw-if-not-resolved="false"></xref> is thrown if it does not connect to a Redis server within this time.
  remarks: The default value is 1 minute.
