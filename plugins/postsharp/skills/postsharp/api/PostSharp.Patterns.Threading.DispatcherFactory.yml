- uid: PostSharp.Patterns.Threading.DispatcherFactory.GetDispatcherForCurrentContext
  commentId: M:PostSharp.Patterns.Threading.DispatcherFactory.GetDispatcherForCurrentContext
  id: GetDispatcherForCurrentContext
  parent: PostSharp.Patterns.Threading.DispatcherFactory
  langs:
  - csharp
  - vb
  name: GetDispatcherForCurrentContext()
  nameWithType: DispatcherFactory.GetDispatcherForCurrentContext()
  fullName: PostSharp.Patterns.Threading.DispatcherFactory.GetDispatcherForCurrentContext()
  type: Method
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Gets an implementation of the <xref href="PostSharp.Patterns.Threading.IDispatcher" data-throw-if-not-resolved="false"></xref> interface that is suitable for dispatching

    to the current context. This method requires that the current thread is associated with

    a <xref href="System.Threading.SynchronizationContext" data-throw-if-not-resolved="false"></xref> or a WPF <code>Dispatcher</code>.
  remarks: >-
    <p>Subsequent calls to this method in the same context will return the same instance.</p>

    <p>If this method is invoked in the context of an actor (see <xref href="PostSharp.Patterns.Threading.ActorAttribute" data-throw-if-not-resolved="false"></xref>),
        this method returns a dispatcher that dispatches to the actor queue.
        </p>
  example: []
  syntax:
    content: public static IDispatcher GetDispatcherForCurrentContext()
    return:
      type: PostSharp.Patterns.Threading.IDispatcher
      description: >-
        An implementation of the <xref href="PostSharp.Patterns.Threading.IDispatcher" data-throw-if-not-resolved="false"></xref> for the current context, or <code>null</code>
                    if the current thread is not associated with any <xref href="System.Threading.SynchronizationContext" data-throw-if-not-resolved="false"></xref> or WPF <code>Dispatcher</code>.
    content.vb: Public Shared Function GetDispatcherForCurrentContext() As IDispatcher
  overload: PostSharp.Patterns.Threading.DispatcherFactory.GetDispatcherForCurrentContext*
