  - PostSharp.Patterns.Diagnostics.Backends.Serilog
  namespace: PostSharp.Patterns.Diagnostics.Backends.Serilog
  summary: Options for <xref href="PostSharp.Patterns.Diagnostics.Backends.Serilog.SerilogLoggingBackend" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>By default, parameter values are formatted by PostSharp Logging and passed to Serilog as strings. Set <xref href="PostSharp.Patterns.Diagnostics.Backends.Serilog.SerilogLoggingBackendOptions.UseSerilogFormatters" data-throw-if-not-resolved="false"></xref>
        to pass the unformatted values instead. To pass more pieces of information as Serilog properties, set <xref href="PostSharp.Patterns.Diagnostics.Backends.Serilog.SerilogLoggingBackendOptions.SemanticParametersTreatedSemantically" data-throw-if-not-resolved="false"></xref>
        and <xref href="PostSharp.Patterns.Diagnostics.Backends.Serilog.SerilogLoggingBackendOptions.IncludedSpecialProperties" data-throw-if-not-resolved="false"></xref>; semantic properties have a significant performance cost in Serilog.</p>
  example: []
  syntax:
    content: 'public class SerilogLoggingBackendOptions : TextLoggingBackendOptions'
    content.vb: Public Class SerilogLoggingBackendOptions Inherits TextLoggingBackendOptions
  seealso:
