- uid: PostSharp.Patterns.Diagnostics.Backends.Serilog.SerilogLoggingBackendOptions.SemanticParametersTreatedSemantically
  commentId: P:PostSharp.Patterns.Diagnostics.Backends.Serilog.SerilogLoggingBackendOptions.SemanticParametersTreatedSemantically
  id: SemanticParametersTreatedSemantically
  parent: PostSharp.Patterns.Diagnostics.Backends.Serilog.SerilogLoggingBackendOptions
  langs:
  - csharp
  - vb
  name: SemanticParametersTreatedSemantically
  nameWithType: SerilogLoggingBackendOptions.SemanticParametersTreatedSemantically
  fullName: PostSharp.Patterns.Diagnostics.Backends.Serilog.SerilogLoggingBackendOptions.SemanticParametersTreatedSemantically
  type: Property
  assemblies:
  - PostSharp.Patterns.Diagnostics.Backends.Serilog
  namespace: PostSharp.Patterns.Diagnostics.Backends.Serilog
  summary: Gets or sets the kinds of semantic parameters that must be mapped to Serilog semantic parameters.
  remarks: >-
    <p>
        The value of this property is a bit mask.
        Each bit corresponds to a value of the <xref href="PostSharp.Patterns.Diagnostics.RecordBuilders.SemanticParameterKind" data-throw-if-not-resolved="false"></xref> enumeration.
        When a bit is set to 1, a Serilog parameter will be used. Otherwise, the parameter
        will be expanded into plain text.
        </p>
    <p>
        Serilog semantic parameters have a significant cost, so they must be used with care.
        </p>
    <p>
        The default value of this property is equal to the <xref href="PostSharp.Patterns.Diagnostics.Backends.Serilog.SerilogLoggingBackendOptions.SemanticParametersRequiredTreatedSemantically" data-throw-if-not-resolved="false"></xref> constant.
        </p>
  example: []
  syntax:
    content: public SemanticParameterKind SemanticParametersTreatedSemantically { get; set; }
    parameters: []
    return:
      type: PostSharp.Patterns.Diagnostics.RecordBuilders.SemanticParameterKind
    content.vb: Public Property SemanticParametersTreatedSemantically As SemanticParameterKind
  overload: PostSharp.Patterns.Diagnostics.Backends.Serilog.SerilogLoggingBackendOptions.SemanticParametersTreatedSemantically*
- uid: PostSharp.Patterns.Diagnostics.Backends.Serilog.SerilogLoggingBackendOptions.IncludedSpecialProperties
