- uid: PostSharp.Patterns.Caching.InvalidateCacheAttribute.AllowMultipleOverloads
  commentId: P:PostSharp.Patterns.Caching.InvalidateCacheAttribute.AllowMultipleOverloads
  id: AllowMultipleOverloads
  parent: PostSharp.Patterns.Caching.InvalidateCacheAttribute
  langs:
