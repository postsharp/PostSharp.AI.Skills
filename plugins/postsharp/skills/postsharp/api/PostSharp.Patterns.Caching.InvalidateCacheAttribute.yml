  name: AllowMultipleOverloads
  nameWithType: InvalidateCacheAttribute.AllowMultipleOverloads
  fullName: PostSharp.Patterns.Caching.InvalidateCacheAttribute.AllowMultipleOverloads
  type: Property
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching
  summary: >-
    Gets or sets a value indicating whether the current <xref href="PostSharp.Patterns.Caching.InvalidateCacheAttribute" data-throw-if-not-resolved="false"></xref> can match several overloads of the methods.

    The default value is <code>false</code>, which means that an error will be emitted if the current <xref href="PostSharp.Patterns.Caching.InvalidateCacheAttribute" data-throw-if-not-resolved="false"></xref> matches

    several methods of the same name.
