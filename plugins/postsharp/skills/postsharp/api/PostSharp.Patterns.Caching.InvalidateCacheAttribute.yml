  name: InvalidateCacheAttribute
  nameWithType: InvalidateCacheAttribute
  fullName: PostSharp.Patterns.Caching.InvalidateCacheAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching
  summary: >-
    Custom attribute that, when applied to a method, causes an invocation of this method to remove from

    the cache the result of invocations of other given methods with the same parameter values.
  remarks: >-
    <p>The invalidation happens after the target method returns. Each parameter of a cached method is matched with the parameter of the same name of the
        target method, regardless of their order, and the type of the target method parameter must be assignable to the type of the cached method parameter.
        Parameters annotated with <xref href="PostSharp.Patterns.Caching.NotCacheKeyAttribute" data-throw-if-not-resolved="false"></xref> are not matched. When no overload has all its parameters matched, the build fails with an error.</p>
    <p>By default, the cached methods are looked up in the declaring type of the target method; use the constructor that takes a <xref href="System.Type" data-throw-if-not-resolved="false"></xref>
        to specify another type. When the <code>this</code> instance is part of the cache key of an instance method (see <xref href="PostSharp.Patterns.Caching.CacheAttribute.IgnoreThisParameter" data-throw-if-not-resolved="false"></xref>),
        the target method must be an instance method of the same type or of a derived type. When a method name matches several cached overloads,
        set <xref href="PostSharp.Patterns.Caching.InvalidateCacheAttribute.AllowMultipleOverloads" data-throw-if-not-resolved="false"></xref> to <code>true</code> to invalidate all of them.</p>
    <p>To invalidate cached methods imperatively, use <xref href="PostSharp.Patterns.Caching.CachingServices.Invalidation" data-throw-if-not-resolved="false"></xref>. To decouple the invalidating methods from the cached methods,
        use cache dependencies (see <xref href="PostSharp.Patterns.Caching.ICachingContext" data-throw-if-not-resolved="false"></xref>).</p>
    <p>When <xref href="PostSharp.Patterns.Caching.CacheConfigurationAttribute.UseDependencyInjection" data-throw-if-not-resolved="false"></xref> is <code>true</code> for the target method, the declaring class receives
        an <xref href="PostSharp.Patterns.Caching.ICachingService" data-throw-if-not-resolved="false"></xref> from its constructors, and the invalidation applies to that service. The invalidated methods must use the
        same service: an invalidating method and an invalidated method whose settings differ are a build error.</p>
  example: []
  syntax:
    content: >-
      [MulticastAttributeUsage(MulticastTargets.Method, AllowMultiple = true, TargetMemberAttributes = MulticastAttributes.NonAbstract)]

      [Metric("UsedFeatures", "Patterns.Caching.InvalidateCache")]

      [ProvideAspectRole("CacheInvalidation")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Validation")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Tracing")]

      [LinesOfCodeAvoided(1)]

      [Serializer(typeof(InvalidateCacheAttribute.Serializer))]

      public sealed class InvalidateCacheAttribute : MethodLevelAspect, IMethodLevelAspect, IMethodLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, IAdviceProvider, IAspect
    content.vb: >-
      <MulticastAttributeUsage(MulticastTargets.Method, AllowMultiple:=True, TargetMemberAttributes:=MulticastAttributes.NonAbstract)>

      <Metric("UsedFeatures", "Patterns.Caching.InvalidateCache")>

      <ProvideAspectRole("CacheInvalidation")>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Validation")>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Tracing")>

      <LinesOfCodeAvoided(1)>

      <Serializer(GetType(InvalidateCacheAttribute.Serializer))>

      Public NotInheritable Class InvalidateCacheAttribute Inherits MethodLevelAspect Implements IMethodLevelAspect, IMethodLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, IAdviceProvider, IAspect
