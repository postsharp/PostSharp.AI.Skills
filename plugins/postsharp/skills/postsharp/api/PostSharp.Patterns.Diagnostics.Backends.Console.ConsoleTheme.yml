  name: ConsoleTheme
  nameWithType: ConsoleTheme
  fullName: PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleTheme
  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Backends.Console
  summary: A simple implementation of a color theme that allows only for two colors per <xref href="PostSharp.Patterns.Diagnostics.LogLevel" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>Each part of a log record is rendered with either the normal style (<xref href="PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleTheme.NormalStyles" data-throw-if-not-resolved="false"></xref>) or the highlighted style
        (<xref href="PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleTheme.HightlightedStyles" data-throw-if-not-resolved="false"></xref>) of the record level. By default, variable parts such as parameter values, return values, execution
        times and exceptions are highlighted. Call <xref href="PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleTheme.AddHightlightedItem(PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleThemeItem)" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleTheme.RemoveHighlightedItem(PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleThemeItem)" data-throw-if-not-resolved="false"></xref> to change which
        items are highlighted.</p>
    <p>To customize an existing theme such as <xref href="PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleThemes.Dark" data-throw-if-not-resolved="false"></xref>, call <xref href="PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleTheme.Clone" data-throw-if-not-resolved="false"></xref> or the copy constructor and edit
        the copy. A theme on which <xref href="PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleTheme.Freeze" data-throw-if-not-resolved="false"></xref> has been called, including <xref href="PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleThemes.Dark" data-throw-if-not-resolved="false"></xref>, throws an
        <xref href="System.InvalidOperationException" data-throw-if-not-resolved="false"></xref> when it is modified.</p>
    <p>When two styles per level are not enough, override <xref href="PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleTheme.GetStyle(System.String%2cPostSharp.Patterns.Diagnostics.LogLevel%2cPostSharp.Patterns.Diagnostics.LogRecordKind%2cPostSharp.Patterns.Diagnostics.Backends.Console.ConsoleThemeItem)" data-throw-if-not-resolved="false"></xref> or implement <xref href="PostSharp.Patterns.Diagnostics.Backends.Console.IConsoleTheme" data-throw-if-not-resolved="false"></xref> directly.
        Assign the theme to <xref href="PostSharp.Patterns.Diagnostics.Backends.Console.ConsoleLoggingBackendOptions.Theme" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: 'public class ConsoleTheme : IConsoleTheme'
    content.vb: Public Class ConsoleTheme Implements IConsoleTheme
