  name: LoggingBackend
  nameWithType: LoggingBackend
  fullName: PostSharp.Patterns.Diagnostics.LoggingBackend
  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics
  summary: Base class for all logging backends (sometimes called sinks, targets, or listeners) of the PostSharp logging system.
  remarks: >-
    <p>
        To implement your own logging backend, derive from the <xref href="PostSharp.Patterns.Diagnostics.Backends.TextLoggingBackend" data-throw-if-not-resolved="false"></xref> class, which
        implements the standard logic for logging text.
        A custom backend usually also derives a class from <xref href="PostSharp.Patterns.Diagnostics.LoggingTypeSource" data-throw-if-not-resolved="false"></xref>, returned by <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.CreateTypeSource(PostSharp.Patterns.Diagnostics.LoggingNamespaceSource%2cSystem.Type)" data-throw-if-not-resolved="false"></xref>,
        a class from <xref href="PostSharp.Patterns.Diagnostics.RecordBuilders.TextLogRecordBuilder" data-throw-if-not-resolved="false"></xref>, returned by <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.CreateRecordBuilder" data-throw-if-not-resolved="false"></xref>, and an options class from
        <xref href="PostSharp.Patterns.Diagnostics.Backends.TextLoggingBackendOptions" data-throw-if-not-resolved="false"></xref>. Override the factory methods of the context classes only when the contexts must store more information.
        </p>
    <p>
        To use a backend, assign an instance to <xref href="PostSharp.Patterns.Diagnostics.LoggingServices.DefaultBackend" data-throw-if-not-resolved="false"></xref> when the application starts. To write to several
        backends at the same time, use the <xref href="PostSharp.Patterns.Diagnostics.Backends.Multiplexer.MultiplexerBackend" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: 'public abstract class LoggingBackend : IDisposable'
    content.vb: Public MustInherit Class LoggingBackend Implements IDisposable
  seealso:
  - linkType: HRef
    linkId: '@custom-logging-backend'
    altText: 'Conceptual: Building Your Own Logging Backend (Adapter)'
  - linkType: HRef
    linkId: '@log-multiplexer'
    altText: 'Conceptual: Multiplexing Log Output to Several Frameworks'
