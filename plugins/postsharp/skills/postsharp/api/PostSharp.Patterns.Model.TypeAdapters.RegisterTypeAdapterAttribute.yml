  type: Constructor
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model.TypeAdapters
  summary: >-
    Initializes a new instance of the <xref href="PostSharp.Patterns.Model.TypeAdapters.RegisterTypeAdapterAttribute" data-throw-if-not-resolved="false"></xref> class and specifies the name of the target type. Use this constructor when the target type is not in the current assembly or in

    an assembly referenced by the current assembly.
  example: []
  syntax:
    content: public RegisterTypeAdapterAttribute(string targetTypeName, Type typeAdapterFactoryType)
    parameters:
    - id: targetTypeName
      type: System.String
      description: The name of the target type (equal to the <xref href="System.Type.FullName" data-throw-if-not-resolved="false"></xref> property of the target <xref href="System.Type" data-throw-if-not-resolved="false"></xref>).
    - id: typeAdapterFactoryType
      type: System.Type
      description: A <xref href="System.Type" data-throw-if-not-resolved="false"></xref> derived from <xref href="PostSharp.Patterns.Model.TypeAdapters.TypeAdapterFactory" data-throw-if-not-resolved="false"></xref>. The type must have a public default constructor.
