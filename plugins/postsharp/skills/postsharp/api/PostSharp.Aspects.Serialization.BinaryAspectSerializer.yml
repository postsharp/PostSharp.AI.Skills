  name: BinaryAspectSerializer
  nameWithType: BinaryAspectSerializer
  fullName: PostSharp.Aspects.Serialization.BinaryAspectSerializer
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Serialization
  summary: >-
    Implementation of <xref href="PostSharp.Aspects.Serialization.AspectSerializer" data-throw-if-not-resolved="false"></xref> based on the

    <xref href="System.Runtime.Serialization.Formatters.Binary.BinaryFormatter" data-throw-if-not-resolved="false"></xref> provided by the full version

    of the .NET Framework.
  remarks: >-
    The weaver uses this serializer for aspect classes annotated with <xref href="System.SerializableAttribute" data-throw-if-not-resolved="false"></xref> instead of

    <xref href="PostSharp.Serialization.PSerializableAttribute" data-throw-if-not-resolved="false"></xref>. Because <xref href="System.Runtime.Serialization.Formatters.Binary.BinaryFormatter" data-throw-if-not-resolved="false"></xref> is insecure, the build

    fails unless the <code>PostSharpBinaryFormatterAllowed</code> MSBuild property is set to <code>True</code>. Prefer <xref href="PostSharp.Aspects.Serialization.PortableAspectSerializer" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: 'public class BinaryAspectSerializer : AspectSerializer'
    content.vb: Public Class BinaryAspectSerializer Inherits AspectSerializer
  seealso:
  - linkType: HRef
    linkId: '@aspect-serialization'
    altText: 'Conceptual: Understanding Aspect Serialization'
  - linkType: HRef
    linkId: '@binary-formatter-security'
    altText: 'Conceptual: BinaryFormatter security'
