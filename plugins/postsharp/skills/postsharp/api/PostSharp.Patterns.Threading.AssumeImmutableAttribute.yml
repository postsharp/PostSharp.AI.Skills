  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Custom attribute that, when applied to a type, means that the type should be assumed to be immutable.

    The custom attribute can be applied to a type on assembly level by specifying the <xref href="System.Type" data-throw-if-not-resolved="false"></xref> property using

    the <xref href="PostSharp.Patterns.Threading.AssumeImmutableAttribute.%23ctor(System.Type)" data-throw-if-not-resolved="false"></xref> constructor.
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Class|AttributeTargets.Struct, AllowMultiple = true)]

      public sealed class AssumeImmutableAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.AssemblyOrAttributeTargets.ClassOrAttributeTargets.Struct, AllowMultiple:=True)>

      Public NotInheritable Class AssumeImmutableAttribute Inherits Attribute
