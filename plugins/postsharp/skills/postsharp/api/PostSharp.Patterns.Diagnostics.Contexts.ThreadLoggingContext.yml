  fullName: PostSharp.Patterns.Diagnostics.Contexts.ThreadLoggingContext
  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Contexts
  summary: >-
    A <xref href="PostSharp.Patterns.Diagnostics.Contexts.LoggingContext" data-throw-if-not-resolved="false"></xref> that represents the current thread. The <xref href="PostSharp.Patterns.Diagnostics.Contexts.ThreadLoggingContext" data-throw-if-not-resolved="false"></xref> has two uses.

    First, it is used to store all thread-local variables and objects. Second, it is used as the root object for all

    other contexts.
  remarks: >-
    <p>A custom backend that needs to store more data in this context can derive a class from it and override
        <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.CreateThreadContext" data-throw-if-not-resolved="false"></xref> to return an instance of the derived class.</p>
  example: []
  syntax:
    content: 'public class ThreadLoggingContext : LoggingContext, ILoggingContext, IDisposable'
    content.vb: Public Class ThreadLoggingContext Inherits LoggingContext Implements ILoggingContext, IDisposable
