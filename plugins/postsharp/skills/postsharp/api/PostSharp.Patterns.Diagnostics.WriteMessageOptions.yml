  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics
  summary: Initializes a new instance of the <xref href="PostSharp.Patterns.Diagnostics.WriteMessageOptions" data-throw-if-not-resolved="false"></xref> struct and optionally specifies the properties from a CLR object.
  example: []
  syntax:
    content: public WriteMessageOptions(object data = null)
    parameters:
    - id: data
      type: System.Object
      description: >-
        Optional. Specifies the properties of the <xref href="PostSharp.Patterns.Diagnostics.WriteMessageOptions" data-throw-if-not-resolved="false"></xref>. It is typically an instance of a well-known or anonymous CLR type.
                    The resulting <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventData" data-throw-if-not-resolved="false"></xref> has the default <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata" data-throw-if-not-resolved="false"></xref>. This means that all CLR properties are exposed
                    as logging properties, unless they are annotated with <xref href="PostSharp.Patterns.Diagnostics.Custom.LoggingPropertyOptionsAttribute" data-throw-if-not-resolved="false"></xref>.
