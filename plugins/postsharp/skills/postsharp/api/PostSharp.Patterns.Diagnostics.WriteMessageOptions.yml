  summary: Represents the options of the <xref href="PostSharp.Patterns.Diagnostics.Custom.LogLevelSource.Write%60%601(%60%600%40%2cPostSharp.Patterns.Diagnostics.WriteMessageOptions%40)" data-throw-if-not-resolved="false"></xref> method.
  remarks: >-
    <p>Use these options to add properties to a message. Properties are name-value pairs passed to the logging backend in addition to the message.
        The simplest way to define them is to pass an instance of an anonymous type to the <xref href="PostSharp.Patterns.Diagnostics.WriteMessageOptions.%23ctor(System.Object)" data-throw-if-not-resolved="false"></xref> constructor.</p>
