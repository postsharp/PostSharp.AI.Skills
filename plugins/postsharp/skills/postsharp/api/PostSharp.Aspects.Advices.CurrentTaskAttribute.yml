- uid: PostSharp.Aspects.Advices.CurrentTaskAttribute.IsRequired
  commentId: P:PostSharp.Aspects.Advices.CurrentTaskAttribute.IsRequired
  id: IsRequired
  parent: PostSharp.Aspects.Advices.CurrentTaskAttribute
  langs:
  - csharp
  - vb
  name: IsRequired
  nameWithType: CurrentTaskAttribute.IsRequired
  fullName: PostSharp.Aspects.Advices.CurrentTaskAttribute.IsRequired
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Gets or sets a value indicating whether the parameter must never be <code>null</code>. When this property is <code>true</code>, the compiler reports

    an error when the advice can run before the method yields, which is the case of every advice except the resume advice, and when the

    target method cannot provide its task. The resume advice can also run before the method yields when the entry advice of its group yields

    on an awaiter that is already completed, so the compiler also reports an error when that entry advice has an <xref href="PostSharp.Aspects.Advices.AwaiterAttribute" data-throw-if-not-resolved="false"></xref>

    parameter. The default value is <code>false</code>.
  remarks: >-
    When the advice is selected by <xref href="PostSharp.Aspects.Advices.MatchPointcut" data-throw-if-not-resolved="false"></xref>, a target method that cannot provide its task is skipped, and no error is

    reported for it.
  example: []
  syntax:
    content: public bool IsRequired { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property IsRequired As Boolean
