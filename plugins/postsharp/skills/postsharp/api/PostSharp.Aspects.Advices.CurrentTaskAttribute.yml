  langs:
  - csharp
  - vb
  name: CurrentTaskAttribute
  nameWithType: CurrentTaskAttribute
  fullName: PostSharp.Aspects.Advices.CurrentTaskAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Binds a parameter of a method boundary advice to the task that the caller of the current async method observes. The parameter is

    <code>null</code> until the method has yielded, and always <code>null</code> when the method is not an async method, when it is implemented with

    runtime async, or when its method builder is not supported.
  remarks: >-
    <p>
        The task exists once the method has yielded, that is, once one of its <code>await</code> expressions has suspended it. This applies to every
        async method, whether it returns <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref>, <xref href="System.Threading.Tasks.Task%601" data-throw-if-not-resolved="false"></xref>, <code>ValueTask</code> or <code>ValueTask&lt;TResult&gt;</code>.
        The parameter is the task in the resume advice, in a yield advice other than the first one, and in the success, exception and exit advices
        of an execution that yielded. It is <code>null</code> in the entry advice, in the first yield advice, and in the advices of an execution that
        completes without yielding. Reading the task of the method builder earlier would create a task that the first <code>await</code> replaces on .NET.
        </p>
    <p>
        The supported method builders are <xref href="System.Runtime.CompilerServices.AsyncTaskMethodBuilder" data-throw-if-not-resolved="false"></xref>, <xref href="System.Runtime.CompilerServices.AsyncTaskMethodBuilder%601" data-throw-if-not-resolved="false"></xref>,
        <code>AsyncValueTaskMethodBuilder</code> and <code>AsyncValueTaskMethodBuilder&lt;TResult&gt;</code>. For a method that returns <code>ValueTask</code> or
        <code>ValueTask&lt;TResult&gt;</code>, the task is the one that the <code>ValueTask</code> of the caller wraps. Other builders, such as
        <code>PoolingAsyncValueTaskMethodBuilder</code>, give <code>null</code>. A method implemented with runtime async has no task while it runs, and the
        compiler reports a warning.
        </p>
    <p>
        The parameter must be of type <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref>, <xref href="System.IAsyncResult" data-throw-if-not-resolved="false"></xref> or <xref href="System.Object" data-throw-if-not-resolved="false"></xref>, and it cannot be <code>ref</code>,
        <code>in</code> or <code>out</code>. This attribute can be used only in the method boundary advices.
        </p>
