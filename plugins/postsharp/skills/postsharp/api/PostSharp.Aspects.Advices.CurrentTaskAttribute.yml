  namespace: PostSharp.Aspects.Advices
  summary: Binds a parameter of a method boundary advice to the task returned by the current async method.
  remarks: >-
    The parameter must be of type <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref>, <xref href="System.IAsyncResult" data-throw-if-not-resolved="false"></xref> or <xref href="System.Object" data-throw-if-not-resolved="false"></xref>, and it cannot be <code>ref</code>, <code>in</code> or

    <code>out</code>. Its value is <code>null</code> when the

    target method is not an async method, or when its builder is neither <xref href="System.Runtime.CompilerServices.AsyncTaskMethodBuilder" data-throw-if-not-resolved="false"></xref> nor

    <xref href="System.Runtime.CompilerServices.AsyncTaskMethodBuilder%601" data-throw-if-not-resolved="false"></xref>, for instance when the method returns a

    <code>ValueTask</code>. This attribute can be used only in the method boundary advices.
  example: []
  syntax:
    content: 'public sealed class CurrentTaskAttribute : AdviceParameterAttribute'
    content.vb: Public NotInheritable Class CurrentTaskAttribute Inherits AdviceParameterAttribute
