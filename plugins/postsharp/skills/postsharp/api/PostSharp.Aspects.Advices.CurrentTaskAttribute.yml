- uid: PostSharp.Aspects.Advices.CurrentTaskAttribute
  commentId: T:PostSharp.Aspects.Advices.CurrentTaskAttribute
  id: CurrentTaskAttribute
  parent: PostSharp.Aspects.Advices
  children:
