  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Contexts
  summary: >-
    Represents data that is associated with a logging context and that should be passed through the execution context rather than the thread context. The class is mostly immutable.

    The data is stored in an <code>AsyncLocal</code>, in a kind of "stack" maintained by the <xref href="PostSharp.Patterns.Diagnostics.Contexts.LoggingExecutionContextData.Parent" data-throw-if-not-resolved="false"></xref> property. This class was previously known as <code>ContextLocalData</code>.
