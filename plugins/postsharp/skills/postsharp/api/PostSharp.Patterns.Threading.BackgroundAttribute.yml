  name: BackgroundAttribute
  nameWithType: BackgroundAttribute
  fullName: PostSharp.Patterns.Threading.BackgroundAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Custom attribute that, when applied to a method, causes the method to execute in the background. This aspect can be applied to a method with

    <code>void</code> or <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref> return type.
  remarks: >-
    <p>When this aspect is applied to a method returning a <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref>, the aspect wraps the method call in a call to <code>Task.Factory.StartNew</code>,
        therefore executing the whole method in a background thread. Without this aspect, the target method would execute asynchronously, but in the current context,
        instead of in the background context.
        </p>
    <p>If the <xref href="PostSharp.Patterns.Threading.BackgroundAttribute.IsLongRunning" data-throw-if-not-resolved="false"></xref> property is set to <code>true</code>, the method will be executed in a new thread. Otherwise, it will be queued
        into the <xref href="System.Threading.ThreadPool" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>If the target method results in an exception, the exception can be handled by subscribing to the <xref href="PostSharp.Patterns.Threading.ThreadingServices.UnhandledException" data-throw-if-not-resolved="false"></xref> event.
        Unhandled exceptions are rethrown, typically causing the application to crash.</p>
    <p>A build-time error is emitted if the target method has <code>ref</code> or <code>out</code> parameters, or if it is an instance method
        of a class annotated with <xref href="PostSharp.Patterns.Threading.ThreadAffineAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Threading.ActorAttribute" data-throw-if-not-resolved="false"></xref>. To execute a method in the UI thread instead,
        use the <xref href="PostSharp.Patterns.Threading.DispatchedAttribute" data-throw-if-not-resolved="false"></xref> aspect.</p>
  example: []
  syntax:
    content: >-
      [MethodInterceptionAspectConfiguration(SerializerType = typeof(MsilAspectSerializer))]

      [ProvideAspectRole("Threading")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "Tracing")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "Caching")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "CacheInvalidation")]

      [AspectTypeDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, typeof(ThreadAwareAttribute))]

      [Metric("UsedFeatures", "PostSharp.Patterns.Threading.BackgroundMethod")]

      [LinesOfCodeAvoided(1)]

      [AspectDescription("Executes the method asynchronously in the thread pool")]

      public sealed class BackgroundAttribute : MethodInterceptionAspect, IMethodLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, IAsyncMethodInterceptionAspect, IMethodInterceptionAspect, IMethodLevelAspect, IAspect
    content.vb: >-
      <MethodInterceptionAspectConfiguration(SerializerType:=GetType(MsilAspectSerializer))>

      <ProvideAspectRole("Threading")>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "Tracing")>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "Caching")>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, "CacheInvalidation")>

      <AspectTypeDependency(AspectDependencyAction.Order, AspectDependencyPosition.Before, GetType(ThreadAwareAttribute))>

      <Metric("UsedFeatures", "PostSharp.Patterns.Threading.BackgroundMethod")>

      <LinesOfCodeAvoided(1)>

      <AspectDescription("Executes the method asynchronously in the thread pool")>

      Public NotInheritable Class BackgroundAttribute Inherits MethodInterceptionAspect Implements IMethodLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, IAsyncMethodInterceptionAspect, IMethodInterceptionAspect, IMethodLevelAspect, IAspect
