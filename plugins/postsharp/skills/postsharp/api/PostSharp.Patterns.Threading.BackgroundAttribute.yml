- uid: PostSharp.Patterns.Threading.BackgroundAttribute.OnInvoke(PostSharp.Aspects.MethodInterceptionArgs)
  commentId: M:PostSharp.Patterns.Threading.BackgroundAttribute.OnInvoke(PostSharp.Aspects.MethodInterceptionArgs)
  id: OnInvoke(PostSharp.Aspects.MethodInterceptionArgs)
  parent: PostSharp.Patterns.Threading.BackgroundAttribute
  langs:
  - csharp
  - vb
  name: OnInvoke(MethodInterceptionArgs)
  nameWithType: BackgroundAttribute.OnInvoke(MethodInterceptionArgs)
  fullName: PostSharp.Patterns.Threading.BackgroundAttribute.OnInvoke(PostSharp.Aspects.MethodInterceptionArgs)
  type: Method
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: Method invoked instead of the method to which the aspect has been applied.
  remarks: >-
    <p>The implementation of <xref href="PostSharp.Aspects.IMethodInterceptionAspect.OnInvoke(PostSharp.Aspects.MethodInterceptionArgs)" data-throw-if-not-resolved="false"></xref> may invoke <xref href="PostSharp.Aspects.MethodInterceptionArgs.Proceed" data-throw-if-not-resolved="false"></xref>, may schedule it for invocation from another thread, or
            may completely skip its invocation. Alternatively, it may use <xref href="PostSharp.Aspects.MethodInterceptionArgs.Binding" data-throw-if-not-resolved="false"></xref>. Before returning to the caller, the <xref href="PostSharp.Aspects.IMethodInterceptionAspect.OnInvoke(PostSharp.Aspects.MethodInterceptionArgs)" data-throw-if-not-resolved="false"></xref> method must set the return value (property <xref href="PostSharp.Aspects.MethodInterceptionArgs.ReturnValue" data-throw-if-not-resolved="false"></xref>)
            and all output arguments (property <xref href="PostSharp.Aspects.MethodInterceptionArgs.Arguments" data-throw-if-not-resolved="false"></xref>). Otherwise, the target method may fail with a <xref href="System.NullReferenceException" data-throw-if-not-resolved="false"></xref>. These
            are normally set by calling <xref href="PostSharp.Aspects.MethodInterceptionArgs.Proceed" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public override void OnInvoke(MethodInterceptionArgs args)
    parameters:
    - id: args
      type: PostSharp.Aspects.MethodInterceptionArgs
      description: Advice arguments.
    content.vb: Public Overrides Sub OnInvoke(args As MethodInterceptionArgs)
  overridden: PostSharp.Aspects.MethodInterceptionAspect.OnInvoke(PostSharp.Aspects.MethodInterceptionArgs)
  overload: PostSharp.Patterns.Threading.BackgroundAttribute.OnInvoke*
  seealso:
  - linkId: PostSharp.Aspects.MethodInterceptionArgs
    commentId: T:PostSharp.Aspects.MethodInterceptionArgs
- uid: PostSharp.Patterns.Threading.BackgroundAttribute.OnInvokeAsync(PostSharp.Aspects.MethodInterceptionArgs)
  commentId: M:PostSharp.Patterns.Threading.BackgroundAttribute.OnInvokeAsync(PostSharp.Aspects.MethodInterceptionArgs)
  id: OnInvokeAsync(PostSharp.Aspects.MethodInterceptionArgs)
  parent: PostSharp.Patterns.Threading.BackgroundAttribute
  langs:
  - csharp
  - vb
  name: OnInvokeAsync(MethodInterceptionArgs)
  nameWithType: BackgroundAttribute.OnInvokeAsync(MethodInterceptionArgs)
  fullName: PostSharp.Patterns.Threading.BackgroundAttribute.OnInvokeAsync(PostSharp.Aspects.MethodInterceptionArgs)
  type: Method
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: Method invoked instead of the method to which the aspect has been applied.
  remarks: >-
    <p>The implementation of <xref href="PostSharp.Aspects.IAsyncMethodInterceptionAspect.OnInvokeAsync(PostSharp.Aspects.MethodInterceptionArgs)" data-throw-if-not-resolved="false"></xref> may invoke <xref href="PostSharp.Aspects.MethodInterceptionArgs.ProceedAsync" data-throw-if-not-resolved="false"></xref>, may schedule it for invocation from another thread, or
            may completely skip its invocation. Alternatively, it may use <xref href="PostSharp.Aspects.MethodInterceptionArgs.Binding" data-throw-if-not-resolved="false"></xref>. Before returning to the caller,
            the <xref href="PostSharp.Aspects.IAsyncMethodInterceptionAspect.OnInvokeAsync(PostSharp.Aspects.MethodInterceptionArgs)" data-throw-if-not-resolved="false"></xref> method must set the return value (property <xref href="PostSharp.Aspects.MethodInterceptionArgs.ReturnValue" data-throw-if-not-resolved="false"></xref>),
            otherwise the target method may fail with a <xref href="System.NullReferenceException" data-throw-if-not-resolved="false"></xref>. It is normally set by calling <xref href="PostSharp.Aspects.MethodInterceptionArgs.ProceedAsync" data-throw-if-not-resolved="false"></xref>.</p>
    <p>
            If semantic advising applies to a method and the method is an async method or returns a <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref>, then <xref href="PostSharp.Aspects.IAsyncMethodInterceptionAspect.OnInvokeAsync(PostSharp.Aspects.MethodInterceptionArgs)" data-throw-if-not-resolved="false"></xref> is called for that method instead of <xref href="PostSharp.Aspects.IMethodInterceptionAspect.OnInvoke(PostSharp.Aspects.MethodInterceptionArgs)" data-throw-if-not-resolved="false"></xref>.
          </p>
  example: []
  syntax:
    content: public override Task OnInvokeAsync(MethodInterceptionArgs args)
    parameters:
    - id: args
      type: PostSharp.Aspects.MethodInterceptionArgs
      description: Advice arguments.
    return:
      type: System.Threading.Tasks.Task
    content.vb: Public Overrides Function OnInvokeAsync(args As MethodInterceptionArgs) As Task
  overridden: PostSharp.Aspects.MethodInterceptionAspect.OnInvokeAsync(PostSharp.Aspects.MethodInterceptionArgs)
  overload: PostSharp.Patterns.Threading.BackgroundAttribute.OnInvokeAsync*
  seealso:
  - linkId: PostSharp.Aspects.MethodInterceptionArgs
    commentId: T:PostSharp.Aspects.MethodInterceptionArgs
