  name: ReentrantAttribute
  nameWithType: ReentrantAttribute
  fullName: PostSharp.Patterns.Threading.ReentrantAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Custom attribute that means that the <code>async</code> method to which it is applied can be safely

    re-entered on each <code>await</code> statement. For lock-based models, it means that the lock

    is released while awaiting. For the actor model, it means that other methods can be invoked

    during awaiting.
  remarks: >-
    <p>This attribute is required on <code>async</code> methods of classes annotated with <xref href="PostSharp.Patterns.Threading.ActorAttribute" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Patterns.Threading.SynchronizedAttribute" data-throw-if-not-resolved="false"></xref>
        or <xref href="PostSharp.Patterns.Threading.ReaderWriterSynchronizedAttribute" data-throw-if-not-resolved="false"></xref>; a build-time error is emitted otherwise. Applying it to a method that is not <code>async</code>
        also results in a build-time error.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class|AttributeTargets.Method)]

      [MulticastAttributeUsage(MulticastTargets.Method, AllowMultiple = false)]

      public sealed class ReentrantAttribute : MulticastAttribute, IValidableAnnotation
    content.vb: >-
      <AttributeUsage(AttributeTargets.ClassOrAttributeTargets.Method)>

      <MulticastAttributeUsage(MulticastTargets.Method, AllowMultiple:=False)>

      Public NotInheritable Class ReentrantAttribute Inherits MulticastAttribute Implements IValidableAnnotation
