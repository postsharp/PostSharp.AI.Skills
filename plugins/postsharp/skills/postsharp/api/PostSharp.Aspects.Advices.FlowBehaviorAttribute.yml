items:
- uid: PostSharp.Aspects.Advices.FlowBehaviorAttribute
  commentId: T:PostSharp.Aspects.Advices.FlowBehaviorAttribute
  id: FlowBehaviorAttribute
  parent: PostSharp.Aspects.Advices
  children:
