  nameWithType: FlowBehaviorAttribute
  fullName: PostSharp.Aspects.Advices.FlowBehaviorAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Binds a parameter of a method boundary advice to a <xref href="PostSharp.Aspects.FlowBehavior" data-throw-if-not-resolved="false"></xref> variable, which the advice sets to change the control flow of the

    target method.
  remarks: >-
    <p>
        The parameter must be of type <xref href="PostSharp.Aspects.FlowBehavior" data-throw-if-not-resolved="false"></xref>, and it must be <code>ref</code> or <code>out</code>. The compiler reads the variable after
        <xref href="PostSharp.Aspects.Advices.OnMethodEntryAdvice" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.OnMethodExceptionAdvice" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.Advices.OnMethodResumeAdvice" data-throw-if-not-resolved="false"></xref>. The value has no effect in the other advices.
        </p>
    <p>
        A bound advice cannot set the return value of the method. In <xref href="PostSharp.Aspects.Advices.OnMethodExceptionAdvice" data-throw-if-not-resolved="false"></xref>, a bound advice cannot supply an exception,
        so <xref href="PostSharp.Aspects.FlowBehavior.ThrowException" data-throw-if-not-resolved="false"></xref> rethrows the current exception. <xref href="PostSharp.Aspects.FlowBehavior.Yield" data-throw-if-not-resolved="false"></xref> requires a parameter bound by
        <xref href="PostSharp.Aspects.Advices.AwaiterAttribute" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: 'public sealed class FlowBehaviorAttribute : AdviceParameterAttribute'
    content.vb: Public NotInheritable Class FlowBehaviorAttribute Inherits AdviceParameterAttribute
