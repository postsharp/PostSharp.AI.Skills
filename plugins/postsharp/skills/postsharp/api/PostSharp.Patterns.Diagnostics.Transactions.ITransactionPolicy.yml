  type: Method
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Transactions
  summary: >-
    Evaluates an expression defined as an extended property (typically an XML attribute) where

    the argument of the expression is an <code>OpenTransactionExpressionModel</code>.
  example: []
  syntax:
    content: T EvaluateExtendedOpenExpression<T>(string propertyName, in TransactionProperties transactionProperties, T defaultValue = default, ExtendedTransactionExpressionOptions options = ExtendedTransactionExpressionOptions.None)
    parameters:
    - id: propertyName
      type: System.String
      description: >-
        The name of the property (or XML attribute) that defines the
                    expression. The name is case-sensitive.
    - id: transactionProperties
      type: PostSharp.Patterns.Diagnostics.Transactions.TransactionProperties
      description: The input <xref href="PostSharp.Patterns.Diagnostics.Transactions.TransactionProperties" data-throw-if-not-resolved="false"></xref>.
    - id: defaultValue
      type: '{T}'
      description: The value returned if the expression is not defined or has an error.
    - id: options
      type: PostSharp.Patterns.Diagnostics.Transactions.ExtendedTransactionExpressionOptions
      description: >-
        Determines whether exceptions should be thrown or swallowed or whether 
                    the expression is allowed to use sampling functions.
    typeParameters:
    - id: T
      description: The return type of the expression.
    return:
      type: '{T}'
      description: The result of the expression, or <code class="paramref">defaultValue</code>.
    content.vb: Function EvaluateExtendedOpenExpression(Of T)(propertyName As String, transactionProperties As TransactionProperties, defaultValue As T = Nothing, options As ExtendedTransactionExpressionOptions = ExtendedTransactionExpressionOptions.None) As T
