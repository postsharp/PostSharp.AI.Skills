- uid: PostSharp.Patterns.Recording.RecordingServices.RecorderProvider
  commentId: P:PostSharp.Patterns.Recording.RecordingServices.RecorderProvider
  id: RecorderProvider
  parent: PostSharp.Patterns.Recording.RecordingServices
  langs:
  - csharp
  - vb
  name: RecorderProvider
  nameWithType: RecordingServices.RecorderProvider
  fullName: PostSharp.Patterns.Recording.RecordingServices.RecorderProvider
  type: Property
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording
  summary: >-
    Gets or sets the <xref href="PostSharp.Patterns.Recording.RecorderProvider" data-throw-if-not-resolved="false"></xref>, which provides the default <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref> for recordable objects

    that have the <xref href="PostSharp.Patterns.Recording.RecordableAttribute.AutoRecord" data-throw-if-not-resolved="false"></xref> property set to <code>true</code> (which is the default value).
  remarks: >-
    <p>This property is the head of a chain of responsibility. If you set this property to a new value, you typically have to
        pass the previous value of this property to the constructor of your custom <xref href="PostSharp.Patterns.Recording.RecorderProvider" data-throw-if-not-resolved="false"></xref>.</p>
    <p>The default implementation unconditionally returns a single global instance of the <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref> class.</p>
  example: []
  syntax:
    content: >-
      [Required]

      public static RecorderProvider RecorderProvider { get; set; }
    parameters: []
    return:
      type: PostSharp.Patterns.Recording.RecorderProvider
    content.vb: >-
      <Required>

      Public Shared Property RecorderProvider As RecorderProvider
  overload: PostSharp.Patterns.Recording.RecordingServices.RecorderProvider*
  attributes:
  - type: PostSharp.Patterns.Contracts.RequiredAttribute
    ctor: PostSharp.Patterns.Contracts.RequiredAttribute.#ctor
    arguments: []
