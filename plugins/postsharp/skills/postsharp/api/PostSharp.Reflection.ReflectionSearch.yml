  name: ReflectionSearch
  nameWithType: ReflectionSearch
  fullName: PostSharp.Reflection.ReflectionSearch
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Reflection
  summary: >-
    Provides static methods that give broader access to assembly metadata than

    the <code>System.Reflection</code> namespace. These methods are

    available only at build time.
  remarks: >-
    <p>Use these methods in build-time code, such as the <xref href="PostSharp.Constraints.ReferentialConstraint.ValidateCode(System.Object%2cSystem.Reflection.Assembly)" data-throw-if-not-resolved="false"></xref> method
          of an architectural constraint or the <code>CompileTimeValidate</code> method of an aspect, to find the code that uses a declaration,
          the types derived from a type, or the custom attributes added to a declaration, including those added by multicasting.</p>
      <p>
        <div class="NOTE"><h5>note</h5><p>
      This feature is available only at build time.
    </p></div>
      </p>
