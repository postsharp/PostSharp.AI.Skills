- uid: PostSharp.Reflection.ReflectionSearch.GetCustomAttributesOfType(System.Type)
  commentId: M:PostSharp.Reflection.ReflectionSearch.GetCustomAttributesOfType(System.Type)
  id: GetCustomAttributesOfType(System.Type)
  parent: PostSharp.Reflection.ReflectionSearch
  langs:
  - csharp
  - vb
  name: GetCustomAttributesOfType(Type)
  nameWithType: ReflectionSearch.GetCustomAttributesOfType(Type)
  fullName: PostSharp.Reflection.ReflectionSearch.GetCustomAttributesOfType(System.Type)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Reflection
  summary: Gets all custom attributes of a given type in the assembly currently being processed.
  remarks: >-
    <p>
        <div class="NOTE"><h5>note</h5><p>
      This method returns custom attributes from the internal annotation repository of PostSharp. This repository contains more
      than only custom attributes added in source code. For instance, if you use
      <xref href="PostSharp.Extensibility.MulticastAttribute" data-throw-if-not-resolved="false"></xref>
      to add a custom attribute to several elements of code in a single line of code, this method will return
      one custom attribute instance for every target of the
      <xref href="PostSharp.Extensibility.MulticastAttribute" data-throw-if-not-resolved="false"></xref>
      .
    </p></div>
      </p>
      <p>
        <div class="NOTE"><h5>note</h5><p>
      This feature is available only at build time.
    </p></div>
      </p>
  example: []
  syntax:
    content: public static CustomAttributeInstance[] GetCustomAttributesOfType(Type customAttributeType)
    parameters:
    - id: customAttributeType
      type: System.Type
      description: The <xref href="System.Type" data-throw-if-not-resolved="false"></xref> of the custom attribute.
    return:
      type: PostSharp.Reflection.CustomAttributeInstance[]
      description: >-
        The set of all custom attributes of type <code class="paramref">customAttributeType</code>
                      defined in the assembly currently being processed.
    content.vb: Public Shared Function GetCustomAttributesOfType(customAttributeType As Type) As CustomAttributeInstance()
  overload: PostSharp.Reflection.ReflectionSearch.GetCustomAttributesOfType*
- uid: PostSharp.Reflection.ReflectionSearch.GetCustomAttributesOfType(System.Type,PostSharp.Reflection.ReflectionSearchOptions)
  commentId: M:PostSharp.Reflection.ReflectionSearch.GetCustomAttributesOfType(System.Type,PostSharp.Reflection.ReflectionSearchOptions)
  id: GetCustomAttributesOfType(System.Type,PostSharp.Reflection.ReflectionSearchOptions)
  parent: PostSharp.Reflection.ReflectionSearch
  langs:
  - csharp
  - vb
  name: GetCustomAttributesOfType(Type, ReflectionSearchOptions)
  nameWithType: ReflectionSearch.GetCustomAttributesOfType(Type, ReflectionSearchOptions)
  fullName: PostSharp.Reflection.ReflectionSearch.GetCustomAttributesOfType(System.Type, PostSharp.Reflection.ReflectionSearchOptions)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Reflection
  summary: >-
    Gets all custom attributes of a given type in the assembly currently being processed and specifies 

    additional options.
  remarks: >-
    <p>
        <div class="NOTE"><h5>note</h5><p>
      This method returns custom attributes from the internal annotation repository of PostSharp. This repository contains more
      than only custom attributes added in source code. For instance, if you use
      <xref href="PostSharp.Extensibility.MulticastAttribute" data-throw-if-not-resolved="false"></xref>
      to add a custom attribute to several elements of code in a single line of code, this method will return
      one custom attribute instance for every target of the
      <xref href="PostSharp.Extensibility.MulticastAttribute" data-throw-if-not-resolved="false"></xref>
      .
    </p></div>
      </p>
      <p>
        <div class="NOTE"><h5>note</h5><p>
      This feature is available only at build time.
    </p></div>
      </p>
  example: []
  syntax:
    content: public static CustomAttributeInstance[] GetCustomAttributesOfType(Type customAttributeType, ReflectionSearchOptions options)
    parameters:
    - id: customAttributeType
      type: System.Type
      description: The <xref href="System.Type" data-throw-if-not-resolved="false"></xref> of the custom attribute.
    - id: options
      type: PostSharp.Reflection.ReflectionSearchOptions
      description: Either <xref href="PostSharp.Reflection.ReflectionSearchOptions.IncludeDerivedTypes" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Reflection.ReflectionSearchOptions.None" data-throw-if-not-resolved="false"></xref>.
    return:
      type: PostSharp.Reflection.CustomAttributeInstance[]
      description: >-
        The set of all custom attributes of type <code class="paramref">customAttributeType</code> (or any type derived
                      from <code class="paramref">customAttributeType</code>, if the option <xref href="PostSharp.Reflection.ReflectionSearchOptions.IncludeDerivedTypes" data-throw-if-not-resolved="false"></xref> 
                      is specified) defined in the assembly currently being processed.
    content.vb: Public Shared Function GetCustomAttributesOfType(customAttributeType As Type, options As ReflectionSearchOptions) As CustomAttributeInstance()
  overload: PostSharp.Reflection.ReflectionSearch.GetCustomAttributesOfType*
