- uid: PostSharp.Reflection.ReflectionSearch.HasCustomAttribute(System.Object,System.Type,System.Boolean)
  commentId: M:PostSharp.Reflection.ReflectionSearch.HasCustomAttribute(System.Object,System.Type,System.Boolean)
  id: HasCustomAttribute(System.Object,System.Type,System.Boolean)
  parent: PostSharp.Reflection.ReflectionSearch
  langs:
  - csharp
  - vb
  name: HasCustomAttribute(object, Type, bool)
  nameWithType: ReflectionSearch.HasCustomAttribute(object, Type, bool)
  fullName: PostSharp.Reflection.ReflectionSearch.HasCustomAttribute(object, System.Type, bool)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Reflection
  summary: >-
    Determines whether a declaration has a custom attribute of a given type, including those that have been added indirectly, for
      instance through <xref href="PostSharp.Extensibility.MulticastAttribute" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static bool HasCustomAttribute(object target, Type type, bool inherit = false)
    parameters:
    - id: target
      type: System.Object
      description: >-
        The element of code (<xref href="System.Type" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.MethodInfo" data-throw-if-not-resolved="false"></xref>, and so on) whose
                      custom attributes are requested.
    - id: type
      type: System.Type
      description: The type of custom attributes.
    - id: inherit
      type: System.Boolean
      description: >-
        <code>true</code> to consider custom attributes derived from <code class="paramref">type</code>, <code>false</code> to consider
            only custom attributes strictly of type <code class="paramref">type</code>.
    return:
      type: System.Boolean
      description: <code>true</code> if <code class="paramref">target</code> has a custom attribute of type <code class="paramref">type</code>, otherwise <code>false</code>.
    content.vb: Public Shared Function HasCustomAttribute(target As Object, type As Type, inherit As Boolean = False) As Boolean
