- uid: PostSharp.Patterns.Formatters.FormatterRepository`1.Register(System.Type,System.Type)
  commentId: M:PostSharp.Patterns.Formatters.FormatterRepository`1.Register(System.Type,System.Type)
  id: Register(System.Type,System.Type)
  parent: PostSharp.Patterns.Formatters.FormatterRepository`1
  langs:
  - csharp
  - vb
  name: Register(Type, Type)
  nameWithType: FormatterRepository<TRole>.Register(Type, Type)
  fullName: PostSharp.Patterns.Formatters.FormatterRepository<TRole>.Register(System.Type, System.Type)
  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Formatters
  summary: Registers the given <code class="paramref">formatterType</code> for the given <code class="paramref">targetType</code>.
  remarks: >-
    <p>Instances of <code class="paramref">formatterType</code> are created using a parameterless constructor.</p>

    <p>When <code class="paramref">targetType</code> is generic, the registration applies to its generic instantiations
        and to types that inherit from or implement them.</p>
  example:
  - >-
    If you register a formatter as

    <code>FormattingServices.RegisterFormatter(typeof(IDictionary&lt;,&gt;), typeof(MyDictionaryFormatter&lt;,&gt;))</code>

    and then log a parameter of type <code>Dictionary&lt;int, string&gt;</code>, the formatter for that parameter is created

    by calling <code>new MyDictionaryFormatter&lt;int, string&gt;</code>.
  syntax:
    content: public static void Register(Type targetType, Type formatterType)
    parameters:
    - id: targetType
      type: System.Type
    - id: formatterType
      type: System.Type
      attributes:
      - type: System.Diagnostics.CodeAnalysis.DynamicallyAccessedMembersAttribute
        ctor: System.Diagnostics.CodeAnalysis.DynamicallyAccessedMembersAttribute.#ctor(System.Diagnostics.CodeAnalysis.DynamicallyAccessedMemberTypes)
        arguments:
        - type: System.Diagnostics.CodeAnalysis.DynamicallyAccessedMemberTypes
          value: 8193
    content.vb: Public Shared Sub Register(targetType As Type, formatterType As Type)
  overload: PostSharp.Patterns.Formatters.FormatterRepository`1.Register*
  nameWithType.vb: FormatterRepository(Of TRole).Register(Type, Type)
  fullName.vb: PostSharp.Patterns.Formatters.FormatterRepository(Of TRole).Register(System.Type, System.Type)
