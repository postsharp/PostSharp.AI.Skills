  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics
  summary: Custom attribute that, when applied on a field or property, causes PostSharp to implement tracing when its value changes.
  remarks: >-
    <p>By default, this custom attribute follows the settings of the default profile, which adds a <xref href="PostSharp.Patterns.Diagnostics.LogLevel.Debug" data-throw-if-not-resolved="false"></xref> message.
            You can change these default settings by choosing a different logging profile.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Module|AttributeTargets.Class|AttributeTargets.Struct|AttributeTargets.Property|AttributeTargets.Field, AllowMultiple = true, Inherited = false)]

      [MulticastAttributeUsage(MulticastTargets.Field|MulticastTargets.Property, TargetMemberAttributes = MulticastAttributes.NonAbstract|MulticastAttributes.UserGenerated, AllowMultiple = false)]

      [Metric("UsedFeatures", "Patterns.Diagnostics.Logging")]

      [ProvideAspectRole("Tracing")]

      public class LogValueAttribute : LocationLevelAspect, ILocationLevelAspect, ILocationLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, ILogValueAspect, IAspect
    content.vb: >-
      <AttributeUsage(AttributeTargets.AssemblyOrAttributeTargets.ModuleOrAttributeTargets.ClassOrAttributeTargets.StructOrAttributeTargets.PropertyOrAttributeTargets.Field, AllowMultiple:=True, Inherited:=False)>

      <MulticastAttributeUsage(MulticastTargets.FieldOrMulticastTargets.Property, TargetMemberAttributes:=MulticastAttributes.NonAbstractOrMulticastAttributes.UserGenerated, AllowMultiple:=False)>

      <Metric("UsedFeatures", "Patterns.Diagnostics.Logging")>

      <ProvideAspectRole("Tracing")>

      Public Class LogValueAttribute Inherits LocationLevelAspect Implements ILocationLevelAspect, ILocationLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, ILogValueAspect, IAspect
