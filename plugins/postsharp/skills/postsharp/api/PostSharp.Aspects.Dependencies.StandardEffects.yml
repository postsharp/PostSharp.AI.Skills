  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Dependencies
  summary: Defines the standard effects.
  remarks: >-
    <p>See <xref href="PostSharp.Aspects.Dependencies.AspectEffectDependencyAttribute" data-throw-if-not-resolved="false"></xref> for a discussion of effects.</p>

    <p>This list is not meant to be extended by vendors who provide concrete aspects (which implement some business
            functionality). Roles should be used to categorize the business effect of concrete aspects. However, if you
            implement a new kind of abstract aspect (for example, member suppression), you may need to define new effects.
          </p>
    <p>
            In that case, we at <code>PostSharp</code> encourage you to contact us to define a new role string. If you define a
            new role string, we recommend that you define it clearly so that users of your aspect can express dependencies
            with their own aspects or with third-party aspects.</p>
