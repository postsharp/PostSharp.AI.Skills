  name: MethodBodyVisitor
  nameWithType: MethodBodyVisitor
  fullName: PostSharp.Reflection.MethodBody.MethodBodyVisitor
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Reflection.MethodBody
  summary: Abstract implementation of a visitor of method bodies (<xref href="PostSharp.Reflection.MethodBody.IMethodBody" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Reflection.MethodBody.IExpression" data-throw-if-not-resolved="false"></xref>).
  remarks: >-
    <p>
                This class provides an abstract implementation, which only ensures that the proper visiting method
                gets called for every node of the tree, without any other effect. Concrete implementations typically
                override specific visiting methods, and call the base implementation to ensure that children nodes
                are processed too.
            </p>
  example: []
  syntax:
    content: public abstract class MethodBodyVisitor
    content.vb: Public MustInherit Class MethodBodyVisitor
