- uid: PostSharp.Aspects.Advices.IntroduceFieldCompatibleAction.Ignore
  commentId: F:PostSharp.Aspects.Advices.IntroduceFieldCompatibleAction.Ignore
  id: Ignore
  parent: PostSharp.Aspects.Advices.IntroduceFieldCompatibleAction
  langs:
  - csharp
  - vb
  name: Ignore
  nameWithType: IntroduceFieldCompatibleAction.Ignore
  fullName: PostSharp.Aspects.Advices.IntroduceFieldCompatibleAction.Ignore
  type: Field
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    The introduction is skipped: the request resolves to the compatible field, which the advices of the aspect import. This is how

    several aspects share one field. The request does not initialize the field.
  example: []
  syntax:
    content: Ignore = 1
    return:
      type: PostSharp.Aspects.Advices.IntroduceFieldCompatibleAction
- uid: PostSharp.Aspects.Advices.IntroduceFieldCompatibleAction.IntroduceAnother
  commentId: F:PostSharp.Aspects.Advices.IntroduceFieldCompatibleAction.IntroduceAnother
  id: IntroduceAnother
  parent: PostSharp.Aspects.Advices.IntroduceFieldCompatibleAction
  langs:
  - csharp
  - vb
  name: IntroduceAnother
  nameWithType: IntroduceFieldCompatibleAction.IntroduceAnother
  fullName: PostSharp.Aspects.Advices.IntroduceFieldCompatibleAction.IntroduceAnother
  type: Field
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    A new field is introduced next to the compatible field. It gets the requested name followed by a number that makes it unique in the

    type, such as <code>handlers2</code>, or, without a requested name, a generated name.
  example: []
  syntax:
    content: IntroduceAnother = 2
    return:
      type: PostSharp.Aspects.Advices.IntroduceFieldCompatibleAction
