- uid: PostSharp.Aspects.Advices.IntroduceFieldCompatibleAction
  commentId: T:PostSharp.Aspects.Advices.IntroduceFieldCompatibleAction
  id: IntroduceFieldCompatibleAction
  parent: PostSharp.Aspects.Advices
  children:
  - PostSharp.Aspects.Advices.IntroduceFieldCompatibleAction.Fail
  - PostSharp.Aspects.Advices.IntroduceFieldCompatibleAction.Ignore
