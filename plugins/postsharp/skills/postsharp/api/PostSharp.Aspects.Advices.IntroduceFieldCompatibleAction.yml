  langs:
  - csharp
  - vb
  name: IntroduceFieldCompatibleAction
  nameWithType: IntroduceFieldCompatibleAction
  fullName: PostSharp.Aspects.Advices.IntroduceFieldCompatibleAction
  type: Enum
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Specifies what an <xref href="PostSharp.Aspects.Advices.IntroduceFieldAdviceInstance" data-throw-if-not-resolved="false"></xref> does when the target type already has a field that is compatible with it.
  remarks: >-
    <p>A field is compatible when it has the requested name, or the type of the request when no name is requested, and when it has exactly
        the type of the request and the same static or instance kind. The candidates are the fields of the target type, the fields introduced by
        earlier requests, and the fields of the base types that the target type can access. A member that has the requested name but is not
        compatible is handled by <xref href="PostSharp.Aspects.Advices.IntroduceFieldAdviceInstance.WhenIncompatibleMemberExists" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public enum IntroduceFieldCompatibleAction
    content.vb: Public Enum IntroduceFieldCompatibleAction
  seealso:
  - linkId: PostSharp.Aspects.Advices.IntroduceFieldAdviceInstance.WhenCompatibleFieldExists
    commentId: P:PostSharp.Aspects.Advices.IntroduceFieldAdviceInstance.WhenCompatibleFieldExists
  - linkType: HRef
    linkId: '@advice-provider'
    altText: 'Conceptual: Providing Advices Dynamically'
