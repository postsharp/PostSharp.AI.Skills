  name: LoggingRoles
  nameWithType: LoggingRoles
  fullName: PostSharp.Patterns.Diagnostics.LoggingRoles
  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics
  summary: Defines the standard logging roles.
  remarks: >-
    <p>A role identifies the component that emits a log record. Together with a type or namespace name, it determines the source of the record,
        whose verbosity can be configured separately.</p>
    <p>
      <xref href="PostSharp.Patterns.Diagnostics.LoggingRoles.Caching" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Diagnostics.LoggingRoles.Meta" data-throw-if-not-resolved="false"></xref> are system roles: their records are emitted from the <xref href="PostSharp.Patterns.Diagnostics.LogLevel.Warning" data-throw-if-not-resolved="false"></xref> level by default,
        and verbosity settings that do not name a role do not apply to them. To change their verbosity, specify the role explicitly.</p>
  example: []
  syntax:
    content: public static class LoggingRoles
    content.vb: Public Module LoggingRoles
  seealso:
  - linkType: HRef
    linkId: '@logging-verbosity-api'
    altText: 'Conceptual: Adjusting Logging Verbosity Programmatically'
