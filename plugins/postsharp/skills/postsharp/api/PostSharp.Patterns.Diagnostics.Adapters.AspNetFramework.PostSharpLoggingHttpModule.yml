  name: PostSharpLoggingHttpModule(LogEventMetadata, Predicate<Uri>, ICorrelationProtocol)
  nameWithType: PostSharpLoggingHttpModule.PostSharpLoggingHttpModule(LogEventMetadata, Predicate<Uri>, ICorrelationProtocol)
  fullName: PostSharp.Patterns.Diagnostics.Adapters.AspNetFramework.PostSharpLoggingHttpModule.PostSharpLoggingHttpModule(PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata, System.Predicate<System.Uri>, PostSharp.Patterns.Diagnostics.Correlation.ICorrelationProtocol)
  type: Constructor
  assemblies:
  - PostSharp.Patterns.Diagnostics.Adapters.AspNetFramework
  namespace: PostSharp.Patterns.Diagnostics.Adapters.AspNetFramework
  summary: Initializes a new instance of the <xref href="PostSharp.Patterns.Diagnostics.Adapters.AspNetFramework.PostSharpLoggingHttpModule" data-throw-if-not-resolved="false"></xref> class and specifies a custom <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: protected PostSharpLoggingHttpModule(LogEventMetadata metadata = null, Predicate<Uri> requestFilter = null, ICorrelationProtocol correlationProtocol = null)
    parameters:
    - id: metadata
      type: PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata
      description: >-
        An optional <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata" data-throw-if-not-resolved="false"></xref>, which maps an <xref href="System.Web.HttpContext" data-throw-if-not-resolved="false"></xref>
                    to a set of properties and an expression model. The default implementation is <xref href="PostSharp.Patterns.Diagnostics.Adapters.AspNetFramework.AspNetFrameworkRequestMetadata" data-throw-if-not-resolved="false"></xref>.
                    You can derive this class if you want to add or remove properties. If you want to change the expression model,
                    you have to derive the generic abstract <xref href="PostSharp.Patterns.Diagnostics.Adapters.AspNetFramework.AspNetFrameworkRequestMetadata%601" data-throw-if-not-resolved="false"></xref>.
    - id: requestFilter
      type: System.Predicate{System.Uri}
      description: >-
        An optional predicate that determines whether a specific request should be logged. If this parameter is <code>null</code>,

        the value of <xref href="PostSharp.Patterns.Diagnostics.Adapters.AspNetFramework.PostSharpLoggingHttpModule.RequestFilter" data-throw-if-not-resolved="false"></xref> will be used. This property will be evaluated for each request.
    - id: correlationProtocol
      type: PostSharp.Patterns.Diagnostics.Correlation.ICorrelationProtocol
      description: >-
        An optional implementation of <xref href="PostSharp.Patterns.Diagnostics.Correlation.ICorrelationProtocol" data-throw-if-not-resolved="false"></xref> to support
                    distributed logging and interpret incoming request headers. If this parameter is <code>null</code>, the value
                    of the <xref href="PostSharp.Patterns.Diagnostics.Adapters.AspNetFramework.PostSharpLoggingHttpModule.CorrelationProtocol" data-throw-if-not-resolved="false"></xref> static property will be used. This property will be evaluated for each request.
    content.vb: Protected Sub New(metadata As LogEventMetadata = Nothing, requestFilter As Predicate(Of Uri) = Nothing, correlationProtocol As ICorrelationProtocol = Nothing)
  overload: PostSharp.Patterns.Diagnostics.Adapters.AspNetFramework.PostSharpLoggingHttpModule.#ctor*
