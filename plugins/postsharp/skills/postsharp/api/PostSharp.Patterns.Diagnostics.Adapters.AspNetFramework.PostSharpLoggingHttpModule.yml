  commentId: M:PostSharp.Patterns.Diagnostics.Adapters.AspNetFramework.PostSharpLoggingHttpModule.#ctor(PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata,System.Predicate{System.Uri},PostSharp.Patterns.Diagnostics.Correlation.ICorrelationProtocol)
