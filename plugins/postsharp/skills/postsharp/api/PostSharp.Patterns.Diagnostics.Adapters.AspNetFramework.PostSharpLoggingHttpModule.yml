  name: PostSharpLoggingHttpModule
  nameWithType: PostSharpLoggingHttpModule
  fullName: PostSharp.Patterns.Diagnostics.Adapters.AspNetFramework.PostSharpLoggingHttpModule
  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics.Adapters.AspNetFramework
  namespace: PostSharp.Patterns.Diagnostics.Adapters.AspNetFramework
  summary: >-
    An <xref href="System.Web.IHttpModule" data-throw-if-not-resolved="false"></xref> that defines a PostSharp Logging activity (and possibly a transaction)

    for incoming HTTP requests. This module can be added as such to <code>web.config</code>. It can also be derived

    in a custom class, which allows you to override the <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata" data-throw-if-not-resolved="false"></xref>. The default

    implementation is <xref href="PostSharp.Patterns.Diagnostics.Adapters.AspNetFramework.AspNetFrameworkRequestMetadata" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>Register the module under <code>system.webServer/modules</code> in <code>web.config</code>. For distributed logging, set the
        <xref href="PostSharp.Patterns.Diagnostics.Adapters.AspNetFramework.PostSharpLoggingHttpModule.CorrelationProtocol" data-throw-if-not-resolved="false"></xref> property when the application starts, for example in <code>Global.asax</code>, and accept correlation
        headers from trusted callers only. By default, <xref href="PostSharp.Patterns.Diagnostics.Adapters.AspNetFramework.PostSharpLoggingHttpModule.RequestFilter" data-throw-if-not-resolved="false"></xref> excludes static content paths such as <code>/css</code> and <code>/js</code>.</p>
    <p>Each captured request can open a logging transaction. A transaction policy of type <code>AspNetFrameworkRequest</code> in the
        logging configuration file can set the verbosity of selected requests, and its expressions see the request as an
        <xref href="PostSharp.Patterns.Diagnostics.Adapters.AspNetFramework.AspNetFrameworkRequestExpressionModel" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: 'public class PostSharpLoggingHttpModule : IHttpModule'
    content.vb: Public Class PostSharpLoggingHttpModule Implements IHttpModule
