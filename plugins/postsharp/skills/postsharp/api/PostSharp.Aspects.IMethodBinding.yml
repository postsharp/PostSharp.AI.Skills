  name: Invoke(ref object, Arguments)
  nameWithType: IMethodBinding.Invoke(ref object, Arguments)
  fullName: PostSharp.Aspects.IMethodBinding.Invoke(ref object, PostSharp.Aspects.Arguments)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Invokes the next node in the chain of invocation.
  remarks: >-
    <p>
      The
      <code class="paramref">instance</code>
      parameter is passed by reference so that instance methods of value types (
      <code>struct</code>
      in C#) are allowed to change the value of the instance.
    </p>
  example: []
  syntax:
    content: object Invoke(ref object instance, Arguments arguments)
    parameters:
    - id: instance
      type: System.Object
      description: Target instance on which the method should be invoked, or <code>null</code> if the method is static.
    - id: arguments
      type: PostSharp.Aspects.Arguments
      description: Method arguments.
    return:
      type: System.Object
      description: Return value of the method.
    content.vb: Function Invoke(instance As Object, arguments As Arguments) As Object
