  fullName: PostSharp.Aspects.Advices.AwaitedMethodAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Binds a parameter of an <xref href="PostSharp.Aspects.Advices.OnMethodYieldAdvice" data-throw-if-not-resolved="false"></xref> method to the method called by the async method to get the object it awaits.
  remarks: >-
    The parameter must be of type <xref href="System.Reflection.MethodBase" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.MemberInfo" data-throw-if-not-resolved="false"></xref> or <xref href="System.Object" data-throw-if-not-resolved="false"></xref>, and it cannot be <code>ref</code>,

    <code>in</code> or <code>out</code>. Its value is <code>null</code> when the

    compiler cannot identify the method from the code of the <code>await</code> expression. This attribute can be used only in <xref href="PostSharp.Aspects.Advices.OnMethodYieldAdvice" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: 'public sealed class AwaitedMethodAttribute : AdviceParameterAttribute'
    content.vb: Public NotInheritable Class AwaitedMethodAttribute Inherits AdviceParameterAttribute
