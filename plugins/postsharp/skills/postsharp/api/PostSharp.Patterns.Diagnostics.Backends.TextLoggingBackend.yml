  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Backends
  summary: A base class for all text-based logging backends.
  remarks: >-
    <p>To integrate PostSharp Logging with a logging framework that has no ready-made backend, derive a class from
        <xref href="PostSharp.Patterns.Diagnostics.Backends.TextLoggingBackend" data-throw-if-not-resolved="false"></xref>. Implement <xref href="PostSharp.Patterns.Diagnostics.Backends.TextLoggingBackend.GetTextBackendOptions" data-throw-if-not-resolved="false"></xref> so that it returns an instance of a class derived from
        <xref href="PostSharp.Patterns.Diagnostics.Backends.TextLoggingBackendOptions" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.CreateTypeSource(PostSharp.Patterns.Diagnostics.LoggingNamespaceSource%2cSystem.Type)" data-throw-if-not-resolved="false"></xref> so that it returns your
        <xref href="PostSharp.Patterns.Diagnostics.LoggingTypeSource" data-throw-if-not-resolved="false"></xref>, and <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.CreateRecordBuilder" data-throw-if-not-resolved="false"></xref> so that it returns your
        <xref href="PostSharp.Patterns.Diagnostics.RecordBuilders.TextLogRecordBuilder" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: 'public abstract class TextLoggingBackend : LoggingBackend, IDisposable'
    content.vb: Public MustInherit Class TextLoggingBackend Inherits LoggingBackend Implements IDisposable
  seealso:
  - linkType: HRef
    linkId: '@custom-logging-backend'
    altText: 'Conceptual: Building Your Own Logging Backend (Adapter)'
