  fullName: PostSharp.Aspects.CompositionAspect
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Aspect that, when applied on a type, introduces one or more new interfaces

    into that type.
  remarks: >-
    <div class="NOTE"><h5>note</h5><p>
              Consider using a composite aspect and introducing an interface using <xref href="PostSharp.Aspects.Advices.IntroduceMemberAttribute" data-throw-if-not-resolved="false"></xref> 
             instead of using a <xref href="PostSharp.Aspects.CompositionAspect" data-throw-if-not-resolved="false"></xref>.
            </p></div>
        <p>
            The <xref href="PostSharp.Aspects.CompositionAspect.GetPublicInterfaces(System.Type)" data-throw-if-not-resolved="false"></xref> method 
            is invoked at build time. At runtime, the method <xref href="PostSharp.Aspects.CompositionAspect.CreateImplementationObject(PostSharp.Aspects.AdviceArgs)" data-throw-if-not-resolved="false"></xref>
            should return an object implementing all interfaces.
            </p>
        <p>
            Use the <xref href="PostSharp.Post" data-throw-if-not-resolved="false"></xref>.<xref href="PostSharp.Post.Cast%60%602(%60%600)" data-throw-if-not-resolved="false"></xref>
            method to cast the enhanced type to the newly implemented interface. This
            cast is verified during post-compilation.
            </p>
        <p>
                The properties <xref href="PostSharp.Aspects.CompositionAspect.OverrideAction" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.CompositionAspect.AncestorOverrideAction" data-throw-if-not-resolved="false"></xref> determine
            what should happen if the target type already implements the interface directly or indirectly.
            </p>
        <p>
             By default, the object implementing the interface is stored as a serializable field. If the property
            <xref href="PostSharp.Aspects.CompositionAspect.NonSerializedImplementation" data-throw-if-not-resolved="false"></xref> is set to <code>true</code>, this field will be marked
            as <xref href="System.NonSerializedAttribute" data-throw-if-not-resolved="false"></xref>.
            </p>
        <br />
        <p>
          <div class="NOTE"><h5>note</h5><p>
        All classes implementing
        <xref href="PostSharp.Aspects.IAspect" data-throw-if-not-resolved="false"></xref>
        should typically be marked as serializable
        using the 
        <xref href="System.SerializableAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.PSerializableAttribute" data-throw-if-not-resolved="false"></xref> custom attribute. Fields that
        are only used at runtime (and unknown at compile-time) should be carefully
        marked with the <xref href="System.NonSerializedAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.PNonSerializedAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.
        When another aspect serializer (such as <xref href="PostSharp.Aspects.Serialization.MsilAspectSerializer" data-throw-if-not-resolved="false"></xref>) is used,
        it is not necessary to mark the aspect class as serializable.
        For more information, see
        <a href="@aspect-serialization">Aspect Serialization</a>.
      </p></div>
        </p>
        <a href="@aspect-serialization">
      Conceptual: Understanding Aspect Serialization
    </a>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Class|AttributeTargets.Struct, AllowMultiple = true, Inherited = false)]

      [MulticastAttributeUsage(MulticastTargets.Class|MulticastTargets.Struct, AllowMultiple = true)]

      [AspectConfigurationAttributeType(typeof(CompositionAspectConfigurationAttribute))]

      [Serializer(null)]

      public abstract class CompositionAspect : TypeLevelAspect, ITypeLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, ICompositionAspect, ITypeLevelAspect, IAspect
    content.vb: >-
      <AttributeUsage(AttributeTargets.AssemblyOrAttributeTargets.ClassOrAttributeTargets.Struct, AllowMultiple:=True, Inherited:=False)>

      <MulticastAttributeUsage(MulticastTargets.ClassOrMulticastTargets.Struct, AllowMultiple:=True)>

      <AspectConfigurationAttributeType(GetType(CompositionAspectConfigurationAttribute))>

      <Serializer(Nothing)>

      Public MustInherit Class CompositionAspect Inherits TypeLevelAspect Implements ITypeLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, ICompositionAspect, ITypeLevelAspect, IAspect
