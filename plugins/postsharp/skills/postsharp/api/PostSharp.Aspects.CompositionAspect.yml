  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Method invoked at runtime, during the initialization of instances of the target type,

    to create the composed object.
  remarks: >-
    This method is invoked at runtime, after the base constructor has executed and before

    the constructor of the current type is executed.
  example: []
  syntax:
    content: public abstract object CreateImplementationObject(AdviceArgs args)
    parameters:
    - id: args
      type: PostSharp.Aspects.AdviceArgs
    return:
      type: System.Object
      description: >-
        The composed object. This interface should implement the interfaces specified
                      by the <xref href="PostSharp.Aspects.CompositionAspect.GetPublicInterfaces(System.Type)" data-throw-if-not-resolved="false"></xref> method.
    content.vb: Public MustOverride Function CreateImplementationObject(args As AdviceArgs) As Object
  overload: PostSharp.Aspects.CompositionAspect.CreateImplementationObject*
