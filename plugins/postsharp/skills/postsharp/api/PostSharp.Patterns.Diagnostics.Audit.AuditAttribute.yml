  nameWithType: AuditAttribute
  fullName: PostSharp.Patterns.Diagnostics.Audit.AuditAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Audit
  summary: >-
    Custom attribute that, when applied to a method, causes PostSharp to audit the execution of this method. Whenever an audited method is executed, the

    <xref href="PostSharp.Patterns.Diagnostics.Audit.AuditServices.RecordPublished" data-throw-if-not-resolved="false"></xref> event is raised. You need to register your own logic with the <xref href="PostSharp.Patterns.Diagnostics.Audit.AuditServices.RecordPublished" data-throw-if-not-resolved="false"></xref> event,

    for example to append the record to a database table.
  remarks: >-
    <p>Audit is a special kind of logging. The <xref href="PostSharp.Patterns.Diagnostics.Audit.AuditAttribute" data-throw-if-not-resolved="false"></xref> aspect adds logging with the <code>Audit</code> profile, which is by default served
        by the <xref href="PostSharp.Patterns.Diagnostics.Backends.Audit.AuditBackend" data-throw-if-not-resolved="false"></xref> backend, which exposes a simple API to the <xref href="PostSharp.Patterns.Diagnostics.Audit.AuditServices" data-throw-if-not-resolved="false"></xref> class.
        </p>
    <p>The <xref href="PostSharp.Patterns.Diagnostics.Audit.AuditAttribute" data-throw-if-not-resolved="false"></xref> aspect can be used side-by-side with the <xref href="PostSharp.Patterns.Diagnostics.LogAttribute" data-throw-if-not-resolved="false"></xref> aspect.</p>
  example: []
  syntax:
    content: >-
      [Obsolete("This feature has been moved to the sample PostSharp.Samples.Logging.Audit.")]

      public class AuditAttribute : LogAttributeBase, IMethodLevelAspect, IMethodLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, ILogAspect, IAspect
