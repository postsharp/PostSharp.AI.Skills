  fullName: PostSharp.Patterns.Model.AggregateAllChangesAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Model
  summary: >-
    Custom attribute that, when applied to a property of a class enhanced with the <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedAttribute" data-throw-if-not-resolved="false"></xref>, 

    specifies that a change of any property of the property value will be considered as a change of the property itself.
  remarks: >-
    <p>This attribute can currently be used only on properties of types derived from <xref href="System.Collections.ICollection" data-throw-if-not-resolved="false"></xref> or <xref href="System.Collections.Generic.ICollection%601" data-throw-if-not-resolved="false"></xref>.
        Currently, only notifications of the property named <code>Item[]</code> are considered.</p>
    <p>Without this attribute, properties that depend on the collection property as a whole are notified only when the collection object itself is replaced,
        not when its items change.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Property)]

      public sealed class AggregateAllChangesAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Property)>

      Public NotInheritable Class AggregateAllChangesAttribute Inherits Attribute
