- uid: PostSharp.Patterns.Diagnostics.Contexts.CallerInfo.GetDynamic(System.Int32)
  commentId: M:PostSharp.Patterns.Diagnostics.Contexts.CallerInfo.GetDynamic(System.Int32)
  id: GetDynamic(System.Int32)
  parent: PostSharp.Patterns.Diagnostics.Contexts.CallerInfo
