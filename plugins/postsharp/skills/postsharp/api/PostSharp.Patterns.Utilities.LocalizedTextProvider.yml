  summary: Gets a message declared by the <xref href="PostSharp.Patterns.Utilities.LocalizedTextProvider" data-throw-if-not-resolved="false"></xref> or by the rest of the responsibility chain, if applicable.
  remarks: >-
    <p>An implementation must call the base implementation if it does not provide the requested message.
        The base implementation is responsible for invoking the next provider in the chain of responsibility.
        </p>
