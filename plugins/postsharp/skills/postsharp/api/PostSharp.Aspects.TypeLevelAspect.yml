  name: TypeLevelAspect
  nameWithType: TypeLevelAspect
  fullName: PostSharp.Aspects.TypeLevelAspect
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Base class for all aspects applied on types.
  remarks: >-
    <div class="NOTE"><h5>note</h5><p>
      This class does not provide any advice. You may derive your aspect class from a
      <a href="@simple-aspects" target="_self">
        class providing
        predefined advice
      </a>, or build a
      <a href="@member-level-aspects" target="_self">member-level aspect</a> or a
      <a href="@complex-aspects" target="_self">type-level or assembly-level aspect</a> with advice methods.
    </p></div>
        <a href="@simple-aspects#AspectClasses" target="_self">
      Conceptual: Developing Simple Aspects
    </a>
        <a href="@member-level-aspects" target="_self">
      Conceptual: Developing Member-Level Aspects
    </a>
        <a href="@complex-aspects" target="_self">
      Conceptual: Developing Type- and Assembly-Level Aspects
    </a>
        <p>
            An advice of an aspect derived from this class cannot apply to the type itself, so an advice that targets members needs a pointcut.
            <xref href="PostSharp.Aspects.Advices.MulticastPointcut" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.Advices.SignaturePointcut" data-throw-if-not-resolved="false"></xref> select among the members declared in the target type;
            <xref href="PostSharp.Aspects.Advices.MethodPointcut" data-throw-if-not-resolved="false"></xref> can also select parameters and return values. The advices are:
            </p>
        <ul><li>on methods and constructors, the method boundary advices (<xref href="PostSharp.Aspects.Advices.OnMethodEntryAdvice" data-throw-if-not-resolved="false"></xref>,
            <xref href="PostSharp.Aspects.Advices.OnMethodSuccessAdvice" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.OnMethodExceptionAdvice" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.OnMethodExitAdvice" data-throw-if-not-resolved="false"></xref>,
            <xref href="PostSharp.Aspects.Advices.OnMethodYieldAdvice" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.OnMethodResumeAdvice" data-throw-if-not-resolved="false"></xref>);</li><li>on methods, the method interception advices (<xref href="PostSharp.Aspects.Advices.OnMethodInvokeAdvice" data-throw-if-not-resolved="false"></xref>,
            <xref href="PostSharp.Aspects.Advices.OnMethodInvokeAsyncAdvice" data-throw-if-not-resolved="false"></xref>);</li><li>on fields and properties, the location interception advices (<xref href="PostSharp.Aspects.Advices.OnLocationGetValueAdvice" data-throw-if-not-resolved="false"></xref>,
            <xref href="PostSharp.Aspects.Advices.OnLocationSetValueAdvice" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.OnInstanceLocationInitializedAdvice" data-throw-if-not-resolved="false"></xref>);</li><li>on fields, properties, parameters and return values, <xref href="PostSharp.Aspects.Advices.LocationValidationAdvice" data-throw-if-not-resolved="false"></xref>;</li><li>on events, the event interception advices (<xref href="PostSharp.Aspects.Advices.OnEventAddHandlerAdvice" data-throw-if-not-resolved="false"></xref>,
            <xref href="PostSharp.Aspects.Advices.OnEventRemoveHandlerAdvice" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.Advices.OnEventInvokeHandlerAdvice" data-throw-if-not-resolved="false"></xref>).</li></ul>
        <p>
            The following advices need no pointcut. <xref href="PostSharp.Aspects.Advices.IntroduceMemberAttribute" data-throw-if-not-resolved="false"></xref> introduces members into the target type, and
            <xref href="PostSharp.Aspects.Advices.OnInstanceConstructedAdvice" data-throw-if-not-resolved="false"></xref> runs when an instance of the target type has been constructed.
            <xref href="PostSharp.Aspects.Advices.IntroduceInterfaceAttribute" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.Advices.ImportMemberAttribute" data-throw-if-not-resolved="false"></xref> require an instance-scoped aspect: derive
            from <xref href="PostSharp.Aspects.InstanceLevelAspect" data-throw-if-not-resolved="false"></xref>.
            </p>
        <br />
        <p>
          <div class="NOTE"><h5>note</h5><p>
        All classes implementing
        <xref href="PostSharp.Aspects.IAspect" data-throw-if-not-resolved="false"></xref>
        should typically be marked as serializable
        using the 
        <xref href="System.SerializableAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.PSerializableAttribute" data-throw-if-not-resolved="false"></xref> custom attribute. Fields that
        are only used at runtime (and unknown at compile-time) should be carefully
        marked with the <xref href="System.NonSerializedAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.PNonSerializedAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.
        When another aspect serializer (such as <xref href="PostSharp.Aspects.Serialization.MsilAspectSerializer" data-throw-if-not-resolved="false"></xref>) is used,
        it is not necessary to mark the aspect class as serializable.
        For more information, see
        <a href="@aspect-serialization">Aspect Serialization</a>.
      </p></div>
        </p>
        <a href="@aspect-serialization">
      Conceptual: Understanding Aspect Serialization
    </a>
