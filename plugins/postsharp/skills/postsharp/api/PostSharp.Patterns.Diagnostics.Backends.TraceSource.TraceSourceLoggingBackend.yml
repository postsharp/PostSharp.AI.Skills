  namespace: PostSharp.Patterns.Diagnostics.Backends.TraceSource
  summary: Logging backend that logs using <xref href="PostSharp.Patterns.Diagnostics.Backends.TraceSource" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>To use this backend, assign a new instance to <xref href="PostSharp.Patterns.Diagnostics.LoggingServices.DefaultBackend" data-throw-if-not-resolved="false"></xref> when the application starts.

    By default, the backend writes the records of each logged type to a separate <xref href="System.Diagnostics.TraceSource" data-throw-if-not-resolved="false"></xref> named

    after the full name of the type. To write to a single trace source, set <xref href="PostSharp.Patterns.Diagnostics.Backends.TraceSource.TraceSourceLoggingBackendOptions.GetTraceSourceName" data-throw-if-not-resolved="false"></xref>.</p>

    <p>When <xref href="PostSharp.Patterns.Diagnostics.Backends.TraceSource.TraceSourceCollectingTraceListener" data-throw-if-not-resolved="false"></xref> collects the events of your manual logging, make the backend write to a

    trace source whose listeners are the output listeners, not the collecting one.</p>
  example: []
  syntax:
    content: 'public class TraceSourceLoggingBackend : TextLoggingBackend, IDisposable'
    content.vb: Public Class TraceSourceLoggingBackend Inherits TextLoggingBackend Implements IDisposable
