  namespace: PostSharp.Patterns.Recording
  summary: >-
    Read-only collection of operations (<xref href="PostSharp.Patterns.Recording.Operation" data-throw-if-not-resolved="false"></xref>). The class is exposed on the <xref href="PostSharp.Patterns.Recording.Recorder.UndoOperations" data-throw-if-not-resolved="false"></xref>

    and <xref href="PostSharp.Patterns.Recording.Recorder.RedoOperations" data-throw-if-not-resolved="false"></xref> properties.
  remarks: >-
    <p>In addition to the traditional collection members, this class exposes the <xref href="PostSharp.Patterns.Recording.OperationCollection.Trim(System.Int32)" data-throw-if-not-resolved="false"></xref> method,
        which allows you to trim the collection of <xref href="PostSharp.Patterns.Recording.Recorder.UndoOperations" data-throw-if-not-resolved="false"></xref>
        or <xref href="PostSharp.Patterns.Recording.Recorder.RedoOperations" data-throw-if-not-resolved="false"></xref>.</p>
