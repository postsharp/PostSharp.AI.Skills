  name: MessageSource
  nameWithType: MessageSource
  fullName: PostSharp.Extensibility.MessageSource
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: Provides convenience methods to work with an <xref href="PostSharp.Extensibility.IMessageSink" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>A message source emits messages whose texts are stored in a single place, an <xref href="PostSharp.Extensibility.IMessageDispenser" data-throw-if-not-resolved="false"></xref> or a
        <xref href="System.Resources.ResourceManager" data-throw-if-not-resolved="false"></xref>, and identified by their message identifier. Typically, create one singleton instance for each component,
        for example in a static field of a class derived from <xref href="PostSharp.Extensibility.MessageSource" data-throw-if-not-resolved="false"></xref>, and associate it with a class derived from
        <xref href="PostSharp.Extensibility.MessageDispenser" data-throw-if-not-resolved="false"></xref>. For a few messages, the static <code>Write</code> methods of <xref href="PostSharp.Extensibility.Message" data-throw-if-not-resolved="false"></xref> are simpler.</p>
    <p>When the dispenser does not know a message identifier, the message text says that no text was found.
        When a message sink is set, writing a message of severity <xref href="PostSharp.Extensibility.SeverityType.Fatal" data-throw-if-not-resolved="false"></xref> throws a <xref href="PostSharp.Extensibility.MessageException" data-throw-if-not-resolved="false"></xref> after the message is emitted.</p>
  example: []
  syntax:
    content: 'public class MessageSource : MarshalByRefObject, IMessageSink'
    content.vb: Public Class MessageSource Inherits MarshalByRefObject Implements IMessageSink
  seealso:
