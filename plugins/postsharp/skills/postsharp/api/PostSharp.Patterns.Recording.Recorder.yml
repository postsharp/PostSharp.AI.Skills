  name: Recorder
  nameWithType: Recorder
  fullName: PostSharp.Patterns.Recording.Recorder
  type: Class
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording
  summary: Records changes made to an object model and allows you to undo and redo them.
  remarks: >-
    <p>An application typically uses a single recorder, exposed by the <xref href="PostSharp.Patterns.Recording.RecordingServices.DefaultRecorder" data-throw-if-not-resolved="false"></xref> property, but you can
        create several, for instance one per document.</p>
    <p>The <xref href="PostSharp.Patterns.Recording.Recorder.UndoOperations" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Recording.Recorder.RedoOperations" data-throw-if-not-resolved="false"></xref> collections hold strong references to the objects whose changes
        they contain, which prevents these objects from being garbage collected. Use the <xref href="PostSharp.Patterns.Recording.Recorder.MaximumOperationsCount" data-throw-if-not-resolved="false"></xref> property to limit
        the number of operations.</p>
    <p>Do not modify objects that share a recorder concurrently from several threads.</p>
  example: []
  syntax:
    content: >-
      [Obsolete("[Recordable] aspect and its components are deprecated and will be removed in a future version.", false)]

      public sealed class Recorder : INotifyPropertyChanged
    content.vb: >-
      <Obsolete("[Recordable] aspect and its components are deprecated and will be removed in a future version.", False)>

      Public NotInheritable Class Recorder Implements INotifyPropertyChanged
