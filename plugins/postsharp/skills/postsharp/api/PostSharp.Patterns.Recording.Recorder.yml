  summary: >-
    Attaches a recordable object (including its descendant objects) to the current <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref> so that changes in

    this object start being recorded into the current <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref>.
  remarks: <p>This method implicitly attaches all descendants of <code class="paramref">obj</code> to the current <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref>.</p>
