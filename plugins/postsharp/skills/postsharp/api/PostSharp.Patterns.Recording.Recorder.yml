  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording
  summary: Adds a new restore point with the given name.
  remarks: >-
    <p>A <xref href="PostSharp.Patterns.Recording.RestorePoint" data-throw-if-not-resolved="false"></xref> can be used as an argument to the <xref href="PostSharp.Patterns.Recording.Recorder.UndoTo(PostSharp.Patterns.Recording.Operation)" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Recording.Recorder.RedoTo(PostSharp.Patterns.Recording.Operation)" data-throw-if-not-resolved="false"></xref> method.</p>

    <p>To remove a <xref href="PostSharp.Patterns.Recording.RestorePoint" data-throw-if-not-resolved="false"></xref> from <xref href="PostSharp.Patterns.Recording.Recorder.UndoOperations" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Recording.Recorder.RedoOperations" data-throw-if-not-resolved="false"></xref>, call the <xref href="PostSharp.Patterns.Recording.RestorePoint.Remove" data-throw-if-not-resolved="false"></xref> method.</p>
  example: []
  syntax:
    content: public RestorePoint AddRestorePoint(string name = null)
    parameters:
    - id: name
      type: System.String
      description: The name of the restore point, or <code>null</code> to create an unnamed restore point.
    return:
      type: PostSharp.Patterns.Recording.RestorePoint
      description: The newly created <xref href="PostSharp.Patterns.Recording.RestorePoint" data-throw-if-not-resolved="false"></xref>.
