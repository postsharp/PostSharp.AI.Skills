  syntax:
    content: public void Attach(object obj)
    parameters:
    - id: obj
      type: System.Object
      description: The recordable object whose changes need to be recorded into the current <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref>.
