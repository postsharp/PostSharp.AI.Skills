- uid: PostSharp.Patterns.Threading.IFreezable.Freeze
  commentId: M:PostSharp.Patterns.Threading.IFreezable.Freeze
  id: Freeze
  parent: PostSharp.Patterns.Threading.IFreezable
  langs:
  - csharp
  - vb
  name: Freeze()
  nameWithType: IFreezable.Freeze()
  fullName: PostSharp.Patterns.Threading.IFreezable.Freeze()
  type: Method
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: Prevents the current object from being modified.
  remarks: >-
    <p>This method also freezes the children of the object. Before the object is frozen, it can be accessed only from the thread that created it,
        so call this method from that thread. Calling the method on an object that is already frozen has no effect.</p>
  example: []
  syntax:
    content: void Freeze()
    content.vb: Sub Freeze()
