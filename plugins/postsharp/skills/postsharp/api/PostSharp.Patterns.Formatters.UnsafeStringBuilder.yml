  - csharp
  - vb
  name: SetNullTermination()
  nameWithType: UnsafeStringBuilder.SetNullTermination()
  fullName: PostSharp.Patterns.Formatters.UnsafeStringBuilder.SetNullTermination()
  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Formatters
  summary: >-
    Appends a null character at the end of the current string, without affecting the string length.

    In case of overflow, if <xref href="PostSharp.Patterns.Formatters.UnsafeStringBuilder.ThrowOnOverflow" data-throw-if-not-resolved="false"></xref> is <code>false</code>, the last character of the string is removed

    and the string length is decreased by 1.
  example: []
  syntax:
    content: public bool SetNullTermination()
    return:
      type: System.Boolean
      description: >-
        <code>true</code> if the string was null-terminated without affecting its length, or <code>false</code> if the last character of the string was replaced by the null character
            and the string length was decreased by 1.
    content.vb: Public Function SetNullTermination() As Boolean
  overload: PostSharp.Patterns.Formatters.UnsafeStringBuilder.SetNullTermination*
