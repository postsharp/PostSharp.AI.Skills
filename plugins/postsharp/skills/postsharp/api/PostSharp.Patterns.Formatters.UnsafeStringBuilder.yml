  type: Constructor
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Formatters
  summary: Initializes a new instance of the <xref href="PostSharp.Patterns.Formatters.UnsafeStringBuilder" data-throw-if-not-resolved="false"></xref> class and allocates a new buffer.
  example: []
  syntax:
    content: public UnsafeStringBuilder(int capacity = 2048, bool throwOnOverflow = true)
    parameters:
    - id: capacity
      type: System.Int32
      description: The capacity of the new <xref href="PostSharp.Patterns.Formatters.UnsafeStringBuilder" data-throw-if-not-resolved="false"></xref>.
    - id: throwOnOverflow
      type: System.Boolean
      description: >-
        <code>true</code> if an <xref href="System.OverflowException" data-throw-if-not-resolved="false"></xref> should be thrown when
            the buffer capacity is insufficient, <code>false</code> if the <code>Append</code> method should return <code>false</code> without throwing an exception.
