  name: UnsafeStringBuilder
  nameWithType: UnsafeStringBuilder
  fullName: PostSharp.Patterns.Formatters.UnsafeStringBuilder
  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Formatters
  summary: A class similar to <xref href="System.Text.StringBuilder" data-throw-if-not-resolved="false"></xref>, but implemented using unsafe C#.
  remarks: >-
    <p>Custom formatters, <xref href="PostSharp.Patterns.Formatters.IFormattable.Format(PostSharp.Patterns.Formatters.UnsafeStringBuilder%2cPostSharp.Patterns.Formatters.FormattingRole)" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Formatters.Formatter%601.Write(PostSharp.Patterns.Formatters.UnsafeStringBuilder%2c%600)" data-throw-if-not-resolved="false"></xref>, write into this class.
        Unlike <xref href="System.Text.StringBuilder" data-throw-if-not-resolved="false"></xref>, it has a fixed capacity: when the buffer is full, the <code>Append</code> methods throw an
        <xref href="System.OverflowException" data-throw-if-not-resolved="false"></xref> or return <code>false</code>, depending on the <xref href="PostSharp.Patterns.Formatters.UnsafeStringBuilder.ThrowOnOverflow" data-throw-if-not-resolved="false"></xref> property.</p>
  example: []
  syntax:
    content: 'public sealed class UnsafeStringBuilder : IDisposable'
    content.vb: Public NotInheritable Class UnsafeStringBuilder Implements IDisposable
