- uid: PostSharp.Patterns.Threading.ActorDispatcher.ScheduleProcessQueue
  commentId: M:PostSharp.Patterns.Threading.ActorDispatcher.ScheduleProcessQueue
  id: ScheduleProcessQueue
  parent: PostSharp.Patterns.Threading.ActorDispatcher
  langs:
  - csharp
  - vb
  name: ScheduleProcessQueue()
  nameWithType: ActorDispatcher.ScheduleProcessQueue()
  fullName: PostSharp.Patterns.Threading.ActorDispatcher.ScheduleProcessQueue()
  type: Method
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Schedules the execution of the <xref href="PostSharp.Patterns.Threading.ActorDispatcher.ProcessQueue" data-throw-if-not-resolved="false"></xref> method, typically on a worker thread or in the <xref href="System.Threading.ThreadPool" data-throw-if-not-resolved="false"></xref>.

    The default implementation uses the <xref href="System.Threading.ThreadPool" data-throw-if-not-resolved="false"></xref> on platforms that have a thread pool, otherwise it schedules a new <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: protected virtual void ScheduleProcessQueue()
    content.vb: Protected Overridable Sub ScheduleProcessQueue()
  overload: PostSharp.Patterns.Threading.ActorDispatcher.ScheduleProcessQueue*
- uid: PostSharp.Patterns.Threading.ActorDispatcher.MustYield(System.Int32)
  commentId: M:PostSharp.Patterns.Threading.ActorDispatcher.MustYield(System.Int32)
  id: MustYield(System.Int32)
  parent: PostSharp.Patterns.Threading.ActorDispatcher
  langs:
  - csharp
  - vb
  name: MustYield(int)
  nameWithType: ActorDispatcher.MustYield(int)
  fullName: PostSharp.Patterns.Threading.ActorDispatcher.MustYield(int)
  type: Method
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: Determines whether the <xref href="PostSharp.Patterns.Threading.ActorDispatcher.ProcessQueue" data-throw-if-not-resolved="false"></xref> method should interrupt the processing of the message queue before the queue is empty.
  remarks: >-
    <p>When this method returns <code>true</code>, the <xref href="PostSharp.Patterns.Threading.ActorDispatcher.ProcessQueue" data-throw-if-not-resolved="false"></xref> method will immediately invoke the <xref href="PostSharp.Patterns.Threading.ActorDispatcher.ScheduleProcessQueue" data-throw-if-not-resolved="false"></xref> method
        to process remaining messages.</p>
    <p>
        The purpose of this method is to allow custom implementations of the <xref href="PostSharp.Patterns.Threading.ActorDispatcher" data-throw-if-not-resolved="false"></xref> class, which may dispatch the message queue execution
        on a pool composed of a small number of threads, to prevent a few actors from consuming all available threads.
        </p>
  example: []
  syntax:
    content: protected virtual bool MustYield(int count)
    parameters:
    - id: count
      type: System.Int32
      description: The number of messages already processed by the current invocation of the <xref href="PostSharp.Patterns.Threading.ActorDispatcher.ProcessQueue" data-throw-if-not-resolved="false"></xref> method.
    return:
      type: System.Boolean
      description: <code>true</code> if the <xref href="PostSharp.Patterns.Threading.ActorDispatcher.ProcessQueue" data-throw-if-not-resolved="false"></xref> method should stop processing messages, <code>false</code> if it should continue.
    content.vb: Protected Overridable Function MustYield(count As Integer) As Boolean
  overload: PostSharp.Patterns.Threading.ActorDispatcher.MustYield*
  nameWithType.vb: ActorDispatcher.MustYield(Integer)
  fullName.vb: PostSharp.Patterns.Threading.ActorDispatcher.MustYield(Integer)
  name.vb: MustYield(Integer)
