  name: ActorDispatcher
  nameWithType: ActorDispatcher
  fullName: PostSharp.Patterns.Threading.ActorDispatcher
  type: Class
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    A dispatcher compatible with the <xref href="PostSharp.Patterns.Threading.Models.ActorThreadingModel" data-throw-if-not-resolved="false"></xref> threading model, with a message queue based on a <code>ConcurrentQueue</code>.

    The queue itself is processed from the <xref href="System.Threading.ThreadPool" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>This implementation will append every action (as a result of the <xref href="PostSharp.Patterns.Threading.IDispatcher.BeginInvoke(System.Threading.SendOrPostCallback%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> method) into a
        <code>ConcurrentQueue</code>. It will then create a work item to process the <code>ConcurrentQueue</code> and schedule the work item to the <xref href="System.Threading.ThreadPool" data-throw-if-not-resolved="false"></xref>.
        The same work item keeps running until the message queue is empty, and then terminates.</p>
    <p>You can use a different scheduling mechanism instead of the <xref href="System.Threading.ThreadPool" data-throw-if-not-resolved="false"></xref> by deriving the class and overriding the <xref href="PostSharp.Patterns.Threading.ActorDispatcher.ScheduleProcessQueue" data-throw-if-not-resolved="false"></xref>
        method.</p>
    <p>Note that the <xref href="PostSharp.Patterns.Threading.IDispatcher.Invoke(System.Threading.SendOrPostCallback%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> method of the <xref href="PostSharp.Patterns.Threading.IDispatcher" data-throw-if-not-resolved="false"></xref> interface is not supported,
        because the <xref href="PostSharp.Patterns.Threading.Models.ActorThreadingModel" data-throw-if-not-resolved="false"></xref> does not support synchronous calls.
        </p>
  example: []
  syntax:
    content: 'public class ActorDispatcher : IActorDispatcher, IDispatcher'
    content.vb: Public Class ActorDispatcher Implements IActorDispatcher, IDispatcher
