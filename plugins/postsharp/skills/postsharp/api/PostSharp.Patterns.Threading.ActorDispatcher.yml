  name: ProcessQueue()
  nameWithType: ActorDispatcher.ProcessQueue()
  fullName: PostSharp.Patterns.Threading.ActorDispatcher.ProcessQueue()
  type: Method
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: Processes the message queue synchronously.
  remarks: >-
    <p>This method can be invoked by an overridden implementation of the <xref href="PostSharp.Patterns.Threading.ActorDispatcher.ScheduleProcessQueue" data-throw-if-not-resolved="false"></xref> method.</p>

    <p>This method will process all messages until the queue is empty, unless the overridden implementation of <xref href="PostSharp.Patterns.Threading.ActorDispatcher.MustYield(System.Int32)" data-throw-if-not-resolved="false"></xref> returns <code>false</code>.</p>
  example: []
  syntax:
    content: protected void ProcessQueue()
    content.vb: Protected Sub ProcessQueue()
  overload: PostSharp.Patterns.Threading.ActorDispatcher.ProcessQueue*
