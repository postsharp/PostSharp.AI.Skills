  summary: Contains extra functions usable from predicates in XML policy configuration files.
  remarks: >-
    <p>The <code>if</code> and <code>sample</code> expressions are interpreted by Dynamic Expresso, an expression engine that emulates C#.
        Call these functions without the class name, for example <code>Matches(t.Request.Path, "^/invoices")</code>. <xref href="PostSharp.Patterns.Diagnostics.Transactions.Model.TransactionPolicyExpressionFunctions.Matches(System.String%2cSystem.String)" data-throw-if-not-resolved="false"></xref> is
        available in both expressions, while the sampling functions <xref href="PostSharp.Patterns.Diagnostics.Transactions.Model.TransactionPolicyExpressionFunctions.Random(System.Double)" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Diagnostics.Transactions.Model.TransactionPolicyExpressionFunctions.OnceEveryXSeconds(System.Double%2cSystem.String)" data-throw-if-not-resolved="false"></xref> are available
        only in the <code>sample</code> expression and in extended expressions evaluated with <xref href="PostSharp.Patterns.Diagnostics.Transactions.ExtendedTransactionExpressionOptions.AllowSamplingFunctions" data-throw-if-not-resolved="false"></xref>.</p>
