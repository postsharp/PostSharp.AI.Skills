- uid: PostSharp.Patterns.Diagnostics.Transactions.Model.TransactionPolicyExpressionFunctions.OnceEveryXSeconds(System.Double,System.String)
  commentId: M:PostSharp.Patterns.Diagnostics.Transactions.Model.TransactionPolicyExpressionFunctions.OnceEveryXSeconds(System.Double,System.String)
  id: OnceEveryXSeconds(System.Double,System.String)
  parent: PostSharp.Patterns.Diagnostics.Transactions.Model.TransactionPolicyExpressionFunctions
  langs:
  - csharp
  - vb
  name: OnceEveryXSeconds(double, string)
  nameWithType: TransactionPolicyExpressionFunctions.OnceEveryXSeconds(double, string)
  fullName: PostSharp.Patterns.Diagnostics.Transactions.Model.TransactionPolicyExpressionFunctions.OnceEveryXSeconds(double, string)
  type: Method
  assemblies:
  - PostSharp.Patterns.Diagnostics.Configuration
  namespace: PostSharp.Patterns.Diagnostics.Transactions.Model
  summary: Returns <code>true</code> if the method has not returned <code>true</code> for the same key for a period of time.
  remarks: >-
    <p>
        Note that the side effect of calling this method, in case it returns <code>true</code>, is to set a timestamp for the specified <code class="paramref">key</code>
        so that the next call to the method with the same value of <code class="paramref">key</code> will return <code>false</code> unless it is called after the given time span has elapsed.
        This is a side effect of calling this method and does not depend on the actual result of the <code>sampling</code> expression. That is,
        the side effect will occur even in a combined expression like <code>OnceEveryXSeconds( 1, "foo") &amp;&amp; false</code>. 
        </p>
    <p>This function is only available in the <xref href="PostSharp.Patterns.Diagnostics.Transactions.Model.PolicyConfigurationModel.Sample" data-throw-if-not-resolved="false"></xref> expression.</p>
  example: []
  syntax:
    content: public static bool OnceEveryXSeconds(double seconds, string key)
    parameters:
    - id: seconds
      type: System.Double
      description: An amount of time in seconds.
    - id: key
      type: System.String
      description: An arbitrary key. Required but can be empty.
    return:
      type: System.Boolean
      description: <code>true</code> if the method has not returned <code>true</code> for the same <code class="paramref">key</code> during the given period of time, otherwise <code>false</code>.
    content.vb: Public Shared Function OnceEveryXSeconds(seconds As Double, key As String) As Boolean
  overload: PostSharp.Patterns.Diagnostics.Transactions.Model.TransactionPolicyExpressionFunctions.OnceEveryXSeconds*
  nameWithType.vb: TransactionPolicyExpressionFunctions.OnceEveryXSeconds(Double, String)
  fullName.vb: PostSharp.Patterns.Diagnostics.Transactions.Model.TransactionPolicyExpressionFunctions.OnceEveryXSeconds(Double, String)
