- uid: PostSharp.Patterns.Model.IAttacher.OnChildAttached(System.Object,System.Object,System.Object,PostSharp.Patterns.Model.ChildInfo)
  commentId: M:PostSharp.Patterns.Model.IAttacher.OnChildAttached(System.Object,System.Object,System.Object,PostSharp.Patterns.Model.ChildInfo)
  id: OnChildAttached(System.Object,System.Object,System.Object,PostSharp.Patterns.Model.ChildInfo)
  parent: PostSharp.Patterns.Model.IAttacher
  langs:
  - csharp
  - vb
  name: OnChildAttached(object, object, object, ChildInfo)
  nameWithType: IAttacher.OnChildAttached(object, object, object, ChildInfo)
  fullName: PostSharp.Patterns.Model.IAttacher.OnChildAttached(object, object, object, PostSharp.Patterns.Model.ChildInfo)
  type: Method
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: This method is invoked after a child has been successfully attached to the current node.
  example: []
  syntax:
    content: void OnChildAttached(object state, object parent, object child, ChildInfo childInfo)
    parameters:
    - id: state
      type: System.Object
      description: The opaque state object passed to <xref href="PostSharp.Patterns.Model.IAttachable.AttachToParent(PostSharp.Patterns.Model.RelationshipInfo%2cPostSharp.Patterns.Model.IAttacher%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>.
    - id: parent
      type: System.Object
      description: >-
        The actual parent of <code class="paramref">child</code>. If <code class="paramref">child</code> is assigned to a parent surrogate,
                        the parameter is set to the actual parent, that is, to the parent of the parent surrogate.
    - id: child
      type: System.Object
      description: The child object.
    - id: childInfo
      type: PostSharp.Patterns.Model.ChildInfo
      description: >-
        Information about the location (field or collection item, typically) to which the child is assigned and
                    about the relationship of the current node relative to the parent node.
    content.vb: Sub OnChildAttached(state As Object, parent As Object, child As Object, childInfo As ChildInfo)
  overload: PostSharp.Patterns.Model.IAttacher.OnChildAttached*
  nameWithType.vb: IAttacher.OnChildAttached(Object, Object, Object, ChildInfo)
