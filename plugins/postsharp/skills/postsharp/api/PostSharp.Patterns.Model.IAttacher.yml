  summary: >-
    Describes the semantics of a service through which a child <xref href="PostSharp.Patterns.Model.IAggregatable" data-throw-if-not-resolved="false"></xref> object can attach itself to a parent object.

    This interface is typically implemented by the parent object by composition.
  remarks: <p>This interface should typically not be used or implemented in user code.</p>
