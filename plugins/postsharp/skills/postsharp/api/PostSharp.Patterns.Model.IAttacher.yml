- uid: PostSharp.Patterns.Model.IAttacher.AttachChild(System.Object,System.Object,PostSharp.Patterns.Model.ChildInfo)
  commentId: M:PostSharp.Patterns.Model.IAttacher.AttachChild(System.Object,System.Object,PostSharp.Patterns.Model.ChildInfo)
  id: AttachChild(System.Object,System.Object,PostSharp.Patterns.Model.ChildInfo)
  parent: PostSharp.Patterns.Model.IAttacher
  langs:
  - csharp
  - vb
  name: AttachChild(object, object, ChildInfo)
  nameWithType: IAttacher.AttachChild(object, object, ChildInfo)
  fullName: PostSharp.Patterns.Model.IAttacher.AttachChild(object, object, PostSharp.Patterns.Model.ChildInfo)
  type: Method
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: Attaches an object as a child of the current node.
  remarks: >-
    The new parent of <code class="paramref">child</code> will be the current node (the value returned by <xref href="PostSharp.Patterns.Model.IAttacher.GetNode(System.Object)" data-throw-if-not-resolved="false"></xref>);

    or the parent of the current node, if the current node is a parent surrogate.
  example: []
  syntax:
    content: object AttachChild(object state, object child, ChildInfo childInfo)
    parameters:
    - id: state
      type: System.Object
      description: The opaque state object passed to <xref href="PostSharp.Patterns.Model.IAttachable.AttachToParent(PostSharp.Patterns.Model.RelationshipInfo%2cPostSharp.Patterns.Model.IAttacher%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>.
    - id: child
      type: System.Object
      description: The object that must be attached as a child to the current node.
    - id: childInfo
      type: PostSharp.Patterns.Model.ChildInfo
      description: >-
        Information about the location (field or collection item, typically) to which the child is assigned and
                    about the relationship of the current node relative to the parent node.
                    The <xref href="PostSharp.Patterns.Model.RelationshipInfo.Relationship" data-throw-if-not-resolved="false"></xref> property must be set to <xref href="PostSharp.Patterns.Model.RelationshipKind.Child" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Model.RelationshipKind.ParentSurrogate" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Object
      description: >-
        The new parent of <code class="paramref">child</code>, or <code>null</code> if <code class="paramref">child</code>
                    was already attached to the same parent node through another relationship. If the current node is a parent surrogate, the method
                    returns the parent of the current node.
    content.vb: Function AttachChild(state As Object, child As Object, childInfo As ChildInfo) As Object
  overload: PostSharp.Patterns.Model.IAttacher.AttachChild*
  nameWithType.vb: IAttacher.AttachChild(Object, Object, ChildInfo)
  fullName.vb: PostSharp.Patterns.Model.IAttacher.AttachChild(Object, Object, PostSharp.Patterns.Model.ChildInfo)
  name.vb: AttachChild(Object, Object, ChildInfo)
- uid: PostSharp.Patterns.Model.IAttacher.DetachChild(System.Object,System.Object,PostSharp.Patterns.Model.ChildInfo)
  commentId: M:PostSharp.Patterns.Model.IAttacher.DetachChild(System.Object,System.Object,PostSharp.Patterns.Model.ChildInfo)
  id: DetachChild(System.Object,System.Object,PostSharp.Patterns.Model.ChildInfo)
  parent: PostSharp.Patterns.Model.IAttacher
  langs:
  - csharp
  - vb
  name: DetachChild(object, object, ChildInfo)
  nameWithType: IAttacher.DetachChild(object, object, ChildInfo)
  fullName: PostSharp.Patterns.Model.IAttacher.DetachChild(object, object, PostSharp.Patterns.Model.ChildInfo)
  type: Method
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: Detaches an object as a child of the current node.
  example: []
  syntax:
    content: object DetachChild(object state, object child, ChildInfo childInfo)
    parameters:
    - id: state
      type: System.Object
      description: The opaque state object passed to <xref href="PostSharp.Patterns.Model.IAttachable.AttachToParent(PostSharp.Patterns.Model.RelationshipInfo%2cPostSharp.Patterns.Model.IAttacher%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>.
    - id: child
      type: System.Object
      description: The object that must be detached as a child of the current node.
    - id: childInfo
      type: PostSharp.Patterns.Model.ChildInfo
      description: The <xref href="PostSharp.Patterns.Model.ChildInfo" data-throw-if-not-resolved="false"></xref> that describes the location of the child.
    return:
      type: System.Object
      description: >-
        The former effective parent of <code class="paramref">child</code>, or <code>null</code> if the child is still attached to
                    the parent through another relationship.
    content.vb: Function DetachChild(state As Object, child As Object, childInfo As ChildInfo) As Object
  overload: PostSharp.Patterns.Model.IAttacher.DetachChild*
  nameWithType.vb: IAttacher.DetachChild(Object, Object, ChildInfo)
  fullName.vb: PostSharp.Patterns.Model.IAttacher.DetachChild(Object, Object, PostSharp.Patterns.Model.ChildInfo)
  name.vb: DetachChild(Object, Object, ChildInfo)
