  name: OnChildDetached(object, object, object, ChildInfo)
  nameWithType: IAttacher.OnChildDetached(object, object, object, ChildInfo)
  fullName: PostSharp.Patterns.Model.IAttacher.OnChildDetached(object, object, object, PostSharp.Patterns.Model.ChildInfo)
  type: Method
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: This method is invoked when a child has been detached from the current node.
  example: []
  syntax:
    content: void OnChildDetached(object state, object parent, object child, ChildInfo childInfo)
    parameters:
    - id: state
      type: System.Object
      description: The opaque state object passed to <xref href="PostSharp.Patterns.Model.IAttachable.AttachToParent(PostSharp.Patterns.Model.RelationshipInfo%2cPostSharp.Patterns.Model.IAttacher%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>.
    - id: parent
      type: System.Object
      description: >-
        The former actual parent of <code class="paramref">child</code>.  If <code class="paramref">child</code> was assigned to a parent surrogate,
                        the parameter is set to the former actual parent, that is, to the parent of the parent surrogate.
    - id: child
      type: System.Object
      description: The child object.
    - id: childInfo
      type: PostSharp.Patterns.Model.ChildInfo
      description: >-
        Information about the location (field or collection item, typically) to which the child was assigned and
                    about the relationship of the current node relative to the parent node.
    content.vb: Sub OnChildDetached(state As Object, parent As Object, child As Object, childInfo As ChildInfo)
