  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: >-
    Gets the underlying object instance that is subject to the current attacher.

    The instance is the aggregatable node that participates in the parent-child relationships with other objects.
  example: []
  syntax:
    content: object GetNode(object state)
    parameters:
    - id: state
      type: System.Object
      description: The opaque state object passed to <xref href="PostSharp.Patterns.Model.IAttachable.AttachToParent(PostSharp.Patterns.Model.RelationshipInfo%2cPostSharp.Patterns.Model.IAttacher%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Object
      description: An object implementing <xref href="PostSharp.Patterns.Model.IAggregatable" data-throw-if-not-resolved="false"></xref>, either directly or dynamically.
