  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics.Backends.Serilog
  namespace: PostSharp.Patterns.Diagnostics.Backends.Serilog
  summary: Logging backend for Serilog.
  remarks: >-
    <p>To use this backend, pass the Serilog <xref href="Serilog.ILogger" data-throw-if-not-resolved="false"></xref> that writes to your sinks to the constructor, and assign the
        instance to <xref href="PostSharp.Patterns.Diagnostics.LoggingServices.DefaultBackend" data-throw-if-not-resolved="false"></xref> when the application starts.</p>
    <p>The indentation string of each record is passed as the <code>Indent</code> property. Include <code>{Indent:l}</code> in the output
        template of your sinks to produce indented logs. By default, parameter values are formatted by PostSharp Logging; see
        <xref href="PostSharp.Patterns.Diagnostics.Backends.Serilog.SerilogLoggingBackendOptions" data-throw-if-not-resolved="false"></xref> to pass them to Serilog formatters or to add more semantic properties.</p>
    <p>To route the events that your code logs directly with Serilog through PostSharp Logging, create a second logger that writes
        to the <xref href="PostSharp.Patterns.Diagnostics.Backends.Serilog.SerilogSinkConfigurationExtensions.PostSharp(Serilog.Configuration.LoggerSinkConfiguration%2cSystem.String%2cPostSharp.Patterns.Diagnostics.Backends.Serilog.SerilogParameterHandling)" data-throw-if-not-resolved="false"></xref> sink and use it for manual logging, while this backend keeps the
        logger that writes to the output sinks.</p>
  example: []
  syntax:
    content: 'public class SerilogLoggingBackend : TextLoggingBackend, IDisposable'
    content.vb: Public Class SerilogLoggingBackend Inherits TextLoggingBackend Implements IDisposable
