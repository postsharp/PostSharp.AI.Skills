  fullName: PostSharp.Aspects.Advices.AwaitedTaskAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Binds a parameter of an <xref href="PostSharp.Aspects.Advices.OnMethodYieldAdvice" data-throw-if-not-resolved="false"></xref> method to the task awaited by the async method.
  remarks: >-
    The parameter must be of type <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref>, <xref href="System.IAsyncResult" data-throw-if-not-resolved="false"></xref> or <xref href="System.Object" data-throw-if-not-resolved="false"></xref>, and it cannot be <code>ref</code>, <code>in</code> or

    <code>out</code>. Its value can be <code>null</code> when the

    awaited object is not a <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref>, for instance when the method awaits <xref href="System.Threading.Tasks.Task.Yield" data-throw-if-not-resolved="false"></xref>. This attribute

    can be used only in <xref href="PostSharp.Aspects.Advices.OnMethodYieldAdvice" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: 'public sealed class AwaitedTaskAttribute : AdviceParameterAttribute'
    content.vb: Public NotInheritable Class AwaitedTaskAttribute Inherits AdviceParameterAttribute
