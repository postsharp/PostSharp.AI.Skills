  summary: >-
    Custom attribute that, when applied to a method, causes the return value of the method to be cached

    for the specific list of arguments passed to this method call.
  remarks: >-
    <p>There are several ways to configure the behavior of the <xref href="PostSharp.Patterns.Caching.CacheAttribute" data-throw-if-not-resolved="false"></xref> aspect: you can set the properties of the
        <xref href="PostSharp.Patterns.Caching.CacheAttribute" data-throw-if-not-resolved="false"></xref> class, such as <xref href="PostSharp.Patterns.Caching.CacheAttribute.AbsoluteExpiration" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Caching.CacheAttribute.SlidingExpiration" data-throw-if-not-resolved="false"></xref>. You can
        add the <xref href="PostSharp.Patterns.Caching.CacheConfigurationAttribute" data-throw-if-not-resolved="false"></xref> custom attribute to the declaring type, a base type, or the declaring assembly.
        Finally, you can define a profile by setting the <xref href="PostSharp.Patterns.Caching.CacheAttribute.ProfileName" data-throw-if-not-resolved="false"></xref> property and configure the profile at run time
        by accessing the <xref href="PostSharp.Patterns.Caching.CachingServices.Profiles" data-throw-if-not-resolved="false"></xref> collection of the <xref href="PostSharp.Patterns.Caching.CachingServices" data-throw-if-not-resolved="false"></xref> class.</p>
    <p>Use the <xref href="PostSharp.Patterns.Caching.NotCacheKeyAttribute" data-throw-if-not-resolved="false"></xref> custom attribute to exclude a parameter from the cache key.</p>

    <p>To invalidate a cached method, see <xref href="PostSharp.Patterns.Caching.InvalidateCacheAttribute" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Caching.CachingServices.Invalidation" data-throw-if-not-resolved="false"></xref>.</p>

    <p>Before the first call to a cached method, set <xref href="PostSharp.Patterns.Caching.CachingServices.DefaultBackend" data-throw-if-not-resolved="false"></xref>; otherwise, the call throws a <xref href="PostSharp.Patterns.Caching.CachingException" data-throw-if-not-resolved="false"></xref>.</p>

    <p>The cache key includes the method, the <code>this</code> instance (unless <xref href="PostSharp.Patterns.Caching.CacheAttribute.IgnoreThisParameter" data-throw-if-not-resolved="false"></xref> is <code>true</code>) and the arguments.
        Objects are formatted with <xref href="System.Object.ToString" data-throw-if-not-resolved="false"></xref> unless a formatter is registered for their type, so make sure that parameter types
        other than intrinsic types such as <xref href="System.Int32" data-throw-if-not-resolved="false"></xref> or <xref href="System.String" data-throw-if-not-resolved="false"></xref> produce a distinct string for each distinct value.</p>
  example: []
  syntax:
    content: >-
      [Metric("UsedFeatures", "Patterns.Caching.Cache")]

      [ProvideAspectRole("Caching")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Validation")]

      [AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Tracing")]

      [LinesOfCodeAvoided(3)]

      [MulticastAttributeUsage(PersistMetaData = true)]

      [Serializer(typeof(CacheAttribute.Serializer))]

      public sealed class CacheAttribute : MethodInterceptionAspect, IMethodLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, IAsyncMethodInterceptionAspect, IMethodInterceptionAspect, IMethodLevelAspect, IAspect
    content.vb: >-
      <Metric("UsedFeatures", "Patterns.Caching.Cache")>

      <ProvideAspectRole("Caching")>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Validation")>

      <AspectRoleDependency(AspectDependencyAction.Order, AspectDependencyPosition.After, "Tracing")>

      <LinesOfCodeAvoided(3)>

      <MulticastAttributeUsage(PersistMetaData:=True)>

      <Serializer(GetType(CacheAttribute.Serializer))>

