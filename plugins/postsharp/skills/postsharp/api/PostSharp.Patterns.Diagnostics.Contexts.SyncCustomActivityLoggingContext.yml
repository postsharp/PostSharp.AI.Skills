  name: SyncCustomActivityLoggingContext
  nameWithType: SyncCustomActivityLoggingContext
  fullName: PostSharp.Patterns.Diagnostics.Contexts.SyncCustomActivityLoggingContext
  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Contexts
  summary: >-
    A <xref href="PostSharp.Patterns.Diagnostics.Contexts.LoggingContext" data-throw-if-not-resolved="false"></xref> that represents a synchronous custom activity, opened by the <xref href="PostSharp.Patterns.Diagnostics.Logger.OpenActivity(System.String)" data-throw-if-not-resolved="false"></xref>

    method.
  remarks: >-
    <p>A custom backend that needs to store more data in this context can derive a class from it and override
        <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.CreateSyncCustomActivityContext(PostSharp.Patterns.Diagnostics.Contexts.ThreadLoggingContext)" data-throw-if-not-resolved="false"></xref> to return an instance of the derived class.
        Instances are pooled per thread and reused for later activities.</p>
  example: []
  syntax:
    content: 'public class SyncCustomActivityLoggingContext : SyncLoggingContext, ICustomActivityLoggingContext, ILoggingContext, IDisposable'
    content.vb: Public Class SyncCustomActivityLoggingContext Inherits SyncLoggingContext Implements ICustomActivityLoggingContext, ILoggingContext, IDisposable
