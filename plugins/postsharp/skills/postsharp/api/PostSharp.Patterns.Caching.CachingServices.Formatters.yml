  namespace: PostSharp.Patterns.Caching
  summary: Allows getting and registering formatters used to generate caching keys.
  remarks: >-
    <p>By default, the cache key builder formats objects with <xref href="System.Object.ToString" data-throw-if-not-resolved="false"></xref>. Register a formatter here when the
        <xref href="System.Object.ToString" data-throw-if-not-resolved="false"></xref> method of a parameter type does not return a distinct string for each distinct value, or when the caching
        representation of the type must differ from its other representations. Formatters registered here are used only for caching.</p>
  example: []
