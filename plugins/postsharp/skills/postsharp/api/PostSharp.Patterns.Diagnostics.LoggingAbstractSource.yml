  type: Method
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics
  summary: Determines whether logging is enabled for a given <xref href="PostSharp.Patterns.Diagnostics.LogLevel" data-throw-if-not-resolved="false"></xref> for the current <xref href="PostSharp.Patterns.Diagnostics.LoggingAbstractSource.Role" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Diagnostics.LoggingAbstractSource.Type" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        If an exception occurs in the logic of this method, the method reports the exception to the <xref href="PostSharp.Patterns.Diagnostics.LoggingServices.ExceptionHandler" data-throw-if-not-resolved="false"></xref>
        and returns <code>false</code>.
        </p>
  example: []
  syntax:
    content: public bool IsEnabled(LogLevel level)
    parameters:
    - id: level
      type: PostSharp.Patterns.Diagnostics.LogLevel
      description: A <xref href="PostSharp.Patterns.Diagnostics.LogLevel" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Boolean
      description: <code>true</code> if logging is enabled, otherwise <code>false</code>.
    content.vb: Public Function IsEnabled(level As LogLevel) As Boolean
  overload: PostSharp.Patterns.Diagnostics.LoggingAbstractSource.IsEnabled*
