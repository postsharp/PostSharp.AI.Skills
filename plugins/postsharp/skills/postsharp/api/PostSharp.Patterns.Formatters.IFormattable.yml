- uid: PostSharp.Patterns.Formatters.IFormattable
  commentId: T:PostSharp.Patterns.Formatters.IFormattable
  id: IFormattable
  parent: PostSharp.Patterns.Formatters
  children:
  - PostSharp.Patterns.Formatters.IFormattable.Format(PostSharp.Patterns.Formatters.UnsafeStringBuilder,PostSharp.Patterns.Formatters.FormattingRole)
  langs:
  - csharp
  - vb
  name: IFormattable
  nameWithType: IFormattable
  fullName: PostSharp.Patterns.Formatters.IFormattable
  type: Interface
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Formatters
  summary: >-
    Exposes a <xref href="PostSharp.Patterns.Formatters.IFormattable.Format(PostSharp.Patterns.Formatters.UnsafeStringBuilder%2cPostSharp.Patterns.Formatters.FormattingRole)" data-throw-if-not-resolved="false"></xref> method, which allows an object to format itself into an <xref href="PostSharp.Patterns.Formatters.UnsafeStringBuilder" data-throw-if-not-resolved="false"></xref>.

    Logging and caching components rely on the <xref href="PostSharp.Patterns.Formatters.IFormattable" data-throw-if-not-resolved="false"></xref> interface.
  remarks: >-
    <p>Implement this interface in a type whose source code you own, when its representation in logs or cache keys must differ from
        the result of <xref href="System.Object.ToString" data-throw-if-not-resolved="false"></xref>, or when formatting is performance-critical. A formatter for <xref href="PostSharp.Patterns.Formatters.IFormattable" data-throw-if-not-resolved="false"></xref> is registered
        by default, so the implementation does not need to be registered. The <code>role</code> parameter of <xref href="PostSharp.Patterns.Formatters.IFormattable.Format(PostSharp.Patterns.Formatters.UnsafeStringBuilder%2cPostSharp.Patterns.Formatters.FormattingRole)" data-throw-if-not-resolved="false"></xref> tells
        whether the object is formatted for logging or for caching. For a type you do not own, derive a class from <xref href="PostSharp.Patterns.Formatters.Formatter%601" data-throw-if-not-resolved="false"></xref> instead.</p>
  example: []
  syntax:
    content: public interface IFormattable
    content.vb: Public Interface IFormattable
