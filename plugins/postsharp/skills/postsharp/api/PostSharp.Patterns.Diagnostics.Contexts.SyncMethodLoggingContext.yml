  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Contexts
  summary: A <xref href="PostSharp.Patterns.Diagnostics.Contexts.LoggingContext" data-throw-if-not-resolved="false"></xref> that represents a synchronous method (not an async method, not an iterator).
  remarks: >-
    <p>A custom backend that needs to store more data in this context can derive a class from it and override
        <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.CreateSyncMethodContext(PostSharp.Patterns.Diagnostics.Contexts.ThreadLoggingContext)" data-throw-if-not-resolved="false"></xref> to return an instance of the derived class.
        Instances are pooled per thread and reused for later method executions.</p>
  example: []
  syntax:
    content: 'public class SyncMethodLoggingContext : SyncLoggingContext, ILoggingContext, IDisposable'
    content.vb: Public Class SyncMethodLoggingContext Inherits SyncLoggingContext Implements ILoggingContext, IDisposable
