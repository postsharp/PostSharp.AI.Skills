  namespace: PostSharp.Aspects.Dependencies
  summary: >-
    Declares that the aspect class or advice to which this custom attribute is applied

    is exempt from a given effect.
  remarks: >-
    <p>See <xref href="PostSharp.Aspects.Dependencies.AspectEffectDependencyAttribute" data-throw-if-not-resolved="false"></xref> for details about effects.</p>

    <p>The weaver attributes effects to an aspect from the kind of the aspect, not from what its code actually does. Waive an effect
            that the aspect does not have, for example <xref href="PostSharp.Aspects.Dependencies.StandardEffects.ChangeControlFlow" data-throw-if-not-resolved="false"></xref> on an aspect that defers the
            execution of a method without skipping it, so that dependencies on this effect no longer match the aspect. When you use the
            parameterless constructor on an aspect class, the aspect has no effect at all, and the weaver considers it commutative with any
            other aspect.</p>
    <p>On an aspect class, the custom attribute applies to all the advices of the aspect. On an advice method, it applies to the
            advices of the group of this method.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class|AttributeTargets.Method)]

      public sealed class WaiveAspectEffectAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.ClassOrAttributeTargets.Method)>

      Public NotInheritable Class WaiveAspectEffectAttribute Inherits Attribute
