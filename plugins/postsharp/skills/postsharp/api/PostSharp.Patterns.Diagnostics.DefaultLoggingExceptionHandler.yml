  namespace: PostSharp.Patterns.Diagnostics
  summary: >-
    Implementation of <xref href="PostSharp.Patterns.Diagnostics.ILoggingExceptionHandler" data-throw-if-not-resolved="false"></xref> that attempts to log

    exceptions to the <xref href="PostSharp.Patterns.Diagnostics.LoggingRoles.Meta" data-throw-if-not-resolved="false"></xref> logging role, then disables the backlog

    in case of an internal exception, but not in case of invalid user code.

    Not to be confused with <xref href="PostSharp.Patterns.Diagnostics.Custom.ILoggerExceptionHandler" data-throw-if-not-resolved="false"></xref>.
