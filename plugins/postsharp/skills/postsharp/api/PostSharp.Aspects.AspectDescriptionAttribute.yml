  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Custom attribute that, when applied to an aspect class, specifies a human-readable description of the aspect

    that can be displayed in PostSharp Tools for Visual Studio.
  remarks: >-
    <p>This attribute is intended to be used on simple aspects like <xref href="PostSharp.Aspects.OnMethodBoundaryAspect" data-throw-if-not-resolved="false"></xref> or
        <xref href="PostSharp.Aspects.MethodInterceptionAspect" data-throw-if-not-resolved="false"></xref>. For composite aspects, specify the description of each advice
        using the <xref href="PostSharp.Aspects.Advices.Advice.Description" data-throw-if-not-resolved="false"></xref> property.</p>
    <p>The description replaces the default description that the Visual Studio tooling displays in CodeLens
        and in tooltips for the declarations enhanced by the aspect.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class, AllowMultiple = false)]

      public sealed class AspectDescriptionAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Class, AllowMultiple:=False)>

      Public NotInheritable Class AspectDescriptionAttribute Inherits Attribute
