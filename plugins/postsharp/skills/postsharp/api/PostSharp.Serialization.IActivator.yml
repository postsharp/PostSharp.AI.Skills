  nameWithType: IActivator
  fullName: PostSharp.Serialization.IActivator
  type: Interface
  assemblies:
  - PostSharp
  namespace: PostSharp.Serialization
  summary: Exposes a method <xref href="PostSharp.Serialization.IActivator.CreateInstance(System.Type%2cPostSharp.Serialization.ActivatorSecurityToken)" data-throw-if-not-resolved="false"></xref>, which allows creating an instance of a type using the <xref href="System.Activator" data-throw-if-not-resolved="false"></xref> facility.
  remarks: <p>PostSharp generates implementations of this interface in each assembly that contains serializable classes. It allows creating objects in the security context of this assembly (instead of from the security context of <code>PostSharp.dll</code>).</p>
