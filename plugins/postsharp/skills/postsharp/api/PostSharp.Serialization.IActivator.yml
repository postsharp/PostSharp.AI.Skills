- uid: PostSharp.Serialization.IActivator.CreateInstance(System.Type,PostSharp.Serialization.ActivatorSecurityToken)
  commentId: M:PostSharp.Serialization.IActivator.CreateInstance(System.Type,PostSharp.Serialization.ActivatorSecurityToken)
  id: CreateInstance(System.Type,PostSharp.Serialization.ActivatorSecurityToken)
  parent: PostSharp.Serialization.IActivator
  langs:
