  - vb
  name: CreateInstance(Type, ActivatorSecurityToken)
  nameWithType: IActivator.CreateInstance(Type, ActivatorSecurityToken)
  fullName: PostSharp.Serialization.IActivator.CreateInstance(System.Type, PostSharp.Serialization.ActivatorSecurityToken)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Serialization
  summary: Creates an instance of a given type.
  remarks: <p>For security reasons, implementations should throw an exception or return <code>null</code> if <code class="paramref">securityToken</code> is <code>null</code>.</p>
  example: []
  syntax:
    content: object CreateInstance(Type objectType, ActivatorSecurityToken securityToken)
    parameters:
    - id: objectType
      type: System.Type
      description: The type of the object of which an instance is requested.
    - id: securityToken
      type: PostSharp.Serialization.ActivatorSecurityToken
      description: A security token.
    return:
      type: System.Object
      description: A new instance of type <code class="paramref">objectType</code>.
    content.vb: Function CreateInstance(objectType As Type, securityToken As ActivatorSecurityToken) As Object
  overload: PostSharp.Serialization.IActivator.CreateInstance*
