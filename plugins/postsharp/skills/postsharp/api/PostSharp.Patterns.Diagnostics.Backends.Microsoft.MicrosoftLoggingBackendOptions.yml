  namespace: PostSharp.Patterns.Diagnostics.Backends.Microsoft
  summary: >-
    Gets or sets a function that returns a category name for a given <xref href="PostSharp.Patterns.Diagnostics.Backends.Microsoft.MicrosoftLoggingTypeSource" data-throw-if-not-resolved="false"></xref>.

    The category name is used as an argument to the <xref href="Microsoft.Extensions.Logging.ILoggerFactory.CreateLogger(System.String)" data-throw-if-not-resolved="false"></xref> method.

    The default behavior is to return the <xref href="PostSharp.Patterns.Diagnostics.LoggingNamespaceSource.DisplayFullName" data-throw-if-not-resolved="false"></xref> of the type source.
