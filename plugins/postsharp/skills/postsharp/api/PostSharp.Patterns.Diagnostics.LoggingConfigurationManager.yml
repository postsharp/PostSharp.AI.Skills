  name: LoggingConfigurationManager
  nameWithType: LoggingConfigurationManager
  fullName: PostSharp.Patterns.Diagnostics.LoggingConfigurationManager
  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics.Configuration
  namespace: PostSharp.Patterns.Diagnostics
  summary: Provides methods that configure a <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend" data-throw-if-not-resolved="false"></xref> from an XML file.
  remarks: >-
    <p>The XML file sets the default verbosity per namespace or type and can define transaction policies that change the verbosity
        of selected requests. Its format is described by <xref href="PostSharp.Patterns.Diagnostics.Transactions.Model.LoggingConfigurationModel" data-throw-if-not-resolved="false"></xref>.</p>
    <p>Use <xref href="PostSharp.Patterns.Diagnostics.LoggingConfigurationManager.ConfigureFromXmlWithAutoReloadAsync(PostSharp.Patterns.Diagnostics.LoggingBackend%2cSystem.Uri%2cSystem.TimeSpan%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> to change the verbosity of a running application without redeploying it: the
        method downloads the file, typically from an HTTPS location, and reloads it periodically. It does not throw when the file cannot be
        downloaded or parsed; it reports the error through PostSharp Logging. <xref href="PostSharp.Patterns.Diagnostics.LoggingConfigurationManager.ConfigureFromXmlAsync(PostSharp.Patterns.Diagnostics.LoggingBackend%2cSystem.Uri%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> loads the file once and throws
        in that case, except for errors in the <code>verbosity</code> element, which are only reported.</p>
    <p>The file can contain expressions that execute in the application, so only authorized personnel should have write access to it.</p>
  example: []
  syntax:
    content: public static class LoggingConfigurationManager
    content.vb: Public Module LoggingConfigurationManager
