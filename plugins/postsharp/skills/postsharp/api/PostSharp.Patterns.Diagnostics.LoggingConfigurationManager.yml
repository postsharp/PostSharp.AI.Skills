- uid: PostSharp.Patterns.Diagnostics.LoggingConfigurationManager.ConfigureFromXmlWithAutoReloadAsync(PostSharp.Patterns.Diagnostics.LoggingBackend,System.Uri,System.TimeSpan,System.Threading.CancellationToken)
  commentId: M:PostSharp.Patterns.Diagnostics.LoggingConfigurationManager.ConfigureFromXmlWithAutoReloadAsync(PostSharp.Patterns.Diagnostics.LoggingBackend,System.Uri,System.TimeSpan,System.Threading.CancellationToken)
  id: ConfigureFromXmlWithAutoReloadAsync(PostSharp.Patterns.Diagnostics.LoggingBackend,System.Uri,System.TimeSpan,System.Threading.CancellationToken)
  isExtensionMethod: true
  parent: PostSharp.Patterns.Diagnostics.LoggingConfigurationManager
  langs:
  - csharp
  - vb
  name: ConfigureFromXmlWithAutoReloadAsync(LoggingBackend, Uri, TimeSpan, CancellationToken)
  nameWithType: LoggingConfigurationManager.ConfigureFromXmlWithAutoReloadAsync(LoggingBackend, Uri, TimeSpan, CancellationToken)
  fullName: PostSharp.Patterns.Diagnostics.LoggingConfigurationManager.ConfigureFromXmlWithAutoReloadAsync(PostSharp.Patterns.Diagnostics.LoggingBackend, System.Uri, System.TimeSpan, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - PostSharp.Patterns.Diagnostics.Configuration
  namespace: PostSharp.Patterns.Diagnostics
  summary: >-
    Configures a <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend" data-throw-if-not-resolved="false"></xref> from an XML configuration file whose location is specified in a <xref href="System.Uri" data-throw-if-not-resolved="false"></xref>

    and specifies a <xref href="System.TimeSpan" data-throw-if-not-resolved="false"></xref> at which the file should be refreshed from source.
  remarks: >-
    <p>
        This method always succeeds, even if the <code class="paramref">uri</code> is incorrect or the content is corrupt. The reason is that
        the resource may become available or correct later.
        </p>
    <div class="NOTE"><h5>security</h5><p>
        Note that the XML file can contain code that will execute on the device from which you call this method. A malicious attacker
        could create a file that causes a data breach or a denial of service. Therefore, you must ensure that only
        authorized personnel have write access to the remote file. Additionally, this file must be publicly readable. Therefore,
        it should not include any sensitive information. There should be no reason to do so.
        </p></div>
  example: []
  syntax:
    content: public static Task<IDisposable> ConfigureFromXmlWithAutoReloadAsync(this LoggingBackend backend, Uri uri, TimeSpan autoReloadPeriod, CancellationToken cancellationToken = default)
    parameters:
    - id: backend
      type: PostSharp.Patterns.Diagnostics.LoggingBackend
      description: The backend to configure.
      attributes:
      - type: PostSharp.Patterns.Contracts.RequiredAttribute
        ctor: PostSharp.Patterns.Contracts.RequiredAttribute.#ctor
        arguments: []
    - id: uri
      type: System.Uri
      description: >-
        The location of the configuration file. The schema is described in the <xref href="PostSharp.Patterns.Diagnostics.Transactions.Model.LoggingConfigurationModel" data-throw-if-not-resolved="false"></xref> type. 
                    If you are using a cloud storage service, this should be a direct download link.
    - id: autoReloadPeriod
      type: System.TimeSpan
      description: >-
        The <xref href="System.TimeSpan" data-throw-if-not-resolved="false"></xref> after which the configuration should be reloaded. If this parameter equals zero or <code>TimeSpan.MaxValue</code>,
                    the configuration is never reloaded.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A <xref href="System.Threading.CancellationToken" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Threading.Tasks.Task{System.IDisposable}
      description: An opaque <xref href="System.IDisposable" data-throw-if-not-resolved="false"></xref> that must be disposed to stop reloading the configuration.
    content.vb: Public Shared Function ConfigureFromXmlWithAutoReloadAsync(backend As LoggingBackend, uri As Uri, autoReloadPeriod As TimeSpan, cancellationToken As CancellationToken = Nothing) As Task(Of IDisposable)
  overload: PostSharp.Patterns.Diagnostics.LoggingConfigurationManager.ConfigureFromXmlWithAutoReloadAsync*
