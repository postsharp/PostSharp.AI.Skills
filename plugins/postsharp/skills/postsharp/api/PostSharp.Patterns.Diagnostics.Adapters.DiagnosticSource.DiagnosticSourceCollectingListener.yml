    you must call the <xref href="PostSharp.Patterns.Diagnostics.Adapters.DiagnosticSource.DiagnosticSourceCollectingListener.FollowActivity(System.String%2cPostSharp.Patterns.Diagnostics.Adapters.DiagnosticSource.IDiagnosticSourceActivityFilter)" data-throw-if-not-resolved="false"></xref>

    and then <xref href="PostSharp.Patterns.Diagnostics.Adapters.DiagnosticSource.DiagnosticSourceCollectingListener.Subscribe" data-throw-if-not-resolved="false"></xref> methods to start listening to events.
