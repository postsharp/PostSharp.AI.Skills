  namespace: PostSharp.Patterns.Threading
  summary: Exception thrown when a thread attempts to access an object that has affinity to another thread.
  remarks: >-
    <p>The following threading models throw this exception: <xref href="PostSharp.Patterns.Threading.ThreadAffineAttribute" data-throw-if-not-resolved="false"></xref> when the object is accessed from a different thread
        than the one that created it, and <xref href="PostSharp.Patterns.Threading.ActorAttribute" data-throw-if-not-resolved="false"></xref> when a field is accessed from a context that does not have access to the actor,
        both only when run-time verification is enabled (see <xref href="PostSharp.Patterns.Threading.ThreadAwareAttribute.RuntimeVerificationEnabled" data-throw-if-not-resolved="false"></xref>);
        and <xref href="PostSharp.Patterns.Threading.ImmutableAttribute" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Threading.FreezableAttribute" data-throw-if-not-resolved="false"></xref> when the object is accessed from a different thread than the one that
        created it before it has been made read-only.</p>
  example: []
  syntax:
    content: 'public sealed class ThreadMismatchException : ThreadingException, ISerializable'
    content.vb: Public NotInheritable Class ThreadMismatchException Inherits ThreadingException Implements ISerializable
