  namespace: PostSharp.Patterns.Diagnostics.Backends.ApplicationInsights
  summary: Logging backend for Microsoft Application Insights.
  remarks: >-
    <p>To use this backend, assign a new instance to <xref href="PostSharp.Patterns.Diagnostics.LoggingServices.DefaultBackend" data-throw-if-not-resolved="false"></xref> when the application starts.

    Pass the instrumentation key to the constructor, or use the parameterless constructor to rely on the default Application Insights

    configuration, for example the <code>APPINSIGHTS_INSTRUMENTATIONKEY</code> environment variable or, on .NET Framework, an <code>ApplicationInsights.config</code> file.</p>
  example: []
  syntax:
    content: 'public class ApplicationInsightsLoggingBackend : TextLoggingBackend, IDisposable'
    content.vb: Public Class ApplicationInsightsLoggingBackend Inherits TextLoggingBackend Implements IDisposable
