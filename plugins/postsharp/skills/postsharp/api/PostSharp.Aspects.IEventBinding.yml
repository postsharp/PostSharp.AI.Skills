- uid: PostSharp.Aspects.IEventBinding.InvokeHandler(System.Object@,System.Delegate,PostSharp.Aspects.Arguments)
  commentId: M:PostSharp.Aspects.IEventBinding.InvokeHandler(System.Object@,System.Delegate,PostSharp.Aspects.Arguments)
  id: InvokeHandler(System.Object@,System.Delegate,PostSharp.Aspects.Arguments)
  parent: PostSharp.Aspects.IEventBinding
  langs:
  - csharp
  - vb
  name: InvokeHandler(ref object, Delegate, Arguments)
  nameWithType: IEventBinding.InvokeHandler(ref object, Delegate, Arguments)
  fullName: PostSharp.Aspects.IEventBinding.InvokeHandler(ref object, System.Delegate, PostSharp.Aspects.Arguments)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Invokes the <code>Invoke</code> semantic on the next node in the chain of invocation.
  remarks: >-
    <p>
      The
      <code class="paramref">instance</code>
      parameter is passed by reference so that instance methods of value types (
      <code>struct</code>
      in C#) are allowed to change the value of the instance.
    </p>
        <br />
        <div class="NOTE"><h5>note</h5><p>
      The
      <b>Invoke Event Handler</b>
      semantic is different from normal event firing.
      Indeed, when you fire an event, all handlers that were added to this event are fired. However, the current method
      invokes only a single handler: the one passed to the
      <code>handler</code>
      parameter.
    </p></div>
  example: []
  syntax:
    content: object InvokeHandler(ref object instance, Delegate handler, Arguments arguments)
    parameters:
    - id: instance
      type: System.Object
      description: Target instance on which the event is defined (<code>null</code> if the event is static).
    - id: handler
      type: System.Delegate
      description: Handler to be removed from the event.
    - id: arguments
      type: PostSharp.Aspects.Arguments
      description: Arguments with which the <code class="paramref">handler</code> should be invoked.
    return:
      type: System.Object
      description: The value returned by the handler.
    content.vb: Function InvokeHandler(instance As Object, handler As [Delegate], arguments As Arguments) As Object
  overload: PostSharp.Aspects.IEventBinding.InvokeHandler*
  nameWithType.vb: IEventBinding.InvokeHandler(Object, Delegate, Arguments)
  fullName.vb: PostSharp.Aspects.IEventBinding.InvokeHandler(Object, System.Delegate, PostSharp.Aspects.Arguments)
  name.vb: InvokeHandler(Object, Delegate, Arguments)
