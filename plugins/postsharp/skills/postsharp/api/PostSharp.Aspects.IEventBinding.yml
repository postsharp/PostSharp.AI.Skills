  nameWithType: IEventBinding.AddHandler(ref object, Delegate)
  fullName: PostSharp.Aspects.IEventBinding.AddHandler(ref object, System.Delegate)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Invokes the <code>Add</code> semantic on the next node in the chain of invocation.
  remarks: >-
    <p>
      The
      <code class="paramref">instance</code>
      parameter is passed by reference so that instance methods of value types (
      <code>struct</code>
      in C#) are allowed to change the value of the instance.
    </p>
  example: []
  syntax:
    content: void AddHandler(ref object instance, Delegate handler)
    parameters:
    - id: instance
      type: System.Object
      description: Target instance on which the event is defined (<code>null</code> if the event is static).
    - id: handler
      type: System.Delegate
      description: Handler to be added to the event.
    content.vb: Sub [AddHandler](instance As Object, handler As [Delegate])
