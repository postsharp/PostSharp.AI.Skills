  nameWithType: ICompositionAspect.CreateImplementationObject(AdviceArgs)
  fullName: PostSharp.Aspects.ICompositionAspect.CreateImplementationObject(PostSharp.Aspects.AdviceArgs)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Method invoked at runtime, during the initialization of instances of the target type,

    to create the composed object.
  remarks: >-
    This method is invoked at runtime, after the base constructor has executed and before

    the constructor of the current type is executed.
  example: []
  syntax:
    content: object CreateImplementationObject(AdviceArgs args)
    parameters:
    - id: args
      type: PostSharp.Aspects.AdviceArgs
    return:
      type: System.Object
      description: >-
        The composed object. This interface should implement the interfaces specified
                      by the <xref href="PostSharp.Aspects.Configuration.CompositionAspectConfigurationAttribute.PublicInterfaces" data-throw-if-not-resolved="false"></xref> and 
                      <xref href="PostSharp.Aspects.Configuration.CompositionAspectConfigurationAttribute.ProtectedInterfaces" data-throw-if-not-resolved="false"></xref> collections.
    content.vb: Function CreateImplementationObject(args As AdviceArgs) As Object
  overload: PostSharp.Aspects.ICompositionAspect.CreateImplementationObject*
