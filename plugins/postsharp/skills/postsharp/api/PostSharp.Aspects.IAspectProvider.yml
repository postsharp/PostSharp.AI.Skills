  name: IAspectProvider
  nameWithType: IAspectProvider
  fullName: PostSharp.Aspects.IAspectProvider
  type: Interface
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Interface that, when implemented by an aspect class, allows aspect instances

    to provide other aspects to the weaver.
  remarks: >-
    <p>Use this interface when aspects cannot be added declaratively with custom attributes, for instance when the
            set of targets results from an analysis of the code using reflection, or from an external
            configuration file. The <xref href="PostSharp.Aspects.IAspectProvider.ProvideAspects(System.Object)" data-throw-if-not-resolved="false"></xref> method runs at build time and returns
            <xref href="PostSharp.Aspects.AspectInstance" data-throw-if-not-resolved="false"></xref> objects that specify each provided aspect and its target.</p>
  example: []
  syntax:
    content: 'public interface IAspectProvider : IAspect, IService'
    content.vb: Public Interface IAspectProvider Inherits IAspect, IService
