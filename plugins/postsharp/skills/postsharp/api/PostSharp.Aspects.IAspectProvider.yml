- uid: PostSharp.Aspects.IAspectProvider.ProvideAspects(System.Object)
  commentId: M:PostSharp.Aspects.IAspectProvider.ProvideAspects(System.Object)
  id: ProvideAspects(System.Object)
  parent: PostSharp.Aspects.IAspectProvider
  langs:
  - csharp
  - vb
  name: ProvideAspects(object)
  nameWithType: IAspectProvider.ProvideAspects(object)
  fullName: PostSharp.Aspects.IAspectProvider.ProvideAspects(object)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Provides new aspects.
  remarks: >-
    <p>Implementations of this method are allowed to return only aspect instances applied on elements
            of code located under the target element of code (<code class="paramref">targetElement</code>).
            For instance, a type-level <xref href="PostSharp.Aspects.IAspectProvider" data-throw-if-not-resolved="false"></xref> can provide aspects on methods of the current type,
            but not of other types.</p>
  example: []
  syntax:
    content: IEnumerable<AspectInstance> ProvideAspects(object targetElement)
    parameters:
    - id: targetElement
      type: System.Object
      description: >-
        Code element (<xref href="System.Reflection.Assembly" data-throw-if-not-resolved="false"></xref>, <xref href="System.Type" data-throw-if-not-resolved="false"></xref>, 
                      <xref href="System.Reflection.FieldInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.MethodBase" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.EventInfo" data-throw-if-not-resolved="false"></xref>, 
                      <xref href="System.Reflection.ParameterInfo" data-throw-if-not-resolved="false"></xref>, or <xref href="PostSharp.Reflection.LocationInfo" data-throw-if-not-resolved="false"></xref>) to which the current aspect has been applied.
    return:
      type: System.Collections.Generic.IEnumerable{PostSharp.Aspects.AspectInstance}
      description: A set of aspect instances.
    content.vb: Function ProvideAspects(targetElement As Object) As IEnumerable(Of AspectInstance)
  overload: PostSharp.Aspects.IAspectProvider.ProvideAspects*
  nameWithType.vb: IAspectProvider.ProvideAspects(Object)
  fullName.vb: PostSharp.Aspects.IAspectProvider.ProvideAspects(Object)
  name.vb: ProvideAspects(Object)
