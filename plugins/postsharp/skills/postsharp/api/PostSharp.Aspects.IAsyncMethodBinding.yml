  name: InvokeAsync(ref object, Arguments)
  nameWithType: IAsyncMethodBinding.InvokeAsync(ref object, Arguments)
  fullName: PostSharp.Aspects.IAsyncMethodBinding.InvokeAsync(ref object, PostSharp.Aspects.Arguments)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Asynchronously invokes the next node in the chain of invocation.
  remarks: >-
    <p>
      The
      <code class="paramref">instance</code>
      parameter is passed by reference so that instance methods of value types (
      <code>struct</code>
      in C#) are allowed to change the value of the instance.
    </p>
  example: []
  syntax:
    content: MethodBindingInvokeAwaitable InvokeAsync(ref object instance, Arguments arguments)
    parameters:
    - id: instance
      type: System.Object
      description: Target instance on which the method should be invoked (<code>null</code> if the method is static).
    - id: arguments
      type: PostSharp.Aspects.Arguments
      description: Method arguments.
    return:
      type: PostSharp.Aspects.MethodBindingInvokeAwaitable
      description: The value that can be awaited to get the result of the underlying method's invocation.
    content.vb: Function InvokeAsync(instance As Object, arguments As Arguments) As MethodBindingInvokeAwaitable
