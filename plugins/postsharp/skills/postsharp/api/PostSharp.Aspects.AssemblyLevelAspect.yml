- uid: PostSharp.Aspects.AssemblyLevelAspect.CompileTimeValidate(System.Reflection.Assembly)
  commentId: M:PostSharp.Aspects.AssemblyLevelAspect.CompileTimeValidate(System.Reflection.Assembly)
  id: CompileTimeValidate(System.Reflection.Assembly)
