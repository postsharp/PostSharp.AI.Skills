  name: CompileTimeValidate(Assembly)
  nameWithType: AssemblyLevelAspect.CompileTimeValidate(Assembly)
  fullName: PostSharp.Aspects.AssemblyLevelAspect.CompileTimeValidate(System.Reflection.Assembly)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Method invoked at build time to ensure that the aspect has been applied to the right target.
  remarks: >-
    The implementation of this method is expected to emit an error message (see 

    <xref href="PostSharp.Extensibility.MessageSource" data-throw-if-not-resolved="false"></xref>) or to throw an exception in case of error. Returning <code>false</code> without emitting an

    error message or exception causes the aspect to be silently ignored.
  example: []
  syntax:
    content: public virtual bool CompileTimeValidate(Assembly assembly)
    parameters:
    - id: assembly
      type: System.Reflection.Assembly
      description: Assembly on which the current aspect is applied.
    return:
      type: System.Boolean
      description: >-
        <code>true</code> if the aspect was applied to an acceptable target, otherwise
              <code>false</code>.
    content.vb: Public Overridable Function CompileTimeValidate(assembly As Assembly) As Boolean
  overload: PostSharp.Aspects.AssemblyLevelAspect.CompileTimeValidate*
  seealso:
