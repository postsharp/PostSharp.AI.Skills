  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: Returns the reference identity of the assembly declaring a type.
  example: []
  syntax:
    content: string ResolveAssembly(Type type)
    parameters:
    - id: type
      type: System.Type
      description: A <xref href="System.Type" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.String
      description: >-
        The identity of the reference assembly defining <code class="paramref">type</code>. This assembly may be
                    different from the runtime assembly, which is available from the <xref href="System.Type.Assembly" data-throw-if-not-resolved="false"></xref> property
                    of the <xref href="System.Type" data-throw-if-not-resolved="false"></xref> class. This method may return <code>null</code> if <code class="paramref">type</code> is
                    an internal type of a system assembly.
