  namespace: PostSharp.Patterns.Contracts
  summary: >-
    Provides services that support the contract aspects. By adding your own classes to the <xref href="PostSharp.Patterns.Contracts.ContractServices.ExceptionFactory" data-throw-if-not-resolved="false"></xref> chain, you can change how

    exceptions are created when a contract is violated. By plugging into the <xref href="PostSharp.Patterns.Contracts.ContractServices.LocalizedTextProvider" data-throw-if-not-resolved="false"></xref> chain, you can change how exception messages

    are generated. For more details, see the documentation of these classes: <xref href="PostSharp.Patterns.Contracts.ContractLocalizedTextProvider" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Patterns.Contracts.ContractExceptionFactory" data-throw-if-not-resolved="false"></xref>.
