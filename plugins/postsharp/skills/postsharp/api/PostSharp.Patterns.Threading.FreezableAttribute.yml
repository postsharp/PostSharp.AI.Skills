  name: FreezableAttribute
  nameWithType: FreezableAttribute
  fullName: PostSharp.Patterns.Threading.FreezableAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Custom attribute that, when applied to a class, applies the <xref href="PostSharp.Patterns.Threading.Models.FreezableThreadingModel" data-throw-if-not-resolved="false"></xref> to this class.

    The aspect introduces the <xref href="PostSharp.Patterns.Threading.IFreezable" data-throw-if-not-resolved="false"></xref> interface into the target class. After the <xref href="PostSharp.Patterns.Threading.IFreezable.Freeze" data-throw-if-not-resolved="false"></xref>

    method has been invoked, the object can no longer be modified, and can therefore be safely shared between several threads.
  remarks: >-
    <p>Accessing a freezable object from a different thread than the one that created it, before the <xref href="PostSharp.Patterns.Threading.IFreezable.Freeze" data-throw-if-not-resolved="false"></xref> method
        has been invoked, will result in a <xref href="PostSharp.Patterns.Threading.ThreadMismatchException" data-throw-if-not-resolved="false"></xref>.</p>
    <p>Attempts to modify a freezable object after the <xref href="PostSharp.Patterns.Threading.IFreezable.Freeze" data-throw-if-not-resolved="false"></xref> method has been invoked will result in
        an <xref href="PostSharp.Patterns.Threading.ObjectReadOnlyException" data-throw-if-not-resolved="false"></xref>.</p>
    <p>The <xref href="PostSharp.Patterns.Threading.IFreezable" data-throw-if-not-resolved="false"></xref> interface is introduced after compilation, so tools that are not aware of PostSharp do not see it.
        To call <xref href="PostSharp.Patterns.Threading.IFreezable.Freeze" data-throw-if-not-resolved="false"></xref>, cast the object to <xref href="PostSharp.Patterns.Threading.IFreezable" data-throw-if-not-resolved="false"></xref> or use the <xref href="PostSharp.Post.Cast%60%602(%60%600)" data-throw-if-not-resolved="false"></xref> method,
        which is verified at build time.</p>
    <p>Use this aspect instead of <xref href="PostSharp.Patterns.Threading.ImmutableAttribute" data-throw-if-not-resolved="false"></xref> when the object must be modified after its constructor has completed, for instance
        during deserialization. The aspect implicitly adds the <xref href="PostSharp.Patterns.Model.AggregatableAttribute" data-throw-if-not-resolved="false"></xref> aspect, so you can build freezable object trees.
        Freezing an object also freezes its children. Children must be freezable or immutable.</p>
  example: []
  syntax:
    content: >-
      [IntroduceInterface(typeof(IFreezable), OverrideAction = InterfaceOverrideAction.Ignore, LinesOfCodeAvoided = 5)]

      [Metric("UsedFeatures", "PostSharp.Patterns.Threading.Freezable")]

      [Serializer(typeof(FreezableAttribute.Serializer))]

