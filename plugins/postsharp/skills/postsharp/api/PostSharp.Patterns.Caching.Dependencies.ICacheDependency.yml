  summary: Gets a string that uniquely represents the current object.
  remarks: <p>The returned key should be globally unique, not just unique within the class implementing the method.</p>
  example: []
  syntax:
    content: string GetCacheKey()
    return:
      type: System.String
      description: A string that uniquely represents the current object.
    content.vb: Function GetCacheKey() As String
