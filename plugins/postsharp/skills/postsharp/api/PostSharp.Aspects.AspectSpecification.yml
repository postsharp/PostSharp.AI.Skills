  nameWithType: AspectSpecification
  fullName: PostSharp.Aspects.AspectSpecification
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Completely specifies an aspect instance (but not its target). An <xref href="PostSharp.Aspects.AspectSpecification" data-throw-if-not-resolved="false"></xref> contains either the aspect instance itself 

    (<xref href="PostSharp.Aspects.AspectSpecification.Aspect" data-throw-if-not-resolved="false"></xref> property), or the information needed to construct the aspect (<xref href="PostSharp.Aspects.AspectSpecification.AspectConstruction" data-throw-if-not-resolved="false"></xref>) and to configure the weaver (<xref href="PostSharp.Aspects.AspectSpecification.AspectConfiguration" data-throw-if-not-resolved="false"></xref>).
  remarks: >-
    User code cannot create an instance of the <xref href="PostSharp.Aspects.AspectSpecification" data-throw-if-not-resolved="false"></xref> class. Always create an instance of

    <xref href="PostSharp.Aspects.AspectInstance" data-throw-if-not-resolved="false"></xref> instead.
  example: []
  syntax:
    content: public class AspectSpecification
    content.vb: Public Class AspectSpecification
