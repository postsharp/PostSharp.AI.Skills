  langs:
  - csharp
  - vb
  name: FormattedMessageBuilder
  nameWithType: FormattedMessageBuilder
  fullName: PostSharp.Patterns.Diagnostics.FormattedMessageBuilder
  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics
  summary: >-
    Creates messages based on a human-readable formatted string. These messages are suitable for structured logging but are not optimal for machine analysis.

    For more succinct code, consider including the <code>using static PostSharp.Patterns.Diagnostics.FormattedMessageBuilder</code> statement.
  remarks: >-
    <p>The formatting string is not the one of <xref href="System.String.Format(System.String%2cSystem.Object%5b%5d)" data-throw-if-not-resolved="false"></xref>. Parameters are named and surrounded by curly brackets,
        for example <code>{BufferSize}</code>, and are matched to the values by position, not by name. The formatting string must contain exactly
        one parameter per value. The text between the brackets is passed to the logging backend as the parameter name, without further parsing,
        so format specifiers are not supported. To write a literal curly bracket, double it (<code>{{</code> or <code>}}</code>).</p>
    <p>The values keep their own types and are rendered only when the message is written. Prefer this class over <xref href="System.String.Format(System.String%2cSystem.Object%5b%5d)" data-throw-if-not-resolved="false"></xref>
        or interpolated strings, which build a string even when the logging level is disabled. When messages need to be counted or aggregated,
        use <xref href="PostSharp.Patterns.Diagnostics.SemanticMessageBuilder" data-throw-if-not-resolved="false"></xref> instead.</p>
  example: []
