  langs:
  - csharp
  - vb
  name: MulticastAttributes
  nameWithType: MulticastAttributes
  fullName: PostSharp.Extensibility.MulticastAttributes
  type: Enum
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    Specifies the attributes of elements to which multicast custom attributes (<xref href="PostSharp.Extensibility.MulticastAttribute" data-throw-if-not-resolved="false"></xref>)

    apply.
  remarks: >-
    <p>
        If you specify this in a <xref href="PostSharp.Extensibility.MulticastAttributeUsageAttribute" data-throw-if-not-resolved="false"></xref>, then the annotated attribute can only be multicast
        to elements that have these attributes. For example, if you create an aspect and annotate it with <code>[MulticastAttributeUsage(TargetMemberAttributes=MulticastAttributes.Protected)]</code>,
        then multicasting will never apply the aspect to any type member that is not <code>protected</code>.
        </p>
    <p>
        If you specify this in a property of <xref href="PostSharp.Extensibility.MulticastAttribute" data-throw-if-not-resolved="false"></xref>, then that specific
        multicast will be narrowed further to elements that have these attributes. For example, if you annotate a class with the aspect from the previous
        paragraph with <code>[MyAspect(TargetMemberAttributes=MulticastAttributes.Virtual)]</code>, then it will only apply to that class's members that are both
        protected and, for methods, virtual.
        </p>
    <p>
        There are 8 categories of flags. If you specify at least one flag for a category, you narrow the multicast just to elements
        that have one of the flags you specified in the category. For example, if you specify <code>Public | Protected</code>, you multicast
        to elements that are public or protected, but not private. Their other attributes (such as whether they are instance or static) do not matter. 
        </p>
    <p>
        The categories are visibility (public, private and so on); scope (static or instance); abstraction (abstract or non-abstract); virtuality (virtual
        or non-virtual); implementation (managed or unmanaged); literality (literal or nonliteral); generation (compiler-generated or user-created); and
        parameter (in, ref, or out).
        </p>
    <p>
        If a category does not make sense for an element, then specifying its flags will have no effect for that element. For example, if you narrow
        your multicast down to virtual elements, it will still apply to fields or types (which cannot be virtual). 
        </p>
  example: []
  syntax:
    content: >-
      [Flags]

      public enum MulticastAttributes
    content.vb: >-
      <Flags>

      Public Enum MulticastAttributes
  attributes:
  - type: System.FlagsAttribute
    ctor: System.FlagsAttribute.#ctor
    arguments: []
