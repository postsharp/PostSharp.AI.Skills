  name: AspectDependencyAttribute
  nameWithType: AspectDependencyAttribute
  fullName: PostSharp.Aspects.Dependencies.AspectDependencyAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Dependencies
  summary: >-
    Base class for all custom attributes that define aspect dependencies. An aspect dependency determines the

    behavior of aspects or advices when they are used together with other aspects and advices.

    Aspect dependencies determine the ordering, requirements, conflicts, and commutativity of aspects and advices.
  remarks: >-
    <p>Apply a derived custom attribute to an aspect class to express a dependency of the aspect, or to an advice method to express
            a dependency of this advice only. Classes derived from the aspect class inherit its dependencies.</p>
    <p>To add a dependency to an aspect class that you cannot modify, for example to order aspects of two third-party vendors,
            apply the custom attribute to the assembly and set the <xref href="PostSharp.Aspects.Dependencies.AspectDependencyAttribute.TargetType" data-throw-if-not-resolved="false"></xref> property to the aspect class.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Class|AttributeTargets.Method, AllowMultiple = true, Inherited = true)]

      public abstract class AspectDependencyAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.AssemblyOrAttributeTargets.ClassOrAttributeTargets.Method, AllowMultiple:=True, Inherited:=True)>

      Public MustInherit Class AspectDependencyAttribute Inherits Attribute
