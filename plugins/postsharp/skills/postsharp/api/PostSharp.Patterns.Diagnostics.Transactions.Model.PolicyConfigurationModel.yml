- uid: PostSharp.Patterns.Diagnostics.Transactions.Model.PolicyConfigurationModel.If
  commentId: P:PostSharp.Patterns.Diagnostics.Transactions.Model.PolicyConfigurationModel.If
  id: If
  parent: PostSharp.Patterns.Diagnostics.Transactions.Model.PolicyConfigurationModel
  langs:
  - csharp
  - vb
  name: If
  nameWithType: PolicyConfigurationModel.If
  fullName: PostSharp.Patterns.Diagnostics.Transactions.Model.PolicyConfigurationModel.If
  type: Property
  assemblies:
  - PostSharp.Patterns.Diagnostics.Configuration
  namespace: PostSharp.Patterns.Diagnostics.Transactions.Model
  summary: >-
    A C# predicate mapping a parameter <code>t</code> to a <code>bool</code> that determines whether the current policy matches the

    transaction <code>t</code>. The type of <code>t</code> is <xref href="PostSharp.Patterns.Diagnostics.Transactions.Model.OpenTransactionExpressionModel%601" data-throw-if-not-resolved="false"></xref>,

    which is a generic type. The generic type argument, and the type of the <xref href="PostSharp.Patterns.Diagnostics.Transactions.Model.OpenTransactionExpressionModel%601.Request" data-throw-if-not-resolved="false"></xref>

    property, depend on the type of transaction, that is, on the <xref href="PostSharp.Patterns.Diagnostics.Transactions.Model.PolicyConfigurationModel.Type" data-throw-if-not-resolved="false"></xref> attribute. When

    the transaction type is <code>AspNetCoreRequest</code>, the expression model type

    is <code>AspNetCoreRequestExpressionModel</code>. For custom transactions, the type is the value

    of the expression model specified in the <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata" data-throw-if-not-resolved="false"></xref>. This expression

    can call <xref href="PostSharp.Patterns.Diagnostics.Transactions.Model.TransactionPolicyExpressionFunctions.Matches(System.String%2cSystem.String)" data-throw-if-not-resolved="false"></xref> to evaluate a regular

    expression.
  example: []
  syntax:
    content: public string If { get; }
    parameters: []
    return:
      type: System.String
    content.vb: Public ReadOnly Property [If] As String
  overload: PostSharp.Patterns.Diagnostics.Transactions.Model.PolicyConfigurationModel.If*
