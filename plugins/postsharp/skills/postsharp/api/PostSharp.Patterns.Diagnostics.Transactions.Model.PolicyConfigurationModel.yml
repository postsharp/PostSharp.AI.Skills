    typically contains a call to <xref href="PostSharp.Patterns.Diagnostics.Transactions.Model.TransactionPolicyExpressionFunctions.Random(System.Double)" data-throw-if-not-resolved="false"></xref>

    or <xref href="PostSharp.Patterns.Diagnostics.Transactions.Model.TransactionPolicyExpressionFunctions.OnceEveryXSeconds(System.Double%2cSystem.String)" data-throw-if-not-resolved="false"></xref>.
