  name: AttachedPropertyAttribute
  nameWithType: AttachedPropertyAttribute
  fullName: PostSharp.Patterns.Xaml.AttachedPropertyAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Xaml
  namespace: PostSharp.Patterns.Xaml
  summary: >-
    Custom attribute that, when applied to a static automatic property of type <xref href="PostSharp.Patterns.Xaml.Attached%601" data-throw-if-not-resolved="false"></xref>,

    turns this property into a XAML dependency property that has the same name and whose value type is <code>T</code>.
  remarks: >-
    <p>Suppose the target property is named <code>Foo</code>. If a method named <code>ValidateFoo</code> exists in the class, it will be used to validate the values assigned to this property.
        If a method named <code>OnFooChanged</code> exists in the class, it will be invoked whenever the property is set.
        If a property named <code>FooProperty</code> exists in the class, it will be assigned to the corresponding <xref href="System.Windows.DependencyProperty" data-throw-if-not-resolved="false"></xref> instance.
        Naming conventions can be overridden by the <xref href="PostSharp.Patterns.Xaml.DependencyPropertyBaseAttribute.ValidateValueMethod" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Patterns.Xaml.DependencyPropertyBaseAttribute.PropertyChangedMethod" data-throw-if-not-resolved="false"></xref>
        and <xref href="PostSharp.Patterns.Xaml.DependencyPropertyBaseAttribute.RegistrationProperty" data-throw-if-not-resolved="false"></xref> aspect properties.</p>
    <p>The target property must be public and static. The validation method and the property-changed method must be static.
        The declaring class must derive from <xref href="System.Windows.DependencyObject" data-throw-if-not-resolved="false"></xref>.</p>
    <p>The XAML compiler requires a static <code>SetFoo</code> method, which PostSharp cannot generate because it runs after compilation.
        Implement it by calling <xref href="PostSharp.Patterns.Xaml.Attached%601.SetValue(System.Windows.DependencyObject%2c%600)" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: >-
      [ComVisible(false)]

      [Serializer(typeof(AttachedPropertyAttribute.Serializer))]

      public sealed class AttachedPropertyAttribute : DependencyPropertyBaseAttribute, ILocationLevelAspect, ILocationLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, IAspectProvider, IAspect, IService
    content.vb: >-
