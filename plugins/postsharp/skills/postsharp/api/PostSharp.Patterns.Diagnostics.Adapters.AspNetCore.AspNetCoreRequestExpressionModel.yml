  type: Struct
  assemblies:
  - PostSharp.Patterns.Diagnostics.Adapters.AspNetCore
  namespace: PostSharp.Patterns.Diagnostics.Adapters.AspNetCore
  summary: >-
    Exposes an ASP.NET Core request to the transaction policy expressions (see <code>OpenTransactionExpressionModel.Request</code> and <code>CloseTransactionExpressionModel.Request</code>).

    The <code>type</code> attribute of the <code>policy</code> element must be set to <code>AspNetCoreRequest</code> to match requests of this class.
  remarks: >-
    <p>Requests are captured only after <xref href="PostSharp.Patterns.Diagnostics.Adapters.AspNetCore.AspNetCoreLogging.Initialize(PostSharp.Patterns.Diagnostics.Correlation.ICorrelationProtocol%2cSystem.Predicate%7bMicrosoft.AspNetCore.Http.HttpRequest%7d%2cPostSharp.Patterns.Diagnostics.Custom.LogEventMetadata)" data-throw-if-not-resolved="false"></xref> has been called. In a policy expression, access
        the request through the <code>t.Request</code> parameter, for example <code>t.Request.Path.StartsWith("/invoices")</code>.</p>
  example: []
  syntax:
    content: 'public readonly struct AspNetCoreRequestExpressionModel : IFormattable'
    content.vb: Public Structure AspNetCoreRequestExpressionModel Implements IFormattable
