  - PostSharp.Patterns.Caching.Backends.Redis
  namespace: PostSharp.Patterns.Caching.Backends.Redis
  summary: Options of the <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCacheDependencyGarbageCollector" data-throw-if-not-resolved="false"></xref> class.
  remarks: >-
    <p>These options control the periodic cleanup of the database. Cleaning up too often costs server resources. Cleaning up too rarely lets
        unreachable data accumulate, which can cause Redis to evict useful items. Decrease <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCacheDependencyGarbageCollectorOptions.CacheCleanupDelay" data-throw-if-not-resolved="false"></xref> if you observe high memory usage
        or many evictions. Keep the cleanup slow enough, through <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCacheDependencyGarbageCollectorOptions.CacheCleanupOptions" data-throw-if-not-resolved="false"></xref>, to avoid affecting the performance of the application.</p>
