  name: MemoryCachingBackend
  nameWithType: MemoryCachingBackend
  fullName: PostSharp.Patterns.Caching.Backends.MemoryCachingBackend
  type: Class
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching.Backends
  summary: >-
    A <xref href="PostSharp.Patterns.Caching.Implementation.CachingBackend" data-throw-if-not-resolved="false"></xref> based on <code>System.Runtime.Caching.MemoryCache</code> (<xref href="System.Runtime.Caching.MemoryCache" data-throw-if-not-resolved="false"></xref>). This cache is part of .NET Framework

    and is available for .NET Standard in the NuGet package System.Runtime.Caching.
  remarks: >-
    <p>To use this backend, assign an instance to <xref href="PostSharp.Patterns.Caching.ICachingService.Backend?text=CachingServices.DefaultService.Backend" data-throw-if-not-resolved="false"></xref> before the first call to a cached method.
        By default, it stores items in <xref href="System.Runtime.Caching.MemoryCache.Default" data-throw-if-not-resolved="false"></xref>; pass another <xref href="System.Runtime.Caching.MemoryCache" data-throw-if-not-resolved="false"></xref> to the constructor to isolate the cached items.
        This backend supports cache dependencies.</p>
    <p>Each process has its own in-memory cache. When several instances of an application run at the same time, wrap this backend
        in a cache invalidator, such as <code>RedisCacheInvalidator</code> or <code>AzureServiceBusCacheInvalidator</code>, so that an invalidation
        in one instance is propagated to the others.</p>
  example: []
  syntax:
    content: 'public sealed class MemoryCachingBackend : CachingBackend, IDisposable'
    content.vb: Public NotInheritable Class MemoryCachingBackend Inherits CachingBackend Implements IDisposable
  seealso:
  - linkType: HRef
    linkId: '@caching-memory'
    altText: 'Conceptual: Using In-Memory Cache'
  - linkType: HRef
    linkId: '@caching-pubsub'
    altText: 'Conceptual: Synchronizing Local In-Memory Caches for Multiple Servers'
