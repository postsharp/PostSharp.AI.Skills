    Gets the <xref href="PostSharp.Patterns.Caching.ICachingService" data-throw-if-not-resolved="false"></xref> used by the cached methods that do not receive a service from dependency injection, i.e. the

    result of <xref href="PostSharp.Patterns.Caching.CachingServices.DefaultServiceLocator" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static ICachingService DefaultService { get; }
