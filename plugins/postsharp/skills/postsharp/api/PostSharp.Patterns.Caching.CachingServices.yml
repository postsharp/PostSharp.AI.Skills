- uid: PostSharp.Patterns.Caching.CachingServices.SuspendDependencyPropagation
  commentId: M:PostSharp.Patterns.Caching.CachingServices.SuspendDependencyPropagation
  id: SuspendDependencyPropagation
  parent: PostSharp.Patterns.Caching.CachingServices
  langs:
  - csharp
  - vb
  name: SuspendDependencyPropagation()
  nameWithType: CachingServices.SuspendDependencyPropagation()
  fullName: PostSharp.Patterns.Caching.CachingServices.SuspendDependencyPropagation()
  type: Method
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching
  summary: Temporarily suspends propagation of dependencies from subsequently called methods to the caller method.
  remarks: >-
    <p>
        By default, calling a cached method while another <xref href="PostSharp.Patterns.Caching.CachingContext" data-throw-if-not-resolved="false"></xref> is active automatically adds the former as a dependency of the latter. 
        Since the <xref href="PostSharp.Patterns.Caching.CachingServices.CurrentContext" data-throw-if-not-resolved="false"></xref> is stored in an <xref href="System.Threading.AsyncLocal%601" data-throw-if-not-resolved="false"></xref> variable, it may be inadvertently used after the method call associated with it
        had already ended. This can happen, for example, when a method calls <xref href="System.Threading.Tasks.Task.Run(System.Action)" data-throw-if-not-resolved="false"></xref> and does not depend on the resulting <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>
        This context leak does not break correctness but may lead to unnecessary dependency invalidations. Therefore, it is recommended to use this method when calling asynchronous code
        in the context of cached methods and not being dependent on its result.
        </p>
  example: []
  syntax:
    content: public static IDisposable SuspendDependencyPropagation()
    return:
      type: System.IDisposable
      description: An <xref href="System.IDisposable" data-throw-if-not-resolved="false"></xref> that represents the suspension. Disposing this object resumes the normal dependency propagation.
    content.vb: Public Shared Function SuspendDependencyPropagation() As IDisposable
  overload: PostSharp.Patterns.Caching.CachingServices.SuspendDependencyPropagation*
  seealso:
  - linkType: HRef
    linkId: '@caching-dependencies'
    altText: 'Conceptual: Working with Cache Dependencies'
- uid: PostSharp.Patterns.Caching.CachingServices.DefaultKeyBuilder
  commentId: P:PostSharp.Patterns.Caching.CachingServices.DefaultKeyBuilder
  id: DefaultKeyBuilder
  parent: PostSharp.Patterns.Caching.CachingServices
  langs:
  - csharp
  - vb
  name: DefaultKeyBuilder
  nameWithType: CachingServices.DefaultKeyBuilder
  fullName: PostSharp.Patterns.Caching.CachingServices.DefaultKeyBuilder
  type: Property
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching
  summary: Gets or sets the <xref href="PostSharp.Patterns.Caching.Implementation.CacheKeyBuilder" data-throw-if-not-resolved="false"></xref> used to generate caching keys, i.e. to serialize objects into a <xref href="System.String" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>The default key builder limits keys to 2048 characters and does not compress them. Assign a new <xref href="PostSharp.Patterns.Caching.Implementation.CacheKeyBuilder" data-throw-if-not-resolved="false"></xref>
        to change these settings, or an instance of a derived class to change how keys are built. Setting this property to <code>null</code>
        restores a default <xref href="PostSharp.Patterns.Caching.Implementation.CacheKeyBuilder" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public static CacheKeyBuilder DefaultKeyBuilder { get; set; }
    parameters: []
    return:
      type: PostSharp.Patterns.Caching.Implementation.CacheKeyBuilder
    content.vb: Public Shared Property DefaultKeyBuilder As CacheKeyBuilder
  overload: PostSharp.Patterns.Caching.CachingServices.DefaultKeyBuilder*
  seealso:
  - linkType: HRef
    linkId: '@caching-keys'
    altText: 'Conceptual: Customizing Cache Keys'
