    linkId: '@caching-dependency-injection'
    altText: 'Conceptual: Using Caching with Dependency Injection'
- uid: PostSharp.Patterns.Caching.CachingServices.DefaultServiceLocator
  commentId: P:PostSharp.Patterns.Caching.CachingServices.DefaultServiceLocator
  id: DefaultServiceLocator
  parent: PostSharp.Patterns.Caching.CachingServices
  langs:
  - csharp
  - vb
  name: DefaultServiceLocator
  nameWithType: CachingServices.DefaultServiceLocator
  fullName: PostSharp.Patterns.Caching.CachingServices.DefaultServiceLocator
  type: Property
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching
  summary: >-
    Gets or sets the delegate that returns <xref href="PostSharp.Patterns.Caching.CachingServices.DefaultService" data-throw-if-not-resolved="false"></xref>. By default, it returns a <xref href="PostSharp.Patterns.Caching.CachingService" data-throw-if-not-resolved="false"></xref> created

    by this class. Setting this property to <code>null</code> restores the default delegate.
  remarks: >-
    <p>The delegate is called by each call to a cached method that does not receive a service from dependency injection, so it must be fast
        and return the same instance every time, for instance a singleton resolved from a dependency injection container.</p>
    <p>Set this property before configuring <xref href="PostSharp.Patterns.Caching.CachingServices.DefaultService" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Patterns.Caching.CachingServices.Profiles" data-throw-if-not-resolved="false"></xref> or the obsolete <xref href="PostSharp.Patterns.Caching.CachingServices.DefaultBackend" data-throw-if-not-resolved="false"></xref>
        and <xref href="PostSharp.Patterns.Caching.CachingServices.DefaultKeyBuilder" data-throw-if-not-resolved="false"></xref> properties: they configure the service returned at that time, and the configuration does not move
        to the service that a new delegate returns.</p>
  example: []
  syntax:
    content: public static Func<ICachingService> DefaultServiceLocator { get; set; }
    parameters: []
    return:
      type: System.Func{PostSharp.Patterns.Caching.ICachingService}
    content.vb: Public Shared Property DefaultServiceLocator As Func(Of ICachingService)
  overload: PostSharp.Patterns.Caching.CachingServices.DefaultServiceLocator*
  seealso:
  - linkType: HRef
    linkId: '@caching-dependency-injection'
    altText: 'Conceptual: Using Caching with Dependency Injection'
