  langs:
  - csharp
  - vb
  name: CachingServices
  nameWithType: CachingServices
  fullName: PostSharp.Patterns.Caching.CachingServices
  type: Class
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching
  summary: The entry point to configure <code>PostSharp.Patterns.Caching</code> at run time.
  remarks: >-
    <p>The cached methods that do not receive an <xref href="PostSharp.Patterns.Caching.ICachingService" data-throw-if-not-resolved="false"></xref> from dependency injection use <xref href="PostSharp.Patterns.Caching.CachingServices.DefaultService" data-throw-if-not-resolved="false"></xref>.
        Set its <xref href="PostSharp.Patterns.Caching.ICachingService.Backend" data-throw-if-not-resolved="false"></xref> property before the first call to a cached method; otherwise, the call throws a <xref href="PostSharp.Patterns.Caching.CachingException" data-throw-if-not-resolved="false"></xref>.
        Use <xref href="PostSharp.Patterns.Caching.CachingServices.Profiles" data-throw-if-not-resolved="false"></xref> to change the configuration of cached methods at run time, <xref href="PostSharp.Patterns.Caching.CachingServices.Invalidation" data-throw-if-not-resolved="false"></xref> to remove items from the cache,
        <xref href="PostSharp.Patterns.Caching.CachingServices.CurrentContext" data-throw-if-not-resolved="false"></xref> to add dependencies to the cached method being evaluated, and <xref href="PostSharp.Patterns.Caching.ICachingService.KeyBuilder" data-throw-if-not-resolved="false"></xref> or
        <xref href="PostSharp.Patterns.Caching.CachingServices.Formatters" data-throw-if-not-resolved="false"></xref> to customize cache keys.</p>
    <p>This class registers <xref href="PostSharp.Patterns.Caching.CachingServices.DefaultService" data-throw-if-not-resolved="false"></xref> as the <xref href="PostSharp.Patterns.Caching.ICachingService" data-throw-if-not-resolved="false"></xref> of <xref href="PostSharp.Extensibility.RunTimeServiceLocator" data-throw-if-not-resolved="false"></xref>, unless
        the application registered another one first. An object whose class receives its caching service from dependency injection, and that is
        created with <code>new</code>, therefore uses <xref href="PostSharp.Patterns.Caching.CachingServices.DefaultService" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public static class CachingServices
    content.vb: Public Module CachingServices
