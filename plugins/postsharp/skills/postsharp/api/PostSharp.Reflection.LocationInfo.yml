  namespace: PostSharp.Reflection
  summary: >-
    Represents a <xref href="System.Reflection.FieldInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref> or

    <xref href="System.Reflection.ParameterInfo" data-throw-if-not-resolved="false"></xref>, which all have the semantics of a location (get value, set value).
  remarks: >-
    <p>Aspects that target fields, properties or parameters receive their target as a <xref href="PostSharp.Reflection.LocationInfo" data-throw-if-not-resolved="false"></xref>, for instance in
        <xref href="PostSharp.Aspects.LocationLevelAspect.CompileTimeValidate(PostSharp.Reflection.LocationInfo)" data-throw-if-not-resolved="false"></xref> and through
        <xref href="PostSharp.Aspects.ILocationBinding.LocationInfo" data-throw-if-not-resolved="false"></xref>. Use <xref href="PostSharp.Reflection.LocationInfo.LocationKind" data-throw-if-not-resolved="false"></xref> to determine the kind of
        the underlying declaration.</p>
