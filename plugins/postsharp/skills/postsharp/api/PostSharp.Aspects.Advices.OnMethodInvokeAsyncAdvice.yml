  fullName: PostSharp.Aspects.Advices.OnMethodInvokeAsyncAdvice
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Custom attribute that, when applied on a method of an aspect class, specifies

    that this method is an advice that has the same semantics as <xref href="PostSharp.Aspects.IAsyncMethodInterceptionAspect.OnInvokeAsync(PostSharp.Aspects.MethodInterceptionArgs)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
            The method to which this custom attribute is applied must be public and must have the same signature as
            <xref href="PostSharp.Aspects.IAsyncMethodInterceptionAspect.OnInvokeAsync(PostSharp.Aspects.MethodInterceptionArgs)" data-throw-if-not-resolved="false"></xref>. However, it can be static.
          </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method, AllowMultiple = true, Inherited = true)]

      public sealed class OnMethodInvokeAsyncAdvice : OnMethodInvokeBaseAdvice
    content.vb: >-
      <AttributeUsage(AttributeTargets.Method, AllowMultiple:=True, Inherited:=True)>

      Public NotInheritable Class OnMethodInvokeAsyncAdvice Inherits OnMethodInvokeBaseAdvice
