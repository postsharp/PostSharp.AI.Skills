- uid: PostSharp.Aspects.IAspectBuildSemantics.GetAspectConfiguration(System.Object)
  commentId: M:PostSharp.Aspects.IAspectBuildSemantics.GetAspectConfiguration(System.Object)
  id: GetAspectConfiguration(System.Object)
  parent: PostSharp.Aspects.IAspectBuildSemantics
  langs:
  - csharp
  - vb
  name: GetAspectConfiguration(object)
  nameWithType: IAspectBuildSemantics.GetAspectConfiguration(object)
  fullName: PostSharp.Aspects.IAspectBuildSemantics.GetAspectConfiguration(object)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Method invoked at build time to get the imperative configuration of the current <xref href="PostSharp.Aspects.Aspect" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>Aspects derived from <xref href="PostSharp.Aspects.Aspect" data-throw-if-not-resolved="false"></xref> implement this method by calling <xref href="PostSharp.Aspects.Aspect.CreateAspectConfiguration" data-throw-if-not-resolved="false"></xref>
            and <xref href="PostSharp.Aspects.Aspect.SetAspectConfiguration(PostSharp.Aspects.Configuration.AspectConfiguration%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>, which read the configuration methods and properties of the aspect class.
            An aspect that implements an aspect interface directly, without deriving from the corresponding aspect class,
            is configured either by implementing this method or by a configuration custom attribute applied to the aspect class,
            for instance <xref href="PostSharp.Aspects.Configuration.OnExceptionAspectConfigurationAttribute" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: AspectConfiguration GetAspectConfiguration(object targetElement)
    parameters:
    - id: targetElement
      type: System.Object
      description: >-
        Code element (<xref href="System.Reflection.Assembly" data-throw-if-not-resolved="false"></xref>, <xref href="System.Type" data-throw-if-not-resolved="false"></xref>, 
                      <xref href="System.Reflection.FieldInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.MethodBase" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.EventInfo" data-throw-if-not-resolved="false"></xref>, 
                      <xref href="System.Reflection.ParameterInfo" data-throw-if-not-resolved="false"></xref>, or <xref href="PostSharp.Reflection.LocationInfo" data-throw-if-not-resolved="false"></xref>) to which the current aspect has been applied.
    return:
      type: PostSharp.Aspects.Configuration.AspectConfiguration
      description: >-
        An <xref href="PostSharp.Aspects.Configuration.AspectConfiguration" data-throw-if-not-resolved="false"></xref> representing the imperative configuration
                      of the current <xref href="PostSharp.Aspects.Aspect" data-throw-if-not-resolved="false"></xref>.
    content.vb: Function GetAspectConfiguration(targetElement As Object) As AspectConfiguration
  overload: PostSharp.Aspects.IAspectBuildSemantics.GetAspectConfiguration*
  nameWithType.vb: IAspectBuildSemantics.GetAspectConfiguration(Object)
  fullName.vb: PostSharp.Aspects.IAspectBuildSemantics.GetAspectConfiguration(Object)
  name.vb: GetAspectConfiguration(Object)
