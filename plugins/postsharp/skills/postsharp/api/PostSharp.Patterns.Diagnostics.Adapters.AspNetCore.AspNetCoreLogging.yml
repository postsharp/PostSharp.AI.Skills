  namespace: PostSharp.Patterns.Diagnostics.Adapters.AspNetCore
  summary: >-
    Instruments the ASP.NET Core stack to define new logging activities (and possibly transactions) for incoming HTTP requests.

    This implementation is based on <xref href="System.Diagnostics.DiagnosticListener" data-throw-if-not-resolved="false"></xref> and will capture all incoming requests.
  remarks: >-
    <p>Call <xref href="PostSharp.Patterns.Diagnostics.Adapters.AspNetCore.AspNetCoreLogging.Initialize(PostSharp.Patterns.Diagnostics.Correlation.ICorrelationProtocol%2cSystem.Predicate%7bMicrosoft.AspNetCore.Http.HttpRequest%7d%2cPostSharp.Patterns.Diagnostics.Custom.LogEventMetadata)" data-throw-if-not-resolved="false"></xref> once when the application starts, and dispose of the object it returns to stop the instrumentation.</p>

    <p>For distributed logging, pass an <xref href="PostSharp.Patterns.Diagnostics.Correlation.ICorrelationProtocol" data-throw-if-not-resolved="false"></xref> such as <xref href="PostSharp.Patterns.Diagnostics.Correlation.LegacyHttpCorrelationProtocol" data-throw-if-not-resolved="false"></xref>,
        and use the same protocol in the instrumentation of the clients. Accept correlation headers from trusted callers only,
        for example by passing a predicate to the constructor of <xref href="PostSharp.Patterns.Diagnostics.Correlation.LegacyHttpCorrelationProtocol" data-throw-if-not-resolved="false"></xref>.</p>
    <p>Each captured request can open a logging transaction. A transaction policy of type <code>AspNetCoreRequest</code> in the
        logging configuration file can set the verbosity of selected requests, and its expressions see the request as an
        <xref href="PostSharp.Patterns.Diagnostics.Adapters.AspNetCore.AspNetCoreRequestExpressionModel" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
