  type: Method
  assemblies:
  - PostSharp.Patterns.Diagnostics.Adapters.AspNetCore
  namespace: PostSharp.Patterns.Diagnostics.Adapters.AspNetCore
  summary: Instruments the ASP.NET Core stack to define new logging activities (and possibly transactions) for incoming HTTP requests.
  example: []
  syntax:
    content: public static IDisposable Initialize(ICorrelationProtocol correlationProtocol = null, Predicate<HttpRequest> filter = null, LogEventMetadata metadata = null)
    parameters:
    - id: correlationProtocol
      type: PostSharp.Patterns.Diagnostics.Correlation.ICorrelationProtocol
      description: >-
        An optional implementation of <xref href="PostSharp.Patterns.Diagnostics.Correlation.ICorrelationProtocol" data-throw-if-not-resolved="false"></xref> to support
                    distributed logging and interpret incoming request headers.
    - id: filter
      type: System.Predicate{Microsoft.AspNetCore.Http.HttpRequest}
      description: >-
        An optional predicate that determines which requests must be captured.
                    If that parameter is omitted, the paths <code>/lib</code>, <code>/css</code> and <code>/js</code> will be ignored.
    - id: metadata
      type: PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata
      description: >-
        An optional <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata" data-throw-if-not-resolved="false"></xref>, which maps an <xref href="Microsoft.AspNetCore.Http.HttpContext" data-throw-if-not-resolved="false"></xref>
                    to a set of properties and an expression model. The default implementation is <xref href="PostSharp.Patterns.Diagnostics.Adapters.AspNetCore.AspNetCoreRequestMetadata" data-throw-if-not-resolved="false"></xref>.
                    You can derive this class if you want to add or remove properties. If you want to change the expression model,
                    you have to derive the generic abstract <xref href="PostSharp.Patterns.Diagnostics.Adapters.AspNetCore.AspNetCoreRequestMetadata%601" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.IDisposable
      description: <p>An opaque <xref href="System.IDisposable" data-throw-if-not-resolved="false"></xref> that you can dispose to stop collecting logs from ASP.NET Core.</p>
    content.vb: Public Shared Function Initialize(correlationProtocol As ICorrelationProtocol = Nothing, filter As Predicate(Of HttpRequest) = Nothing, metadata As LogEventMetadata = Nothing) As IDisposable
