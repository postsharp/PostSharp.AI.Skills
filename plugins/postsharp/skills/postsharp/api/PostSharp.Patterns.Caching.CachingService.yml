  type: Method
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching
  summary: >-
    Asynchronously gets a value from the cache or, when the cache has no item for the key, evaluates the value, adds it to the cache and returns it.

    The <xref href="PostSharp.Patterns.Caching.CacheAttribute" data-throw-if-not-resolved="false"></xref> aspect calls this method for asynchronous methods.
  example: []
  syntax:
    content: public Task<object> GetOrAddAsync(MethodInfo method, string key, Type valueType, CacheItemConfiguration configuration, Func<Task<object>> valueProvider, LogSource logger, CancellationToken cancellationToken)
    parameters:
    - id: method
      type: System.Reflection.MethodInfo
      description: The cached method.
    - id: key
      type: System.String
      description: The cache key, computed by <xref href="PostSharp.Patterns.Caching.ICachingService.KeyBuilder" data-throw-if-not-resolved="false"></xref>.
    - id: valueType
      type: System.Type
      description: The type of the cached value, i.e. the type of the result of the task.
    - id: configuration
      type: PostSharp.Patterns.Caching.Implementation.CacheItemConfiguration
      description: The configuration of the cached method, already merged with its profile.
    - id: valueProvider
      type: System.Func{System.Threading.Tasks.Task{System.Object}}
      description: A delegate that evaluates the value.
    - id: logger
      type: PostSharp.Patterns.Diagnostics.LogSource
      description: The <xref href="PostSharp.Patterns.Diagnostics.LogSource" data-throw-if-not-resolved="false"></xref> of the declaring type of the cached method.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A <xref href="System.Threading.CancellationToken" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Threading.Tasks.Task{System.Object}
      description: A <xref href="System.Threading.Tasks.Task%601" data-throw-if-not-resolved="false"></xref> that evaluates to the cached or evaluated value.
    content.vb: Public Function GetOrAddAsync(method As MethodInfo, key As String, valueType As Type, configuration As CacheItemConfiguration, valueProvider As Func(Of Task(Of Object)), logger As LogSource, cancellationToken As CancellationToken) As Task(Of Object)
  overload: PostSharp.Patterns.Caching.CachingService.GetOrAddAsync*
  implements:
  - PostSharp.Patterns.Caching.ICachingService.GetOrAddAsync(System.Reflection.MethodInfo,System.String,System.Type,PostSharp.Patterns.Caching.Implementation.CacheItemConfiguration,System.Func{System.Threading.Tasks.Task{System.Object}},PostSharp.Patterns.Diagnostics.LogSource,System.Threading.CancellationToken)
  nameWithType.vb: CachingService.GetOrAddAsync(MethodInfo, String, Type, CacheItemConfiguration, Func(Of Task(Of Object)), LogSource, CancellationToken)
  fullName.vb: PostSharp.Patterns.Caching.CachingService.GetOrAddAsync(System.Reflection.MethodInfo, String, System.Type, PostSharp.Patterns.Caching.Implementation.CacheItemConfiguration, System.Func(Of System.Threading.Tasks.Task(Of Object)), PostSharp.Patterns.Diagnostics.LogSource, System.Threading.CancellationToken)
