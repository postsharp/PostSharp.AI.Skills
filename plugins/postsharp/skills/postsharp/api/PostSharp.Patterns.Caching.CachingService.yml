      type: System.Reflection.MethodInfo
      description: The <xref href="System.Reflection.MethodInfo" data-throw-if-not-resolved="false"></xref> of the method call.
      attributes:
      - type: PostSharp.Patterns.Contracts.RequiredAttribute
        ctor: PostSharp.Patterns.Contracts.RequiredAttribute.#ctor
        arguments: []
    - id: instance
      type: System.Object
      description: The value of the <code>this</code> instance, or <code>null</code> for static methods.
    - id: args
      type: System.Object[]
      description: The method arguments.
    content.vb: Public Sub Invalidate(method As MethodInfo, instance As Object, ParamArray args As Object())
