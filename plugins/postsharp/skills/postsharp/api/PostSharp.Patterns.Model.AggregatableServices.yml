  langs:
  - csharp
  - vb
  name: Advice(object, RelationshipInfo, bool)
  nameWithType: AggregatableServices.Advice(object, RelationshipInfo, bool)
  fullName: PostSharp.Patterns.Model.AggregatableServices.Advice(object, PostSharp.Patterns.Model.RelationshipInfo, bool)
  type: Method
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: Injects the <code>Aggregatable</code> dynamic implementation into an object and specifies the <xref href="PostSharp.Patterns.Model.RelationshipInfo" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static bool Advice(object obj, RelationshipInfo relationshipInfo, bool required = true)
    parameters:
    - id: obj
      type: System.Object
      description: The object into which the implementation must be injected.
    - id: relationshipInfo
      type: PostSharp.Patterns.Model.RelationshipInfo
      description: The description of the relationship of <code class="paramref">obj</code> relatively to its parent.
    - id: required
      type: System.Boolean
      description: >-
        <code>true</code> if an <xref href="System.InvalidOperationException" data-throw-if-not-resolved="false"></xref> should be thrown if <code class="paramref">obj</code> cannot be dynamically advised,
            otherwise <code>false</code>.
    return:
      type: System.Boolean
      description: >-
        <code>true</code> if the <code>Aggregatable</code> implementation was successfully injected into <code class="paramref">obj</code>, <code>false</code> if <code class="paramref">obj</code> already
            implemented it, or if <code class="paramref">obj</code> cannot be dynamically advised and <code class="paramref">required</code> is <code>false</code>.
    content.vb: Public Shared Function Advice(obj As Object, relationshipInfo As RelationshipInfo, required As Boolean = True) As Boolean
  overload: PostSharp.Patterns.Model.AggregatableServices.Advice*
  nameWithType.vb: AggregatableServices.Advice(Object, RelationshipInfo, Boolean)
