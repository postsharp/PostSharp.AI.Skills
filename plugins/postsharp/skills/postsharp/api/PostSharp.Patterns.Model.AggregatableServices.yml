- uid: PostSharp.Patterns.Model.AggregatableServices.Advice(System.Object,PostSharp.Patterns.Model.RelationshipInfo,System.Boolean)
  commentId: M:PostSharp.Patterns.Model.AggregatableServices.Advice(System.Object,PostSharp.Patterns.Model.RelationshipInfo,System.Boolean)
  id: Advice(System.Object,PostSharp.Patterns.Model.RelationshipInfo,System.Boolean)
