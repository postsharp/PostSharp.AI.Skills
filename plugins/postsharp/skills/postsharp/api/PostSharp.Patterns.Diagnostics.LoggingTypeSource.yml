  name: LoggingTypeSource
  nameWithType: LoggingTypeSource
  fullName: PostSharp.Patterns.Diagnostics.LoggingTypeSource
  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics
  summary: >-
    Allows enabling or disabling logging for a specific type, and exposes some information about the verbosity for this type. Note that a type here does

    not need to map to a .NET type. It can be an arbitrary dot-separated string.
  remarks: >-
    <p>A <xref href="PostSharp.Patterns.Diagnostics.LoggingTypeSource" data-throw-if-not-resolved="false"></xref> is identified by a role (see <xref href="PostSharp.Patterns.Diagnostics.LoggingRoles" data-throw-if-not-resolved="false"></xref>) and a type name. It corresponds to the logger,
        category or source concept of the target logging framework. A log record is emitted only when logging is enabled both in PostSharp, through the
        <xref href="PostSharp.Patterns.Diagnostics.LoggingVerbosityConfiguration" data-throw-if-not-resolved="false"></xref>, and in the target logging framework, as reported by <xref href="PostSharp.Patterns.Diagnostics.LoggingTypeSource.IsBackendEnabled(PostSharp.Patterns.Diagnostics.LogLevel)" data-throw-if-not-resolved="false"></xref>.</p>
    <p>A custom backend derives a class from <xref href="PostSharp.Patterns.Diagnostics.LoggingTypeSource" data-throw-if-not-resolved="false"></xref>, typically with a field that holds the logger of the target
        framework, and returns it from <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.CreateTypeSource(PostSharp.Patterns.Diagnostics.LoggingNamespaceSource%2cSystem.Type)" data-throw-if-not-resolved="false"></xref>. Because instances are shared by all threads, the derived class
        must be immutable or thread-safe.</p>
  example: []
  syntax:
    content: 'public abstract class LoggingTypeSource : LoggingNamespaceSource, IContextLocalLogger, ILoggerExceptionHandler'
    content.vb: Public MustInherit Class LoggingTypeSource Inherits LoggingNamespaceSource Implements IContextLocalLogger, ILoggerExceptionHandler
  seealso:
