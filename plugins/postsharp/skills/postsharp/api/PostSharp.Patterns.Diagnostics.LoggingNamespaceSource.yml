    <code>PostSharp.Patterns.Diagnostics.LoggingBackend</code>, <xref href="PostSharp.Patterns.Diagnostics.LoggingNamespaceSource.Name" data-throw-if-not-resolved="false"></xref> is <code>LoggingBackend</code>.

    For generic types, the <xref href="PostSharp.Patterns.Diagnostics.LoggingNamespaceSource.Name" data-throw-if-not-resolved="false"></xref> property includes the arity, that is, the name of <code>List&lt;T&gt;</code> is <code>List`1</code>.

