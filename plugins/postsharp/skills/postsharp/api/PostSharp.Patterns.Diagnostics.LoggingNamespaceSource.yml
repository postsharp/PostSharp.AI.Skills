  fullName: PostSharp.Patterns.Diagnostics.LoggingNamespaceSource
  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics
  summary: Allows enabling or disabling logging for a whole namespace.
  remarks: >-
    <p>Instances of the <xref href="PostSharp.Patterns.Diagnostics.LoggingNamespaceSource" data-throw-if-not-resolved="false"></xref> and
        <xref href="PostSharp.Patterns.Diagnostics.LoggingTypeSource" data-throw-if-not-resolved="false"></xref> classes form a forest. The roots are instances of the <xref href="PostSharp.Patterns.Diagnostics.LoggingNamespaceSource" data-throw-if-not-resolved="false"></xref> class,
        with one instance per value of the <xref href="PostSharp.Patterns.Diagnostics.LoggingNamespaceSource.Role" data-throw-if-not-resolved="false"></xref> property, and their <xref href="PostSharp.Patterns.Diagnostics.LoggingNamespaceSource.FullName" data-throw-if-not-resolved="false"></xref> property is <code>null</code>.
        Instances of the <xref href="PostSharp.Patterns.Diagnostics.LoggingTypeSource" data-throw-if-not-resolved="false"></xref> class are the leaves of the trees.</p>
  example: []
  syntax:
    content: public class LoggingNamespaceSource
    content.vb: Public Class LoggingNamespaceSource
