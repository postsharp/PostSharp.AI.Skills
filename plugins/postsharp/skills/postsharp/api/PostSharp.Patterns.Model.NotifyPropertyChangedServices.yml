  type: Class
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Model
  summary: Provides utility methods for working with the <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedAttribute" data-throw-if-not-resolved="false"></xref> aspect.
  remarks: >-
    <p>The <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedAttribute" data-throw-if-not-resolved="false"></xref> aspect buffers change notifications in a per-thread buffer and raises them when the control flow
        exits the changed object. Use <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedServices.RaiseEventsImmediate(System.Object)" data-throw-if-not-resolved="false"></xref> to flush the buffer for an object before that, and <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedServices.SuspendEvents" data-throw-if-not-resolved="false"></xref>
        and <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedServices.ResumeEvents" data-throw-if-not-resolved="false"></xref> to hold notifications back over a longer piece of code.</p>
  example: []
