  type: Method
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Model
  summary: >-
    Resumes the raising of <xref href="System.ComponentModel.INotifyPropertyChanged.PropertyChanged" data-throw-if-not-resolved="false"></xref> events for the current thread after it has been

    suspended by the <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedServices.SuspendEvents" data-throw-if-not-resolved="false"></xref> method.
  example: []
  syntax:
    content: public static void ResumeEvents()
    content.vb: Public Shared Sub ResumeEvents()
  overload: PostSharp.Patterns.Model.NotifyPropertyChangedServices.ResumeEvents*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: >-
      The method is called from an event handler, or the events of the current thread
                  are not suspended.
- uid: PostSharp.Patterns.Model.NotifyPropertyChangedServices.SignalPropertyChanged(System.Object,System.String)
  commentId: M:PostSharp.Patterns.Model.NotifyPropertyChangedServices.SignalPropertyChanged(System.Object,System.String)
  id: SignalPropertyChanged(System.Object,System.String)
  parent: PostSharp.Patterns.Model.NotifyPropertyChangedServices
  langs:
  - csharp
  - vb
  name: SignalPropertyChanged(object, string)
  nameWithType: NotifyPropertyChangedServices.SignalPropertyChanged(object, string)
  fullName: PostSharp.Patterns.Model.NotifyPropertyChangedServices.SignalPropertyChanged(object, string)
  type: Method
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Model
  summary: Signals the <xref href="System.ComponentModel.INotifyPropertyChanged.PropertyChanged" data-throw-if-not-resolved="false"></xref> event of an object that is instrumented with the <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedAttribute" data-throw-if-not-resolved="false"></xref> aspect.
  remarks: >-
    <p>This method invokes the <code>OnPropertyChanged</code> method on the <code class="paramref">instance</code> object. If the method has been defined in user code, it will be invoked.</p>

    <p>The event is buffered and will actually be raised when the current thread exits the scope of the <code class="paramref">instance</code> parameter. This method invokes the <code>OnPropertyChanged</code> method synchronously.</p>
  example: []
  syntax:
    content: public static void SignalPropertyChanged(object instance, string propertyName)
    parameters:
    - id: instance
      type: System.Object
      description: An instance of a class instrumented with the <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedAttribute" data-throw-if-not-resolved="false"></xref> aspect.
    - id: propertyName
      type: System.String
      description: The name of the changed property.
    content.vb: Public Shared Sub SignalPropertyChanged(instance As Object, propertyName As String)
  overload: PostSharp.Patterns.Model.NotifyPropertyChangedServices.SignalPropertyChanged*
  nameWithType.vb: NotifyPropertyChangedServices.SignalPropertyChanged(Object, String)
  fullName.vb: PostSharp.Patterns.Model.NotifyPropertyChangedServices.SignalPropertyChanged(Object, String)
  name.vb: SignalPropertyChanged(Object, String)
