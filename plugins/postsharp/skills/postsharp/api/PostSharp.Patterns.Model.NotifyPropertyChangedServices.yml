- uid: PostSharp.Patterns.Model.NotifyPropertyChangedServices.SuspendEvents
  commentId: M:PostSharp.Patterns.Model.NotifyPropertyChangedServices.SuspendEvents
  id: SuspendEvents
  parent: PostSharp.Patterns.Model.NotifyPropertyChangedServices
  langs:
  - csharp
  - vb
  name: SuspendEvents()
  nameWithType: NotifyPropertyChangedServices.SuspendEvents()
  fullName: PostSharp.Patterns.Model.NotifyPropertyChangedServices.SuspendEvents()
  type: Method
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Model
  summary: Suspends the raising of <xref href="System.ComponentModel.INotifyPropertyChanged.PropertyChanged" data-throw-if-not-resolved="false"></xref> events for the current thread.
  remarks: >-
    <p>The <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedServices.ResumeEvents" data-throw-if-not-resolved="false"></xref> method should be invoked as many times as the <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedServices.SuspendEvents" data-throw-if-not-resolved="false"></xref> method has been invoked,
        regardless of the return value of the <xref href="PostSharp.Patterns.Model.NotifyPropertyChangedServices.SuspendEvents" data-throw-if-not-resolved="false"></xref> method. Failing to do so results in events not being raised at all and potentially in memory leaks,
        because collected events hold strong references.</p>
    <p>When events are suspended, existing objects have <xref href="System.ComponentModel.INotifyPropertyChanged.PropertyChanged" data-throw-if-not-resolved="false"></xref> events collected into an event buffer. Multiple changes are treated as one.</p>

    <p>When events are suspended, newly created objects do not have <xref href="System.ComponentModel.INotifyPropertyChanged.PropertyChanged" data-throw-if-not-resolved="false"></xref> events collected.</p>

    <p>When events are suspended, all objects do not have <xref href="System.ComponentModel.INotifyPropertyChanging.PropertyChanging" data-throw-if-not-resolved="false"></xref> events collected.</p>
  example: []
  syntax:
    content: public static bool SuspendEvents()
    return:
      type: System.Boolean
      description: <code>true</code> if events were suspended as a result of the current method call, <code>false</code> if events were already suspended before.
    content.vb: Public Shared Function SuspendEvents() As Boolean
  overload: PostSharp.Patterns.Model.NotifyPropertyChangedServices.SuspendEvents*
- uid: PostSharp.Patterns.Model.NotifyPropertyChangedServices.ResumeEvents
  commentId: M:PostSharp.Patterns.Model.NotifyPropertyChangedServices.ResumeEvents
  id: ResumeEvents
  parent: PostSharp.Patterns.Model.NotifyPropertyChangedServices
  langs:
  - csharp
  - vb
