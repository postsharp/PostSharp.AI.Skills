  namespace: PostSharp.Patterns.Diagnostics
  summary: Custom attribute that, when applied on a method, causes PostSharp to implement tracing when an exception occurs in this method.
  remarks: >-
    <p>Using this custom attribute is strictly equivalent to using <xref href="PostSharp.Patterns.Diagnostics.LogAttribute" data-throw-if-not-resolved="false"></xref> with the <code>Exceptions</code> profile
        and no other property set.</p>
    <p>The <code>Exceptions</code> profile logs only method exceptions, with the <xref href="PostSharp.Patterns.Diagnostics.LogLevel.Warning" data-throw-if-not-resolved="false"></xref> level. You can change its options
            in <code>postsharp.config</code>. See <xref href="PostSharp.Patterns.Diagnostics.LoggingProfile" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
