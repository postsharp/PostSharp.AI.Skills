  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics.Backends.Tracing
  namespace: PostSharp.Patterns.Diagnostics.Backends.EventSource
  summary: Logging backend that uses <xref href="System.Diagnostics.Tracing.EventSource" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>It can be used with ETW or Enterprise Library Semantic Logging.</p>

    <p>To use this backend, assign a new instance to <xref href="PostSharp.Patterns.Diagnostics.LoggingServices.DefaultBackend" data-throw-if-not-resolved="false"></xref> when the application starts.

    The default <xref href="PostSharp.Patterns.Diagnostics.Backends.EventSource.PostSharpEventSource" data-throw-if-not-resolved="false"></xref> emits events under the provider name <code>PostSharp-Patterns-Diagnostics</code>; enable this

    provider in the ETW session that collects the events, for example with PerfView. An <xref href="System.Diagnostics.Tracing.EventSource" data-throw-if-not-resolved="false"></xref>

    does not throw when its construction fails, so check <xref href="System.Diagnostics.Tracing.EventSource.ConstructionException" data-throw-if-not-resolved="false"></xref> of

    the <xref href="PostSharp.Patterns.Diagnostics.Backends.EventSource.EventSourceLoggingBackend.EventSource" data-throw-if-not-resolved="false"></xref> property.</p>
  example: []
  syntax:
    content: 'public class EventSourceLoggingBackend : TextLoggingBackend, IDisposable'
    content.vb: Public Class EventSourceLoggingBackend Inherits TextLoggingBackend Implements IDisposable
