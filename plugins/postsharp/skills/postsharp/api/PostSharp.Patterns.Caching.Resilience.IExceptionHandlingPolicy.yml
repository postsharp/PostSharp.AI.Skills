  name: IExceptionHandlingPolicy
  nameWithType: IExceptionHandlingPolicy
  fullName: PostSharp.Patterns.Caching.Resilience.IExceptionHandlingPolicy
  type: Interface
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching.Resilience
  summary: Determines how exceptions should be handled in <xref href="PostSharp.Patterns.Caching.Implementation.CachingBackend" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>The Redis backend takes this policy from the <code>ExceptionHandlingPolicy</code> property of its configuration. The default policy,
        <xref href="PostSharp.Patterns.Caching.Resilience.DefaultExceptionHandlingPolicy" data-throw-if-not-resolved="false"></xref>, logs and swallows the exceptions of read operations, and handles
        a failed write by removing the item or invalidating the dependency in the background, so that the cache does not remain inconsistent.
        It rethrows the exceptions of cleanup operations.</p>
