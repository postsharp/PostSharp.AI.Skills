  name: LoggingProfile
  nameWithType: LoggingProfile
  fullName: PostSharp.Patterns.Diagnostics.LoggingProfile
  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics
  summary: >-
    Logging profiles are named configurations of logging aspects and influence the way PostSharp generates the

    code instrumentation. They are typically instantiated in <code>postsharp.config</code>.
  remarks: >-
    <p>
        Logging profiles can be referred to from the <xref href="PostSharp.Patterns.Diagnostics.LogAttribute" data-throw-if-not-resolved="false"></xref>. There are three system-defined logging profiles: <code>Default</code>
        (the default profile for <xref href="PostSharp.Patterns.Diagnostics.LogAttribute" data-throw-if-not-resolved="false"></xref>), <code>Exceptions</code> (default for <xref href="PostSharp.Patterns.Diagnostics.LogExceptionAttribute" data-throw-if-not-resolved="false"></xref>), and <code>Audit</code>
        (default for <xref href="PostSharp.Patterns.Diagnostics.Audit.AuditAttribute" data-throw-if-not-resolved="false"></xref>).</p>
    <p>Define or change a profile with a <code>LoggingProfile</code> element under <code>Logging/Profiles</code> in <code>postsharp.config</code>. The settings of a profile
        with the name of a system-defined profile override the settings of that profile. To use a new profile, pass its name to the
        <xref href="PostSharp.Patterns.Diagnostics.LogAttribute.%23ctor(System.String)" data-throw-if-not-resolved="false"></xref> constructor. Because profiles affect the generated code, rebuild the project after changing them.</p>
    <p>Profiles contain only build-time options. Run-time options, such as the formatting of text records, are set on the
        <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.Options" data-throw-if-not-resolved="false"></xref> property of the backend, and apply to all profiles that use this backend.</p>
  example: []
  syntax:
    content: >-
      [Serializer(typeof(LoggingProfile.Serializer))]

      public class LoggingProfile
    content.vb: >-
      <Serializer(GetType(LoggingProfile.Serializer))>

      Public Class LoggingProfile
