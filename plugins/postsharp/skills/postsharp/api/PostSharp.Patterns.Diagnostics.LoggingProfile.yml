- uid: PostSharp.Patterns.Diagnostics.LoggingProfile.AllowDynamicEnabling
  commentId: P:PostSharp.Patterns.Diagnostics.LoggingProfile.AllowDynamicEnabling
  id: AllowDynamicEnabling
  parent: PostSharp.Patterns.Diagnostics.LoggingProfile
  langs:
  - csharp
  - vb
  name: AllowDynamicEnabling
  nameWithType: LoggingProfile.AllowDynamicEnabling
  fullName: PostSharp.Patterns.Diagnostics.LoggingProfile.AllowDynamicEnabling
  type: Property
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics
  summary: >-
    Gets or sets a value indicating whether logging can be dynamically enabled or disabled after initialization. The default value of this property

    is <code>true</code>. When it is set to <code>false</code>, PostSharp generates code that allows the JIT compiler to completely remove logging instructions

    for types that are not enabled.
  remarks: >-
    <p>When this property is <code>false</code>, the generated code evaluates once, in static fields, whether each log level is enabled for the
        logged type. Changes to the verbosity made after these fields are initialized are ignored for this type. Configure the
        <xref href="PostSharp.Patterns.Diagnostics.LoggingVerbosityConfiguration" data-throw-if-not-resolved="false"></xref> when the application initializes, before the logged code runs.</p>
  example: []
  syntax:
    content: public bool AllowDynamicEnabling { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property AllowDynamicEnabling As Boolean
  overload: PostSharp.Patterns.Diagnostics.LoggingProfile.AllowDynamicEnabling*
  seealso:
  - linkType: HRef
    linkId: '@logging-verbosity-api'
    altText: 'Conceptual: Adjusting Logging Verbosity Programmatically'
