- uid: PostSharp.Extensibility.IValidableAnnotation.CompileTimeValidate(System.Object)
  commentId: M:PostSharp.Extensibility.IValidableAnnotation.CompileTimeValidate(System.Object)
  id: CompileTimeValidate(System.Object)
  parent: PostSharp.Extensibility.IValidableAnnotation
  langs:
  - csharp
  - vb
  name: CompileTimeValidate(object)
  nameWithType: IValidableAnnotation.CompileTimeValidate(object)
  fullName: PostSharp.Extensibility.IValidableAnnotation.CompileTimeValidate(object)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    Method invoked at build time to ensure that the aspect has been applied to

    the right target.
  remarks: >-
    The implementation of this method is expected to emit an error message

    or an exception of type <xref href="PostSharp.Extensibility.InvalidAnnotationException" data-throw-if-not-resolved="false"></xref> in case of error. Only returning <code>false</code> causes the aspect

    to be silently ignored.
  example: []
  syntax:
    content: bool CompileTimeValidate(object target)
    parameters:
    - id: target
      type: System.Object
      description: The target element.
    return:
      type: System.Boolean
      description: >-
        <code>true</code> if the aspect was applied to an acceptable target, otherwise
              <code>false</code>.
    content.vb: Function CompileTimeValidate(target As Object) As Boolean
  overload: PostSharp.Extensibility.IValidableAnnotation.CompileTimeValidate*
  nameWithType.vb: IValidableAnnotation.CompileTimeValidate(Object)
  fullName.vb: PostSharp.Extensibility.IValidableAnnotation.CompileTimeValidate(Object)
  name.vb: CompileTimeValidate(Object)
