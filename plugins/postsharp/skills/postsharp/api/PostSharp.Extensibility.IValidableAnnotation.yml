  name: IValidableAnnotation
  nameWithType: IValidableAnnotation
  fullName: PostSharp.Extensibility.IValidableAnnotation
  type: Interface
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    Interface that, when implemented by a custom attribute (<xref href="System.Attribute" data-throw-if-not-resolved="false"></xref>),

    causes <code>PostSharp</code> to invoke a validation method for every instance

    of that custom attribute.
  remarks: >-
    <p>Use this interface to validate the usage of custom attributes that are not aspects. Aspects derived from
        <xref href="PostSharp.Aspects.Aspect" data-throw-if-not-resolved="false"></xref> already implement it: override <xref href="PostSharp.Aspects.Aspect.CompileTimeValidate(System.Object)" data-throw-if-not-resolved="false"></xref> instead.</p>
  example: []
  syntax:
    content: >-
      [RequirePostSharp(null, "ValidateAnnotations")]

      public interface IValidableAnnotation
    content.vb: >-
      <RequirePostSharp(Nothing, "ValidateAnnotations")>

      Public Interface IValidableAnnotation
