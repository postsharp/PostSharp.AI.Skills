  fullName: PostSharp.Extensibility.InvalidAnnotationException
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    Exception thrown at build time by an implementation of <xref href="PostSharp.Extensibility.IValidableAnnotation.CompileTimeValidate(System.Object)" data-throw-if-not-resolved="false"></xref>

    when an annotation is invalid.
  remarks: >-
    <p>PostSharp reports the exception as a build error that includes its message, and does not apply the annotation.
        Instead of throwing this exception, you can also emit an error with <xref href="PostSharp.Extensibility.Message.Write(PostSharp.Extensibility.MessageLocation%2cPostSharp.Extensibility.SeverityType%2cSystem.String%2cSystem.String)" data-throw-if-not-resolved="false"></xref>
        or a <xref href="PostSharp.Extensibility.MessageSource" data-throw-if-not-resolved="false"></xref> and return <code>false</code>.</p>
