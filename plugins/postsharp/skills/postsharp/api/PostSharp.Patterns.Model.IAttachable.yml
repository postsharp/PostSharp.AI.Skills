  summary: Defines the setter methods of the <xref href="PostSharp.Patterns.Model.IAggregatable" data-throw-if-not-resolved="false"></xref> interface.
  remarks: >-
    <p>This interface is consumed by the <xref href="PostSharp.Patterns.Model.AggregatableAttribute" data-throw-if-not-resolved="false"></xref> aspect. It should normally not be consumed in user code.</p>

    <p>User classes may implement this interface in a class if a custom implementation of <xref href="PostSharp.Patterns.Model.IAggregatable" data-throw-if-not-resolved="false"></xref> is required.</p>

    <p>A child object may be attached several times to the same parent through several relationships.</p>
