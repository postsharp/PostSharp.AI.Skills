- uid: PostSharp.Patterns.Model.IAttachable.AttachToParent(PostSharp.Patterns.Model.RelationshipInfo,PostSharp.Patterns.Model.IAttacher,System.Object)
  commentId: M:PostSharp.Patterns.Model.IAttachable.AttachToParent(PostSharp.Patterns.Model.RelationshipInfo,PostSharp.Patterns.Model.IAttacher,System.Object)
  id: AttachToParent(PostSharp.Patterns.Model.RelationshipInfo,PostSharp.Patterns.Model.IAttacher,System.Object)
  parent: PostSharp.Patterns.Model.IAttachable
  langs:
  - csharp
  - vb
  name: AttachToParent(RelationshipInfo, IAttacher, object)
  nameWithType: IAttachable.AttachToParent(RelationshipInfo, IAttacher, object)
  fullName: PostSharp.Patterns.Model.IAttachable.AttachToParent(PostSharp.Patterns.Model.RelationshipInfo, PostSharp.Patterns.Model.IAttacher, object)
  type: Method
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: Attaches the current object to a parent object.
  remarks: >-
    <p>In case a child is attached to its parent through several relationships, all relationships should have the same characteristics,
            that is, their <xref href="PostSharp.Patterns.Model.RelationshipInfo" data-throw-if-not-resolved="false"></xref> value should be identical.</p>
  example: []
  syntax:
    content: bool AttachToParent(RelationshipInfo relationshipInfo, IAttacher attacher, object attacherState)
    parameters:
    - id: relationshipInfo
      type: PostSharp.Patterns.Model.RelationshipInfo
      description: >-
        Information about the relationship of the parent node relative to the current node.
                    The <xref href="PostSharp.Patterns.Model.RelationshipInfo.Relationship" data-throw-if-not-resolved="false"></xref> property must be set to <xref href="PostSharp.Patterns.Model.RelationshipKind.Child" data-throw-if-not-resolved="false"></xref> or
                    <xref href="PostSharp.Patterns.Model.RelationshipKind.ParentSurrogate" data-throw-if-not-resolved="false"></xref>.
    - id: attacher
      type: PostSharp.Patterns.Model.IAttacher
      description: A service that allows the current node to attach itself to the parent.
    - id: attacherState
      type: System.Object
      description: An opaque state object to be passed as the first argument to all methods of the <xref href="PostSharp.Patterns.Model.IAttacher" data-throw-if-not-resolved="false"></xref> interface.
    return:
      type: System.Boolean
      description: <code>true</code> if the current object was not previously attached to any parent, <code>false</code> if it was already attached to the same parent.
    content.vb: Function AttachToParent(relationshipInfo As RelationshipInfo, attacher As IAttacher, attacherState As Object) As Boolean
  overload: PostSharp.Patterns.Model.IAttachable.AttachToParent*
  nameWithType.vb: IAttachable.AttachToParent(RelationshipInfo, IAttacher, Object)
  fullName.vb: PostSharp.Patterns.Model.IAttachable.AttachToParent(PostSharp.Patterns.Model.RelationshipInfo, PostSharp.Patterns.Model.IAttacher, Object)
  name.vb: AttachToParent(RelationshipInfo, IAttacher, Object)
