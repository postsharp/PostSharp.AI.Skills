  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: Detaches the current object from its parent object.
  example: []
  syntax:
    content: bool DetachFromParent()
    return:
      type: System.Boolean
      description: >-
        <code>true</code> if the current object has been fully detached, that is, is no longer attached to its parent by any other relationship, or <code>false</code>
            if the current object is still attached to the parent by some relationship.
    content.vb: Function DetachFromParent() As Boolean
  overload: PostSharp.Patterns.Model.IAttachable.DetachFromParent*
