  name: IDynamicAdvice
  nameWithType: IDynamicAdvice
  fullName: PostSharp.Patterns.DynamicAdvising.IDynamicAdvice
  type: Interface
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.DynamicAdvising
  summary: Represents an advice that can be injected dynamically into a dynamically-advisable object.
  remarks: >-
    <p>
        Dynamic advices form a chain of responsibility. Specific interfaces derived from <xref href="PostSharp.Patterns.DynamicAdvising.IDynamicAdvice" data-throw-if-not-resolved="false"></xref> (such as <xref href="PostSharp.Patterns.Collections.Advices.ICollectionDynamicAdvice%601" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Collections.Advices.IDictionaryDynamicAdvice%602" data-throw-if-not-resolved="false"></xref>)
        define the semantics of the corresponding specific advised type (such as <xref href="PostSharp.Patterns.Collections.AdvisableCollection%601" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Collections.AdvisableDictionary%602" data-throw-if-not-resolved="false"></xref>). The last node in the chain of implementation
        is the actual collection implementation.
        </p>
  example: []
  syntax:
    content: 'public interface IDynamicAdvice : IDynamicInterfaceImplementation'
    content.vb: Public Interface IDynamicAdvice Inherits IDynamicInterfaceImplementation
  derivedClasses:
  - PostSharp.Patterns.Collections.Advices.CollectionDynamicAdvice`1
  - PostSharp.Patterns.Collections.Advices.DictionaryDynamicAdvice`2
  - PostSharp.Patterns.Collections.Advices.HashSetDynamicAdvice`1
  - PostSharp.Patterns.DynamicAdvising.DynamicAdvice
  inheritedMembers:
  - PostSharp.Patterns.DynamicAdvising.IDynamicInterfaceImplementation.AdvisedObject
