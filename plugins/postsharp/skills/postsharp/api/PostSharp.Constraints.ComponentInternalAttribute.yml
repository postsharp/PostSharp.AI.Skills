  name: ComponentInternalAttribute
  nameWithType: ComponentInternalAttribute
  fullName: PostSharp.Constraints.ComponentInternalAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Constraints
  summary: >-
    <xref href="PostSharp.Constraints.ReferentialConstraint" data-throw-if-not-resolved="false"></xref> that, when applied to a declaration, limits the scope (namespace or type) in which this declaration 
        can be used. This constraint is useful to isolate several components from each other, even if they are implemented in
        the same assembly. The ComponentInternal constraint sets the visibility of a declaration between <code>internal</code> and <code>private</code>.
  remarks: >-
    <p>With the default constructor, the declaration can be used only from the namespace of its declaring type.
        The other constructors accept a list of friend types or namespaces. A friend namespace also grants access to its child namespaces.
        Code in the same top-level type as the target declaration always has access.</p>
    <p>A violation emits the warning <code>AR0102</code>. Set <xref href="PostSharp.Constraints.ComponentInternalAttribute.Severity" data-throw-if-not-resolved="false"></xref> to <xref href="PostSharp.Extensibility.SeverityType.Error" data-throw-if-not-resolved="false"></xref> to make it an error.
        <xref href="PostSharp.Extensibility.SuppressWarningAttribute" data-throw-if-not-resolved="false"></xref> can suppress the warning where the declaration is used, but cannot suppress an error.</p>
    <p>References from other assemblies are validated only when the target declaration is public and the referencing
        project is processed by PostSharp.</p>
  example: []
  syntax:
    content: 'public sealed class ComponentInternalAttribute : ReferenceConstraint, IReferentialConstraint, IConstraint'
    content.vb: Public NotInheritable Class ComponentInternalAttribute Inherits ReferenceConstraint Implements IReferentialConstraint, IConstraint
