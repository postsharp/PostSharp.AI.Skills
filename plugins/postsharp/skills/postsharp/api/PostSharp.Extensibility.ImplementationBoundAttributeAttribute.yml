  nameWithType: ImplementationBoundAttributeAttribute
  fullName: PostSharp.Extensibility.ImplementationBoundAttributeAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    Custom attribute meaning that custom attributes of a given type are

    bound to the implementation, not to the semantics.
  remarks: >-
    <p>This custom attribute influences whether instances of a given other
            custom attribute should be moved from the semantic to the implementation,
            when the semantic is detached from the implementation.
          </p>
    <p>The <xref href="PostSharp.Extensibility.ImplementationBoundAttributeAttribute" data-throw-if-not-resolved="false"></xref> is currently only honored 
            when you apply an interception aspect (<xref href="PostSharp.Aspects.LocationInterceptionAspect" data-throw-if-not-resolved="false"></xref>) to a field.
            In this case, PostSharp creates a property from the field. The property becomes the semantic
            and the field, made private, becomes the implementation. Most custom attributes apply to semantics,
            so they are moved from the field to the property. If a custom attribute must not be moved, it should be
            marked with the <xref href="PostSharp.Extensibility.ImplementationBoundAttributeAttribute" data-throw-if-not-resolved="false"></xref>
            custom attribute.
          </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly, AllowMultiple = true)]

      public sealed class ImplementationBoundAttributeAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Assembly, AllowMultiple:=True)>

      Public NotInheritable Class ImplementationBoundAttributeAttribute Inherits Attribute
