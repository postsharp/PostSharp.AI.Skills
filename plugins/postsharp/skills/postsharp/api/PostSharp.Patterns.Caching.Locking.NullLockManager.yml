  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching.Locking
  summary: An implementation of <xref href="PostSharp.Patterns.Caching.Locking.ILockManager" data-throw-if-not-resolved="false"></xref> which does not acquire any lock.
  remarks: >-
    <p>This is the default value of <xref href="PostSharp.Patterns.Caching.CachingProfile.LockManager" data-throw-if-not-resolved="false"></xref>. With this lock manager, several threads can evaluate the same cached method
        with the same arguments at the same time. To prevent this within the current process, use <xref href="PostSharp.Patterns.Caching.Locking.LocalLockManager" data-throw-if-not-resolved="false"></xref>.</p>
