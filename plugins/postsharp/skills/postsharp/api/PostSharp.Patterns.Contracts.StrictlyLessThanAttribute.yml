- uid: PostSharp.Patterns.Contracts.StrictlyLessThanAttribute.GetErrorMessageArguments
  commentId: M:PostSharp.Patterns.Contracts.StrictlyLessThanAttribute.GetErrorMessageArguments
  id: GetErrorMessageArguments
  parent: PostSharp.Patterns.Contracts.StrictlyLessThanAttribute
  langs:
  - csharp
  - vb
  name: GetErrorMessageArguments()
  nameWithType: StrictlyLessThanAttribute.GetErrorMessageArguments()
  fullName: PostSharp.Patterns.Contracts.StrictlyLessThanAttribute.GetErrorMessageArguments()
  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Contracts
  summary: >-
    Gets the values of the additional arguments for the error message associated with a particular instance of <xref href="PostSharp.Patterns.Contracts.LocationContractAttribute" data-throw-if-not-resolved="false"></xref>.

    These arguments can be referenced from the error message string by <code>{4}</code>, <code>{5}</code>, and so on.
  remarks: >-
    This method is expected to be pure, that is, its result can be cached. The implementer should not return information that may change

    after the constructor of the class has finished.
  example: []
  syntax:
    content: >-
      [Obsolete("Use ContractServices.ExceptionFactory.CreateException to generate error messages.")]

      protected override object[] GetErrorMessageArguments()
    return:
      type: System.Object[]
      description: An array of additional argument values.
    content.vb: >-
      <Obsolete("Use ContractServices.ExceptionFactory.CreateException to generate error messages.")>

      Protected Overrides Function GetErrorMessageArguments() As Object()
  overridden: PostSharp.Patterns.Contracts.RangeAttribute.GetErrorMessageArguments
  overload: PostSharp.Patterns.Contracts.StrictlyLessThanAttribute.GetErrorMessageArguments*
  attributes:
  - type: System.ObsoleteAttribute
    ctor: System.ObsoleteAttribute.#ctor(System.String)
    arguments:
    - type: System.String
      value: Use ContractServices.ExceptionFactory.CreateException to generate error messages.
