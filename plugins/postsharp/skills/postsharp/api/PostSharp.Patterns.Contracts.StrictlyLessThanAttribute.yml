  summary: Gets the unformatted error message as defined by the instance.
  remarks: >-
    <p>See remarks on <xref href="PostSharp.Patterns.Contracts.LocationContractAttribute" data-throw-if-not-resolved="false"></xref> for information about message parameters.</p>

    <p>The use of this method can be overridden by setting the <xref href="PostSharp.Patterns.Contracts.LocationContractAttribute.ErrorMessage" data-throw-if-not-resolved="false"></xref> property to a non-null value.</p>
  example: []
  syntax:
    content: >-
      [Obsolete("Use ContractExceptionFactory and ContractLocalizedTextProvider to generate error messages.")]

      protected override string GetErrorMessage()
    return:
