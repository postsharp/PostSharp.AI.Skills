  name: StrictlyLessThanAttribute
  nameWithType: StrictlyLessThanAttribute
  fullName: PostSharp.Patterns.Contracts.StrictlyLessThanAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Contracts
  summary: >-
    Custom attribute that, when added to a field, property or parameter, throws

    an <xref href="System.ArgumentOutOfRangeException" data-throw-if-not-resolved="false"></xref> if the target is assigned a value that

    is greater than or equal to a given value.
  remarks: >-
    <p>Null values are accepted and do not throw an exception.
        </p>
    <p>
            A floating-point or <xref href="System.Decimal" data-throw-if-not-resolved="false"></xref> value is accepted when it is less than or equal to the greatest
            value of its type that is less than the bound. A <xref href="System.Double" data-throw-if-not-resolved="false"></xref> bound is first converted to
            <xref href="System.Decimal" data-throw-if-not-resolved="false"></xref>, with 15 significant digits, to compute the <xref href="System.Decimal" data-throw-if-not-resolved="false"></xref> bound.
        </p>
    <p>The error message is identified by <xref href="PostSharp.Patterns.Contracts.ContractLocalizedTextProvider.StrictlyLessThanErrorMessage" data-throw-if-not-resolved="false"></xref>.</p>

    <p>The error message can use the additional argument <code>{4}</code> to refer to the maximum value used.</p>
  example: []
  syntax:
    content: 'public class StrictlyLessThanAttribute : RangeAttribute, ILocationLevelAspect, IValidableAnnotation, IAspect'
    content.vb: Public Class StrictlyLessThanAttribute Inherits RangeAttribute Implements ILocationLevelAspect, IValidableAnnotation, IAspect
