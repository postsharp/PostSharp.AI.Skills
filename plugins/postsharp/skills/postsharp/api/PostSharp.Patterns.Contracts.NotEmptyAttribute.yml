  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Contracts
  summary: >-
    Custom attribute that, when added to a field, property or parameter, throws

    an <xref href="System.ArgumentNullException" data-throw-if-not-resolved="false"></xref> if the target is assigned a null or empty value.

    The custom attribute can be added to locations of type <xref href="System.String" data-throw-if-not-resolved="false"></xref> (where empty

    means zero characters), or <xref href="System.Collections.ICollection" data-throw-if-not-resolved="false"></xref>, <xref href="System.Collections.Generic.ICollection%601" data-throw-if-not-resolved="false"></xref> or <xref href="System.Collections.Generic.IReadOnlyCollection%601" data-throw-if-not-resolved="false"></xref> (where empty means zero items).
  remarks: <p>The error message is identified by <xref href="PostSharp.Patterns.Contracts.ContractLocalizedTextProvider.NotEmptyErrorMessage" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: 'public sealed class NotEmptyAttribute : LocationContractAttribute, ILocationLevelAspect, IAspect'
    content.vb: Public NotInheritable Class NotEmptyAttribute Inherits LocationContractAttribute Implements ILocationLevelAspect, IAspect
