- uid: PostSharp.Patterns.Contracts.NotEmptyAttribute.GetErrorMessage
  commentId: M:PostSharp.Patterns.Contracts.NotEmptyAttribute.GetErrorMessage
  id: GetErrorMessage
  parent: PostSharp.Patterns.Contracts.NotEmptyAttribute
  langs:
  - csharp
  - vb
  name: GetErrorMessage()
  nameWithType: NotEmptyAttribute.GetErrorMessage()
  fullName: PostSharp.Patterns.Contracts.NotEmptyAttribute.GetErrorMessage()
  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Contracts
  summary: Gets the unformatted error message as defined by the instance.
  remarks: >-
    <p>See remarks on <xref href="PostSharp.Patterns.Contracts.LocationContractAttribute" data-throw-if-not-resolved="false"></xref> for information about message parameters.</p>

    <p>The use of this method can be overridden by setting the <xref href="PostSharp.Patterns.Contracts.LocationContractAttribute.ErrorMessage" data-throw-if-not-resolved="false"></xref> property to a non-null value.</p>
  example: []
  syntax:
    content: >-
      [Obsolete("Use ContractExceptionFactory and ContractLocalizedTextProvider to generate error messages.")]

      protected override string GetErrorMessage()
    return:
      type: System.String
      description: The unformatted error message.
    content.vb: >-
      <Obsolete("Use ContractExceptionFactory and ContractLocalizedTextProvider to generate error messages.")>

      Protected Overrides Function GetErrorMessage() As String
  overridden: PostSharp.Patterns.Contracts.LocationContractAttribute.GetErrorMessage
  overload: PostSharp.Patterns.Contracts.NotEmptyAttribute.GetErrorMessage*
  attributes:
  - type: System.ObsoleteAttribute
    ctor: System.ObsoleteAttribute.#ctor(System.String)
    arguments:
    - type: System.String
      value: Use ContractExceptionFactory and ContractLocalizedTextProvider to generate error messages.
