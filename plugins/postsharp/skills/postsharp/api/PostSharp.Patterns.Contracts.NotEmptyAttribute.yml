  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Contracts
  summary: Validates a weakly-typed (boxed) value, typically the value of a dependency property or an attached property.
  example: []
  syntax:
    content: public override Exception ValidateValueDynamic(object value, string locationName, LocationKind locationKind, LocationValidationContext context)
    parameters:
    - id: value
      type: System.Object
      description: The value to be validated.
    - id: locationName
      type: System.String
      description: The name of the property.
    - id: locationKind
      type: PostSharp.Reflection.LocationKind
      description: The kind of location (typically a <xref href="PostSharp.Reflection.LocationKind.Property" data-throw-if-not-resolved="false"></xref>).
    - id: context
      type: PostSharp.Aspects.LocationValidationContext
      description: Why or when the value is being validated.
    return:
      type: System.Exception
      description: An <xref href="System.Exception" data-throw-if-not-resolved="false"></xref> if the value is invalid, or <code>null</code> if the value is valid.
