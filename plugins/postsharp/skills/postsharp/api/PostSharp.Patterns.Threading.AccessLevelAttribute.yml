  - PostSharp.Patterns.Threading
  namespace: PostSharp.Patterns.Threading
  summary: >-
    Base class for <xref href="PostSharp.Patterns.Threading.ReaderAttribute" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Patterns.Threading.WriterAttribute" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Patterns.Threading.YielderAttribute" data-throw-if-not-resolved="false"></xref>, and

    <xref href="PostSharp.Patterns.Threading.UpgradeableReaderAttribute" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>These attributes specify the access level that an instance method of a class annotated with <xref href="PostSharp.Patterns.Threading.ReaderWriterSynchronizedAttribute" data-throw-if-not-resolved="false"></xref>
        requires on the object. A warning is emitted at build time when one of these attributes is applied to a method of a class that has no threading model.</p>
