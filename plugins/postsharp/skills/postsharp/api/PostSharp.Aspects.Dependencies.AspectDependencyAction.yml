- uid: PostSharp.Aspects.Dependencies.AspectDependencyAction.Commute
  commentId: F:PostSharp.Aspects.Dependencies.AspectDependencyAction.Commute
  id: Commute
  parent: PostSharp.Aspects.Dependencies.AspectDependencyAction
  langs:
  - csharp
  - vb
  name: Commute
  nameWithType: AspectDependencyAction.Commute
  fullName: PostSharp.Aspects.Dependencies.AspectDependencyAction.Commute
  type: Field
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Dependencies
  summary: >-
    The dependency specifies that the current aspect or advice

    commutes with another aspect or advice.
  remarks: >-
    The weaver emits a warning when aspects or advices that do not commute are not strongly ordered, because their

    order of execution is then nondeterministic. Declaring that they commute suppresses this warning.
  example: []
  syntax:
    content: Commute = 4
    return:
      type: PostSharp.Aspects.Dependencies.AspectDependencyAction
