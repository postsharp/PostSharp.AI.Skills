items:
- uid: PostSharp.Aspects.Dependencies.AspectDependencyAction
  commentId: T:PostSharp.Aspects.Dependencies.AspectDependencyAction
  id: AspectDependencyAction
  parent: PostSharp.Aspects.Dependencies
  children:
  - PostSharp.Aspects.Dependencies.AspectDependencyAction.Commute
  - PostSharp.Aspects.Dependencies.AspectDependencyAction.Conflict
  - PostSharp.Aspects.Dependencies.AspectDependencyAction.None
  - PostSharp.Aspects.Dependencies.AspectDependencyAction.Order
  - PostSharp.Aspects.Dependencies.AspectDependencyAction.Require
  langs:
  - csharp
  - vb
  name: AspectDependencyAction
  nameWithType: AspectDependencyAction
  fullName: PostSharp.Aspects.Dependencies.AspectDependencyAction
  type: Enum
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Dependencies
  summary: Specifies the kinds of relationships that aspect dependencies can express.
  remarks: >-
    <p>The combined values of <xref href="PostSharp.Aspects.Dependencies.AspectDependencyAction" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.Dependencies.AspectDependencyPosition" data-throw-if-not-resolved="false"></xref> are interpreted
            as follows:</p>
    <table>
      <tr>
        <th>Action</th>
        <th>Position</th>
        <th>Description</th>
      </tr>
      <tr>
        <td>
          <xref href="PostSharp.Aspects.Dependencies.AspectDependencyAction.Order" data-throw-if-not-resolved="false"></xref>
        </td>
        <td>
          <xref href="PostSharp.Aspects.Dependencies.AspectDependencyPosition.After" data-throw-if-not-resolved="false"></xref>
        </td>
        <td>The current aspect or advice should be positioned <i>after</i> the other aspect or advice
                matched by the custom attribute.</td>
      </tr>
      <tr>
        <td>
          <xref href="PostSharp.Aspects.Dependencies.AspectDependencyAction.Order" data-throw-if-not-resolved="false"></xref>
        </td>
        <td>
          <xref href="PostSharp.Aspects.Dependencies.AspectDependencyPosition.Before" data-throw-if-not-resolved="false"></xref>
        </td>
        <td>The current aspect or advice should be positioned <i>before</i> the other aspect or advice
                matched by the custom attribute.</td>
      </tr>
      <tr>
        <td>
          <xref href="PostSharp.Aspects.Dependencies.AspectDependencyAction.Require" data-throw-if-not-resolved="false"></xref>
        </td>
        <td>
          <xref href="PostSharp.Aspects.Dependencies.AspectDependencyPosition.Any" data-throw-if-not-resolved="false"></xref>
        </td>
        <td>The current aspect or advice requires another aspect or advice
                matched by the custom attribute, at any position.</td>
      </tr>
      <tr>
        <td>
          <xref href="PostSharp.Aspects.Dependencies.AspectDependencyAction.Require" data-throw-if-not-resolved="false"></xref>
        </td>
        <td>
          <xref href="PostSharp.Aspects.Dependencies.AspectDependencyPosition.After" data-throw-if-not-resolved="false"></xref>
        </td>
        <td>The current aspect or advice requires another aspect or advice
                matched by the custom attribute positioned <i>after</i> the current one.</td>
      </tr>
      <tr>
        <td>
          <xref href="PostSharp.Aspects.Dependencies.AspectDependencyAction.Require" data-throw-if-not-resolved="false"></xref>
        </td>
        <td>
          <xref href="PostSharp.Aspects.Dependencies.AspectDependencyPosition.Before" data-throw-if-not-resolved="false"></xref>
        </td>
        <td>The current aspect or advice requires another aspect or advice
                matched by the custom attribute positioned <i>before</i> the current one.</td>
      </tr>
      <tr>
        <td>
          <xref href="PostSharp.Aspects.Dependencies.AspectDependencyAction.Conflict" data-throw-if-not-resolved="false"></xref>
        </td>
        <td>
          <xref href="PostSharp.Aspects.Dependencies.AspectDependencyPosition.Any" data-throw-if-not-resolved="false"></xref>
        </td>
        <td>The current aspect or advice conflicts with any aspect or advice
                matched by the custom attribute, at any position.</td>
      </tr>
      <tr>
        <td>
          <xref href="PostSharp.Aspects.Dependencies.AspectDependencyAction.Conflict" data-throw-if-not-resolved="false"></xref>
        </td>
        <td>
          <xref href="PostSharp.Aspects.Dependencies.AspectDependencyPosition.After" data-throw-if-not-resolved="false"></xref>
        </td>
        <td>The current aspect or advice conflicts with any aspect or advice
                matched by the custom attribute, if positioned <i>after</i> the current one.</td>
      </tr>
      <tr>
        <td>
          <xref href="PostSharp.Aspects.Dependencies.AspectDependencyAction.Conflict" data-throw-if-not-resolved="false"></xref>
        </td>
        <td>
          <xref href="PostSharp.Aspects.Dependencies.AspectDependencyPosition.Before" data-throw-if-not-resolved="false"></xref>
        </td>
        <td>The current aspect or advice conflicts with any aspect or advice
                matched by the custom attribute, if positioned <i>before</i> the current one.</td>
      </tr>
      <tr>
        <td>
          <xref href="PostSharp.Aspects.Dependencies.AspectDependencyAction.Commute" data-throw-if-not-resolved="false"></xref>
        </td>
        <td></td>
        <td>The current aspect or advice commutes with any other aspect or advice
                matched by the custom attribute.
              </td>
      </tr>
    </table>

    <p>An unsatisfied <xref href="PostSharp.Aspects.Dependencies.AspectDependencyAction.Require" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Aspects.Dependencies.AspectDependencyAction.Conflict" data-throw-if-not-resolved="false"></xref> dependency causes a build error, or a warning
            if <xref href="PostSharp.Aspects.Dependencies.AspectDependencyAttribute.IsWarning" data-throw-if-not-resolved="false"></xref> is set.</p>
  example: []
  syntax:
    content: public enum AspectDependencyAction
    content.vb: Public Enum AspectDependencyAction
  seealso:
  - linkType: HRef
    linkId: '@aspect-dependencies'
    altText: 'Conceptual: Coping with Several Aspects on the Same Target'
