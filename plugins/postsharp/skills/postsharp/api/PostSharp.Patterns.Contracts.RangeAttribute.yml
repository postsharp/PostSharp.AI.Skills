- uid: PostSharp.Patterns.Contracts.RangeAttribute.GetErrorMessage
  commentId: M:PostSharp.Patterns.Contracts.RangeAttribute.GetErrorMessage
  id: GetErrorMessage
  parent: PostSharp.Patterns.Contracts.RangeAttribute
  langs:
  - csharp
  - vb
  name: GetErrorMessage()
  nameWithType: RangeAttribute.GetErrorMessage()
  fullName: PostSharp.Patterns.Contracts.RangeAttribute.GetErrorMessage()
  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Contracts
  summary: Gets the unformatted error message as defined by the instance.
  remarks: >-
    <p>See remarks on <xref href="PostSharp.Patterns.Contracts.LocationContractAttribute" data-throw-if-not-resolved="false"></xref> for information about message parameters.</p>

    <p>The use of this method can be overridden by setting the <xref href="PostSharp.Patterns.Contracts.LocationContractAttribute.ErrorMessage" data-throw-if-not-resolved="false"></xref> property to a non-null value.</p>
  example: []
  syntax:
    content: >-
      [Obsolete("Use ContractExceptionFactory and ContractLocalizedTextProvider to generate error messages.")]

      protected override string GetErrorMessage()
    return:
      type: System.String
      description: The unformatted error message.
    content.vb: >-
      <Obsolete("Use ContractExceptionFactory and ContractLocalizedTextProvider to generate error messages.")>

      Protected Overrides Function GetErrorMessage() As String
  overridden: PostSharp.Patterns.Contracts.LocationContractAttribute.GetErrorMessage
  overload: PostSharp.Patterns.Contracts.RangeAttribute.GetErrorMessage*
  attributes:
  - type: System.ObsoleteAttribute
    ctor: System.ObsoleteAttribute.#ctor(System.String)
    arguments:
    - type: System.String
      value: Use ContractExceptionFactory and ContractLocalizedTextProvider to generate error messages.
- uid: PostSharp.Patterns.Contracts.RangeAttribute.GetErrorMessageArguments
  commentId: M:PostSharp.Patterns.Contracts.RangeAttribute.GetErrorMessageArguments
  id: GetErrorMessageArguments
  parent: PostSharp.Patterns.Contracts.RangeAttribute
  langs:
  - csharp
  - vb
  name: GetErrorMessageArguments()
  nameWithType: RangeAttribute.GetErrorMessageArguments()
  fullName: PostSharp.Patterns.Contracts.RangeAttribute.GetErrorMessageArguments()
  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Contracts
  summary: >-
    Gets the values of the additional arguments for the error message associated with a particular instance of <xref href="PostSharp.Patterns.Contracts.LocationContractAttribute" data-throw-if-not-resolved="false"></xref>.

    These arguments can be referenced from the error message string by <code>{4}</code>, <code>{5}</code>, and so on.
  remarks: >-
    This method is expected to be pure, that is, its result can be cached. The implementer should not return information that may change

    after the constructor of the class has finished.
  example: []
  syntax:
    content: >-
      [Obsolete("Use ContractServices.ExceptionFactory.CreateException to generate error messages.")]

      protected override object[] GetErrorMessageArguments()
    return:
      type: System.Object[]
      description: An array of additional argument values.
    content.vb: >-
      <Obsolete("Use ContractServices.ExceptionFactory.CreateException to generate error messages.")>

      Protected Overrides Function GetErrorMessageArguments() As Object()
  overridden: PostSharp.Patterns.Contracts.LocationContractAttribute.GetErrorMessageArguments
  overload: PostSharp.Patterns.Contracts.RangeAttribute.GetErrorMessageArguments*
  attributes:
  - type: System.ObsoleteAttribute
    ctor: System.ObsoleteAttribute.#ctor(System.String)
    arguments:
    - type: System.String
      value: Use ContractServices.ExceptionFactory.CreateException to generate error messages.
