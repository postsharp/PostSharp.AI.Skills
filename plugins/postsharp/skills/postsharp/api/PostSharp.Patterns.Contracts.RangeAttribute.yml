- uid: PostSharp.Patterns.Contracts.RangeAttribute.CompileTimeValidate(System.Object)
  commentId: M:PostSharp.Patterns.Contracts.RangeAttribute.CompileTimeValidate(System.Object)
  id: CompileTimeValidate(System.Object)
  parent: PostSharp.Patterns.Contracts.RangeAttribute
  langs:
  - csharp
  - vb
  name: CompileTimeValidate(object)
  nameWithType: RangeAttribute.CompileTimeValidate(object)
  fullName: PostSharp.Patterns.Contracts.RangeAttribute.CompileTimeValidate(object)
  type: Method
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Contracts
  summary: >-
    Method invoked at build time to ensure that the aspect has been applied to

    the right target.
  remarks: >-
    The implementation of this method is expected to emit an error message

    or an exception of type <xref href="PostSharp.Extensibility.InvalidAnnotationException" data-throw-if-not-resolved="false"></xref> in case of error. Only returning <code>false</code> causes the aspect

    to be silently ignored.
  example: []
  syntax:
    content: public bool CompileTimeValidate(object target)
    parameters:
    - id: target
      type: System.Object
      description: The target element.
    return:
      type: System.Boolean
      description: >-
        <code>true</code> if the aspect was applied to an acceptable target, otherwise
              <code>false</code>.
    content.vb: Public Function CompileTimeValidate(target As Object) As Boolean
  overload: PostSharp.Patterns.Contracts.RangeAttribute.CompileTimeValidate*
