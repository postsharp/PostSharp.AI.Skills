  fullName: PostSharp.Patterns.Contracts.RangeAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Contracts
  summary: >-
    Custom attribute that, when added to a field, property or parameter, throws

    an <xref href="System.ArgumentOutOfRangeException" data-throw-if-not-resolved="false"></xref> if the target is assigned a value that

    is outside a given range.
  remarks: >-
    <p>Null values are accepted and do not throw an exception.
        </p>
    <p>The error message is identified by <xref href="PostSharp.Patterns.Contracts.ContractLocalizedTextProvider.RangeErrorMessage" data-throw-if-not-resolved="false"></xref>.</p>

    <p>The error message can use the additional argument <code>{4}</code> to refer to the minimum value used and <code>{5}</code> to refer to the maximum value used.</p>
  example: []
  syntax:
    content: 'public class RangeAttribute : LocationContractAttribute, ILocationLevelAspect, IValidableAnnotation, IAspect'
    content.vb: Public Class RangeAttribute Inherits LocationContractAttribute Implements ILocationLevelAspect, IValidableAnnotation, IAspect
