  name: AsyncCallIdAttribute
  nameWithType: AsyncCallIdAttribute
  fullName: PostSharp.Aspects.Advices.AsyncCallIdAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Binds a parameter of a method boundary advice to the <xref href="PostSharp.Aspects.AsyncCallId" data-throw-if-not-resolved="false"></xref> that identifies the current execution of an async method.
  remarks: >-
    <p>
        All the advices of one execution of the async method receive the same value, so the identifier can correlate the events of this execution,
        for instance in a log. The parameter must be of type <xref href="PostSharp.Aspects.AsyncCallId" data-throw-if-not-resolved="false"></xref>, and it cannot be <code>ref</code>, <code>in</code> or <code>out</code>.
        </p>
    <p>
        This attribute can be used in the method boundary advices. When the target method is not transformed as an async method, for instance
        when it is an iterator, the parameter receives the default value of <xref href="PostSharp.Aspects.AsyncCallId" data-throw-if-not-resolved="false"></xref>, unless <xref href="PostSharp.Aspects.Advices.AsyncCallIdAttribute.IsRequired" data-throw-if-not-resolved="false"></xref> is <code>true</code>.
        </p>
  example: []
