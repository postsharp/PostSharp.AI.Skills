- uid: PostSharp.Aspects.Advices.AsyncCallIdAttribute.IsRequired
  commentId: P:PostSharp.Aspects.Advices.AsyncCallIdAttribute.IsRequired
  id: IsRequired
  parent: PostSharp.Aspects.Advices.AsyncCallIdAttribute
  langs:
  - csharp
  - vb
  name: IsRequired
  nameWithType: AsyncCallIdAttribute.IsRequired
  fullName: PostSharp.Aspects.Advices.AsyncCallIdAttribute.IsRequired
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Gets or sets a value indicating whether the target must be an async method. When this property is <code>true</code>, the compiler reports an

    error when the target method is not transformed as an async method. When it is <code>false</code>, the parameter receives the default value of

    <xref href="PostSharp.Aspects.AsyncCallId" data-throw-if-not-resolved="false"></xref>. The default value is <code>false</code>.
  remarks: >-
    When the advice is selected by <xref href="PostSharp.Aspects.Advices.MatchPointcut" data-throw-if-not-resolved="false"></xref>, a target method that is neither async nor returns an awaitable type is

    skipped, and no error is reported.
  example: []
  syntax:
    content: public bool IsRequired { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property IsRequired As Boolean
  overload: PostSharp.Aspects.Advices.AsyncCallIdAttribute.IsRequired*
