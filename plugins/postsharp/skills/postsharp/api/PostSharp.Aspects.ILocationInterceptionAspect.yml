- uid: PostSharp.Aspects.ILocationInterceptionAspect.OnSetValue(PostSharp.Aspects.LocationInterceptionArgs)
  commentId: M:PostSharp.Aspects.ILocationInterceptionAspect.OnSetValue(PostSharp.Aspects.LocationInterceptionArgs)
  id: OnSetValue(PostSharp.Aspects.LocationInterceptionArgs)
  parent: PostSharp.Aspects.ILocationInterceptionAspect
  langs:
  - csharp
  - vb
  name: OnSetValue(LocationInterceptionArgs)
  nameWithType: ILocationInterceptionAspect.OnSetValue(LocationInterceptionArgs)
  fullName: PostSharp.Aspects.ILocationInterceptionAspect.OnSetValue(PostSharp.Aspects.LocationInterceptionArgs)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Method invoked instead of the <code>Set</code> semantic of the field or property to which the current aspect is applied,
      that is, when the value of this field or property is changed.
  remarks: >-
    <p>
        This method is invoked instead of the setter of the property to which the current aspect is applied. If it is applied to a field, that field
        is transformed into a property. This method intercepts all writes to static properties, but it does not intercept inline initializers of instance
        properties; use <xref href="PostSharp.Aspects.IOnInstanceLocationInitializedAspect.OnInstanceLocationInitialized(PostSharp.Aspects.LocationInitializationArgs)" data-throw-if-not-resolved="false"></xref> for that.
        </p>
    <p>
        If you apply this advice to a getter-only auto-implemented property, PostSharp will create a setter that will be called in these cases:
        </p>
    <ul><li>for static properties, instead of the property inline initialization or property assignment from the static constructor;</li><li>for instance properties, only instead of the property assignment from the constructor but not for the inline initialization.
            To intercept the inline initialization of an instance property,
        use the <xref href="PostSharp.Aspects.IOnInstanceLocationInitializedAspect.OnInstanceLocationInitialized(PostSharp.Aspects.LocationInitializationArgs)" data-throw-if-not-resolved="false"></xref> advice.</li></ul>
  example: []
  syntax:
    content: >-
      [HasInheritedAttribute]

      void OnSetValue(LocationInterceptionArgs args)
    parameters:
    - id: args
      type: PostSharp.Aspects.LocationInterceptionArgs
      description: Advice arguments.
    content.vb: >-
      <HasInheritedAttribute>

      Sub OnSetValue(args As LocationInterceptionArgs)
  overload: PostSharp.Aspects.ILocationInterceptionAspect.OnSetValue*
  seealso:
  - linkId: PostSharp.Aspects.LocationInterceptionArgs
    commentId: T:PostSharp.Aspects.LocationInterceptionArgs
