  name: TextLoggingBackendOptions
  nameWithType: TextLoggingBackendOptions
  fullName: PostSharp.Patterns.Diagnostics.Backends.TextLoggingBackendOptions
  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Backends
  summary: Options for the <xref href="PostSharp.Patterns.Diagnostics.Backends.TextLoggingBackend" data-throw-if-not-resolved="false"></xref> class.
  remarks: >-
    <p>These run-time options control the formatting of text records, for example their maximum length, the delimiter, the indentation,
        and the inclusion of type names and exception details. Set them through the <xref href="PostSharp.Patterns.Diagnostics.Backends.TextLoggingBackend.Options" data-throw-if-not-resolved="false"></xref> property of the backend when the application starts.
        Unlike the build-time options of <xref href="PostSharp.Patterns.Diagnostics.LoggingProfile" data-throw-if-not-resolved="false"></xref>, they apply to all logging profiles that use the backend.</p>
  example: []
  syntax:
    content: 'public class TextLoggingBackendOptions : LoggingBackendOptions'
    content.vb: Public Class TextLoggingBackendOptions Inherits LoggingBackendOptions
  seealso:
  - linkType: HRef
    linkId: '@logging-customizing'
    altText: 'Conceptual: Formatting Log Records'
