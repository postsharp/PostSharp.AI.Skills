  type: Property
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.Backends
  summary: Gets or sets the maximum length of a log record. The default value is 2048.
  remarks: >-
    <p>This property determines the size of the buffer allocated to build the record.
        If the real length exceeds the value of <xref href="PostSharp.Patterns.Diagnostics.Backends.TextLoggingBackendOptions.ActionMaxLength" data-throw-if-not-resolved="false"></xref>, no exception is thrown, and the excess content is ignored.</p>
  example: []
  syntax:
    content: public int ActionMaxLength { get; set; }
    parameters: []
    return:
      type: System.Int32
    content.vb: Public Property ActionMaxLength As Integer
  overload: PostSharp.Patterns.Diagnostics.Backends.TextLoggingBackendOptions.ActionMaxLength*
