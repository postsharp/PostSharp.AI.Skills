  name: FieldRule
  nameWithType: FieldRule
  fullName: PostSharp.Patterns.Model.TypeAdapters.FieldRule
  type: Class
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model.TypeAdapters
  summary: >-
    Exposes the <xref href="PostSharp.Patterns.Model.TypeAdapters.FieldRule.GetRelationshipInfo(System.Reflection.FieldInfo)" data-throw-if-not-resolved="false"></xref> method, which makes it possible to mark a field as <xref href="PostSharp.Patterns.Model.RelationshipKind.Child" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Model.RelationshipKind.Reference" data-throw-if-not-resolved="false"></xref>

    programmatically, without a custom attribute.
  remarks: >-
    <p>Field rules must be registered using the <xref href="PostSharp.Patterns.Model.TypeAdapters.RegisterFieldRuleAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.</p>

    <p>Use a field rule when fields cannot be annotated, for example fields generated by a designer, or when annotating many fields one by one
        is not practical. At build time, the <xref href="PostSharp.Patterns.Model.AggregatableAttribute" data-throw-if-not-resolved="false"></xref> aspect calls <xref href="PostSharp.Patterns.Model.TypeAdapters.FieldRule.GetRelationshipInfo(System.Reflection.FieldInfo)" data-throw-if-not-resolved="false"></xref> for each field
        that has no <xref href="PostSharp.Patterns.Model.ChildAttribute" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Patterns.Model.ReferenceAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Model.ParentAttribute" data-throw-if-not-resolved="false"></xref> custom attribute and whose type requires one.
        The first rule that returns a non-null value determines the relationship. PostSharp has built-in rules, evaluated before the registered ones,
        that mark as references the fields generated for Windows Forms controls and XAML elements.</p>
