        ctor: System.Diagnostics.CodeAnalysis.DynamicallyAccessedMembersAttribute.#ctor(System.Diagnostics.CodeAnalysis.DynamicallyAccessedMemberTypes)
        arguments:
        - type: System.Diagnostics.CodeAnalysis.DynamicallyAccessedMemberTypes
          value: 1
