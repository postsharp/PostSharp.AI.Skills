  nameWithType: SerializerAttribute
  fullName: PostSharp.Serialization.SerializerAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Serialization
  summary: Custom attribute that, when applied to a type, specifies its serializer for use by the <xref href="PostSharp.Serialization.PortableFormatter" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>The use of the <xref href="PostSharp.Serialization.SerializerAttribute" data-throw-if-not-resolved="false"></xref> is optional if the serializer of a type is a nested class of that class named <code>Serializer</code>.</p>

    <p>Windows Phone 7.0 does not allow assigning generic types to parameters of custom attributes.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class|AttributeTargets.Struct)]

      public sealed class SerializerAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.ClassOrAttributeTargets.Struct)>

      Public NotInheritable Class SerializerAttribute Inherits Attribute
