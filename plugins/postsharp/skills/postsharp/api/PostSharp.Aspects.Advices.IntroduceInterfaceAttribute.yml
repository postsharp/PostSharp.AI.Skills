  name: IntroduceInterfaceAttribute
  nameWithType: IntroduceInterfaceAttribute
  fullName: PostSharp.Aspects.Advices.IntroduceInterfaceAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Custom attribute that, when applied to an aspect class, specifies that the aspect should

    introduce a given interface into the type to which the aspect is applied.
  remarks: >-
    <p>The introduced interface will be implemented explicitly by the type to which the aspect is applied.</p>

    <p>The aspect class must itself implement the interface: the target type delegates the implementation to the aspect instance,
        so the aspect is typically derived from <xref href="PostSharp.Aspects.InstanceLevelAspect" data-throw-if-not-resolved="false"></xref>. Because the interface is added after compilation,
        the C# compiler does not know that the target type implements it; in the same project, use <xref href="PostSharp.Post.Cast%60%602(%60%600)" data-throw-if-not-resolved="false"></xref>
        to convert an instance of the target type to the interface with a build-time check.</p>
    <p>To introduce individual methods, properties or events instead of a whole interface, use <xref href="PostSharp.Aspects.Advices.IntroduceMemberAttribute" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class, AllowMultiple = true, Inherited = true)]

      public sealed class IntroduceInterfaceAttribute : Advice
    content.vb: >-
      <AttributeUsage(AttributeTargets.Class, AllowMultiple:=True, Inherited:=True)>

      Public NotInheritable Class IntroduceInterfaceAttribute Inherits Advice
