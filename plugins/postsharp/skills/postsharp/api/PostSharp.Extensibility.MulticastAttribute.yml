- uid: PostSharp.Extensibility.MulticastAttribute.AttributeTargetMemberAttributes
  commentId: P:PostSharp.Extensibility.MulticastAttribute.AttributeTargetMemberAttributes
  id: AttributeTargetMemberAttributes
  parent: PostSharp.Extensibility.MulticastAttribute
  langs:
  - csharp
  - vb
  name: AttributeTargetMemberAttributes
  nameWithType: MulticastAttribute.AttributeTargetMemberAttributes
  fullName: PostSharp.Extensibility.MulticastAttribute.AttributeTargetMemberAttributes
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    Gets or sets the visibilities, scopes, virtualities, and other characteristics 
     of members to which this attribute applies.
  remarks: >-
    <p>Ignored if the <xref href="PostSharp.Extensibility.MulticastAttribute.AttributeTargetElements" data-throw-if-not-resolved="false"></xref> are only the module, the assembly,
        and/or types.
        </p>
    <p>
        The <xref href="PostSharp.Extensibility.MulticastAttributes" data-throw-if-not-resolved="false"></xref> enumeration is a multi-part flag: there is one
        part for visibility, one for scope, one for virtuality, and so on.
        If you specify one part, it will override the values defined on the custom attribute definition.
        If you do not specify it, the values defined on the custom attribute definition will be inherited.
        Note that custom attributes may apply restrictions on these attributes. For example, 
        a custom attribute may not be valid on abstract methods. You are not allowed
        to enlarge the set of possible targets.
        </p>
  example: []
  syntax:
    content: public MulticastAttributes AttributeTargetMemberAttributes { get; set; }
    parameters: []
    return:
      type: PostSharp.Extensibility.MulticastAttributes
    content.vb: Public Property AttributeTargetMemberAttributes As MulticastAttributes
  overload: PostSharp.Extensibility.MulticastAttribute.AttributeTargetMemberAttributes*
