- uid: PostSharp.Extensibility.MulticastAttribute.AttributeExclude
  commentId: P:PostSharp.Extensibility.MulticastAttribute.AttributeExclude
  id: AttributeExclude
  parent: PostSharp.Extensibility.MulticastAttribute
  langs:
  - csharp
  - vb
  name: AttributeExclude
  nameWithType: MulticastAttribute.AttributeExclude
  fullName: PostSharp.Extensibility.MulticastAttribute.AttributeExclude
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    Gets or sets a value indicating whether this attribute removes all other instances of the

    same attribute type from the set of elements defined by the current instance.
  remarks: >-
    <p>Only the instances processed before the current one are removed: instances applied on a container, such as the assembly or
        the declaring type, and instances applied on the same element with a lower <xref href="PostSharp.Extensibility.MulticastAttribute.AttributePriority" data-throw-if-not-resolved="false"></xref>.
        A typical use is to exclude an element from the set matched by a wildcard expression.</p>
  example: []
  syntax:
    content: public bool AttributeExclude { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property AttributeExclude As Boolean
  overload: PostSharp.Extensibility.MulticastAttribute.AttributeExclude*
  seealso:
  - linkType: HRef
    linkId: '@multicast-override'
    altText: 'Conceptual: Overriding and Removing Aspect Instances'
- uid: PostSharp.Extensibility.MulticastAttribute.AttributePriority
  commentId: P:PostSharp.Extensibility.MulticastAttribute.AttributePriority
  id: AttributePriority
  parent: PostSharp.Extensibility.MulticastAttribute
  langs:
  - csharp
  - vb
  name: AttributePriority
  nameWithType: MulticastAttribute.AttributePriority
  fullName: PostSharp.Extensibility.MulticastAttribute.AttributePriority
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    Gets or sets the priority of the current attribute when multiple 

    instances are defined on the same element (lower values are processed first).
  remarks: >-
    You should use only 16-bit values in user code. The top 16 bits are reserved for the system.


    When the multicast attribute is applied via an XML configuration file, the default value

    is set to the 1-based ordinal of the appearance of the attribute in the XML configuration file.

    When the multicast attribute is applied in the source code, the default value is 0.


    Instances applied on a container, such as the assembly or a type, are always processed before instances applied on an element

    of that container; this property orders instances of the same attribute type applied at the same level.

    The C# compiler does not guarantee the order of custom attributes, so set this property when the order matters, for example

    when you combine <xref href="PostSharp.Extensibility.MulticastAttribute.AttributeExclude" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Extensibility.MulticastAttribute.AttributeReplace" data-throw-if-not-resolved="false"></xref> with other instances.
  example: []
  syntax:
    content: public int AttributePriority { get; set; }
    parameters: []
    return:
      type: System.Int32
    content.vb: Public Property AttributePriority As Integer
  overload: PostSharp.Extensibility.MulticastAttribute.AttributePriority*
  seealso:
  - linkType: HRef
    linkId: '@multicast-override'
    altText: 'Conceptual: Overriding and Removing Aspect Instances'
- uid: PostSharp.Extensibility.MulticastAttribute.AttributeReplace
  commentId: P:PostSharp.Extensibility.MulticastAttribute.AttributeReplace
  id: AttributeReplace
  parent: PostSharp.Extensibility.MulticastAttribute
  langs:
  - csharp
  - vb
  name: AttributeReplace
  nameWithType: MulticastAttribute.AttributeReplace
  fullName: PostSharp.Extensibility.MulticastAttribute.AttributeReplace
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    Gets or sets a value indicating whether this attribute replaces other attributes found on the

    target declarations.
  remarks: >-
    <p>Replacing is equivalent to excluding the previous instances of the same attribute type with <xref href="PostSharp.Extensibility.MulticastAttribute.AttributeExclude" data-throw-if-not-resolved="false"></xref>,
        then adding the current one. To make every new instance replace the previous ones, the aspect developer can instead set
        <xref href="PostSharp.Extensibility.MulticastAttributeUsageAttribute.AllowMultiple" data-throw-if-not-resolved="false"></xref> to <code>false</code>. In this case, two instances applied directly to the
        same element still cause the error <code>PS0065</code>.</p>
  example: []
  syntax:
