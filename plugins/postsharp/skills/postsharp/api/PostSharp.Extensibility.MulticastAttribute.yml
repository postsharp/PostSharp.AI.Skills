- uid: PostSharp.Extensibility.MulticastAttribute.AttributeTargetAssemblies
  commentId: P:PostSharp.Extensibility.MulticastAttribute.AttributeTargetAssemblies
  id: AttributeTargetAssemblies
  parent: PostSharp.Extensibility.MulticastAttribute
  langs:
  - csharp
  - vb
  name: AttributeTargetAssemblies
  nameWithType: MulticastAttribute.AttributeTargetAssemblies
  fullName: PostSharp.Extensibility.MulticastAttribute.AttributeTargetAssemblies
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: Gets or sets the assemblies to which the current attribute applies.
  remarks: >-
    When this property is not specified or is <code>null</code>, the current

    attribute is multicasted only in the current assembly. Otherwise, it

    is multicasted also to external assemblies, that is, to declarations that

    are referenced by the current assembly.
  example: []
  syntax:
    content: public string AttributeTargetAssemblies { get; set; }
    parameters: []
    return:
      type: System.String
      description: >-
        A wildcard or regular expression specifying to which assemblies

        this instance applies, or <code>null</code> if this instance applies

        only to elements of the current assembly. Regular expressions should

        start with the <code>regex:</code> prefix.
    content.vb: Public Property AttributeTargetAssemblies As String
  overload: PostSharp.Extensibility.MulticastAttribute.AttributeTargetAssemblies*
- uid: PostSharp.Extensibility.MulticastAttribute.AttributeTargetTypes
  commentId: P:PostSharp.Extensibility.MulticastAttribute.AttributeTargetTypes
  id: AttributeTargetTypes
  parent: PostSharp.Extensibility.MulticastAttribute
  langs:
  - csharp
  - vb
  name: AttributeTargetTypes
  nameWithType: MulticastAttribute.AttributeTargetTypes
  fullName: PostSharp.Extensibility.MulticastAttribute.AttributeTargetTypes
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    Gets or sets the expression specifying to which types

    this instance applies.
  remarks: >-
    <p>Ignored if the <xref href="PostSharp.Extensibility.MulticastAttribute.AttributeTargetElements" data-throw-if-not-resolved="false"></xref> are only the module and/or the assembly.
        </p>
    <p>Unless you use a wildcard or a regex, you must specify the fully qualified name of the type.</p>

    <p>Nested types are delimited by a plus sign (<code>+</code>) in place of a dot (<code>.</code>).</p>

    <p>If the type is generic, add a backtick and its type arity at the end.</p>

    <p>Examples:

        <ul><li>Namespace.OuterType`1+NestedType`2</li><li>regex:Namespac.*Nested.*</li></ul></p>
  example: []
  syntax:
    content: public string AttributeTargetTypes { get; set; }
    parameters: []
    return:
      type: System.String
      description: >-
        A wildcard or regular expression specifying to which types

        this instance applies, or <code>null</code> if this instance

        applies to all types. Regular expressions should

        start with the <code>regex:</code> prefix.
    content.vb: Public Property AttributeTargetTypes As String
  overload: PostSharp.Extensibility.MulticastAttribute.AttributeTargetTypes*
