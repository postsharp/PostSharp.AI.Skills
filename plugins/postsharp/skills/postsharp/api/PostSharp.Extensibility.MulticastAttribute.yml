  name: MulticastAttribute
  nameWithType: MulticastAttribute
  fullName: PostSharp.Extensibility.MulticastAttribute
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: >-
    Custom attribute that can be applied to multiple elements

    using wildcards.
  remarks: >-
    <p>Each class derived from <xref href="PostSharp.Extensibility.MulticastAttribute" data-throw-if-not-resolved="false"></xref>
        should be decorated with an instance of <xref href="PostSharp.Extensibility.MulticastAttributeUsageAttribute" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>
        Note to implementors: The properties of this class that start with the word 'Attribute' only have an effect if they are
        set at the point where the attribute is used (in brackets). Setting them in the constructor of your subclass has no effect.
        </p>
    <p>
        Multicasting is performed by the <code>MulticastAttributeTask</code>, which should be
        included in the project. After multicasting, custom attribute instances are
        available on the <code>CustomAttributeDictionaryTask</code> class.
        </p>
    <p>When you apply a multicast attribute to a container, such as an assembly or a type, it is implicitly applied to all the
        elements of that container that match its filters: the ones set by the aspect developer with <xref href="PostSharp.Extensibility.MulticastAttributeUsageAttribute" data-throw-if-not-resolved="false"></xref>,
        and the ones set by the aspect user with the properties of this class. Users can only restrict the set of targets allowed by
        the developer, not enlarge it. All PostSharp aspects derive from this class, but you can also derive custom attributes that are not
        aspects from it to multicast them.</p>
  example: []
  syntax:
    content: >-
      [Serializer(null)]

      public abstract class MulticastAttribute : Attribute
    content.vb: >-
      <Serializer(Nothing)>

      Public MustInherit Class MulticastAttribute Inherits Attribute
