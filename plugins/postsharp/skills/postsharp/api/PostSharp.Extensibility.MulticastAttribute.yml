- uid: PostSharp.Extensibility.MulticastAttribute.AttributeInheritance
  commentId: P:PostSharp.Extensibility.MulticastAttribute.AttributeInheritance
  id: AttributeInheritance
  parent: PostSharp.Extensibility.MulticastAttribute
  langs:
  - csharp
  - vb
  name: AttributeInheritance
  nameWithType: MulticastAttribute.AttributeInheritance
  fullName: PostSharp.Extensibility.MulticastAttribute.AttributeInheritance
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: Gets or sets the inheritance mode of this attribute.
  remarks: >-
    <p>If this property is not set to <code>MulticastInheritance.None</code>,
        a copy of this attribute will be propagated
        along the lines of inheritance of the target element:</p>
    <ul><li>On classes: all classes derived from that class.</li><li>On interfaces: all classes implementing this interface.</li><li>On virtual, abstract or interface methods: all methods overriding 
        or implementing this method.</li><li>On parameters or return value of virtual, abstract or interface methods:
        corresponding parameter or return value on all methods overriding or implementing the
        parent method of the target parameter or return value.</li></ul>
    <p>With <xref href="PostSharp.Extensibility.MulticastInheritance.Multicast" data-throw-if-not-resolved="false"></xref>, inherited instances are also multicast to the members of the derived
        elements; with <xref href="PostSharp.Extensibility.MulticastInheritance.Strict" data-throw-if-not-resolved="false"></xref>, they are not. The aspect developer can set the inheritance mode for all usages
        with <xref href="PostSharp.Extensibility.MulticastAttributeUsageAttribute.Inheritance" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public MulticastInheritance AttributeInheritance { get; set; }
    parameters: []
    return:
      type: PostSharp.Extensibility.MulticastInheritance
    content.vb: Public Property AttributeInheritance As MulticastInheritance
  overload: PostSharp.Extensibility.MulticastAttribute.AttributeInheritance*
  seealso:
  - linkType: HRef
    linkId: '@multicast-inheritance'
    altText: 'Conceptual: Understanding Aspect Inheritance'
  - linkType: HRef
    linkId: '@aspect-inheritance'
    altText: 'Conceptual: Adding Aspects to Derived Classes and Methods Using Attributes'
- uid: PostSharp.Extensibility.MulticastAttribute.AllowExtensionBlockMembers
  commentId: P:PostSharp.Extensibility.MulticastAttribute.AllowExtensionBlockMembers
  id: AllowExtensionBlockMembers
  parent: PostSharp.Extensibility.MulticastAttribute
  langs:
  - csharp
  - vb
  name: AllowExtensionBlockMembers
  nameWithType: MulticastAttribute.AllowExtensionBlockMembers
  fullName: PostSharp.Extensibility.MulticastAttribute.AllowExtensionBlockMembers
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Extensibility
  summary: Gets or sets a value indicating whether C# 14 extension block members are allowed.
  remarks: >-
    <p>You can use this property to override <xref href="PostSharp.Extensibility.MulticastAttributeUsageAttribute.AllowExtensionBlockMembers" data-throw-if-not-resolved="false"></xref>.</p>

    <p>By default, an attribute multicast from an outer declaration, such as the declaring type, is not applied to the static methods
        that implement the members of C# 14 extension blocks. Set this property to <code>true</code> to include them. An attribute applied directly
        to an extension block member is applied regardless of this property. The compiler-generated metadata types of extension blocks are never targeted.
        Classic extension methods are not affected.</p>
  example: []
  syntax:
    content: public bool AllowExtensionBlockMembers { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property AllowExtensionBlockMembers As Boolean
  overload: PostSharp.Extensibility.MulticastAttribute.AllowExtensionBlockMembers*
  seealso:
  - linkType: HRef
    linkId: '@extension-blocks-multicast'
    altText: 'Conceptual: C# 14 extension blocks and multicasting'
