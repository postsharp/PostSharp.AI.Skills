  name: RedirectLoggingToPostSharp()
  nameWithType: Log4NetCollectingRepositorySelector.RedirectLoggingToPostSharp()
  fullName: PostSharp.Patterns.Diagnostics.Backends.Log4Net.Log4NetCollectingRepositorySelector.RedirectLoggingToPostSharp()
  type: Method
  assemblies:
  - PostSharp.Patterns.Diagnostics.Backends.Log4Net
  namespace: PostSharp.Patterns.Diagnostics.Backends.Log4Net
  summary: >-
    Sets the global <xref href="log4net.Core.LoggerManager.RepositorySelector" data-throw-if-not-resolved="false"></xref> to a log4net-to-PostSharp redirector so that all repositories and loggers created after this call

    redirect all messages to PostSharp. Returns a "relay repository", which is the only repository that is not redirected to PostSharp.
  example: []
  syntax:
    content: public static ILoggerRepository RedirectLoggingToPostSharp()
    return:
      type: log4net.Repository.ILoggerRepository
      description: >-
        The relay repository. You should configure it with appenders where you want the final log output to go.
                    Pass it to <xref href="PostSharp.Patterns.Diagnostics.Backends.Log4Net.Log4NetLoggingBackend" data-throw-if-not-resolved="false"></xref> so that logging done by PostSharp goes to your appenders.
    content.vb: Public Shared Function RedirectLoggingToPostSharp() As ILoggerRepository
  overload: PostSharp.Patterns.Diagnostics.Backends.Log4Net.Log4NetCollectingRepositorySelector.RedirectLoggingToPostSharp*
