  name: Log4NetCollectingRepositorySelector
  nameWithType: Log4NetCollectingRepositorySelector
  fullName: PostSharp.Patterns.Diagnostics.Backends.Log4Net.Log4NetCollectingRepositorySelector
  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics.Backends.Log4Net
  namespace: PostSharp.Patterns.Diagnostics.Backends.Log4Net
  summary: >-
    This class is a log4net repository selector. It allows you to send all your log4net logging into PostSharp, where it can be processed by any

    PostSharp logging backend (including a log4net backend). See Remarks.
  remarks: >-
    To use this class, add initialization code similar to the following at the beginning of your application:


    <pre><code class="lang-csharp">ILoggerRepository relay = Log4NetCollectingRepositorySelector.RedirectLoggingToPostSharp();

    BasicConfigurator.Configure( relay );

    LoggingServices.DefaultBackend = new Log4NetLoggingBackend(relay);</code></pre>


    The first line sets an instance of <xref href="PostSharp.Patterns.Diagnostics.Backends.Log4Net.Log4NetCollectingRepositorySelector" data-throw-if-not-resolved="false"></xref> as the active <xref href="log4net.Core.IRepositorySelector" data-throw-if-not-resolved="false"></xref>.

    As a result, all upcoming <code>LogManager.GetLogger(string)</code>

    and similar calls get special redirection loggers. These loggers pass all messages to PostSharp instead of to log4net appenders.


    <p>

    The first line also returns a "relay repository". This is the only repository where logging is not redirected to PostSharp. On line 2,

    we configure appenders for this repository. You may want to use <xref href="log4net.Config.XmlConfigurator" data-throw-if-not-resolved="false"></xref> here. On line 3, we pass that relay repository to PostSharp

    so that all PostSharp logging goes into that relay repository and from there to your appenders.

    This includes automatic logging, manual logging and the logging coming from log4net.

    </p><p>

    Call <xref href="PostSharp.Patterns.Diagnostics.Backends.Log4Net.Log4NetCollectingRepositorySelector.RedirectLoggingToPostSharp" data-throw-if-not-resolved="false"></xref> before you create any log4net logger. Loggers created earlier are not redirected.

    </p>
  example: []
  syntax:
    content: 'public class Log4NetCollectingRepositorySelector : IRepositorySelector'
    content.vb: Public Class Log4NetCollectingRepositorySelector Implements IRepositorySelector
