  fullName: PostSharp.Patterns.Recording.RecorderProvider
  type: Class
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording
  summary: >-
    Abstract class that represents a node in the chain of responsibility, starting at the <xref href="PostSharp.Patterns.Recording.RecordingServices.RecorderProvider" data-throw-if-not-resolved="false"></xref> property,

    whose role is to provide a default <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref> to recordable objects.
  remarks: >-
    <p>The <xref href="PostSharp.Patterns.Recording.RecordableAttribute" data-throw-if-not-resolved="false"></xref> aspect uses this chain to attach objects whose <xref href="PostSharp.Patterns.Recording.RecordableAttribute.AutoRecord" data-throw-if-not-resolved="false"></xref> property
        is <code>true</code>. To use a custom provider, assign it to the <xref href="PostSharp.Patterns.Recording.RecordingServices.RecorderProvider" data-throw-if-not-resolved="false"></xref> property and pass the previous value
        of this property to its constructor.</p>
  example: []
  syntax:
    content: >-
      [Obsolete("[Recordable] aspect and its components are deprecated and will be removed in a future version.", false)]

      public abstract class RecorderProvider
    content.vb: >-
      <Obsolete("[Recordable] aspect and its components are deprecated and will be removed in a future version.", False)>

      Public MustInherit Class RecorderProvider
