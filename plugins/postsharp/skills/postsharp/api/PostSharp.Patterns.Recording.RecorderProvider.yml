- uid: PostSharp.Patterns.Recording.RecorderProvider.GetRecorder(System.Object)
  commentId: M:PostSharp.Patterns.Recording.RecorderProvider.GetRecorder(System.Object)
  id: GetRecorder(System.Object)
  parent: PostSharp.Patterns.Recording.RecorderProvider
  langs:
  - csharp
  - vb
  name: GetRecorder(object)
  nameWithType: RecorderProvider.GetRecorder(object)
  fullName: PostSharp.Patterns.Recording.RecorderProvider.GetRecorder(object)
  type: Method
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording
  summary: Gets the default <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref> for a given object. This method goes through the whole chain of responsibility.
  example: []
  syntax:
    content: public Recorder GetRecorder(object obj)
    parameters:
    - id: obj
      type: System.Object
      description: >-
        The object for which the default <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref> is required, or <code>null</code>
                    if the global default provider (exposed for convenience by the <xref href="PostSharp.Patterns.Recording.RecordingServices.DefaultRecorder" data-throw-if-not-resolved="false"></xref> property)
                    is required.
    return:
      type: PostSharp.Patterns.Recording.Recorder
      description: >-
        The <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref> for <code class="paramref">obj</code>, or <code>null</code> if no <xref href="PostSharp.Patterns.Recording.RecorderProvider" data-throw-if-not-resolved="false"></xref> in the chain of responsibility
                    knows how to provide a <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref> for <code class="paramref">obj</code>.
    content.vb: Public Function GetRecorder(obj As Object) As Recorder
  overload: PostSharp.Patterns.Recording.RecorderProvider.GetRecorder*
