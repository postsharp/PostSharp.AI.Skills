  name.vb: GetRecorder(Object)
- uid: PostSharp.Patterns.Recording.RecorderProvider.GetRecorderCore(System.Object)
  commentId: M:PostSharp.Patterns.Recording.RecorderProvider.GetRecorderCore(System.Object)
  id: GetRecorderCore(System.Object)
  parent: PostSharp.Patterns.Recording.RecorderProvider
  langs:
  - csharp
  - vb
  name: GetRecorderCore(object)
  nameWithType: RecorderProvider.GetRecorderCore(object)
  fullName: PostSharp.Patterns.Recording.RecorderProvider.GetRecorderCore(object)
  type: Method
  assemblies:
  - PostSharp.Patterns.Model
  namespace: PostSharp.Patterns.Recording
  summary: Gets the default <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref> for a given object.
  example: []
  syntax:
    content: protected abstract Recorder GetRecorderCore(object obj)
    parameters:
    - id: obj
      type: System.Object
      description: >-
        The object for which the default <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref> is required, or <code>null</code>
                    if the global default provider (exposed for convenience by the <xref href="PostSharp.Patterns.Recording.RecordingServices.DefaultRecorder" data-throw-if-not-resolved="false"></xref> property)
                    is required.
    return:
      type: PostSharp.Patterns.Recording.Recorder
      description: >-
        The <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref> for <code class="paramref">obj</code>, or <code>null</code> if the current <xref href="PostSharp.Patterns.Recording.RecorderProvider" data-throw-if-not-resolved="false"></xref> does not know
                    how to provide a <xref href="PostSharp.Patterns.Recording.Recorder" data-throw-if-not-resolved="false"></xref> for <code class="paramref">obj</code>, in which case the caller shall invoke the next <xref href="PostSharp.Patterns.Recording.RecorderProvider" data-throw-if-not-resolved="false"></xref>
                    in the chain of responsibility.
    content.vb: Protected MustOverride Function GetRecorderCore(obj As Object) As Recorder
  overload: PostSharp.Patterns.Recording.RecorderProvider.GetRecorderCore*
  nameWithType.vb: RecorderProvider.GetRecorderCore(Object)
  fullName.vb: PostSharp.Patterns.Recording.RecorderProvider.GetRecorderCore(Object)
  name.vb: GetRecorderCore(Object)
