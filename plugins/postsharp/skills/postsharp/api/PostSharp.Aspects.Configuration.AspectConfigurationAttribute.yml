- uid: PostSharp.Aspects.Configuration.AspectConfigurationAttribute.AspectPriority
  commentId: P:PostSharp.Aspects.Configuration.AspectConfigurationAttribute.AspectPriority
  id: AspectPriority
  parent: PostSharp.Aspects.Configuration.AspectConfigurationAttribute
  langs:
  - csharp
  - vb
  name: AspectPriority
  nameWithType: AspectConfigurationAttribute.AspectPriority
  fullName: PostSharp.Aspects.Configuration.AspectConfigurationAttribute.AspectPriority
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Configuration
  summary: Gets or sets the weaving priority of the aspect.
  remarks: >-
    <p>Advices with a lower priority are executed first for 'entry' semantics (entering or invoking a
          method, setting a field value). This order is inverted for advices with 'exit' semantics (leaving a
          method, getting a field value).
          </p>
    <p>This property must not be confused with <xref href="PostSharp.Extensibility.MulticastAttribute.AttributePriority" data-throw-if-not-resolved="false"></xref>, which
            solely influences the multicasting process.</p>
  example: []
  syntax:
    content: public int AspectPriority { get; set; }
    parameters: []
    return:
      type: System.Int32
      description: The aspect priority, or <code>null</code> if the aspect priority is not specified.
    content.vb: Public Property AspectPriority As Integer
  overload: PostSharp.Aspects.Configuration.AspectConfigurationAttribute.AspectPriority*
- uid: PostSharp.Aspects.Configuration.AspectConfigurationAttribute.SerializerType
  commentId: P:PostSharp.Aspects.Configuration.AspectConfigurationAttribute.SerializerType
  id: SerializerType
  parent: PostSharp.Aspects.Configuration.AspectConfigurationAttribute
  langs:
  - csharp
  - vb
  name: SerializerType
  nameWithType: AspectConfigurationAttribute.SerializerType
  fullName: PostSharp.Aspects.Configuration.AspectConfigurationAttribute.SerializerType
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Configuration
  summary: >-
    Gets or sets the <xref href="System.Type" data-throw-if-not-resolved="false"></xref> of the serializer that will be used

    to configure the current aspect.
  remarks: >-
    <p>The type assigned to this property must derive from the <xref href="PostSharp.Aspects.Serialization.AspectSerializer" data-throw-if-not-resolved="false"></xref> class
            and have a default constructor. Use <xref href="PostSharp.Aspects.Serialization.MsilAspectSerializer" data-throw-if-not-resolved="false"></xref> to specify that the aspect will not
            be serialized, but will be constructed using MSIL instructions.
          </p>
    <p></p>
  example: []
  syntax:
    content: public Type SerializerType { get; set; }
    parameters: []
    return:
      type: System.Type
    content.vb: Public Property SerializerType As Type
  overload: PostSharp.Aspects.Configuration.AspectConfigurationAttribute.SerializerType*
