- uid: PostSharp.Aspects.Configuration.AspectConfigurationAttribute.SetAspectConfiguration(PostSharp.Aspects.Configuration.AspectConfiguration)
  commentId: M:PostSharp.Aspects.Configuration.AspectConfigurationAttribute.SetAspectConfiguration(PostSharp.Aspects.Configuration.AspectConfiguration)
