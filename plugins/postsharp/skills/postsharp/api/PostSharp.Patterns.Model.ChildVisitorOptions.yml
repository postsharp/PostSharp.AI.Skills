  fullName: PostSharp.Patterns.Model.ChildVisitorOptions
  type: Enum
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: Options for the <xref href="PostSharp.Patterns.Model.IAggregatable.VisitChildren(PostSharp.Patterns.Model.ChildVisitor%2cPostSharp.Patterns.Model.ChildVisitorOptions%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Model.AggregatableExtensions.VisitSelfAndDescendants(PostSharp.Patterns.Model.IAggregatable%2cPostSharp.Patterns.Model.DescendantVisitor%2cPostSharp.Patterns.Model.ChildVisitorOptions%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> methods.
  remarks: >-
    <p>By default (<xref href="PostSharp.Patterns.Model.ChildVisitorOptions.None" data-throw-if-not-resolved="false"></xref>), the visitor is not invoked on a parent surrogate, typically a child collection,
        but on each item of the parent surrogate. <xref href="PostSharp.Patterns.Model.ChildVisitorOptions.IncludeParentSurrogates" data-throw-if-not-resolved="false"></xref> additionally invokes the visitor on the parent surrogate itself,
        and <xref href="PostSharp.Patterns.Model.ChildVisitorOptions.ExcludeIndirectChildren" data-throw-if-not-resolved="false"></xref> skips the items of parent surrogates.</p>
