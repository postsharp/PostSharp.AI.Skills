  langs:
  - csharp
  - vb
  name: LoggingVerbosityConfiguration
  nameWithType: LoggingVerbosityConfiguration
  fullName: PostSharp.Patterns.Diagnostics.LoggingVerbosityConfiguration
  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics
  summary: >-
    Manages the configuration of the minimum <xref href="PostSharp.Patterns.Diagnostics.LogLevel" data-throw-if-not-resolved="false"></xref> for individual types and namespaces. This class is exposed by the <xref href="PostSharp.Patterns.Diagnostics.LoggingContextLocalConfiguration.Verbosity" data-throw-if-not-resolved="false"></xref> property.

    To create a new instance of this class, call <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.CreateVerbosityConfiguration" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>This class is not meant to be derived because it is heavyweight and therefore
         the number of instances should be minimal. To store context-sensitive information, another mechanism should be used.</p>
    <p>The <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.DefaultVerbosity" data-throw-if-not-resolved="false"></xref> property gives the configuration of the default execution context. The default
         minimum level is <xref href="PostSharp.Patterns.Diagnostics.LogLevel.Debug" data-throw-if-not-resolved="false"></xref>. Setting the level of a namespace overrides the levels of its child namespaces and types,
         so set the level of a parent namespace before the levels of its children.</p>
    <p>To change the verbosity for a specific execution context only, for instance a web request, create an instance once with
         <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.CreateVerbosityConfiguration" data-throw-if-not-resolved="false"></xref>, store it, and call <xref href="PostSharp.Patterns.Diagnostics.LoggingVerbosityConfiguration.Use" data-throw-if-not-resolved="false"></xref> when the request starts. Dispose the returned
         object when the request ends. Do not create an instance for each request.</p>
  example: []
  syntax:
    content: 'public class LoggingVerbosityConfiguration : IDisposable'
    content.vb: Public Class LoggingVerbosityConfiguration Implements IDisposable
