  name: LogRecordBuilder
  nameWithType: LogRecordBuilder
  fullName: PostSharp.Patterns.Diagnostics.RecordBuilders.LogRecordBuilder
  type: Class
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.RecordBuilders
  summary: >-
    Builds a log record (typically, but not necessarily a string) for an action. You can think

    of the <xref href="PostSharp.Patterns.Diagnostics.RecordBuilders.LogRecordBuilder" data-throw-if-not-resolved="false"></xref> as a semantic <xref href="System.Text.StringBuilder" data-throw-if-not-resolved="false"></xref>. PostSharp emits

    code that invokes methods such as 

    <xref href="PostSharp.Patterns.Diagnostics.RecordBuilders.LogRecordBuilder.SetParameter%60%601(System.Int32%2cSystem.String%2cPostSharp.Reflection.ParameterKind%2cSystem.String%2c%60%600)" data-throw-if-not-resolved="false"></xref> or 

    <xref href="PostSharp.Patterns.Diagnostics.RecordBuilders.LogRecordBuilder.SetReturnValue%60%601(System.Int32%2cSystem.String%2cSystem.String%2c%60%600%2cPostSharp.Patterns.Formatters.IFormatter%7b%60%600%7d)" data-throw-if-not-resolved="false"></xref>.

    The responsibility of the <xref href="PostSharp.Patterns.Diagnostics.RecordBuilders.LogRecordBuilder" data-throw-if-not-resolved="false"></xref> is to format a record and emit it to the

    backend.
  example: []
  syntax:
    content: 'public abstract class LogRecordBuilder : ICustomLogRecordBuilder, IDisposable'
    content.vb: Public MustInherit Class LogRecordBuilder Implements ICustomLogRecordBuilder, IDisposable
