- uid: PostSharp.Patterns.Diagnostics.RecordBuilders.LogRecordBuilder.GetOutputMultiplexEventData
  commentId: M:PostSharp.Patterns.Diagnostics.RecordBuilders.LogRecordBuilder.GetOutputMultiplexEventData
  id: GetOutputMultiplexEventData
  parent: PostSharp.Patterns.Diagnostics.RecordBuilders.LogRecordBuilder
  langs:
  - csharp
  - vb
  name: GetOutputMultiplexEventData()
  nameWithType: LogRecordBuilder.GetOutputMultiplexEventData()
  fullName: PostSharp.Patterns.Diagnostics.RecordBuilders.LogRecordBuilder.GetOutputMultiplexEventData()
  type: Method
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.RecordBuilders
  summary: Returns a list of properties that will be passed to the next backend in order if a multiplexer is used. See the remarks.
  remarks: >-
    If you have a <xref href="PostSharp.Patterns.Diagnostics.Backends.Multiplexer.MultiplexerBackend" data-throw-if-not-resolved="false"></xref> with two backends, then this method will be called on the first backend and what this method

    returns will be added to the properties of this record in the next backend.


    <p>

    Returning <code>null</code> means that no properties should be passed to the next backend.

    </p><p>

    Note to implementors: This method is called by the multiplexer after <xref href="PostSharp.Patterns.Diagnostics.RecordBuilders.LogRecordBuilder.BeginRecord(PostSharp.Patterns.Diagnostics.Contexts.LoggingContext%2cPostSharp.Patterns.Diagnostics.Contexts.LogRecordInfo%40%2cPostSharp.Patterns.Diagnostics.Contexts.LogMemberInfo%40)" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Diagnostics.RecordBuilders.LogRecordBuilder.BeginCustomRecord(PostSharp.Patterns.Diagnostics.Contexts.LoggingContext%2cPostSharp.Patterns.Diagnostics.Contexts.CustomLogRecordInfo%40)" data-throw-if-not-resolved="false"></xref>.

    This may change. This is an experimental feature.

    </p>
  example: []
  syntax:
    content: public virtual LogEventData GetOutputMultiplexEventData()
    return:
      type: PostSharp.Patterns.Diagnostics.Custom.LogEventData
      description: The list of properties to be passed to the next backend, or <code>null</code>.
    content.vb: Public Overridable Function GetOutputMultiplexEventData() As LogEventData
  overload: PostSharp.Patterns.Diagnostics.RecordBuilders.LogRecordBuilder.GetOutputMultiplexEventData*
