  - csharp
  - vb
  name: VisitProperties(Action<string, object>, in LoggingPropertyVisitorOptions)
  nameWithType: LogRecordBuilder.VisitProperties(Action<string, object>, in LoggingPropertyVisitorOptions)
  fullName: PostSharp.Patterns.Diagnostics.RecordBuilders.LogRecordBuilder.VisitProperties(System.Action<string, object>, in PostSharp.Patterns.Diagnostics.Custom.LoggingPropertyVisitorOptions)
  type: Method
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics.RecordBuilders
  summary: >-
    Invokes a delegate for each property on the current log record.

    This offers a simple way to visit properties, but it has a performance overhead compared to <xref href="PostSharp.Patterns.Diagnostics.RecordBuilders.LogRecordBuilder.VisitProperties%60%601(PostSharp.Patterns.Diagnostics.Custom.ILoggingPropertyVisitor%7b%60%600%7d%2c%60%600%40%2cPostSharp.Patterns.Diagnostics.Custom.LoggingPropertyVisitorOptions%40)" data-throw-if-not-resolved="false"></xref>

    because it is weakly typed and causes the allocation of a closure class to build the action. It also does not expose the <xref href="PostSharp.Patterns.Diagnostics.Custom.LoggingPropertyOptions" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public void VisitProperties(Action<string, object> action, in LoggingPropertyVisitorOptions options = default)
    parameters:
    - id: action
      type: System.Action{System.String,System.Object}
      description: The delegate to call for each property. The first value is the property name, the second its value.
      attributes:
      - type: PostSharp.Patterns.Contracts.RequiredAttribute
        ctor: PostSharp.Patterns.Contracts.RequiredAttribute.#ctor
        arguments: []
    - id: options
      type: PostSharp.Patterns.Diagnostics.Custom.LoggingPropertyVisitorOptions
      description: Determines which properties are visited.
    content.vb: Public Sub VisitProperties(action As Action(Of String, Object), options As LoggingPropertyVisitorOptions = Nothing)
  overload: PostSharp.Patterns.Diagnostics.RecordBuilders.LogRecordBuilder.VisitProperties*
  nameWithType.vb: LogRecordBuilder.VisitProperties(Action(Of String, Object), LoggingPropertyVisitorOptions)
