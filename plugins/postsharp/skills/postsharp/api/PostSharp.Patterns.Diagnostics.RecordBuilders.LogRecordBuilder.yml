  commentId: M:PostSharp.Patterns.Diagnostics.RecordBuilders.LogRecordBuilder.VisitProperties(System.Action{System.String,System.Object},PostSharp.Patterns.Diagnostics.Custom.LoggingPropertyVisitorOptions@)
  id: VisitProperties(System.Action{System.String,System.Object},PostSharp.Patterns.Diagnostics.Custom.LoggingPropertyVisitorOptions@)
