  summary: >-
    Gets or sets a value indicating whether the type of the target field or property should be validated at build time

    against the rules of aspects that rely on the Aggregatable model, such as the Recordable aspect

    or the threading model aspects. If this property is set to <code>true</code>, validation will

    be performed at run time only.
