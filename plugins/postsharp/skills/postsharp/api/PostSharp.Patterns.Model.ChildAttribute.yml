- uid: PostSharp.Patterns.Model.ChildAttribute.IsParentSurrogate
  commentId: P:PostSharp.Patterns.Model.ChildAttribute.IsParentSurrogate
  id: IsParentSurrogate
  parent: PostSharp.Patterns.Model.ChildAttribute
  langs:
  - csharp
  - vb
  name: IsParentSurrogate
  nameWithType: ChildAttribute.IsParentSurrogate
  fullName: PostSharp.Patterns.Model.ChildAttribute.IsParentSurrogate
  type: Property
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: >-
    Gets or sets a value indicating whether the value assigned to the field or property is a parent surrogate. The <xref href="PostSharp.Patterns.Model.IAggregatable.Parent" data-throw-if-not-resolved="false"></xref> property

    of children of a parent surrogate is set to the parent of the parent surrogate, instead of to the field itself.
  remarks: >-
    <p>When an item is attached to a parent surrogate, the <xref href="PostSharp.Patterns.Model.IAggregatable.Parent" data-throw-if-not-resolved="false"></xref> property of the item is set to the
        <xref href="PostSharp.Patterns.Model.IAggregatable.Parent" data-throw-if-not-resolved="false"></xref> of the parent surrogate, instead of the parent surrogate itself. Collections are typical examples
        of a parent surrogate, because the parent of collection items needs to be the owner of the collection and not the collection itself.</p>
    <p>The default value of this property is <code>true</code> for collections, and <code>false</code> otherwise.</p>
  example: []
  syntax:
    content: public bool IsParentSurrogate { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property IsParentSurrogate As Boolean
  overload: PostSharp.Patterns.Model.ChildAttribute.IsParentSurrogate*
  seealso:
  - linkType: HRef
    linkId: '@advisable-collections'
    altText: 'Conceptual: Working With Child Collections'
- uid: PostSharp.Patterns.Model.ChildAttribute.ItemsRelationship
  commentId: P:PostSharp.Patterns.Model.ChildAttribute.ItemsRelationship
  id: ItemsRelationship
  parent: PostSharp.Patterns.Model.ChildAttribute
  langs:
  - csharp
  - vb
  name: ItemsRelationship
  nameWithType: ChildAttribute.ItemsRelationship
  fullName: PostSharp.Patterns.Model.ChildAttribute.ItemsRelationship
  type: Property
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: Gets or sets the kind of relationship between items.
  remarks: >-
    <p>By default, the items of a child collection are children of the declaring instance. Set this property to <xref href="PostSharp.Patterns.Model.RelationshipKind.Reference" data-throw-if-not-resolved="false"></xref>
        when the collection itself belongs to the declaring instance but its items do not, for example a collection of related entities
        whose changes must still be recorded. <xref href="PostSharp.Patterns.Model.IAggregatable.VisitChildren(PostSharp.Patterns.Model.ChildVisitor%2cPostSharp.Patterns.Model.ChildVisitorOptions%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> does not visit the items of such a collection.</p>
  example: []
  syntax:
    content: public RelationshipKind ItemsRelationship { get; set; }
    parameters: []
    return:
      type: PostSharp.Patterns.Model.RelationshipKind
    content.vb: Public Property ItemsRelationship As RelationshipKind
  overload: PostSharp.Patterns.Model.ChildAttribute.ItemsRelationship*
  seealso:
  - linkType: HRef
    linkId: '@advisable-collections'
    altText: 'Conceptual: Working With Child Collections'
- uid: PostSharp.Patterns.Model.ChildAttribute.DisableBehaviorPropagation
  commentId: P:PostSharp.Patterns.Model.ChildAttribute.DisableBehaviorPropagation
  id: DisableBehaviorPropagation
  parent: PostSharp.Patterns.Model.ChildAttribute
  langs:
  - csharp
  - vb
  name: DisableBehaviorPropagation
  nameWithType: ChildAttribute.DisableBehaviorPropagation
  fullName: PostSharp.Patterns.Model.ChildAttribute.DisableBehaviorPropagation
  type: Property
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: >-
    Gets or sets a value indicating whether the behaviors applied to the declaring type of the target field should be applied

    to the object assigned to this field. The default value of this property is <code>false</code>, which means

    that behaviors such as Recordable or threading models will be applied to children.

    If this is not possible, an exception occurs at build time or at run time. When it is set to <code>true</code>, behaviors will not be propagated.

    When applied to a field of collection type, the value applies to collection items.
  example: []
  syntax:
    content: public bool DisableBehaviorPropagation { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property DisableBehaviorPropagation As Boolean
  overload: PostSharp.Patterns.Model.ChildAttribute.DisableBehaviorPropagation*
