  fullName: PostSharp.Patterns.Model.ChildAttribute
  type: Class
  assemblies:
  - PostSharp.Patterns.Aggregation
  namespace: PostSharp.Patterns.Model
  summary: >-
    Custom attribute that, when applied to a field or automatic property, specifies that the object assigned to this

    field or property is a child of the instance of the declaring type.
  remarks: >-
    <p>When the field or property holds a collection, assign an advisable collection, such as
        <xref href="PostSharp.Patterns.Collections.AdvisableCollection%601" data-throw-if-not-resolved="false"></xref>, or an immutable collection. By default, a collection is a parent surrogate:
        its items are children of the declaring instance, and the collection itself is skipped by <xref href="PostSharp.Patterns.Model.IAggregatable.VisitChildren(PostSharp.Patterns.Model.ChildVisitor%2cPostSharp.Patterns.Model.ChildVisitorOptions%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>
        (see <xref href="PostSharp.Patterns.Model.ChildAttribute.IsParentSurrogate" data-throw-if-not-resolved="false"></xref>). To make the items of the collection references, set <xref href="PostSharp.Patterns.Model.ChildAttribute.ItemsRelationship" data-throw-if-not-resolved="false"></xref>
        to <xref href="PostSharp.Patterns.Model.RelationshipKind.Reference" data-throw-if-not-resolved="false"></xref>. The collection stays a parent surrogate.</p>
  example: []
  syntax:
    content: 'public sealed class ChildAttribute : MemberRelationshipAttribute, IValidableAnnotation'
    content.vb: Public NotInheritable Class ChildAttribute Inherits MemberRelationshipAttribute Implements IValidableAnnotation
