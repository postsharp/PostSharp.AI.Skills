    linkId: '@semantic-advising'
    altText: 'Conceptual: Semantic Advising of Iterator and Async Methods'
- uid: PostSharp.Aspects.Advices.OnMethodBoundaryAdvice.UnsupportedTargetAction
  commentId: P:PostSharp.Aspects.Advices.OnMethodBoundaryAdvice.UnsupportedTargetAction
  id: UnsupportedTargetAction
  parent: PostSharp.Aspects.Advices.OnMethodBoundaryAdvice
  langs:
  - csharp
  - vb
  name: UnsupportedTargetAction
  nameWithType: OnMethodBoundaryAdvice.UnsupportedTargetAction
  fullName: PostSharp.Aspects.Advices.OnMethodBoundaryAdvice.UnsupportedTargetAction
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Gets or sets the action to take when the advice is applied to an unsupported target method.
  remarks: >-
    <p>By default, applying the advice to a target method that it does not support, for example a method that it cannot advise semantically,
        is a build-time error. Set this property to <xref href="PostSharp.Aspects.UnsupportedTargetAction.Ignore" data-throw-if-not-resolved="false"></xref> to skip such methods silently, or to
        <xref href="PostSharp.Aspects.UnsupportedTargetAction.Fallback" data-throw-if-not-resolved="false"></xref> to apply non-semantic advising when it is available.</p>
    <p>Set this property on the master advice of a group. Setting it on an advice whose <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Master" data-throw-if-not-resolved="false"></xref> property is set
        is a build-time error.</p>
  example: []
  syntax:
    content: public UnsupportedTargetAction UnsupportedTargetAction { get; set; }
    parameters: []
    return:
      type: PostSharp.Aspects.UnsupportedTargetAction
    content.vb: Public Property UnsupportedTargetAction As UnsupportedTargetAction
  overload: PostSharp.Aspects.Advices.OnMethodBoundaryAdvice.UnsupportedTargetAction*
  seealso:
  - linkType: HRef
    linkId: '@semantic-advising'
    altText: 'Conceptual: Semantic Advising of Iterator and Async Methods'
