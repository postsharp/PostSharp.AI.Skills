- uid: PostSharp.Aspects.Advices.OnMethodBoundaryAdvice.SemanticallyAdvisedMethodKinds
  commentId: P:PostSharp.Aspects.Advices.OnMethodBoundaryAdvice.SemanticallyAdvisedMethodKinds
  id: SemanticallyAdvisedMethodKinds
  parent: PostSharp.Aspects.Advices.OnMethodBoundaryAdvice
  langs:
  - csharp
  - vb
  name: SemanticallyAdvisedMethodKinds
  nameWithType: OnMethodBoundaryAdvice.SemanticallyAdvisedMethodKinds
  fullName: PostSharp.Aspects.Advices.OnMethodBoundaryAdvice.SemanticallyAdvisedMethodKinds
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: >-
    Gets or sets which target methods are advised semantically. This affects the behavior of the advice when it is applied to

    iterator or async methods, which are compiled into state machines.
  remarks: >-
    <p>
        Semantic advising results in an aspect that is consistent with the level of abstraction of the programming language. This is the default behavior.
        You can disable semantic advising by using this property to be consistent with the level of abstraction
        of MSIL and for backward compatibility with the versions of PostSharp prior to 3.1.
        </p>
    <p>Set this property on the master advice of a group. Setting it on an advice whose <xref href="PostSharp.Aspects.Advices.GroupingAdvice.Master" data-throw-if-not-resolved="false"></xref> property is set
        is a build-time error.</p>
  example: []
  syntax:
    content: public SemanticallyAdvisedMethodKinds SemanticallyAdvisedMethodKinds { get; set; }
    parameters: []
    return:
      type: PostSharp.Aspects.SemanticallyAdvisedMethodKinds
    content.vb: Public Property SemanticallyAdvisedMethodKinds As SemanticallyAdvisedMethodKinds
  overload: PostSharp.Aspects.Advices.OnMethodBoundaryAdvice.SemanticallyAdvisedMethodKinds*
  seealso:
