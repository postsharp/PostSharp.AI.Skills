  summary: Options that determine the mode of operation of an <xref href="PostSharp.Patterns.Caching.Backends.Azure.AzureServiceBusCacheInvalidator" data-throw-if-not-resolved="false"></xref> instance.
  remarks: >-
    <p>When <xref href="PostSharp.Patterns.Caching.Backends.Azure.AzureServiceBusCacheInvalidatorOptions.SubscriptionName" data-throw-if-not-resolved="false"></xref> is <code>null</code>, the invalidator creates its own topic subscription, which requires the <code>Manage</code> right.

    When it is set, the subscription must already exist and must not be shared with another instance of the invalidator.</p>
