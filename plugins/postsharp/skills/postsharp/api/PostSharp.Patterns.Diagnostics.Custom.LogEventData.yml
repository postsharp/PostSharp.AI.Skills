  name: LogEventData
  nameWithType: LogEventData
  fullName: PostSharp.Patterns.Diagnostics.Custom.LogEventData
  type: Struct
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics.Custom
  summary: >-
    Specifies the properties of a log event, such as a message, an activity opening, or an activity closing.

    Properties are typically passed in user code as an instance of an anonymous type. Any object can be provided. The properties

    of the message then come from the properties of the CLR object. To change the logic that maps the CLR object to

    the list of properties, you can specify a <xref href="PostSharp.Patterns.Diagnostics.Custom.LogEventMetadata" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: 'public readonly struct LogEventData : IEquatable<LogEventData>'
