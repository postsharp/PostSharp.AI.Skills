  type: Struct
  assemblies:
  - PostSharp.Patterns.Diagnostics.Adapters.AspNetFramework
  namespace: PostSharp.Patterns.Diagnostics.Adapters.AspNetFramework
  summary: >-
    Exposes a legacy ASP.NET request to the transaction policy expressions (see <code>OpenTransactionExpressionModel.Request</code> and <code>CloseTransactionExpressionModel.Request</code>).

    The <code>type</code> attribute of the <code>policy</code> element must be set to <code>AspNetFrameworkRequest</code> to match requests of this class.
  remarks: >-
    <p>Requests are captured only when <xref href="PostSharp.Patterns.Diagnostics.Adapters.AspNetFramework.PostSharpLoggingHttpModule" data-throw-if-not-resolved="false"></xref> is registered as an HTTP module. In a policy expression, access
        the request through the <code>t.Request</code> parameter, for example <code>t.Request.Path.StartsWith("/invoices")</code>.</p>
  example: []
  syntax:
    content: 'public readonly struct AspNetFrameworkRequestExpressionModel : IFormattable'
    content.vb: Public Structure AspNetFrameworkRequestExpressionModel Implements IFormattable
