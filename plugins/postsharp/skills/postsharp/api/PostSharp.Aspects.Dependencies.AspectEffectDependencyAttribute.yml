  summary: Specifies an aspect dependency that matches aspects or advices that have a given effect.
  remarks: >-
    <p>
            All aspects, except the ones that have an empty implementation, have an effect on the program execution.
            This custom attribute lets you express dependencies on aspects according to their effect.
          </p>
    <p>The list of standard effects is given in the <xref href="PostSharp.Aspects.Dependencies.StandardEffects" data-throw-if-not-resolved="false"></xref> class. All advices have
            implicitly the effect <xref href="PostSharp.Aspects.Dependencies.StandardEffects.Custom" data-throw-if-not-resolved="false"></xref>. Most advices also have the effect
            <xref href="PostSharp.Aspects.Dependencies.StandardEffects.ChangeControlFlow" data-throw-if-not-resolved="false"></xref>, because they can modify the control flow (for example,
            skip the execution of the intercepted method or throw an exception). An aspect or advice can declare
            that it does <i>not</i> have a given effect by using the <xref href="PostSharp.Aspects.Dependencies.WaiveAspectEffectAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.
          </p>
