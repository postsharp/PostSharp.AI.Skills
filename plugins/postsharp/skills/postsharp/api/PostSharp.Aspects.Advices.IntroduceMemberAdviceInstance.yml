- uid: PostSharp.Aspects.Advices.IntroduceMemberAdviceInstance.IsVirtual
  commentId: P:PostSharp.Aspects.Advices.IntroduceMemberAdviceInstance.IsVirtual
  id: IsVirtual
  parent: PostSharp.Aspects.Advices.IntroduceMemberAdviceInstance
  langs:
  - csharp
  - vb
  name: IsVirtual
  nameWithType: IntroduceMemberAdviceInstance.IsVirtual
  fullName: PostSharp.Aspects.Advices.IntroduceMemberAdviceInstance.IsVirtual
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Gets a value indicating whether the introduced member should be virtual.
  remarks: >-
    <p>
            When this property is <code>false</code> and the member already exists in a base type
            and is virtual, the member is overridden and marked as <code>sealed</code>.
          </p>
    <p>
            When this property is set to <code>null</code>, the introduced member is <code>virtual</code> if it exists in a base
            type as a virtual member; otherwise, it is non-virtual.
          </p>
  example: []
  syntax:
    content: public bool? IsVirtual { get; }
    parameters: []
    return:
      type: System.Nullable{System.Boolean}
    content.vb: Public ReadOnly Property IsVirtual As Boolean?
  overload: PostSharp.Aspects.Advices.IntroduceMemberAdviceInstance.IsVirtual*
