  name: CachingProfile
  nameWithType: CachingProfile
  fullName: PostSharp.Patterns.Caching.CachingProfile
  type: Class
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching
  summary: Allows for centralized and run-time configuration of several instances of the <xref href="PostSharp.Patterns.Caching.CacheAttribute" data-throw-if-not-resolved="false"></xref> aspect.
  remarks: >-
    <p>Profiles are exposed by name on the <xref href="PostSharp.Patterns.Caching.CachingServices.Profiles" data-throw-if-not-resolved="false"></xref> collection, which creates a profile the first time its name is requested.
        Cached methods select a profile with the <xref href="PostSharp.Patterns.Caching.CacheAttribute.ProfileName" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Patterns.Caching.CacheConfigurationAttribute.ProfileName" data-throw-if-not-resolved="false"></xref> property,
        and use the default profile (<xref href="PostSharp.Patterns.Caching.CachingProfileRegistry.Default" data-throw-if-not-resolved="false"></xref>) when they specify none.</p>
    <p>A profile setting applies only to the properties that are not set by the <xref href="PostSharp.Patterns.Caching.CacheAttribute" data-throw-if-not-resolved="false"></xref> or by a <xref href="PostSharp.Patterns.Caching.CacheConfigurationAttribute" data-throw-if-not-resolved="false"></xref>.
        Unlike these custom attributes, a profile can be changed at run time, for example to disable caching with the <xref href="PostSharp.Patterns.Caching.CachingProfile.IsEnabled" data-throw-if-not-resolved="false"></xref> property.
        Whether the <code>this</code> instance is part of the cache key cannot be set in a profile because it is resolved at build time.</p>
    <p>Locking is configured only on profiles, with the <xref href="PostSharp.Patterns.Caching.CachingProfile.LockManager" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Patterns.Caching.CachingProfile.AcquireLockTimeout" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Caching.CachingProfile.AcquireLockTimeoutStrategy" data-throw-if-not-resolved="false"></xref> properties.</p>
  example: []
  syntax:
    content: 'public sealed class CachingProfile : ICacheItemConfiguration'
    content.vb: Public NotInheritable Class CachingProfile Implements ICacheItemConfiguration
  seealso:
  - linkType: HRef
