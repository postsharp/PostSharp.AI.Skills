  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching
  summary: >-
    Gets or sets the total duration during which the result of the current method is stored in the cache. The absolute

    expiration time is counted from the moment the method is evaluated and cached.
