- uid: PostSharp.Patterns.Caching.CachingProfile.LockManager
  commentId: P:PostSharp.Patterns.Caching.CachingProfile.LockManager
  id: LockManager
  parent: PostSharp.Patterns.Caching.CachingProfile
  langs:
  - csharp
  - vb
  name: LockManager
  nameWithType: CachingProfile.LockManager
  fullName: PostSharp.Patterns.Caching.CachingProfile.LockManager
  type: Property
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching
  summary: >-
    Gets or sets the lock manager used to synchronize the execution of methods

    that are cached with the current profile. The default lock manager is <xref href="PostSharp.Patterns.Caching.Locking.NullLockManager" data-throw-if-not-resolved="false"></xref>,

    which allows for concurrent execution of all methods. An alternative implementation is <xref href="PostSharp.Patterns.Caching.Locking.LocalLockManager" data-throw-if-not-resolved="false"></xref>,

    which prevents concurrent execution of the same method with the same parameters, in the current process (or AppDomain).
  example: []
  syntax:
    content: public ILockManager LockManager { get; set; }
    parameters: []
    return:
      type: PostSharp.Patterns.Caching.Locking.ILockManager
    content.vb: Public Property LockManager As ILockManager
  overload: PostSharp.Patterns.Caching.CachingProfile.LockManager*
- uid: PostSharp.Patterns.Caching.CachingProfile.AcquireLockTimeout
  commentId: P:PostSharp.Patterns.Caching.CachingProfile.AcquireLockTimeout
  id: AcquireLockTimeout
  parent: PostSharp.Patterns.Caching.CachingProfile
  langs:
  - csharp
  - vb
  name: AcquireLockTimeout
  nameWithType: CachingProfile.AcquireLockTimeout
  fullName: PostSharp.Patterns.Caching.CachingProfile.AcquireLockTimeout
  type: Property
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching
  summary: >-
    Gets or sets the maximum time that the caching aspect will wait for the <xref href="PostSharp.Patterns.Caching.CachingProfile.LockManager" data-throw-if-not-resolved="false"></xref> to acquire a lock.

    To specify an infinite waiting time, set this property to <code>TimeSpan.FromMilliseconds( -1 )</code>. The default

    behavior is to wait infinitely.
  example: []
  syntax:
    content: public TimeSpan AcquireLockTimeout { get; set; }
    parameters: []
    return:
      type: System.TimeSpan
    content.vb: Public Property AcquireLockTimeout As TimeSpan
  overload: PostSharp.Patterns.Caching.CachingProfile.AcquireLockTimeout*
- uid: PostSharp.Patterns.Caching.CachingProfile.AcquireLockTimeoutStrategy
  commentId: P:PostSharp.Patterns.Caching.CachingProfile.AcquireLockTimeoutStrategy
  id: AcquireLockTimeoutStrategy
  parent: PostSharp.Patterns.Caching.CachingProfile
  langs:
  - csharp
  - vb
  name: AcquireLockTimeoutStrategy
  nameWithType: CachingProfile.AcquireLockTimeoutStrategy
  fullName: PostSharp.Patterns.Caching.CachingProfile.AcquireLockTimeoutStrategy
  type: Property
  assemblies:
  - PostSharp.Patterns.Caching
  namespace: PostSharp.Patterns.Caching
  summary: >-
    Gets or sets the behavior when the caching aspect cannot acquire a lock because of a timeout. 

    The default behavior is to throw a <xref href="System.TimeoutException" data-throw-if-not-resolved="false"></xref>. You can implement your own strategy by implementing

    the <xref href="PostSharp.Patterns.Caching.Locking.IAcquireLockTimeoutStrategy" data-throw-if-not-resolved="false"></xref> interface. If the <xref href="PostSharp.Patterns.Caching.Locking.IAcquireLockTimeoutStrategy.OnTimeout(System.String)" data-throw-if-not-resolved="false"></xref> does not return

    any exception, the cached method will be evaluated (even without a lock).
  example: []
  syntax:
    content: public IAcquireLockTimeoutStrategy AcquireLockTimeoutStrategy { get; set; }
    parameters: []
    return:
      type: PostSharp.Patterns.Caching.Locking.IAcquireLockTimeoutStrategy
    content.vb: Public Property AcquireLockTimeoutStrategy As IAcquireLockTimeoutStrategy
  overload: PostSharp.Patterns.Caching.CachingProfile.AcquireLockTimeoutStrategy*
