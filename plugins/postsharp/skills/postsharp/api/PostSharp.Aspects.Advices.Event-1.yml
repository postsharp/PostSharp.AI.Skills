  name: Event<TDelegate>
  nameWithType: Event<TDelegate>
  fullName: PostSharp.Aspects.Advices.Event<TDelegate>
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects.Advices
  summary: Exposes the semantics of an event for use with the <xref href="PostSharp.Aspects.Advices.ImportMemberAttribute" data-throw-if-not-resolved="false"></xref> aspect extension.
  remarks: >-
    <p>To import an event of the target class, declare a public instance field of type <xref href="PostSharp.Aspects.Advices.Event%601" data-throw-if-not-resolved="false"></xref> in the aspect class,
        where <code class="typeparamref">TDelegate</code> is the delegate type of the event, and annotate it with <xref href="PostSharp.Aspects.Advices.ImportMemberAttribute" data-throw-if-not-resolved="false"></xref>.
        At run time, the aspect can then add or remove handlers through the <xref href="PostSharp.Aspects.Advices.Event%601.Add" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Aspects.Advices.Event%601.Remove" data-throw-if-not-resolved="false"></xref> delegates.</p>
  example: []
  syntax:
    content: public sealed class Event<TDelegate>
    typeParameters:
    - id: TDelegate
      description: The handler type, derived from <xref href="System.Delegate" data-throw-if-not-resolved="false"></xref>.
    content.vb: Public NotInheritable Class [Event](Of TDelegate)
