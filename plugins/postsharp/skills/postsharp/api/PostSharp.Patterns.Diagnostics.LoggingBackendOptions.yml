  summary: Gets or sets the maximum length of the <xref href="PostSharp.Patterns.Diagnostics.Contexts.LoggingContext.Description" data-throw-if-not-resolved="false"></xref> property.
  remarks: >-
    <p>This property determines the size of the buffer allocated to build the <xref href="PostSharp.Patterns.Diagnostics.Contexts.LoggingContext.Description" data-throw-if-not-resolved="false"></xref> property.
        If the actual length exceeds the value of <xref href="PostSharp.Patterns.Diagnostics.LoggingBackendOptions.ContextMaxLength" data-throw-if-not-resolved="false"></xref>, no exception is thrown, and the excess content is ignored.</p>
  example: []
