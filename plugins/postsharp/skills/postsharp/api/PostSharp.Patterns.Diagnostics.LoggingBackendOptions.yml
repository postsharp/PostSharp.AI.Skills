- uid: PostSharp.Patterns.Diagnostics.LoggingBackendOptions.ContextIdGenerationStrategy
  commentId: P:PostSharp.Patterns.Diagnostics.LoggingBackendOptions.ContextIdGenerationStrategy
  id: ContextIdGenerationStrategy
  parent: PostSharp.Patterns.Diagnostics.LoggingBackendOptions
  langs:
  - csharp
  - vb
  name: ContextIdGenerationStrategy
  nameWithType: LoggingBackendOptions.ContextIdGenerationStrategy
  fullName: PostSharp.Patterns.Diagnostics.LoggingBackendOptions.ContextIdGenerationStrategy
  type: Property
  assemblies:
  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics
  summary: Gets or sets the strategy that determines how the <xref href="PostSharp.Patterns.Diagnostics.Contexts.LoggingContext.Id" data-throw-if-not-resolved="false"></xref> property is generated.
  remarks: >-
    <p>The default value is <xref href="PostSharp.Patterns.Diagnostics.ContextIdGenerationStrategy.LazyGlobal" data-throw-if-not-resolved="false"></xref>. Together with <xref href="PostSharp.Patterns.Diagnostics.LoggingBackendOptions.RootSyntheticId" data-throw-if-not-resolved="false"></xref>
        and <xref href="PostSharp.Patterns.Diagnostics.LoggingBackendOptions.SyntheticIdFormatter" data-throw-if-not-resolved="false"></xref>, this strategy determines the <xref href="PostSharp.Patterns.Diagnostics.Contexts.LoggingContext.SyntheticId" data-throw-if-not-resolved="false"></xref> property, which correlates
        records across processes. The <xref href="PostSharp.Patterns.Diagnostics.ContextIdGenerationStrategy.Global" data-throw-if-not-resolved="false"></xref> and
        <xref href="PostSharp.Patterns.Diagnostics.ContextIdGenerationStrategy.LazyGlobal" data-throw-if-not-resolved="false"></xref> strategies use one counter for the whole AppDomain
        and produce short identifiers. The <xref href="PostSharp.Patterns.Diagnostics.ContextIdGenerationStrategy.Hierarchical" data-throw-if-not-resolved="false"></xref> strategy uses a counter in the parent
        context when there is one, so the synthetic identifier of a context starts with the synthetic identifier of its parent. It produces
        longer identifiers.</p>
  example: []
  syntax:
    content: public ContextIdGenerationStrategy ContextIdGenerationStrategy { get; set; }
    parameters: []
    return:
      type: PostSharp.Patterns.Diagnostics.ContextIdGenerationStrategy
    content.vb: Public Property ContextIdGenerationStrategy As ContextIdGenerationStrategy
  overload: PostSharp.Patterns.Diagnostics.LoggingBackendOptions.ContextIdGenerationStrategy*
  seealso:
  - linkType: HRef
    linkId: '@distributed-logging'
    altText: 'Conceptual: Logging in a Distributed System'
