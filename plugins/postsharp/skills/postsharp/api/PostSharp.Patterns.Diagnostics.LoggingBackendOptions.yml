  - PostSharp.Patterns.Diagnostics
  namespace: PostSharp.Patterns.Diagnostics
  summary: Represents the options of the <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend" data-throw-if-not-resolved="false"></xref> class.
  remarks: >-
    <p>These options are run-time options. They are exposed by the <xref href="PostSharp.Patterns.Diagnostics.LoggingBackend.Options" data-throw-if-not-resolved="false"></xref> property, and each backend can expose
        a derived class with more options, for instance <xref href="PostSharp.Patterns.Diagnostics.Backends.TextLoggingBackendOptions" data-throw-if-not-resolved="false"></xref>.
        Unlike the build-time options of a <xref href="PostSharp.Patterns.Diagnostics.LoggingProfile" data-throw-if-not-resolved="false"></xref>, they are not organized into profiles: they apply to all records
        emitted through the backend.</p>
