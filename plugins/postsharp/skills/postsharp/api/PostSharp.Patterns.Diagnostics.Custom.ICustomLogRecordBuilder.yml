  type: Interface
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Diagnostics.Custom
  summary: >-
    Defines a builder of custom log records. A log record is typically, but not necessarily, a string.

    A log record can be composed of one or several items.
  remarks: >-
    <p>To implement your own type of message, implement <xref href="PostSharp.Patterns.Diagnostics.Custom.Messages.IMessage" data-throw-if-not-resolved="false"></xref> and render the message into the
        <xref href="PostSharp.Patterns.Diagnostics.Custom.ICustomLogRecordBuilder" data-throw-if-not-resolved="false"></xref> passed to the <xref href="PostSharp.Patterns.Diagnostics.Custom.Messages.IMessage.Write(PostSharp.Patterns.Diagnostics.Custom.ICustomLogRecordBuilder%2cPostSharp.Patterns.Diagnostics.Custom.CustomLogRecordItem)" data-throw-if-not-resolved="false"></xref> method.</p>
  example: []
  syntax:
    content: 'public interface ICustomLogRecordBuilder : IDisposable'
    content.vb: Public Interface ICustomLogRecordBuilder Inherits IDisposable
  seealso:
  - linkType: HRef
    linkId: '@log-custom-messages'
    altText: 'Conceptual: Writing Custom Messages'
