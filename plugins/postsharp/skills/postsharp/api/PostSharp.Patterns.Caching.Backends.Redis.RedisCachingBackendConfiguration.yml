- uid: PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.IsLocallyCached
  commentId: P:PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.IsLocallyCached
  id: IsLocallyCached
  parent: PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration
  langs:
  - csharp
  - vb
  name: IsLocallyCached
  nameWithType: RedisCachingBackendConfiguration.IsLocallyCached
  fullName: PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.IsLocallyCached
  type: Property
  assemblies:
  - PostSharp.Patterns.Caching.Backends.Redis
  namespace: PostSharp.Patterns.Caching.Backends.Redis
  summary: Gets or sets a value indicating whether a <xref href="PostSharp.Patterns.Caching.Backends.MemoryCachingBackend" data-throw-if-not-resolved="false"></xref> should be added in front of the <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackend" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>The local cache reduces the latency and the deserialization cost of cache hits. It is invalidated through events that other nodes publish
        through Redis publish/subscribe channels, and a <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackend" data-throw-if-not-resolved="false"></xref> publishes these events only when <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.SupportsEvents" data-throw-if-not-resolved="false"></xref> is <code>true</code>.
        Therefore, if one node enables this property, all nodes that share the cache must enable <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.SupportsEvents" data-throw-if-not-resolved="false"></xref>.
        Invalidation is asynchronous, so different nodes can return different values for a short time.</p>
  example: []
  syntax:
    content: public bool IsLocallyCached { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property IsLocallyCached As Boolean
  overload: PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.IsLocallyCached*
  seealso:
  - linkType: HRef
    linkId: '@caching-redis'
    altText: 'Conceptual: Using Redis Cache'
