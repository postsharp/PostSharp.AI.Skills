    <p>Cache keys are compressed by the <xref href="PostSharp.Patterns.Caching.Implementation.CacheKeyBuilder" data-throw-if-not-resolved="false"></xref>, for all backends. To compress the keys, assign
        <xref href="PostSharp.Patterns.Caching.ICachingService.KeyBuilder?text=CachingServices.DefaultService.KeyBuilder" data-throw-if-not-resolved="false"></xref> a <xref href="PostSharp.Patterns.Caching.Implementation.CacheKeyBuilder" data-throw-if-not-resolved="false"></xref> created with a <xref href="PostSharp.Patterns.Caching.Implementation.CacheKeyHashingAlgorithm" data-throw-if-not-resolved="false"></xref> and the
