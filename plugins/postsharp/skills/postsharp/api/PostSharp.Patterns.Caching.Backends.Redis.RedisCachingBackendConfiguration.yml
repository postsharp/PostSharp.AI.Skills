  name: KeyPrefix
  nameWithType: RedisCachingBackendConfiguration.KeyPrefix
  fullName: PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.KeyPrefix
  type: Property
  assemblies:
  - PostSharp.Patterns.Caching.Backends.Redis
  namespace: PostSharp.Patterns.Caching.Backends.Redis
  summary: Gets or sets the prefix for the keys of all Redis items created by the <xref href="PostSharp.Patterns.Caching.Backends.Redis.RedisCachingBackend" data-throw-if-not-resolved="false"></xref>. The default value is <code>cache</code>.
  remarks: >-
    <p>Set a value that identifies the application and the version of its data model, so that several applications or versions can share
        the same Redis database. Change the value when the serialized form of the cached data changes incompatibly.
        The value cannot contain the <code>:</code> character.</p>
  example: []
  syntax:
    content: public string KeyPrefix { get; set; }
    parameters: []
    return:
      type: System.String
    content.vb: Public Property KeyPrefix As String
