  name: AdvisableCollection<T>
  nameWithType: AdvisableCollection<T>
  fullName: PostSharp.Patterns.Collections.AdvisableCollection<T>
  type: Class
  assemblies:
  - PostSharp.Patterns.Common
  namespace: PostSharp.Patterns.Collections
  summary: A collection type similar to <xref href="System.Collections.ObjectModel.Collection%601" data-throw-if-not-resolved="false"></xref> into which advices can be injected dynamically.
  remarks: >-
    <p>The API of this class is compatible with the <xref href="System.Collections.ObjectModel.Collection%601" data-throw-if-not-resolved="false"></xref> class. It provides some additions, but preserves the same design and naming conventions.</p>

    <p>Classes that derive from <xref href="PostSharp.Patterns.Collections.AdvisableCollection%601" data-throw-if-not-resolved="false"></xref> can add functionalities by overriding protected methods or by defining new public methods.
        New public methods wrap their logic in a call of the <xref href="PostSharp.Patterns.DynamicAdvising.DynamicallyAdvisableObject.ExecuteWithAdvices%60%602(PostSharp.Patterns.Model.ObjectAccessLevel%2c%60%601%40)" data-throw-if-not-resolved="false"></xref> method,
        which applies boundary aspects. Public methods can access the data structure through protected methods, which have a name ending in <code>Item</code>, for example <xref href="PostSharp.Patterns.Collections.AdvisableCollection%601.SetItem(System.Int32%2c%600)" data-throw-if-not-resolved="false"></xref>.
        Public methods should not use other public methods of the class, because this may cause inconsistent invocation of advices and performance issues. Events (<xref href="PostSharp.Patterns.Collections.AdvisableCollection%601.PropertyChanged" data-throw-if-not-resolved="false"></xref> and <xref href="PostSharp.Patterns.Collections.AdvisableCollection%601.CollectionChanged" data-throw-if-not-resolved="false"></xref>)
        are buffered. Public methods must invoke <xref href="PostSharp.Patterns.Collections.AdvisableCollection%601.RaiseEvents" data-throw-if-not-resolved="false"></xref> to raise buffered events.</p>
    <p>Use this class instead of an array, <xref href="System.Collections.Generic.List%601" data-throw-if-not-resolved="false"></xref>, <xref href="System.Collections.ObjectModel.Collection%601" data-throw-if-not-resolved="false"></xref> or <xref href="System.Collections.ObjectModel.ObservableCollection%601" data-throw-if-not-resolved="false"></xref> in the child properties
        of classes that use patterns such as Aggregatable, Recordable or threading models. These patterns cannot extend standard collections, so they inject
        their behavior into advisable collections at run time instead. Because the interfaces that they add are not known to the compiler,
        use <xref href="PostSharp.Patterns.DynamicAdvising.DynamicAdvisingServices.QueryInterface%60%601(System.Object%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> instead of a cast to access them.</p>
    <p>A threading model synchronizes an advisable collection only after the collection is assigned to a child property of an object
        that has a threading model. The collection then uses the concurrency controller of this object. Before that, the collection is not
        thread-safe: do not access it from several threads at the same time, and do not modify it while another thread assigns it to its parent.</p>
