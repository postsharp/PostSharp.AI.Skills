  namespace: PostSharp.Reflection
  summary: >-
    Defines the semantics of a service that allows build-time code to serialize references

    to metadata objects (that is, reflection objects) in a way that is compatible with obfuscators.

    References are deserialized at run time using <xref href="PostSharp.Reflection.IMetadataDispenser" data-throw-if-not-resolved="false"></xref>.
