  summary: >-
    Root class for all constraints based on <xref href="PostSharp.Extensibility.MulticastAttribute" data-throw-if-not-resolved="false"></xref>.

    A constraint is a piece of validation logic executed at build time. Constraints

    are applied to elements of code (<xref href="System.Reflection.Assembly" data-throw-if-not-resolved="false"></xref>, <xref href="System.Type" data-throw-if-not-resolved="false"></xref>,

    <xref href="System.Reflection.MethodInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.ConstructorInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref>,

    <xref href="System.Reflection.EventInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.FieldInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Reflection.ParameterInfo" data-throw-if-not-resolved="false"></xref>)

    typically using multicast custom attributes, and verified

    at build time for every assembly using this element of code.
  remarks: >-
    <p>Derive a custom constraint from <xref href="PostSharp.Constraints.ScalarConstraint" data-throw-if-not-resolved="false"></xref> to validate the target declaration itself, or from
        <xref href="PostSharp.Constraints.ReferentialConstraint" data-throw-if-not-resolved="false"></xref> to validate how other code uses it.</p>
    <p>Override <xref href="PostSharp.Constraints.Constraint.ValidateConstraint(System.Object)" data-throw-if-not-resolved="false"></xref> to restrict the declarations to which the constraint can be applied. It is evaluated
        only when the assembly that contains the target declaration is processed. When it returns <code>false</code>, the constraint
        is not validated for this target.</p>
    <p>Multicasting a constraint to many declarations creates one constraint instance per declaration, which increases build time.</p>
  example: []
  syntax:
    content: 'public abstract class Constraint : MulticastAttribute, IConstraint'
    content.vb: Public MustInherit Class Constraint Inherits MulticastAttribute Implements IConstraint
