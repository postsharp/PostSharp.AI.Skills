  name: MethodInterceptionAspect
  nameWithType: MethodInterceptionAspect
  fullName: PostSharp.Aspects.MethodInterceptionAspect
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Aspect that, when applied on a method, intercepts invocations of this method.
  remarks: >-
    <p>Applying a <xref href="PostSharp.Aspects.MethodInterceptionAspect" data-throw-if-not-resolved="false"></xref> to a method results in the body of this method being replaced by a call to the aspect <xref href="PostSharp.Aspects.MethodInterceptionAspect.OnInvoke(PostSharp.Aspects.MethodInterceptionArgs)" data-throw-if-not-resolved="false"></xref> method of the current class. 
            The original method body is moved into a new method, which can be called by the aspect by invoking the <xref href="PostSharp.Aspects.MethodInterceptionArgs.Proceed" data-throw-if-not-resolved="false"></xref> method,
            or by using the <xref href="PostSharp.Aspects.MethodInterceptionArgs.Binding" data-throw-if-not-resolved="false"></xref> object.</p>
        <div class="NOTE"><h5>note</h5><p>
            PostSharp creates a local copy of all by-reference parameters (<code>in</code>, <code>out</code>, <code>ref</code>). This local copy is passed to the intercepted method, not the original argument.
            This may have unwanted effects on multi-threaded code, because the argument value is not changed at the same moment as before.
            It may also have unwanted effects when the aspect is applied to a P-Invoke method,
            because a by-reference parameter could represent the starting address of a larger buffer.
            </p></div>
        <p>When the target method returns a <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref>, <xref href="PostSharp.Aspects.MethodInterceptionAspect.OnInvoke(PostSharp.Aspects.MethodInterceptionArgs)" data-throw-if-not-resolved="false"></xref> intercepts only the code that creates the task,
            not the asynchronous operation it represents. To intercept the whole operation, for example to handle its exceptions or its result,
            override <xref href="PostSharp.Aspects.MethodInterceptionAspect.OnInvokeAsync(PostSharp.Aspects.MethodInterceptionArgs)" data-throw-if-not-resolved="false"></xref> and call <xref href="PostSharp.Aspects.MethodInterceptionArgs.ProceedAsync" data-throw-if-not-resolved="false"></xref>. This is called <i>semantic advising</i>;
            see the <xref href="PostSharp.Aspects.MethodInterceptionAspect.SemanticallyAdvisedMethodKinds" data-throw-if-not-resolved="false"></xref> property.</p>
        <p>
          <div class="NOTE"><h5>note</h5><p>
        All classes implementing
        <xref href="PostSharp.Aspects.IAspect" data-throw-if-not-resolved="false"></xref>
        should typically be marked as serializable
        using the 
        <xref href="System.SerializableAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.PSerializableAttribute" data-throw-if-not-resolved="false"></xref> custom attribute. Fields that
        are only used at runtime (and unknown at compile-time) should be carefully
        marked with the <xref href="System.NonSerializedAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.PNonSerializedAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.
        When another aspect serializer (such as <xref href="PostSharp.Aspects.Serialization.MsilAspectSerializer" data-throw-if-not-resolved="false"></xref>) is used,
        it is not necessary to mark the aspect class as serializable.
        For more information, see
        <a href="@aspect-serialization">Aspect Serialization</a>.
      </p></div>
        </p>
        <a href="@aspect-serialization">
      Conceptual: Understanding Aspect Serialization
    </a>
