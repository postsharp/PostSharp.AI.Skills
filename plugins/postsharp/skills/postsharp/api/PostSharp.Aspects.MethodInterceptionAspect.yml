      [MulticastAttributeUsage(MulticastTargets.Method|MulticastTargets.InstanceConstructor, AllowMultiple = true, AllowExternalAssemblies = true, PersistMetaData = false, TargetMemberAttributes = MulticastAttributes.NonAbstract)]

