- uid: PostSharp.Aspects.MethodInterceptionAspect.UnsupportedTargetAction
  commentId: P:PostSharp.Aspects.MethodInterceptionAspect.UnsupportedTargetAction
  id: UnsupportedTargetAction
  parent: PostSharp.Aspects.MethodInterceptionAspect
  langs:
  - csharp
  - vb
  name: UnsupportedTargetAction
  nameWithType: MethodInterceptionAspect.UnsupportedTargetAction
  fullName: PostSharp.Aspects.MethodInterceptionAspect.UnsupportedTargetAction
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Gets or sets the action to take when the aspect is applied to an async method with an unsupported return value type.
  remarks: >-
    <p>
        Starting with C# 7, async methods can have return types other than <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref> or <xref href="System.Threading.Tasks.Task%601" data-throw-if-not-resolved="false"></xref>.
        Async method interception does not support such async methods. By default, a build error is raised whenever
        async method interception is applied to a method that returns an awaitable type other than <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref> or <xref href="System.Threading.Tasks.Task%601" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>
        Set this property to change how unsupported async methods are handled at compile time.
        </p>
  example: []
  syntax:
    content: public UnsupportedTargetAction UnsupportedTargetAction { get; set; }
    parameters: []
    return:
      type: PostSharp.Aspects.UnsupportedTargetAction
    content.vb: Public Property UnsupportedTargetAction As UnsupportedTargetAction
  overload: PostSharp.Aspects.MethodInterceptionAspect.UnsupportedTargetAction*
