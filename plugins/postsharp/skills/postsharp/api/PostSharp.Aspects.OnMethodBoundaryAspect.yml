  name: UnsupportedTargetAction
  nameWithType: OnMethodBoundaryAspect.UnsupportedTargetAction
  fullName: PostSharp.Aspects.OnMethodBoundaryAspect.UnsupportedTargetAction
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Gets or sets the action to take when the aspect is applied to an unsupported target method.
  remarks: >-
    <p>A target method is unsupported, for example, when semantic advising is requested for a kind of method that does not support it.
        By default, PostSharp emits a build-time error. Set this property to <xref href="PostSharp.Aspects.UnsupportedTargetAction.Ignore" data-throw-if-not-resolved="false"></xref> to skip the
        target silently, or to <xref href="PostSharp.Aspects.UnsupportedTargetAction.Fallback" data-throw-if-not-resolved="false"></xref> to fall back to non-semantic advising.</p>
  example: []
  syntax:
    content: public UnsupportedTargetAction UnsupportedTargetAction { get; set; }
    parameters: []
    return:
      type: PostSharp.Aspects.UnsupportedTargetAction
    content.vb: Public Property UnsupportedTargetAction As UnsupportedTargetAction
  overload: PostSharp.Aspects.OnMethodBoundaryAspect.UnsupportedTargetAction*
  seealso:
