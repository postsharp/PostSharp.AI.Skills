  name: OnMethodBoundaryAspect
  nameWithType: OnMethodBoundaryAspect
  fullName: PostSharp.Aspects.OnMethodBoundaryAspect
  type: Class
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Aspect that, when applied to a method defined in the current assembly, inserts a piece

    of code before and after the body of these methods.
  remarks: >-
    <p>The <xref href="PostSharp.Aspects.OnMethodBoundaryAspect" data-throw-if-not-resolved="false"></xref> aspect results in the target method
            being wrapped in a <code>try</code> ... <code>catch</code> ... <code>finally</code> block. You can
            implement four advices: <xref href="PostSharp.Aspects.OnMethodBoundaryAspect.OnEntry(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>, executed at the beginning of the block;
            <xref href="PostSharp.Aspects.OnMethodBoundaryAspect.OnSuccess(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>, executed only when the method succeeds (that is, when it does not
            result in an exception); <xref href="PostSharp.Aspects.OnMethodBoundaryAspect.OnException(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>, invoked when the method results in 
            an exception; and <xref href="PostSharp.Aspects.OnMethodBoundaryAspect.OnExit(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>, always executed after method execution
            (whether the method resulted in an exception or not).</p>
        <p>Schematically, the aspect transforms the original method as follows:</p>
        <pre><code class="lang-csharp">int MyMethod(object arg0, int arg1)
    {
       OnEntry();
       try
       {
        // Original method body. 
        OnSuccess();
        return returnValue;
      }
      catch ( Exception e )
      {
        OnException();
      }
      finally
      {
        OnExit();
      }
    }</code></pre>
        <p>Note that this code is only schematic. The generated instructions are
            more complex because they have to cope with parameter boxing and control flow 
            modification, among others.
            </p>
        <p>On <code>async</code> and iterator methods, the aspect is applied by default to the code of the method as written in the source,
            not to the compiler-generated code that creates the state machine (see <xref href="PostSharp.Aspects.OnMethodBoundaryAspect.SemanticallyAdvisedMethodKinds" data-throw-if-not-resolved="false"></xref>).
            Two more advices are then available: <xref href="PostSharp.Aspects.OnMethodBoundaryAspect.OnYield(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>, invoked when the method is suspended by an <code>await</code> or
            <code>yield return</code> statement, and <xref href="PostSharp.Aspects.OnMethodBoundaryAspect.OnResume(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>, invoked when it resumes.</p>
        <p>
      An object of type
      <xref href="PostSharp.Aspects.MethodExecutionArgs" data-throw-if-not-resolved="false"></xref>
      is passed to every advice of this aspect. This object allows you to:
    </p>
        <ul><li>
            <b>Get or set arguments.</b>
        Input and output arguments are available on the property
        <xref href="PostSharp.Aspects.MethodExecutionArgs.Arguments" data-throw-if-not-resolved="false"></xref>. You can change output (<code>out</code>)
        and by-reference (<code>ref</code>)
        arguments, but not input arguments. If you need to modify arguments passed by value, consider using a
        <xref href="PostSharp.Aspects.MethodInterceptionAspect" data-throw-if-not-resolved="false"></xref>
        (see property <xref href="PostSharp.Aspects.MethodInterceptionArgs.Arguments" data-throw-if-not-resolved="false"></xref>).
      </li><li>
            <b>
          Get the current exception.
        </b>
        The current exception is available in the property <xref href="PostSharp.Aspects.MethodExecutionArgs.Exception" data-throw-if-not-resolved="false"></xref> (only from the <xref href="PostSharp.Aspects.OnMethodBoundaryAspect.OnException(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref> advice). 
        You can also replace the exception (see <xref href="PostSharp.Aspects.MethodExecutionArgs.Exception" data-throw-if-not-resolved="false"></xref> for details).
      </li><li>
            <b>
          Get or set the return value.
        </b> The return value is available in the <xref href="PostSharp.Aspects.MethodExecutionArgs.ReturnValue" data-throw-if-not-resolved="false"></xref> property. You can also modify it.
      </li><li>
            <b>
          Change the method control flow.
        </b>
        You can change the value of the
        <xref href="PostSharp.Aspects.MethodExecutionArgs.FlowBehavior" data-throw-if-not-resolved="false"></xref>
        property to specify
        whether the target method should continue to execute after the execution of the current advice. 
        This may be useful to implement a caching aspect or an exception handler.
      </li><li>
            <b>
          Share state between advices.
        </b>
        You can use the
        <xref href="PostSharp.Aspects.MethodExecutionArgs.MethodExecutionTag" data-throw-if-not-resolved="false"></xref>
        property to store state between the execution of
        different advices related to the same execution of a method. For instance, you can store a cache key in
        <xref href="PostSharp.Aspects.OnMethodBoundaryAspect.OnEntry(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>
        and retrieve it in
        <xref href="PostSharp.Aspects.OnMethodBoundaryAspect.OnSuccess(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>. Using
        <xref href="PostSharp.Aspects.MethodExecutionArgs.MethodExecutionTag" data-throw-if-not-resolved="false"></xref>
        is the only way to share state that is both thread-safe and reentrant.
      </li></ul>
        <p>
            You can apply a method boundary aspect to a method that is outside your assembly. If you do, all calls to that method
            are intercepted and replaced with calls to a new method, in your assembly, that calls the original method. When this happens,
            by-reference parameters (<code>ref</code>) undergo special treatment similar to what happens in <xref href="PostSharp.Aspects.MethodInterceptionAspect" data-throw-if-not-resolved="false"></xref>.
            </p>
        <p>
          <div class="NOTE"><h5>note</h5><p>
        All classes implementing
        <xref href="PostSharp.Aspects.IAspect" data-throw-if-not-resolved="false"></xref>
        should typically be marked as serializable
        using the 
        <xref href="System.SerializableAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.PSerializableAttribute" data-throw-if-not-resolved="false"></xref> custom attribute. Fields that
        are only used at runtime (and unknown at compile-time) should be carefully
        marked with the <xref href="System.NonSerializedAttribute" data-throw-if-not-resolved="false"></xref> or <xref href="PostSharp.Serialization.PNonSerializedAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.
        When another aspect serializer (such as <xref href="PostSharp.Aspects.Serialization.MsilAspectSerializer" data-throw-if-not-resolved="false"></xref>) is used,
        it is not necessary to mark the aspect class as serializable.
        For more information, see
        <a href="@aspect-serialization">Aspect Serialization</a>.
      </p></div>
        </p>
        <a href="@aspect-serialization">
      Conceptual: Understanding Aspect Serialization
    </a>
