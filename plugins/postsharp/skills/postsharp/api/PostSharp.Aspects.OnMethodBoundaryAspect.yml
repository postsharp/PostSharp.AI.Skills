- uid: PostSharp.Aspects.OnMethodBoundaryAspect.OnResume(PostSharp.Aspects.MethodExecutionArgs)
  commentId: M:PostSharp.Aspects.OnMethodBoundaryAspect.OnResume(PostSharp.Aspects.MethodExecutionArgs)
  id: OnResume(PostSharp.Aspects.MethodExecutionArgs)
  parent: PostSharp.Aspects.OnMethodBoundaryAspect
  langs:
  - csharp
  - vb
  name: OnResume(MethodExecutionArgs)
  nameWithType: OnMethodBoundaryAspect.OnResume(MethodExecutionArgs)
  fullName: PostSharp.Aspects.OnMethodBoundaryAspect.OnResume(PostSharp.Aspects.MethodExecutionArgs)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Method executed when a state machine resumes execution after a <code>yield return</code> or

    <code>await</code> statement.
  remarks: >-
    <p>For iterator methods, this advice is executed before the <xref href="System.Collections.IEnumerator.MoveNext" data-throw-if-not-resolved="false"></xref> method.
        However, the very first call of <xref href="System.Collections.IEnumerator.MoveNext" data-throw-if-not-resolved="false"></xref> maps to <xref href="PostSharp.Aspects.IOnMethodBoundaryAspect.OnEntry(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>In async methods, the advice is executed just after the state machine restarts execution after it has waited
        as a result of the <code>await</code> statement.</p>
  example: []
  syntax:
    content: >-
      [HasInheritedAttribute]

      public virtual void OnResume(MethodExecutionArgs args)
    parameters:
    - id: args
      type: PostSharp.Aspects.MethodExecutionArgs
      description: >-
        Event arguments specifying which method
                      is being executed and which are its arguments.
    content.vb: >-
      <HasInheritedAttribute>

      Public Overridable Sub OnResume(args As MethodExecutionArgs)
  overload: PostSharp.Aspects.OnMethodBoundaryAspect.OnResume*
  implements:
  - PostSharp.Aspects.IOnStateMachineBoundaryAspect.OnResume(PostSharp.Aspects.MethodExecutionArgs)
  attributes:
  - type: PostSharp.Extensibility.HasInheritedAttributeAttribute
    ctor: PostSharp.Extensibility.HasInheritedAttributeAttribute.#ctor
    arguments: []
- uid: PostSharp.Aspects.OnMethodBoundaryAspect.OnYield(PostSharp.Aspects.MethodExecutionArgs)
  commentId: M:PostSharp.Aspects.OnMethodBoundaryAspect.OnYield(PostSharp.Aspects.MethodExecutionArgs)
  id: OnYield(PostSharp.Aspects.MethodExecutionArgs)
  parent: PostSharp.Aspects.OnMethodBoundaryAspect
  langs:
  - csharp
  - vb
  name: OnYield(MethodExecutionArgs)
  nameWithType: OnMethodBoundaryAspect.OnYield(MethodExecutionArgs)
  fullName: PostSharp.Aspects.OnMethodBoundaryAspect.OnYield(PostSharp.Aspects.MethodExecutionArgs)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Method executed when a state machine yields, as the result of a <code>yield return</code> or

    <code>await</code> statement.
  remarks: >-
    <p>In iterator methods, this advice is executed exactly at the <code>yield return</code> statement.</p>

    <p>
        In async methods, the advice is executed just after the state machine starts waiting as a result of the <code>await</code> statement.
         If the operand of the <code>await</code> statement is an operation that completed synchronously, the state machine
        does not yield, and the <xref href="PostSharp.Aspects.IOnStateMachineBoundaryAspect.OnYield(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref> advice is not invoked.
         </p>
  example: []
  syntax:
    content: >-
      [HasInheritedAttribute]

      public virtual void OnYield(MethodExecutionArgs args)
    parameters:
    - id: args
      type: PostSharp.Aspects.MethodExecutionArgs
      description: >-
        Event arguments specifying which method
                      is being executed and which are its arguments. In iterator methods, the <xref href="PostSharp.Aspects.MethodExecutionArgs.YieldValue" data-throw-if-not-resolved="false"></xref>
                    property gives access to the operand of the <code>yield return</code> statement.
    content.vb: >-
      <HasInheritedAttribute>

      Public Overridable Sub OnYield(args As MethodExecutionArgs)
  overload: PostSharp.Aspects.OnMethodBoundaryAspect.OnYield*
  implements:
  - PostSharp.Aspects.IOnStateMachineBoundaryAspect.OnYield(PostSharp.Aspects.MethodExecutionArgs)
  attributes:
  - type: PostSharp.Extensibility.HasInheritedAttributeAttribute
    ctor: PostSharp.Extensibility.HasInheritedAttributeAttribute.#ctor
    arguments: []
