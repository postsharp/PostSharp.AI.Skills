- uid: PostSharp.Aspects.OnMethodBoundaryAspect.SemanticallyAdvisedMethodKinds
  commentId: P:PostSharp.Aspects.OnMethodBoundaryAspect.SemanticallyAdvisedMethodKinds
  id: SemanticallyAdvisedMethodKinds
  parent: PostSharp.Aspects.OnMethodBoundaryAspect
  langs:
  - csharp
  - vb
  name: SemanticallyAdvisedMethodKinds
  nameWithType: OnMethodBoundaryAspect.SemanticallyAdvisedMethodKinds
  fullName: PostSharp.Aspects.OnMethodBoundaryAspect.SemanticallyAdvisedMethodKinds
  type: Property
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: >-
    Gets or sets which target methods are advised semantically. This affects the behavior of the aspect when it is applied to

    iterator or async methods, which are compiled into state machines.
  remarks: >-
    <p>
        Semantic advising results in an aspect that is consistent with the level of abstraction of the programming language. This is the default behavior.
        You can disable semantic advising using this property to be consistent with the level of abstraction
        of MSIL and for backward compatibility with the versions of PostSharp prior to 3.1.
        </p>
    <p>
        The value is read at build time, so set it in the constructor of the aspect.
        </p>
  example: []
  syntax:
    content: protected SemanticallyAdvisedMethodKinds SemanticallyAdvisedMethodKinds { get; set; }
    parameters: []
    return:
      type: PostSharp.Aspects.SemanticallyAdvisedMethodKinds
    content.vb: Protected Property SemanticallyAdvisedMethodKinds As SemanticallyAdvisedMethodKinds
  overload: PostSharp.Aspects.OnMethodBoundaryAspect.SemanticallyAdvisedMethodKinds*
  seealso:
  - linkType: HRef
    linkId: '@semantic-advising'
    altText: 'Conceptual: Semantic Advising of Iterator and Async Methods'
- uid: PostSharp.Aspects.OnMethodBoundaryAspect.UnsupportedTargetAction
  commentId: P:PostSharp.Aspects.OnMethodBoundaryAspect.UnsupportedTargetAction
  id: UnsupportedTargetAction
  parent: PostSharp.Aspects.OnMethodBoundaryAspect
  langs:
  - csharp
