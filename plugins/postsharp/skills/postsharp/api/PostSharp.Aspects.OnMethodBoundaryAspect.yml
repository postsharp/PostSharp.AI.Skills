  fullName: PostSharp.Aspects.OnMethodBoundaryAspect.OnEntry(PostSharp.Aspects.MethodExecutionArgs)
  type: Method
  assemblies:
  - PostSharp
  namespace: PostSharp.Aspects
  summary: Method executed before the body of the methods to which this aspect is applied.
  remarks: >-
    If the aspect is applied to a constructor, the current method is invoked

    after the <code>this</code> pointer has been initialized, that is, after

    the base constructor has been called.
  example: []
  syntax:
    content: >-
      [HasInheritedAttribute]

      public virtual void OnEntry(MethodExecutionArgs args)
    parameters:
    - id: args
      type: PostSharp.Aspects.MethodExecutionArgs
      description: >-
        Event arguments specifying which method
                      is being executed, what its arguments are, and how the execution should continue
                      after the execution of <xref href="PostSharp.Aspects.IOnMethodBoundaryAspect.OnEntry(PostSharp.Aspects.MethodExecutionArgs)" data-throw-if-not-resolved="false"></xref>.
    content.vb: >-
      <HasInheritedAttribute>

      Public Overridable Sub OnEntry(args As MethodExecutionArgs)
